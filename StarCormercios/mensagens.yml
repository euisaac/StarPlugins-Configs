  Varinha entregue: '&aVarinha de &f{id} &aentregue. Esquerdo e direito marcam os cantos.'
  Canto 1: '&aPrimeiro canto em &f{x}, {y}, {z}&a.'
  Canto 2: '&aSegundo canto em &f{x}, {y}, {z}&a.'
  Area definida: '&aArea de &f{id} &adefinida: &f{area} &7({blocos} blocos).'
  Area encostada: '&cEssa area encosta no comercio &f{id}&c. Escolha outra.'
