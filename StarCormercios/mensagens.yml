    &7Escreva &f{cancelar} &7para desistir.

  Lista vazia: '&cNenhum comercio cadastrado ainda.'
  Lista cabecalho: '&e{quantidade} comercio(s):'
  Lista item: ' &f• &a{id} &7[{estado}&7] &7dono: &f{dono} &7mundo: &f{mundo} &7vence: &f{vence}'

  Historico buscando: '&7Buscando o historico de &f{id}&7...'
