  Spawn definido: '&aPonto de chegada definido onde voce esta.'
  Spawn apagado: '&7Ponto de chegada apagado.'
  Holograma definido: '&aLetreiro definido onde voce esta.'
  Holograma apagado: '&7Letreiro apagado.'
  Preco definido: '&aPreco do aluguel: &f{preco}&a.'
  Duracao definida: '&aPrazo do aluguel: &f{tempo}&a.'
  Moeda definida: '&aEste comercio passa a ser cobrado em &f{moeda} &a({preco}).'

  Digite o preco: |-
