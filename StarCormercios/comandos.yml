# ---------------------------------------------------------------------------
#  StarCormercios - os nomes dos comandos
#
#  Os nomes do plugin.yml ja funcionam sempre. O que voce escrever aqui
#  ACRESCENTA nomes -- util quando /loja ja e de outro plugin do seu servidor.
#  Separe as alternativas por "|"; a primeira e a principal.
#
#  Nos subcomandos, apagar a linha DESLIGA o subcomando: quem quiser o recurso
#  so pelo menu e so deixar em branco.
# ---------------------------------------------------------------------------
Versao do modelo: 1

comandos:
  comercios: ''
  anunciar: ''
  starcormercios: ''

subcomandos:
  buscar: 'buscar|procurar|search'
  ir: 'ir|visitar|tp'
  meus: 'meus|minhas|meu'
  armazem: 'armazem|itens|guardados'
  top: 'top|ranking|melhores'
  info: 'info|detalhes'
  ajuda: 'ajuda|help|?'

subcomandos admin:
  criar: 'criar|create|novo'
  editar: 'editar|gerenciar|menu'
  varinha: 'varinha|wand|area'
  apagar: 'apagar|deletar|remover'
  alugar: 'alugar|dar'
  desalugar: 'desalugar|tirar'
  destaque: 'destaque|destacar'
  listar: 'listar|lista|list'
  historico: 'historico|log'
  recarregar: 'recarregar|reload|rl'
  info: 'info|versao'
