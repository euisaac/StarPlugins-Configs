# ---------------------------------------------------------------------------
#  StarCormercios - as telas
#
#  Slot -1 (ou a chave apagada) desliga o botao: e assim que voce tira o
#  armazem, o ranking ou o destaque do menu sem precisar de uma opcao "Ativar"
#  para cada um.
#
#  "Slots" e a lista de casas onde o conteudo aparece; a quantidade delas e o
#  que define quantos itens cabem por pagina.
#
#  As trocas valem em todas as telas de comercio:
#    {id} {comercio} {dono} {descricao} {categoria} {preco} {moeda} {duracao}
#    {vence} {visitas} {nota} {estrelas} {avaliacoes} {estado}
#  E, onde faz sentido: {seu preco} {desconto} {auto} {favorito} {sua nota}
#  {area} {mundo} {spawn} {holograma} {preco destaque} {duracao destaque}
# ---------------------------------------------------------------------------
Versao do modelo: 1

# ---------------------------- a lista de comercios --------------------------
