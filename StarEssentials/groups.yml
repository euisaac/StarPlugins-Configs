# =========================================================
#  StarEssentials - tags no tab-list por grupo (LuckPerms/Vault)
#
#  Diferente de "tab-tags" no config.yml (que casa por permissao +
#  prioridade definidas manualmente), esse arquivo casa direto com o GRUPO
#  PRINCIPAL do jogador no seu plugin de permissao (LuckPerms,
#  PermissionsEx etc, via Vault) - o nome de cada chave abaixo precisa ser
#  exatamente o nome do grupo la (ex.: "default", "vip", "admin").
#
#  "_DEFAULT_" preenche o que faltar num grupo especifico (tagprefix ou
#  tagsuffix vazios nele), e tambem vale pra quem esta num grupo que nao
#  tem entrada aqui.
# =========================================================

ativado: false

_DEFAULT_:
  tagprefix: ""
  tagsuffix: ""

# Exemplos - troque pelos nomes reais dos seus grupos (ou apague os que nao usar).
default:
  tagprefix: "&7"
  tagsuffix: ""

vip:
  tagprefix: "&a[VIP] "
  tagsuffix: ""

admin:
  tagprefix: "&c[Admin] "
  tagsuffix: ""
