# =========================================================
#  StarEssentials - /divulgar
#
#  Uso: /divulgar <tipo> <link ou mensagem>
#  Ex.: /divulgar video https://youtube.com/...
#
#  Cada tipo em "tipos" tem sua propria permissao, mensagens, som, custo e
#  aviso no Discord. Pode criar, renomear ou apagar tipos a vontade.
#
#  Placeholders: {jogador} quem divulgou, {link} o link/mensagem enviado,
#  {tipo} o nome do tipo, e os do PlaceholderAPI (de quem divulgou).
#  Cores: & e hex (&#rrggbb).
#  No chat, <click:open_url:'{link}'>texto</click> deixa o texto clicavel e
#  <hover:show_text:texto>...</hover> mostra um texto ao passar o mouse.
#  No titulo, <nl> separa o titulo do subtitulo.
#  Para nao usar algum campo, deixe '' (vazio).
# =========================================================

# Tempo para poder divulgar de novo, em segundos (vale para todos os tipos).
# Quem tem staressentials.divulgar.bypass nao espera.
delay: 10800

# Mostra a divulgacao tambem no console do servidor.
mostrar-no-console: true

# Nos tipos com "somente-link: true", o link precisa comecar com um destes.
# Lista vazia = aceita qualquer link.
dominios-permitidos: ['https://', 'http://', 'www.']

tipos:
  video:
    # Permissao para usar este tipo ('' = todos podem)
    permissao: 'staressentials.divulgar.video'
    titulo: ''
    actionbar: '&b{jogador} &festa divulgando um video.'
    som: 'BLOCK_NOTE_BLOCK_BELL'
    chat: |

      &a&lDIVULGACAO &fde Video, feita por {jogador}:
      &f&lLink: &c<click:open_url:'{link}'>{link}</click>

    # true = so aceita um link (1 palavra); false = aceita qualquer mensagem
    somente-link: true
    # Custos para divulgar. "economia" e o id de uma moeda do economias.yml
    # ('' = a moeda padrao). Pode ter varios custos; todos sao cobrados.
    custos:
      custo1:
        economia: 'money'
        valor: 0.0

  live:
    permissao: 'staressentials.divulgar.live'
    titulo: ''
    actionbar: '&b{jogador} &festa divulgando uma live.'
    som: 'BLOCK_NOTE_BLOCK_BELL'
    chat: |

      &a&lDIVULGACAO &fde Live, feita por {jogador}:
      &f&lLink: &a<click:open_url:'{link}'>{link}</click>

    somente-link: true
    custos:
      custo1:
        economia: 'money'
        valor: 0.0

  anuncio:
    permissao: 'staressentials.divulgar.anuncio'
    titulo: ''
    actionbar: '&b{jogador} &festa anunciando.'
    som: 'BLOCK_NOTE_BLOCK_BELL'
    chat: |

      &6&lANUNCIO &fde {jogador}:
      &a {link}

    somente-link: false
    custos:
      custo1:
        economia: 'money'
        valor: 10000.0

  outro:
    permissao: 'staressentials.divulgar.outro'
    titulo: ''
    actionbar: '&b{jogador} &festa divulgando um link.'
    som: 'BLOCK_NOTE_BLOCK_BELL'
    chat: |

      &a&lDIVULGACAO &ffeita por {jogador}:
      &f&lLink: &e<click:open_url:'{link}'>{link}</click>

    somente-link: true
    custos:
      custo1:
        economia: 'money'
        valor: 0.0

  site:
    permissao: 'staressentials.divulgar.site'
    titulo: '&a&lDIVULGACAO<nl>&f{jogador} &7divulgou um site'
    actionbar: '&b{jogador} &festa divulgando um site.'
    som: 'BLOCK_NOTE_BLOCK_BELL'
    chat: |

      &a&lDIVULGACAO &fde Site, feita por {jogador}:
      &f&lLink: &e<click:open_url:'{link}'>{link}</click>

    somente-link: true
    custos:
      custo1:
        economia: 'money'
        valor: 0.0
    # Aviso num canal do Discord (qualquer tipo pode ter esta secao).
    discord:
      ativado: false
      # URL do webhook do canal (Configuracoes do canal > Integracoes > Webhooks)
      url: ''
      nome-bot: 'Divulgacao'
      # Texto fora do embed ('' = nenhum)
      conteudo: ''
      titulo: '{jogador} esta fazendo uma divulgacao!'
      # Imagem pequena do embed. {cabeca} = cabeca do jogador.
      thumbnail: '{cabeca}'
      cor: '#55FF55'
      rodape:
        texto: 'starplugins.com.br'
        imagem: ''
      # Campos do embed (pode criar quantos quiser)
      campos:
        jogador:
          em-linha: true
          titulo: 'Jogador'
          conteudo: '{jogador}'
        link:
          em-linha: true
          titulo: 'Link'
          conteudo: '{link}'
