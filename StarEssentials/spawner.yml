# =========================================================
#  StarEssentials - spawners
# =========================================================

# Usado pelo /spawner <mob> [jogador] (comando de staff pra dar um spawner
# pronto). mobs-permitidos vazio = todos os mobs sao permitidos.
mobs-permitidos: []
custo: 0.0

# Item entregue quando um jogador quebra um spawner sem silk touch (junto com
# restricoes.spawner-quebra-sem-silk-touch, no config.yml) e a chance abaixo
# da certo - um spawner do mesmo mob, pronto pra ser colocado de novo.
item:
  nome: "&eGerador de &f{mob}"
  lore:
    - ""
    - "&7Coloque para criar um spawner"
    - "&7de &f{mob}&7."

# Chances de receber o item ao quebrar sem silk touch, avaliadas na ordem -
# a primeira cuja permissao o jogador tiver e' a que vale.
chances:
  vip:
    ordem: 1
    permissao: "staressentials.spawnerbreak.vip"
    chance: 100.0
  padrao:
    ordem: 2
    permissao: ""
    chance: 25.0

