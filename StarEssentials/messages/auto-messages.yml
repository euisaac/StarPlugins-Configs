# =========================================================
#  StarEssentials - mensagens automaticas (broadcast rotativo)
#
#  Trecho clicavel no chat: <click:ACAO:valor>texto</click>
#    open_url        abre um site     <click:open_url:https://seusite.com>AQUI</click>
#    run_command     roda um comando  <click:run_command:/spawn>[Ir pro spawn]</click>
#    suggest_command escreve no chat  <click:suggest_command:/tell >[Mandar msg]</click>
#  Links soltos (https://...) ja ficam clicaveis sozinhos.
# =========================================================

ativado: true
delay-segundos: 300
embaralhar: false

mensagens:
  exemplo:
    ordem: 1
    chat:
      - ""
      - "&b&lAVISOS &fCompre plugins de qualidade em &bhttps://starplugins.com.br"
      - ""
    actionbar: ""
    title: ""
    subtitle: ""
    som: ""
    permissao-bypass: ""
    mundos-bloqueados: []
