# =========================================================
#  StarEssentials - boas-vindas na entrada do jogador
#  Placeholder disponivel em qualquer texto: %player_name%
#  (e os do PlaceholderAPI, se ele estiver no servidor)
#
#  Trechos clicaveis nas mensagens (mensagens, anuncio e festa):
#   <click:run_command:/comando>texto</click>      roda o comando ao clicar
#   <click:suggest_command:/comando >texto</click> escreve o comando no chat
#   <click:open_url:https://site.com>texto</click> abre o link
#   <hover:show_text:&aTexto do mouse>texto</hover> mostra ao passar o mouse
#  Clique e mouse podem ser juntados no mesmo trecho; <nl> quebra a linha
#  do texto do mouse. Ex.:
#   - "&fLeia as regras: <click:run_command:/regras><hover:show_text:&eClique para ler>&b&l[REGRAS]</hover></click>"
# =========================================================

# Boas-vindas normal, mostrada em toda entrada de quem ja jogou antes.
ativado: true
titulo: "&bBem-vindo(a)!"
subtitulo: "&f%player_name%"
mensagens:
  - ""
  - "&fBem-vindo(a), Ao melhor servidor &b%player_name%&f!"
  - ""

# Tudo abaixo so vale na PRIMEIRA entrada de verdade do jogador no servidor
# (Player#hasPlayedBefore() == false). Depois disso ele passa a receber a
# boas-vindas normal, acima.
primeira-vez:
  ativado: true
  titulo: "&bBem-vindo(a)!"
  subtitulo: "&f%player_name%"
  mensagens:
    - ""
    - "&b&lNOVO JOGADOR &f➤ &bSeja bem-vindo(a) &f%player_name%&b!"
    - ""

  # Anuncio mandado a TODOS os jogadores online quando alguem entra pela
  # primeira vez. Lista vazia = sem anuncio. O botao do exemplo usa o /sbv
  # (dar-boas-vindas, no fim do arquivo): quem clica da as boas-vindas no chat.
  anuncio: []
  #  - "&e&lNOVO! &fO jogador &6%player_name% &fentrou pela primeira vez no servidor!"
  #  - "<click:run_command:/sbv %player_name%><hover:show_text:&aClique para dar as boas-vindas>&a&l[DAR BOAS-VINDAS]</hover></click>"

  # Comandos rodados uma unica vez, so nessa primeira entrada (mesmo com
  # "ativado: false" acima). Cada linha pode comecar com [console] (padrao)
  # ou [jogador] (roda como o proprio jogador). Placeholders: %player_name%
  # {player}. Ex.:
  #  - "[console] kit inicial %player_name%"
  #  - "[jogador] spawn"
  comandos: []

  # Protecao de PvP para quem acabou de entrar pela primeira vez: ninguem
  # bate nele, e ele tambem nao bate em ninguem, ate o tempo acabar.
  # 0 = desligado. Placeholders: {minutos}, {tempo} (o que falta).
  protecao-pvp:
    minutos: 0
    mensagem-inicio: "&aVoce esta protegido do PvP por &f{minutos} &aminuto(s) por ser novo no servidor."
    mensagem-fim: "&eSua protecao de novato acabou: a partir de agora o PvP vale para voce."
    mensagem-atacante: "&cEsse jogador e novo no servidor e esta protegido do PvP por mais &f{tempo}&c."
    mensagem-novato-atacando: "&cVoce e novo no servidor e esta protegido do PvP: nao pode atacar jogadores por mais &f{tempo}&c."

  # "BemVindo premiado": chance de comecar uma festa de boas-vindas na
  # primeira entrada. Quem der as boas-vindas no chat (ou no /g) dentro do
  # tempo configurado concorre a uma recompensa sorteada.
  bemvindo-premiado:
    ativado: true

    # % de chance de a festa comecar nessa primeira entrada.
    chance: 30.0

    # Quanto tempo a festa dura, em segundos.
    duracao-segundos: 120

    # Esconde a mensagem de quem deu as boas-vindas no chat depois de contar.
    cancelar-mensagem: false

    # Qualquer uma dessas frases contando no chat (com ou sem mais texto
    # junto, sem diferenciar maiusculo/minusculo ou acento) conta como boas-
    # vindas. Adicione quantas variacoes quiser.
    palavras:
      - "bem vindo"
      - "bem-vindo"
      - "bemvindo"
      - "seja bem vindo"
      - "sbv"
      - "welcome"

    # Prefixos de comando de chat que tambem contam como chat normal pra
    # deteccao acima, ex.: "g" aceita "/g seja bem vindo" igual ao chat.
    canais-comando:
      - "g"

    mensagem-inicio: "&7De as boas vindas ao &f%player_name% &7valendo por %tempo%s!"
    mensagem-contou: "&aVoce deu as boas-vindas! Aguarde o fim da festa pra saber se ganhou algo."
    mensagem-ja-contou: "&7Voce ja deu as boas-vindas nesta festa."
    mensagem-fim: "&7A festa de boas-vindas acabou. &f%total% &7jogador(es) participaram."

    # Recompensa sorteada (por peso) pra cada jogador que participou.
    # A soma dos "chance" nao precisa fechar em 100 - e so um peso relativo.
    # Use %player_premiado% (ou %player_name%) no comando.
    recompensas:
      rec1:
        chance: 100
        comandos:
          - "money add %player_premiado% 5000"

# Comandos rodados em TODA entrada (inclusive a primeira), no mesmo formato
# dos de "primeira-vez.comandos" ([console] / [jogador]).
comandos-toda-entrada: []

# Espera antes de rodar os comandos de entrada, em ticks (20 = 1 segundo):
# da tempo do jogador terminar de entrar (e ir pro spawn) antes de receber kit etc.
comandos-atraso-ticks: 20

# /sbv <jogador> (ou /darboasvindas): quem usa FALA no chat a mensagem abaixo,
# como se tivesse digitado - passa pelo plugin de chat do servidor e conta no
# BemVindo premiado. Feito para ir num trecho clicavel do anuncio acima:
#   <click:run_command:/sbv %player_name%>&a&l[DAR BOAS-VINDAS]</click>
# So aceita quem entrou pela primeira vez ha pouco, e cada jogador da as
# boas-vindas uma vez so a cada novato.
dar-boas-vindas:
  ativado: true
  # O que o jogador fala. %player_name% = o novato, %jogador% = quem clicou.
  # Comecando com "/" vira comando do jogador, ex.: "/g Seja bem-vindo(a), %player_name%!"
  mensagem: "Seja bem-vindo(a), %player_name%!"
  # Por quanto tempo depois da primeira entrada o novato pode receber o /sbv.
  valido-por-segundos: 300
  mensagem-nao-novato: "&cO jogador &f%player_name% &cnao entrou pela primeira vez agora."
  mensagem-ja-deu: "&7Voce ja deu as boas-vindas a &f%player_name%&7."
  mensagem-proprio: "&cVoce nao pode dar as boas-vindas a si mesmo."
  mensagem-desativado: "&cEsse recurso esta desativado."
