# =========================================================
#  StarEssentials - aliases de comando, bloqueio e anti-spam
#  Utilize "comando|comando" para criar aliases, ex.: "gm|gamemode".
#  A chave e o nome interno do comando (case-insensitive); o primeiro
#  nome antes do "|" nao precisa repetir o nome interno.
#  Deixe o valor em branco (ex.: "Kit: ''") para desativar o comando
#  por completo - ele deixa de existir ate' o proximo /staressentials
#  reload (ou reinicio do servidor).
# =========================================================

