comandos-bloqueados: []

# Comandos com cooldown proprio, no formato "comando::segundos".
# Ex.: "pl::5" faz o /plugin (e aliases dele nao contam, so o nome digitado)
# só poder ser usado de novo depois de 5 segundos.
# bypass: staressentials.comandodelay.bypass
comandos-com-delay: []

antispam:
  ativado: true
  mensagens-repetidas-permitidas: 2
  segundos-entre-mensagens: 1
