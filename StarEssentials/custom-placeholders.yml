# =========================================================
#  StarEssentials - placeholders personalizados
#  Disponiveis como %staressentials_custom_<chave>% caso o
#  PlaceholderAPI esteja instalado.
# =========================================================

placeholders:
  discord: "discord.gg/K9snUJmmwP"
  loja: "starplugins.com.br"

  # Condicional: "de" decide. Vazio, false, no, 0 (ou placeholder de plugin
  # ausente) devolve "se-vazio"; qualquer outra coisa devolve "se-tiver"
  # ({valor} = o que o "de" deu). Ex.: %staressentials_custom_tag_clan%
  # tag_clan:
  #   de: "%starclans_tag%"
  #   se-vazio: "&7Sem clan"
  #   se-tiver: "&8[&b{valor}&8]"
