# =====================================================
#                StarLoja — Apelidos (aliases)
# =====================================================
# Apelidos de cada comando. Mude, adicione ou remova à vontade e depois use
# /starloja recarregar (ou reinicie o servidor). O NOME principal de cada comando
# (/loja, /vender, etc.) fica no plugin.yml; aqui você só mexe nos apelidos.
#
# Deixe a lista vazia ([]) para o comando não ter apelido nenhum.

loja:
  - shop
  - lojas
  - mercado

starloja:
  - sloja
  - starshop
  - adminloja

vender:
  - sell
  - vendas

vendertudo:
  - sellall
  - venderinventario

vendergui:
  - sellgui
  - venderbau

autovender:
  - autosell
  - av

shiftautovender:
  - shiftvender
  - shiftsell
