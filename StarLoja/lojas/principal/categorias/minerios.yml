# ============================================================================
#  Categoria: minerios  (loja principal)
#
#  ---------------------------------------------------------------------------
#  FORMATO DE UM ITEM
#  ---------------------------------------------------------------------------
#  Itens:
#    diamante:                      # id livre, usado nos comandos e placeholders
#      Ordem: 1                     # com Usar-ordem: true  -> 1 = primeiro da lista
#      Slot: 10                     # com Usar-ordem: false -> posicao fixa no menu
#      Permissao: ''                # permissao para usar este item
#      Max-por-compra: 0            # 0 = usa o limite do config.yml
#      Item:                        # o item em si (o que aparece e o que e entregue)
#        material: DIAMOND          # nome novo, antigo (WOOL:5) ou id numerico
#        quantidade: 1
#        nome: '&bDiamante'
#        lore: [ '&7Brilhante' ]
#        brilho: false
#        encantamentos: [ 'DURABILITY:3' ]
#        esconder: [ HIDE_ATTRIBUTES ]
#        inquebravel: false
#        modelo: 0                  # CustomModelData (1.14+)
#        cabeca: ''                 # base64, URL ou hash de textura
#        dono: ''                   # nick para cabeca de jogador
#        cor: ''                    # armadura de couro: '255,0,0'
#      Compra:
#        Ativar: true
#        Preco: 250.0               # preco por UNIDADE
#        Economia: money            # id definido em economias.yml
#        Comandos: []               # 'jogador:comando' roda como o jogador
#        Mensagem: ''               # mensagem extra ao comprar
#      Venda:
#        Ativar: true
#        Preco: 100.0
#        Economia: money
#        Comandos: []
#        Mensagem: ''
#        Comparar: MATERIAL         # MATERIAL ou EXATO
#      Cliques: {}                  # sobrescreve os cliques da categoria
#      Dinamico:                    # sobrescreve o Dinamico da categoria
#        Ativar: true
#      Lore: []                     # sobrescreve o Lore-formato da categoria
#
#  Dica: no jogo, use /starloja editor e depois Shift + clique num item
#  para editar tudo isso sem mexer no arquivo.
# ============================================================================

Nome: '&8Minérios'
Permissao: ''
Som: 'ABRIR'
Paginar: true

# Como os itens desta categoria sao posicionados:
#   true  = pela "Ordem" de cada item, nas "Slots-itens" de menus/categoria.yml
#           (mudar o layout la muda aqui junto)
#   false = pela "Slot" de cada item, posicao fixa so nesta categoria;
#           quem nao tiver Slot preenche o que sobrar de Slots-itens
Usar-ordem: true

# Icone desta categoria no menu principal da loja.
Slot: 14
Icone:
  material: DIAMOND
  nome: '&bMinérios'
  lore:
    - '&7Minérios brutos, barras e blocos.'
    - ''
    - '&6Esta categoria usa preço dinâmico:'
    - '&7quanto mais o servidor vende, menos vale.'
    - ''
    - '&7Itens: &f{itens}'
    - ''
    - '&eClique para abrir.'
  brilho: true

# ---------------------------------------------------------------------------
#  Preco dinamico PADRAO desta categoria (herdado pelos itens).
#
#  multiplicador = (Estoque / estoque atual) ^ Elasticidade
#
#  Comprar tira do estoque  -> o item VALORIZA.
#  Vender coloca no estoque -> o item DESVALORIZA.
#
#  Estoque:       volume de referencia. Quanto maior, mais devagar o preco anda.
#  Elasticidade:  forca do efeito. 0 desliga, 0.5 e suave, 1.0 e normal, 2.0 e agressivo.
#  Minimo/Maximo: limites do multiplicador (0.25 = 25% do preco base, 4.0 = 4x).
#  Recuperacao:   % do estoque que volta ao normal por minuto (0 = nunca volta).
#  Peso-venda:    o quanto uma venda mexe no estoque em relacao a uma compra.
# ---------------------------------------------------------------------------
Dinamico:
  Ativar: true
  Estoque: 2000.0
  Elasticidade: 0.85
  Minimo: 0.3
  Maximo: 3.0
  Recuperacao: 0.75
  Afetar-compra: true
  Afetar-venda: true
  Peso-venda: 1.0

# ---------------------------------------------------------------------------
#  Indice da categoria: um multiplicador extra aplicado a TODOS os itens
#  conforme o movimento total da categoria. Deixado desligado por padrao.
# ---------------------------------------------------------------------------
Dinamico-categoria:
  Ativar: false
  Estoque: 50000.0
  Elasticidade: 0.4
  Minimo: 0.7
  Maximo: 1.5
  Recuperacao: 1.0
  Afetar-compra: true
  Afetar-venda: true
  Peso-venda: 1.0

