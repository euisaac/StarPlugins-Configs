# ============================================================================
#  Categoria: blocos  (loja principal)
#
#  O formato completo de um item esta comentado em minerios.yml.
#  Aqui os itens usam Slot automatico (nao definido), entao o plugin
#  distribui nos slots livres e cria paginas se precisar.
# ============================================================================

Nome: '&8Blocos'
Permissao: ''
Som: 'ABRIR'
Paginar: true

# Como os itens desta categoria sao posicionados:
#   true  = pela "Ordem" de cada item, nas "Slots-itens" de menus/categoria.yml
#           (mudar o layout la muda aqui junto)
#   false = pela "Slot" de cada item, posicao fixa so nesta categoria;
#           quem nao tiver Slot preenche o que sobrar de Slots-itens
Usar-ordem: true

Slot: 12
Icone:
  material: GRASS_BLOCK
  nome: '&aBlocos'
  lore:
    - '&7Blocos de construção em geral.'
    - ''
    - '&7Itens: &f{itens}'
    - ''
    - '&eClique para abrir.'

# Nesta categoria o clique direito abre o menu do item em vez de vender direto.
Cliques:
  LEFT_CLICK: MENU
  RIGHT_CLICK: NEGOCIAR
  SHIFT_LEFT_CLICK: MENU
  SHIFT_RIGHT_CLICK: NEGOCIAR_INVENTARIO
  MIDDLE_CLICK: NENHUMA
  DROP: COMPRAR_QUANTIA

# Preco fixo nesta categoria.
Dinamico:
  Ativar: false

Dinamico-categoria:
  Ativar: false

