#
#  O formato completo de um item esta comentado em minerios.yml.
#  Em jogo: /starloja editor e depois Shift + clique num item.
# ============================================================================

Nome: '&8DIVERSOS'
Permissao: ''
Som: 'ABRIR'
Paginar: true

# Como os itens desta categoria sao posicionados:
#   true  = pela "Ordem" de cada item, nas "Slots-itens" de menus/categoria.yml
#           (mudar o layout la muda aqui junto)
#   false = pela "Slot" de cada item, posicao fixa so nesta categoria;
#           quem nao tiver Slot preenche o que sobrar de Slots-itens
Usar-ordem: true

# Posicao desta categoria no menu principal (/loja).
Slot: 25
