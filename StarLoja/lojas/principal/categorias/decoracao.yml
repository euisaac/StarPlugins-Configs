# ============================================================================
#  Categoria: decoracao  (loja principal)
#
#  Exemplo de categoria que usa nomes de material coloridos.
#  Em servidores 1.8 a 1.12 o plugin converte automaticamente
#  (LIME_WOOL -> WOOL:5, RED_TERRACOTTA -> STAINED_CLAY:14, e assim por diante).
#
#  Aqui os cliques foram configurados do jeito que voce pediu:
#  esquerdo compra, direito vende.
# ============================================================================

Nome: '&8Decoração'
Permissao: ''
Som: 'ABRIR'
Paginar: true

# Como os itens desta categoria sao posicionados:
#   true  = pela "Ordem" de cada item, nas "Slots-itens" de menus/categoria.yml
#           (mudar o layout la muda aqui junto)
#   false = pela "Slot" de cada item, posicao fixa so nesta categoria;
#           quem nao tiver Slot preenche o que sobrar de Slots-itens
Usar-ordem: true

Slot: 24
Icone:
  material: LIME_WOOL
  nome: '&dDecoração'
  lore:
    - '&7Lã, vidro colorido, tochas e flores.'
    - ''
    - '&7Itens: &f{itens}'
    - ''
    - '&eClique para abrir.'

Cliques:
  LEFT_CLICK: MENU
  RIGHT_CLICK: NEGOCIAR
  SHIFT_LEFT_CLICK: MENU
  SHIFT_RIGHT_CLICK: NEGOCIAR_INVENTARIO
  MIDDLE_CLICK: NENHUMA
  DROP: COMPRAR_QUANTIA

Dinamico:
  Ativar: false

Dinamico-categoria:
  Ativar: false

