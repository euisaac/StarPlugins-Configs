# ============================================================================
#  Categoria: spawners  (loja spawners)
#
#  Cada item entrega um spawner por COMANDO (StarSpawners). O campo "Libera em"
#  controla a data/hora em que o spawner fica comprável:
#     Libera em: dd/MM/yyyy-HH:mm
#  Antes da data o item aparece BLOQUEADO (lore {nao_liberado}) e a compra é
#  recusada; depois, libera sozinho. Remova a linha para liberar na hora.
# ============================================================================

Nome: '&8SPAWNERS'
Permissao: ''
Som: 'ABRIR'
Paginar: true
Usar-ordem: true

Icone:
  material: SPAWNER
  nome: '&c&lSPAWNERS'
  lore:
    - '&r'
    - '&7Geradores de monstros.'
    - '&r'
    - '&a&lCLIQUE PARA ABRIR'
  brilho: true

Itens:

  vaca:
    Ordem: 1
    # Sem "Libera em": já está liberado.
    Item:
      material: SPAWNER
      nome: '&a&lSpawner de Vaca'
      lore:
        - '&8| &7Tipo: &fVaca'
      brilho: false
    Compra:
      Ativar: true
      Preco: 500000.0
      Economia: money
      Precos-extra:
        cash: 25.0
      Comandos:
        - 'starspawners dar {jogador} COW {quantia}'
    Venda:
      Ativar: false

