dinamico:
  info: '&aMercados dinâmicos com estado salvo: &f{total}&a.'
  salvo: '&aEstado do mercado salvo. &7({total} registros)'
  item-resetado: '&aO item &f{item} &avoltou ao preço base.'
  categoria-resetada: '&aA categoria &f{categoria} &avoltou ao preço base.'
  loja-resetada: '&aA loja &f{loja} &avoltou ao preço base.'
  tudo-resetado: '&aTodos os preços dinâmicos voltaram ao valor base.'

boost:
  nenhum: '&7Nenhum'
  sorteado: '&aNovos boosts foram sorteados.'
  info-cabecalho: '&aBoosts ativos:'
  info-linha: |
    &8 » {periodo}
    &8   ↗ &aBoost: &f{boost_item} &a({boost_valor}&a)
    &8   ↘ &cDebuff: &f{debuff_item} &c({debuff_valor}&c)
    &8   Troca em: &7{tempo}
  # Anúncio no chat quando um período sorteia itens novos. Deixe '' para não anunciar.
  anuncio: |
    &r
    {periodo}
    &8 ↗ &aBoost: &f{boost_item} &a({boost_valor}&a)
    &8 ↘ &cDebuff: &f{debuff_item} &c({debuff_valor}&c)
    &r

meta:
  nenhum: '&7Nenhum'
  status-ativa: '&aAtiva'
  status-inativa: '&cInativa'
  anuncio-nova: |
    &r
    &e&lMETA DE VENDA
    &7Nova meta: vender &f{alvo}x {item}&7.
    &7Tempo: &f{tempo}&7. Todo mundo pode ajudar!
    &r
  anuncio-concluida: |
    &r
    &a&lMETA CONCLUÍDA!
    &7O servidor bateu a meta de &f{item}&7, fechada por &f{jogador}&7.
    &7Todos os itens da loja estão com &a+{boost} &7de venda por &f{tempo}&7.
    &r
  reiniciada: '&aA meta de venda foi reiniciada.'
  sorteada: '&aNovo item sorteado para a meta: &f{item}&a.'
  info: |
    &8&m--------------------------------------------
    &e&lMETA DE VENDA
    &7 Item: &f{item}
    &7 Progresso: &f{progresso}&7/&f{alvo} &8({porcentagem})
    &7 Termina em: &f{tempo}
    &7 Boost ativo: &f{boost}
