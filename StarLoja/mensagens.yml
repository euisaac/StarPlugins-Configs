  ativado: '&aModo editor &lLIGADO&a. Dê Shift + clique num item da loja para editar.'
  desativado: '&cModo editor &lDESLIGADO&c. Agora o Shift + clique compra e vende normalmente.'
  ligado: '&aligado'
  desligado: '&cdesligado'
