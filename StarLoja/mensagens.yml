  item-salvo: '&aItem &f{item} &asalvo no arquivo.'
  item-trocado: '&aItem trocado por &f{material}&a.'
  item-nao-encontrado: '&cO item &f{item} &cnão existe nessa categoria.'
  valor-invalido: '&cValor inválido.'
  confirmar-remocao: '&cDê Shift + clique para confirmar a remoção.'
  confirmar-aplicar: '&cDê Shift + clique para confirmar.'
  dinamico-aplicado: '&aRegras dinâmicas aplicadas em &f{total} &aitem(ns).'
  pedir-preco-compra: '&aDigite o novo &fpreço de compra&a. (&f-1 &apara desativar, &fcancelar &apara desistir)'
  pedir-preco-venda: '&aDigite o novo &fpreço de venda&a. (&f-1 &apara desativar, &fcancelar &apara desistir)'
  compra-desativada: '&cCompra desativada para &f{item}&c.'
  venda-desativada: '&cVenda desativada para &f{item}&c.'
  pedir-quantidade: '&aDigite a nova &fquantidade base &a(1 a 64).'
  pedir-nome: '&aDigite o novo nome do item. Use &f&&a para cores.'
  pedir-lore: '&aDigite a linha que será adicionada na lore. Use &f&&a para cores.'
  pedir-comando: '&aDigite o comando. Use &fjogador: &aantes para executar como o jogador.'
  pedir-permissao: '&aDigite a permissão necessária para usar esse item.'
