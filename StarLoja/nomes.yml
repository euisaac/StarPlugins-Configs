# ============================================================================
#  Nomes dos itens em portugues
#
#  Usado quando um item da loja NAO tem a chave "nome" configurada.
#  A ordem de prioridade do nome que aparece nas mensagens, nos boosts e na
#  meta de venda e:
#
#    1. o "nome" definido no proprio item (categorias/*.yml)
#    2. o nome desta tabela, pelo material
#    3. o nome do material formatado (ex: FLOWER_POT -> "Flower Pot")
#
#  Para traduzir um item novo, e so adicionar MATERIAL: 'Nome'.
#  Aceita cores (&a, &6...) se voce quiser dar cor por tipo de item.
# ============================================================================

