# Configuração do StarSentar
debug: true

# Número máximo de jogadores que podem ser empilhados (0 = ilimitado)
max-stack: 0

# Desativar sentar em NPCs
npc-sit: false #True para permitir

# Se true, verifica pelo GriefDefender (se instalado) se o jogador tem permissão de acesso
# (trust ACCESSOR) na claim antes de sentar na cabeça de um animal ou colocar um animal na
# cabeça - impede pegar animais/mobs no terreno de outra pessoa sem permissão. Sem o
# GriefDefender instalado, essa opção não faz nada.
verificar-terreno-proprio: true

# Ao sentar num bloco/com o /sentar, gira o corpo pra acompanhar a câmera quando o jogador olha
# pros lados, em vez de ficar travado sempre pro mesmo lado. É o ângulo (graus) que precisa girar
# antes do corpo acompanhar (evita reteleportar toda hora) - 0 desativa e mantém o corpo travado.
sentar-rotacao-angulo: 20

# Head sit configurations
# A partir da versão com correção anti-kick, sentar na cabeça / pegar / animal na cabeça
# usam o sistema nativo de passageiros do Minecraft (o assento é montado diretamente no
# alvo), então a posição e a altura da pilha são resolvidas pelo próprio jogo - não é mais
# necessário reteleportar essas entidades a cada tick (era isso que causava os kicks de anticheat).
head-sit:
  grabbed-height: 1.62      # Altura usada apenas para entidades agarradas soltas (sem passageiro), ex.: mobs
  update-interval-ticks: 10 # Intervalo em ticks da checagem de validade/limpeza (não afeta mais a suavidade do movimento)
  seat-scale: 0.15          # Escala do assento invisível (sentar na cabeça, empilhar, grab, animal na cabeça).
                            # Controla a altura de quem senta em cima: 1.0 = tamanho normal (mais alto),
                            # menor = mais baixo (ex.: 0.5). Precisa de /starsentar reload depois de mudar.

# Prefixo das mensagens
prefix: "&6&lStarSentar&r"

# Prefixo para jogadores móveis (Geyser)
mobile-prefix: "RS_"

# Tempo em segundos para ficar deitado automaticamente (0 = sem limite)
lying-duration: 5

# Configurações padrão para jogadores
defaults:
  allow-head-sit: false
  allow-sit-blocks: false
  allow-head-sit-while-flying: false
  allow-animal-head-sit: false
  allow-put-animal-on-head: false

# Configuração para o grab
grab:
  use: "LEFT" #pegue alguem na cabeça usando shift + RIGHT ou LEFT
  request-timeout: 30 # Segundos que o pedido de grab fica válido antes de expirar (quem não tem starsentar.grab.bypass precisa que o alvo aceite com /starsentar aceitar)

# Comando /pegar: pede pra carregar o jogador que está na mira. O alvo precisa aceitar
# (/pegar aceitar) - quem tem starsentar.grab.bypass pega na hora, igual ao grab por clique.
# Para soltar/descer basta uma agachada RÁPIDA (dos dois lados): segurar o shift por mais
# tempo que "toque-agachar-ms" não solta ninguém, então dá pra andar agachado carregando.
pegar:
  alcance: 5.0             # Distância máxima (blocos) do jogador que você está mirando
  toque-agachar-ms: 500    # Janela da agachada rápida que solta. Acima disso, o shift é ignorado
  cooldown-soltar-ms: 1500 # Tempo mínimo carregado antes de poder soltar (evita soltar sem querer)
  modos:
    costas:
      # preso: true  -> o carregado vira passageiro do carregador, igual ao sentar na cabeça:
      #                 acompanha sem nenhum atraso, mas fica sentado nos ombros (o Minecraft
      #                 não sabe pôr passageiro atrás de ninguém).
      # preso: false -> o assento é uma entidade solta que corre atrás do carregador na posição
      #                 abaixo (atras = blocos atrás dele, altura = a partir dos pés). Fica nas
      #                 costas de verdade, com um pequeno atraso ao andar.
      preso: true
      atras: 0.4
      altura: 0.9

# Lista de animais permitidos para sentar na cabeça
animal-whitelist:
  - COW
  - PIG
  - SHEEP
  - CHICKEN
  - HORSE
  - DONKEY
  - MULE
  - LLAMA
  - WOLF
  - CAT
  - PARROT
  - RABBIT

# Aliases (configured in plugin.yml)
aliases:
  sentar: [sit, sits]
  deitar: [lay, lays]

# Blocos onde o jogador pode sentar clicando com o direito
blocks-to-sit:
  - STONE_STAIRS
  - COBBLESTONE_STAIRS
  - OAK_STAIRS
  - SPRUCE_STAIRS
  - BIRCH_STAIRS
  - JUNGLE_STAIRS
  - ACACIA_STAIRS
  - DARK_OAK_STAIRS
  - CRIMSON_STAIRS
  - WARPED_STAIRS
  - STONE_SLAB
  - COBBLESTONE_SLAB
  - OAK_SLAB
  - SPRUCE_SLAB
  - BIRCH_SLAB
  - JUNGLE_SLAB
  - ACACIA_SLAB
  - DARK_OAK_SLAB
  - CRIMSON_SLAB
  - WARPED_SLAB
  - DEEPSLATE_BRICK_SLAB

# Blocos onde o jogador NÃO pode sentar com /sentar
non-sitable-blocks:
  - WATER
  - LAVA
  - AIR

# Mundos onde o sistema está desabilitado
disabled-worlds:
  - world_nether
  - world_the_end

