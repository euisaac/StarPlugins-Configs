#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                        StarBanco - niveis                            ║
#  ╚══════════════════════════════════════════════════════════════════════╝
#
# Crie quantos niveis quiser, com chaves numericas em ordem (1, 2, 3...). O
# primeiro e o de toda conta nova e deve ter Custo 0.
#
# Juros por faixa (regressivos): o saldo e dividido em faixas e cada faixa rende
# a propria taxa. "Ate: -1" e o resto do saldo. Ex.: com as faixas abaixo,
# 15M rendem 2% dos primeiros 10M + 1% dos 5M seguintes.
#
# Saldo maximo: 0 = sem limite. O rendimento para ao chegar nele.
# Rendimento maximo: teto do que a conta rende por pagamento (0 = sem teto).
# Desconto de taxa: pontos percentuais tirados da taxa de saque, cheque e
#   transferencia (taxa 10% com desconto 3 = 7%).
# Limite de credito: base do emprestimo (multiplicada pela faixa do score).
# Limites extras: somados aos limites por ciclo da moeda.
# Permissao: exigida para subir para o nivel (vazio = todos).

