      Slot: 18
      Material: ARROW
      Nome: '&aPagina anterior'
    Proxima:
      Slot: 26
      Material: ARROW
      Nome: '&aProxima pagina'
    Voltar:
      Slot: 22
      Material: ARROW
      Nome: '&cVoltar'

Menu de historico:
  Titulo: '&8Extrato de {dono}'
  Linhas: 6
  Slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
  # Nome e lore de cada linha. Linhas com {contraparte}, {detalhe}, {taxa} ou
  # {saldo} somem quando a informacao nao existe naquele movimento.
  Nome: '{tipo}'
  Lore:
    - ''
    - ' &7Moeda: &f{moeda}'
    - ' &7Valor: {valor}'
    - ' &7Taxa: &c{taxa}'
    - ' &7Com: &f{contraparte}'
    - ' &7Detalhe: &f{detalhe}'
    - ' &7Saldo depois: &f{saldo}'
    - ''
    - ' &8{data}'
  Tipos:
    DEPOSITO: {Material: CHEST, Nome: '&aDeposito'}
    SAQUE: {Material: HOPPER, Nome: '&eSaque'}
    PIX_ENVIADO: {Material: ENDER_PEARL, Nome: '&cPix enviado'}
    PIX_RECEBIDO: {Material: ENDER_EYE, Nome: '&aPix recebido'}
    CHEQUE_CRIADO: {Material: PAPER, Nome: '&cCheque criado'}
    CHEQUE_ATIVADO: {Material: MAP, Nome: '&aCheque ativado'}
    RENDIMENTO: {Material: GOLD_NUGGET, Nome: '&6Rendimento'}
    ACAO_COMPRA: {Material: EMERALD, Nome: '&cCompra de acoes'}
    ACAO_VENDA: {Material: EMERALD_BLOCK, Nome: '&aVenda de acoes'}
    DIVIDENDO: {Material: GOLD_INGOT, Nome: '&6Dividendos'}
    APLICACAO: {Material: IRON_BLOCK, Nome: '&cAplicacao em renda fixa'}
    RESGATE: {Material: GOLD_BLOCK, Nome: '&aResgate de renda fixa'}
    EMPRESTIMO: {Material: GOLD_INGOT, Nome: '&aEmprestimo recebido'}
    PAGAMENTO: {Material: IRON_INGOT, Nome: '&cPagamento de emprestimo'}
    MULTA: {Material: REDSTONE, Nome: '&4Multa de atraso'}
    NIVEL: {Material: NETHER_STAR, Nome: '&cSubida de nivel'}
    ADMIN_ADICIONAR: {Material: LIME_DYE, Nome: '&aCredito da staff'}
    ADMIN_REMOVER: {Material: RED_DYE, Nome: '&cDebito da staff'}
    ADMIN_SETAR: {Material: GRAY_DYE, Nome: '&7Saldo definido pela staff'}
  Vazio:
    Slot: 22
    Material: BARRIER
    Nome: '&7Nada por aqui'
    Lore:
      - ''
      - ' &7Nenhum movimento neste filtro.'
  Botoes:
    Anterior:
      Slot: 45
      Material: ARROW
      Nome: '&aPagina anterior'
      Lore: [' &7Pagina {pagina}/{paginas}']
    Proxima:
      Slot: 53
      Material: ARROW
      Nome: '&aProxima pagina'
      Lore: [' &7Pagina {pagina}/{paginas}']
    Voltar:
      Slot: 49
      Material: ARROW
      Nome: '&cVoltar'
    Moeda:
      Slot: 47
      Material: GOLD_NUGGET
      Nome: '&eMoeda: {filtro_moeda}'
      Lore:
        - ''
        - ' &eClique para trocar'
    Filtros:
      # Linhas acrescentadas ao filtro que esta ligado.
      Selecionado:
        - ''
        - ' &a&lSELECIONADO'
      Todos:
        Slot: 1
        Material: BOOK
        Nome: '&fTodos'
        Lore: [' &7{total} movimentos']
      Entradas:
        Slot: 2
        Material: LIME_DYE
        Nome: '&aEntradas'
      Saidas:
        Slot: 3
        Material: RED_DYE
        Nome: '&cSaidas'
      Transferencias:
        Slot: 5
        Material: ENDER_PEARL
        Nome: '&bPix e cheques'
      Investimentos:
        Slot: 6
        Material: EMERALD
        Nome: '&eInvestimentos e juros'
      Emprestimos:
        Slot: 7
        Material: GOLD_INGOT
        Nome: '&6Emprestimos'

