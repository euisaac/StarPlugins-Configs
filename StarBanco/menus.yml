#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                        StarBanco - menus                             ║
#  ║  Cada botao tem Slot, Material, Nome e Lore. Slot -1 esconde o       ║
#  ║  botao. Material: '{jogador}' usa a cabeca do jogador.               ║
#  ║  Os nomes de material valem de 1.8 ate 1.21 (escreva o nome novo).   ║
#  ╚══════════════════════════════════════════════════════════════════════╝
#
# Marcadores da conta, validos em quase todo menu:
#   {jogador} {nivel} {nivel_numero} {proximo_nivel} {custo_proximo} {desconto}
#   {score} {score_maximo} {limite_credito} {credito_disponivel} {divida}
#   {emprestimos} {situacao} {carteira} {aplicado} {aplicacoes}
#   {proximo_rendimento}
# Da moeda aberta no menu:
#   {moeda} {moeda_id} {banco} {mao} {rendimento_previsto} {maximo} {posicao}
#   {ciclo} e, para deposito/saque/cheque/transferencia:
#   {minimo_saque} {taxa_saque} {usos_saque} {limite_saque} (troque "saque"
#   por deposito, cheque ou transferencia)

Versao do modelo: 1

Menu principal:
  Titulo: '&8Banco'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '
  Botoes:
    Perfil:
      Slot: 4
      Material: '{jogador}'
      Nome: '&6&l{jogador}'
      Lore:
        - ''
        - ' &7Conta: {nivel}'
        - ' &7Moeda aberta: {moeda}'
        - ''
        - ' &7No banco: &a{banco}'
        - ' &7Em maos: &f{mao}'
        - ' &7Saldo maximo: &f{maximo}'
        - ' &7Posicao no top: &e{posicao}'
        - ''
        - ' &7Proximo rendimento: &f{proximo_rendimento}'
        - ' &7Previsto: &a+{rendimento_previsto}'
        - ''
        - ' &7Situacao: {situacao}'
    Depositar:
      Slot: 19
      Material: CHEST
      Nome: '&a&lDepositar'
      Lore:
        - ''
        - ' &7Guarde {moeda} &7no banco: o dinheiro'
        - ' &7guardado rende juros e nunca e perdido'
        - ' &7ao morrer.'
        - ''
        - ' &7Em maos: &f{mao}'
        - ' &7Minimo: &f{minimo_deposito}  &7Taxa: &f{taxa_deposito}%'
        - ''
        - ' &eEsquerdo &7digita o valor'
        - ' &eDireito &7deposita tudo'
    Sacar:
      Slot: 21
      Material: HOPPER
      Nome: '&e&lSacar'
      Lore:
        - ''
        - ' &7Tire {moeda} &7do banco para as maos.'
        - ''
        - ' &7No banco: &f{banco}'
        - ' &7Minimo: &f{minimo_saque}  &7Taxa: &f{taxa_saque}%'
        - ' &7Usados: &f{usos_saque}&7/&f{limite_saque} &8(renova em {ciclo})'
        - ''
        - ' &eEsquerdo &7digita o valor'
        - ' &eDireito &7saca tudo'
    Transferir:
      Slot: 23
      Material: ENDER_PEARL
      Nome: '&b&lPix'
      Lore:
        - ''
        - ' &7Envie {moeda} &7do seu banco direto'
        - ' &7para o banco de outro jogador,'
        - ' &7mesmo que ele esteja offline.'
        - ''
        - ' &7Minimo: &f{minimo_transferencia}  &7Taxa: &f{taxa_transferencia}%'
        - ' &7Usados: &f{usos_transferencia}&7/&f{limite_transferencia}'
        - ''
        - ' &eClique para transferir'
    Cheque:
      Slot: 25
      Material: PAPER
      Nome: '&f&lCheque'
      Lore:
        - ''
        - ' &7Transforme saldo do banco em um papel'
        - ' &7que qualquer um pode ativar.'
        - ''
        - ' &7Minimo: &f{minimo_cheque}  &7Taxa: &f{taxa_cheque}%'
        - ' &7Usados: &f{usos_cheque}&7/&f{limite_cheque}'
        - ''
        - ' &eClique para criar'
    Historico:
      Slot: 29
      Material: BOOK
      Nome: '&f&lExtrato'
      Lore:
        - ''
        - ' &7Tudo o que entrou e saiu da sua conta:'
        - ' &7depositos, saques, pix, cheques,'
        - ' &7juros, emprestimos e investimentos.'
        - ''
        - ' &eClique para ver'
    Nivel:
      Slot: 31
      Material: NETHER_STAR
      Nome: '&6&lNivel da conta'
      Lore:
        - ''
        - ' &7Atual: {nivel}'
        - ' &7Proximo: {proximo_nivel}'
        - ' &7Custo: &f{custo_proximo}'
        - ''
        - ' &7Niveis maiores guardam mais, rendem'
        - ' &7mais e pagam menos taxa.'
        - ''
        - ' &eClique para ver os niveis'
    Top:
      Slot: 33
      Material: DIAMOND
      Nome: '&b&lMais ricos'
      Lore:
        - ''
        - ' &7Os maiores saldos de {moeda}&7.'
        - ' &7Sua posicao: &e{posicao}'
        - ''
        - ' &eClique para ver'
    Emprestimos:
      Slot: 39
      Material: GOLD_INGOT
      Nome: '&6&lEmprestimos'
      Lore:
        - ''
        - ' &7Score: &f{score}&7/&f{score_maximo}'
        - ' &7Limite de credito: &f{limite_credito}'
        - ' &7Disponivel: &a{credito_disponivel}'
        - ' &7Devendo: &c{divida}'
        - ' &7Situacao: {situacao}'
        - ''
        - ' &eClique para abrir'
    Investimentos:
      Slot: 41
      Material: EMERALD
      Nome: '&a&lInvestimentos'
      Lore:
        - ''
        - ' &7Bolsa de valores e renda fixa.'
        - ''
        - ' &7Carteira de acoes: &f{carteira}'
        - ' &7Aplicado: &f{aplicado} &8({aplicacoes})'
        - ''
        - ' &eClique para investir'
    Moeda:
      Slot: 49
      Material: GOLD_NUGGET
      Nome: '&e&lMoeda: {moeda}'
      Lore:
        - ''
        - ' &7O menu mostra e opera {moeda}&7.'
        - ''
        - ' &eClique para trocar a moeda'
    Fechar:
      Slot: 45
      Material: BARRIER
      Nome: '&cFechar'
      Lore: []

Menu de moedas:
