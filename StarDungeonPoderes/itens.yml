# ============================================================
#  StarDungeonPoderes - itens magicos que dropam das dungeons
#
#  Campos:
#    ativo          false = nao dropa e nao funciona
#    nome           nome do item (a cor vem da raridade)
#    material       material (aceita alternativas: "ECHO_SHARD|NETHER_STAR")
#    raridade       COMUM, RARO, EPICO, LENDARIO ou MITICO (config.yml)
#    poder          poder do clique direito
#    poder-shift    poder do shift + clique direito (opcional)
#    dano           dano base por acerto (x raridade x nivel do item)
#    dano-shift     dano do poder do shift
#    recarga        segundos (recarga-shift para o shift)
#    alcance        distancia da mira / do projetil
#    descricao      texto da lore (descricao-shift para o shift)
#    drop           categorias de mob que podem dropar [mob, elite, boss]
#    peso           chance relativa entre os itens da mesma raridade
#    modelo         CustomModelData para resource pack (0 = nenhum)
#  Os outros campos sao proprios de cada poder (raio, duracao, cura...).
#
#  Poderes disponiveis: RELAMPAGO, CORRENTE, RAIO_GELO, NOVA_GELO, BOLA_FOGO,
#  CONE_CHAMAS, BURACO_NEGRO, TEMPESTADE, ALMAS, COLHER_ALMAS, NUVEM_VENENO,
#  CHUVA_METEOROS, RAIO_ESTELAR, SUPERNOVA, MISSIL_ARCANO, TOTEM_CURA,
#  ESTANDARTE, CORNETA, RELICARIO, BOLHA_TEMPO, GOLEM, LOBOS, ABELHAS,
#  FOGOS_FATUOS, OLHO, FUMACA, SINO, FENIX, DASH, SALTO, LEQUE_FANTASMA,
#  FENDA, ESTRONDO, LANCA_GELO, PASSO_SOMBRIO, GANCHO, GRANADA_ACIDA,
#  CEIFAR, MARTELO, LEVITAR
# ============================================================

