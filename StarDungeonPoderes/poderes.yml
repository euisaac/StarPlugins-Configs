# ============================================================
#  StarDungeonPoderes - poderes dos mobs de dungeon
#
#  Todo mob que nasce numa dungeon do StarDungeon (ou da Dungeon Infinita)
#  passa por aqui: o addon sorteia os poderes dele pela categoria
#  (mob, elite, boss) e pelo nivel.
#
#  Campos de cada poder:
#    ativo         liga/desliga (tambem pelo /dgpoderes poderes)
#    nome          nome mostrado no aviso de uso
#    peso          chance relativa de ser sorteado
#    categorias    [mob, elite, boss]
#    nivel-minimo  nivel do mob a partir do qual o poder pode sair
#    recarga       segundos entre um uso e outro (poder ativo)
#    alcance       distancia maxima do alvo para usar
#    chance        chance de usar quando esta pronto (0 a 1)
#    dano          multiplicador sobre o dano do mob (1.0 = dano normal)
#    sem-visao     true = usa mesmo sem ver o alvo
#  Os outros campos sao proprios de cada poder.
# ============================================================

geral:
  ativo: true
  # Dano usado quando o StarDungeon nao informa o dano do mob.
  dano-padrao: 6
  # Cada nivel do mob soma este tanto no dano dos poderes (0.01 = +1%), ate o maximo.
  escala-dano-por-nivel: 0.01
  escala-dano-maxima: 1.0
  # Forca dos poderes por categoria (multiplica o dano).
  forca:
    mob: 1.0
    elite: 1.2
    boss: 1.5
  # Duracao dos efeitos por categoria (multiplica).
  duracao:
    mob: 1.0
    elite: 1.15
    boss: 1.4
  # Segundos minimos entre dois poderes do mesmo mob.
  intervalo-entre-poderes:
    mob: 5
    elite: 3.5
    boss: 2.5
  # Distancia em que o mob procura um jogador alvo.
  alcance-busca: 20
  # Poder ativo so sai se o mob enxergar o alvo (menos os com sem-visao: true).
  exigir-visao: true
  # Particulas discretas em volta de elites e bosses com poderes (o nome do mob nao e tocado).
  aura-elite-boss: true
  # Action bar para os jogadores perto quando o mob usa um poder.
  aviso-uso:
    mob: false
    elite: true
    boss: true
    formato: "&c⚡ &f{mob} &7usou &c{poder}"

# Quantos poderes cada categoria ganha ao nascer.
#   chance: chance de ganhar poderes (mais chance-por-nivel por nivel, ate chance-maxima)
#   minimo/maximo: quantos; poder-extra-a-cada-niveis: +1 a cada N niveis; limite: teto
sorteio:
  mob:
    chance: 0.25
    chance-por-nivel: 0.01
    chance-maxima: 0.6
    minimo: 1
    maximo: 1
    poder-extra-a-cada-niveis: 25
    limite: 2
  elite:
    chance: 1.0
    minimo: 1
    maximo: 2
    poder-extra-a-cada-niveis: 20
    limite: 3
  boss:
    chance: 1.0
    minimo: 3
    maximo: 5
    poder-extra-a-cada-niveis: 15
    limite: 7

