# ==========================================================================
#  StarGuerra - textos
#
#  Mensagem vazia ('') simplesmente nao e enviada: e assim que se desliga um
#  aviso sem precisar de uma opcao "Ativar" para cada um.
#  Cores: &a, &c, ... e hex no formato &#RRGGBB.
#  {prefixo} no comeco de uma mensagem usa o prefixo de baixo.
#  Um bloco com | (varias linhas) sai linha por linha, sem prefixo.
#
#  Qualquer mensagem daqui pode ser sobrescrita por um tipo de guerra:
#  no arquivo dele, em Mensagens.<caminho> (ex.: Mensagens.Guerra.Comecou).
#
#  Variaveis que valem em toda mensagem de guerra:
#   {guerra} {tipo} {estado} {tempo} {segundos} {tempo_jogo} {jogadores}
#   {jogadores_total} {clans} {clans_total} {camarote} {apostas} {pvp}
#   {minimo_clans} {minimo_jogadores} {top1} {top1_abates} {top1_vivos}
#   {top2}... {matador1} {matador1_abates}... {rodada} {duelo} {duelo_tempo}
#  Quando a mensagem e sobre um jogador/clan: {jogador} {clan} {clan_tag}
#   {clan_nome} {vivos_clan} {membros_clan} {abates} {abates_clan}
#   {sequencia} {posicao} {colocacao}
# ==========================================================================

Versao do modelo: 1

Prefixo: '&c&lGUERRA &8- &7'

Geral:
