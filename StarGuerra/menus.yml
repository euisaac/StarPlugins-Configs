# ==========================================================================
#  StarGuerra - as telas
#
#  Material passa pelo XSeries: o mesmo nome funciona na 1.8 e na 1.21.
#  Cabeca: Material PLAYER_HEAD + Textura (hash/URL/base64) ou Dono (nick).
#
#  Cada tela tem:
#    Titulo, Linhas        Titulo (ate 32 caracteres nas versoes antigas) e altura.
#    Enfeite               O vidro do fundo.
#    Slots                 Onde o conteudo paginado aparece (tipos, clans...).
#    Itens                 Botoes fixos: Slot/Slots, Material, Textura, Dono,
#                          Nome, Lore, Brilho, Permissao, Esconder sem
#                          permissao e Acoes.
#
#  Acoes proprias:  principal | entrar | sair | camarote | apostar | tipos
#                   top [clans|jogadores|abates] | historico | info | ajuda
#                   admin | iniciar [tipo] | parar | pvp | forcardm | forcestart
#                   participantes | banimentos | recarregar | voltar | atualizar
#                   anterior | proxima | alternar | ordenar
#  Acoes gerais:    comando: <cmd> | console: <cmd> | op: <cmd> | mensagem: <texto>
#                   anuncio: <texto> | titulo: <t<nl>sub> | actionbar: <texto>
#                   som: <SOM;volume;tom> | fechar
#
#  Substituicoes em qualquer texto: {jogador} {pagina} {paginas} e todas as
#  variaveis da guerra atual ({guerra} {estado} {tempo} {jogadores} {clans}
#  {apostas} {pvp} {clan} {abates} {top1}...). Placeholders do PlaceholderAPI
#  tambem funcionam nos botoes.
#
#  No menu Principal e no Admin, os botoes com estas chaves so aparecem
#  quando fazem sentido: entrar, sair, camarote, apostar, iniciar, parar,
#  pvp, forcardm, forcestart, participantes.
# ==========================================================================

Versao do modelo: 1

# ---------------------------------------------------------------------------
