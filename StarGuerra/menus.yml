# ---------------------------------------------------------------------------
#  Tipos de guerra. Extras por tipo: {nome} {chave} {modo} {ativado}
#  {minimo_clans} {minimo_jogadores} {duracao} {inscricoes} {custo} {auto}
#  {campeao} {kit}. As linhas {descricao}, {horarios} e {acao} da lore viram
#  a descricao do tipo, a lista de horarios e o texto de acao.
# ---------------------------------------------------------------------------
Tipos:
  Titulo: '&8Tipos de guerra'
  Linhas: 4
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '
  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25 ]
  Tipo:
    Nome: '&c&l{nome}'
    Lore:
      - '&7Modo: &f{modo}'
      - '{descricao}'
      - ''
      - '&7Minimo: &f{minimo_clans} &7clans, &f{minimo_jogadores} &7jogadores'
      - '&7Duracao: &f{duracao} &8| &7Custo: &f{custo}'
      - '&7Campeao atual: &f{campeao}'
      - '&7Inicio automatico: {auto}'
      - '{horarios}'
      - ''
      - '{acao}'
    Horario: '&7 - &f{horario}'
    Acao jogador: '&eClique para ver os detalhes.'
    Acao admin: '&aClique para iniciar esta guerra.'
  Itens:
    anterior:
      Slot: 27
      Material: ARROW
      Nome: '&6Pagina anterior'
      Acoes: [ 'anterior' ]
    voltar:
      Slot: 31
      Material: BARRIER
      Nome: '&cVoltar'
      Acoes: [ 'voltar' ]
    proxima:
      Slot: 35
      Material: ARROW
      Nome: '&6Proxima pagina'
      Acoes: [ 'proxima' ]

