#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                   StarTerrenoUtil - mensagens                        ║
#  ║   Mensagem vazia ('') nao e enviada -- e assim que voce desliga um   ║
#  ║   aviso sem precisar de uma opcao no config.                         ║
#  ║   Use <nl> para quebrar linha nos titulos.                           ║
#  ╚══════════════════════════════════════════════════════════════════════╝

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

Prefixo: '&2&lTERRENOS &8» &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  Apenas jogadores: '&cSo quem esta no jogo pode usar este comando.'
  Fora de terreno: '&cVoce precisa estar dentro de um terreno.'
  Jogador nao encontrado: '&cO jogador &f{jogador} &cnunca entrou neste servidor.'
  Nao e numero: '&f{texto} &cnao e um numero valido.'
  Uso: '&cUse: &f{uso}'
  Mundo bloqueado: '&cOs terrenos nao funcionam neste mundo.'
  Ligado: '&aLigado'
  Desligado: '&cDesligado'
  Sim: '&aSim'
  Nao: '&cNao'
  Nao definido: '&7nao definido'
  Ilimitado: '&aIlimitado'
  Gratis: '&aGratis'
  Sem terreno: '&7Nenhum'

Entrada:
  Como cancelar: '&7Digite &fcancelar &7para desistir.'
  Tempo esgotado: '&cO tempo acabou e o pedido foi cancelado.'
  Cancelado: '&cVoce cancelou.'
  Nome do terreno: '&aDigite no chat o novo nome do terreno.'
  Nome do membro: '&aDigite no chat o nome de quem voce quer adicionar.'
  Preco do terreno: '&aDigite no chat o preco do terreno.'
  Mensagem de entrada: '&aDigite no chat a mensagem de quem entra no terreno.'
  Mensagem de saida: '&aDigite no chat a mensagem de quem sai do terreno.'

# O que aparece ao entrar e ao sair. Se o dono do terreno escreveu a mensagem
# dele pelo menu, a dele tem preferencia.
Aviso:
  Entrada: '&aTerreno de &f{jogador}<nl>&7{terreno}'
  Saida: '&cVoce saiu do terreno de &f{jogador}'

Terreno:
  Apenas o dono: '&cSo o dono do terreno pode fazer isso.'
  Sem suporte: '&cO &f{provedor} &cnao tem esse recurso.'
  Falhou: '&cNao foi possivel completar essa acao.'
  Nome alterado: '&aO terreno agora se chama &f{terreno}&a.'
  Home fora: '&cVoce precisa estar dentro do terreno para definir a entrada dele.'
  Home definida: '&aEntrada do terreno definida em &fX:{x} Y:{y} Z:{z}&a.'
  Icone alterado: '&aIcone do terreno alterado para &f{icone}&a.'
  Aviso alterado: '&aAviso de entrada: {estado}&a.'
  PvP alterado: '&aPvP noturno do terreno: {estado}&a.'
  Voo alterado: '&aVoo no terreno: {estado}&a.'
  Apagado: '&aO terreno &f{terreno} &afoi apagado.'
  No limite: '&cVoce ja atingiu o limite de &f{limite} &cterrenos.'
  Sem terrenos: '&cVoce ainda nao tem nenhum terreno.'
  Jogador sem terrenos: '&cEsse jogador nao tem terrenos.'
  Info: |

    &2&l▬▬▬▬▬▬▬▬ TERRENO ▬▬▬▬▬▬▬▬
    &7 ⤷ Nome: &f{terreno}
    &7 ⤷ Dono: &f{dono}
    &7 ⤷ Tipo: &f{tipo}
    &7 ⤷ Mundo: &f{mundo}
    &7 ⤷ Area: &f{area} &7blocos
    &7 ⤷ Membros: &f{membros}
    &7 ⤷ A venda: &f{venda}
    &8Protegido pelo {provedor}

Membros:
  Adicionado: '&a{jogador} &aagora tem acesso ao seu terreno.'
  Removido: '&aVoce tirou &f{jogador} &ado seu terreno.'
  Nivel alterado: '&f{jogador} &aagora e &f{nivel}&a no terreno.'
  E o dono: '&cO dono do terreno ja tem acesso a tudo.'
  Nao e membro: '&f{jogador} &cnao tem acesso a este terreno.'
  Nivel invalido: '&cNivel invalido. Os desse servidor sao: &f{niveis}'

Venda:
  Anunciado: '&aTerreno &f{terreno} &aanunciado por &f{valor}&a.'
  Cancelada: '&aO terreno &f{terreno} &asaiu da vitrine.'
  Comprado: '&aVoce comprou o terreno &f{terreno} &ade &f{jogador} &apor &f{valor}&a.'
  Vendido: '&aVoce vendeu o terreno &f{terreno} &apara &f{jogador} &apor &f{valor}&a.'
  Falhou: '&cNao foi possivel completar a negociacao.'
  Preco invalido: '&cO preco precisa ficar entre &f{minimo} &ce &f{maximo}&c.'
  Nao esta a venda: '&cEste terreno nao esta a venda.'
  Terreno proprio: '&cVoce ja e o dono deste terreno.'
  Sem suporte: '&cO &f{provedor} &cnao deixa passar terreno de um dono para outro.'
  Aviso no chat: '&f{jogador} &aanunciou o terreno &f{terreno} &apor &f{valor}&a! &7(/terrenos venda)'

Economia:
  Sem saldo: '&cVoce precisa de &f{valor} &cpara isso.'
  Pagou: '&7Foram debitados &f{valor}&7.'

Teleporte:
  Aguarde: '&aTeleportando em &f{segundos} &asegundos. Nao se mova.'
  Contagem: '&aTeleportando em &f{segundos}&a...'
  Cancelado: '&cTeleporte cancelado.'
  Concluido: '&aVoce chegou ao terreno.'
  Sem destino: '&cEste terreno nao tem para onde teleportar.'
  Gratis: '&aGratis'

Voo:
  Ligado: '&aVoo liberado neste terreno.'
  Desligado ao sair: '&cVoce saiu do terreno e o voo foi desligado.'

Bandeiras:
  Padrao: '&7Padrao do servidor'
  Permitido: '&aPermitido'
  Bloqueado: '&cBloqueado'
  Alterada: '&aBandeira &f{bandeira} &aagora esta: {estado}&a.'
  Falhou: '&cNao foi possivel alterar a bandeira &f{bandeira}&c.'

Blocos:
  Comprou: '&aVoce comprou &f{quantidade} &ablocos de terreno por &f{valor}&a.'
  Vendeu: '&aVoce vendeu &f{quantidade} &ablocos de terreno por &f{valor}&a.'
  Sem blocos: '&cVoce nao tem &f{quantidade} &cblocos livres para vender.'
  Falhou: '&cNao foi possivel mexer nos seus blocos de terreno.'

Mensagens:
  Alterada: '&aMensagem definida: &f{texto}'
  Apagada: '&aMensagem apagada.'

PvP:
  So de noite: '&cO PvP nos terrenos so vale a noite.'
  Anoiteceu:
    Chat: '&8[&c☽ Noite&8] &7A noite chegou e o PvP dos terrenos esta &cativo&7!'
    Titulo: '&c☽ Noite<nl>&7O PvP dos terrenos esta ativo.'
    Barra: '&c☽ Noite &7- PvP ativo nos terrenos!'
  Amanheceu:
    Chat: '&8[&e☀ Dia&8] &7O sol nasceu e o PvP dos terrenos esta &adesligado&7!'
    Titulo: '&e☀ Dia<nl>&7O PvP dos terrenos esta desligado.'
    Barra: '&e☀ Dia &7- PvP desligado nos terrenos!'

# Os niveis de confianca, do menor para o maior poder. Os cinco primeiros sao do
# GriefDefender; MEMBRO e CONFIAVEL aparecem nos outros plugins de terreno.
Niveis:
  ACESSO: '&7Visitante'
  RESIDENTE: '&aMorador'
  BAU: '&eBaus'
  CONSTRUTOR: '&bConstrutor'
  GERENTE: '&6Gerente'
  MEMBRO: '&aMembro'
  CONFIAVEL: '&bConfiavel'

Tipos:
  BASICO: '&aTerreno'
  CIDADE: '&6Cidade'
  SUBTERRENO: '&bSubterreno'
  ADMINISTRATIVO: '&cAdministrativo'

Abas:
  Meus: 'Meus terrenos'
  Amigos: 'Terrenos de amigos'
  Venda: 'A venda'

Admin:
  Recarregado: '&aConfiguracoes recarregadas.'
  Salvo: '&aDados enviados para o banco.'
  Blocos dados: '&f{jogador} &arecebeu &f{quantidade} &ablocos de terreno.'
  Limpeza: '&a{quantidade} terrenos que nao existem mais sairam do banco.'
  Transferido: '&aO terreno &f{terreno} &aagora e de &f{jogador}&a.'
  Recebeu terreno: '&aVoce recebeu o terreno &f{terreno}&a.'
  Info: |

    &2&l▬▬▬▬▬▬▬▬ STAR TERRENO UTIL ▬▬▬▬▬▬▬▬
    &7 ⤷ Versao: &f{versao}
    &7 ⤷ Plugin de terrenos: &f{provedor}
    &7 ⤷ Banco de dados: &f{banco}
    &7 ⤷ Terrenos personalizados: &f{registros}
    &7 ⤷ Niveis: &f{niveis}
    &7 ⤷ Recursos ligados: &f{recursos}

Ajuda:
  Jogador: |

    &2&l▬▬▬▬▬▬▬▬ TERRENOS ▬▬▬▬▬▬▬▬
    &a/terreno &7- abre o menu do terreno
    &a/terrenos &7- lista os terrenos
    &a/terreno info &7- dados do terreno
    &a/terreno ir <jogador> &7- vai ate o terreno de alguem
    &a/terreno home &7- vai ate o seu terreno
    &a/terreno sethome &7- define a entrada do terreno
    &a/terreno membros &7- quem mora com voce
    &a/terreno adicionar <jogador> [nivel]
    &a/terreno remover <jogador>
    &a/terreno nome <texto> &7- renomeia o terreno
    &a/terreno vender <preco> &7- anuncia o terreno
    &a/terreno cancelarvenda &7- tira o anuncio
    &a/terreno comprar &7- compra o terreno anunciado
    &a/terreno voo &7- liga o voo no terreno
    &a/terreno bandeiras &7- regras do terreno
    &a/terreno blocos &7- compra blocos de terreno
    &a/terreno apagar &7- apaga o terreno

  Admin: |

    &2&l▬▬▬▬▬▬▬▬ ADMIN ▬▬▬▬▬▬▬▬
    &a/starterrenoutil info &7- diagnostico do plugin
    &a/starterrenoutil recarregar &7- recarrega os arquivos
    &a/starterrenoutil salvar &7- grava o que esta na memoria
    &a/starterrenoutil blocos <jogador> <n> &7- da blocos de terreno
    &a/starterrenoutil limpar &7- tira do banco terrenos que sumiram
    &a/starterrenoutil transferir <jogador> &7- passa o terreno adiante
