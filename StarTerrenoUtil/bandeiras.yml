#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                  StarTerrenoUtil - bandeiras                         ║
#  ║   As regras que o dono do terreno liga e desliga no menu.            ║
#  ║   Funciona com GriefDefender (os outros plugins de terreno nao       ║
#  ║   expoem bandeiras por terreno, e o botao nem aparece).              ║
#  ╚══════════════════════════════════════════════════════════════════════╝
#
#  Cada bandeira tem tres estados no menu:
#    padrao do servidor  →  permitido  →  bloqueado  →  padrao ...
#  O clique direito volta direto para o padrao, e voltar ao padrao nunca custa
#  dinheiro.
#
#  Campos:
#    Id        uma bandeira do GriefDefender
#    Ids       varias de uma vez (o botao liga e desliga todas juntas)
#    Material  o item no menu
#    Nome      o titulo do item
#    Lore      a descricao ({bandeira} {estado} {custo})
#    Permissao quem nao tiver ve o item, mas nao consegue mexer (vazio = todos)
#    Custo     preco desta bandeira; tire a linha para usar o custo do config
#
#  A lista das bandeiras do GriefDefender esta na documentacao dele; os ids
#  usados aqui sao os mais pedidos. Pode apagar, renomear e acrescentar a
#  vontade -- este arquivo e seu, o plugin nao repoe o que voce tirar.
#

Bandeiras:

  Explosoes:
    Ids:
      - 'explosion-block'
      - 'explosion-entity'
    Material: 'TNT'
    Nome: '&c&lEXPLOSOES'
