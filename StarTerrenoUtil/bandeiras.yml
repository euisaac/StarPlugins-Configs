      - '&7estragando o seu terreno.'
      - ''
      - '&7 ⤷ Agora: {estado}'
      - '&7 ⤷ Custo: &f{custo}'
      - ''
      - '&aCLIQUE &fpara alternar'
      - '&eCLIQUE DIREITO &fpara voltar ao padrao'

