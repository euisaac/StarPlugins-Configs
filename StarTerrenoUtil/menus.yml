#
#  Marcadores que valem em qualquer tela de terreno:
#    {terreno} {dono} {tipo} {mundo} {area} {membros} {subterrenos}
#    {venda} {preco} {voo} {pvp} {aviso} {x} {y} {z}
#    {mensagem_entrada} {mensagem_saida} {provedor} {jogador}
#    {blocos_restantes} {blocos_totais} {limite} {meus_terrenos}
#

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

#
# ═══════════════════════════  MENU DO TERRENO  ══════════════════════════════
#
Menu do terreno:
  Titulo: '&8Terreno de {dono}'
  Linhas: 5

  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  Botoes:
    Informacoes:
      Slot: 10
      Material: 'PAPER'
      Nome: '&a&lINFORMACOES'
      Lore:
        - '&7Tudo sobre este terreno.'
        - ''
        - '&7 ⤷ Nome: &f{terreno}'
        - '&7 ⤷ Dono: &f{dono}'
        - '&7 ⤷ Tipo: &f{tipo}'
        - '&7 ⤷ Mundo: &f{mundo}'
        - '&7 ⤷ Area: &f{area} blocos'
        - ''
        - '&aCLIQUE &fpara mudar o nome'

    Membros:
      Slot: 12
      Material: 'BOOK'
      Nome: '&a&lMEMBROS'
      Lore:
        - '&7Quem pode entrar e mexer'
        - '&7no seu terreno.'
        - ''
        - '&7 ⤷ Membros: &f{membros}'
        - ''
        - '&aCLIQUE &fpara gerenciar'

    Venda:
      Slot: 14
      Material: 'EMERALD'
      Nome: '&a&lVENDER'
      Lore:
        - '&7Anuncie seu terreno para os'
        - '&7outros jogadores do servidor.'
        - ''
        - '&7 ⤷ A venda: &f{venda}'
        - '&7 ⤷ Preco: &f{preco}'
        - ''
        - '&aCLIQUE &fpara abrir'

    Teleporte:
      Slot: 16
      Material: 'ENDER_PEARL'
      Nome: '&a&lTELEPORTAR'
      Lore:
        - '&7Va direto para a entrada'
        - '&7deste terreno.'
        - ''
        - '&7 ⤷ Local: &fX:{x} Y:{y} Z:{z}'
        - ''
        - '&aCLIQUE &fpara teleportar'

    Voo:
      Slot: 20
      Material: 'FEATHER'
      Nome: '&a&lVOO'
      Lore:
        - '&7Deixe voce e seus membros'
        - '&7voarem dentro do terreno.'
        - ''
        - '&7 ⤷ Voo: {voo}'
        - ''
        - '&aCLIQUE &fpara alternar'

    Home:
      Slot: 22
      Material: 'OAK_DOOR'
      Nome: '&a&lENTRADA DO TERRENO'
      Lore:
        - '&7Define onde cai quem'
        - '&7teleporta para ca.'
        - ''
        - '&7 ⤷ Local: &fX:{x} Y:{y} Z:{z}'
        - ''
        - '&aCLIQUE &fno lugar onde voce esta'

    Icone:
      Slot: 24
      Material: 'ITEM_FRAME'
      Nome: '&a&lICONE'
      Lore:
        - '&7Escolha a cara do seu terreno'
        - '&7nas listas do servidor.'
        - ''
        - '&aCLIQUE &fpara escolher'

    Bandeiras:
      Slot: 29
      Material: 'REDSTONE_TORCH'
      Nome: '&a&lBANDEIRAS'
      Lore:
        - '&7As regras do terreno: explosao,'
        - '&7fogo, mobs, dano e mais.'
        - ''
        - '&aCLIQUE &fpara abrir'

    Mensagens:
      Slot: 31
      Material: 'PAINTING'
      Nome: '&a&lMENSAGENS'
      Lore:
        - '&7O recado que aparece para'
        - '&7quem entra e quem sai.'
        - ''
        - '&7 ⤷ Entrada: &f{mensagem_entrada}'
        - '&7 ⤷ Saida: &f{mensagem_saida}'
        - ''
        - '&aCLIQUE &fpara abrir'

    Aviso:
      Slot: 33
      Material: 'NAME_TAG'
      Nome: '&a&lAVISO DE ENTRADA'
      Lore:
        - '&7Mostrar o nome do terreno para'
        - '&7quem entra nele.'
        - ''
        - '&7 ⤷ Aviso: {aviso}'
        - ''
        - '&aCLIQUE &fpara alternar'

    PvP:
      Slot: 38
      Material: 'IRON_SWORD'
      Nome: '&c&lPVP NOTURNO'
      Lore:
        - '&7Deixar o PvP valer neste'
        - '&7terreno durante a noite.'
        - ''
        - '&7 ⤷ PvP: {pvp}'
        - ''
        - '&aCLIQUE &fpara alternar'

    Blocos:
      Slot: 40
      Material: 'GRASS_BLOCK'
      Nome: '&a&lBLOCOS DE TERRENO'
      Lore:
        - '&7Compre mais espaco para'
        - '&7proteger seu terreno.'
        - ''
        - '&7 ⤷ Livres: &f{blocos_restantes}'
        - '&7 ⤷ Totais: &f{blocos_totais}'
        - ''
        - '&aCLIQUE &fpara abrir'

    Subterrenos:
      Slot: 42
      Material: 'CHEST'
      Nome: '&b&lSUBTERRENOS'
      Lore:
        - '&7As divisoes dentro deste'
        - '&7terreno, cada uma com as'
        - '&7proprias regras.'
        - ''
        - '&7 ⤷ Divisoes: &f{subterrenos}'
        - ''
        - '&aCLIQUE &fpara abrir'

    Comprar:
      Slot: 4
      Material: 'GOLD_INGOT'
      Nome: '&6&lCOMPRAR TERRENO'
      Lore:
        - '&7Este terreno esta a venda.'
        - ''
        - '&7 ⤷ Dono: &f{dono}'
        - '&7 ⤷ Preco: &f{preco}'
        - ''
        - '&aCLIQUE &fpara comprar'

    Apagar:
      Slot: 44
      Material: 'BARRIER'
      Nome: '&c&lAPAGAR TERRENO'
      Lore:
        - '&7Tira a protecao deste terreno'
        - '&7para sempre.'
        - ''
        - '&cCLIQUE &fpara apagar'

    Lista:
      Slot: 36
      Material: 'COMPASS'
      Nome: '&a&lMEUS TERRENOS'
      Lore:
        - '&7 ⤷ Terrenos: &f{meus_terrenos}&7/&f{limite}'
        - ''
        - '&aCLIQUE &fpara ver a lista'

    Fechar:
      Slot: 8
      Material: 'BARRIER'
      Nome: '&c&lFECHAR'
      Lore: []

