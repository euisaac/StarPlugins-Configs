# ------------------------------------------------------------------------
#  Categorias do filtro de pedidos e da tela de escolher item.
#
#  A categoria de um pedido e decidida UMA VEZ, quando ele e criado, e fica
#  guardada com o pedido -- mexer nesta lista nao mexe no que ja existe.
#
#  A ordem manda: vale a PRIMEIRA categoria cuja lista casar com o material.
#  Os nomes aceitam curinga: *_LOG, DIAMOND_*, *SWORD*. E @BLOCO casa com
#  qualquer material que seja bloco.
#  O nome de cada categoria e o que aparece no botao de filtro.
# ------------------------------------------------------------------------

# Nao mexa: o plugin usa este numero para saber se o seu arquivo ficou para
# tras depois de uma atualizacao.
Versao do modelo: 1

# Categoria de sobra: recebe tudo que nao casar com nenhuma lista.
Categoria padrao: OUTROS

