# ==========================================================================
#  StarPedidos - textos
#
#  Mensagem vazia ('') simplesmente nao e enviada: e assim que se desliga um
#  aviso sem precisar de uma opcao "Ativar" para cada um.
#  Cores: &a, &c, ... e hex no formato &#RRGGBB.
#  {prefixo} no comeco de uma mensagem usa o prefixo de baixo.
# ==========================================================================

Versao do modelo: 1

Prefixo: '&6&lPEDIDOS &8- &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  So jogador: '&cEste comando so funciona dentro do jogo.'
  Jogador nao encontrado: '&cO jogador &f{jogador} &cnunca entrou neste servidor.'
  Numero invalido: '&cO valor &f{valor} &cnao e um numero valido.'
  Comando desconhecido: '&cO subcomando &f{comando} &cnao existe. Use &f/pedidos ajuda&c.'
  Carregando: '&7Buscando os pedidos...'
  Banco indisponivel: '&cO banco de dados nao esta respondendo; tente de novo em instantes.'

# Textos curtos usados nos menus e nas listagens.
Etiquetas:
  Todas: 'Todas'
  Nenhum: '&7Nenhum'
  Sem encantamento: 'Sem encantamento'
  Voce: 'Voce'
  Ligado: '&aligadas'
  Desligado: '&cdesligadas'
  Trancado: '&ctrancados'
  Destrancado: '&aliberados'
  # Unidades do tempo restante ("6d 3h", "45min").
  Dia: 'd'
  Hora: 'h'
  Minuto: 'min'
  Segundo: 's'
  # Como o encantamento aparece no nome do item: "Espada de Diamante (Afiacao V, Inquebravel III)".
  Formato do encantamento: '{encantamento} {nivel}'
  Separador de encantamentos: ', '
  Abre encantamentos: ' &7('
  Fecha encantamentos: '&7)'

# Nomes das ordenacoes e categorias mostrados nos botoes.
Ordenacao:
  MAIS_PAGOS: 'Mais pagos'
  MAIS_ENTREGUES: 'Mais entregues'
  RECENTES: 'Adicionados recentemente'
  MAIOR_VALOR_POR_ITEM: 'Maior valor por item'
  A_Z: 'A-Z'
  Z_A: 'Z-A'
  MAIOR_PRECO: 'Maior preco'
  MENOR_PRECO: 'Menor preco'

Entrada:
  Quantidade: '&eDigite no chat a &fquantidade &ede itens do pedido.'
  Preco: '&eDigite no chat o &fpreco por item&e. Aceita abreviacao: &f1.5k&e, &f600m&e.'
  Pesquisa: '&eDigite no chat o que voce quer &fpesquisar&e.'
  Quantidade da entrega: '&eDigite no chat &fquantos &evoce quer entregar (voce tem &f{tem}&e).'
  Como cancelar: '&7Digite &ccancelar &7para desistir.'
  Cancelado: '&cOperacao cancelada.'
  Tempo esgotado: '&cO tempo para responder acabou.'

Pedido:
  Criado: '{prefixo}&aVoce criou um pedido de &f{quantidade}x {item} &apor &f{preco} &acada (total &f{total}&a).'
  Anuncio: '&6{jogador} &fcriou um pedido de &7x{quantidade} {item} &fpor &a{preco} &fcada. Use &e/pedidos &fpara entregar.'
  Trancado: '&cA criacao de pedidos esta trancada no momento.'
  Limite: '&cVoce ja tem &f{limite} &cpedidos abertos, que e o seu limite.'
  Sem dinheiro: '&cVoce nao tem &f{total} &cpara pagar este pedido.'
  Total minimo: '&cO total do pedido precisa ser de pelo menos &f{minimo}&c.'
  Total maximo: '&cO total do pedido nao pode passar de &f{maximo}&c.'
  Preco minimo: '&cO preco por item precisa ser de pelo menos &f{minimo}&c.'
  Preco maximo: '&cO preco por item nao pode passar de &f{maximo}&c.'
  Quantidade invalida: '&cA quantidade precisa ser um numero inteiro entre 1 e {maximo}.'
  Item bloqueado: '&cEste item nao pode ser pedido.'
  Nao existe mais: '&cEste pedido nao existe mais.'
  Expirado: '&cEste pedido ja expirou e nao aceita mais entregas.'
  Completo: '&aEste pedido ja recebeu tudo o que precisava.'
  Proprio: '&cVoce nao pode entregar no seu proprio pedido.'
  Nada para entregar: '&cVoce nao tem nenhum &f{item} &cque sirva para este pedido.'
  Entregou: '{prefixo}&aVoce entregou &f{quantidade}x {item} &ae recebeu &f{valor}&a.'
  Entregue parcial: '&eSo &f{quantidade} &ecabiam no pedido; o resto voltou para voce.'
  Entrega recusada: '&cO pedido mudou enquanto voce entregava; os itens voltaram para voce.'
  Coletou: '{prefixo}&aVoce coletou &f{quantidade}x {item}&a.'
  Nada para coletar: '&cNao ha nada para coletar neste pedido.'
  Sem espaco: '&cLibere espaco no inventario para coletar.'
  Descartou: '{prefixo}&cVoce descartou &f{quantidade}x {item}&c.'
  Cancelado: '{prefixo}&aPedido cancelado. &f{valor} &avoltaram para a sua conta.'
  Encerrado: '{prefixo}&aPedido encerrado e tirado da sua lista.'
  Cancelar com itens: '&cColete os itens entregues antes de cancelar este pedido.'
  Pagamento falhou: '&cNao foi possivel pagar; avise a equipe. (pedido #{id})'
  Devolvido ao expirar: '{prefixo}&eSeu pedido de &f{item} &eexpirou: &f{valor} &evoltaram para a sua conta.'

Notificacoes:
  Entrega recebida: '{prefixo}&aVoce recebeu &f{quantidade}x {item} &ade &f{jogador}&a. Colete em &f/pedidos meus&a.'
  Para coletar: '{prefixo}&eVoce tem &f{quantidade} &epedido(s) com itens para coletar! Use &f/pedidos meus&e.'
  Alternou: '{prefixo}&7Notificacoes de pedidos {estado}&7.'
  Nao pode desligar: '&cAs notificacoes nao podem ser desligadas neste servidor.'

Administracao:
  Recarregado: '{prefixo}&aConfiguracoes recarregadas. &7({itens} item(ns) no catalogo, {pedidos} pedido(s))'
  Trancou: '{prefixo}&7Pedidos novos agora estao {estado}&7.'
  Debug: '{prefixo}&7Debug {estado}&7.'
  Adicionado: '{prefixo}&aItem &f{id} &aadicionado ao catalogo por &f{preco}&a.'
  Removido: '{prefixo}&aItem &f{id} &aremovido do catalogo.'
  Preco alterado: '{prefixo}&aPreco de &f{id} &aagora e &f{preco}&a.'
  Item invalido: '&cSegure o item na mao para adiciona-lo.'
  Id invalido: '&cUse so letras, numeros e _ no id.'
  Nao encontrado: '&cNao existe &f{id} &cno catalogo.'
  Pedido cancelado: '{prefixo}&aPedido #{id} de &f{jogador} &acancelado; &f{valor} &adevolvidos.'
  Pedido nao cancelado: '&cO pedido #{id} nao pode ser cancelado (nao existe ou tem itens para coletar).'
  Cabecalho info: '&8&m--------&r &6&lSTARPEDIDOS &8&m--------'
  Linha info: '&8- &f{chave}&7: &e{valor}'
  Cabecalho lista: '&8&m--------&r &6&lPEDIDOS DE {jogador} &8&m--------'
  Linha lista: '&8- &e#{id} &f{quantidade}x {item} &7({entregue} entregues, {coletado} coletados) &8{estado}'
  Lista vazia: '&7Nenhum pedido.'
  Rodape: '&8&m----------------------------------------'

Ajuda:
  Cabecalho: '&8&m--------&r &6&lSTARPEDIDOS &8&m--------'
  Linha: '&6/{comando} &8- &f{descricao}'
  Rodape: '&8&m----------------------------------'
  Pedidos: 'Abre a lista de pedidos'
  Meus: 'Seus pedidos e itens para coletar'
  Novo: 'Cria um pedido novo'
  Notificacoes: 'Liga/desliga os avisos de pedidos'
  Pesquisar: 'Abre a lista ja pesquisando o item'

