# ==========================================================================
#  StarPedidos - catalogo de itens e precos sugeridos
#
#  So o que esta aqui pode ser pedido. Cada linha e MATERIAL: preco -- o
#  preco e a SUGESTAO que aparece ao criar o pedido (o jogador pode mudar)
#  e o que ordena a tela "Maior preco / Menor preco".
#
#  O nome do material e o moderno (1.13+): o plugin traduz sozinho para o
#  nome antigo em servidor 1.8 -> 1.12, e pula o que nao existe na versao
#  do seu servidor (nada de erro no console).
#
#  Comandos que mexem aqui sem abrir o arquivo:
#    /starpedidos preco <MATERIAL|id> <preco>   muda ou acrescenta um preco
#    /starpedidos adicionar <id> <preco>        guarda o item da sua mao em
#                                               Personalizados (qualquer item,
#                                               inclusive de outros plugins)
#    /starpedidos remover <MATERIAL|id>
#
#  Personalizados: itens guardados inteiros (Base64), com tudo que tem --
#  nome, lore, encantamento, NBT de outro plugin. Exemplo:
#
#  Personalizados:
#    espada_lendaria:
#      Base64: 'rO0AB...'
#      Preco: 5000.0
#      Apelidos: [ 'lendaria', 'espada do chefe' ]
#      Categoria: COMBATE
# ==========================================================================

