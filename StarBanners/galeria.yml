# ---------------------------------------------------------------------------
#  StarBanners - galeria do servidor
#
#  Os desenhos que todo mundo vê no /banner galeria e pega com um clique.
#
#  O jeito prático de mexer nisto é dentro do jogo: segure a bandeira e use
#     /starbanners galeria adicionar <nome>
#  para pôr, e o Shift + clique direito no próprio menu para tirar. Este
#  arquivo é regravado pelo plugin, então os comentários de exemplo abaixo
#  somem na primeira alteração feita no jogo -- é esperado.
#
#  Formato de cada desenho:
#     <id>:
#       Nome: 'o que aparece na tela'
#       Fundo: WHITE            # a cor da bandeira crua
#       Camadas: [ 'bo:BLACK' ] # codigo:COR, pintadas de baixo para cima
#
#  Os códigos das camadas estão explicados no alfabeto.yml.
#
#  Os três que já vêm aqui existem para a galeria não nascer vazia. Apague sem
#  medo: eles não voltam.
# ---------------------------------------------------------------------------

Versao do modelo: 1

Desenhos:

  '1000000000001':
    Nome: 'Alvo'
    Fundo: WHITE
    Camadas: [ 'bo:RED', 'mc:RED' ]
    Criado em: 1000000000001

  '1000000000002':
    Nome: 'Creeper'
    Fundo: LIME
    Camadas: [ 'cre:BLACK' ]
    Criado em: 1000000000002

  '1000000000003':
    Nome: 'Xadrez'
    Fundo: WHITE
    Camadas: [ 'tl:BLACK', 'br:BLACK' ]
    Criado em: 1000000000003
