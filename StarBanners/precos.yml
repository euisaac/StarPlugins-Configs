# ---------------------------------------------------------------------------
#  StarBanners - quanto vale cada material
#
#  O preço de uma bandeira NÃO é tabelado desenho por desenho: ele é a soma do
#  valor dos materiais que a receita dela consome. Uma bandeira de seis camadas
#  custa mais do que uma de duas sozinha, e um emblema raro (globo, focinho)
#  pesa no preço porque o item dele pesa aqui.
#
#  A receita de uma bandeira é:
#    - 6 lãs da cor do fundo + 1 graveto   (dá para desligar no config.yml)
#    - 1 corante da cor de cada camada
#    - mais o item que o tear pede em alguns padrões (os de baixo)
#
#  Material que não estiver aqui vale o que está em "Outros" (0 = de graça).
#  Uma linha com o nome inteiro do material (LIME_WOOL: 25) vale mais do que o
#  grupo, então dá para ajustar uma cor só.
# ---------------------------------------------------------------------------

