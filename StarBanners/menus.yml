      Nome: '&b&lPRE-VISUALIZACAO: &f{previa}'
      Lore:
        - '&7Mostrar cada padrão por cima'
        - '&7do desenho ou sozinho no fundo.'
    Voltar:
      Slot: 49
      Material: 'RED_DYE'
      Nome: '&cVoltar'
      Lore: []
    Anterior:
      Slot: 45
      Material: 'ARROW'
      Nome: '&aPágina anterior'
      Lore: [ '&7Página {pagina} de {paginas}' ]
    Proxima:
      Slot: 53
      Material: 'ARROW'
      Nome: '&aPróxima página'
      Lore: [ '&7Página {pagina} de {paginas}' ]


