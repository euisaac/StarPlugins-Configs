# Nomes dos comandos do StarChat, separados por |.
# O primeiro vira o comando e os outros viram apelidos. Vazio ('') desliga o comando.
# Os comandos de cada canal (/g, /l...) ficam no canais.yml.
# O painel da staff e sempre /starchat (ou /schat).
Comandos:
  Privado: 'tell|msg|m|w|whisper|pm|mensagem'
  Responder: 'r|responder|reply'
  Ignorar: 'ignorar|ignore'
  Canal: 'canal|ch|focar'
  Chat: 'chat'

# true: se outro plugin (ou o proprio servidor) ja usa um desses nomes -- o /tell
# do Minecraft, o /msg de um plugin de utilidades --, o StarChat assume o nome.
# O comando original volta quando o StarChat e desligado.
# false: o StarChat so fica com os nomes que estiverem livres.
Assumir comandos: true
