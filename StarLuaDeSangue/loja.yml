# ============================================================================
#  A loja de Fragmentos de Sangue (/luadesangue loja).
#
#  Slot manda a posicao no menu. Limite por lua trava quantas vezes o mesmo
#  jogador leva aquilo na mesma Lua de Sangue (0 = sem limite); Limite total
#  vale para a vida toda dele.
#
#  O item entregue pode ser escrito na mao (Material/Nome/Lore) ou capturado do
#  seu inventario pelo editor, que grava tambem o Base64 e preserva o item
#  exatamente como ele e.
# ============================================================================

