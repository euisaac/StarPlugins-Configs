# ============================================================================
#  Os mobs da Lua de Sangue.
#
#  A chave (zumbi_sangrento, ...) e o id usado no mundos.yml, nos desafios e no
#  /starluadesangue invocar. Use o editor em jogo para criar os seus.
#
#  Tipos de habilidade aceitos em "Habilidades > Tipo":
#    EXPLODIR    explode ao morrer, sem quebrar bloco
#    TELEPORTAR  pula para perto do alvo
#    INVOCAR     chama lacaios (Mob: id do mobs.yml)
#    PUXAR       arrasta o alvo para perto
#    EMPURRAR    arremessa o alvo para longe
#    EFEITO      aplica um efeito de pocao ao acertar (Efeito: NOME;nivel;segundos)
#    DESARMAR    derruba o que o alvo tem na mao
#    CURAR       se cura e cura os mobs da lua por perto
#    ESCUDO      ganha absorcao por um tempo
#    RAIO        cai um raio no alvo (sem fogo)
#    SALTAR      pula na direcao do alvo
#    REFLETIR    devolve parte do dano recebido
#    ENFURECER   da forca e pressa aos mobs da lua por perto
#    FOGO        incendeia o alvo
#    PRENDER     prende o alvo no lugar por um instante
#
#  Todas aceitam: Chance (0-100), Recarga (ex.: 8s), Forca, Alcance, Duracao.
# ============================================================================

