#  no plugin.yml (/luadesangue e /starluadesangue).
# ============================================================================

Versao do modelo: 1

comandos:
  luadesangue: 'luadesangue|lds|luasangue|luasangrenta'
  starluadesangue: 'starluadesangue|slds|admlua'
