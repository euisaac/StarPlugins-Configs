# ============================================================
#                     StarEstacoes - menus.yml
# ============================================================
# Titulos, botoes e textos dos menus.
#
# Em todos os textos valem: {estacao}, {estacao_colorida}, {dia},
# {duracao}, {restantes}, {proxima}, {proxima_colorida}, {ano},
# {progresso}, {barra}, {tempo_restante}, {evento}, {evento_tempo},
# {modo} e {status}.
#
# O botao de fechar e um corante vermelho (RED_DYE) de proposito:
# BARRIER nos menus da StarPlugins significa "bloqueado".
# ============================================================

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "Textura"):
#       Dono: 'Notch'
#
# Com "Textura" ou "Dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "Textura".
#
# A cabeca por "Dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "Textura".
# ---------------------------------------------------------------------------

# Nao mexa: e por este numero que o plugin sabe se o arquivo e antigo.
Versao do modelo: 1

# Vidro que preenche os espacos vazios. Material vazio = sem preenchimento.
Preenchimento: GRAY_STAINED_GLASS_PANE

Fechar:
  Material: RED_DYE
  Nome: "&cFechar"
  Lore: []

Voltar:
  Material: ARROW
  Nome: "&eVoltar"
  Lore: []

# ------------------------------------------------------------ /estacao
Estacao:
  Titulo: "&8Estacoes do ano"
  Linhas: 5

  Atual:
    Slot: 13
    Nome: "{estacao_colorida} &8- &7Ano {ano}"
    Lore:
      - "{descricao}"
      - ""
      - "&7Dia &f{dia} &7de &f{duracao} &8({status}&8)"
      - "{barra} &f{progresso}%"
      - ""
      - "&7Proxima: {proxima_colorida} &7em &f{tempo_restante}"
      - "&7Evento: {evento}"

  # Uma estacao por slot, na ordem do ano.
  Calendario:
    Slots: [ 28, 30, 32, 34, 29, 31, 33 ]
    Nome: "{nome_colorido}"
    Lore atual:
      - "&a&l> ESTACAO ATUAL"
      - "&7Dura &f{dias} &7dias"
    Lore futura:
      - "&7Comeca em &f{dias_ate} &7dia(s)"
      - "&7Dura &f{dias} &7dias"
    # Linhas que vem depois, nas duas.
    Lore comum:
      - ""
      - "&7Destaques:"
      - "{destaques}"
      - ""
      - "&8Clique para ver as plantacoes"
    # Quantos grupos aparecem em {destaques}.
    Destaques: 4

  Plantacoes:
    Slot: 38
    Material: WHEAT
    Nome: "&a&lPlantacoes"
    Lore:
      - "&7Veja quanto cada plantacao"
      - "&7cresce e rende em cada estacao."
      - ""
      - "&eClique para abrir"

  Evento:
    Slot: 40
    Nome: "&d&lEvento sazonal"
    Material sem evento: CLOCK
    Lore com evento:
      - "&7Agora: {evento}"
      - "&7Termina em &f{evento_tempo}"
    Lore sem evento:
      - "&7Nenhum evento acontecendo."
      - "&7A cada novo dia um evento da"
      - "&7estacao pode comecar."

  Barra:
    Slot: 42
    Material: NAME_TAG
    Nome: "&e&lBarra da estacao"
    Lore:
      - "&7A barra no topo da tela com a"
      - "&7estacao e os dias que faltam."
      - ""
      - "&7Agora: {estado}"
      - "&eClique para alternar"

  Particulas:
    Slot: 43
    Material: BLAZE_POWDER
    Nome: "&b&lParticulas da estacao"
    Lore:
      - "&7Neve no inverno, petalas na"
      - "&7primavera..."
      - ""
      - "&7Agora: {estado}"
      - "&eClique para alternar"

  Fechar:
    Slot: 44

# ------------------------------------------------------------ plantacoes
Plantacoes:
  Titulo: "&8Plantacoes - {nome}"
  # Abas com as estacoes no topo (uma por slot).
  Abas: [ 1, 2, 3, 4, 5, 6, 7 ]
  Aba:
    Nome: "{nome_colorido}"
    Lore selecionada:
      - "&a> Mostrando esta estacao"
    Lore outra:
      - "&eClique para ver"
  Grupos: [ 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43 ]
  Grupo:
    Nome: "&f{grupo}"
    Lore:
      - "&7Crescimento: {crescimento}"
      - "&7Colheita: {colheita}"
      - "{bloqueado}"
      - ""
      - "&7Melhor para crescer: {melhor_crescimento}"
      - "&7Melhor para colher: {melhor_colheita}"
    Bloqueado: "&c&lPlantio proibido nesta estacao"
  Voltar:
    Slot: 48
  Fechar:
    Slot: 49

# ------------------------------------------------------------ /starestacoes menu
Admin:
  Titulo: "&8Estacoes - Administracao"
  Estado:
    Slot: 4
    Material: CLOCK
    Nome: "{estacao_colorida} &8- &7Dia {dia}/{duracao}"
    Lore:
      - "&7Ano: &f{ano}"
      - "&7Modo: &f{modo}"
      - "&7Status: {status}"
      - "&7Proxima: {proxima_colorida} &7em &f{tempo_restante}"
      - "&7Evento: {evento}"
  Estacoes: [ 10, 11, 12, 13, 14, 15, 16 ]
  Estacao:
    Nome: "{nome_colorido}"
    Lore:
      - "&7Dura &f{dias} &7dias"
      - "{atual}"
      - ""
      - "&eEsquerdo: &fpor como estacao atual"
      - "&eDireito: &feditar buffs e debuffs"
      - "&eShift+Esquerdo: &f+1 dia de duracao"
      - "&eShift+Direito: &f-1 dia de duracao"
    Atual: "&a&l> ESTACAO ATUAL"
  Dia:
    Slot: 28
    Material: SUNFLOWER
    Nome: "&e&lDia atual: &f{dia}/{duracao}"
    Lore:
      - "&eEsquerdo: &f+1 dia"
      - "&eDireito: &f-1 dia"
      - "&eShift+Esquerdo: &favancar 1 dia (conta como dia novo)"
  Pular:
    Slot: 29
    Material: ENDER_PEARL
    Nome: "&b&lPular estacao"
    Lore:
      - "&7Vai direto para {proxima_colorida}&7."
      - ""
      - "&eClique para pular"
  Pausa:
    Slot: 30
    Material: REDSTONE_TORCH
    Nome: "&c&lPausar / retomar"
    Lore:
      - "&7Status: {status}"
      - "&7Pausado, o tempo das estacoes"
      - "&7para (o calendario real nao pausa)."
      - ""
      - "&eClique para alternar"
  Modo:
    Slot: 31
    Material: COMPASS
    Nome: "&6&lModo de contagem"
    Lore:
      - "&7Agora: &f{modo}"
      - ""
      - "&fDias do Minecraft &7- cada amanhecer"
      - "&fTempo real &7- minutos reais por dia"
      - "&fCalendario real &7- datas de verdade"
      - ""
      - "&eClique para trocar"
  Eventos:
    Slot: 32
    Material: FIREWORK_ROCKET
    Nome: "&d&lEventos sazonais"
    Lore:
      - "&7Ativo: {evento}"
      - ""
      - "&eClique para iniciar ou parar"
  Recarregar:
    Slot: 33
    Material: REPEATER
    Nome: "&a&lRecarregar arquivos"
    Lore:
      - "&7Le de novo todos os .yml."
      - ""
      - "&eClique para recarregar"
  Almanaque:
    Slot: 34
    Material: BOOK
    Nome: "&2&lPegar um almanaque"
    Lore:
      - "&7O item que inspeciona plantacoes."
  Fechar:
    Slot: 49

# ------------------------------------------------------------ editar estacao
Editar:
  Titulo: "&8Editar - {nome}"
  Grupos: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]
  Grupo:
    Nome: "&f{grupo}"
    Lore:
      - "&7Crescimento: &e{crescimento} {herdado_crescimento}"
      - "&7Colheita: &e{colheita} {herdado_colheita}"
      - "&7Plantio: {bloqueado}"
      - ""
      - "&eEsquerdo/Direito: &fcrescimento +/- 0.1"
      - "&eShift+Esq/Dir: &fcolheita +/- 0.1"
      - "&eQ (soltar): &fbloquear/liberar plantio"
    Herdado: "&8(padrao)"
    Bloqueado: "&cproibido"
    Liberado: "&aliberado"
  Padrao:
    Nome: "&6&lPadrao (todos os outros)"
    Material: HAY_BLOCK
  # Ajustes da estacao. Esquerdo soma, direito tira (shift = passo maior).
  Ajustes:
    Dias:
      Slot: 37
      Material: CLOCK
      Nome: "&eDuracao: &f{valor} dias"
    Geada:
      Slot: 38
      Material: ICE
      Nome: "&bGeada: &f{valor}"
    Seca:
      Slot: 39
      Material: DEAD_BUSH
      Nome: "&6Seca (terra seca): &f{valor}"
    Farinha:
      Slot: 40
      Material: BONE_MEAL
      Nome: "&fFarinha falha: &f{valor}"
    Filhote:
      Slot: 41
      Material: EGG
      Nome: "&aFilhote extra: &f{valor}"
    Procriacao:
      Slot: 42
      Material: WHEAT
      Nome: "&cProcriacao falha: &f{valor}"
    Chuva:
      Slot: 43
      Material: WATER_BUCKET
      Nome: "&9Chance de chuva: &f{valor}"
    Lore:
      - "&eEsquerdo: &f+{passo}  &eDireito: &f-{passo}"
      - "&eShift: &fpasso maior"
  Voltar:
    Slot: 45
  Fechar:
    Slot: 49

# ------------------------------------------------------------ eventos
Eventos:
  Titulo: "&8Eventos sazonais"
  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25 ]
  Evento:
    Nome: "{nome}"
    Lore:
      - "&7Estacoes: &f{estacoes}"
      - "&7Chance por dia: &f{chance}"
      - "&7Duracao: &f{duracao} min"
      - "{ativo}"
      - ""
      - "&eEsquerdo: &finiciar agora"
      - "&eDireito: &fparar"
    Ativo: "&a&l> ACONTECENDO AGORA &7({evento_tempo})"
  Voltar:
    Slot: 45
  Fechar:
    Slot: 49
