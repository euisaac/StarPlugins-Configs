# =========================================================================
#  StarAdmin - menus
#
#  Cada menu: Titulo, Linhas (1 a 6), Fundo (item que preenche o vazio) e Itens.
#  Cada item: Slot (ou Slots: [..]), Material, Nome, Lore, Brilho, Quantidade,
#  Dono (cabeça: '{jogador}' = o jogador escolhido, '{staff}' = você), Textura,
#  Permissao (sem ela o botão some), Acao e "Acao direito" (clique direito).
#  "Mostrar se:" esconde o item fora da condição (online, offline, banido,
#  mutado, preso, congelado, starpunicoes, starreportar, motor-interno...;
#  "!" na frente inverte). "Estado:" + "Ligado:" troca o visual (e a Acao, se
#  a seção Ligado tiver uma) quando a condição vale: vanish, modo-staff,
#  staff-chat, voo, espectando, congelado, voo-alvo, chat-mutado...
#
#  AÇÕES (Acao aceita uma ou uma lista):
#   Navegar: fechar, voltar, atualizar, principal, menu <Seção>, jogadores, offline,
#            escolher <GERENCIAR|TP_OCULTO|ESPECTAR|TELEPORTAR|PUXAR|INFORMACOES>,
#            staff-online, log
#   Você:    vanish, modo-staff, staff-chat, voo, gamemode <MODO>, tp-aleatorio, espectar-sair
#   Servidor: limpar-chat, mutar-chat, dia, noite, sol, chuva, limpar-itens, matar-mobs, recarregar
#   Jogador: gerenciar, informacoes, historico, reportes, anotacoes, acoes, mineracao,
#            punir <TIPO> [permanente|temporario], revogar <TIPO>,
#            teleportar, puxar, tp-oculto, espectar, congelar, ver-inventario, ver-ender,
#            curar, alimentar, limpar-inventario, matar, gamemode-alvo <MODO>, voo-alvo,
#            testar-knockback, testar-voo, testar-cps, testar-xray
#   Livres:  '[jogador] comando', '[console] comando', '[mensagem] texto'
#
#  Menus novos: crie uma seção com Titulo/Linhas/Itens e abra com 'menu <Seção>'.
#
#  Placeholders em toda tela: {staff} {online} {max} {staff_online} {ocultos}
#  {congelados} {vanish} {modo_staff} {staff_chat} {voo} {meu_modo} {tps}
#  {tps_minuto} {tps_cor} {ram} {ram_max} {entidades} {chunks} {mundos} {motor}
#  {chat_mutado} {versao}. Nas telas de jogador: {jogador} {uuid} {status}
#  {avisos} {proxima_punicao} {reportes} {banido} {mutado} {preso} {ban_motivo}
#  {ban_expira} {mute_motivo} {mute_expira} {punicoes} {congelado}
#  {alvo_vanish} {voo_alvo} {modo_alvo}.
# =========================================================================

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#       Dono: '{staff}'   # a cabeca de quem abriu o menu
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

