    Nome: '&cAusente (AFK) em área de evento'
    Motivo: 'Ausente em área de evento'
    Material: CLOCK
  expulsar-flood:
    Tipo: EXPULSAR
    Nome: '&cFlood de comandos'
    Motivo: 'Flood de comandos'
    Material: COMMAND_BLOCK

  # ------------------------------ avisos ------------------------------
  aviso-linguagem:
    Tipo: AVISO
    Nome: '&eLinguagem imprópria'
    Motivo: 'Linguagem imprópria no chat'
    Material: YELLOW_DYE
  aviso-spam:
    Tipo: AVISO
    Nome: '&eSpam / flood'
    Motivo: 'Spam no chat'
