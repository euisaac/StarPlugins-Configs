# ---------------------------------------------------------------------------
#  StarPortalArmas - mensagens
#
#  Mensagem vazia ('') nao e enviada: e assim que se desliga um aviso sem
#  precisar de uma opcao no config.yml para cada um.
#
#  Marcadores que valem aqui: {portal} {dono} {jogador} {local} {mundo}
#  {tempo} {total} {limite} {tamanho} {novo} {origem} {destino} {comando}
# ---------------------------------------------------------------------------

# O numero anda junto com o do mesmo arquivo no StarPortal: como no servidor
# os dois se chamam igual, este precisa ser MAIOR que o de la, senao quem ja
# tem o arquivo antigo nunca recebe este.
Versao do modelo: 4

Prefixo: '&d&lPORTAL &8» &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  So jogador: '&cEsse comando so funciona no jogo.'
  Jogador offline: '&cO jogador &f{jogador} &cnao esta online.'
  Jogador desconhecido: '&cNunca vi o jogador &f{jogador} &cpor aqui.'
  Numero invalido: '&cIsso nao e um numero valido.'
  Mundo nao encontrado: '&cO mundo &f{mundo} &cnao existe.'
  Recarregado: '&aConfiguracoes recarregadas.'
Estado:
  Ligado: '&aligado'
  Desligado: '&cdesligado'
  Nenhum: '&cnao definido'
  Ilimitado: '&dsem limite'
  Cor automatica: 'automatica (pelo mundo do destino)'
  Publico: 'publicos'
  Privado: 'so meus'
  Lado de ida: 'ida'
  Lado de volta: 'volta'

# ---------------------------------------------------------------------------
#  O texto que flutua em cima do portal.
#
#  Ligue ou desligue no config.yml (Holograma.Ativar). Apagar as linhas de um
#  dos dois tipos aqui tambem desliga so aquele.
#
#  A primeira linha da lista fica em cima. Marcadores:
#    {portal}  nome do portal (a home, o warp, o outro jogador)
#    {jogador} e {dono}  quem abriu o portal
#    {tempo}   quanto falta para fechar, ja com o "s" (so no temporario)
#    {origem} {destino}  os dois lados, em mundo e coordenadas
#    {lado}    "ida" ou "volta", conforme a moldura
# ---------------------------------------------------------------------------
Holograma:
  Temporario:
    - '&5{portal} &fde &5{jogador}'
    - '&7Fechando em &f{tempo}'
  Fixo:
    - '&5{portal}'
    - '&7Portal de &f{dono}'

Portal:
  Aberto: '&aPortal aberto para &f{portal}&a. Ele fica de pe por &f{tempo}&a.'
  Criado: '&aPortal &f{portal} &acriado em &f{local}&a. Agora escolha o destino com &f/portal destino {portal}&a.'
  Removido: '&aO portal &f{portal} &afoi apagado.'
  Renomeado: '&aO portal &f{portal} &aagora se chama &f{novo}&a.'
  Fechado: '&7O portal &f{portal} &7foi fechado.'
  Nenhum aberto: '&cVoce nao tem nenhum portal aberto agora.'

  Nome em uso: '&cVoce ja tem um portal chamado &f{portal}&c.'
  Nome grande: '&cO nome do portal pode ter no maximo &f{tamanho} &ccaracteres.'
  Nome invalido: '&cUse so letras, numeros, hifen e sublinhado no nome.'
  No limite: '&cVoce ja tem o maximo de &f{limite} &cportais fixos.'
  Nao encontrado: '&cVoce nao tem nenhum portal chamado &f{portal}&c.'

  Lista vazia: '&7Voce ainda nao tem portais. Crie um com &f/portal criar&7.'
  Lista cabecalho: '&7Os seus portais &8(&f{total}&8/&f{limite}&8):'
  Lista linha: '  &d{portal} &8» &7de &f{origem} &7para &f{destino}'

  Sem destino: '&cO portal &f{portal} &cainda nao tem destino. Va ate o lugar e use &f/portal destino {portal}&c.'
  Mundo do destino fora: '&cO mundo do destino nao esta carregado agora.'
  Mundo bloqueado: '&cNao da para abrir portais neste mundo.'

  Origem definida: '&aA origem do portal &f{portal} &aagora e &f{local}&a.'
  Destino definido: '&aO destino do portal &f{portal} &aagora e &f{local}&a.'
  Ida ligada: '&aO lado de ida do portal &f{portal} &afoi ligado.'
  Ida desligada: '&7O lado de ida do portal &f{portal} &7foi desligado.'
  Volta ligada: '&aO lado de volta do portal &f{portal} &afoi ligado.'
  Volta desligada: '&7O lado de volta do portal &f{portal} &7foi desligado.'
  Outros liberados: '&aQualquer um pode atravessar o portal &f{portal}&a.'
  Outros bloqueados: '&7So voce atravessa o portal &f{portal} &7agora.'
  Confirmar apagar: '&eSegure &fSHIFT &ee clique de novo para apagar o portal &f{portal}&e.'

  Ja fechou: '&cEsse portal ja fechou.'
  Sem o outro lado: '&7O portal &f{portal} &7ainda nao tem o outro lado.'
  Em combate: '&cVoce esta em combate! Espere &f{tempo}&c para usar portais.'
  Nome do teleporte: 'teleporte'
  Atravessou: '&dVoce atravessou o portal &f{portal}&d.'
  So do dono: '&cEste portal e so de {dono}.'
  Sem permissao para entrar: '&cVoce nao pode atravessar portais dos outros.'

# ---------------------------------------------------------------------------
#  O "digite no chat" dos menus (o renomear).
# ---------------------------------------------------------------------------
Entrada:
  Nome do portal: |
    &7Digite no chat o novo nome do portal &f{portal}&7.
    &7Da para usar cor com o e-comercial, do mesmo jeito que numa placa.
  Como cancelar: '&7Digite &fcancelar &7para desistir.'
  Cancelado: '&7Deixei como estava.'
  Tempo esgotado: '&cO tempo para digitar acabou.'
# ---------------------------------------------------------------------------
#  As armas de portal.
# ---------------------------------------------------------------------------
Armas:
  Modo origem: 'origem'
  Modo destino: 'destino'
  Usos ilimitados: 'sem limite'

  # A linha que aparece acima da barra de itens de quem esta com a arma.
  Barra: '&dModo: &f{modo}  &8|  &dUsos: &f{usos}'

  Modo trocado: '&7Agora a arma cria o lado de &f{modo}&7.'
  Origem definida: '&aLado de origem posto em &f{local}&a. Usos: &f{usos}'
  Destino definido: '&aLado de destino posto em &f{local}&a. Usos: &f{usos}'

  Mira longe: '&cMire num bloco mais perto para abrir o portal ali.'
  Sem permissao: '&cVoce nao pode usar esta arma.'
  Acabou: '&eOs usos acabaram. Bata mais uma vez para recolher o portal dela.'
  Portais removidos: '&7Os portais desta arma foram recolhidos.'
  Sem portais: '&7Esta arma nao tem nenhum portal de pe.'
  Quebrou: '&cA arma se desfez na sua mao.'
  Nada na mao: '&cVoce nao esta segurando uma arma de portal.'
  Modelo sumiu: '&cEsta arma (&f{arma}&c) nao existe mais no armas.yml.'

  Nao encontrada: '&cNao existe uma arma chamada &f{arma}&c.'
  Uso dar: '&cUse: &f/portalarma dar <jogador> <arma> [quantidade]'
  Dada: '&aEntregue: &f{total}x {arma} &apara &f{jogador}&a.'
  Recebida: '&aVoce recebeu &f{total}x &aarma de portal (&f{arma}&a).'
  Lista: '&7Armas do armas.yml (&f{total}&7):'
  Lista item: '&8- &f{arma} &7(usos: &f{usos}&7, item: &f{material}&7)'
  Lista vazia: '&cNenhuma arma foi carregada do armas.yml.'

  Ajuda: |
    &8&m--------------------------------------------
    &d&lArmas de portal
    &f/portalarma dar <jogador> <arma> [qtd] &7- entrega uma arma
    &f/portalarma lista &7- as armas do armas.yml
    &f/portalarma limpar &7- tira os portais da arma na sua mao
    &f/portalarma recarregar &7- recarrega os arquivos
    &8&m--------------------------------------------
