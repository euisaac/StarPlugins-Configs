# ---------------------------------------------------------------------------
#  StarPortal
#
#  O comando nao leva mais o jogador: ele abre um portal na frente dele. Quem
#  estiver por perto atravessa junto, e cada jogador ainda tem os portais fixos
#  dele -- com origem, destino, e a escolha de qual lado aparece no mundo.
#
#  Nada disso vira bloco no mundo: as molduras sao particulas, e o portal so e
#  desenhado quando ha alguem por perto para ver.
# ---------------------------------------------------------------------------

Versao do modelo: 3

#
# ==============================  BANCO DE DADOS  ============================
#
Banco de dados:
  # SQLITE (arquivo, nao precisa de nada) ou MYSQL (varios servidores no mesmo
  # banco).
  Tipo: SQLITE

  Endereco: localhost
  Porta: 3306
  Banco: minecraft
  Usuario: root
  Senha: ''

  # Mude se voce roda mais de uma rede no mesmo banco.
  # Tabelas proprias: este plugin pode rodar ao lado do StarPortal, e cada um
  # cuida dos portais que ele mesmo criou.
  Prefixo das tabelas: 'starportalarmas_'

  # De quantos em quantos segundos o que mudou vai para o banco. Os cliques do
  # menu valem na hora; isto e so a gravacao.
  Salvar a cada: 60

#
# =================================  PORTAIS  ================================
#
Portais:
  # Tamanho da moldura, em blocos.
  Largura: 1.4
  Altura: 2.2

  # Cor da borda, em R,G,B (ou #RRGGBB). Cada portal pode ter a cor dele, e
  # esta e a de quem nao escolheu nenhuma.
  #
  # Servidor 1.8 nao aceita cor escolhida em particula: la a borda sai sempre
  # avermelhada, e o resto funciona igual.
  Cor padrao: '150,60,255'

  # Cor pelo mundo do DESTINO: o portal se pinta conforme o lugar para onde
  # leva. O que leva para o Nether fica vermelho, o que leva para o End fica
  # branco -- da para saber para onde a moldura vai antes de entrar.
  #
  # A cor escolhida no menu pelo dono do portal ganha de tudo isto; sem ela,
  # vale o nome do mundo, depois o ambiente, e por ultimo a "Cor padrao".
  Cor por mundo:
    Ativar: true

    # Pelo tipo do mundo. Os nomes sao os do Bukkit: NORMAL, NETHER e THE_END.
    Ambientes:
      NORMAL: '150,60,255'
      NETHER: '255,60,60'
      THE_END: '235,235,255'

    # Pelo nome exato do mundo; ganha do ambiente. Serve para o mundo de
    # mineracao, o lobby, o mundo de eventos...
    Mundos:
      # mineracao: '80,230,120'
      # lobby: '60,180,255'

  # A particula que preenche o meio da moldura. Deixe vazio para so a borda.
  Particula do miolo: 'PORTAL'

  # Quantos pontos formam a volta da moldura. Mais pontos = borda mais fechada
  # e mais particula no ar.
  Pontos da borda: 28

  # De quantos em quantos tiques o portal e redesenhado (20 tiques = 1 segundo).
  # Este numero tambem manda na conferencia de quem entrou.
  Desenhar a cada: 4

  # A que distancia, em blocos, o portal aparece para quem esta perto.
  Distancia para ver: 32

  # Portal novo ja nasce deixando os outros atravessarem?
  Permitir outros por padrao: true

  # Segundos entre um uso e outro do mesmo jogador. Serve tambem para nao
  # levar duas vezes seguidas quem parou em cima da moldura.
  Espera entre usos: 3

  # Tamanho maximo do nome de um portal.
  Tamanho maximo do nome: 16

  # Mundos onde nao da para abrir nem criar portais.
  Mundos bloqueados: []
#
# ================================  HOLOGRAMA  ===============================
#
#  Um texto flutuando em cima de cada portal. Ele e um suporte de armadura
#  invisivel -- nao precisa de plugin de holograma nenhum, e so existe
#  enquanto tem alguem por perto para ver.
#
#  O QUE ele escreve (e em quantas linhas) esta no mensagens.yml, na secao
#  Holograma. Apagar as linhas de la desliga o holograma daquele tipo de
#  portal.
#
Holograma:
  Ativar: true

  # Altura, em blocos, acima do pe da moldura.
  Altura: 2.6

  # Distancia entre uma linha e a de cima.
  Espaco entre linhas: 0.28
#
# ==================================  SONS  ==================================
#
#  Formato: SOM, SOM;volume ou SOM;volume;tom. O nome passa pelo XSeries,
#  entao vale tanto o nome antigo quanto o novo. Deixe vazio para nao tocar.
#
Sons:
  Abrir: 'BLOCK_PORTAL_TRIGGER;0.4;1.6'
  Atravessar: 'ENTITY_ENDERMAN_TELEPORT;0.8;1.2'
  Fechar: 'BLOCK_FIRE_EXTINGUISH;0.5;1.4'
  Erro: 'ENTITY_VILLAGER_NO;1;1'
  Clique no menu: 'UI_BUTTON_CLICK;0.6;1.4'
#
# =========================  AS ARMAS DE PORTAL  =============================
#
#  As armas em si ficam no armas.yml, ao lado deste arquivo. Aqui so o que
#  vale para todas elas.
#
Armas:
  # Mostra o modo e os usos acima da barra de itens de quem esta com a arma
  # na mao.
  Barra de acao: true

#
# ================================  COMBATE  =================================
#
#  Precisa do StarCombate no servidor. Sem ele, nada aqui acontece -- o plugin
#  nao tem como saber quem esta em combate, entao ninguem fica preso.
#
#  Quem tem starportal.admin passa pelas duas travas.
#
Combate:
  # Quem esta marcado em combate nao atravessa portal (nem os que ja existiam).
  Bloquear atravessar: true

  # Alem disso, ele nem consegue abrir um portal novo.
  Bloquear abrir: false

#
# ===============================  ANIMACOES  ================================
#
#  Como a moldura abre, fica de pe e fecha. Cada jogador escolhe a dele no
#  /portal (botao Animacoes), dentro do que ele tiver permissao.
#
#    abertura  NENHUMA, EXPANDIR, GIRAR, SUBIR
#    aberto    ANEL, ESPIRAL, CHUVA, PULSAR
#    fechando  NENHUMA, IMPLODIR, DESABAR, ESTOURAR
#
Animacoes:
  Ativar: true

  # Quantos tiques duram a abertura e o fechamento (20 tiques = 1 segundo).
  Duracao: 12

  # O que vale para quem nunca escolheu.
  Padrao:
    Abertura: 'EXPANDIR'
    Aberto: 'ANEL'
    Fechando: 'IMPLODIR'

  # Cada animacao pede a permissao starportal.animacao.<nome> (por exemplo
  # starportal.animacao.implodir). As escritas aqui sao de graca para todo
  # mundo -- o resto vira VIP.
  Liberadas: [ NENHUMA, ANEL, EXPANDIR, IMPLODIR ]

#
# =================================  AVISOS  =================================
#
Avisos:
  # Recusa (portal de outro, mundo bloqueado) aparece na barra de acao em vez
  # do chat -- assim quem para na frente da moldura nao enche o proprio chat.
  Barra de acao: true
