# ---------------------------------------------------------------------------
#  StarPortalArmas - telas
#
#  Sao as duas telas que o portal da arma abre no clique com o botao direito:
#  a de um portal ja de pe e a de um portal temporario.
#
#  Slot: -1 esconde o botao. As posicoes vao de 0 ate o tamanho do menu -1
#  (uma linha tem 9 slots).
# ---------------------------------------------------------------------------

Versao do modelo: 1

#
# ==========================  AJUSTES DE UM PORTAL  ==========================
#
Portal:
  Titulo: '&8Portal {portal}'
  Linhas: 5

  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  Info:
    Slot: 4
    Material: 'ENDER_PEARL'
    Nome: '&d&l{portal}'
    Lore:
      - '&7Dono: &f{dono}'
      - '&7Origem: &f{origem}'
      - '&7Destino: &f{destino}'
      - '&7Cor: &f{cor}'

  Ir:
    Slot: 20
    Material: 'ENDER_EYE'
    Nome: '&a&lAbrir passagem'
    Lore:
      - '&7Abre um portal aqui na sua frente'
      - '&7levando ate &f{destino}&7.'

  Origem aqui:
    Slot: 21
    Material: 'COMPASS'
    Nome: '&e&lOrigem neste lugar'
    Lore:
      - '&7Agora: &f{origem}'
      - ''
      - '&eClique &7para trocar pela sua posicao.'

  Destino aqui:
    Slot: 22
    Material: 'COMPASS'
    Nome: '&e&lDestino neste lugar'
    Lore:
      - '&7Agora: &f{destino}'
      - ''
      - '&eClique &7para trocar pela sua posicao.'

  Lado de ida:
    Slot: 29
    Material: 'LIME_DYE'
    Nome: '&fLado de ida: {ida}'
    Lore:
      - '&7A moldura que aparece na &forigem&7,'
      - '&7levando quem entra ate o destino.'
      - ''
      - '&eClique &7para ligar ou desligar.'

  Lado de volta:
    Slot: 30
    Material: 'LIME_DYE'
    Nome: '&fLado de volta: {volta}'
    Lore:
      - '&7A moldura que aparece no &fdestino&7,'
      - '&7trazendo quem entra de volta.'
      - ''
      - '&7Deixe desligado para um portal'
      - '&7so de ida.'
      - ''
      - '&eClique &7para ligar ou desligar.'

  Outros:
    Slot: 31
    Material: 'PLAYER_HEAD'
    Nome: '&fOutros podem entrar: {outros}'
    Lore:
      - '&7Quem estiver por perto tambem'
      - '&7atravessa a moldura.'
      - ''
      - '&eClique &7para ligar ou desligar.'

  Cor:
    Slot: 32
    Material: 'MAGENTA_DYE'
    Nome: '&f&lCor do portal'
    Lore:
      - '&7Agora: &f{cor}'
      - ''
      - '&eClique &7para trocar.'
    # A lista roda em ordem; depois da ultima ele volta para a cor padrao.
    Cores:
      - '150,60,255'
      - '60,180,255'
      - '80,230,120'
      - '255,200,60'
      - '255,80,80'
      - '255,255,255'

  Renomear:
    Slot: 24
    Material: 'NAME_TAG'
    Nome: '&e&lRenomear'
    Lore:
      - '&7Agora: &f{portal}'
      - ''
      - '&eClique &7e digite o nome novo no chat.'

  Apagar:
    Slot: 40
    Material: 'BARRIER'
    Nome: '&c&lApagar portal'
    Lore:
      - '&7O portal &f{portal} &7some para sempre.'
      - ''
      - '&cSegure SHIFT e clique para confirmar.'

  Voltar:
    Slot: 36
    Material: 'ARROW'
    Nome: '&eVoltar'

#
# =====================  PORTAL TEMPORARIO (clique direito)  =================
#
Temporario:
  Titulo: '&8Portal para {portal}'
  Linhas: 3

  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  Info:
    Slot: 4
    Material: 'CLOCK'
    Nome: '&d&l{portal}'
    Lore:
      - '&7Destino: &f{destino}'
      - '&7Fecha em: &f{tempo}'

  Outros:
    Slot: 11
    Material: 'PLAYER_HEAD'
    Nome: '&fPassagem: &e{outros}'
    Lore:
      - '&7Quem esta por perto pode ou nao'
      - '&7atravessar este portal.'
      - ''
      - '&eClique &7para trocar.'

  Volta:
    Slot: 13
    Material: 'LIME_DYE'
    Nome: '&fMoldura de volta: &e{volta}'
    Lore:
      - '&7Liga a moldura do outro lado,'
      - '&7para voltar pelo mesmo portal.'
      - ''
      - '&eClique &7para trocar.'

  Fechar agora:
    Slot: 15
    Material: 'BARRIER'
    Nome: '&c&lFechar o portal'
    Lore:
      - '&7Fecha a moldura agora mesmo.'

  Sair:
    Slot: 26
    Material: 'ARROW'
    Nome: '&eSair'
