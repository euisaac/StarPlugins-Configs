  #     Material: GOLD_INGOT
  #     Nome: '&6Cash'
  #     Lore: [ '', ' &7Esta loja negocia com &f{moeda_nome}&7.', '' ]
  #   Item configuracao:
  #     Material: GOLD_INGOT
  #     Nome: '&6Cash'
  #     Lore: [ '', ' &7Tipo de economia: &f{moeda_nome}&7.', '', '&aClique para trocar' ]
