# ==========================================================================
#  StarChestShop - as telas
#
#  Material passa pelo XSeries: o mesmo nome funciona na 1.8 e na 1.21.
#  Cabeca: Material PLAYER_HEAD + Textura (hash/URL/base64) ou Dono (nick).
#
#  Cada tela tem:
#    Titulo, Linhas        Titulo (ate 32 caracteres nas versoes antigas) e altura.
#    Enfeite               O vidro do fundo (Ativar: false deixa vazio; 'So fora
#                          do conteudo: false' enche os slots de conteudo tambem).
#    Slots                 Onde o conteudo paginado aparece (lojas, amigos...).
#    Itens                 Botoes fixos: Slot/Slots, Material, Textura, Dono,
#                          Nome, Lore, Brilho, Permissao, Esconder sem
#                          permissao e Acoes.
#
#  Acoes comuns:    lojas | top | buscar | historico | voltar | anterior |
#                   proxima | fechar
#  Acoes gerais:    comando: <cmd> | console: <cmd> | op: <cmd> | mensagem: <texto>
#                   anuncio: <texto> | titulo: <t<nl>sub> | actionbar: <texto>
#                   som: <SOM;volume;tom>
#  Cada tela tem as suas acoes, listadas antes dela.
#
#  Substituicoes em qualquer texto: {jogador} {lojas} {limite} {pagina}
#  {paginas}. Onde ha uma loja: {dono} {item} {quantidade} {preco_compra}
#  {preco_venda} {preco_compra_unidade} {preco_venda_unidade} {moeda}
#  {moeda_nome} {simbolo} {tipo} {estado} {estoque} {espaco} {id} {mundo}
#  {x} {y} {z} {ajuste} {vendidos} {comprados} {amigos} {holograma} {avisos}
#  {dinamico}. Placeholders do PlaceholderAPI tambem funcionam nos botoes.
# ==========================================================================

Versao do modelo: 1

# ---------------------------------------------------------------------------
#  Configuracao da loja (clique direito do dono na placa).
#  Acoes: item | economia | tipo | preco | preco-compra | preco-venda | nome
#         quantidade | alternar aberta|holograma|avisos|dinamico | amigos
#         estoque | historico-loja | remover
#  Botoes com par ligar/desligar (abrir/fechar, holograma-ligar/-desligar,
#  avisos-*, dinamico-*) so aparecem no estado certo. Na lore do 'tipo', a
#  linha {opcoes_tipo} vira a lista dos tres tipos, com o atual marcado.
# ---------------------------------------------------------------------------
Configuracao:
  Titulo: '&8Configurar loja'
  Linhas: 5
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  # O item da loja (o proprio item, com esta lore embaixo da original).
  Item:
    Slot: 11
    Nome: '&aItem da loja'
    Lore:
      - '&7Lote: &f{quantidade}x'
      - '&7Estoque: &f{estoque}'
      - ''
      - '&eClique num item do seu inventario'
      - '&epara trocar o item da loja.'
    Vazio:
      Material: BARRIER
      Nome: '&cNenhum item'
      Lore:
        - '&7Com este menu aberto, clique no'
        - '&7item do seu inventario que a loja'
        - '&7vai negociar.'

  # A moeda (desenha o 'Item configuracao' da economia).
  Moeda:
    Slot: 13
    Sem moeda:
      Material: BARRIER
      Nome: '&cSem economia'
      Lore: [ '&7Nenhuma economia disponivel para voce.' ]

  Itens:
    tipo:
      Slot: 14
      Material: HOPPER
      Nome: '&aTipo da loja'
      Lore:
        - '&7O que a sua loja faz:'
        - ''
        - '{opcoes_tipo}'
        - ''
        - '&eClique para trocar'
      Acoes: [ 'tipo' ]
    preco-compra:
      Slot: 15
      Material: GOLD_INGOT
      Nome: '&aPreco de venda'
      Lore:
        - '&7Quanto quem &fcompra&7 de voce paga'
        - '&7por &f{quantidade}x {item}&7.'
        - ''
        - '&7Atual: &f{preco_compra_bruto}'
        - ''
        - '&eClique para alterar'
      Acoes: [ 'preco-compra' ]
    preco-venda:
      Slot: 16
      Material: IRON_INGOT
      Nome: '&aPreco de compra'
      Lore:
        - '&7Quanto quem &fvende&7 para voce recebe'
        - '&7por &f{quantidade}x {item}&7.'
        - ''
        - '&7Atual: &f{preco_venda_bruto}'
        - ''
        - '&eClique para alterar'
      Acoes: [ 'preco-venda' ]
    nome:
      Slot: 20
      Material: NAME_TAG
      Nome: '&aNome do item'
      Lore:
        - '&7Como o item aparece na placa,'
        - '&7no holograma e nas mensagens.'
        - ''
        - '&7Atual: &f{item}'
        - ''
        - '&eEsquerdo para alterar'
        - '&eDireito para voltar ao original'
      Acoes: [ 'nome' ]
    quantidade:
      Slot: 21
      Material: CHEST
      Nome: '&aQuantidade por lote'
      Lore:
        - '&7Quantas unidades cada lote tem;'
        - '&7o preco e por lote.'
        - ''
        - '&7Atual: &f{quantidade}'
        - ''
        - '&eClique para alterar'
      Acoes: [ 'quantidade' ]
    abrir:
      Slot: 22
      Material: GRAY_DYE
      Nome: '&cLoja fechada'
      Lore:
        - '&7Ninguem consegue negociar'
        - '&7enquanto a loja esta fechada.'
        - ''
        - '&eClique para abrir'
      Acoes: [ 'alternar aberta' ]
    fechar:
      Slot: 22
      Material: LIME_DYE
      Nome: '&aLoja aberta'
      Lore:
        - '&7Os jogadores podem negociar.'
        - ''
        - '&eClique para fechar'
      Acoes: [ 'alternar aberta' ]
    holograma-ligar:
      Slot: 23
      Material: GRAY_DYE
      Nome: '&cHolograma desligado'
      Lore:
        - '&7Sem texto flutuante em cima do bau.'
        - ''
        - '&eClique para ligar'
      Acoes: [ 'alternar holograma' ]
    holograma-desligar:
      Slot: 23
      Material: LIME_DYE
      Nome: '&aHolograma ligado'
      Lore:
        - '&7Texto flutuante em cima do bau.'
        - ''
        - '&eClique para desligar'
      Acoes: [ 'alternar holograma' ]
    avisos-ligar:
      Slot: 24
      Material: GRAY_DYE
      Nome: '&cAvisos desligados'
      Lore:
        - '&7Voce nao e avisado das vendas'
        - '&7nem do estoque que acabou.'
        - ''
        - '&eClique para ligar'
      Acoes: [ 'alternar avisos' ]
    avisos-desligar:
      Slot: 24
      Material: LIME_DYE
      Nome: '&aAvisos ligados'
      Lore:
        - '&7Voce e avisado de cada negociacao'
        - '&7e quando o estoque acaba.'
        - ''
        - '&eClique para desligar'
      Acoes: [ 'alternar avisos' ]
    amigos:
      Slot: 25
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&aAmigos &7({amigos})'
      Lore:
        - '&7Quem pode abrir o bau desta'
        - '&7loja alem de voce.'
        - ''
        - '&eClique para gerenciar'
      Acoes: [ 'amigos' ]
    dinamico-ligar:
      Slot: 29
      Material: GRAY_DYE
      Nome: '&cPreco dinamico desligado'
      Lore:
        - '&7O preco sobe a cada compra, cai a'
        - '&7cada venda e volta ao normal com o'
        - '&7tempo.'
        - ''
        - '&eClique para ligar'
      Acoes: [ 'alternar dinamico' ]
    dinamico-desligar:
      Slot: 29
      Material: LIME_DYE
      Nome: '&aPreco dinamico ligado'
      Lore:
        - '&7Ajuste atual: &f{ajuste}'
        - '&7Compra por &f{preco_compra}&7, venda por &f{preco_venda}'
        - ''
        - '&eClique para desligar'
      Acoes: [ 'alternar dinamico' ]
    estoque:
      Slot: 30
      Material: ENDER_CHEST
      Nome: '&aAbrir o bau'
      Lore:
        - '&7Estoque: &f{estoque}'
        - '&7Espaco: &f{espaco}'
        - ''
        - '&eClique para abrir o bau daqui'
      Acoes: [ 'estoque' ]
    historico:
      Slot: 31
      Material: BOOK
      Nome: '&aHistorico'
      Lore:
        - '&7Vendidos: &f{vendidos} &8| &7Comprados: &f{comprados}'
        - ''
        - '&eClique para ver as ultimas negociacoes'
      Acoes: [ 'historico-loja' ]
    remover:
      Slot: 33
      Material: TNT
      Nome: '&cRemover loja'
      Lore:
        - '&7Apaga a loja. O que estiver no bau'
        - '&7continua la.'
        - ''
        - '&eClique para remover'
      Acoes: [ 'remover' ]
    fechar-menu:
      Slot: 40
      Material: ARROW
      Nome: '&cFechar'
      Acoes: [ 'fechar' ]

