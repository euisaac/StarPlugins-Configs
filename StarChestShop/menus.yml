# ---------------------------------------------------------------------------
#  Listas de lojas (/chestshop, /starchestshop lojas <jogador>, busca).
#  Cada loja e o item negociado. Na lore, {lore_teleporte} vira 'Lore
#  teleporte' quando o jogador pode teleportar, e {lore_dono} vira 'Lore
#  dono' quando ele pode configurar aquela loja. Extras: {total}, e na de
#  outro jogador {dono_lista}; na busca {busca} {modo}.
#  Esquerdo teleporta; direito configura; shift+direito abre/fecha.
# ---------------------------------------------------------------------------
Minhas lojas:
  Titulo: '&8Minhas lojas ({lojas}/{limite})'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '
  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43 ]
  Loja:
    Nome: '&a{item} &7(#{id})'
    Lore:
      - '&7Tipo: &f{tipo} &8| &7Estado: {estado}'
      - '&7Lote: &f{quantidade}x &8| &7Moeda: &f{moeda_nome}'
      - '&7Compra: &f{preco_compra} &8| &7Venda: &f{preco_venda}'
      - '&7Estoque: &f{estoque} &8| &7Espaco: &f{espaco}'
      - '&7Vendidos: &f{vendidos} &8| &7Comprados: &f{comprados}'
      - '&7Lugar: &f{mundo} {x}, {y}, {z}'
      - ''
      - '{lore_teleporte}'
      - '{lore_dono}'
    Lore teleporte:
      - '&eEsquerdo para ir ate a loja'
    Lore dono:
      - '&eDireito para configurar'
      - '&eShift + direito para abrir/fechar'
  Vazio:
    Mostrar: true
    Slot: 22
    Material: BARRIER
    Nome: '&cVoce nao tem lojas'
    Lore:
      - '&7Pregue uma placa num bau e escreva'
      - '&floja&7 na primeira linha.'
  Itens:
    anterior:
      Slot: 45
      Material: ARROW
      Nome: '&cAnterior'
      Acoes: [ 'anterior' ]
    proxima:
      Slot: 53
      Material: ARROW
      Nome: '&aProxima'
      Acoes: [ 'proxima' ]
    buscar:
      Slot: 48
      Material: COMPASS
      Nome: '&aBuscar lojas'
      Lore: [ '&7Onde comprar ou vender um item.' ]
      Acoes: [ 'buscar' ]
    top:
      Slot: 49
