# Encantamento da picareta. Copie o arquivo e troque os numeros para
# criar outro do mesmo tipo. Tudo aqui tambem se edita em /minaadmin.
Nome: '&bLaser'
Tipo: LASER
Descricao:
  - '&7Chance de disparar lasers'
  - '&7pela mina nos quatro sentidos.'
  - '&7Chance: &b{chance}%'
Icone: BLAZE_ROD
Ordem: 12
Ativado: true
Mostrar: true
Pode comprar: true
Nivel:
  Inicial: 0
  # 0 = sem limite.
  Maximo: 100
# Nivel minimo da picareta para comprar.
Nivel da picareta: 10
# Peso no sorteio quando a picareta sobe de nivel (0 = nunca sorteado).
Sorteio ao evoluir: 6
# Permissao para o efeito funcionar ('' = todos).
Permissao: ''
Custo:
  # Custo do nivel N para N+1 = (Base + Por nivel x N) x Multiplicador
  # (com Exponencial: x Multiplicador elevado a N). Moedas: money e pepitas.
  Base: ['money:15000', 'pepitas:150']
  Por nivel: ['money:15000', 'pepitas:300']
  Multiplicador: 1.0
  Exponencial: false
# Quanto do que foi pago volta ao desencantar (%).
Reembolso: 50
# Chance (%) de disparar a cada bloco = Base + Por nivel x nivel.
Chance:
  Base: 0.0
  Por nivel: 0.01
  Maxima: 100
# Espera (segundos) entre um disparo e outro do mesmo jogador.
Espera: 0
# O que os blocos quebrados pelo efeito rendem.
Ganhos:
  Dinheiro: true
  Pepitas: true
  Energia: true
  Recompensas: true
  LuckyBlock: false
  # Escala o dinheiro e as pepitas desses blocos (0.5 = metade).
  Fator: 1.0
Efeito:
  # Alcance de cada laser; -1 = ate a borda da mina.
  Raio: -1
  # Espessura (0 = uma fileira; 1 = 3x3).
  Espessura: 0
Mensagem:
  Actionbar: '&b&lLASER! &7+{blocos} blocos'
  Titulo: ''
  Chat: ''
  Som: 'ENTITY_GUARDIAN_ATTACK;0.6;1.4'
  Particula: 'FIREWORKS_SPARK'
