# Encantamento da picareta. Copie o arquivo e troque os numeros para
# criar outro do mesmo tipo. Tudo aqui tambem se edita em /minaadmin.
Nome: '&eTesouro'
Tipo: TESOURO
Descricao:
  - '&7Chance de achar um baú de dinheiro'
  - '&7(vale muitos blocos da mina).'
  - '&7Chance: &e{chance}%'
Icone: CHEST
Ordem: 16
Ativado: true
Mostrar: true
Pode comprar: true
Nivel:
  Inicial: 0
  # 0 = sem limite.
  Maximo: 100
# Nivel minimo da picareta para comprar.
Nivel da picareta: 5
# Peso no sorteio quando a picareta sobe de nivel (0 = nunca sorteado).
Sorteio ao evoluir: 6
# Permissao para o efeito funcionar ('' = todos).
Permissao: ''
Custo:
  # Custo do nivel N para N+1 = (Base + Por nivel x N) x Multiplicador
  # (com Exponencial: x Multiplicador elevado a N). Moedas: money e pepitas.
  Base: ['money:20000', 'pepitas:200']
  Por nivel: ['money:20000', 'pepitas:300']
  Multiplicador: 1.0
  Exponencial: false
# Quanto do que foi pago volta ao desencantar (%).
Reembolso: 50
# Chance (%) de disparar a cada bloco = Base + Por nivel x nivel.
Chance:
  Base: 0.0
  Por nivel: 0.01
  Maxima: 100
# Espera (segundos) entre um disparo e outro do mesmo jogador.
Espera: 0
# O que os blocos quebrados pelo efeito rendem.
Ganhos:
  Dinheiro: true
  Pepitas: true
  Energia: true
  Recompensas: true
  LuckyBlock: false
  # Escala o dinheiro e as pepitas desses blocos (0.5 = metade).
  Fator: 1.0
Efeito:
  # Vale X blocos da mina (pelo preco medio), com os bonus do jogador.
  Blocos: 150
  # Blocos a mais por nivel.
  Blocos por nivel: 5
Mensagem:
  Actionbar: '&e&lTESOURO! &7+{valor}'
  Titulo: ''
  Chat: ''
  Som: 'ENTITY_PLAYER_LEVELUP;0.8;1.6'
  Particula: 'VILLAGER_HAPPY'
