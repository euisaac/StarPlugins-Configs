# ============================================================
#   Boosters: itens que o jogador ativa com o clique direito
#   para ganhar bonus por um tempo. Um booster por vez (usar outro
#   igual soma o tempo).
#   Entregue com: /minaadmin booster dar <jogador> <id> [quantidade]
#   Booster para o servidor todo: /minaadmin booster global <dinheiro%> <pepitas%> <tempo>
# ============================================================
Boosters:
  dinheiro_30m:
    Material: BLAZE_POWDER
    Nome: '&6&lBooster de Dinheiro &7(30 min)'
    Lore:
      - '&7+{dinheiro}% de dinheiro nas minas'
      - '&7por &f{tempo}&7.'
      - ''
      - '&eClique direito para ativar.'
    Brilho: true
    Dinheiro: 50
    Pepitas: 0
    Tempo: 30m
  pepitas_1h:
    Material: GLOWSTONE_DUST
    Nome: '&e&lBooster de Pepitas &7(1 hora)'
    Lore:
      - '&7+{pepitas}% de pepitas nas minas'
      - '&7por &f{tempo}&7.'
      - ''
      - '&eClique direito para ativar.'
    Brilho: true
    Dinheiro: 0
    Pepitas: 100
    Tempo: 1h
  supremo:
    Material: NETHER_STAR
    Nome: '&d&lBooster Supremo &7(1 hora)'
    Lore:
      - '&7+{dinheiro}% de dinheiro'
      - '&7+{pepitas}% de pepitas'
      - '&7por &f{tempo}&7.'
      - ''
      - '&eClique direito para ativar.'
    Brilho: true
    Dinheiro: 100
    Pepitas: 100
    Tempo: 1h
