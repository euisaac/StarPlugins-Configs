    Menu:
      Slot: 20
      Material: DIAMOND_SWORD

    Pontos por acao: 1
    Alvos: []
    Ignorar:
      - 'ARMOR_STAND'

    Anti abuso:
      Ignorar mobs de spawner: true
      Ignorar modo criativo: true

    Agenda:
      Tipo: INTERVALO
      Intervalo: '7d'

    Anuncios:
      Top no menu: 3
      Avisar novo lider: true

    Premiacao:
      '1':
        Exibir: '&7 ⤷ &6#1 &f- &a9.000 coins'
        Mensagem: '&6&lTORNEIO! &fVoce venceu o torneio {torneio}&f!'
        Comandos:
          - 'eco give {jogador} 9000'
      '2-3':
        Exibir: '&7 ⤷ &6#2 e #3 &f- &a3.000 coins'
        Mensagem: '&6&lTORNEIO! &fVoce ficou em &6#{posicao} &fno {torneio}&f!'
        Comandos:
          - 'eco give {jogador} 3000'

  #  ──────────────────────────────────────────────────────────────────────
  #  Cacador de dragoes: um alvo so, e ele vale muito.
