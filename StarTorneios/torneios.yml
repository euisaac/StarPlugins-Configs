  #  ──────────────────────────────────────────────────────────────────────
  sortudo:
    Ativar: false
    Tipo: PERSONALIZADO
    Nome: '&6&lSORTUDO'
    Descricao:
      - '&7Pontos dados por eventos do servidor.'

    Menu:
      Slot: 32
      Material: NETHER_STAR

    Pontos por acao: 1

    Requisitos:
      Permissao: ''
      # Aqui a inscricao faz sentido: so participa quem quiser.
      Inscricao: true

    Agenda:
      Tipo: MANUAL

    Anuncios:
      Top no menu: 3
      Avisar o resultado: true

    Premiacao:
      '1':
        Exibir: '&7 ⤷ &6#1 &f- &a15.000 coins'
        Mensagem: '&6&lTORNEIO! &fVoce venceu o torneio {torneio}&f!'
        Comandos:
          - 'eco give {jogador} 15000'
