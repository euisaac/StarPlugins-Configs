    Tipo: QUEBRAR_BLOCO
    Nome: '&6&lLENHADOR'
    Descricao:
      - '&7Derrube arvores e junte madeira.'

    Menu:
      Slot: 14
      Material: OAK_LOG

    Pontos por acao: 1
    Alvos:
      - '*_LOG'
      - '*_WOOD'
      - 'LOG'
      - 'LOG_2'

    Anti abuso:
      Ignorar blocos colocados: true

    Agenda:
      Tipo: INTERVALO
      Intervalo: '7d'

    Anuncios:
      Top no menu: 3

    Premiacao:
      '1':
        Exibir: '&7 ⤷ &6#1 &f- &a8.000 coins'
        Mensagem: '&6&lTORNEIO! &fVoce venceu o torneio {torneio}&f!'
        Comandos:
          - 'eco give {jogador} 8000'
      '2-5':
        Exibir: '&7 ⤷ &6#2 ao #5 &f- &a2.000 coins'
        Mensagem: '&6&lTORNEIO! &fVoce ficou em &6#{posicao} &fno {torneio}&f!'
        Comandos:
          - 'eco give {jogador} 2000'

  #  ──────────────────────────────────────────────────────────────────────
  #  Fazendeiro: so planta no ponto de colher conta.
  #  ──────────────────────────────────────────────────────────────────────
  fazendeiro:
    Ativar: true
    Tipo: COLHER
    Nome: '&6&lFAZENDEIRO'
    Descricao:
      - '&7Colha plantacoes maduras.'
      - '&7Planta verde nao vale ponto.'

    Menu:
      Slot: 16
      Material: CARROT

    Pontos por acao: 1
    Alvos: []

    Anti abuso:
      # Aqui o replantio e normal, entao o bloco colocado continua contando.
      Ignorar blocos colocados: false
      Ignorar modo criativo: true

    Agenda:
      Tipo: SEMANAL
      Dia: SABADO
      Hora: '20:00'

    Anuncios:
      Top no menu: 3

    Premiacao:
      '1':
        Exibir: '&7 ⤷ &6#1 &f- &a6.000 coins'
        Mensagem: '&6&lTORNEIO! &fVoce venceu o torneio {torneio}&f!'
        Comandos:
          - 'eco give {jogador} 6000'
      '2-3':
        Exibir: '&7 ⤷ &6#2 e #3 &f- &a2.500 coins'
        Mensagem: '&6&lTORNEIO! &fVoce ficou em &6#{posicao} &fno {torneio}&f!'
        Comandos:
          - 'eco give {jogador} 2500'

  #  ──────────────────────────────────────────────────────────────────────
  #  Cacador: mobs em geral, sem os de spawner.
  #  ──────────────────────────────────────────────────────────────────────
