  boss_capitao:
    Nome: 'Motim no Navio'
    Descricao: 'Derrote o Capitão Etéreo.'
    Categoria: bosses
    Icone: timao_etereo
    Tipo: BOSS
    Alvo: capitao
    Quantidade: 1
