  boss_nevasca:
    Nome: 'Degelo'
    Descricao: 'Derrote o Espírito da Nevasca.'
    Categoria: bosses
    Icone: gelo_eterno
    Tipo: BOSS
    Alvo: nevasca
    Quantidade: 1
    Recompensas: [ 'gelo_eterno 100% 6' ]
  boss_herdeiro:
    Nome: 'O Herdeiro Caído'
    Descricao: 'Derrote o Herdeiro do Trono.'
    Categoria: bosses
    Icone: coracao_do_herdeiro
    Tipo: BOSS
    Alvo: herdeiro
