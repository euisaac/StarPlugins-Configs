  Substituir endermen (%): 45
  # Nao troca se ja houver tantos mobs do StarNovoEND num raio de 24 blocos.
  Maximo por area: 6
  # Drops: "<item> <chance>% <min>-<max>" (item do StarNovoEND ou material vanilla).
