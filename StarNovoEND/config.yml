# ------------------------------------------------------- ilha principal
# O Trono Partido: a ilha do dragao refeita (so em chunks gerados depois de
# instalar; para ver numa ilha que ja existe, o End precisa ser resetado).
Ilha principal:
  Ativa: true
  # Anel de agulhas de pedra do End e obsidiana na borda da ilha.
  Coroa: true
  # Ilhotas flutuantes em volta (algumas com ruinas e bau).
  Arquipelago: true
  # Pontas de pedra penduradas embaixo da ilha.
  Estalactites: true
  # Veios de obsidiana chorona saindo do portal.
  Veios: true
  # Tabela do loot.yml dos baus das ruinas ('' = sem bau).
  Bau das ruinas: trono
  # Coroa orbital sobre o portal, halos nos pilares, espiral e estrelas cadentes.
  # Uma tarefa leve que so existe enquanto ha alguem no End.
  Animacoes: true
  # Catacumbas do Trono: tuneis dentro da ilha (anel, 3 entradas, 5 santuarios e
  # armadilhas). So em chunk novo; num End ja gerado: /novoend admin ilha catacumbas
  Catacumbas: true
  # Praca do Trono (Forja Estelar + Mercador do Vazio) 56 blocos ao norte do portal.
  # So em chunk novo; num End ja gerado: /novoend admin ilha forja
  Forja: true
  # Ponte Estelar: mirante na plataforma de chegada (100, 48, 0) e ponte ate a ilha.
  # Feita sozinha quando alguem entra no End; refazer: /novoend admin ilha ponte
  Ponte de chegada: true

# ----------------------------------------------------------------- catacumbas
Catacumbas:
  Armadilhas:
    Ativas: true
    Dano das flechas: 4
    Flechas por parede: 3
    Dano das chamas: 2
    Dano do sopro: 2
    Dano do desabamento: 6
    Recarga (segundos): 4
  # Santuario: chegou perto, os guardioes acordam. Todos mortos = o cofre abre
  # (com a Chave do Trono, uma vez por jogador por ciclo). Depois sela e espera
  # a recarga para os guardioes voltarem.
  Santuarios:
    Ativos: true
    Guardioes: [ guarda_purpur, besteiro_cidadela, penitente_eclipse, vigia_do_eco ]
    Guardioes por onda: 4
    Guardioes por jogador extra: 1
    Maximo de guardioes: 8
    Chance da chave (%): 20
    Garantir uma chave por onda: true
    Tempo aberto (minutos): 10
    Recarga (minutos): 30
    # Sem ninguem perto por 1 minuto ou passado este tempo, a onda some.
    Tempo limite (segundos): 300
  # Camara do Herdeiro: embaixo do portal, no fim da escadaria a oeste do anel.
  # O Portao Selado abre com o Selo do Herdeiro (5 Fragmentos do Selo na Forja)
  # e acorda o boss Herdeiro do Trono (Bosses.herdeiro).
  Camara:
    Ativa: true

# ----------------------------------------------------------------- mercador
# Mercador do Vazio: nasce ao lado da Forja da ilha (ou /novoend admin ilha mercador).
# '<item> <qtd> [+ <item> <qtd>] -> <item> <qtd>' (ids do StarNovoEND ou materiais).
Mercador:
  Ativo: true
  Trocas:
    - 'escama_draconica 2 -> ENDER_PEARL 16'
    - 'escama_draconica 3 -> EXPERIENCE_BOTTLE 16'
    - 'escama_draconica 4 -> SHULKER_SHELL 1'
    - 'escama_draconica 6 + prisma_do_trono 1 -> chave_do_trono 1'
    - 'prisma_do_trono 2 -> fragmento_do_selo 1'
    - 'escama_draconica 8 -> DRAGON_BREATH 4'
    - 'fragmento_cometario 16 -> escama_draconica 1'
    - 'poeira_nebulosa 32 -> escama_draconica 1'

# ----------------------------------------------------------------- raia eterea
# Montaria voadora do End: um ghast feliz com arreio, chamado e guardado pelo
# Sino da Raia (feito na Forja Estelar). Uma por jogador; some quando o dono sai
# do End ou do servidor. O voo e o controle sao do proprio jogo.
Raia:
  Ativa: true
  Somente no End: true
  # Ghast feliz vanilla = 0.05.
  Velocidade de voo: 0.09
  Vida: 40
  Escala: 0.85
  Invulneravel: true
  Arreio: PURPLE_HARNESS
  Recarga (segundos): 5

# ----------------------------------------------------------------- eventos
Eventos:
  # Invasao do Vazio: fendas se abrem no chao da ilha principal e soltam mobs em
  # ondas. Cada fenda fecha quando a cota de invasores dela morre. Todas seladas =
  # vitoria, com premio por participacao. Na hora: /novoend admin evento invasao
  Invasao do vazio:
    Ativa: true
    A cada (minutos): 90
    # Jogadores (sobrevivencia) a ate 150 blocos do portal para comecar sozinha.
    Minimo de jogadores na ilha: 2
    Fendas: 4
    Abates por fenda: 12
    Mobs vivos por fenda: 4
    Segundos entre reforcos: 3
    Duracao maxima (minutos): 8
    Mobs: [ guarda_purpur, besteiro_cidadela, penitente_eclipse, andarilho_nebuloso, sextante, rastro_umbral ]
    Abates minimos para premio: 3
    Recompensa: [ 'escama_draconica 100% 1-2', 'poeira_nebulosa 100% 6-10', 'fragmento_do_selo 25% 1', 'EXPERIENCE_BOTTLE 100% 4-8' ]
    Recompensa do melhor: [ 'prisma_do_trono 100% 1', 'chave_do_trono 50% 1' ]

  # Chuva de Meteoros: caem perto de quem esta nas ilhas de fora. A cratera troca a
  # pedra do End por Rocha Cometaria e obsidiana (nada e quebrado) e solta a tabela
  # 'meteoro' do loot.yml. Comeca na hora: /novoend admin evento meteoros
  Chuva de meteoros:
    Ativa: true
    A cada (minutos): 60
    Duracao (segundos): 120
    Segundos entre quedas: 12
    Minimo de jogadores no End: 2
    Longe do centro (blocos): 250
    Distancia minima: 8
    Distancia maxima: 24
    Raio da cratera: 2
    Dano do impacto: 8
    Experiencia: 60

# ----------------------------------------------------------------- forja
Forja:
  Ativa: true
  # true = a bancada e a mesa de ferraria nao fazem os itens do StarNovoEND
  # (so a Forja). As receitas continuam as mesmas.
  Receitas so na forja: false
  # O item base (espada, elitro, armadura vanilla) passa os encantamentos para o novo.
  Manter encantamentos: true
  # Receitas que so a Forja faz: <item>: [ '<ingrediente> <quantidade>', ... ]
  Receitas exclusivas:
    elitro_do_trono: [ 'ELYTRA 1', 'escama_draconica 8', 'prisma_do_trono 2', 'NETHERITE_INGOT 1' ]
    coroa_do_trono: [ 'NETHERITE_HELMET 1', 'escama_draconica 6', 'prisma_do_trono 2', 'DRAGON_BREATH 4' ]
    lamina_draconica: [ 'NETHERITE_SWORD 1', 'escama_draconica 6', 'prisma_do_trono 3', 'DRAGON_BREATH 2' ]
    chave_do_trono: [ 'escama_draconica 3', 'prisma_do_trono 1', 'ECHO_SHARD 1' ]
    selo_do_herdeiro: [ 'fragmento_do_selo 5', 'escama_draconica 2' ]
    orbe_do_herdeiro: [ 'coracao_do_herdeiro 1', 'prisma_do_trono 2', 'ENDER_EYE 4' ]
    sino_da_raia: [ 'BELL 1', 'GHAST_TEAR 2', 'escama_draconica 4', 'prisma_do_trono 1' ]

# ----------------------------------------------------------------- gateways
Gateways:
  # Anel orbital, varetas e plataforma nos gateways que aparecem a cada dragao morto.
  Decorar: true
  # Gateway de saida (ilhas de fora): escada em espiral do chao ate ele.
  Escada nas saidas: true

# ----------------------------------------------------------------- dragao
Dragao:
  # false = dragao vanilla (sem fases, ataques novos nem recompensa).
  Ativo: true
  # Vida do dragao (vanilla = 200, maximo 1024).
  Vida: 350
  Fase 2 (%): 66
  Fase 3 (%): 33
  # Fase 4: a Furia do Trono (Furia.Ativa: false = so 3 fases).
  Fase 4 (%): 15
  # Estilhacos caem do ceu nos jogadores (aviso vermelho no chao antes).
  Chuva de estilhacos:
    Ativa: true
    Intervalo (segundos): 24
    Intervalo na fase 3 (segundos): 14
    Maximo de estilhacos: 6
    Dano: 7
    Raio: 3.2
  # Na fase 2 o dragao reacende cristais em pilares vazios.
  Renascer dos cristais:
    Ativo: true
    Quantidade: 3
  # Ao pousar no portal: anel que se expande pelo chao. Quem pular escapa.
  Pulso do vazio:
    Ativo: true
    A partir da fase: 2
    Alcance: 34
    Dano: 8
  # Na fase 3, ao pousar, chama mobs do StarNovoEND para ajudar.
  Sentinelas:
    Ativas: true
    Mobs: [ sextante, penitente_eclipse ]
    Por pouso: 2
    Maximo vivas: 4
  # Fase 2: Torres Ressonantes. Enquanto houver torre de pe o dragao leva menos
  # dano e se cura. Fique na base (circulo no chao) para derrubar a torre.
  Torres:
    Ativas: true
    Na fase: 2
    Quantidade: 3
    Altura: 14
    Raio da captura: 3.5
    Segundos para capturar: 10
    Reducao de dano (%): 75
    Cura por torre (por segundo): 0.5
    # Para quem ajudou a derrubar cada torre.
    Recompensa: [ 'prisma_do_trono 100% 1', 'poeira_nebulosa 60% 2-4' ]
  # Fase 3: Eclipse. Raios marcados no chao e Fendas do Vazio que puxam.
  Eclipse:
    Ativo: true
    Raios a cada (segundos): 8
    Raios por vez: 3
    Dano do raio: 6
    Fendas a cada (segundos): 16
    Duracao da fenda (segundos): 5
    Forca da fenda: 0.35
    Dano da fenda: 2
  # Fase 4: Furia do Trono. O dragao absorve os cristais que sobraram, solta
  # bolas de fogo e o chao explode em zonas marcadas.
  Furia:
    Ativa: true
    Cura por cristal absorvido: 12
    Rajada a cada (segundos): 6
    Bolas por rajada: 3
    Chao instavel a cada (segundos): 10
    Zonas por vez: 5
    Dano da zona: 7
  # Recompensa por dano (como os bosses). O vanilla continua dando o XP dele.
  Minimo de dano (%): 5
  Experiencia extra: 1500
  Drops participantes: [ 'fragmento_cometario 100% 2-4', 'poeira_nebulosa 100% 4-8', 'escama_draconica 100% 2-4', 'DIAMOND 60% 1-3', 'chave_do_trono 25% 1' ]
  Drops do melhor: [ 'NETHERITE_SCRAP 100% 1-2', 'escama_draconica 100% 2' ]
  Comandos participantes: []
  # O vanilla so poe o ovo na primeira morte; true = ovo novo a cada morte.
  Ovo a cada morte: true

# ----------------------------------------------------------------- desafio semanal
# A cada semana (segunda a domingo) a luta do dragao ganha um modificador, em
# rodizio. "Ajustes" usa as MESMAS chaves da secao Dragao (aninhadas como la) e
# vale so naquela semana; "Recompensa extra" vai para quem ganha premio do dragao.
# Forcar: id de um modificador para fixar ('' = rodizio). /novoend desafio mostra a semana.
Desafios:
  Ativo: true
  Forcar: ''
  Modificadores:
    tempestade:
      Nome: '&#ffe25cSemana da Tempestade'
      Descricao: 'O Eclipse começa desde o início: raios e fendas a luta toda.'
      Ajustes:
        Fase 3 (%): 100
        Eclipse:
          Raios a cada (segundos): 6
      Recompensa extra: [ 'escama_draconica 100% 2', 'fragmento_cometario 100% 4' ]
    blindado:
      Nome: '&#d58bffSemana Blindada'
      Descricao: '5 Torres Ressonantes, escudo de 85%.'
      Ajustes:
        Torres:
          Quantidade: 5
          Reducao de dano (%): 85
          Segundos para capturar: 8
      Recompensa extra: [ 'prisma_do_trono 100% 1', 'escama_draconica 100% 1' ]
    furia:
      Nome: '&#ff3b2fSemana da Fúria'
      Descricao: 'A Fúria do Trono começa em 35% da vida, com rajadas mais rápidas.'
      Ajustes:
        Fase 4 (%): 35
        Furia:
          Rajada a cada (segundos): 4
      Recompensa extra: [ 'escama_draconica 100% 3' ]
    estilhacos:
      Nome: '&#ff9a4dSemana dos Estilhaços'
      Descricao: 'A Chuva de Estilhaços cai no dobro, o tempo todo.'
      Ajustes:
