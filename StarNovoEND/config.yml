# ============================================================
#  StarNovoEND - configuracao
#
#  Expansao original do End: 12 regioes, 22 estruturas, End Cities reformadas,
#  6 bosses com fases e 1 miniboss, 18 mobs, 59 itens com textura propria,
#  6 encantamentos e o Trono Partido (dragao em 4 fases, Catacumbas, Forja
#  Estelar e gateways novos). Tudo por evento: sem tarefa global por tique.
#  Quase tudo daqui tambem muda no jogo: /novoend admin painel Nomes e textos dos itens ficam no
#  itens.yml; o conteudo dos baus no loot.yml; altares, pesca no vazio,
#  caldeirao e marcos no mecanicas.yml; as mensagens no mensagens.yml.
#  Mudou algo? /novoend admin recarregar
# ============================================================

# Mensagens extras no console para investigar problemas.
Debug: false

Banco de dados:
  # SQLITE (arquivo local) ou MYSQL
  Tipo: SQLITE
  IP: localhost
  Porta: 3306
  Banco: starnovoend
  Usuario: root
  Senha: ''
  Prefixo: 'novoend_'

Comandos:
  # Primeiro = nome do comando; os outros = apelidos.
  Principal: [novoend, firmamento]

# Mundos do tipo End que recebem a expansao. Vazio = todos os Ends.
Mundos: []

# ------------------------------------------------------------------ mundo
Regioes:
  # Ate esta distancia do centro fica tudo vanilla (ilha do dragao e o vazio em volta).
  Raio da ilha central: 1000
  # Tamanho medio de cada regiao (em blocos).
  Tamanho das regioes: 640
  # A partir destas distancias as regioes perigosas (Fossa, Campos de Cobre, Ermo do Eco...) ficam mais comuns.
  Distancia media: 3000
  Distancia longe: 6000

Estruturas:
  # false = so a decoracao e os biomas, sem estruturas novas.
  Gerar: true
  # Espacamento: em media 1 estrutura a cada N x N chunks (do tipo e da regiao certa).
  forja_cometaria: { Ativa: true, Espacamento (chunks): 30 }
  planetario_suspenso: { Ativa: true, Espacamento (chunks): 30 }
  santuario_do_eclipse: { Ativa: true, Espacamento (chunks): 20 }
  estacao_do_cartografo: { Ativa: true, Espacamento (chunks): 22 }
  observatorio_tombado: { Ativa: true, Espacamento (chunks): 12 }
  sonda_abandonada: { Ativa: true, Espacamento (chunks): 16 }
  destrocos_de_cometa: { Ativa: true, Espacamento (chunks): 7 }
  # segunda leva
  ossuario_do_eco: { Ativa: true, Espacamento (chunks): 18 }
  navio_celeste_encalhado: { Ativa: true, Espacamento (chunks): 26 }
  camara_ressonante: { Ativa: true, Espacamento (chunks): 16 }
  mirante_congelado: { Ativa: true, Espacamento (chunks): 16 }
  cogumelo_habitado: { Ativa: true, Espacamento (chunks): 14 }
  oasis_perdido: { Ativa: true, Espacamento (chunks): 16 }
  ruinas_da_mare: { Ativa: true, Espacamento (chunks): 16 }
  ermida_estelar: { Ativa: true, Espacamento (chunks): 18 }
  palafita_do_pescador: { Ativa: true, Espacamento (chunks): 12 }
  relicario_flutuante: { Ativa: true, Espacamento (chunks): 18 }
  jaula_do_vazio: { Ativa: true, Espacamento (chunks): 13 }
  fossil_colossal: { Ativa: true, Espacamento (chunks): 12 }
  acampamento_errante: { Ativa: true, Espacamento (chunks): 13 }
  # quarta leva: arenas dos bosses novos
  catedral_de_cristal: { Ativa: true, Espacamento (chunks): 26 }
  clareira_micelica: { Ativa: true, Espacamento (chunks): 26 }

# ------------------------------------------------------------------- mobs
Mobs:
