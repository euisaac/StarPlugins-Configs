      Dano: 6
      Escala: 1.0
      Peso: 60
      Experiencia: 8
      Drops: [ 'poeira_nebulosa 70% 1-2', 'ENDER_PEARL 25% 1' ]
      Habilidade: { Chance de teleporte (%): 30 }
