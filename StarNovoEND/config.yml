# -------------------------------------------------------------- End Cities
# A estrutura vanilla continua igual; a reforma acontece quando um chunk NOVO
# com End City carrega (uma vez por chunk). Num mundo ja explorado, use
# /novoend admin cidade dentro de uma cidade para reformar aquele chunk.
Cidades:
  Ativa: true
  # true = tambem reforma chunks de cidade ja gerados e quase nao visitados.
  Reformar cidades ja geradas: false
  Decoracao:
    Chance na parede (%): 12
    Chance de tapete (%): 6
    Chance de lanterna no teto (%): 4
  # Gerador de Guardas de Purpur ou Besteiros num comodo alto.
  Gerador:
    Chance por chunk (%): 30
  # Cofre ao lado dos baus da cidade: abre com o Selo de Purpur, uma vez por jogador.
  Arca selada:
    Chance por bau (%): 40
  # Itens da tabela "cidade" do loot.yml somados aos baus vanilla da End City.
  Loot extra nos baus: true
  Navio:
    # O elitro fica preso na moldura ate o Capitao Etereo cair (criativo ignora).
    Capitao guarda o elitro: true
  Shulkers:
    # A bala de shulker levita por no maximo isto; depois vem queda lenta. 0 = vanilla.
    Levitacao maxima (segundos): 3
    Queda lenta depois (segundos): 3

# ---------------------------------------------------------------- receitas
# Coloque "<id do item>: false" para tirar uma receita (ex.: cetro_cometario: false).
Receitas: {}
# false = as receitas nao aparecem no livro de receitas (o jogador precisa descobrir sozinho).
Mostrar receitas no livro: true

# ------------------------------------------------------------- cartografo
# Trocas do Cartografo Celeste (NPC das Estacoes): "<item qtd> [+ <item qtd>] -> <item qtd>".
Cartografo:
  Trocas:
    - 'poeira_nebulosa 12 -> EMERALD 2'
    - 'fragmento_cometario 6 -> EMERALD 3'
    - 'EMERALD 8 + COMPASS 1 -> astrolabio 1'
    - 'EMERALD 6 + fragmento_cometario 2 -> ancora_gravitacional 1'
    - 'EMERALD 3 -> fruto_orbita 4'
    - 'essencia_umbral 8 + EMERALD 4 -> vela_eclipse 1'

# Textos que aparecem no Diario de Bordo (um sorteado por livro).
Diario de bordo:
  Paginas:
    - "&0Dia 211.\n\nA sonda caiu perto de um campo rosado. Os instrumentos giram sozinhos. Achei pedras mornas numa cratera: ainda pulsam."
    - "&0Dia 214.\n\nOuvi um sino na Fossa. Alguém acende velas num altar de pedra negra. Quando o halo dourado gira, tudo escurece."
    - "&0Dia 219.\n\nVi luas presas em anéis de luz, no alto de uma torre branca. A chave deve abrir o caminho até a Tecelã."
    - "&0Dia 230.\n\nO coração da estrela é de cobre. Os autômatos guardam a Forja. Dizem que o raio é o único que o Colosso teme."

# ---------------------------------------------------------------- textura
Textura:
  # Ao ligar, exporta o pacote de textura:
  #   AUTO               zip em plugins/StarNovoEND/pacote/ + ItemsAdder e StarResourcePacks se estiverem instalados.
  #                      Com o StarResourcePacks o pacote e reconstruido e reenviado sozinho.
  #   ITEMSADDER / STARRESOURCEPACKS / TODOS / NENHUM (so o zip)
  Exportar para: AUTO
  Exportar ao ligar: true
  # Versao Bedrock (Geyser): StarNovoEND-bedrock.mcpack + StarNovoEND-geyser.json sempre em
  # plugins/StarNovoEND/pacote/ (instrucoes no LEIA-ME-BEDROCK.txt de la). Alem disso:
  #   AUTO         copia o mapeamento para plugins/Geyser-*/custom_mappings e o .mcpack para o
  #                StarTextura (texturas/) ou, sem ele, para plugins/Geyser-*/packs
  #   GEYSER / STARTEXTURA / NENHUM (so a pasta pacote/)
  # Geyser no proxy? Copie os dois arquivos de pacote/ para la (o Geyser precisa reiniciar).
  Bedrock: AUTO

# Bosses com modelo animado (ossos + animacoes por keyframe feitas no Blockbench, estilo
# ModelEngine, sem plugin extra): um item_display por osso, montado no boss. O servidor
# so manda a pose de cada osso a cada "Quadro" e o cliente interpola o resto. Sem
# jogador a menos de 64 blocos, nada e calculado. Boss sem arquivo em animacao/ (no jar
# ou em plugins/StarNovoEND/animacao/<boss>.json) fica com o modelo parado, como antes.
# Jogadores Bedrock (Geyser) nao veem item_display: desligue aqui se for o caso.
Animacao dos bosses:
  Ativa: true
  # tiques entre atualizacoes dos ossos (2 = mais suave; 4 = metade dos pacotes)
  Quadro (tiques): 2
  # tiques de transicao ao trocar de animacao (andar -> ataque...)
  Mistura (tiques): 4
  # desligar so um boss: <id>: false (arauto, tecela, colosso, monarca, matriarca, nevasca, capitao, herdeiro)
  herdeiro: true
