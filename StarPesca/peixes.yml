# Entra no lugar da linha {lore} do Item quando o peixe esta na sacola.
Lore da sacola:
  - ''
  - ' &7Nivel: &f{nivel}'
  - ' &7Raridade: {raridade}'
  - ' &7Peso: &f{peso}g'
  - ' &7Quantidade: &f{quantidade}'
  - ''
  - ' &7Valor unitario: &f{valor_unitario}'
  - ' &7Valor total: &a{valor}'
  - ''
  - '&aClique para vender'

# Entra no lugar da linha {lore} do Item na colecao.
Lore da colecao:
  Pescado:
    - ''
    - ' &7Nivel: &f{nivel}'
    - ' &7Peso: &f{peso_minimo}g a {peso_maximo}g'
    - ' &7Perolas: &f{perolas_minimo} a {perolas_maximo}'
    - ''
    - ' &aPescados: &f{pescados}'
    - ' &aMaior peso: &f{maior_peso}g'
    - ' &aRaridades: &f{raridades}'
  Nao pescado:
    - ''
    - ' &7Nivel: &f{nivel}'
    - ' &7Peso: &f{peso_minimo}g a {peso_maximo}g'
    - ''
    - ' &cVoce ainda nao pescou este peixe.'
    - ' &7Dica: &f{dica}'
  # Item mostrado no lugar do peixe que ainda nao foi pescado (vazio = o
  # proprio item do peixe, com a lore de 'Nao pescado').
  Material nao pescado: 'GRAY_DYE'

