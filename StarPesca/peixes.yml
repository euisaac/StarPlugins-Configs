# ==========================================================================
#  StarPesca - peixes e raridades
#
#  Cada peixe tem um Nivel: so aparece para quem tem vara daquele nivel ou
#  maior (config.yml -> Pesca.Peixes acima do nivel muda isso). Dentro dos
#  peixes disponiveis, a Chance decide qual vem (e um peso relativo, nao uma
#  porcentagem) -- e os peixes do nivel da vara pesam mais que os de baixo.
#
#  Peso em gramas, sorteado entre Minimo e Maximo. Um peixe mais pesado do
#  que a vara suporta escapa (ou quebra a vara, conforme a vara).
#
#  Valor de venda = Base + (Por grama x peso), multiplicado pela raridade e
#  pelos bonus do jogador. 'Precos' e por economia do economias.yml -- um
#  peixe pode ser vendido em mais de uma (o jogador recebe todas).
#
#  Condicoes (opcional): o peixe so aparece quando todas valem.
#    Noite: true      so a noite (13000 a 23000 do relogio do mundo)
#    Dia: true        so de dia
#    Chuva: true      so chovendo
#    Biomas: [...]    so nos biomas da lista (nome do jogo, ex. OCEAN)
#    Mundos: [...]    so nos mundos da lista
#
#  Raridades (opcional, por peixe): lista 'chance,raridade' que troca as
#  chances gerais. Ex.: [ '90,comum', '10,raro' ].
#
#  Item: como o peixe aparece nos menus (sacola, colecao). A linha {lore}
#  vira a 'Lore da sacola' ou a 'Lore da colecao'. Substituicoes:
#    {nome} {nivel} {raridade} {peso} {quantidade} {valor} {valor_unitario}
#    {peso_minimo} {peso_maximo} {perolas_minimo} {perolas_maximo}
#    {pescados} {maior_peso} {raridades} {dica}
#
#  Raridades gerais: Chance e a porcentagem base; Multiplicador multiplica o
#  valor; Pontos contam no torneio de raridade. Mensagens vazias nao saem.
#  Nas mensagens: {jogador} {peixe} {peso} {raridade} {nivel} {perolas}.
# ==========================================================================

