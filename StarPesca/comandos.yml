# ==========================================================================
#  StarPesca - nomes dos comandos
#
#  Aqui voce troca o nome dos comandos e acrescenta apelidos, sem mexer no
#  jar. Separe com | -- o primeiro e o nome principal e o resto vira apelido.
#
#  Os nomes que ja vem no plugin (/pesca, /perolas e /starpesca, com os
#  apelidos deles) continuam funcionando de qualquer jeito. Deixe a linha
#  vazia para nao registrar nada a mais.
#
#  Exemplo: comandos.pesca: 'pesca|pescar|fishing'
# ==========================================================================

Versao do modelo: 1

comandos:
  pesca: ''
  perolas: ''
  starpesca: ''
