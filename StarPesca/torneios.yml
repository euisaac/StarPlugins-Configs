# ==========================================================================
#  StarPesca - torneios
#
#  Duas categorias, que valem AO MESMO TEMPO (o mesmo peixe conta nas duas):
#    Torneio do Mes     vai ate o fim do mes, premio maior (Categorias.Mensal)
#    Evento de Torneio  breve, de 1 a 2 horas, pela Agenda (Categorias.Evento)
#  Comeca pelo /starpesca torneio iniciar <tipo> [vara] [duracao] [mensal|evento]
#  ou sozinho (Agenda e Categorias.Mensal.Automatico). Sem dizer a categoria,
#  duracao de um dia ou mais e o do mes; mensal sem duracao vai ate o fim do mes.
#  Ao terminar, as posicoes da categoria recebem as recompensas; sem
#  participante nao ha vencedor.
#
#  Tipos:
#    PESO        vence quem pescar o peixe mais pesado
#    QUANTIDADE  vence quem pescar mais peixes
#    RARIDADE    vence quem somar mais pontos de raridade (peixes.yml)
#    VALOR       vence quem pescar peixes que somem mais valor de venda
#
#  Vara (opcional, depois do tipo):
#    vara_do_player    cada um pesca com a propria vara (padrao)
#    vara_zerada       todos com a vara inicial, que evolui durante o torneio
#    vara_sem_upgrade  todos com a vara inicial, sem evoluir
#  Ex.: /starpesca torneio iniciar quantidade vara_zerada 30
#
#  Recompensas: Perolas, Economias (por economia do economias.yml) e
#  Comandos ({jogador}). Duracao em minutos.
#  Nas mensagens: {tipo} {tempo} {premio} {jogador} {valor} e
#  {1_nome} {1_valor} ... {3_nome} {3_valor}.
# ==========================================================================

Versao do modelo: 1

# Nome de cada tipo nas mensagens e menus.
Tipos:
  PESO:
    Nome: 'Peixe mais pesado'
    Descricao: 'Vence quem pescar o peixe mais pesado.'
    Unidade: 'g'
  QUANTIDADE:
    Nome: 'Mais peixes'
    Descricao: 'Vence quem pescar mais peixes.'
    Unidade: ' peixes'
  RARIDADE:
    Nome: 'Raridade'
    Descricao: 'Vence quem somar mais pontos de raridade.'
    Unidade: ' pontos'
  VALOR:
    Nome: 'Maior valor'
    Descricao: 'Vence quem somar mais valor em peixes.'
    Unidade: ''

# Duracao padrao (minutos) quando o comando nao diz.
Duracao: 30

# Categorias. Sem esta secao: o Evento usa as Posicoes abaixo e o do Mes usa o
# premio de fabrica (top 5: 2000/1200/800/400/200 perolas e 250k/150k/100k/50k/25k).
Categorias:
  Mensal:
    Nome: 'Torneio do Mes'
    # Sempre um valendo: comeca sozinho quando nao ha nenhum (ate o fim do mes).
    Automatico: true
    # Tipos sorteados para o do mes (vazio = todos) e a vara.
    Tipos: [ QUANTIDADE, PESO, VALOR, RARIDADE ]
    Vara: vara_do_player
    Posicoes:
      1:
        Perolas: 2000.0
        Economias:
          money: 250000.0
        Comandos: [ ]
      2:
        Perolas: 1200.0
        Economias:
          money: 150000.0
        Comandos: [ ]
      3:
        Perolas: 800.0
        Economias:
          money: 100000.0
        Comandos: [ ]
      4:
        Perolas: 400.0
        Economias:
          money: 50000.0
        Comandos: [ ]
      5:
        Perolas: 200.0
        Economias:
          money: 25000.0
        Comandos: [ ]
  Evento:
    Nome: 'Evento de Torneio'
    # (Posicoes do evento: as Posicoes logo abaixo.)

# Posicao -> recompensa do Evento de Torneio. {premio} nas mensagens e a soma do 1o lugar.
Posicoes:
  1:
    Perolas: 300.0
    Economias:
      money: 25000.0
    Comandos: [ ]
  2:
    Perolas: 150.0
    Economias:
      money: 10000.0
    Comandos: [ ]
  3:
    Perolas: 75.0
    Economias:
      money: 5000.0
    Comandos: [ ]

# As varas do torneio: nome e descricao nas mensagens e menus.
Varas:
  vara_do_player:
    Nome: 'Vara do jogador'
    Descricao: 'Cada um pesca com a propria vara.'
  vara_zerada:
    Nome: 'Vara zerada'
    Descricao: 'Todos comecam com a vara inicial e evoluem durante o torneio.'
    # TORNEIO = evolui na loja de varas pagando com as perolas ganhas NESTE
    #           torneio (o custo em perolas de cada vara; o saldo de perolas
    #           da pessoa nao e tocado).
    # NORMAL  = evolui pagando o custo normal da loja de varas.
    Evoluir com: TORNEIO
  vara_sem_upgrade:
    Nome: 'Vara sem upgrade'
    Descricao: 'Todos pescam com a vara inicial, sem evoluir.'
    # Peso suportado infinito: nenhum peixe escapa por peso (bom para torneio
    # de PESO, ja que todos estao com a vara inicial).
    Peso infinito: true
    # Sorteia peixes de todos os niveis (cada um pela propria chance), senao a
    # vara inicial so pegaria peixe pequeno.
    Todos os peixes: true
    # Iscas nao podem ser compradas nem ativadas, e a que ja estava ativa fica
    # suspensa (nao vale e nao gasta) ate o torneio acabar.
    Bloquear iscas: true
    # O bonus da classe nao vale durante o torneio.
    Ignorar classe: true
    # Boosters (o proprio e o global) nao valem e nao podem ser ativados
    # durante o torneio. O tempo de um booster ja ativo continua correndo.
    Ignorar boosters: true

# Holograma do torneio: marque o lugar com /starpesca torneio holograma
# (e tire com /starpesca torneio holograma remover). O Torneio do Mes fica em
# cima e o evento embaixo (sem evento, quanto falta para o proximo). So aparece
# com algum torneio valendo e se atualiza a cada 2 segundos.
# Variaveis: {categoria} {tipo} {descricao} {vara} {tempo} {premio} {participantes}
# {1_nome} {1_valor} {2_nome} {2_valor} {3_nome} {3_valor}
Holograma:
  Mensal:
    Linhas:
      - '&6&l✦ TORNEIO DO MES ✦'
      - '&f{tipo} &7| &f{vara}'
      - '&7Acaba em &e{tempo}'
      - '&6&l1o &f{1_nome} &7- &e{1_valor}'
      - '&7&l2o &f{2_nome} &7- &e{2_valor}'
      - '&c&l3o &f{3_nome} &7- &e{3_valor}'
      - '&7Participantes: &f{participantes} &8| &7Premio: &f{premio}'
  Evento:
    Linhas:
      - '&d&l⚡ EVENTO DE TORNEIO ⚡'
      - '&f{tipo} &7| &f{vara}'
      - '&7Acaba em &e{tempo}'
      - '&6&l1o &f{1_nome} &7- &e{1_valor}'
      - '&7&l2o &f{2_nome} &7- &e{2_valor}'
      - '&c&l3o &f{3_nome} &7- &e{3_valor}'
      - '&7Participantes: &f{participantes} &8| &7Premio: &f{premio}'
  Proximo evento: '&d⚡ &7Proximo evento em &e{tempo}'

# Agenda dos Eventos de Torneio (breves; o do mes tem a agenda dele em Categorias).
Agenda:
  Ativar: true
  # Intervalo entre um evento e o proximo (minutos), contado do fim do anterior.
  A cada: 180
  # Tipos sorteados (vazio = todos).
  Tipos: [ PESO, QUANTIDADE, RARIDADE, VALOR ]
  # Duracao de cada evento (minutos): de 1 a 2 horas.
  Duracao: 60
  # A vara dos torneios da agenda (vara_do_player, vara_zerada ou vara_sem_upgrade).
  Vara: vara_do_player
  # So comeca com pelo menos tantos jogadores online.
  Minimo de jogadores: 2

# Avisos de tempo restante (minutos antes do fim).
Avisos: [ 15, 5, 1 ]
