# ==========================================================================
#  StarPesca - torneios
#
#  Cada torneio agendado e uma parte de "Torneios:" (o nome da parte e o id
#  dele). Varios valem AO MESMO TEMPO e o mesmo peixe conta em todos: dois
#  torneios do mes, os eventos da semana... O mesmo agendamento nunca tem dois
#  valendo juntos.
#
#  Cada torneio:
#    Ativar               false = nao comeca sozinho (o comando ainda comeca)
#    Nome                 como aparece nos avisos, menus e hologramas
#    Categoria            MENSAL (Torneio do Mes) ou EVENTO; cada categoria tem
#                         o seu holograma e o seu grupo no menu
#    Tipo                 PESO, QUANTIDADE, RARIDADE, VALOR ou ALEATORIO (sorteia
#                         entre os "Tipos:" a cada vez que comeca; vazio = todos)
#    Vara                 vara_do_player, vara_zerada ou vara_sem_upgrade
#    Quando.Tipo          MENSAL    sempre um valendo, ate o fim do mes
#                         SEMANAL   num dia da semana (Dia) numa hora (Hora),
#                                   por Duracao minutos
#                         INTERVALO de tantos em tantos minutos (A cada),
#                                   contados do fim do anterior
#                         MANUAL    so pelo comando
#    Minimo de jogadores  so comeca com pelo menos tantos online
#    Premio               qual tabela de "Premios:" vale (ou "Posicoes:" ali
#                         mesmo, como na tabela)
#
#  O SEMANAL comeca no dia e hora marcados e termina no fim da Duracao. Se o
#  servidor ligar no meio desse horario, ele comeca na hora (ate o fim
#  marcado); o que ja aconteceu nesta semana nao se repete.
#
#  Comandos (staff):
#    /starpesca torneio agenda                    os valendo e os agendados (com o id)
#    /starpesca torneio iniciar <id> [duracao]    comeca um agendamento agora
#    /starpesca torneio iniciar <tipo> [vara] [duracao] [mensal|evento]
#                                                 torneio avulso, fora da agenda
#    /starpesca torneio parar|encerrar [id]       parar = sem premio; encerrar = premia
#    /starpesca torneio holograma <mensal|evento> [remover]
#
#  Tipos:
#    PESO        vence quem pescar o peixe mais pesado
#    QUANTIDADE  vence quem pescar mais peixes
#    RARIDADE    vence quem somar mais pontos de raridade (peixes.yml)
#    VALOR       vence quem pescar peixes que somem mais valor de venda
#
#  Recompensas: Perolas, Economias (por economia do economias.yml) e
#  Comandos ({jogador}). Duracao em minutos.
#  Nas mensagens: {nome} {tipo} {tempo} {premio} {jogador} {valor} e
#  {1_nome} {1_valor} ... {3_nome} {3_valor}.
# ==========================================================================
Versao do modelo: 2

Torneios:
  # Os dois Torneios do Mes: sempre valendo, ate o ultimo dia do mes.
  mensal_peixes:
    Ativar: true
    Nome: 'Torneio do Mes'
    Categoria: MENSAL
    Tipo: QUANTIDADE
    Vara: vara_do_player
    Quando:
      Tipo: MENSAL
    Minimo de jogadores: 1
    Premio: mensal
  mensal_peso:
    Ativar: true
    Nome: 'Torneio do Mes'
    Categoria: MENSAL
    Tipo: PESO
    Vara: vara_do_player
    Quando:
      Tipo: MENSAL
    Minimo de jogadores: 1
    Premio: mensal
  # Os eventos da semana.
  evento_quarta:
    Ativar: true
    Nome: 'Evento de Quarta'
    Categoria: EVENTO
    Tipo: ALEATORIO
    Tipos: [ PESO, QUANTIDADE, RARIDADE, VALOR ]
    Vara: vara_do_player
    Quando:
      Tipo: SEMANAL
      Dia: QUARTA
      Hora: '20:00'
      Duracao: 60
    Minimo de jogadores: 2
    Premio: evento
  evento_sexta:
    Ativar: true
    Nome: 'Evento de Sexta'
    Categoria: EVENTO
    Tipo: PESO
    Vara: vara_do_player
    Quando:
      Tipo: SEMANAL
      Dia: SEXTA
      Hora: '21:00'
      Duracao: 90
    Minimo de jogadores: 2
    Premio: evento

# Tabelas de premio: posicao -> recompensa. Um torneio usa a do "Premio:" dele;
# sem Premio, a da categoria (mensal ou evento). Crie quantas quiser.
# {premio} nas mensagens e o premio do 1o lugar.
Premios:
  mensal:
    1:
      Perolas: 2000.0
      Economias:
        money: 250000.0
      Comandos: [ ]
    2:
      Perolas: 1200.0
      Economias:
        money: 150000.0
      Comandos: [ ]
    3:
      Perolas: 800.0
      Economias:
        money: 100000.0
      Comandos: [ ]
    4:
      Perolas: 400.0
      Economias:
        money: 50000.0
      Comandos: [ ]
    5:
      Perolas: 200.0
      Economias:
        money: 25000.0
      Comandos: [ ]
  evento:
    1:
      Perolas: 300.0
      Economias:
        money: 25000.0
      Comandos: [ ]
    2:
      Perolas: 150.0
      Economias:
        money: 10000.0
      Comandos: [ ]
    3:
      Perolas: 75.0
      Economias:
        money: 5000.0
      Comandos: [ ]

# Nome de cada categoria ({categoria} nos menus, hologramas e mensagens).
Categorias:
  Mensal:
    Nome: 'Torneio do Mes'
  Evento:
    Nome: 'Evento de Torneio'

# Nome de cada tipo nas mensagens e menus.
Tipos:
  PESO:
    Nome: 'Peixe mais pesado'
    Descricao: 'Vence quem pescar o peixe mais pesado.'
    Unidade: 'g'
  QUANTIDADE:
    Nome: 'Mais peixes'
    Descricao: 'Vence quem pescar mais peixes.'
    Unidade: ' peixes'
  RARIDADE:
    Nome: 'Raridade'
    Descricao: 'Vence quem somar mais pontos de raridade.'
    Unidade: ' pontos'
  VALOR:
    Nome: 'Maior valor'
    Descricao: 'Vence quem somar mais valor em peixes.'
    Unidade: ''

# Duracao padrao (minutos) do torneio avulso e do agendamento sem Duracao.
Duracao: 60

# As varas do torneio: nome e descricao nas mensagens e menus.
Varas:
  vara_do_player:
    Nome: 'Vara do jogador'
    Descricao: 'Cada um pesca com a propria vara.'
  vara_zerada:
    Nome: 'Vara zerada'
    Descricao: 'Todos comecam com a vara inicial e evoluem durante o torneio.'
    # TORNEIO = evolui na loja de varas pagando com as perolas ganhas NESTE
    #           torneio (o custo em perolas de cada vara; o saldo de perolas
    #           da pessoa nao e tocado).
    # NORMAL  = evolui pagando o custo normal da loja de varas.
    Evoluir com: TORNEIO
  vara_sem_upgrade:
    Nome: 'Vara sem upgrade'
    Descricao: 'Todos pescam com a vara inicial, sem evoluir.'
    # Peso suportado infinito: nenhum peixe escapa por peso (bom para torneio
    # de PESO, ja que todos estao com a vara inicial).
    Peso infinito: true
    # Sorteia peixes de todos os niveis (cada um pela propria chance), senao a
    # vara inicial so pegaria peixe pequeno.
    Todos os peixes: true
    # Iscas nao podem ser compradas nem ativadas, e a que ja estava ativa fica
    # suspensa (nao vale e nao gasta) ate o torneio acabar.
    Bloquear iscas: true
    # O bonus da classe nao vale durante o torneio.
    Ignorar classe: true
    # Boosters (o proprio e o global) nao valem e nao podem ser ativados
    # durante o torneio. O tempo de um booster ja ativo continua correndo.
    Ignorar boosters: true


# Hologramas: um para os torneios do mes e outro para os eventos, cada um no
# lugar marcado com /starpesca torneio holograma <mensal|evento> (e tirado com
# /starpesca torneio holograma <mensal|evento> remover). Atualizam a cada 2s.
#
#   Titulo   em cima, uma vez
#   Linhas   o bloco de CADA torneio valendo (um embaixo do outro, separados
#            pelo Separador). Variaveis: {nome} {categoria} {tipo} {descricao}
#            {vara} {tempo} {premio} {participantes} {1_nome} {1_valor} ...
#            {3_nome} {3_valor}
#   Vazio    no lugar dos blocos quando nenhum torneio da categoria vale; sem
#            linhas, o holograma some
#   Rodape   embaixo, so quando ha um proximo agendado
#   Em Titulo/Vazio/Rodape: {categoria} {proximo_nome} {proximo_tipo}
#   {proximo_tempo} {proximo_quando} (linha com {proximo_*} some sem proximo).
#
# A linha '{pessoal}' do bloco mostra a CADA jogador a posicao dele naquele
# torneio (Pessoal, abaixo). Precisa de servidor 1.19.4 ou mais novo; nos
# outros essa linha some e o resto fica igual.
Holograma:
  Separador: ''
  Mensal:
    Titulo:
      - '&6&l✦ TORNEIOS DO MES ✦'
      - ''
    Linhas:
      - '&e&l{nome} &8- &f{tipo}'
      - '&7Acaba em &e{tempo} &8| &7Premio: &f{premio}'
      - '&6&l1º &f{1_nome} &7- &e{1_valor}'
      - '&7&l2º &f{2_nome} &7- &e{2_valor}'
      - '&c&l3º &f{3_nome} &7- &e{3_valor}'
      - '{pessoal}'
    Vazio: [ ]
    Rodape: [ ]
  Evento:
    Titulo:
      - '&d&l⚡ EVENTOS DE TORNEIO ⚡'
      - ''
    Linhas:
      - '&d&l{nome} &8- &f{tipo}'
      - '&7Acaba em &e{tempo} &8| &7Premio: &f{premio}'
      - '&6&l1º &f{1_nome} &7- &e{1_valor}'
      - '&7&l2º &f{2_nome} &7- &e{2_valor}'
      - '&c&l3º &f{3_nome} &7- &e{3_valor}'
      - '{pessoal}'
    Vazio:
      - '&7Proximo: &f{proximo_nome} &8- &f{proximo_tipo}'
      - '&7{proximo_quando} &8| &7comeca em &e{proximo_tempo}'
    Rodape:
      - ''
      - '&7Proximo: &f{proximo_nome} &7em &e{proximo_tempo}'
  # A linha de cada jogador. {posicao} {valor} {falta} {alvo} (a posicao de
  # cima) {alvo_nome} {alvo_valor} {vantagem} (sobre o 2o) {nome} {tipo}.
  # Vazio = nada para esse caso.
  Pessoal:
    Ativar: true
    Participando: '&b» &7Voce: &f{posicao}º &8| &7falta &e{falta} &7para o &f{alvo}º'
    Lider: '&b» &6Voce esta em 1º! &7(&e{valor}&7)'
    Fora: '&b» &7Pesque para entrar no placar'

# Avisos de tempo restante (minutos antes do fim).
Avisos: [ 15, 5, 1 ]
