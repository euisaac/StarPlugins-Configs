# ==========================================================================
#  StarPesca - torneios
#
#  Um torneio por vez. Comeca pelo /starpesca torneio iniciar <tipo> ou
#  sozinho, pela agenda abaixo. Ao terminar, os tres primeiros recebem as
#  recompensas das Posicoes; sem participante nao ha vencedor.
#
#  Tipos:
#    PESO        vence quem pescar o peixe mais pesado
#    QUANTIDADE  vence quem pescar mais peixes
#    RARIDADE    vence quem somar mais pontos de raridade (peixes.yml)
#    VALOR       vence quem pescar peixes que somem mais valor de venda
#
#  Vara (opcional, depois do tipo):
#    vara_do_player    cada um pesca com a propria vara (padrao)
#    vara_zerada       todos com a vara inicial, que evolui durante o torneio
#    vara_sem_upgrade  todos com a vara inicial, sem evoluir
#  Ex.: /starpesca torneio iniciar quantidade vara_zerada 30
#
#  Recompensas: Perolas, Economias (por economia do economias.yml) e
#  Comandos ({jogador}). Duracao em minutos.
#  Nas mensagens: {tipo} {tempo} {premio} {jogador} {valor} e
#  {1_nome} {1_valor} ... {3_nome} {3_valor}.
# ==========================================================================

Versao do modelo: 1

# Nome de cada tipo nas mensagens e menus.
Tipos:
  PESO:
    Nome: 'Peixe mais pesado'
    Descricao: 'Vence quem pescar o peixe mais pesado.'
    Unidade: 'g'
  QUANTIDADE:
    Nome: 'Mais peixes'
    Descricao: 'Vence quem pescar mais peixes.'
    Unidade: ' peixes'
  RARIDADE:
    Nome: 'Raridade'
    Descricao: 'Vence quem somar mais pontos de raridade.'
    Unidade: ' pontos'
  VALOR:
    Nome: 'Maior valor'
    Descricao: 'Vence quem somar mais valor em peixes.'
    Unidade: ''

# Duracao padrao (minutos) quando o comando nao diz.
Duracao: 30

# Posicao -> recompensa. {premio} nas mensagens e a soma em money do 1o lugar.
Posicoes:
  1:
    Perolas: 300.0
    Economias:
      money: 25000.0
    Comandos: [ ]
  2:
    Perolas: 150.0
    Economias:
      money: 10000.0
    Comandos: [ ]
  3:
    Perolas: 75.0
    Economias:
      money: 5000.0
    Comandos: [ ]

# As varas do torneio: nome e descricao nas mensagens e menus.
Varas:
  vara_do_player:
    Nome: 'Vara do jogador'
    Descricao: 'Cada um pesca com a propria vara.'
  vara_zerada:
    Nome: 'Vara zerada'
    Descricao: 'Todos comecam com a vara inicial e evoluem durante o torneio.'
    # TORNEIO = evolui na loja de varas pagando com as perolas ganhas NESTE
    #           torneio (o custo em perolas de cada vara; o saldo de perolas
    #           da pessoa nao e tocado).
    # NORMAL  = evolui pagando o custo normal da loja de varas.
    Evoluir com: TORNEIO
  vara_sem_upgrade:
    Nome: 'Vara sem upgrade'
    Descricao: 'Todos pescam com a vara inicial, sem evoluir.'

# Agenda: comeca torneios sozinho.
Agenda:
  Ativar: true
  # Intervalo entre um torneio e o proximo (minutos), contado do fim do anterior.
  A cada: 180
  # Tipos sorteados (vazio = todos).
  Tipos: [ PESO, QUANTIDADE, RARIDADE, VALOR ]
  Duracao: 30
  # A vara dos torneios da agenda (vara_do_player, vara_zerada ou vara_sem_upgrade).
  Vara: vara_do_player
  # So comeca com pelo menos tantos jogadores online.
  Minimo de jogadores: 2

# Avisos de tempo restante (minutos antes do fim).
Avisos: [ 15, 5, 1 ]
