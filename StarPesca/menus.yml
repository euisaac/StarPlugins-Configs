#  a confirmacao. Permissao (opcional) esconde o produto.
# ---------------------------------------------------------------------------
Loja:
  Titulo: '&8Loja de perolas'
  Linhas: 4
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '
  Produtos:
    chave:
      Slot: 11
      Preco: 150
      Item:
        Material: TRIPWIRE_HOOK
        Nome: '&6Chave de caixa'
        Lore:
          - '&7Uma chave para abrir caixas.'
          - ''
          - ' &7Preco: &b{preco} perolas'
          - ''
          - '&eClique para comprar'
      Comandos: [ 'give {jogador} tripwire_hook 1' ]
    diamantes:
      Slot: 13
      Preco: 500
      Item:
        Material: DIAMOND
        Quantidade: 16
        Nome: '&b16 Diamantes'
        Lore:
          - ''
          - ' &7Preco: &b{preco} perolas'
          - ''
          - '&eClique para comprar'
      Comandos: [ 'give {jogador} diamond 16' ]
    booster:
      Slot: 15
      Preco: 800
      Item:
        Material: EXPERIENCE_BOTTLE
        Nome: '&dBooster de pesca &7(+50%, 30 min)'
        Lore:
          - ''
          - ' &7Preco: &b{preco} perolas'
          - ''
          - '&eClique para comprar'
      Comandos: [ 'starpesca givebooster {jogador} 50 30' ]
  Itens:
    perfil:
      Slot: 4
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&b{jogador}'
      Lore: [ '', ' &7Suas perolas: &b{perolas}', '' ]
    voltar:
      Slot: 31
      Material: ARROW
      Nome: '&cVoltar'
      Acoes: [ 'voltar' ]

