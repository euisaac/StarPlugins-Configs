      Nome: '&a{vara_nome} &7(L.{nivel})'
      Lore:
        - ''
        - ' &7Peso suportado: &f{peso_suportado}g'
        - ' &7Intervalo: &f{intervalo}s'
        - ' &7Estado: {vara_estado}'
        - ''
        - ' &7Perolas: &b{perolas}'
        - ''
    evoluir:
      Slot: 30
      Material: DIAMOND
      Nome: '&aEvoluir vara'
      Lore:
        - '&7Varas melhores aguentam peixes'
        - '&7mais pesados e pescam mais rapido.'
        - ''
        - ' &7Proxima: &f{proxima_vara} &7(L.{proximo_nivel})'
        - ' &7Custo: &f{proximo_custo}'
        - ''
        - '&eClique para ver as varas'
      Acoes: [ 'evoluir' ]
    reparar:
