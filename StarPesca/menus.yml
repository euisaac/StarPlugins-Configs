# ==========================================================================
#  StarPesca - as telas
#
#  Material passa pelo XSeries: o mesmo nome funciona na 1.8 e na 1.21.
#  Cabeca: Material PLAYER_HEAD + Textura (hash/URL/base64) ou Dono (nick;
#  {jogador} e o proprio).
#
#  Cada tela tem:
#    Titulo, Linhas        Titulo (ate 32 caracteres nas versoes antigas) e altura.
#    Enfeite               O vidro do fundo (Ativar: false deixa vazio; 'So fora
#                          do conteudo: false' enche os slots de conteudo tambem).
#    Slots                 Onde o conteudo paginado aparece (peixes, varas...).
#    Itens                 Botoes fixos: Slot/Slots, Material, Textura, Dono,
#                          Nome, Lore, Brilho, Permissao, Esconder sem
#                          permissao e Acoes.
#
#  Acoes comuns:    menu | vara | evoluir | sacola | vender-tudo | top | loja |
#                   iscas | classes | colecao | missoes | torneio | ir | sair |
#                   voltar | anterior | proxima | fechar
#  Acoes gerais:    comando: <cmd> | console: <cmd> | op: <cmd> | mensagem: <texto>
#                   anuncio: <texto> | titulo: <t<nl>sub> | actionbar: <texto>
#                   som: <SOM;volume;tom>
#  Cada tela tem as suas acoes, listadas antes dela.
#
#  Substituicoes em qualquer texto: {jogador} {nivel} {vara_nome}
#  {peso_suportado} {intervalo} {pescados} {maior_peso} {tempo} {perolas}
#  {classe} {sacola} {limite} {sacola_nivel} {booster} {isca} {isca_usos}
#  {colecao} {colecao_total} {torneio_estado} {torneio_tipo} {torneio_tempo}
#  {torneio_1_nome} {torneio_1_valor} (ate 3) {na_area} {auto_venda}
#  {pagina} {paginas}. Placeholders do PlaceholderAPI tambem funcionam.
# ==========================================================================

Versao do modelo: 1

# ---------------------------------------------------------------------------
#  Menu principal (/pesca).
#  Os botoes 'ir' e 'sair' so aparecem no estado certo (fora/dentro da area);
#  no modo LIVRE nenhum dos dois aparece.
# ---------------------------------------------------------------------------
Principal:
  Titulo: '&8Pescaria'
  Linhas: 5
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '
  Itens:
    perfil:
      Slot: 4
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&b{jogador}'
      Lore:
        - ''
        - ' &7Vara: &f{vara_nome} &7(L.{nivel})'
        - ' &7Peso suportado: &f{peso_suportado}g'
        - ' &7Peixes pescados: &f{pescados}'
        - ' &7Maior peso: &f{maior_peso}g'
        - ' &7Tempo pescando: &f{tempo}'
        - ''
        - ' &7Perolas: &b{perolas}'
        - ' &7Classe: {classe}'
        - ' &7Colecao: &f{colecao}&7/&f{colecao_total}'
        - ''
    vara:
      Slot: 10
      Material: FISHING_ROD
      Nome: '&aSua vara'
      Lore:
        - ''
        - ' &7Vara: &f{vara_nome}'
        - ' &7Nivel: &f{nivel}'
        - ' &7Peso suportado: &f{peso_suportado}g'
        - ' &7Intervalo: &f{intervalo}s'
        - ''
        - '&eClique para gerenciar a vara'
      Acoes: [ 'vara' ]
    sacola:
      Slot: 11
      Material: CHEST
      Nome: '&aSacola de peixes'
      Lore:
        - ''
        - ' &7Peixes guardados: &f{sacola}&7/&f{limite}'
        - ' &7Nivel da sacola: &f{sacola_nivel}'
        - ' &7Auto-venda: {auto_venda}'
        - ''
        - '&eClique para ver e vender'
      Acoes: [ 'sacola' ]
    top:
      Slot: 12
      Material: WRITABLE_BOOK
      Nome: '&aRanking'
      Lore:
        - '&7Os pescadores que se destacam.'
        - ''
        - '&eClique para ver'
      Acoes: [ 'top' ]
    loja:
      Slot: 13
      Material: EMERALD
      Nome: '&bLoja de perolas'
      Lore:
        - '&7Troque suas perolas por itens.'
        - ''
        - ' &7Suas perolas: &b{perolas}'
        - ''
        - '&eClique para abrir'
      Acoes: [ 'loja' ]
    iscas:
      Slot: 14
      Material: STRING
      Nome: '&aIscas'
      Lore:
        - '&7Iscas melhoram a sua pescaria.'
        - ''
        - ' &7Isca ativa: {isca} &7({isca_usos})'
        - ''
        - '&eClique para ver as iscas'
      Acoes: [ 'iscas' ]
    classes:
      Slot: 15
      Material: LEATHER_CHESTPLATE
      Nome: '&bClasses'
      Lore:
        - '&7Classes dao bonus permanentes.'
        - ''
        - ' &7Sua classe: {classe}'
        - ''
        - '&eClique para ver as classes'
      Acoes: [ 'classes' ]
    ir:
      Slot: 16
      Material: PLAYER_HEAD
      Textura: '22d145c93e5eac48a661c6f27fdaff5922cf433dd627bf23eec378b9956197'
      Nome: '&aIr pescar'
      Lore:
        - '&7Clique para ir para a'
        - '&7area de pesca.'
      Acoes: [ 'ir' ]
    sair:
      Slot: 16
      Material: PLAYER_HEAD
      Textura: '5fde3bfce2d8cb724de8556e5ec21b7f15f584684ab785214add164be7624b'
      Nome: '&cSair da pesca'
      Lore:
        - '&7Clique para sair da'
        - '&7area de pesca.'
      Acoes: [ 'sair' ]
    colecao:
      Slot: 29
      Material: BOOK
      Nome: '&aColecao de peixes'
      Lore:
        - '&7Todos os peixes que voce ja pescou.'
        - ''
        - ' &7Progresso: &f{colecao}&7/&f{colecao_total}'
        - ''
        - '&eClique para ver'
      Acoes: [ 'colecao' ]
    missoes:
      Slot: 30
      Material: PAPER
      Nome: '&eMissoes do dia'
      Lore:
        - '&7Complete e ganhe perolas.'
        - ''
        - ' &7Concluidas hoje: &f{missoes_concluidas}&7/&f{missoes_total}'
        - ''
        - '&eClique para ver'
      Acoes: [ 'missoes' ]
    booster:
