    torneio:
      Slot: 32
      Material: GOLD_INGOT
      Nome: '&6Torneio'
      Brilho: true
      Lore:
        - ''
        - ' &7Torneio atual: {torneio_estado}'
        - ''
        - ' &e1o &f{torneio_1_nome} &7- &f{torneio_1_valor}'
        - ' &72o &f{torneio_2_nome} &7- &f{torneio_2_valor}'
        - ' &63o &f{torneio_3_nome} &7- &f{torneio_3_valor}'
