        - '&7voce nao estiver com ele.'
        - ''
        - '&eClique para pegar'
      Acoes: [ 'comando: pesca vara' ]
    voltar:
      Slot: 40
      Material: ARROW
      Nome: '&cVoltar'
      Acoes: [ 'voltar' ]

