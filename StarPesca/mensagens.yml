Ajuda:
  Jogador: |
    <nl>
    &b&lPESCA &7- Comandos
    &f/pesca &8- &7Abre o menu da pesca.
    &f/pesca ir &8- &7Vai para a area de pesca.
    &f/pesca sair &8- &7Sai da area de pesca.
    &f/pesca vara &8- &7Pega a sua vara.
    &f/pesca sacola &8- &7Abre a sacola de peixes.
    &f/pesca vender &8- &7Vende todos os peixes da sacola.
    &f/pesca top &8- &7Ranking dos pescadores.
    &f/pesca loja &8- &7Loja de perolas.
    &f/pesca iscas &8- &7Loja de iscas.
    &f/pesca classes &8- &7Classes de pescador.
    &f/pesca colecao &8- &7Sua colecao de peixes.
    &f/pesca missoes &8- &7Missoes do dia.
    &f/pesca torneio &8- &7O torneio atual.
    &f/perolas &8- &7Suas perolas.
    <nl>
  Perolas: |
    <nl>
    &b&lPEROLAS &7- Comandos
    &f/perolas &8- &7Ver suas perolas.
    &f/perolas ver <jogador> &8- &7Ver as perolas de alguem.
    &f/perolas enviar <jogador> <quantia> &8- &7Envia perolas.
    &f/perolas top &8- &7Ranking de perolas.
    <nl>
  Admin: |
    <nl>
    &b&lSTARPESCA &7- Comandos administrativos
    &f/starpesca recarregar &8- &7Recarrega os arquivos.
    &f/starpesca setspawn &8- &7Define o spawn da area de pesca.
    &f/starpesca setsaida &8- &7Define para onde o /pesca sair leva.
    &f/starpesca pos1 &7| &fpos2 &8- &7Marca os cantos da regiao (modo REGIAO).
    &f/starpesca varinha &8- &7Varinha para marcar os cantos.
    &f/starpesca info [jogador] &8- &7Perfil de pesca de alguem.
    &f/starpesca vara <jogador> <vara|reset> &8- &7Define a vara.
    &f/starpesca reparar <jogador> &8- &7Repara a vara.
    &f/starpesca encantamento <jogador> <encantamento> <nivel> &8- &7Define um encantamento.
    &f/starpesca classe <jogador> <classe|reset> &8- &7Define a classe.
    &f/starpesca sacola <jogador> <nivel> &8- &7Define o nivel da sacola.
    &f/starpesca givepeixe <jogador> <peixe> <raridade> [peso] [quantidade] &8- &7Da um peixe.
    &f/starpesca givebooster <jogador> <bonus%> <minutos> [quantidade] &8- &7Da um booster.
    &f/starpesca giveisca <jogador> <isca> [quantidade] &8- &7Da uma isca.
    &f/starpesca booster global <bonus%> <minutos> &8- &7Booster para todos.
    &f/starpesca torneio iniciar <tipo> [minutos] &7| &fparar &8- &7Torneios.
    &f/starpesca npc definir|remover &8- &7NPC que abre o menu.
    &f/starpesca perolas dar|tirar|definir <jogador|todos> <quantia> &8- &7Perolas.
    &f/starpesca listar peixes|varas|classes|iscas|raridades &8- &7Listas.
    <nl>

