# ==========================================================================
#  StarPesca - mensagens
#
#  Cores: &a etc. e &#RRGGBB (1.16+). Mensagem vazia ('') nao e enviada.
#  Mensagem de varias linhas (bloco |) sai linha por linha, sem prefixo.
#  {prefixo} e o prefixo abaixo; quando a mensagem nao o menciona, ele vai
#  na frente sozinho.
#
#  Substituicoes do jogador (valem em quase tudo): {jogador} {nivel}
#  {vara_nome} {peso_suportado} {intervalo} {pescados} {maior_peso}
#  {tempo} {perolas} {classe} {sacola} {limite} {booster} {isca}
#  Num peixe: {peixe} {raridade} {peso} {valor} {quantidade} {perolas_ganhas}
#  Em titulos, <nl> separa o titulo do subtitulo.
# ==========================================================================

