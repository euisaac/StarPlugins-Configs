      Material: ANVIL
      Nome: '&7Peso'
      Lore:
        - '&7Os peixes pescados vem mais'
        - '&7pesados (e valem mais).'
        - ''
        - ' &fNivel: &b{nivel}&f/&b{maximo}'
        - ' &fBonus atual: &b+{valor}%'
        - ' &fProximo nivel: &b+{proximo}%'
        - ''
        - '{rodape}'
  velocidade:
    Tipo: VELOCIDADE
    Nome: 'Velocidade'
    Maximo: 5
    Por nivel: 8.0
    Custo:
      Base: 150.0
