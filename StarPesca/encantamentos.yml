# ==========================================================================
#  StarPesca - encantamentos da vara
#
#  Comprados com perolas no menu da vara. Cada nivel soma o 'Por nivel' do
#  encantamento. Custo = Base + (Por nivel de custo x nivel atual).
#
#  Tipos (o Tipo diz o que o encantamento faz; o nome da secao e livre):
#    SORTUDO        + % de chance de raridade melhor
#    MULTIPLICADOR  + % de perolas por peixe
#    PESO           + % no peso do peixe (vale mais)
#    VELOCIDADE     - % no intervalo entre peixes e no tempo de mordida
#    DUPLICADOR     % de chance de pescar dois peixes de uma vez
#    VALOR          + % no valor de venda
#    EXPERIENCIA    + % no XP do mcMMO
#    CHAVEIRO       % de chance por nivel de rodar um dos Comandos
#    COMANDO        igual ao CHAVEIRO (varios podem existir)
#
#  Maximo: -1 = sem limite. Nos itens: {nome} {nivel} {maximo} {valor}
#  (o bonus atual), {proximo} (o bonus do proximo nivel), {custo}.
# ==========================================================================

Versao do modelo: 2

