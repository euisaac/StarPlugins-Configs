    Item:
      Material: SUGAR
      Nome: '&fVelocidade'
      Lore:
        - '&7Diminui o intervalo entre'
        - '&7um peixe e outro.'
        - ''
        - ' &fNivel: &b{nivel}&f/&b{maximo}'
        - ' &fReducao atual: &b-{valor}%'
        - ' &fProximo nivel: &b-{proximo}%'
        - ''
        - '{rodape}'
  duplicador:
    Tipo: DUPLICADOR
    Nome: 'Duplicador'
    Maximo: 5
    Por nivel: 3.0
    Custo:
      Base: 250.0
      Por nivel: 300.0
