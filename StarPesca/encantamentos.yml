# Rodape do item de cada encantamento ({rodape}), conforme a situacao.
Rodape:
  Pode: '&aClique para evoluir por &f{custo} perolas&a.'
  Sem perolas: '&cVoce precisa de &f{custo} perolas&c.'
  Maximo: '&cNivel maximo alcancado.'
