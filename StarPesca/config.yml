# ==========================================================================
#  StarPesca - configuracao
#
#  Pesca com progressao: varas por nivel, peixes por nivel e raridade, peso,
#  perolas (a moeda da pesca), encantamentos da vara, classes, iscas, sacola
#  de peixes, torneios, boosters, colecao, missoes diarias e ranking.
#
#  Cores: &a etc. e &#RRGGBB (1.16+). Materiais pelo nome moderno (o plugin
#  traduz para as versoes antigas). Sons: NOME;volume;tom.
#
#  Mudar este arquivo pede /starpesca recarregar (banco de dados nao: esse so
#  muda com restart).
# ==========================================================================

# Nao mexa: o plugin usa este numero para saber se o seu arquivo ficou para
# tras depois de uma atualizacao.
Versao do modelo: 7

Geral:
  # Escreve no console o que o plugin esta fazendo.
  Debug: false
  # Milissegundos entre dois cliques do mesmo jogador nos menus.
  Intervalo entre cliques: 150
  # Atualiza o menu principal e o da sacola sozinho enquanto estao abertos
  # (torneio, booster e tempo pescando ao vivo). Em segundos; 0 desliga.
  Atualizar menus a cada: 2
  # Formata numeros grandes em letras (1.5K, 2M) nos menus e mensagens.
  Formato em letras: false
  # Casas decimais do dinheiro nas mensagens.
  Casas decimais: 2
  # Salva os perfis alterados de tempo em tempo (em minutos); tudo e salvo
  # tambem ao sair do servidor e no desligamento.
  Salvar a cada: 5

Banco de dados:
  # SQLITE (arquivo local) ou MYSQL. Com MySQL o perfil, a sacola e o ranking
  # sao compartilhados entre servidores (servidor de lobby + servidor de pesca).
  Tipo: SQLITE
  Prefixo das tabelas: 'starpesca_'
  MySQL:
    Host: localhost
    Porta: 3306
    Banco: minecraft
    Usuario: root
    Senha: ''

# --------------------------------------------------------------------------
#  Onde da para pescar
# --------------------------------------------------------------------------
Area:
  # LIVRE: pesca em qualquer lugar (nao existe "entrar" nem "sair" da area).
  # REGIAO: so dentro da regiao marcada com /starpesca pos1 e pos2 (ou com a
  #         varinha do /starpesca varinha). O /pesca ir leva ate o spawn dela.
  # MUNDO: os mundos da lista abaixo inteiros sao a area de pesca.
  Modo: REGIAO
  Mundos: [ 'pesca' ]
  # Fora da area a vara do plugin nao pesca nada (so o peixe normal do jogo).
  Pescar fora da area: false
  # Inventario separado: ao entrar na area o inventario do jogador e guardado
  # (em memoria e em inventarios.yml) e ele recebe um inventario de pesca so
  # com a vara, os itens da barra e a armadura da classe. Ao sair, ao
  # desconectar ou ao desligar o plugin o inventario original volta -- e o que
  # ele ganhou pescando (recompensas) vai junto. Se o servidor cair, o
  # inventario guardado e devolvido na proxima entrada.
  Inventario separado: true
  # Ao reiniciar/atualizar o plugin, quem esta na area continua onde esta (o
  # inventario volta no desligamento e e guardado de novo na subida). false:
  # leva todo mundo para a saida, como antes.
  Manter na area ao reiniciar: true
  # Ao entrar na area (por /pesca ir ou andando), o jogador recebe a vara
  # dele se nao estiver com ela.
  Dar vara ao entrar: true
  # Exige o inventario vazio para o /pesca ir (a sacola guarda os peixes,
  # entao o inventario nao precisa de espaco).
  Exigir inventario vazio: false
  # Ao sair da area (por /pesca sair, teleporte ou andando) a vara do plugin
  # e recolhida do inventario -- ela volta ao entrar.
  Recolher vara ao sair: true
  # Comandos que nao podem ser usados dentro da area (sem a barra). Lista
  # vazia libera tudo. Quem tem starpesca.admin ignora.
  Comandos bloqueados: [ 'tpa', 'tpahere', 'home', 'sethome', 'warp' ]
  # Bloqueia quebrar e colocar blocos dentro da area (staff ignora).
  Proteger blocos: true
  # Bloqueia PvP dentro da area.
  Bloquear pvp: true
  # Bloqueia dano por queda, fogo, afogamento etc. dentro da area.
  Bloquear dano: true
  # Bloqueia a fome dentro da area.
  Bloquear fome: true
  # Horario em que a pesca funciona (hora do servidor, 24h). Vazio = sempre.
  # Quem estiver na area fora do horario e levado para a saida.
  Horario:
    Ativar: false
    De: '06:00'
    Ate: '22:00'
  # Itens que aparecem na barra de itens de quem esta na area. Um clique
  # executa a acao. Acoes: visibilidade | menu | sacola | sair | vender |
  # comando: <cmd>. Slot de 0 a 8.
  Itens da barra:
    visibilidade:
      Ativar: true
      Slot: 8
      Ligado:
        Material: LIME_DYE
        Nome: '&aJogadores visiveis'
        Lore: [ '&7Clique para esconder os outros pescadores.' ]
      Desligado:
        Material: GRAY_DYE
        Nome: '&cJogadores escondidos'
        Lore: [ '&7Clique para mostrar os outros pescadores.' ]
    menu:
      Ativar: true
      Slot: 7
      Material: NETHER_STAR
      Nome: '&bMenu da pesca'
      Lore: [ '&7Clique para abrir o menu.' ]
      Acao: 'menu'
    sacola:
      Ativar: true
      Slot: 6
      Material: CHEST
      Nome: '&eSacola de peixes &7({sacola}/{limite})'
      Lore: [ '&7Clique para ver e vender seus peixes.' ]
      Acao: 'sacola'
    sair:
      Ativar: true
      Slot: 0
      Material: RED_BED
      Nome: '&cSair da pesca'
      Lore: [ '&7Clique para voltar para a saida.' ]
      Acao: 'sair'

# Placar lateral de quem esta na area (ate 15 linhas). Aceita as substituicoes
# do jogador: {vara_nome} {nivel} {peso_suportado} {intervalo} {pescados}
# {maior_peso} {tempo} {perolas} {proximo_custo_perolas} {proxima_vara}
# {sacola} {limite} {sacola_nivel} {classe} {booster} {booster_global} {isca}
# {isca_usos} {colecao} {colecao_total} {missoes_concluidas} {missoes_total}
# {torneio_estado} {torneio_tipo} {torneio_tempo} {torneio_1_nome}
# {torneio_1_valor} (ate 3) e os do PlaceholderAPI. Linha de ate 40
# caracteres (contando as cores) fica inteira em qualquer versao.
Placar:
  Ativar: true
  # Em segundos.
  Atualizar a cada: 2
  Titulo: '&b&lPESCARIA'
  # Linhas curtas: o placar fica tao largo quanto a maior delas.
  # {proxima_status} = "Vara maxima", "Pronta!" ou "2/4 req." (os requisitos da
  # proxima vara mais as perolas). {torneio_resumo} = sua posicao no torneio em
  # destaque ("3o de 12"). Textos em mensagens.yml > Placar.
  Linhas:
    - '&7'
    - '&b&l» &fVara'
    - ' &b{vara_nome} &8(&7Nv.{nivel}&8)'
    - ' &7Suporta: &f{peso_suportado}g'
    - ' &7Evoluir: {proxima_status}'
    - '&7'
    - '&b&l» &fPesca'
    - ' &7Pescados: &f{pescados}'
    - ' &7Recorde: &f{maior_peso}g'
    - ' &7Sacola: &f{sacola}&8/&7{limite}'
    - ' &7Perolas: &b{perolas}'
    - ' &7Missoes: &f{missoes_concluidas}&8/&7{missoes_total}'
    - '&7'
    - ' &7Torneio: {torneio_resumo}'
    - '&bstarplugins.com.br'
  # O placar do torneio, no lugar do de cima. Quando: EVENTO = so com um evento
  # de torneio valendo (os do mes valem o mes todo e tomariam o placar sempre);
  # QUALQUER = com qualquer torneio. Variaveis: {torneio_nome} {torneio_tipo}
  # {torneio_vara} {torneio_tempo} {torneio_premio} {torneio_1_nome}
  # {torneio_1_valor} (ate 3) {torneio_posicao} {torneio_valor}
  # {torneio_participantes} {torneio_falta_texto} {torneio_perolas}.
  Torneio:
    Ativar: true
    Quando: EVENTO
    Titulo: '&d&lEVENTO'
    Linhas:
      - '&7'
      - '&d&l» &f{torneio_tipo}'
      - ' &7Acaba em: &f{torneio_tempo}'
      - '&7'
      - ' &6&l1º &f{torneio_1_nome}'
      - '   &e{torneio_1_valor}'
      - ' &7&l2º &f{torneio_2_nome}'
      - '   &e{torneio_2_valor}'
      - ' &c&l3º &f{torneio_3_nome}'
      - '   &e{torneio_3_valor}'
      - '&7'
      - ' &7Voce: &b{torneio_posicao} &8| &f{torneio_valor}'
      - ' {torneio_falta_texto}'
      - '&bstarplugins.com.br'

# --------------------------------------------------------------------------
#  Durabilidade das varas
#
#  Cada peixe gasta a vara; no zero ela quebra e nao pesca ate ser consertada
#  no ferreiro (NPC 'reparo', /pesca reparar ou o botao do menu da vara). O
#  conserto gasta REPARADORES (o item abaixo) proporcionais ao desgaste -- a
#  quantidade cheia e o 'Reparadores' de cada vara no varas.yml, maior nas mais
#  evoluidas -- e a parte proporcional do 'Reparo' (economias) dela.
#  Reparador: /starpesca givereparador <jogador> [quantidade] (console tambem),
#  loja de perolas (loja.yml) e recompensa rara de pesca (recompensas.yml > reparador).
#  A durabilidade da vara da evolucao fica no PERFIL; a da vara especial
#  (varas-especiais.yml), no proprio item. A vara do torneio nunca gasta.
#  Ativar: false = o sistema de antes (sem desgaste; a vara so quebra com peixe
#  pesado demais quando tem 'Quebra com peso').
# --------------------------------------------------------------------------
Durabilidade:
  Ativar: true
  # Quanto cada peixe pescado gasta.
  Por peixe: 1
  # Quanto gasta o peixe pesado demais que escapa (ele nao quebra a vara na hora).
  Peixe que escapa: 3
  # Avisa quando sobra menos que isto (em %), e a barra fica vermelha.
  Aviso abaixo de: 10
  # {durabilidade_barra}
  Barra:
    Tamanho: 10
    Cheio: '&a|'
    Vazio: '&8|'
  Reparador:
    Material: PRISMARINE_SHARD
    Brilho: true
    Nome: '&b&lReparador de vara'
    Lore:
      - '&7Conserta a vara de pesca no &fferreiro&7.'
      - '&7Varas mais evoluidas gastam mais.'

# --------------------------------------------------------------------------
#  Animacoes de peixe raro (no anzol, para quem estiver perto)
#
#    FOGOS[:quantidade]       fogos saindo da agua (nao machucam)
#    SALTO:<criatura>         a criatura pula da agua e mergulha de volta:
#                             SQUID ou GLOW_SQUID (polvo), GUARDIAN (tubarao),
#                             DOLPHIN, TURTLE, COD, SALMON, TROPICAL_FISH...
#                             Nao apanha, nao ataca e nao deixa nada.
#    ONDA                     anel de respingos em volta do anzol
#    RAIO                     so o efeito do raio (sem dano e sem fogo)
#    PARTICULAS:<nome>[:qtd]  particula do jogo
#    SOM:<som>                som para quem esta a ate 32 blocos
#  Por raridade (ids do peixes.yml > Raridades) e por peixe (ids do peixes.yml
#  > Peixes); um peixe com os dois toca os dois.
# --------------------------------------------------------------------------
Animacoes:
  Ativar: true
  Raridades:
    epico: [ 'ONDA' ]
    lendario: [ 'ONDA', 'SALTO:COD', 'FOGOS:1' ]
    mitico: [ 'ONDA', 'SALTO:SQUID', 'FOGOS:3' ]
    ancestral: [ 'ONDA', 'SALTO:GUARDIAN', 'FOGOS:5', 'SOM:ENTITY_ELDER_GUARDIAN_CURSE' ]
    divino: [ 'ONDA', 'SALTO:DOLPHIN', 'FOGOS:8', 'RAIO', 'SOM:UI_TOAST_CHALLENGE_COMPLETE' ]
  Peixes:
    lula: [ 'SALTO:GLOW_SQUID' ]
    polvo: [ 'SALTO:GLOW_SQUID' ]
    lula_gigante: [ 'SALTO:GLOW_SQUID', 'ONDA' ]
    lula_abissal: [ 'SALTO:GLOW_SQUID', 'ONDA' ]
    polvo_colossal: [ 'SALTO:GLOW_SQUID', 'ONDA', 'FOGOS:2' ]
    tubarao: [ 'SALTO:GUARDIAN' ]
    tubarao_martelo: [ 'SALTO:GUARDIAN' ]
    tubarao_tigre: [ 'SALTO:GUARDIAN' ]
    tubarao_branco: [ 'SALTO:GUARDIAN', 'ONDA' ]
    tubarao_duende: [ 'SALTO:GUARDIAN', 'ONDA' ]
    tubarao_ciclone: [ 'SALTO:GUARDIAN', 'ONDA', 'FOGOS:2' ]
    tubarao_abissal: [ 'SALTO:GUARDIAN', 'ONDA', 'FOGOS:2' ]
    tubarao_baleia: [ 'SALTO:GUARDIAN', 'ONDA', 'FOGOS:3' ]
    baleia_sombria: [ 'SALTO:DOLPHIN', 'ONDA', 'FOGOS:3' ]
    tentaculo_do_kraken: [ 'SALTO:SQUID', 'ONDA' ]
    kraken_jovem: [ 'SALTO:SQUID', 'ONDA', 'FOGOS:2' ]
    kraken: [ 'SALTO:SQUID', 'ONDA', 'FOGOS:4', 'RAIO' ]
    kraken_primordial: [ 'SALTO:SQUID', 'ONDA', 'FOGOS:6', 'RAIO' ]

# --------------------------------------------------------------------------
#  Anti macro (pesca AFK)
#
#  O CAPTCHA abre um menu pedindo um item pelo nome; as opcoes tem os NOMES
#  TROCADOS, entao so passa quem clica no item pelo desenho (menus.yml >
#  Captcha). Com o CAPTCHA pendente nenhum peixe vem e o menu volta a cada
#  lance (fechar nao adianta).
#  Vale para todos por padrao (Ativar: false desliga). Quem recebe
#  starpesca.captcha.bypass POR EXTENSO nunca recebe (OP e o * nao contam).
#  Para testar na hora: /starpesca captcha <nick>.
#  /starpesca captcha liberar <jogador> tira o castigo.
# --------------------------------------------------------------------------
Anti macro:
  Ativar: true
  # CAPTCHA a cada tantos minutos PESCANDO (o tempo parado nao conta). 0 = so
  # pela mira parada.
  A cada: 30
  # Ate tantos minutos a mais ou a menos, sorteado a cada vez: o macro nao
  # sabe quando vem o proximo.
  Variacao: 10
  # Lances seguidos do mesmo bloco e com a mesma mira = parado: abre o CAPTCHA.
  # So contam os lances aceitos (o clique repetido durante o intervalo nao).
  # 0 = desliga.
  Lances parados: 25
  # Quanto a mira (em graus) pode mudar e ainda contar como "a mesma".
  Tolerancia da mira: 0.5
  # Segundos para responder, contados so com a pessoa DENTRO da area. Passou
  # disso, conta como erro.
  Tempo para responder: 60
  # Errou: segundos sem pescar. Depois disso o CAPTCHA continua esperando.
  Punicao: 300
  # Comandos no console a cada erro ({jogador} {uuid} {erros}).
  Comandos ao errar: [ ]
  # Com tantos erros seguidos o jogador sai da area de pesca. 0 = nunca.
  Erros para expulsar: 3
  # Comandos no console quando ele e tirado da area (ex.: 'kick {jogador} Macro de pesca').
  Comandos ao expulsar: [ ]

# --------------------------------------------------------------------------
#  A pesca em si
# --------------------------------------------------------------------------
Pesca:
  # A vara precisa ser a do plugin (dada pelo /pesca vara ou ao entrar na
  # area). false: qualquer vara pesca, com a vara registrada no perfil.
  Exigir vara do plugin: true
  # Agachado (shift) + clique direito com a vara abre o menu da vara em vez
  # de lancar a linha.
  Menu da vara com shift: true
  # O jogador so usa a propria vara: a vara de outro jogador nao pesca e
  # e recolhida ao ser segurada.
  Vara so do dono: true
  # A vara e inquebravel (a durabilidade do jogo nao desce).
  Vara inquebravel: true
  # Se true, o peixe de verdade do jogo (bacalhau, salmao...) nao cai: so
  # os peixes do plugin contam.
  Cancelar peixe do jogo: true
  # Peixes de nivel maior que o da vara podem aparecer? (false: so ate o
  # nivel da vara; true: qualquer peixe, e o pesado pode escapar/quebrar).
  Peixes acima do nivel: false
  # Tempo de espera pela mordida, em segundos (min e max). Funciona em Paper
  # 1.16+ (em outros servidores vale o tempo do jogo). Os valores da vara
  # (varas.yml -> Mordida) ganham destes. Sem a mordida do Paper, a espera
  # que passar do tempo do jogo (media de 17,5s) entra no intervalo da vara.
  Mordida:
    Ativar: true
    Minimo: 15
    Maximo: 90
  # Quanto o encantamento Velocidade pode encurtar, no total, a mordida e o
  # intervalo (%). 100 = sem teto (com Velocidade alta o peixe vinha na hora).
  Velocidade maxima: 50.0
  # O clima e a hora mudam a pesca (peixes com Condicoes no peixes.yml).
  Condicoes:
    Ativar: true
    # Bonus geral de chance de raridade quando esta chovendo (%).
    Bonus na chuva: 10.0
  # Enquanto pesca, o jogador ve na actionbar (vazio desliga).
  Actionbar: '&bPescando... &7Peixes: &f{pescados} &8| &7Sacola: &f{sacola}&8/&f{limite}'
  # De quantos em quantos TIQUES a actionbar da pesca e reenviada. Quem escreve
  # por ultimo manda na actionbar, entao e isto que da a ela prioridade sobre
  # outros plugins (aviso de noite, de clan...). Menor = ganha mais; 4 = 5x por
  # segundo. Use 20 para reenviar so uma vez por segundo.
  Actionbar a cada: 4
  # Quantos segundos o peixe fisgado (e os avisos de venda e de espera) ficam
  # na actionbar antes de o 'Pescando...' voltar.
  Actionbar do peixe: 3.0
  # Segundos parado sem lancar a vara para contar como "parou de pescar"
  # (tempo pescando para de contar e sai a mensagem de parou).
  Parou apos: 30
  # Ao pescar, XP do mcMMO na habilidade Fishing (se o mcMMO existir).
  Mcmmo: true
  # Efeitos visuais ao pescar
  Efeitos:
    # Particulas no anzol ao fisgar (nome da particula do jogo; vazio desliga).
    Particula: 'VILLAGER_HAPPY'
    Quantidade: 12
    # Raio da mensagem "X pescou um peixe LENDARIO" nas raridades que tem
    # anuncio proximo (0 = servidor inteiro).
    Raio do anuncio: 0
    # O anuncio de peixe raro (peixes.yml > Raridades > Anuncio: chat e titulo)
    # vai so para quem esta NA AREA DE PESCA. false = para todos (ou o raio).
    Anuncio so na area: true
    # Excecoes, anunciadas para o servidor inteiro mesmo assim: raridades
    # (ids do peixes.yml > Raridades) e peixes (ids do peixes.yml > Peixes).
    Anuncio para todos:
      Raridades: [ divino ]
      Peixes: [ ]
  # Contra a fazenda de pesca automatica, conferido quando o peixe e fisgado.
  # O peixe barrado nao conta para nada (nem gasta a vara).
  Anti fazenda:
    Ativar: true
    # Distancia minima (blocos, na horizontal) entre o jogador e o anzol: a
    # fazenda classica e um buraco de agua encostado no pe. 0 = desliga.
    Distancia minima: 3
    # Blocos de agua (de 25) num quadrado 5x5 em volta do anzol: um poco de 1
    # bloco nao pesca. 0 = desliga.
    Agua minima: 9
    # Cada ponto da agua (quadrado de 'Tamanho do ponto' blocos) tem peixes
    # limitados, divididos entre todo mundo. Acabou: so em outro lugar. O
    # ponto recupera 1 peixe a cada 'Recupera um a cada' segundos.
    Cardume:
      Ativar: true
      Tamanho do ponto: 4
      Peixes por ponto: 25
      Recupera um a cada: 30

# --------------------------------------------------------------------------
#  Perolas: a moeda da pesca
# --------------------------------------------------------------------------
Perolas:
  # Como a moeda se chama nas mensagens e menus.
  Nome: 'Perolas'
  Singular: 'Perola'
  Simbolo: '&b✦ '
  # Aceita casas decimais? false: sempre inteiro.
  Decimais: false
  # Valor maximo que um jogador pode enviar por vez (0 = sem limite).
  Maximo por envio: 0
  # Taxa (%) descontada ao enviar perolas para outro jogador.
  Taxa de envio: 0.0

# --------------------------------------------------------------------------
#  Sacola de peixes
# --------------------------------------------------------------------------
Sacola:
  # Limite de peixes no nivel 1 da sacola.
  Limite inicial: 100
  # Quanto o limite sobe por nivel comprado.
  Por nivel: 50
  # true: o aumento e multiplicado pelo nivel (nivel 3 sobe 3x 'Por nivel').
  Multiplicar por nivel: false
  # Nivel maximo da sacola (0 = sem limite).
  Nivel maximo: 30
  # Custo para subir de nivel: economia (economias.yml) e valor. O valor e
  # multiplicado pelo nivel atual quando 'Multiplicar custo' e true, e sobe
  # mais 'Crescimento' a cada nivel (1.12 = 12% em cima do anterior) -- sem
  # isso o nivel 30 custaria so 30 vezes o primeiro.
  Custo:
    money: 2500.0
    perolas: 100.0
  Multiplicar custo: true
  Crescimento: 1.12
  # Limites por permissao (starpesca.sacola.<chave>): o maior vale, somado
  # aos niveis comprados.
  Por permissao:
    vip: 200
    mvp: 400
  # Auto-venda: quem tem starpesca.autovenda e uma vara que permite vende
  # cada peixe na hora em que pesca.
  Auto venda:
    Ativar: true
    # Avisa cada venda automatica na actionbar (vazio desliga).
    Aviso: '&aVendido: &f{peixe} &7({peso}g) &apor &f{valor}'
  # Sacola cheia: o peixe escapa (true) ou e vendido automaticamente na hora
  # se o jogador tiver auto-venda ligada (false = so escapa).
  Cheia escapa: true

# --------------------------------------------------------------------------
#  Boosters (multiplicador de perolas e chance por tempo)
# --------------------------------------------------------------------------
Boosters:
  Item:
    Material: EXPERIENCE_BOTTLE
    Nome: '&dBooster de pesca &7(+{bonus}%)'
    Lore:
      - '&7Multiplica as perolas e a chance de'
      - '&7raridade por &f{tempo}&7.'
      - ''
      - '&fBonus: &d+{bonus}%'
      - '&fDuracao: &d{tempo}'
      - ''
      - '&aClique com o botao direito para ativar.'
    Brilho: true
  # Booster global (para o servidor inteiro) via /starpesca booster global.
  Global:
    Aviso: '&d&lBOOSTER GLOBAL &7Um booster de &f+{bonus}%&7 esta ativo por &f{tempo}&7!'

# --------------------------------------------------------------------------
#  Classes (bonus permanentes; menu /pesca classes)
# --------------------------------------------------------------------------
Classes:
  Ativar: true
  # Os efeitos da classe (classes.yml -> Efeitos) valem so dentro da area
  # de pesca (true) ou sempre (false).
  Efeitos so na area: true
  # Ao entrar na area, o jogador veste a armadura da classe (a dele e guardada
  # e devolvida ao sair).
  Vestir armadura: true

# --------------------------------------------------------------------------
#  Colecao de peixes (/pesca colecao)
# --------------------------------------------------------------------------
Colecao:
  Ativar: true
  # Recompensas por completar a colecao de um nivel (todos os peixes daquele
  # nivel pescados ao menos uma vez) e a colecao inteira. Comandos do console;
  # {jogador} e o nick.
  Recompensas:
    Nivel:
      Perolas: 50.0
      Comandos: [ ]
      Mensagem: '&a&lCOLECAO &7Voce completou a colecao do nivel &f{nivel}&7 e ganhou &f{perolas} perolas&7!'
    Completa:
      Perolas: 1000.0
      Comandos: [ 'give {jogador} diamond 16' ]
      Mensagem: '&a&lCOLECAO &7Voce completou a &f&lCOLECAO INTEIRA&7 e ganhou &f{perolas} perolas&7!'
      Anuncio: '&a&lCOLECAO &f{jogador}&7 completou a colecao de peixes inteira!'

# --------------------------------------------------------------------------
#  Missoes diarias (/pesca missoes)
# --------------------------------------------------------------------------
Missoes:
  Ativar: true
  # Quantas missoes cada jogador recebe por dia (sorteadas do missoes.yml).
  Por dia: 5
  # Fuso horario da virada do dia (ex.: America/Sao_Paulo). Vazio = o do servidor.
  Fuso: 'America/Sao_Paulo'
  # Recompensa extra por completar todas as missoes do dia.
  Todas:
    Perolas: 50.0
    Comandos: [ ]
    Mensagem: '&e&lMISSOES &7Voce completou todas as missoes de hoje e ganhou &f{perolas} perolas&7!'

# --------------------------------------------------------------------------
#  Ranking (/pesca top)
# --------------------------------------------------------------------------
Ranking:
  # Quantas posicoes cada top guarda.
  Posicoes: 10
  # Em segundos.
  Atualizar a cada: 60
  Vazio: '---'

# --------------------------------------------------------------------------
#  Rede (BungeeCord/Velocity)
# --------------------------------------------------------------------------
Rede:
  Ativar: false
  # LOBBY: este servidor manda o jogador para o servidor da pesca no /pesca ir.
  # PESCA: este e o servidor da pesca; quem chega vai para o spawn da area e
  #        o /pesca sair manda de volta.
  Modo: LOBBY
  # Nome do servidor da pesca (no config do proxy).
  Servidor da pesca: 'pesca'
  # Nome do servidor de volta.
  Servidor de saida: 'lobby'
  # No modo PESCA: quem entra no servidor vai direto para a area (ticks).
  Entrar na area ao chegar: true
  Atraso ao chegar: 10

# --------------------------------------------------------------------------
#  Webhook do Discord (torneios e peixes raros)
# --------------------------------------------------------------------------
Webhook:
  Ativar: false
  Url: ''
  Nome: 'Pesca'
  Eventos:
    Torneio iniciado: true
    Torneio terminado: true
    Peixe raro: true
    Recorde: true

Sons:
  Clique: 'UI_BUTTON_CLICK;1;1'
  Erro: 'ENTITY_VILLAGER_NO;1;1'
  Pagina: 'ITEM_BOOK_PAGE_TURN;1;1'
  Sucesso: 'ENTITY_PLAYER_LEVELUP;1;1.4'
  Dinheiro: 'ENTITY_EXPERIENCE_ORB_PICKUP;1;1.2'
  Pescou: 'ENTITY_FISHING_BOBBER_SPLASH;1;1'
  Escapou: 'ENTITY_ITEM_BREAK;1;0.8'
  Quebrou: 'ENTITY_ITEM_BREAK;1;0.5'
  Evoluiu: 'ENTITY_PLAYER_LEVELUP;1;1'
