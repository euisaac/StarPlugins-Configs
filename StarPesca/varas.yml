# ==========================================================================
#  StarPesca - varas de pesca
#
#  A vara do jogador e um item do plugin (dado pelo /pesca vara ou ao entrar
#  na area). O nivel dela fica no perfil: perder o item nao perde a vara.
#
#  Cada nivel:
#    Peso suportado    Peixe mais pesado escapa (ou quebra a vara).
#    Quebra com peso   true: o peixe pesado quebra a vara (precisa reparar).
#    Intervalo         Segundos entre um peixe e outro.
#    Mordida           Tempo de espera pela mordida (Paper 1.16+), min e max.
#    Auto venda        A vara deixa usar a auto-venda (com a permissao).
#    Bonus             Bonus proprios da vara: chance de raridade (%), perolas
#                      (%) e peso (%).
#    Reparo            Custo para consertar (por economia do economias.yml).
#    Evoluir           Custo para chegar NESTE nivel vindo do anterior.
#    Requisitos        O que precisa ter, alem do custo, para chegar NESTE nivel:
#                      Peixes pescados, Colecao, Maior peso, Nivel da sacola...
#                      O 'Maior peso' tem de caber no que a vara ANTERIOR pesca
#                      (o peixe mais pesado dos niveis dela, ate o peso que ela
#                      suporta); quando nao cabe, o plugin avisa no console.
#    Recompensas       'chance,recompensa' do recompensas.yml, sorteadas a
#                      cada peixe pescado.
#    Item              Nome e lore da vara. {nivel} {peso_suportado} {intervalo}
#                      {encantamentos} (uma linha por encantamento, ou nada)
#                      {perolas} {proximo_custo_perolas} {barra} {dono}
#    Loja              Como a vara aparece na loja de varas (Evoluir, Tem e
#                      Bloqueada = precisa da anterior).
# ==========================================================================

Versao do modelo: 3

# Item mostrado na loja no lugar de uma vara que o jogador ainda nao alcanca.
Bloqueada:
  Material: BARRIER
  Nome: '&c{nome}'
  Lore:
    - ''
    - '&7Nivel: &f{nivel}'
    - '&7Peso suportado: &f{peso_suportado}g'
    - ''
    - '&cVoce precisa da vara anterior.'

# Formato de cada linha de {encantamentos} na lore da vara.
Linha de encantamento: ' &7▪ &b{nome} &f{nivel}'
Sem encantamentos: ' &7▪ &8Nenhum encantamento'

# Barra de progresso ({barra}) das perolas ate a proxima vara.
