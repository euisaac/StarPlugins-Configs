# ==========================================================================
#  StarPesca - classes de pescador
#
#  As classes sao compradas em ordem (Ordem 0, 1, 2...): so da para evoluir
#  para a proxima depois de ter a anterior. Uma vez comprada, o jogador pode
#  equipar qualquer classe que tenha.
#
#  Bonus (em %): Chance (raridade melhor), Perolas, Peso, Valor de venda.
#  Efeitos: 'EFEITO:nivel', aplicados enquanto a classe esta equipada
#  (config.yml -> Classes.Efeitos so na area).
#  Custo: por economia do economias.yml (money, perolas...).
#  Permissao: vazio = qualquer um pode comprar.
#  Cor: cor da armadura de couro (R:G:B) vestida na area.
#
#  Nos itens: {nome} {ordem} {bonus_chance} {bonus_perolas} {bonus_peso}
#  {bonus_valor} {custo} {efeitos}
# ==========================================================================

