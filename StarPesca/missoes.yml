# ==========================================================================
#  StarPesca - missoes diarias
#
#  Todo dia cada jogador recebe 'Por dia' (config.yml) missoes sorteadas
#  desta lista. O sorteio e o mesmo para o jogador o dia inteiro, mesmo
#  depois de um restart. Ao virar o dia, o progresso zera e vem outras.
#
#  Tipos:
#    PESCAR              pescar {meta} peixes
#    PESCAR_RARIDADE     pescar {meta} peixes da Raridade
#    PESCAR_PEIXE        pescar {meta} vezes o Peixe
#    PESCAR_NIVEL        pescar {meta} peixes do Nivel (ou acima)
#    PESO                pescar {meta} gramas no total
#    PESO_UNICO          pescar um peixe com pelo menos {meta} gramas
#    VENDER              vender peixes por {meta} (na economia Economia)
#    PEROLAS             ganhar {meta} perolas pescando
#    TEMPO               ficar {meta} minutos pescando
#
#  Recompensa: Perolas e Comandos ({jogador}). Peso: chance no sorteio.
#
#  Permanentes (secao Permanentes, no fim): nao zeram com o dia; cada uma se
#  conclui uma vez. Com 'Requer: <id>' ela so comeca a contar depois da outra
#  (as sequencias). Sem a secao no arquivo, valem as de fabrica.
#  Nos itens: {nome} {descricao} {progresso} {meta} {porcentagem} {barra}
#  {perolas} {estado}
# ==========================================================================

