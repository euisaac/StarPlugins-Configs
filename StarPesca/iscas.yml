# ==========================================================================
#  StarPesca - iscas
#
#  A isca e um item: o jogador clica com o botao direito para ativar e ela
#  vale pelos proximos 'Usos' peixes pescados. So uma isca ativa por vez.
#
#  Bonus (em %): Chance (raridade melhor), Perolas, Peso, Valor.
#  Nivel extra: quantos niveis acima da vara a isca deixa pescar.
#  Raridade minima: a raridade mais baixa que vem com a isca (vazio = nenhuma).
#  Peixes: se preenchido, so estes peixes vem com a isca ativa (se algum for
#          possivel na hora; senao vale o sorteio normal).
#  Custo: preco na loja de iscas (por economia). 'Loja: false' tira da loja.
#
#  Nos itens: {nome} {usos} {usos_restantes} {bonus_chance} {bonus_perolas}
#  {bonus_peso} {bonus_valor} {nivel_extra} {raridade_minima} {custo}
# ==========================================================================

