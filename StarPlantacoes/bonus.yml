# ---------------------------------------------------------------------------
#  StarPlantacoes - bonus por permissao
#
#  O bonus entra na colheita: aumenta a quantidade de drop e a quantidade de
#  sementes. Crie quantos quiser.
#
#  Quando "Acumular bonus" (config.yml) esta desligado vale so o bonus de maior
#  Ordem entre os que o jogador tem permissao.
# ---------------------------------------------------------------------------
Versao do modelo: 1

Bonus:
  membro:
    Ordem: 1
    Permissao: 'starplantacoes.bonus.membro'
    Display: '&7[Membro]'
    # Em porcentagem.
    Bonus de drop: 10.0
    Bonus de sementes: 10.0
  vip:
    Ordem: 2
    Permissao: 'starplantacoes.bonus.vip'
    Display: '&a[VIP]'
    Bonus de drop: 25.0
    Bonus de sementes: 25.0
