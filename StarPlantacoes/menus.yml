# ---------------------------------------------------------------------------
#  StarPlantacoes - as telas
#
#  Slot -1 esconde o item: e assim que voce tira um botao do menu sem precisar
#  de uma opcao "Ativar" para cada um.
#
#  Em todas as telas valem {jogador}, {sementes}, {moeda}, {nivel} e {exp}.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#       Dono: '{jogador}'   # a cabeca de quem abriu o menu
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
#
# Vale tambem no item de cada encantamento (encantamentos.yml e
# custom_encantamentos.yml), que aparece na tela de evoluir.
# ---------------------------------------------------------------------------

Versao do modelo: 1

Principal:
  Titulo: '&8Plantacoes'
  Linhas: 3
  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '
  Itens:
    Encantamentos:
      Slot: 11
      Material: ENCHANTING_TABLE
      Nome: '&aEncantamentos'
      Lore:
        - '&7Evolua os encantamentos da'
        - '&7sua enxada com {moeda}.'
        - ''
        - '&7Suas {moeda}: &a{sementes}'
        - ''
        - '&aClique &7para abrir.'
    Top:
      Slot: 12
      Material: BOOK
      Nome: '&aTop {moeda}'
      Lore:
        - '&7Veja quem mais colheu'
        - '&7no servidor.'
        - ''
        - '&aClique &7para ver.'
    Recompensas:
      Slot: 14
      Material: CHEST
      Nome: '&aRecompensas'
      Lore:
        - '&7O que a sua colheita guardou'
        - '&7para voce recolher.'
        - ''
        - '&7Guardadas: &f{recompensas}'
        - ''
        - '&aClique &7para abrir.'
    Enxada:
      Slot: 15
      Material: DIAMOND_HOE
      Nome: '&aEnxada de farm'
      Lore:
        - '&7Compre a sua enxada e comece'
        - '&7a colher para ganhar {moeda}.'
        - ''
        - '&7Preco: &f{preco}'
        - ''
        - '&aClique &7para comprar.'
    Perfil:
      Slot: 22
      Material: PLAYER_HEAD
      Nome: '&a{jogador}'
      Lore:
        - '&7{moeda}: &a{sementes}'
        - '&7Colhido: &f{colhido}'
        - '&7Bonus: &f{bonus}'
        - ''

Evoluir:
  Titulo: '&8Encantamentos &7({pagina}/{paginas})'
  Linhas: 4
  # As vagas que recebem encantamento, na ordem. Quando eles nao cabem todos,
  # o menu vira pagina sozinho -- e a lista abaixo que manda, nao o "Slot" de
  # cada encantamento (esse so vale se voce apagar esta lista daqui).
  # A ordem de quem vem primeiro e o "Ordem" de cada encantamento.
  Slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]
  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '
  # Os blocos que a linha {status} da lore de cada encantamento vira.
  Status:
    Pode:
      - '&aClique &7para evoluir 1 nivel.'
      - '&aClique direito &7para evoluir 10 niveis.'
      - '&aShift + clique &7para evoluir o maximo.'
    Sem sementes:
      - '&cVoce nao tem {moeda} suficientes.'
    Maximo:
      - '&aEste encantamento esta no maximo.'
  Itens:
    # Mostra a enxada que o jogador esta segurando. O material, o nome e a lore
    # abaixo so aparecem quando ele nao esta com nenhuma na mao.
    Enxada:
      Slot: 30
      Material: BARRIER
      Nome: '&cVoce nao esta segurando a enxada'
      Lore:
        - '&7Pegue a enxada de farm na mao'
        - '&7para evoluir os encantamentos.'
    Perfil:
      Slot: 31
      Material: PLAYER_HEAD
      Nome: '&a{jogador}'
      Lore:
        - '&7{moeda}: &a{sementes}'
        - '&7Nivel da enxada: &f{nivel}'
        - '&7Experiencia: &f{exp}&7/&f{proximo}'
        - ''
    Voltar:
      Slot: 27
      Material: ARROW
      Nome: '&cVoltar'
      Lore:
        - '&7Volta para o menu anterior.'
    # As setas so aparecem quando ha para onde ir.
    Anterior:
      Slot: 29
      Material: ARROW
      Nome: '&aPagina anterior'
      Lore:
        - '&7Pagina &f{pagina}&7/&f{paginas}'
    Proxima:
      Slot: 33
      Material: ARROW
      Nome: '&aProxima pagina'
      Lore:
        - '&7Pagina &f{pagina}&7/&f{paginas}'

Top:
  Titulo: '&8Top {moeda}'
  Linhas: 4
  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '
  # Onde as cabecas do top aparecem, na ordem.
  Slots: [ 10, 11, 12, 13, 14, 15, 16, 20, 21, 22, 23, 24 ]
  Itens:
    Posicao:
      Material: PLAYER_HEAD
      Nome: '&a{posicao}. {jogador}'
      Lore:
        - '&7{moeda}: &f{sementes}'
        - ''
    Vazio:
      Material: 'GRAY_DYE'
      Nome: '&7Vaga livre'
      Lore:
        - '&7Ninguem chegou aqui ainda.'
    Voltar:
      Slot: 27
      Material: ARROW
      Nome: '&cVoltar'
      Lore:
        - '&7Volta para o menu anterior.'

Recompensas:
  Titulo: '&8Recompensas'
  Linhas: 6
  Enfeite:
    Ativar: false
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '
  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]
  Itens:
    Vazio:
      Slot: 22
      Material: 'COBWEB'
      Nome: '&7Vazio'
      Lore:
        - '&7Voce ainda nao tem recompensas'
        - '&7para recolher.'
    Recolher:
      Slot: 49
      Material: 'HOPPER'
      Nome: '&aRecolher tudo'
      Lore:
        - '&7Recolhe todas as recompensas'
        - '&7de uma vez.'
    Anterior:
      Slot: 45
      Material: ARROW
      Nome: '&aPagina anterior'
      Lore: []
    Proxima:
      Slot: 53
      Material: ARROW
      Nome: '&aProxima pagina'
      Lore: []
    Voltar:
      Slot: 48
      Material: ARROW
      Nome: '&cVoltar'
      Lore:
        - '&7Volta para o menu anterior.'
