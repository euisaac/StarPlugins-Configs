# ---------------------------------------------------------------------------
#  StarPlantacoes - mensagens
#
#  Mensagem em branco nao e enviada: e assim que voce desliga um aviso sem
#  precisar de uma opcao no config.
# ---------------------------------------------------------------------------
Versao do modelo: 1

Prefixo: '&a&lPLANTACOES &8> &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  Recurso desligado: '&cEste recurso esta desligado neste servidor.'
  Carregando: '&cSeus dados ainda estao carregando. Tente de novo em instantes.'
  Inventario cheio: '&cSeu inventario esta cheio.'
  Mundo bloqueado: '&cAs plantacoes nao funcionam neste mundo.'
  So jogador: '&cEste comando so funciona no jogo.'
  Numero invalido: '&c{valor} nao e um numero valido.'
  Jogador offline: '&cO jogador &f{jogador} &cnao esta online.'
  Voce mesmo: '&cVoce nao pode fazer isso com voce mesmo.'
  Uso: '&cUse &f/{comando} ajuda &cpara ver os comandos.'
  Recarregado: '&aConfiguracoes recarregadas.'

Etiquetas:
  Nenhum: 'nenhum'
  Maximo: 'MAX'
  Sem limite: 'sem limite'

Enxada:
  Sem enxada: '&cVoce precisa estar segurando a sua enxada de farm.'
  Precisa da enxada: '&cVoce precisa de uma enxada de farm para colher isto.'
  Sem permissao da planta: '&cVoce nao tem permissao para colher esta plantacao.'
  Nivel insuficiente: '&cSua enxada precisa do nivel &f{nivel} &cpara colher isto.'
  Espere: '&cEspere &f{tempo} &cpara colher esta plantacao de novo.'
  Ja tem: '&cVoce ja tem uma enxada de farm no inventario.'
  Sem dinheiro: '&cVoce precisa de &f{preco} &cpara comprar a enxada.'
  Comprou: '&aVoce comprou uma enxada de farm por &f{preco}&a.'
  Recebeu: '&aVoce recebeu uma enxada de farm.'
  Entregou: '&aVoce deu uma enxada de farm para &f{jogador}&a.'
  Subiu de nivel: '&aSua enxada subiu para o nivel &f{nivel}&a!'
  Nivel maximo: '&aSua enxada chegou ao nivel maximo.'

Sementes:
  Saldo: '&aVoce tem &f{sementes} &a{moeda}.'
  Saldo de outro: '&f{jogador} &atem &f{sementes} &a{moeda}.'
  Sem sementes: '&cVoce nao tem &f{sementes} &c{moeda}.'
  Limite: '&cVoce chegou ao limite de {moeda}.'
  Enviou: '&aVoce enviou &f{sementes} &a{moeda} para &f{jogador}&a.'
  Recebeu: '&aVoce recebeu &f{sementes} &a{moeda} de &f{jogador}&a.'
  Envio invalido: '&cA quantia precisa ser maior que zero.'
  Adicionou: '&aVoce adicionou &f{sementes} &a{moeda} para &f{jogador}&a.'
  Tirou: '&aVoce tirou &f{sementes} &a{moeda} de &f{jogador}&a.'
  Setou: '&aVoce definiu &f{sementes} &a{moeda} para &f{jogador}&a.'

Encantamentos:
  Nao encontrado: '&cEste encantamento nao existe.'
  Sem permissao: '&cVoce nao tem permissao para usar este encantamento.'
  No maximo: '&cEste encantamento ja esta no nivel maximo.'
  Sem sementes: '&cVoce precisa de &f{preco} &c{moeda} para evoluir isto.'
  Evoluiu: '&aO encantamento &f{encantamento} &afoi para o nivel &f{nivel}&a.'
  Evoluiu varios: '&aO encantamento &f{encantamento} &asubiu &f{niveis} &aniveis (agora {nivel}).'

Recompensas:
  Vazio: '&cVoce nao tem recompensas para recolher.'
  Recolheu: '&aRecompensa recolhida.'
  Recolheu tudo: '&aTodas as recompensas foram recolhidas.'
  Ganhou: '&aVoce ganhou a recompensa &f{recompensa}&a!'
  Armazem cheio: '&cSeu armazem de recompensas esta cheio.'
  Apagou: '&aRecompensa descartada.'

Top:
  Vazio: '&cNinguem colheu nada ainda.'
  Linha: '&f{posicao}. &a{jogador} &7- &f{sementes} {moeda}'
  Cabecalho:
    - ''
    - '&a&lTOP {moeda}'
    - ''
  Rodape:
    - ''

Ajuda:
  Jogador:
    - ''
    - '&a&lPLANTACOES'
    - '&a/{comando} &8- &7Abre o menu principal.'
    - '&a/{comando} {sementes} &8- &7Ve as suas {moeda}.'
    - '&a/{comando} {sementes} <jogador> &8- &7Ve as {moeda} de alguem.'
    - '&a/{comando} {enviar} <jogador> <quantia> &8- &7Envia {moeda} para alguem.'
    - '&a/{comando} {top} &8- &7Mostra o top de {moeda}.'
    - '&a/{comando} {recompensas} &8- &7Abre o armazem de recompensas.'
    - '&a/{comando} {enxada} &8- &7Abre o menu da sua enxada.'
    - ''
  Admin:
    - ''
    - '&a&lPLANTACOES &7(admin)'
    - '&a/{comando} {recarregar} &8- &7Recarrega os arquivos.'
    - '&a/{comando} {darenxada} <jogador> &8- &7Da uma enxada de farm.'
    - '&a/{comando} {dar} <jogador> <quantia> &8- &7Adiciona {moeda}.'
    - '&a/{comando} {tirar} <jogador> <quantia> &8- &7Tira {moeda}.'
    - '&a/{comando} {setar} <jogador> <quantia> &8- &7Define as {moeda}.'
    - '&a/{comando} {ver} <jogador> &8- &7Ve o perfil de alguem.'
    - '&a/{comando} {info} &8- &7Estado do plugin.'
    - ''

Info:
  - ''
  - '&a&lSTARPLANTACOES &f{versao}'
  - '&7Plantacoes: &f{plantacoes}'
  - '&7Encantamentos: &f{encantamentos}'
  - '&7Recompensas: &f{recompensas}'
  - '&7Bonus: &f{bonus}'
  - '&7Banco de dados: &f{banco}'
  - '&7Perfis carregados: &f{perfis}'
  - ''

