# ---------------------------------------------------------------------------
#  StarPlantacoes - encantamentos customizados
#
#  Este arquivo e o seu: aqui nascem os encantamentos que o SERVIDOR inventa.
#  Ele e lido junto com o encantamentos.yml e nao ha diferenca nenhuma entre os
#  dois no menu, na lore da enxada ou na colheita -- separar so mantem os de
#  fabrica longe do que voce criou, para uma atualizacao nunca passar por cima.
#
#  Tudo continua sendo pago em SEMENTES.
#
#  Os tipos que fazem sentido aqui:
#
#    COMANDO      sorteia comandos, sementes e dinheiro a cada colheita
#    LINEAR       colhe em linha reta, para onde o jogador esta olhando
#    LASER        colhe a linha inteira, para os dois lados do bloco
#    EXPLOSAO     colhe um quadrado ao redor do bloco
#    BUMERANGUE   colhe em cruz: a linha do olhar e a perpendicular
#
#  Chaves que so existem nestes tipos:
#
#    Chance por nivel     chance, em %, de o encantamento disparar na colheita
#                         (sem ela vale o "Bonus por nivel")
#    Alcance              quantos blocos o desenho pega. Na LINEAR e o
#                         comprimento; no LASER e no BUMERANGUE e o comprimento
#                         para CADA lado; na EXPLOSAO e o raio do quadrado
#                         (Alcance 1 = 3x3, Alcance 2 = 5x5)
#    Comandos             'chance em %,comando' -- rodados quando ele dispara
#    Sementes             sementes fixas quando ele dispara
#    Sementes por nivel   sementes a mais por nivel do encantamento
#    Dinheiro por nivel   dinheiro (economia do servidor) por nivel
#    Mensagens            Titulo, Actionbar e Chat do momento em que ele dispara
#
#  Os blocos colhidos por area entregam drop, sementes e experiencia normalmente,
#  mas nao repetem mensagem, recompensa nem encantamento de comando: um Laser de
#  alcance 8 dispararia tudo isso oito vezes no mesmo golpe.
#
#  Na lore valem: {display} {nivel} {maximo} {bonus} {chance} {alcance} {preco}
#  {moeda}. A linha {status} vira o bloco certo de menus.yml -> Evoluir -> Status.
# ---------------------------------------------------------------------------
Versao do modelo: 1

