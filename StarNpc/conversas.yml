# ============================================================
#                   StarNpc - conversas
# ============================================================
# Usado pelo modo CIDADAO.
#
# "Conversas entre NPCs": quando dois cidadaos se encontram, um
# papo destes e sorteado. "A:" e quem puxou o papo, "B:" quem
# respondeu. {a} {b} e {outro} viram os nomes dos NPCs.
Conversas entre NPCs:
  clima:
    - 'A: Que dia bonito, nao acha?'
    - 'B: Perfeito para pescar no lago!'
    - 'A: Se nao chover de tarde...'
    - 'B: Ah, sempre chove quando eu saio.'
  mercado:
    - 'A: Voce viu o preco do trigo hoje?'
    - 'B: Nem me fale, subiu de novo!'
    - 'A: Desse jeito vou plantar eu mesmo.'
  aventura:
    - 'A: Dizem que tem um tesouro escondido na caverna do norte.'
    - 'B: E dizem que quem entra la nao volta...'
    - 'A: Entao vou mandar o {b} primeiro!'
    - 'B: Muito engracado, {a}.'
  fofoca:
    - 'A: Psiu... sabe da ultima?'
    - 'B: Conta, conta!'
    - 'A: Agora nao, tem gente ouvindo.'
  saudacao:
    - 'A: Bom te ver, {outro}!'
    - 'B: Igualmente! Como vai a familia?'
    - 'A: Tudo otimo, gracas aos ceus.'

# O que o cidadao fala quando puxa assunto com quem chega perto
# (quando o NPC nao tem assuntos proprios).
Assuntos com jogadores:
  - 'Ola, {jogador}! Primeira vez por aqui?'
  - 'Ei, {jogador}! Bonita a sua armadura.'
  - 'Bom dia, viajante! Aproveite a vila.'
  - 'Psst, {jogador}... ouvi dizer que tem diamante perto do rio.'

# Quando ele ja conhece o jogador (ja conversaram antes).
Reencontro:
  - 'Voce de novo, {jogador}! Que bom te ver.'
  - 'Ah, {jogador}! Estava pensando em voce.'
  - 'Bem-vindo de volta, {jogador}!'

# Quando um jogador bate no cidadao (sem acao de clique esquerdo).
Reacoes ao golpe:
  - 'Ei! Isso doeu!'
  - 'Calma la, {jogador}!'
  - 'Vou chamar o guarda!'

# Frases do guia ([guiar] nas acoes ou /npc guiar).
Guia:
  Comecar:
    - 'Me acompanhe, {jogador}!'
    - 'Por aqui, venha comigo.'
  Esperando:
    - 'Venha, {jogador}, por aqui!'
    - 'Nao fique para tras!'
  Chegamos:
    - 'Chegamos! Boa sorte, {jogador}.'
    - 'E aqui. Precisando, e so chamar.'
