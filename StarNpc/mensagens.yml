  Guiando: '&aO NPC &f{npc} &aesta guiando &f{jogador}&a.'
  Memoria apagada: '&aOs NPCs esqueceram &f{jogador}&a.'
  Ponto adicionado: '&aPonto &f{numero} &aadicionado na rota (aqui onde voce esta).'
