  Tipo alterado: '&aTipo alterado para &f{tipo}&a.'
  Tipo invalido: '&cTipo &f{tipo} &cnao existe nesta versao. Exemplos: JOGADOR, VILLAGER, ZOMBIE, SKELETON, WOLF.'
