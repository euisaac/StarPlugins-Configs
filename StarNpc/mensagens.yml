  Sem dinheiro: '&cVoce precisa de &f{valor} &cpara isso.'
  Sem item: '&cVoce precisa de &f{quantidade}x {item}&c.'
  Longe: '&cChegue mais perto do NPC para conversar.'
  Criado: '&aDialogo &f{dialogo} &acriado.'
