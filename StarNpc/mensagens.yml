  Trazido: '&aO NPC &f{npc} &aagora mora aqui.'
  Alterado: '&aPronto: &f{oque}&a.'
  Sem permissao: '&cVoce nao pode falar com &f{npc}&c.'
  Buscando skin: '&7Buscando a skin de &f{skin}&7...'
