  Jogador banir: '&eDigite no chat o nick de quem vai ser banido da warp &f{warp}&e.'
  Jogador transferir: '&eDigite no chat o nick de quem vai receber a warp &f{warp}&e.'
  Busca: '&eDigite no chat o que procurar: parte do nome da warp, do dono ou da descricao.'

Admin:
  Info: |
    &8&m----------------------------------------
    &d StarPlayerWarps &7v{versao}
    &7 Banco: &f{banco} &8| &7Economia: &f{economia}
    &7 Warps: &f{warps} &8| &7Donos: &f{donos} &8| &7Anuncios: &f{anuncios}
    &7 Categorias: &f{categorias}
    &7 Terrenos: &f{terrenos}
    &8&m----------------------------------------
  Lista: '&7Warps de &f{jogador}&7 (&f{quantidade}&7): &f{lista}'
  Lista vazia: '&c{jogador} nao tem warps.'
  Dono alterado: '&aA warp &f{warp}&a agora e de &f{jogador}&a.'
  Limpeza: '&aLimpeza: &f{quantidade}&a warp(s) de jogadores inativos removida(s).'
  Debug: '&7Debug: &f{estado}&7.'
  Anuncios: '&7Espaco &f#{slot}&7: {estado}'
  Anuncio livre: '&alivre'
  Anuncio ocupado: '&f{warp}&7 de &f{dono}&7 ate &f{ate}'

Ajuda:
  Jogador: |
    &8&m----------------------------------------
    &d Warps de jogadores
    &f /{comando} &7abre o menu
    &f /{comando} <warp> &7teleporta para uma warp
    &f /{comando} criar <nome> &7cria uma warp onde voce esta
    &f /{comando} remover <warp> &7apaga uma warp sua
    &f /{comando} minhas &7as suas warps
    &f /{comando} favoritas &7as suas favoritas
    &f /{comando} buscar <texto> &7procura warps
    &f /{comando} avaliar <warp> <1-5> &7avalia uma warp
    &f /{comando} favoritar <warp> &7favorita ou desfavorita
    &f /{comando} top &7ranking das warps
    &f /{comando} info <warp> &7detalhes de uma warp
    &7 As outras opcoes (nome, descricao, icone, categoria, custo, senha,
    &7 permitidos, banidos, mover, anunciar) ficam no menu da sua warp.
    &8&m----------------------------------------
  Admin: |
    &8&m----------------------------------------
    &d StarPlayerWarps &7- administracao
    &f /{comando} recarregar &7recarrega as configuracoes
    &f /{comando} info &7estado do plugin
    &f /{comando} tp <warp> &7teleporta sem custo nem espera
    &f /{comando} remover <warp> &7apaga uma warp de qualquer um
    &f /{comando} dono <warp> <jogador> &7troca o dono
    &f /{comando} lista <jogador> &7as warps de alguem
    &f /{comando} anuncios [liberar <slot>] &7espacos de anuncio
    &f /{comando} limpar &7remove warps de jogadores inativos
    &f /{comando} debug &7liga ou desliga o debug
    &8&m----------------------------------------

Info:
  Warp: |
    &8&m----------------------------------------
    &d {warp} &7de &f{dono}
    &7 Categoria: &f{categoria} &8| &7Estado: {estado}
    &7 Visitas: &f{visitas} &8| &7Recentes: &f{visitas_recentes} &8| &7Visitantes: &f{visitantes}
    &7 Avaliacao: &e{estrelas} &7({avaliacoes}) &8| &7Favoritos: &f{favoritos}
    &7 Custo: &f{custo} &8| &7Criada em: &f{criada_em}
    &7 Descricao: &f{descricao}
    &8&m----------------------------------------

