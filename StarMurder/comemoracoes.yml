# ==========================================================================
#  StarMurder - comemoracoes de vitoria
#
#  Rodam em volta do vencedor no fim da partida. Efeito:
#    FOGOS, RAIOS, CHUVA (Material, Altura), CAVALO, OVELHAS (Quantidade), DRAGAO,
#    FOGO, BOLOS, EXPLOSOES, BIGORNAS, CORACOES, NOTAS, TOTEM, HELICE,
#    PARTICULAS (Particula, Quantidade). Intervalo em ticks; Raio em blocos.
#  Som opcional (SOM;volume;tom) e 'Intervalo do som' em ticks.
#
#  Preco 0 e sem Padrao: so sai das caixas misteriosas. Padrao: true = todo
#  mundo tem. Raridades: COMUM, RARO, EPICO, LENDARIO.
#  Permissao opcional: quem tem a permissao ja possui o item
#  (starmurder.<tipo>.<id> e starmurder.<tipo>.* tambem funcionam).
# ==========================================================================

Comemoracoes:
  fogos:
    Nome: 'Fogos'
    Raridade: COMUM
    Padrao: true
    Preco:
      Coins: 0
      Cash: 0
