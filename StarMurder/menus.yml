# ==========================================================================
#  StarMurder - as telas
#
#  Material passa pelo XSeries: o mesmo nome funciona na 1.8 e na 1.21.
#  Cabeca: Material PLAYER_HEAD + Textura (hash/URL/base64) ou Dono (nick;
#  {jogador} e o proprio).
#
#  Cada tela tem:
#    Titulo, Linhas        Titulo (ate 32 caracteres nas versoes antigas) e altura.
#    Enfeite               O vidro do fundo.
#    Slots                 Onde o conteudo paginado aparece.
#    Itens                 Botoes fixos: Slot/Slots, Material, Textura, Dono, Nome,
#                          Lore, Brilho, Permissao, Esconder sem permissao e Acoes.
#
#  Acoes:  menu:<nome> | jogar:<modo> | jogar-rapido | jogar-novamente | sair |
#          voltar | anterior | proxima | fechar | atualizar | chat |
#          grupo:<criar|convidar|sair|desfazer|aceitar|negar> | limpar:<tipo> |
#          passe-comprar:<papel> | passe-usar:<papel> | passe-cancelar |
#          comando: <cmd> | console: <cmd> | mensagem: <texto> | som: <SOM>
#  Menus:  loja, modos, jogar:<modo>, mapas:<modo>, cosmeticos:<tipo>, passes,
#          grupo, grupo-membros, missoes, caixas, fabricar, estatisticas,
#          historico, assistir, boosters, tops
#  Tipos:  faca, trilha, grito, ultimas_palavras, efeito_abate, comemoracao, balao
#
#  Qualquer texto aceita as variaveis {assim} do plugin (nivel, coins, abates,
#  abates_classico_mensal, top1_nome_vitorias, passes_assassino...) e os
#  placeholders do PlaceholderAPI.
# ==========================================================================

