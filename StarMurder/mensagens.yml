  Cor detetive: '&b'
  Cor assassino: '&c'
  Explicacao inocente: |

     &a&lVOCE E INOCENTE
     &7Sobreviva ate o fim e junte &6ouro&7: com 10 lingotes
     &7voce ganha um arco. So atire se tiver certeza --
     &7matar um inocente mata voce tambem.

  Explicacao detetive: |

     &b&lVOCE E O DETETIVE
     &7Voce tem o unico arco. Encontre o assassino e
     &7acerte-o. Cuidado: acertar um inocente mata voce.
     &7Se voce morrer, o arco cai no chao.

