# ==========================================================================
#  StarMurder - mensagens
#
#  {prefixo} entra na frente de toda mensagem de uma linha; nas mensagens de
#  varias linhas (blocos |) ele nao entra. Mensagem vazia ('') nao e enviada.
#  Cores com & (e &#RRGGBB na 1.16+). <nl> quebra linha nos titulos.
# ==========================================================================

