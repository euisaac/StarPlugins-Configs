# ==========================================================================
#  StarMurder - missoes e desafios diarios
#
#  O progresso de uma missao E a estatistica dela (Tipo) no Modo e Periodo
#  escolhidos: nao ha nada para zerar. Periodo TOTAL conclui uma vez; MENSAL
#  volta todo mes. Modo: classico, duplo, infeccao ou geral (todos).
#  Tipos: vitorias, derrotas, partidas, abates, abates_assassino,
#  assassinos_mortos, inocentes_mortos, mortes, pontuacao, maior_pontuacao,
#  ouro, herois, vezes_assassino, vezes_detetive, vezes_inocente,
#  vitorias_assassino, sobrevivencias, winstreak, maior_winstreak,
#  flechas_atiradas, flechas_acertadas, facas_arremessadas, tempo_jogado (s).
#  Recompensas: 'coins: 100' 'cash: 5' 'xp: 50' 'fragmentos: 10'
#  'caixa: <id> <qtd>' 'booster: <mult> <duracao>' 'comando: <cmd {jogador}>'
#  (passe: 'comando: murder passe dar {jogador} assassino 1')
#  Diarias: todo dia cada jogador recebe Quantidade desafios sorteados dos
#  Modelos, contando so o que ele fizer naquele dia.
# ==========================================================================

