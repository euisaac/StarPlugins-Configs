# ==========================================================================
#  StarMurder - facas
#
#  A aparencia da faca do assassino. Material: qualquer item; 'Textura' com
#  um hash/URL/base64 vira uma cabeca com aquela textura. 'Nome no jogo' e o
#  nome do item na mao (vazio usa Itens.Faca do mensagens.yml). Brilho: true
#  encanta o item so pelo visual.
#
#  Preco 0 e sem Padrao: so sai das caixas misteriosas. Padrao: true = todo
#  mundo tem. Raridades: COMUM, RARO, EPICO, LENDARIO.
#  Permissao opcional: quem tem a permissao ja possui o item
#  (starmurder.faca.<id> e starmurder.faca.* tambem funcionam).
# ==========================================================================

