# ==========================================================================
#  StarMurder - ultimas palavras
#
#  A frase que aparece no holograma sobre o corpo do jogador quando ele
#  morre. 'Frases' e uma lista: uma e sorteada a cada morte.
#
#  Preco 0 e sem Padrao: so sai das caixas misteriosas. Padrao: true = todo
#  mundo tem. Raridades: COMUM, RARO, EPICO, LENDARIO.
#  Permissao opcional: quem tem a permissao ja possui o item
#  (starmurder.ultimas_palavras.<id> e starmurder.ultimas_palavras.* tambem funcionam).
# ==========================================================================

Frases:
  padrao:
    Nome: 'Classicas'
    Raridade: COMUM
    Padrao: true
    Preco:
      Coins: 0
      Cash: 0
    Icone: PAPER
    Descricao:
      - '&7As ultimas palavras de sempre.'
    Frases:
      - 'Foi um prazer...'
      - 'Nao era pra ser assim.'
      - 'Vinguem-me!'
      - 'Eu confiei em voce...'
  raiva:
    Nome: 'Revoltado'
    Raridade: COMUM
    Preco:
      Coins: 400
      Cash: 0
    Icone: TNT
    Descricao:
      - '&7Morreu, mas nao aceitou.'
    Frases:
      - 'POR QUE EU?!'
      - 'Isso e injusto!'
      - 'Eu vi quem foi!'
      - 'Vou voltar!'
  drama:
    Nome: 'Dramatico'
    Raridade: COMUM
    Preco:
      Coins: 400
      Cash: 0
    Icone: ROSE_BUSH
    Descricao:
      - '&7Um final digno de novela.'
    Frases:
      - 'Digam a minha mae que eu a amo.'
      - 'Tudo ficou tao escuro...'
      - 'Eu ainda tinha tanto ouro para pegar.'
      - 'Adeus, mundo cruel.'
  pro:
    Nome: 'Pro Player'
    Raridade: RARO
    Preco:
      Coins: 1500
      Cash: 0
    Icone: DIAMOND
    Descricao:
      - '&7A culpa nunca e sua.'
    Frases:
      - 'Estava lagando...'
      - 'Meu ping estava alto.'
      - 'Foi o teclado.'
      - 'Isso nao acertou!'
  detetive:
    Nome: 'Investigador'
    Raridade: RARO
    Preco:
      Coins: 1500
      Cash: 0
    Icone: ENDER_EYE
    Descricao:
      - '&7Ate o fim, uma pista.'
    Frases:
      - 'Procurem quem tem sangue na roupa.'
      - 'O assassino usa botas de ferro...'
      - 'Eu quase descobri!'
      - 'A pista esta no ouro.'
  zoeira:
    Nome: 'Zoeiro'
    Raridade: EPICO
    Preco:
      Coins: 0
      Cash: 0
    Icone: CAKE
    Descricao:
      - '&7Morreu rindo.'
    Frases:
      - 'Tem bolo no meu inventario, aproveitem.'
      - 'Eu so queria pegar o ouro...'
      - 'Isso conta como abraco?'
      - 'BRB, morrendo.'
  poeta:
    Nome: 'Poeta'
    Raridade: EPICO
    Preco:
      Coins: 0
      Cash: 0
    Icone: WRITABLE_BOOK
    Descricao:
      - '&7Versos finais.'
    Frases:
      - 'A noite cai, e eu com ela.'
      - 'Entre o ouro e a faca, escolhi errado.'
      - 'O silencio agora me guarda.'
      - 'Que a lua conte o que eu vi.'
  lendario:
    Nome: 'Ultimo Suspiro'
    Raridade: LENDARIO
    Preco:
      Coins: 0
      Cash: 0
    Icone: NETHER_STAR
    Descricao:
      - '&7Frases que ficam na historia.'
    Frases:
      - 'Voces nunca vao me esquecer.'
      - 'Eu era o unico que sabia.'
      - 'Ate os herois caem.'
      - 'Isso ainda nao acabou.'
