# ==========================================================================
#  StarMurder - NPCs e tops do lobby
#
#  As posicoes ficam no locais.yml (/murder npc add, /murder tops add). Aqui e
#  a aparencia. Skin: nick de um jogador ou 'textura : assinatura'.
#  Holograma dos NPCs de modo: {modo} {esperando} {jogando} {total}.
# ==========================================================================

Versao do modelo: 1

Modos:
  classico:
    Skin: 'Notch'
    Item na mao: 'IRON_SWORD'
    Holograma:
      Altura: 2.3
      Linhas:
        - '&e&lCLIQUE PARA JOGAR'
        - '&c{modo}'
        - '&7{total} jogando'
  duplo:
    Skin: 'Dream'
    Item na mao: 'IRON_SWORD'
    Holograma:
      Altura: 2.3
      Linhas:
        - '&e&lCLIQUE PARA JOGAR'
        - '&c{modo}'
        - '&7{total} jogando'
  infeccao:
    Skin: 'Grian'
    Item na mao: 'ROTTEN_FLESH'
    Holograma:
      Altura: 2.3
      Linhas:
        - '&e&lCLIQUE PARA JOGAR'
        - '&2{modo}'
        - '&7{total} jogando'

Estatisticas:
  Skin: 'Steve'
  Item na mao: 'BOOK'
  Holograma:
    Altura: 2.3
    Linhas:
      - '&b&lSUAS ESTATISTICAS'
      - '&eClique para ver'

Tops:
  # Altura do holograma acima do ponto marcado.
  Altura: 0.5
  # Segundos entre uma estatistica e a proxima quando o top tem varias.
  Rotacao: 30
  Quantidade: 10
  Linhas:
    - '&c&lTOP {estatistica}'
    - '&7{modo} &8- &7{periodo}'
    - ''
    - '{posicoes}'
  Posicao: '&e{posicao}. &f{jogador} &7- &a{valor}'
  Vazio: '&7Ninguem ainda'
