# ==========================================================================
#  StarMurder - trilhas
#
#  Particulas atras da flecha do detetive e da faca arremessada pelo
#  assassino enquanto voam.
#  Particula: nome do Bukkit (os sinonimos antigos/novos funcionam).
#
#  Preco 0 e sem Padrao: so sai das caixas misteriosas. Padrao: true = todo
#  mundo tem. Raridades: COMUM, RARO, EPICO, LENDARIO.
#  Permissao opcional: quem tem a permissao ja possui o item
#  (starmurder.<tipo>.<id> e starmurder.<tipo>.* tambem funcionam).
# ==========================================================================

