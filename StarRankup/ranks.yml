# ==========================================================================
#  StarRankup - os ranks
#
#  Cada rank tem:
#    Ordem          posicao na escada (1 e o rank inicial; nao pode repetir)
#    Tag            texto curto para chat, tab e placeholders
#    Nome           nome completo
#    Liberado em    data a partir da qual da para upar para ele, no formato
#                   dd/MM/yyyy HH:mm. Vazio ('') = ja liberado. Antes da data o
#                   menu mostra a contagem regressiva ({liberacao}).
#    Permissao      so quem tiver consegue upar para ele ('' = todos)
#    Icone          o item deste rank no /ranks (Material, Textura ou Dono).
#                   Os ranks de fabrica usam a cabeca do mob de cada um. Sem
#                   Icone, o menu usa o material do estado (concluido, atual,
#                   proximo, futuro) do menus.yml.
#    Precos         o que custa para CHEGAR neste rank: 'economia: valor', com
#                   os ids do economias.yml. Varias linhas = cobra todas.
#    Ao upar        o que acontece ao chegar neste rank:
#      Comandos       rodados pelo console ({jogador}, {rank}, {tag}, {nome},
#                     {prestigio}, {prestigio_tag}, {proximo_tag}, {proximo_nome})
#      Itens          entregues ao jogador (Material/Nome/Lore/Quantidade ou
#                     Base64 de um item real)
#      Mensagens      avisos para TODOS: Chat, Actionbar e Titulo (<nl> quebra
#                     o titulo em titulo/subtitulo; vazio nao envia)
#      Mensagens privadas   os mesmos avisos, so para quem upou
#      Som            SOM;volume;tom (vazio nao toca)
#      Fogos          true solta fogos de artificio no jogador
#    Ao perder      Comandos rodados quando o jogador SAI deste rank -- no
#                   prestigio (que volta ao inicial) ou num setrank para baixo.
#                   Serve para tirar o grupo do LuckPerms, por exemplo.
#
#  Os precos ficam mais caros a cada prestigio conforme o prestigios.yml, e
#  mais baratos conforme os Descontos do config.yml.
#
#  Cabeca com textura (em qualquer item destes arquivos): ponha
#  Material: PLAYER_HEAD (ou SKULL_ITEM na 1.8) e cole em Textura o "Value"
#  do site minecraft-heads.com -- vale tambem a URL da textura ou so o hash:
#    Textura: 'ewogICJ0ZXh0dXJlcyIgOiB7ICJTS0lOIiA6IHsgInVybCIgOiAiaHR0cDovL3RleHR1cmVzLm1pbmVjcmFmdC5uZXQvdGV4dHVyZS8uLi4iIH0gfSB9'
#  Ou a cabeca de um jogador, pelo nick:
#    Dono: 'Notch'
# ==========================================================================

