# ==========================================================================
#  StarRankup - o prestígio
#
#  Quando chega ao rank exigido, o jogador pode dar prestigio: paga o preço,
#  volta ao primeiro rank, ganha +1 no contador e uma tag nova. Em troca os
#  ranks ficam mais caros e ele passa a ganhar mais fragmentos.
#
#  Substituicoes nos comandos e nas mensagens: {jogador}, {prestigio} (o
#  novo nível), {prestigio_anterior}, {prestigio_tag}, {maximo}.
# ==========================================================================

Versao do modelo: 1

# Desliga o prestígio inteiro (comando, menu é item).
Ativar: true

# Rank necessario para dar prestigio: o id de um rank do ranks.yml, ou
# 'último' para exigir o rank mais alto.
Rank necessario: 'ultimo'

# Prestigio maximo. -1 = sem limite.
Maximo: 10

# Tag do prestígio; {prestigio} é o nível.
Tag: '&c[&l{prestigio}&r&c]'
# Tag de quem nunca prestigiou.
Tag zero: ''

# Acréscimo no preço dos ranks, em porcentagem por prestígio.
#   Linear (Potencia: false): preço * (1 + acréscimo% * prestígio)
#   Exponencial (Potencia: true): preço * (1 + acréscimo%) ^ prestígio
Acrescimo por prestigio: 5.0
Potencia: false

# Bônus de fragmentos e cabeças, em porcentagem por prestígio (soma ao bônus
# de permissão do config.yml). 0 desliga.
Bonus de drops por prestigio: 2.0

# Preço do prestígio, multiplicado por (prestígio atual + 1): o segundo
# prestígio custa o dobro do primeiro, o terceiro o triplo...
Precos:
  money: 1000000

# true: o jogador continua com os fragmentos e as cabeças depois de
# prestigiar. false: zera os dois.
Manter fragmentos e cabecas: true

# Comandos rodados em TODO prestígio.
Comandos:
  - 'give {jogador} diamond_block 8'

# Comandos rodados só ao alcançar um prestígio específico.
Recompensas especificas:
  1:
    - 'give {jogador} nether_star 1'
  5:
    - 'give {jogador} nether_star 5'
  10:
    - 'give {jogador} dragon_egg 1'

# Avisos para TODOS.
Mensagens:
  Chat: '&c{jogador} &7alcançou o prestígio {prestigio_tag}&7!'
  Actionbar: ''
  Titulo: ''

# Avisos só para quem prestigiou.
Mensagens privadas:
  Chat: '&cVocê alcançou o prestígio &f{prestigio}&c! Seu rank voltou ao início, mas agora você ganha mais.'
  Actionbar: '&c&lPRESTÍGIO {prestigio}'
  Titulo: '&c&lPRESTÍGIO<nl>&f{prestigio}'

Som: 'ENTITY_ENDER_DRAGON_GROWL;1;1'
Fogos: true
