# ==========================================================================
#  StarRankup - cabeças de mob
#
#  O jogador mata o mob, a cabeça cai (como item ou direto na conta), ele
#  junta no /cabecas e usa como preço de rank ou vende por dinheiro.
#
#  Cada cabeça (seção Cabecas) tem:
#    Ordem                    posição no menu
#    Nome                     como aparece nas mensagens
#    Permissao                só quem tiver ganha e usa ('' = todos)
#    Automatico               true: vai direto para a conta ao matar, sem item
#    Entregar no inventario   true: o item vai para o inventario; false: cai
#                             no chão onde o mob morreu
#    Fortuna                  true: o nível de Pilhagem (Looting) da arma
#                             multiplica a quantidade
#    Vender                   true: pode vender no menu
#    Coletar                  true: pode retirar da conta como item
#    Mundos bloqueados        onde ela não cai
#    Precos de venda          'economia: valor' por unidade; o jogador recebe
#                             todas ao vender (economias do economias.yml)
#    Espera para ativar       segundos entre uma ativação e outra, por
#                             permissao: a de MENOR ordem que o jogador tiver
#    Item                     o item que cai / que é coletado. {quantidade} e
#                             quantas unidades o item carrega
#    Exibir                   o ícone no /cabecas: {quantidade}, {valor_<eco>}
#                             (por unidade), {total_<eco>} (tudo que ele tem)
#
#  Para usar a cabeça como preço de rank, crie no economias.yml uma economia
#  com Provedor 'cabeca-<id>' (já existem 'cabeca-porco' e 'cabeca-zumbi').
#
#  Mobs: quem dropa o que. Quantidade aceita faixa ('1-3').
#
#  Cabeca com textura (em qualquer item destes arquivos): ponha
#  Material: PLAYER_HEAD (ou SKULL_ITEM na 1.8) e cole em Textura o "Value"
#  do site minecraft-heads.com -- vale também a URL da textura ou só o hash:
#    Textura: 'ewogICJ0ZXh0dXJlcyIgOiB7ICJTS0lOIiA6IHsgInVybCIgOiAiaHR0cDovL3RleHR1cmVzLm1pbmVjcmFmdC5uZXQvdGV4dHVyZS8uLi4iIH0gfSB9'
#  Ou a cabeça de um jogador, pelo nick:
#    Dono: 'Notch'
# ==========================================================================

