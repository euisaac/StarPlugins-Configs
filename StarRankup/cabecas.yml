# ==========================================================================
#  StarRankup - cabecas de mob
#
#  O jogador mata o mob, a cabeca cai (como item ou direto na conta), ele
#  junta no /cabecas e usa como preco de rank ou vende por dinheiro.
#
#  Cada cabeca (secao Cabecas) tem:
#    Ordem                    posicao no menu
#    Nome                     como aparece nas mensagens
#    Permissao                so quem tiver ganha e usa ('' = todos)
#    Automatico               true: vai direto para a conta ao matar, sem item
#    Entregar no inventario   true: o item vai para o inventario; false: cai
#                             no chao onde o mob morreu
#    Fortuna                  true: o nivel de Pilhagem (Looting) da arma
#                             multiplica a quantidade
#    Vender                   true: pode vender no menu
#    Coletar                  true: pode retirar da conta como item
#    Mundos bloqueados        onde ela nao cai
#    Precos de venda          'economia: valor' por unidade; o jogador recebe
#                             todas ao vender (economias do economias.yml)
#    Espera para ativar       segundos entre uma ativacao e outra, por
#                             permissao: a de MENOR ordem que o jogador tiver
#    Item                     o item que cai / que e coletado. {quantidade} e
#                             quantas unidades o item carrega
#    Exibir                   o icone no /cabecas: {quantidade}, {valor_<eco>}
#                             (por unidade), {total_<eco>} (tudo que ele tem)
#
#  Para usar a cabeca como preco de rank, crie no economias.yml uma economia
#  com Provedor 'cabeca-<id>' (ja existem 'cabeca-porco' e 'cabeca-zumbi').
#
#  Mobs: quem dropa o que. Quantidade aceita faixa ('1-3').
# ==========================================================================

