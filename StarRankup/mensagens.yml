# ==========================================================================
#  StarRankup - textos
#
#  Mensagem vazia ('') simplesmente nao e enviada: e assim que se desliga um
#  aviso sem precisar de uma opcao "Ativar" para cada um.
#  Cores: &a, &c, ... e hex no formato &#RRGGBB. Placeholders do
#  PlaceholderAPI funcionam em qualquer mensagem.
#
#  Substituicoes comuns: {jogador}, {rank}, {tag}, {nome}, {proximo_tag},
#  {proximo_nome}, {prestigio}, {prestigio_tag}, {barra}, {porcentagem},
#  {fragmentos}, {prefixo}.
# ==========================================================================

Versao do modelo: 1

Prefixo: '&a&lRANKUP &8- &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  So jogador: '&cEste comando so funciona dentro do jogo.'
  Jogador offline: '&cO jogador &f{jogador} &cnao esta online.'
  Jogador nao encontrado: '&cO jogador &f{jogador} &cnunca entrou neste servidor.'
  Carregando: '&cSeus dados ainda estao carregando; tente de novo em instantes.'
  Numero invalido: '&cO numero &f{valor} &cnao vale.'
  Rank invalido: '&cNao existe um rank chamado &f{rank}&c.'
  Cabeca invalida: '&cNao existe uma cabeca chamada &f{cabeca}&c.'
  Comando desconhecido: '&cEsse subcomando nao existe. Use &f/{comando} ajuda&c.'
  Desligado: '&cEste recurso esta desligado neste servidor.'

# Textos curtos usados nos menus, nas listagens e nos placeholders.
Etiquetas:
  Sem posicao: '&7--'
  Ninguem: '&7Ninguem'
  Sim: '&aSim'
  Nao: '&cNao'
  Ja liberado: '&aLiberado'
  Sem preco: '&aGratis'
  # Como cada parte de um preco aparece em mensagens ("10.000 coins, 50 fragmentos").
  Formato do preco: '&f{valor} {abreviacao}'
  Separador de preco: '&7, '
  # Como um requisito aparece nas listas dos menus ({tem}/{precisa}).
  Requisito feito: '&8- &f{nome}: &a{tem}&7/&a{precisa} &a✔'
  Requisito faltando: '&8- &f{nome}: &c{tem}&7/&c{precisa} &c✘'
  # Tempo restante ate a liberacao de um rank ({dias}, {horas}, {minutos}).
  Liberacao: '&e{dias}d {horas}h {minutos}m'
  Liberacao sem dias: '&e{horas}h {minutos}m'
  Tipo rankup: '&aRankup'
  Tipo prestigio: '&cPrestigio'
  Tipo setado: '&eAjustado pela equipe'

Rankup:
  Sem proximo: '&cVoce ja esta no ultimo rank. Que tal um &f/prestigio&c?'
  Bloqueado: '&cVoce faz parte da equipe e nao participa da evolucao de ranks.'
  Sem permissao do rank: '&cVoce nao tem permissao para evoluir para {tag}&c.'
  Nao liberado: '&cO rank {tag} &cso sera liberado em &f{liberacao}&c.'
  Faltando: '&cVoce ainda nao tem tudo para {tag}&c. Falta: {falta}&c.'
  Espera: '&cAguarde &f{segundos}s &cpara evoluir de novo.'
  # Enviada UMA vez quando o progresso passa do 'Avisar ao chegar em' do config.
  Quase la: '{prefixo}&eVoce esta em &f{porcentagem} &epara {proximo_tag}&e. Continue assim!'
  # /rankup max
  Evoluiu varios: '{prefixo}&aVoce evoluiu &f{quantidade} &arank(s) de uma vez e agora e {tag}&a.'
  Nada para evoluir: '&cVoce nao tem o suficiente para evoluir nenhum rank agora.'
  Cancelado: '&7Evolucao cancelada.'
  # Cobranca falhou no meio (a economia recusou).
  Falha ao cobrar: '&cNao foi possivel cobrar &f{economia}&c. Nada foi alterado.'

Prestigio:
  Desligado: '&cO prestigio esta desligado neste servidor.'
  Rank insuficiente: '&cVoce precisa chegar ao rank {tag} &cpara dar prestigio.'
  Maximo: '&cVoce ja esta no prestigio maximo (&f{maximo}&c).'
  Faltando: '&cVoce ainda nao tem tudo para o prestigio &f{prestigio}&c. Falta: {falta}&c.'
  Espera: '&cAguarde &f{segundos}s &cpara prestigiar de novo.'
  Cancelado: '&7Prestigio cancelado.'

Auto:
  Rankup ligado: '{prefixo}&aAuto-rankup &fligado&a: voce evolui sozinho quando tiver o preco.'
  Rankup desligado: '{prefixo}&cAuto-rankup &fdesligado&c.'
  Prestigio ligado: '{prefixo}&aAuto-prestigio &fligado&a: voce prestigia sozinho ao chegar no ultimo rank.'
  Prestigio desligado: '{prefixo}&cAuto-prestigio &fdesligado&c.'
  Desligado no servidor: '&cEste recurso esta desligado neste servidor.'

Esconder:
  Escondida: '{prefixo}&7Sua tag de rank agora fica &fescondida&7.'
  Mostrada: '{prefixo}&7Sua tag de rank voltou a &faparecer&7.'

Fragmentos:
  # Aviso ao ganhar. Chat e actionbar sao independentes: deixe um vazio para
  # usar so o outro.
  Ganho chat: ''
  Ganho actionbar: '&b+{quantidade} {nome} &7(total: &f{total}&7)'
  Saldo: '{prefixo}&fVoce tem &b{fragmentos} {nome}&f.'
  Saldo de outro: '{prefixo}&f{jogador} tem &b{fragmentos} {nome}&f.'
  Uso enviar: '&cUse: &f/fragmentos enviar <jogador> <quantia>'
  Enviou: '{prefixo}&aVoce enviou &b{quantidade} {nome} &apara &f{jogador}&a. Restam &b{fragmentos}&a.'
  Recebeu: '{prefixo}&aVoce recebeu &b{quantidade} {nome} &ade &f{jogador}&a.'
  Insuficiente: '&cVoce so tem &b{fragmentos} {nome}&c.'
  Para si mesmo: '&cVoce nao pode enviar fragmentos para voce mesmo.'
  Item ativado: '{prefixo}&aVoce guardou &b{quantidade} {nome}&a. Agora tem &b{total}&a.'
  Item compactado: '{prefixo}&aVoce juntou &b{quantidade} {nome} &aem um item so.'
  Nada para compactar: '&cNao ha outros itens de fragmento no seu inventario.'
  Mundo bloqueado: '&cVoce nao pode ativar fragmentos neste mundo.'

Cabecas:
  Ganho actionbar: '&e+{quantidade} {cabeca} &7(voce tem &f{total}&7)'
  Ganho chat: ''
  Item ativado: '{prefixo}&aVoce guardou &f{quantidade}x {cabeca}&a. Agora tem &f{total}&a.'
  Espera: '&cAguarde &f{segundos}s &cpara guardar outra cabeca.'
  Vendeu: '{prefixo}&aVoce vendeu &f{quantidade}x {cabeca} &apor {valor}&a.'
  Nada para vender: '&cVoce nao tem nenhuma cabeca de {cabeca} &cpara vender.'
  Nao vende: '&cEsta cabeca nao pode ser vendida.'
  Coletou: '{prefixo}&aVoce retirou &f{quantidade}x {cabeca}&a. Restam &f{restante}&a.'
  Nao coleta: '&cEsta cabeca nao pode ser retirada.'
  Nada para coletar: '&cVoce nao tem nenhuma cabeca de {cabeca}&c.'
  Sem espaco: '&cLibere espaco no inventario antes de retirar.'
  Sem permissao da cabeca: '&cVoce nao tem permissao para esta cabeca.'
  Inventario cheio: '&cSeu inventario esta cheio; a cabeca caiu no chao.'

Itens:
  Rankup ativado: '{prefixo}&aItem de rankup ativado: voce evoluiu para {tag}&a.'
  Rankup sem proximo: '&cVoce ja esta no ultimo rank; o item nao foi gasto.'
  Prestigio ativado: '{prefixo}&aItem de prestigio ativado: voce agora e prestigio &f{prestigio}&a.'
  Prestigio maximo: '&cVoce ja esta no prestigio maximo; o item nao foi gasto.'
  Sem permissao: '&cVoce nao tem permissao para usar este item.'

Ver:
  Cabecalho: '&8&m--------&r &a&lRANK DE {jogador} &8&m--------'
  Linhas:
    - '&fRank: {tag} &7({nome}&7)'
    - '&fProximo: {proximo_tag}'
    - '&fProgresso: {barra} &7{porcentagem}'
    - '&fPrestigio: &f{prestigio} {prestigio_tag}'
    - '&fFragmentos: &b{fragmentos}'
    - '&fRankups feitos: &f{rankups}'
    - '&fAuto-rankup: {autorankup} &8| &fAuto-prestigio: {autoprestigio}'
  Rodape: '&8&m------------------------------------'

Historico:
  Vazio: '&7Voce ainda nao evoluiu nenhuma vez.'

Top:
  Atualizando: '&7Carregando o top...'

Staff:
  # Mensagem de boas-vindas para quem tem starrankup.admin, alguns segundos
  # depois de entrar. Uma linha por item; vazio desliga so aquela linha.
  Boas-vindas:
    - ''
    - '&a&lSTARRANKUP &7v{versao} &8- &fObrigado por usar o StarRankup, &a{jogador}&f!'
    - '&7Ranks: &f{ranks} &8| &7Economias: &f{economias} &8| &7Cabecas: &f{cabecas} &8| &7Banco: &f{banco}'
    - '&7Comandos da equipe: &f/starrankup &7(setrank, setprestigio, darrankup, fragmentos, cabecas, recarregar)'
    - '&7Placeholders: &f%starrankup_rank_tag% &7e outros na descricao do plugin.'
    - ''

Administracao:
  Uso: '&cUse: &f/starrankup ajuda'
  Recarregado: '{prefixo}&aConfiguracoes recarregadas. &7({ranks} rank(s), {economias} economia(s), {cabecas} cabeca(s))'
  Salvo: '{prefixo}&aDados gravados no banco.'
  Rank setado: '{prefixo}&aO rank de &f{jogador} &aagora e {tag}&a.'
  Rank setado (jogador): '{prefixo}&eSeu rank foi ajustado para {tag}&e.'
  Prestigio setado: '{prefixo}&aO prestigio de &f{jogador} &aagora e &f{prestigio}&a.'
  Prestigio setado (jogador): '{prefixo}&eSeu prestigio foi ajustado para &f{prestigio}&e.'
  Deu rankup: '{prefixo}&aVoce entregou &f{quantidade} &aitem(ns) de rankup para &f{jogador}&a.'
  Deu prestigio: '{prefixo}&aVoce entregou &f{quantidade} &aitem(ns) de prestigio para &f{jogador}&a.'
  Recebeu item: '{prefixo}&aVoce recebeu &f{quantidade}x {item}&a.'
  Fragmentos deu: '{prefixo}&aVoce deu &b{quantidade} &afragmentos para &f{jogador}&a. Saldo: &b{saldo}&a.'
  Fragmentos removeu: '{prefixo}&aVoce removeu &b{quantidade} &afragmentos de &f{jogador}&a. Saldo: &b{saldo}&a.'
  Fragmentos setou: '{prefixo}&aOs fragmentos de &f{jogador} &aagora sao &b{saldo}&a.'
  Fragmentos (jogador): '{prefixo}&eSeus fragmentos agora sao &b{saldo}&e.'
  Fragmentos item: '{prefixo}&aVoce entregou um item de &b{quantidade} &afragmentos para &f{jogador}&a.'
  Cabecas deu: '{prefixo}&aVoce deu &f{quantidade}x {cabeca} &apara &f{jogador}&a. Saldo: &f{saldo}&a.'
  Cabecas removeu: '{prefixo}&aVoce removeu &f{quantidade}x {cabeca} &ade &f{jogador}&a. Saldo: &f{saldo}&a.'
  Cabecas setou: '{prefixo}&aAs cabecas {cabeca} &ade &f{jogador} &aagora sao &f{saldo}&a.'
  Cabecas (jogador): '{prefixo}&eSuas cabecas {cabeca} &eagora sao &f{saldo}&e.'
  Cabecas item: '{prefixo}&aVoce entregou &f{quantidade}x {cabeca} &a(item) para &f{jogador}&a.'
  Inventario cheio: '&cO inventario de &f{jogador} &cencheu: o que nao coube caiu no chao.'
  Info:
    - '&8&m--------&r &a&lSTARRANKUP &7v{versao} &8&m--------'
    - '&fRanks: &a{ranks} &8| &fEconomias: &a{economias} &8| &fCabecas: &a{cabecas}'
    - '&fBanco: &a{banco} &8| &fJogadores em memoria: &a{memoria}'
    - '&fPrestigio: &a{prestigio} &8| &fFragmentos: &a{fragmentos} &8| &fCabecas: &a{cabecas_ativas}'
    - '&fEconomias indisponiveis: &c{indisponiveis}'
    - '&8&m----------------------------------------'

Ajuda:
  Cabecalho: '&8&m--------&r &a&lSTARRANKUP &8&m--------'
  Linha: '&a/{comando} &8- &f{descricao}'
  Rodape: '&8&m----------------------------------'
  Jogador:
    - 'rank|Abre o menu principal.'
    - 'rank top|Abre os rankings.'
    - 'rank historico|Seu historico de evolucao.'
    - 'rank esconder|Esconde ou mostra sua tag.'
    - 'rank <jogador>|Ve o rank de alguem.'
    - 'rankup|Evolui de rank.'
    - 'rankup max|Evolui tudo que der de uma vez.'
    - 'ranks|Lista todos os ranks.'
    - 'prestigio|Da prestigio.'
    - 'autorankup|Liga ou desliga o auto-rankup.'
    - 'autoprestigio|Liga ou desliga o auto-prestigio.'
    - 'fragmentos [jogador]|Ve os fragmentos.'
    - 'fragmentos enviar <jogador> <quantia>|Envia fragmentos.'
    - 'cabecas|Abre o menu de cabecas.'
  Admin:
    - 'starrankup setrank <jogador> <rank>|Define o rank.'
    - 'starrankup setprestigio <jogador> <prestigio>|Define o prestigio.'
    - 'starrankup darrankup <jogador|todos> <quantia>|Entrega itens de rankup.'
    - 'starrankup darprestigio <jogador|todos> <quantia>|Entrega itens de prestigio.'
    - 'starrankup fragmentos <dar|remover|setar|item> <jogador|todos> <quantia>|Gerencia fragmentos.'
    - 'starrankup cabecas <dar|remover|setar|item> <jogador|todos> <cabeca> <quantia>|Gerencia cabecas.'
    - 'starrankup ver <jogador>|Ve os dados de alguem.'
    - 'starrankup recarregar|Recarrega os arquivos.'
    - 'starrankup salvar|Grava tudo no banco agora.'
    - 'starrankup info|Estado do plugin.'
