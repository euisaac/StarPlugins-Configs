# ==========================================================================
#  StarRankup - textos
#
#  Mensagem vazia ('') simplesmente não é enviada: é assim que se desliga um
#  aviso sem precisar de uma opção "Ativar" para cada um.
#  Cores: &a, &c, ... e hex no formato &#RRGGBB. Placeholders do
#  PlaceholderAPI funcionam em qualquer mensagem.
#
#  Substituicoes comuns: {jogador}, {rank}, {tag}, {nome}, {proximo_tag},
#  {proximo_nome}, {prestigio}, {prestigio_tag}, {barra}, {porcentagem},
#  {fragmentos}, {prefixo}.
# ==========================================================================

Versao do modelo: 1

Prefixo: '&a&lRANKUP &8- &7'

Geral:
  Sem permissao: '&cVocê não tem permissão para isso.'
  So jogador: '&cEste comando só funciona dentro do jogo.'
  Jogador offline: '&cO jogador &f{jogador} &cnão está online.'
  Jogador nao encontrado: '&cO jogador &f{jogador} &cnunca entrou neste servidor.'
  Carregando: '&cSeus dados ainda estão carregando; tente de novo em instantes.'
  Numero invalido: '&cO número &f{valor} &cnão vale.'
  Rank invalido: '&cNão existe um rank chamado &f{rank}&c.'
  Cabeca invalida: '&cNão existe uma cabeça chamada &f{cabeca}&c.'
  Comando desconhecido: '&cEsse subcomando não existe. Use &f/{comando} ajuda&c.'
  Desligado: '&cEste recurso está desligado neste servidor.'

# Textos curtos usados nos menus, nas listagens e nos placeholders.
Etiquetas:
  Sem posicao: '&7--'
  Ninguem: '&7Ninguém'
  Sim: '&aSim'
  Nao: '&cNão'
  Ja liberado: '&aLiberado'
  Sem preco: '&aGrátis'
  # Como cada parte de um preço aparece em mensagens ("10.000 coins, 50 fragmentos").
  Formato do preco: '&f{valor} {abreviacao}'
  Separador de preco: '&7, '
  # Como um requisito aparece nas listas dos menus ({tem}/{precisa}).
  Requisito feito: '&8- &f{nome}: &a{tem}&7/&a{precisa} &a✔'
  Requisito faltando: '&8- &f{nome}: &c{tem}&7/&c{precisa} &c✘'
  # Tempo restante até a liberacao de um rank ({dias}, {horas}, {minutos}).
  Liberacao: '&e{dias}d {horas}h {minutos}m'
  Liberacao sem dias: '&e{horas}h {minutos}m'
  Tipo rankup: '&aRankup'
  Tipo prestigio: '&cPrestígio'
  Tipo setado: '&eAjustado pela equipe'

Rankup:
  Sem proximo: '&cVocê já está no último rank. Que tal um &f/prestigio&c?'
  Bloqueado: '&cVocê faz parte da equipe e não participa da evolução de ranks.'
  Sem permissao do rank: '&cVocê não tem permissão para evoluir para {tag}&c.'
  Nao liberado: '&cO rank {tag} &csó será liberado em &f{liberacao}&c.'
  # {falta} resume o que está faltando numa linha só. Para escrever requisito
  # por requisito, use {<economia>_has}, {<economia>_need} e {<economia>_falta}
  # -- o id é o do economias.yml ({money_has}, {fragmentos_need}...). O bloco
  # com | vira várias linhas no chat:
  #
  # Faltando: |-
  #   &a&lREQUISITOS PARA EVOLUIR
  #   &fVocê tem &7{money_has} &fde &a{money_need} &fcoins.
  #   &fVocê tem &7{fragmentos_has} &fde &a{fragmentos_need} &ffragmentos.
  #   &r
  #   &cVocê ainda não pode evoluir para {proximo_tag}&c.
  Faltando: '&cVocê ainda não tem tudo para {tag}&c. Falta: {falta}&c.'
  Espera: '&cAguarde &f{segundos}s &cpara evoluir de novo.'
  # Enviada UMA vez quando o progresso passa do 'Avisar ao chegar em' do config.
  Quase la: '{prefixo}&eVocê está em &f{porcentagem} &epara {proximo_tag}&e. Continue assim!'
  # /rankup max
  Evoluiu varios: '{prefixo}&aVocê evoluiu &f{quantidade} &arank(s) de uma vez e agora é {tag}&a.'
  Nada para evoluir: '&cVocê não tem o suficiente para evoluir nenhum rank agora.'
  Cancelado: '&7Evolução cancelada.'
  # Cobrança falhou no meio (a economia recusou).
  Falha ao cobrar: '&cNão foi possível cobrar &f{economia}&c. Nada foi alterado.'

Prestigio:
  Desligado: '&cO prestígio está desligado neste servidor.'
  Rank insuficiente: '&cVocê precisa chegar ao rank {tag} &cpara dar prestígio.'
  Maximo: '&cVocê já está no prestígio máximo (&f{maximo}&c).'
  Faltando: '&cVocê ainda não tem tudo para o prestígio &f{prestigio}&c. Falta: {falta}&c.'
  Espera: '&cAguarde &f{segundos}s &cpara prestigiar de novo.'
  Cancelado: '&7Prestígio cancelado.'

Auto:
  Rankup ligado: '{prefixo}&aAuto-rankup &fligado&a: você evolui sozinho quando tiver o preço.'
  Rankup desligado: '{prefixo}&cAuto-rankup &fdesligado&c.'
  Prestigio ligado: '{prefixo}&aAuto-prestígio &fligado&a: você prestigia sozinho ao chegar no último rank.'
  Prestigio desligado: '{prefixo}&cAuto-prestígio &fdesligado&c.'
  Desligado no servidor: '&cEste recurso está desligado neste servidor.'

Esconder:
  Escondida: '{prefixo}&7Sua tag de rank agora fica &fescondida&7.'
  Mostrada: '{prefixo}&7Sua tag de rank voltou a &faparecer&7.'

Fragmentos:
  # Aviso ao ganhar. Chat e actionbar são independentes: deixe um vazio para
  # usar só o outro.
  Ganho chat: ''
  Ganho actionbar: '&b+{quantidade} {nome} &7(total: &f{total}&7)'
  Saldo: '{prefixo}&fVocê tem &b{fragmentos} {nome}&f.'
  Saldo de outro: '{prefixo}&f{jogador} tem &b{fragmentos} {nome}&f.'
  Uso enviar: '&cUse: &f/fragmentos enviar <jogador> <quantia>'
  Enviou: '{prefixo}&aVocê enviou &b{quantidade} {nome} &apara &f{jogador}&a. Restam &b{fragmentos}&a.'
  Recebeu: '{prefixo}&aVocê recebeu &b{quantidade} {nome} &ade &f{jogador}&a.'
  Insuficiente: '&cVocê só tem &b{fragmentos} {nome}&c.'
  Para si mesmo: '&cVocê não pode enviar fragmentos para você mesmo.'
  Item ativado: '{prefixo}&aVocê guardou &b{quantidade} {nome}&a. Agora tem &b{total}&a.'
  Item compactado: '{prefixo}&aVocê juntou &b{quantidade} {nome} &aem um item só.'
  Nada para compactar: '&cNão há outros itens de fragmento no seu inventario.'
  Mundo bloqueado: '&cVocê não pode ativar fragmentos neste mundo.'

Cabecas:
  Ganho actionbar: '&e+{quantidade} {cabeca} &7(você tem &f{total}&7)'
  Ganho chat: ''
  Item ativado: '{prefixo}&aVocê guardou &f{quantidade}x {cabeca}&a. Agora tem &f{total}&a.'
  Espera: '&cAguarde &f{segundos}s &cpara guardar outra cabeça.'
  Vendeu: '{prefixo}&aVocê vendeu &f{quantidade}x {cabeca} &apor {valor}&a.'
  Nada para vender: '&cVocê não tem nenhuma cabeça de {cabeca} &cpara vender.'
  Nao vende: '&cEsta cabeça não pode ser vendida.'
  Coletou: '{prefixo}&aVocê retirou &f{quantidade}x {cabeca}&a. Restam &f{restante}&a.'
  Nao coleta: '&cEsta cabeça não pode ser retirada.'
  Nada para coletar: '&cVocê não tem nenhuma cabeça de {cabeca}&c.'
  Sem espaco: '&cLibere espaço no inventario antes de retirar.'
  Sem permissao da cabeca: '&cVocê não tem permissão para esta cabeça.'
  Inventario cheio: '&cSeu inventario está cheio; a cabeça caiu no chão.'

Itens:
  Rankup ativado: '{prefixo}&aItem de rankup ativado: você evoluiu para {tag}&a.'
  Rankup sem proximo: '&cVocê já está no último rank; o item não foi gasto.'
  Prestigio ativado: '{prefixo}&aItem de prestígio ativado: você agora é prestígio &f{prestigio}&a.'
  Prestigio maximo: '&cVocê já está no prestígio máximo; o item não foi gasto.'
  Sem permissao: '&cVocê não tem permissão para usar este item.'

Ver:
  Cabecalho: '&8&m--------&r &a&lRANK DE {jogador} &8&m--------'
  Linhas:
    - '&fRank: {tag} &7({nome}&7)'
    - '&fPróximo: {proximo_tag}'
    - '&fProgresso: {barra} &7{porcentagem}'
    - '&fPrestigio: &f{prestigio} {prestigio_tag}'
    - '&fFragmentos: &b{fragmentos}'
    - '&fRankups feitos: &f{rankups}'
    - '&fAuto-rankup: {autorankup} &8| &fAuto-prestigio: {autoprestigio}'
  Rodape: '&8&m------------------------------------'

Historico:
  Vazio: '&7Você ainda não evoluiu nenhuma vez.'

Top:
  Atualizando: '&7Carregando o top...'

Staff:
  # Mensagem de boas-vindas para quem tem starrankup.admin, alguns segundos
  # depois de entrar. Uma linha por item; vazio desliga só aquela linha.
  Boas-vindas:
    - ''
    - '&a&lSTARRANKUP &7v{versao} &8- &fObrigado por usar o StarRankup, &a{jogador}&f!'
    - '&7Ranks: &f{ranks} &8| &7Economias: &f{economias} &8| &7Cabecas: &f{cabecas} &8| &7Banco: &f{banco}'
    - '&7Comandos da equipe: &f/starrankup &7(setrank, setprestigio, darrankup, fragmentos, cabeças, recarregar)'
    - '&7Placeholders: &f%starrankup_rank_tag% &7e outros na descrição do plugin.'
    - ''

Administracao:
  Uso: '&cUse: &f/starrankup ajuda'
  Recarregado: '{prefixo}&aConfigurações recarregadas. &7({ranks} rank(s), {economias} economia(s), {cabecas} cabeça(s))'
  Salvo: '{prefixo}&aDados gravados no banco.'
  Rank setado: '{prefixo}&aO rank de &f{jogador} &aagora é {tag}&a.'
  Rank setado (jogador): '{prefixo}&eSeu rank foi ajustado para {tag}&e.'
  Prestigio setado: '{prefixo}&aO prestígio de &f{jogador} &aagora é &f{prestigio}&a.'
  Prestigio setado (jogador): '{prefixo}&eSeu prestígio foi ajustado para &f{prestigio}&e.'
  Deu rankup: '{prefixo}&aVocê entregou &f{quantidade} &aitem(ns) de rankup para &f{jogador}&a.'
  Deu prestigio: '{prefixo}&aVocê entregou &f{quantidade} &aitem(ns) de prestígio para &f{jogador}&a.'
  Recebeu item: '{prefixo}&aVocê recebeu &f{quantidade}x {item}&a.'
  Fragmentos deu: '{prefixo}&aVocê deu &b{quantidade} &afragmentos para &f{jogador}&a. Saldo: &b{saldo}&a.'
  Fragmentos removeu: '{prefixo}&aVocê removeu &b{quantidade} &afragmentos de &f{jogador}&a. Saldo: &b{saldo}&a.'
  Fragmentos setou: '{prefixo}&aOs fragmentos de &f{jogador} &aagora são &b{saldo}&a.'
  Fragmentos (jogador): '{prefixo}&eSeus fragmentos agora são &b{saldo}&e.'
  Fragmentos item: '{prefixo}&aVocê entregou um item de &b{quantidade} &afragmentos para &f{jogador}&a.'
  Cabecas deu: '{prefixo}&aVocê deu &f{quantidade}x {cabeca} &apara &f{jogador}&a. Saldo: &f{saldo}&a.'
  Cabecas removeu: '{prefixo}&aVocê removeu &f{quantidade}x {cabeca} &ade &f{jogador}&a. Saldo: &f{saldo}&a.'
  Cabecas setou: '{prefixo}&aAs cabeças {cabeca} &ade &f{jogador} &aagora são &f{saldo}&a.'
  Cabecas (jogador): '{prefixo}&eSuas cabeças {cabeca} &eagora são &f{saldo}&e.'
  Cabecas item: '{prefixo}&aVocê entregou &f{quantidade}x {cabeca} &a(item) para &f{jogador}&a.'
  Inventario cheio: '&cO inventario de &f{jogador} &cencheu: o que não coube caiu no chão.'
  Info:
    - '&8&m--------&r &a&lSTARRANKUP &7v{versao} &8&m--------'
    - '&fRanks: &a{ranks} &8| &fEconomias: &a{economias} &8| &fCabecas: &a{cabecas}'
    - '&fBanco: &a{banco} &8| &fJogadores em memória: &a{memoria}'
    - '&fPrestigio: &a{prestigio} &8| &fFragmentos: &a{fragmentos} &8| &fCabecas: &a{cabecas_ativas}'
    - '&fEconomias indisponíveis: &c{indisponiveis}'
    - '&8&m----------------------------------------'

Ajuda:
  Cabecalho: '&8&m--------&r &a&lSTARRANKUP &8&m--------'
  Linha: '&a/{comando} &8- &f{descricao}'
  Rodape: '&8&m----------------------------------'
  Jogador:
    - 'rank|Abre o menu principal.'
    - 'rank top|Abre os rankings.'
    - 'rank histórico|Seu histórico de evolução.'
    - 'rank esconder|Esconde ou mostra sua tag.'
    - 'rank <jogador>|Vê o rank de alguém.'
    - 'rankup|Evolui de rank.'
    - 'rankup max|Evolui tudo que der de uma vez.'
    - 'ranks|Lista todos os ranks.'
    - 'prestígio|Da prestígio.'
    - 'autorankup|Liga ou desliga o auto-rankup.'
    - 'autoprestigio|Liga ou desliga o auto-prestigio.'
    - 'fragmentos [jogador]|Vê os fragmentos.'
    - 'fragmentos enviar <jogador> <quantia>|Envia fragmentos.'
    - 'cabeças|Abre o menu de cabeças.'
  Admin:
    - 'starrankup setrank <jogador> <rank>|Define o rank.'
    - 'starrankup setprestigio <jogador> <prestigio>|Define o prestígio.'
    - 'starrankup darrankup <jogador|todos> <quantia>|Entrega itens de rankup.'
    - 'starrankup darprestigio <jogador|todos> <quantia>|Entrega itens de prestígio.'
    - 'starrankup fragmentos <dar|remover|setar|item> <jogador|todos> <quantia>|Gerencia fragmentos.'
    - 'starrankup cabeças <dar|remover|setar|item> <jogador|todos> <cabeca> <quantia>|Gerencia cabeças.'
    - 'starrankup ver <jogador>|Vê os dados de alguém.'
    - 'starrankup recarregar|Recarrega os arquivos.'
    - 'starrankup salvar|Grava tudo no banco agora.'
    - 'starrankup info|Estado do plugin.'
