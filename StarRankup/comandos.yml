# ==========================================================================
#  StarRankup - nomes dos comandos
#
#  Aqui você troca o nome dos comandos e acrescenta apelidos, sem mexer no
#  jar. Separe com | -- o primeiro é o nome principal e o resto vira apelido.
#
#  Os nomes que já vem no plugin (/rank, /rankup, /ranks, /prestigio,
#  /autorankup, /autoprestigio, /fragmentos, /cabecas e /starrankup, com os
#  apelidos deles) continuam funcionando de qualquer jeito. Deixe a linha
#  vazia para não registrar nada a mais.
#
#  Exemplo: rankup: 'rankup|up|subir'
# ==========================================================================

Versao do modelo: 1

comandos:
  rank: ''
  rankup: ''
  ranks: ''
  prestigio: ''
  autorankup: ''
  autoprestigio: ''
  fragmentos: ''
  cabecas: ''
  starrankup: ''
