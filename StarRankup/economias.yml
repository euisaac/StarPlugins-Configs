# ==========================================================================
#  StarRankup - economias aceitas nos preços
#
#  Cada preço do ranks.yml e do prestigios.yml aponta para um id daqui.
#  Um rank pode cobrar varias economias ao mesmo tempo: o jogador precisa
#  ter todas.
#
#  Provedores:
#    VAULT                  dinheiro do Vault (Essentials, CMI, StarEconomia...)
#    STARECONOMIA           uma moeda do StarEconomia; a moeda vai em 'Moeda'
#    stareconomia-<moeda>   atalho: 'stareconomia-cash' = moeda cash
#    PLAYERPOINTS           pontos do PlayerPoints
#    EXP                    experiência do jogador (níveis ou pontos)
#    ITEM                   um item do inventario (diamantes, por exemplo)
#    FRAGMENTOS             os fragmentos deste plugin
#    CABECA                 uma cabeça de mob deste plugin; o id vai em 'Cabeca'
#    cabeca-<id>            atalho: 'cabeca-porco' = cabeça porco do cabecas.yml
#    PLACEHOLDER            um número de OUTRO plugin, lido pelo PlaceholderAPI
#                           (kills, tempo online, nível do mcMMO...). Serve de
#                           REQUISITO: o plugin confere se o jogador tem, mas
#                           não consegue tirar -- por isso 'Consumir' é sempre
#                           false nele.
#
#  Chaves comuns:
#    Nome        como aparece nas mensagens ("Dinheiro")
#    Abreviacao  nome curto para lore e barra ("coins")
#    Símbolo     texto antes do valor ("$")
#    Sufixo      texto depois do valor (" coins")
#    Formato     PADRAO (segue o 'Formato de números' do config), LETRA (1,5K)
#                ou NUMERO (1.500)
#    Consumir    false = só exige ter, não cobra (útil para kills e tempo)
#    Permissão   quem não tiver não consegue pagar com esta economia ('' = todos)
#
#  Um Provedor que não esteja nesta lista e tratado como o id de uma moeda do
#  StarEconomia ('reais' vale o mesmo que 'stareconomia-reais').
#
#  Nos textos, cada economia tem {<id>_has} (o que o jogador tem),
#  {<id>_need} (o que o rank pede) e {<id>_falta} -- por exemplo
#  {money_has} e {money_need}.
#
#  Nenhum plugin de economia é obrigatorio: a economia é procurada quando e
#  usada, então pode subir depois do StarRankup.
# ==========================================================================

Versao do modelo: 1

Economias:
  money:
    Provedor: VAULT
    Nome: 'Dinheiro'
    Abreviacao: 'coins'
    Simbolo: '$'
    Sufixo: ''
    Formato: PADRAO
    Consumir: true
    Permissao: ''

  fragmentos:
    Provedor: FRAGMENTOS
    Nome: 'Fragmentos'
    Abreviacao: 'frags'
    Simbolo: ''
    Sufixo: ' fragmentos'
    Formato: PADRAO
    Consumir: true
    Permissao: ''

  cabeca-porco:
    Provedor: 'cabeca-porco'
    Nome: 'Cabeças de Porco'
    Abreviacao: 'porcos'
    Simbolo: ''
    Sufixo: ' cabecas de porco'
    Formato: PADRAO
    Consumir: true
    Permissao: ''

  cabeca-zumbi:
    Provedor: 'cabeca-zumbi'
    Nome: 'Cabeças de Zumbi'
    Abreviacao: 'zumbis'
    Simbolo: ''
    Sufixo: ' cabecas de zumbi'
    Formato: PADRAO
    Consumir: true
    Permissao: ''

  # Exemplos prontos para ligar: tire o # da frente.

  # cash:
