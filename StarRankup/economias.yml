  # xp:
  #   Provedor: EXP
  #   Nome: 'Níveis de XP'
  #   Abreviacao: 'níveis'
  #   Simbolo: ''
  #   Sufixo: ' níveis'
  #   # true cobra em níveis; false em pontos de experiência.
  #   Usar niveis: true
  #   Consumir: true
  #   Permissao: ''

  # diamantes:
  #   Provedor: ITEM
  #   Material: DIAMOND
  #   # true só aceita o item sem nome nem lore.
  #   Item limpo: true
  #   Nome: 'Diamantes'
  #   Abreviacao: 'diamantes'
  #   Simbolo: ''
  #   Sufixo: ' diamantes'
