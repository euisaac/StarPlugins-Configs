  Vazio:
    Mostrar: true
    Slot: 22
    Material: COBWEB
    Nome: '&eNada por aqui...'
    Lore:
      - '&7Voce ainda nao evoluiu nenhuma vez.'

  Itens:
    anterior:
      Slot: 48
      Material: ARROW
      Nome: '&ePagina anterior'
      Acoes:
        - 'anterior'
    voltar:
      Slot: 49
      Material: BARRIER
      Nome: '&cVoltar'
      Acoes:
        - 'principal'
    proxima:
      Slot: 50
      Material: ARROW
      Nome: '&eProxima pagina'
      Acoes:
        - 'proxima'
