# ==========================================================================
#  StarRankup - as telas
#
#  Material passa pelo XSeries: o mesmo nome funciona na 1.8 e na 1.21.
#  Cabeca: Material PLAYER_HEAD + Textura (hash/URL/base64) ou Dono (nick).
#  {jogador} no Dono vira o nick de quem esta olhando.
#
#  Cada tela tem:
#    Titulo, Linhas        Titulo (ate 32 caracteres nas versoes antigas) e altura.
#    Enfeite               O vidro do fundo (Ativar: false deixa vazio).
#    Itens                 Botoes fixos: Slot/Slots, Material, Textura, Dono,
#                          Nome, Lore, Brilho, Permissao, Esconder sem
#                          permissao e Acoes.
#
#  Acoes proprias:  principal | rankup | prestigio | ranks | cabecas | top
#                   top <rank|prestigio|fragmentos|cabecas> | historico
#                   autorankup | autoprestigio | anterior | proxima | fechar
#  Acoes gerais:    comando: <cmd> | console: <cmd> | op: <cmd> | mensagem: <texto>
#                   anuncio: <texto> | titulo: <t<nl>sub> | actionbar: <texto>
#                   som: <SOM;volume;tom>
#
#  Substituicoes em qualquer texto: {jogador} {rank} {tag} {nome}
#  {proximo_tag} {proximo_nome} {prestigio} {prestigio_tag} {proximo_prestigio}
#  {barra} {porcentagem} {fragmentos} {cabecas} {rankups} {autorankup}
#  {autoprestigio} {desconto} {bonus} {posicao_rank} {posicao_prestigio}
#  {posicao_fragmentos} {pagina} {paginas} {preco_<economia>} (preco do
#  proximo rank ja com o desconto) e {tem_<economia>} (quanto o jogador
#  tem). Placeholders do PlaceholderAPI tambem funcionam.
# ==========================================================================

Versao do modelo: 1

# ---------------------------------------------------------------------------
#  /rank
# ---------------------------------------------------------------------------
Principal:
  Titulo: '&8Ranks'
  Linhas: 5
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  # O botao de evoluir muda conforme o estado. {requisitos} vira uma linha
  # por preco do proximo rank (Etiquetas do mensagens.yml).
  Rankup:
    Slot: 13
    Material: PLAYER_HEAD
    Textura: '1ad6c81f899a785ecf26be1dc48eae2bcfe777a862390f5785e95bd83bd14d'
    Nome: '&a&lEVOLUIR'
    Lore pode:
      - ''
      - '&fProximo rank: {proximo_tag}'
      - ''
      - '{requisitos}'
      - ''
      - '&fProgresso: {barra} &7{porcentagem}'
      - ''
      - '&aCLIQUE &7para evoluir!'
    Lore falta:
      - ''
      - '&fProximo rank: {proximo_tag}'
      - ''
      - '{requisitos}'
      - ''
      - '&fProgresso: {barra} &7{porcentagem}'
      - ''
      - '&cVoce ainda nao tem tudo.'
    Lore ultimo:
      - ''
      - '&dVoce chegou ao ultimo rank!'
      - '&7Use o prestigio para recomecar mais forte.'
    Lore bloqueado:
      - ''
      - '&cVoce faz parte da equipe e nao'
      - '&cparticipa da evolucao de ranks.'
    Lore nao liberado:
      - ''
      - '&fProximo rank: {proximo_tag}'
      - '&cLibera em: {liberacao}'
    Brilho quando pode: true

  Prestigio:
    Slot: 15
    Material: PLAYER_HEAD
    Textura: '3ee29e8d07c128115dd4094bf48dceed236aa21eb2022e3730ff9bf23b9a3891'
    Nome: '&c&lPRESTIGIO'
    Lore pode:
      - ''
      - '&fSeu prestigio: &f{prestigio} {prestigio_tag}'
      - '&fProximo: &c{proximo_prestigio}'
      - ''
      - '{requisitos}'
      - ''
      - '&aCLIQUE &7para prestigiar!'
    Lore falta:
      - ''
      - '&fSeu prestigio: &f{prestigio} {prestigio_tag}'
      - '&fProximo: &c{proximo_prestigio}'
      - ''
      - '{requisitos}'
      - ''
      - '&cVoce ainda nao tem tudo.'
    Lore rank insuficiente:
      - ''
      - '&fSeu prestigio: &f{prestigio} {prestigio_tag}'
      - '&fProximo: &c{proximo_prestigio}'
      - ''
      - '&cChegue ao rank {rank_necessario} &cpara prestigiar.'
    Lore maximo:
      - ''
      - '&fSeu prestigio: &f{prestigio} {prestigio_tag}'
      - ''
      - '&dVoce esta no prestigio maximo!'
    Lore desligado:
      - ''
      - '&cO prestigio esta desligado.'
    Brilho quando pode: true

  # Interruptores. Clicar alterna.
  Auto rankup:
    Slot: 30
    Material: COMPARATOR
    Nome: '&e&lAUTO-RANKUP'
    Lore:
      - ''
      - '&7Evolui sozinho quando tiver o preco.'
      - ''
      - '&fEstado: {autorankup}'
      - ''
      - '&eCLIQUE &7para alternar.'
  Auto prestigio:
    Slot: 32
    Material: REPEATER
    Nome: '&e&lAUTO-PRESTIGIO'
    Lore:
      - ''
      - '&7Prestigia sozinho ao chegar no ultimo rank.'
      - ''
      - '&fEstado: {autoprestigio}'
      - ''
      - '&eCLIQUE &7para alternar.'

  Itens:
    perfil:
      Slot: 11
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&e&lSEU PERFIL'
      Lore:
        - ''
        - '&fRank: {tag} &7({nome}&7)'
        - '&fProximo: {proximo_tag}'
        - '&fProgresso: {barra} &7{porcentagem}'
        - ''
        - '&fPrestigio: &f{prestigio} {prestigio_tag}'
        - '&fFragmentos: &b{fragmentos}'
        - '&fCabecas: &e{cabecas}'
        - '&fRankups feitos: &f{rankups}'
        - ''
        - '&fDesconto: &a{desconto}% &8| &fBonus: &a{bonus}%'
        - '&fPosicao no top: &a{posicao_rank}'
        - ''
    ranks:
      Slot: 20
      Material: BOOK
      Nome: '&6&lRANKS'
      Lore:
        - ''
        - '&7Veja todos os ranks e'
        - '&7o que cada um custa.'
        - ''
        - '&aCLIQUE &7para ver.'
      Acoes:
        - 'ranks'
    cabecas:
      Slot: 22
      Material: PLAYER_HEAD
      Textura: '621668ef7cb79dd9c22ce3d1f3f4cb6e2559893b6df4a469514e667c16aa4'
      Nome: '&d&lCABECAS'
      Lore:
        - ''
        - '&7Venda ou retire as cabecas'
        - '&7que voce juntou.'
        - ''
        - '&fVoce tem: &e{cabecas}'
        - ''
        - '&aCLIQUE &7para abrir.'
      Acoes:
        - 'cabecas'
    top:
      Slot: 24
      Material: PLAYER_HEAD
      Textura: '351137e11443a8fbb05fcd3ccc1af9bd2303918f35448185e3ed96ef184da'
      Nome: '&b&lTOP'
      Lore:
        - ''
        - '&7Os jogadores que mais'
        - '&7evoluiram no servidor.'
        - ''
        - '&aCLIQUE &7para ver.'
      Acoes:
        - 'top'
    historico:
      Slot: 40
      Material: PAPER
      Nome: '&7&lHISTORICO'
      Lore:
        - ''
        - '&7Suas evolucoes, com data e hora.'
        - ''
        - '&aCLIQUE &7para ver.'
      Acoes:
        - 'historico'
    fechar:
      Slot: 44
      Material: BARRIER
      Nome: '&cFechar'
      Acoes:
        - 'fechar'

# ---------------------------------------------------------------------------
#  Confirmacao do /rankup. Extras: {requisitos}, {proximo_tag}, {proximo_nome}.
# ---------------------------------------------------------------------------
Rankup:
  Titulo: '&8Evoluir para {proximo_nome}?'
  Linhas: 3
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '
  Confirmar:
    Slot: 11
    Material: LIME_STAINED_GLASS_PANE
    Nome: '&a&lCONFIRMAR'
    Lore:
      - '&7Evoluir para {proximo_tag}&7.'
  Informacao:
    Slot: 13
    Material: PLAYER_HEAD
    Textura: '1ad6c81f899a785ecf26be1dc48eae2bcfe777a862390f5785e95bd83bd14d'
    Nome: '&a{tag} &7-> {proximo_tag}'
    Lore:
      - ''
      - '&fPreco:'
      - '{requisitos}'
      - ''
      - '&fProgresso: {barra} &7{porcentagem}'
  Cancelar:
    Slot: 15
    Material: RED_STAINED_GLASS_PANE
    Nome: '&c&lCANCELAR'
    Lore:
      - '&7Nada e cobrado.'

# ---------------------------------------------------------------------------
#  Confirmacao do /prestigio. Extras: {requisitos}, {proximo_prestigio}.
# ---------------------------------------------------------------------------
Prestigio:
  Titulo: '&8Dar prestigio?'
  Linhas: 3
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '
  Confirmar:
    Slot: 11
    Material: LIME_STAINED_GLASS_PANE
    Nome: '&a&lCONFIRMAR'
    Lore:
      - '&7Ir para o prestigio &f{proximo_prestigio}&7.'
      - '&cSeu rank volta ao inicio!'
  Informacao:
    Slot: 13
    Material: PLAYER_HEAD
    Textura: '3ee29e8d07c128115dd4094bf48dceed236aa21eb2022e3730ff9bf23b9a3891'
    Nome: '&cPrestigio {prestigio} &7-> &c{proximo_prestigio}'
    Lore:
      - ''
      - '&fPreco:'
      - '{requisitos}'
      - ''
      - '&7Os ranks ficam &c{acrescimo}% &7mais caros'
      - '&7e voce ganha &a{bonus_prestigio}% &7a mais de drops.'
  Cancelar:
    Slot: 15
    Material: RED_STAINED_GLASS_PANE
    Nome: '&c&lCANCELAR'
    Lore:
      - '&7Nada e cobrado.'

# ---------------------------------------------------------------------------
#  /ranks -- a escada inteira. Em cada rank: {rank_tag}, {rank_nome},
#  {rank_ordem}, {requisitos} (precos ja com prestigio e desconto),
#  {liberacao}.
# ---------------------------------------------------------------------------
Ranks:
  Titulo: '&8Ranks ({pagina}/{paginas})'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]

  Rank:
    # Material de cada estado. Uma cabeca com Textura tambem serve.
    Material concluido: LIME_STAINED_GLASS_PANE
    Material atual: YELLOW_STAINED_GLASS_PANE
    Material proximo: ORANGE_STAINED_GLASS_PANE
    Material futuro: RED_STAINED_GLASS_PANE
    Nome: '{rank_tag} &7- &f{rank_nome}'
    Lore concluido:
      - ''
      - '&aVoce ja passou por este rank.'
    Lore atual:
      - ''
      - '&eVoce esta aqui.'
    Lore proximo:
      - ''
      - '&fPreco:'
      - '{requisitos}'
      - ''
      - '&6E o seu proximo rank!'
    Lore futuro:
      - ''
      - '&fPreco:'
      - '{requisitos}'
    Lore nao liberado:
      - ''
      - '&cLibera em: {liberacao}'
    Brilho no atual: true

  Itens:
    anterior:
      Slot: 48
      Material: ARROW
      Nome: '&ePagina anterior'
      Acoes:
        - 'anterior'
    voltar:
      Slot: 49
      Material: BARRIER
      Nome: '&cVoltar'
      Acoes:
        - 'principal'
    proxima:
      Slot: 50
      Material: ARROW
      Nome: '&eProxima pagina'
      Acoes:
        - 'proxima'

# ---------------------------------------------------------------------------
#  /cabecas -- o icone de cada cabeca vem do Exibir do cabecas.yml.
# ---------------------------------------------------------------------------
Cabecas:
  Titulo: '&8Suas cabecas'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]

  # true esconde as cabecas que o jogador nao tem (zero).
  Esconder zeradas: false

  Vazio:
    Mostrar: true
    Slot: 22
    Material: COBWEB
    Nome: '&eNada por aqui...'
    Lore:
      - '&7Voce ainda nao juntou nenhuma cabeca.'

  Itens:
    resumo:
      Slot: 4
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&e{jogador}'
      Lore:
        - ''
        - '&fCabecas guardadas: &e{cabecas}'
        - ''
    anterior:
      Slot: 48
      Material: ARROW
      Nome: '&ePagina anterior'
      Acoes:
        - 'anterior'
    voltar:
      Slot: 49
      Material: BARRIER
      Nome: '&cVoltar'
      Acoes:
        - 'principal'
    proxima:
      Slot: 50
      Material: ARROW
      Nome: '&eProxima pagina'
      Acoes:
        - 'proxima'

# ---------------------------------------------------------------------------
#  Top. Extras: {tipo} (o nome do top aberto), {minha_posicao},
#  {minha_quantidade}. No item de cada jogador: {posicao}, {jogador},
#  {valor} (rank, prestigio, fragmentos ou cabecas, conforme o top).
# ---------------------------------------------------------------------------
Top:
  Titulo: '&8Top {tipo}'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]

  # Quais tops existem e o nome de cada um.
  Tipos:
    rank:
      Ativar: true
      Nome: '&aRank'
    prestigio:
      Ativar: true
      Nome: '&cPrestigio'
    fragmentos:
      Ativar: true
      Nome: '&bFragmentos'
    cabecas:
      Ativar: true
      Nome: '&eCabecas'

  # Clicar troca o top mostrado, na ordem acima.
  Seletor:
    Slot: 4
    Material: COMPASS
    Nome: '&e&lESCOLHER TOP'
    Lore:
      - ''
      - '{tipos}'
      - ''
      - '&eCLIQUE &7para trocar.'
    Linha do tipo aberto: ' &f> {nome}'
    Linha dos outros: ' &8- &7{nome}'

  Jogador:
    Material: PLAYER_HEAD
    # false usa sempre o material acima, sem a skin de cada um.
    Usar a cabeca do jogador: true
    Nome: '&e{posicao}. &f{jogador}'
    Lore:
      - ''
      - '&f{tipo}: &a{valor}'
      - '&fPrestigio: &c{prestigio}'
      - '&fPosicao: &e{posicao}'
      - ''
    Brilho no primeiro: true

  Vazio:
    Mostrar: false
    Material: GRAY_STAINED_GLASS_PANE
    Nome: '&7{posicao}. &8---'
    Lore: [ ]

  Itens:
    eu:
      Slot: 49
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&e{jogador}'
      Lore:
        - ''
        - '&fSua posicao: &a{minha_posicao}'
        - '&fVoce: &a{minha_quantidade}'
        - ''
    anterior:
      Slot: 48
      Material: ARROW
      Nome: '&ePagina anterior'
      Acoes:
        - 'anterior'
    voltar:
      Slot: 45
      Material: BARRIER
      Nome: '&cVoltar'
      Acoes:
        - 'principal'
    proxima:
      Slot: 50
      Material: ARROW
      Nome: '&eProxima pagina'
      Acoes:
        - 'proxima'

# ---------------------------------------------------------------------------
#  Historico. Em cada registro: {tipo}, {de}, {para}, {data}.
# ---------------------------------------------------------------------------
Historico:
  Titulo: '&8Seu historico'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]

  Registro:
    Material rankup: LIME_DYE
    Material prestigio: RED_DYE
    Material setado: YELLOW_DYE
    Nome: '{tipo}'
    Lore:
      - ''
      - '&fDe: {de}'
      - '&fPara: {para}'
      - '&fQuando: &7{data}'
