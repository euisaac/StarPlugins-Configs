# ==========================================================================
#  StarRankup - de onde saem os fragmentos
#
#  Blocos: ao quebrar. Mobs: ao matar. Em cada um:
#    Chance       de 0 a 100 (100 = sempre)
#    Quantidade   quantos fragmentos caem. Aceita faixa: '5-10'
#    Permissao    so quem tiver ganha ('' = todos)
#
#  Os nomes de bloco e de mob sao os modernos (STONE, DIAMOND_ORE, ZOMBIE);
#  o plugin traduz para a versao do servidor. O bonus de permissao e o bonus
#  de prestigio entram por cima da quantidade.
# ==========================================================================

