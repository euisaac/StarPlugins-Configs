# ==========================================================================
#  StarFragmentos - os fragmentos
#
#  Crie quantos quiser. Cada fragmento tem:
#
#    Nome        Nome com cores; e o que aparece no menu, no item e no chat.
#    Material    Icone. PLAYER_HEAD com Textura da uma cabeca customizada;
#                qualquer outro material (DIAMOND, EMERALD...) tambem serve.
#    Textura     Hash, URL ou base64 da textura da cabeca (minecraft-heads).
#    Slot        Onde o fragmento aparece no /fragmentos (ver menus.yml).
#    Descricao   Linhas da lore que explicam como conseguir.
#    Permissao   Vazio = todo mundo ganha. Preenchida, so quem tem ela ganha.
#    Item        Nome e lore do item fisico (o que sai no "retirar").
#    Origens     Lista de jeitos de ganhar. Cada origem tem:
#
#      Tipo        PLANTACAO  quebrar plantacao (so madura, por padrao)
#                  BLOCO      quebrar bloco (minerio, pedra, madeira...)
#                  MOB        matar um mob
#                  JOGADOR    matar um jogador
#                  PESCA      pescar (Alvos = o que foi pescado, ex.: COD)
#                  ENCANTAR   encantar na mesa (Alvos = item encantado)
#                  FUNDIR     tirar da fornalha (Alvos = o que saiu)
#                  CRAFTAR    fabricar na mesa (Alvos = o que foi feito)
#      Alvos       Lista de blocos/mobs/itens. VAZIA = qualquer um. Os nomes
#                  de bloco sao os modernos (WHEAT, DIAMOND_ORE) e funcionam
#                  em toda versao, da 1.8 a 1.21.
#      Chance      Porcentagem, 0 a 100. Aceita decimal (2.5).
#      Quantidade  Um numero ('1') ou uma faixa ('1-3').
#      Exigir madura   So para PLANTACAO. false da fragmento em qualquer estagio.
#      Permissao   Opcional: so quem tem ela ganha por esta origem.
#
#  Um fragmento pode ter varias origens. Apagar ou renomear um fragmento NAO
#  apaga o saldo de ninguem no banco; ele so deixa de aparecer no menu.
# ==========================================================================

