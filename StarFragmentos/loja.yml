# ==========================================================================
#  StarFragmentos - a loja de fragmentos
#
#  Cada produto custa fragmentos e entrega o que voce quiser: comandos
#  (caixas, dinheiro, VIP...), itens de verdade ou outros fragmentos. E aqui
#  que "comprar caixa com fragmento" e "trocar fragmento por fragmento"
#  acontecem -- sao o mesmo formato.
#
#    Slot          Onde o produto aparece na loja (se o menus.yml nao usar
#                  Slots com paginas).
#    Material / Textura / Dono / Quantidade / Brilho   O icone, como em qualquer
#                  item de menu.
#    Nome, Lore    Textos. Na lore, a linha '{precos}' vira uma linha por
#                  fragmento do preco (formato em menus.yml > Loja > Produto) e
#                  a linha '{estado}' vira "Lore pode comprar" ou "Lore nao
#                  pode comprar". {preco} numa linha comum vira o preco inteiro
#                  numa frase so.
#    Permissao     Vazio = todo mundo. Preenchida, so quem tem compra (e, por
#                  padrao, so quem tem ve -- menus.yml > Loja).
#    Confirmar     true/false por cima do "Loja.Confirmar compra" do config.
#    Preco         fragmento: quantidade. Pode ter mais de um.
#    Recompensa
#      Comandos    Lista. 'console: ...' roda pelo console, 'jogador: ...'
#                  pelo jogador, 'op: ...' pelo jogador com op emprestado.
#                  {jogador} vira o nick. Tambem aceita mensagem:, titulo:,
#                  actionbar:, som: e anuncio:.
#      Fragmentos  fragmento: quantidade que o comprador recebe.
#      Itens       Secoes de item (Material, Nome, Lore, Encantamentos,
#                  Quantidade, Textura). Exige espaco no inventario.
#      Mensagem    Texto extra enviado depois da compra (opcional).
# ==========================================================================

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "Textura"):
#       Dono: 'Notch'
#
# Com "Textura" ou "Dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "Textura".
#
# A cabeca por "Dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "Textura".
# ---------------------------------------------------------------------------

Itens:

  caixa_comum:
    Slot: 10
    Material: CHEST
    Nome: '&e&lCAIXA COMUM'
    Lore:
      - '&7Uma chave da caixa comum.'
      - ''
      - '&fPreco:'
      - '{precos}'
      - ''
      - '{estado}'
    Preco:
      organico: 50
      mineral: 30
    Recompensa:
      Comandos:
        # Exemplo com o StarCaixas; troque pelo comando do seu plugin de caixas.
        - 'console: starcaixas chave dar {jogador} comum 1'

  caixa_rara:
