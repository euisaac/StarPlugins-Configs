    mace:
      # So existe da 1.21 em diante. Em servidor mais antigo a maca nao
      # existe e estas verificacoes nunca rodam.
      #
      # "Cancelar: true" e o que interessa aqui: o golpe da maca com queda
      # inventada mata de uma vez, entao desfazer o dano vale mais do que
      # somar violacao e esperar a punicao chegar.
