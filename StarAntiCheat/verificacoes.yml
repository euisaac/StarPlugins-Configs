# =====================================================================
#  StarAntiCheat - verificacoes
#
#  Cada verificacao tem um ou mais tipos (A, B, C...): sao jeitos
#  diferentes de pegar a mesma trapaca, e cada um liga, pune e se
#  calibra sozinho.
#
#  O que um tipo nao disser vem da secao "Padrao" logo abaixo. Escreva
#  no tipo apenas o que for diferente.
#
#  Chaves de cada tipo:
#    Ativado ............. liga a verificacao
#    Punivel ............. deixa esta verificacao executar punicao
#    Maximo de violacoes . a partir de quantas violacoes ela pune
#    Intervalo de alerta . avisa a cada N violacoes (1 = todas)
#    Nao alertar ate ..... segura os primeiros alertas
#    Ping maximo ......... acima disso, nao conta violacao (0 = sem limite)
#    TPS minima .......... abaixo disso, nao conta violacao
#    Anunciar punicao .... anuncia no chat de todo mundo
#    Cancelar ............ desfaz a acao (so vale onde faz sentido)
#    Comandos de punicao . o que rodar ao chegar no maximo
#    Buffer .............. quantas vezes seguidas antes de contar
#      Maximo ........... quanto precisa acumular (0 = conta na hora)
#      Multiplicador .... quanto cada deteccao soma
#      Decaimento ....... quanto some quando o jogador se comporta
#
#  Nos comandos de punicao valem: {jogador} {uuid} {verificacao} {tipo}
#  {vl} {detalhe} {ping} {tps}. Prefixe com [jogador] para rodar como o
#  proprio jogador em vez do console.
# =====================================================================
Versao do modelo: 1

Padrao:
  Ativado: true
  Punivel: true
  Maximo de violacoes: 20
  Intervalo de alerta: 1
  Nao alertar ate: 3
  Ping maximo: 400
  TPS minima: 16.0
  Anunciar punicao: true
  Cancelar: false
  Comandos de punicao:
    # Por padrao o plugin so expulsa. Troque por um banimento quando
    # tiver acompanhado os alertas do seu servidor por alguns dias --
    # banir automaticamente numa verificacao mal calibrada e o jeito
    # mais rapido de perder jogador honesto.
    - 'kick {jogador} &cVoce foi removido pelo StarAntiCheat (&f{verificacao} {tipo}&c).'
  Buffer:
    Maximo: 3.0
    Multiplicador: 1.0
    Decaimento: 0.5

