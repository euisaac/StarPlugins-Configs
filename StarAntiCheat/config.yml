# =====================================================================
#  StarAntiCheat - configuracao geral
#
#  As verificacoes ficam no verificacoes.yml e as mensagens no
#  mensagens.yml. Aqui ficam os ajustes que valem para o plugin inteiro.
#
#  Este plugin exige o PacketEvents instalado na pasta plugins/.
# =====================================================================

Geral:
  # Escreve no console o que cada verificacao esta calculando.
  # So ligue enquanto estiver calibrando: gera MUITA linha.
  Depuracao: false

  # Quem esta nestes modos nao e verificado.
  Ignorar modo criativo: true
  Ignorar modo espectador: true

  # Operador continua sendo verificado por padrao. Se voce liga isto e
  # da OP para a staff, ninguem da equipe aparece em alerta nenhum.
  Ignorar operadores: false

  # Respeita a permissao staranticheat.bypass.
  Respeitar permissao de bypass: true

# Mundos onde o plugin nao roda (minigames, criativo, lobby...).
Mundos ignorados:
  - mundo_criativo
  - lobby

# ---------------------------------------------------------------------
# Cortesia: quantos tiques depois de cada evento as verificacoes de
# movimento ficam quietas. E aqui que se resolve quase todo falso
# positivo -- nesses momentos o cliente e o servidor discordam de
# verdade, sem ninguem estar trapaceando.
#
# 20 tiques = 1 segundo.
# ---------------------------------------------------------------------
Cortesia:
  Ao entrar: 60
  Ao teleportar: 30
  Ao ressuscitar: 40
  Ao trocar de mundo: 100
  Ao levar dano: 10
  Ao levar empurrao: 20
  Ao sair de veiculo: 40

  # Acima deste ping, todas as cortesias acima valem em dobro.
  Ping para dobrar a cortesia: 250

Alertas:
  # Quem tem a permissao staranticheat.alertas ja entra recebendo.
  Ligados ao entrar: true
  Mostrar no console: true

  # Som tocado para a staff a cada alerta. Formato: NOME;VOLUME;TOM.
  # Deixe vazio para nao tocar nada.
  Som: 'NOTE_PLING;0.7;2.0'

  # Freio de enxurrada: no maximo tantos alertas iguais por segundo, por
  # jogador. 0 desliga o freio.
  Alertas iguais por segundo: 2

# ---------------------------------------------------------------------
# Mitigacao: o que acontece NA HORA, antes de qualquer punicao. Vale nas
# verificacoes com "Cancelar: true" no verificacoes.yml, ja na primeira
# deteccao -- sem esperar o buffer encher.
# ---------------------------------------------------------------------
Mitigacao:
  # Voo, speed, passo alto, atravessar parede: o jogador volta para o ultimo
  # lugar onde estava pisando em algo.
  Recuar ao detectar movimento: true
  Intervalo entre recuos em ms: 150

  # O golpe apontado como suspeito (alcance, aura, hitbox, autoclick) nao
  # causa dano no jogador nem na entidade que levou o golpe.
  Cancelar o golpe suspeito: true

  # Depois de uma suspeita de combate, os golpes seguintes tambem nao contam
  # por este tempo. Enquanto o macro/aura continuar no padrao, a suspeita se
  # repete e o bloqueio se renova.
  Bloquear golpes apos suspeita em ms: 1500

  # Quando a violacao de combate chega a ser contada, o jogador fica sem
  # conseguir bater em ninguem por este tempo. 0 desliga.
  Bloquear combate por segundos: 6

  # A mitigacao age antes de existir violacao. Para a staff nao ficar no
  # escuro, um aviso sai a cada N recuos (ou golpes cancelados) do mesmo
  # jogador em 10 segundos. Nao soma violacao. 0 desliga.
  Avisar a staff a cada: 3

Cliente:
  # Escreve no console a marca e os canais de mod de quem entra.
  Registrar no console: true
  # Avisa a staff (com os alertas ligados) a marca de quem entra.
  Avisar a staff ao entrar: true

# ---------------------------------------------------------------------
# Protecoes: em vez de detectar o hack, nao entregar a informacao a ele.
# ---------------------------------------------------------------------
Protecoes:
  Anti ESP de jogadores:
    # Jogador totalmente atras de bloco opaco nao tem a posicao real enviada
    # a quem nao o ve. ESP, tracer e nome atraves da parede apontam para o
    # nada. Quem tem staranticheat.verparedes (e o espectador) ve todos.
    Ativado: true
    # De quantos em quantos tiques recalcular. Menor = reaparece mais rapido
    # na quina, mas custa mais. 3 tiques = 0,15 s.
    A cada tiques: 3
    # Perto disso, sempre visivel (nao vale esconder quem esta colado).
    Sempre visivel ate: 4.0
    # Alem disso, nem calcula (o servidor ja nao envia).
    Distancia maxima: 96.0
    # Folga em volta do alvo: ele reaparece um pouco antes de surgir na quina.
    Margem em blocos: 1.0

  Anti ESP de baus:
    # Baus fora da linha de visao saem do chunk como ar (e sem a entrada que o
    # StorageESP le). Aparecem assim que alguma face fica a vista.
    Ativado: true
    A cada tiques: 5
    Distancia maxima: 64.0
    # Pedaco do nome do bloco, sem diferenciar maiuscula.
    Blocos:
      - chest
      - barrel
      - shulker_box

  Anti xray:
    # Minerio cercado por blocos opacos dos seis lados sai como pedra. Ao
    # quebrar ou explodir um bloco, os minerios em volta sao reenviados com o
    # tipo real. Tambem deixa o #mine do Baritone cego.
    #
    # No Paper/Leaf existe um anti-xray proprio (paper-world-defaults.yml,
    # anticheat.anti-xray). Use um OU outro, nunca os dois.
    Ativado: true
    # So esconde abaixo desta altura. 64 cobre diamante, ouro, lapis e
    # redstone com pouco custo. Para esconder tambem esmeralda e o carvao/ferro
    # das montanhas, suba para 320 -- custa mais CPU na hora de enviar chunk.
    Altura maxima: 64
    # O minerio na beira do chunk tambem e escondido. A varredura abaixo
    # devolve o que estiver exposto numa caverna quando alguem chega perto.
    Esconder na beira do chunk: true
    # Raio (em blocos) da varredura que revela minerio exposto perto do
    # jogador. 0 desliga.
    Revelar expostos num raio de: 4
    Minerios:
      - _ore
      - ancient_debris

Provas:
  # Um arquivo por dia em registros/ com cada deteccao, punicao e mitigacao.
  Registro do dia: true
  # Ao punir, salva os ultimos 30 s do jogador (posicao, mira, golpes,
  # suspeitas e recuos) em gravacoes/. E a prova para revisar um banimento.
  Salvar caixa-preta ao punir: true

Congelar:
  # Comandos que o jogador congelado ainda pode usar (sem a barra).
  Comandos liberados:
    - msg
    - tell
    - r
  # Rodados pelo console quando alguem sai do servidor congelado.
  # Ex.: 'ban {jogador} Saiu durante a verificacao'
  Comandos ao sair congelado: []

# ---------------------------------------------------------------------
# Escada de punicao: punicao que sobe conforme o jogador insiste.
#
# Ligada, ela substitui os "Comandos de punicao" de cada verificacao. Cada
# punicao sobe um degrau (1 expulsar, 2 prender, 3 banir, por padrao), e o
# degrau fica guardado em escada.yml entre sessoes e reinicios.
#
# A prioridade de cada tipo (certeza / alta / media / baixa) decide a
# entrada: certeza vai direto para o ultimo degrau. Cada tipo ja vem com uma
# prioridade de fabrica; para trocar, ponha "Prioridade: alta" (por exemplo)
# no tipo dentro do verificacoes.yml.
# ---------------------------------------------------------------------
Escada de punicao:
  Ativado: false
  # Sem nenhuma punicao por este tempo, o jogador volta ao comeco da escada.
  Esquecer apos dias: 30

  Prioridades:
    # Sinal que nao acontece em jogo limpo (pacote impossivel, cliente de hack
    # se anunciando, queda inventada na maca): ultimo degrau, na primeira
    # violacao contada.
    certeza:
      Pular para o degrau: 3
      Violacoes para punir: 1
    # Sobem um degrau por punicao, quando o tipo chega no "Maximo de violacoes".
    alta:
      Pular para o degrau: 1
    media:
      Pular para o degrau: 1
    # Estatistica (mira, clique, mineracao): so avisa a staff.
    baixa:
      Punir: false

  # Tipos: kick (so os comandos), prisao (prende pelos minutos, alem dos
  # comandos) e comando. Placeholders: {jogador} {uuid} {verificacao} {tipo}
  # {vl} {detalhe} {degrau} {total} {minutos}
  Degraus:
    '1':
      Tipo: kick
      Comandos:
        - 'kick {jogador} &c[Aviso {degrau}/{total}] Trapaca detectada ({verificacao}). Na proxima, prisao.'
    '2':
      Tipo: prisao
      Minutos: 10
      # Quem prefere o /jail de outro plugin: troque o Tipo para "comando" e
      # ponha aqui o comando dele, ex.: 'jail {jogador} cadeia 10m'.
      Comandos: []
    '3':
      Tipo: comando
      Comandos:
        - 'ban {jogador} &cBanido permanentemente por uso de trapaca ({verificacao}).'

  Prisao:
    # Definido no jogo com /anticheat prisao definir. Vazio: o jogador e preso
    # onde estiver.
    Local: ''
    # Quanto o preso pode andar em volta da cela.
    Raio: 4.0
    # Preso continua sendo julgado: com estas violacoes contadas dentro da
    # prisao, sobe para o degrau seguinte (o ban, por padrao).
    Violacoes para subir: 3
    Comandos liberados:
      - msg
      - tell
      - r
    # Cumprida a pena: spawn | onde-estava
    Ao sair: spawn

Punicoes:
  # Os comandos de punicao rodam pelo console (recomendado).
  Executar pelo console: true

  # Espera em tiques antes de executar. Um tique e o suficiente para a
  # punicao nunca acontecer dentro do processamento do pacote.
  Atraso em tiques: 1

  Zerar violacoes ao punir: true

  # Cada verificacao pune uma vez por sessao. Sem isto, um jogador que
  # continue trapaceando depois de escapar do banimento levaria o mesmo
  # comando dezenas de vezes seguidas.
  Punir so uma vez por sessao: true

Violacoes:
  # De quanto em quanto tempo as violacoes diminuem, e quanto some de
  # cada verificacao. Com 30 e 1.0, quem parou de trapacear volta ao zero
  # sozinho; 0 no intervalo desliga o esquecimento.
  Diminuir a cada segundos: 30
  Diminuir quantidade: 1.0

  Zerar ao sair: false
  Zerar ao morrer: false

# ---------------------------------------------------------------------
# Banco de dados: guarda deteccoes e punicoes para o menu de staff e o
# comando /anticheat historico.
#
# Tipo: SQLITE (arquivo proprio, nao precisa configurar nada) ou MYSQL.
# ---------------------------------------------------------------------
Banco de dados:
  Ativado: true
  Tipo: SQLITE
  Host: localhost
  Porta: 3306
  Banco: minecraft
  Usuario: root
  Senha: ''
  Prefixo: 'staranticheat_'

  # Deteccao mais antiga que isto e apagada quando o plugin sobe.
  # 0 guarda para sempre (a tabela cresce rapido).
  Dias de historico: 30

Discord:
  Ativado: false
  Webhook: ''

  # So avisa a partir desta violacao.
  Violacao minima: 10

  # Ligado, manda so as punicoes -- o canal nao vira mural de alerta.
  Somente punicoes: false

  Nome: 'StarAntiCheat'
  Avatar: ''

  # Cor da barra lateral do aviso, em decimal (15158332 = vermelho).
  Cor: 15158332

Menu:
  # Materiais usados no menu de staff. Nome que nao existir na versao do
  # servidor vira pedra, sem quebrar o menu.
  Material do jogador: PLAYER_HEAD
  Material ligado: LIME_DYE
  Material desligado: GRAY_DYE

  # De quantos em quantos tiques o menu aberto se redesenha.
  Atualizar a cada tiques: 20
