# StarLobby - config.yml

# Modo de depuração para correção de problemas no plugin.
debug-mode: false

# Idioma das mensagens do plugin. Arquivos disponíveis em lang/: BR, EN.
idioma: BR

# Banco de dados usado pelo sistema de preferências (item 19). Outros
# sistemas (posições de batalha, status de servidor/lobby) continuam em
# YAML de propósito — são configuração administrativa, não dado por
# jogador.
database:
  # SQLITE (padrao, sem configuracao extra) ou MYSQL.
  storage-type: SQLITE
  data:
    host: localhost
    port: 3306
    database: ''
    username: ''
    password: ''
    # prefixo aplicado as tabelas quando storage-type = MYSQL, util para dividir o banco com
    # outros plugins.
    prefix: 'starlb_'

# Chave deste servidor em servers.yml ou lobbies.yml (ex: 'lobby1'). Usada só
# para o auto-check de login: se o status desta entrada estiver em
# manutenção/dev/beta-vip, jogadores sem permissão de bypass são kickados ao
# entrar NESTE servidor. Deixe em branco para desativar esse auto-check.
server-name: ''

# Aliases dos comandos do plugin, separados por "|". O primeiro nome é o
# principal e os demais são apelidos. Novas entradas vão surgindo aqui
# conforme cada sistema do StarLobby for implementado nas próximas fases.
commands:
  starlobby: 'starlobby|sl|slobby'
  maintenance: 'manutencao|maintenance'
  beta-vip: 'beta-vip|betavip'
  deployment: 'desenvolvimento|dev|deployment'
  preferences: 'preferencias|preferences'
  tell: 'msg|tell|t'
  reply: 'responder|r|reply'
  battle: 'batalha|battle|batalhar'
  autoreconectar: 'autoreconectar|ar'
  fila: 'fila|queue|jogar'
  spawn: 'spawn'
  setspawn: 'setspawn'
  delspawn: 'delspawn|deletarspawn'
  gamemode: 'gm|gamemode|modojogo'
  clearchat: 'limparchat|clearchat|cc'
  clear: 'limpar|clear'
  tp: 'tp|teleportar|teleport'
  tphere: 'puxar|tphere'
  vanish: 'vanish|v'
  lockchat: 'trancarchat|lockchat|lc'
  fly: 'voar|fly'
  scoreboard: 'scoreboard|sb'
  tablist: 'tablist|tab'
  hotbaritems: 'hotbaritems|hbitems|hbi'
  servers: 'servidores|servers'
  lobbies: 'lobbies'
  sudo: 'sudo'

# Sistema de modos do servidor (item 14). O modo "reiniciando" não tem
# comando manual: é ativado programaticamente pelo sistema de fila de
# reinício (Fase G), então não persiste em estado.yml.
modes:
  bypass-permission-manutencao: 'starlobby.bypass.manutencao'
  bypass-permission-deployment: 'starlobby.bypass.deployment'
  bypass-permission-betavip: 'starlobby.bypass.betavip'

# Sistema de proteção do lobby (item 24): bloqueia construir/interagir sem
# permissão, e desativa fome/dano/drop/pickup, como é padrão em lobbies.
protection:
  enabled: true
  build-permission: 'starlobby.build'
  interact-permission: 'starlobby.interact'
  deny-hunger: true
  deny-damage: true
  deny-drop-item: true
  deny-pickup-item: true
  # Impede que mobs nasçam no lobby (slime, zumbi, animais...). Barra apenas
  # spawns naturais/spawner/geracao de chunk; NPCs e hologramas do proprio
  # plugin, /summon e ovo de spawn continuam funcionando.
  deny-mob-spawn: true

# Sistema de bloqueio de comandos (item 23).
command-manager:
  bypass-permission: 'starlobby.comando.bypass'
  blocked-commands:
    - '/plugins'
    - '/pl'

# Sistema de anti-tab (item 22): esconde comandos do tab-complete, exceto os
# da whitelist. Usa PlayerCommandSendEvent (API oficial a partir da 1.13);
# em versões anteriores este recurso ainda não fica disponível.
antitab:
  enabled: true
  bypass-permission: 'starlobby.antitab.bypass'
  whitelist:
    - 'help'

# Toggles de mundo do lobby.
world:
  block-fire-spread: true
  block-leaf-decay: true
  block-sand-fall: true
  block-item-spawn: true
  block-weather: true
  # Impede que mobs hostis (zumbi, esqueleto, creeper...) nasçam sozinhos.
  # Só o spawn natural é barrado: ovo, comando e plugin continuam
  # funcionando, para dar pra colocar um mob de decoração de propósito.
  block-natural-mobs: true
  # O mesmo, para os passivos: animais, peixes/lulas e morcegos.
  block-natural-animals: true

# NPCs dos servidores (teleporter-entity do tipo NPC em servers.yml/lobbies.yml).
npcs:
  # false: o NPC fica olhando para a direção em que foi posicionado com o
  #        /starlobby setnpc.
  # true:  o NPC vira o rosto para o jogador mais próximo e volta à posição
  #        original quando ninguém está por perto.
  olhar-para-jogadores: false
  # Distância, em blocos, para o NPC notar um jogador.
  distancia-olhar: 8
  # true: quem tenta atravessar o NPC é empurrado de volta, com o som do
  #       villager recusando. Vale só para os teleporters do tipo NPC.
  empurrar-ao-encostar: true
  # Força do empurrão (0.6 é um tranco curto; 1.0 joga um bloco pra trás).
  forca-empurrao: 0.6
  som-empurrao: 'VILLAGER_NO'
  # true: enquanto o servidor NÃO está online, o brilho do NPC troca da cor
  #       configurada para a cor do status — Reiniciando/Offline/Manutenção
  #       em vermelho, Beta-VIP em amarelo, Desenvolvimento em cinza. A cor
  #       vem do código de cor do texto em "status:" mais abaixo (o "&c" de
  #       "&cReiniciando"), então trocar lá troca o brilho junto. Online volta
  #       pra cor configurada no "brilho" do servidor.
  #       Só vale para NPC que já tem "brilho" ativado em servers.yml.
  brilho-pela-cor-do-status: false

# Partículas de ambiente e brilho dos teleporter-entity (NPC, cabeça giratória
# ou item gigante) são configurados POR SERVIDOR, dentro do bloco
# "teleporter-entity" de cada servidor em servers.yml/lobbies.yml (ou pelo
# "/starlobby editor"). Não há configuração global aqui: um teleporter só ganha
# partícula/brilho se o bloco correspondente estiver no próprio servidor. Só do
# 1.9 em diante (no 1.8 é ignorado, sem erro).

# Sistema de day-cycle: mantém o horário fixo no lobby.
day-cycle:
  enabled: true
  time: 6000

# Sistema de scoreboard do lobby (item 6), com suporte a PlaceholderAPI.
scoreboard:
  enabled: true
  # De quantos em quantos SEGUNDOS a scoreboard se redesenha.
  delay: 3
  # Só para animações (%animacao:nome% de animacoes.yml): redesenha de
  # "delay-ticks" em ticks (20 ticks = 1 segundo), ignorando o "delay" acima.
  # Sem isso, uma animação rápida fica travada, porque só aparece a cada
  # 3 segundos. Deixe 0 para usar o "delay" normal.
  delay-ticks: 0
  title: '&b&lStarLobby'
  # A linha "{servers}" é substituída por uma linha PRA CADA servidor de
  # servers.yml (formatada com "server-line-format" abaixo) — respeitando o
  # mesmo filtro de "proxy:" usado pela bússola/fila: um servidor com
  # "proxy:" definido só aparece pra quem entrou por aquele proxy
  # específico. Servidor sem "proxy:" aparece pra todo mundo.
  #
  # "%animacao:nome%" mostra o quadro atual de uma animação de animacoes.yml
  # (funciona no título e em qualquer linha). Lembre do "delay-ticks" acima
  # para a animação não ficar travada.
  #
  # Em vez do "{servers}" (que gera uma linha por servidor, na ordem do
  # servers.yml e sempre no mesmo formato), dá para montar a linha na mão,
  # servidor por servidor, trocando "survival" pela chave do seu servers.yml
  # ou lobbies.yml:
  #
  #   - '{survival_status_color}{survival_displayname} &7[{survival_players_raw}/{survival_max_players}]'
  #
  # Campos disponíveis por servidor:
  #   {chave_displayname}         nome de exibição (sem cor)
  #   {chave_displayname_color}   o mesmo, mas com as cores do servers.yml
  #   {chave_status}              Online / Reiniciando / Manutenção...
  #   {chave_status_color}        só o código de cor do status (&a, &c...)
  #   {chave_players_raw}         quantos estão online agora
  #   {chave_max_players}         limite de jogadores
  #   {chave_players_formatted}   "12/100"
  lines:
    - ''
    - '&a⋄ &fCargo: %vault_prefix%'
    - ''
    - '{servers}'
    - ''
    - '&a⋄ &fLobby: &a{online_lobby1}'
    - ''
    - '&eStarPlugins.com.br'
  # Formato de cada linha gerada pela "{servers}" acima. {status_color} vira
  # só o código de cor do status (ex: &a se online, &c se offline/
  # reiniciando/manutenção) — pra colorir o nome do servidor inteiro, em vez
  # de mostrar a palavra "Online"/"Offline" por extenso. {display} é o
  # display-name do servidor. Também aceita {status}, {players}, {players_raw},
  # {max_players} e {players_formatted}, os mesmos placeholders já usados no
  # ícone do menu de seleção e no holograma dos NPCs.
  #
  # {display} sai sem cor de propósito: o "&l" de um display-name colide com
  # o {status_color} injetado antes dele e o Minecraft desenha um bloco
  # branco no meio da linha. Se você quer as cores do servers.yml mandando na
  # linha, troque por {display_color} — aí tire o {status_color} da frente,
  # ou deixe só para colorir o que vem antes do nome.
  #
  # Em qualquer linha (não só nas geradas por "{servers}"), "{online_<chave>}"
  # mostra o total de jogadores online de UM servidor/lobby específico de
  # servers.yml/lobbies.yml (pelo ping real, não só quem está nesta instância
  # Bukkit) — "{online}" sozinho conta só quem está aqui; em multi-lobby, use
  # "{online_<chave>}" pra mostrar o total do lobby inteiro pela rede.
  server-line-format: '{status_color}{display} &7[{players_raw}/{max_players}]'
  # Usado no lugar do formato acima quando o servidor NÃO está online
  # (reiniciando, manutenção, dev ou beta-VIP): mostra o motivo em vez de um
  # "[0/100]" que não diz nada. Aceita os mesmos placeholders.
  server-line-format-offline: '{status_color}{display} &7[{status}&7]'

# Sistema de tablist do lobby (item 7), com suporte a PlaceholderAPI. As tags
# coloram o nome do jogador na tablist; "priority" decide quem vence quando o
# jogador se qualifica para mais de uma (maior priority vence), e "order" é
# só uma letra usada para ordenar visualmente (a = primeiro, z = último).
tablist:
  enabled: true
  # De quantos em quantos SEGUNDOS o header/footer são reenviados.
  delay: 3
  # Mesma ideia do "scoreboard.delay-ticks": use um valor > 0 (em ticks)
  # quando o header/footer tiver animação (%animacao:nome%).
  delay-ticks: 0
  header: |
    &r
    &b&lStarLobby
    &r
  footer: |
    &r
    &7StarPlugins.com.br
    &r
  # Troque a seção inteira por "tags: false" para desligar o sistema de tags
  # (nenhum prefixo/sufixo é aplicado na tablist), sem precisar apagar as
  # tags cadastradas abaixo.
  tags:
    member:
      priority: 1
      permission: 'starlobby.tags.member'
      prefix: '&7[Membro] &7'
      suffix: ''
      order: 'b'
    staff:
      priority: 2
      permission: 'starlobby.tags.staff'
      prefix: '&c[Staff] &7'
      suffix: ''
      order: 'a'

# Sistema de itens de entrada (item 13): itens dados ao jogador ao entrar no
# lobby, com comandos configuráveis executados ao clicar (esquerdo/direito).
# {player} no comando é substituído pelo nome do jogador. left-command e
# right-command aceitam QUALQUER comando do servidor, ou uma das funções
# internas do próprio StarLobby (chamadas direto no código, sem passar por
# comando de verdade): "seletorservidores" (abre o menu de servidores),
# "seletorlobbies" (abre o menu de lobbies) e "lobbymenoscheio" (conecta ao
# lobby com menos jogadores). Dá pra usar os dois cliques do mesmo item,
# misturar comandos e funções à vontade, ou deixar vazio pra não fazer nada
# naquele clique.
#
# slot: -1 desliga o item — ele continua cadastrado aqui (com nome, lore e
# comandos), mas não é entregue a ninguém. Útil para tirar um item do
# lobby sem apagar a configuração dele.
#
# Mudou o "slot" de algum item? Um /starlobby reload já reposiciona no
# inventário de quem está online, sem deixar o item antigo para trás.
join-items:
  game-selector:
    material: 'COMPASS'
    slot: 4
    name: '&aServidores'
    lore:
      - '&7Selecione um servidor para jogar.'
    left-command: ''
    right-command: 'seletorservidores'
  lobby-selector:
    material: 'NETHER_STAR'
    slot: 8
    name: '&aLobbies'
    lore:
      - '&7Selecione um lobby mais vazio.'
    left-command: 'lobbymenoscheio'
    right-command: 'seletorlobbies'
  autoreconectar:
    material: 'ENDER_PEARL'
    slot: 2
    name: '&aAuto-Reconectar'
    lore:
      - '&7Escolha um servidor para ser'
      - '&7reconectado automaticamente ao voltar.'
    left-command: ''
    right-command: 'autoreconectar'
    # Permissao para RECEBER o item e usar a funcao. Sem ela, o item nem
    # aparece na hotbar. Deixe '' para liberar para todos. Qualquer join-item
    # aceita este campo.
    permission: 'starlobby.autoreconectar'
  preferences:
    material: 'REDSTONE_COMPARATOR'
    slot: 7
    name: '&aPreferências'
    lore:
      - '&7Altere suas preferências pessoais.'
    left-command: ''
    right-command: 'preferencias'
  battle:
    material: 'DIAMOND_SWORD'
    slot: 0
    name: '&cBatalha'
    lore:
      - '&7Desafie jogadores ou entre na arena livre.'
    left-command: ''
    right-command: 'batalha'
  # A espada do PvP de hub (HubPvPSword). É um join-item como os outros —
  # quem aponta para ele é "combat.item.join-item". Segurá-lo na mão é o
  # ÚNICO jeito de ativar o PvP; sem comando nos cliques, porque a ação
  # dele é justamente ficar na mão.
  # A pérola voadora (PerolaVoadoraManager): "perolavoadora" não é um
  # comando, é uma função interna — ela lança a pérola e leva o jogador
  # MONTADO nela até onde a pérola cair, em vez do teleporte normal. Ajustes
  # de cooldown/velocidade ficam na seção "perola-voadora" mais abaixo.
  perola:
    material: 'ENDER_PEARL'
    slot: 6
    name: '&5Pérola do Fim'
    lore:
      - '&7Use para voar!'
    left-command: ''
    right-command: 'perolavoadora'
  combate:
    material: 'IRON_SWORD'
    slot: 1
    name: '&cCombate'
    lore:
      - '&7Segure para ativar o PvP.'
    enchants:
      - 'DAMAGE_ALL:2'
    left-command: ''
    right-command: ''

# Pérola voadora: o join-item "perola" acima leva o jogador montado na
# pérola até o ponto de queda.
perola-voadora:
  enabled: true
  # Segundos de espera para DECOLAR de novo. Não vale para o
  # redirecionamento: quem já está montado pode arremessar de novo a
  # qualquer momento e a pérola só muda de direção, sem descer.
  cooldown: 3
  # Multiplicador da força do arremesso (1.0 = pérola normal do Minecraft).
  # Aumente para voos mais longos.
  velocidade: 1.0
  # Trava de segurança: uma pérola atirada pro céu pode nunca acertar nada
  # e deixaria o jogador montado para sempre. Passado esse tempo (segundos)
  # o voo é encerrado de qualquer jeito.
  tempo-maximo-de-voo: 10
  som: 'ENDERMAN_TELEPORT'

# Sistema de preferências (item 19): toggles pessoais do jogador.
preferences:
  visibility-default: true
  chat-default: true
  tell-default: true
  # Voo nunca é persistido nem tem "default": sempre começa desligado a cada
  # login, mesmo para quem tem a permissão abaixo.
  fly-permission: 'starlobby.fly'
  # Avisado a quem estava voando e perdeu a permissão (troca de cargo, VIP
  # que expirou...). O voo é desligado na hora, sem esperar o jogador
  # relogar. Deixe em branco ("") para desligar em silêncio.
  fly-removido: '&cSeu modo voo foi desativado: você não tem mais permissão.'

# Sistema de chat integrado (item 20). As mensagens de tell/reply ficam nos
# arquivos de lang (chat.tell-send/tell-receive/etc.), não aqui.
chat:
  enabled: true
  format: '&7[Chat] &f%vault_prefix% {player}&7: {msg}'
  delay: 1

# Textos de status usados no seletor de servidores/lobbies (item 11/12).
# O status real de jogadores online por servidor (via ping) chega na Fase G,
# junto da integração com o starlobby-proxy; por enquanto o status reflete
# só as flags de manutenção/dev/beta-vip.
status:
  offline: '&cOffline'
  maintenance: '&cManutenção'
  deployment: '&7Desenvolvimento'
  beta-vip: '&eBeta-VIP'
  restarting: '&cReiniciando'
  online: '&aOnline'

  # Um servidor fora do ar so aparece como "Reiniciando" enquanto ele esta
  # mesmo voltando: a queda tem de ter acontecido com o lobby ligado, e dentro
  # do tempo que aquele servidor costuma levar para subir (o mesmo tempo do
  # {abre_em}). Fora disso ele aparece como "Offline" -- inclusive quando o
  # lobby liga com ele ja fora, porque ai nao houve reinicio nenhum para
  # anunciar.
  #
  # Quantos segundos esperar quando ainda nao ha uma media (primeira queda
  # deste servidor desde que o lobby foi instalado):
  reiniciando-por: 120
  # Folga somada a media, para ele nao virar "Offline" no segundo seguinte ao
  # tempo medio:
  reiniciando-folga: 60

# Sistema de jump pads (item 2).
jump-pad:
  enabled: true
  block: 'SLIME_BLOCK'
  # Quantos BLOCOS pra frente o jump-pad arremessa, em media. A media e
  # medida ate o jogador voltar na altura em que saiu: cair num degrau mais
  # alto encurta o voo, num mais baixo estica.
  distancia: 8
  # Impulso pra cima, em velocidade por tick (nao e em blocos). Referencia:
  # 0.42 e o pulo normal do jogador, 0.9 sobe ~4 blocos, 1.2 sobe ~7.
  # Mexer aqui NAO muda a distancia -- ela e recalculada pro alcance
  # continuar sendo o da "distancia" acima, so que num arco mais alto.
  offset: 0.9
  # "multiply" era o jeito antigo de dar a forca horizontal: velocidade
  # crua, sem relacao com blocos, o que deixava o pad jogando mais pra cima
  # do que pra frente. Ainda funciona em configs antigos que o tenham, mas
  # so enquanto "distancia" nao estiver definida -- e ela manda.
  sound: 'FIREWORK_LAUNCH'
  # Rastro de particulas brancas do End (END_ROD) atras de quem e arremessado.
  # So aparece do 1.9 em diante (no 1.8 e ignorado, sem erro).
  particulas: true

# Sistema de double jump (extra do item 2): dá um segundo pulo no ar.
# Requer allowFlight=true no jogador (padrão em lobbies).
double-jump:
  enabled: true
  multiply: 1.5
  offset: 2.0
  sound: 'FIREWORK_LAUNCH'
  permission: 'starlobby.doublejump'

# Sistema de combate HubPvP (item de combate no inventário, inspirado no
# HubPvPSword) + batalha/arena x1/arena ffa (itens 8, 9 e 10). Clicar no item
# "combat.item" entra em combate livre no lobby; /batalha desafia outro
# jogador para um x1 ou entra na arena livre — todos passam pelo mesmo
# HubPvpManager (entrar/sair de combate), evitando duplicar a lógica de
# guardar/restaurar inventário.
combat:
  reset: true
  # Intervalo (segundos) entre cada lembrete na actionbar de como sair da
  # arena FFA ("/batalha sair"), mostrado só pra quem está lá dentro.
  ffa-actionbar-delay: 5
  # PvP de hub estilo HubPvPSword: segurar a espada de aviso por
  # "activation-delay" segundos ativa o PvP; ficar com a mão fora dos itens
  # de combate por "deactivation-delay" segundos desativa. É só uma
  # permissão de dano entre dois jogadores com o PvP ativo — diferente da
  # arena (x1/ffa), que troca o equipamento e o mundo do jogador.
  #
  # Enquanto o PvP fica ativo, a hotbar do lobby some inteira e entram no
  # lugar a armadura de "armor", o kit de "items" e o arco/flecha. Ao
  # desativar, a hotbar do lobby volta como estava.
  #
  # A ESPADA DE AVISO é um join-item normal (ver "join-items" mais acima):
  # é lá que ficam material, slot, nome, lore e encantamentos. Aqui só se
  # diz QUAL join-item é ela. Assim ela ganha tudo que os join-items já têm
  # — slot -1 para desligar, reposicionamento no /starlobby reload e
  # limpeza ao sair do servidor. Segurar ela é a ÚNICA forma de ativar o
  # PvP: nenhum item do kit liga o modo sozinho.
  item:
    # A chave do item dentro de "join-items". Deixe vazio ('') para
    # desligar o PvP de hub por completo.
    join-item: 'combate'
    activation-delay: 5
    deactivation-delay: 5
  # Arco dado ao jogador só enquanto o PvP estiver ativo (some junto com o
  # resto da hotbar quando desativa). Para tirar o arco do combate, apague
  # a seção "bow" inteira — e a "arrow" junto.
  bow:
    material: 'BOW'
    slot: 1
    name: '&cArco'
    lore:
      - '&7Munição infinita durante o combate.'
    enchants:
      - 'ARROW_INFINITE:1'
  arrow:
    material: 'ARROW'
    slot: 8
    amount: 1
  armor:
    helmet: 'DIAMOND_HELMET'
    chestplate: 'DIAMOND_CHESTPLATE'
    leggings: 'DIAMOND_LEGGINGS'
    boots: 'DIAMOND_BOOTS'
  # O kit usado ENQUANTO o PvP está ativo (é o mesmo da arena x1/ffa).
  # Segurar qualquer um destes itens MANTÉM o modo de combate ligado — sem
  # isso, comer a maçã dourada no meio da luta começava a desligar o PvP.
  # Use slot -1 para desativar um item do kit.
  items:
    espada:
      material: 'DIAMOND_SWORD'
      amount: 1
      slot: 0
    maca:
      material: 'GOLDEN_APPLE'
      amount: 16
      slot: 2

# Ponte com o starlobby-proxy (Velocity) — absorve o que era o
# StarProxySpigot (spigot-bridge, agora descontinuado): recebe "mundo"
# (teleporte ao entrar) e "abrir_menu" (GUI de auto-reconectar, itens
# 16/18), manda "selecionou" de volta quando o jogador escolhe um servidor
# no menu.
proxy-bridge:
  canal: 'starlobby:main'
  teleportar-ao-morrer: true
  # Puxar de volta pro spawn do mundo (mesmo destino do "spawn por proxy"
  # acima) quem cair no void, em vez de deixar morrer de queda no vazio.
  teleportar-ao-cair-no-void: true

# Sistema de fila para se conectar a um servidor (itens 15/17), inteiramente
# local ao StarLobby: usado pela bússola, pelo clique no NPC/holograma/item
# gigante e pelo comando /fila. Continua funcionando normalmente depois de
# um restart/atualização do plugin (a fila é só em memória).
fila:
  # Ativar ou desativar o sistema de fila.
  enabled: true
  # Tempo em segundos para que a fila ande (intervalo entre cada tentativa de
  # conectar o próximo jogador ao servidor de destino).
  delay: 1
  # Sempre mostrar a posição na fila na actionbar
  always-show: true
  # Permissão de fila-vip (item 17): jogadores com esta permissão furam a
  # fila, mesmo tendo entrado depois de quem não é VIP.
  vip-permission: 'starlobby.filavip'
  # Quantas tentativas seguidas o primeiro da fila pode ter antes de ser
  # removido automaticamente. Sem isso, um jogador que nunca consegue
  # conectar de verdade (recusado no destino por algum motivo) travaria a
  # fila inteira pra sempre, já que só o primeiro é tentado a cada ciclo.
  # Use -1 para desativar (nunca remover automaticamente por falhas).
  max-tentativas: 10
  # Sons da fila. Deixe em '' (vazio) para nao tocar nada. Aceita nomes de som
  # antigos e novos (o plugin converte para a versao do servidor).
  som:
    # Ao ENTRAR na fila de um servidor.
    entrar: 'BLOCK_NOTE_BLOCK_PLING'
    # Toda vez que o jogador SOBE de posicao na fila (anda pra frente).
    avancar: 'BLOCK_NOTE_BLOCK_HAT'

# Sistema de entrar no lobby
join:
  # Manda quem entra para o spawn do lobby (o do /setspawn; enquanto não
  # houver um, o spawn do mundo). Sem isso o jogador nasce onde deslogou da
  # última vez, que num lobby é sempre um lugar errado.
  teleportar-ao-entrar: true
  # Limpar o chat ao entrar no lobby
  clear-chat: false
  # Enviar anúncio que o player entrou (deixe vazio para não usar)
  announce: '&b+ %luckperms_prefix% &b{player} &fentrou.'
  # Anunciar só a entrada de quem tem esta permissão (ex.: 'starlobby.vip'),
  # em vez de todo mundo que entra. Deixe vazio para anunciar todo mundo.
  announce-permission: ''
  # Quantos ticks esperar antes de mandar o anúncio (20 ticks = 1 segundo).
  # Placeholder de outro plugin (tag, cargo, nick...) costuma depender de um
  # carregamento que só termina DEPOIS de o jogador entrar -- anunciando na
  # hora exata da entrada, ele sai em branco. Aumente se o seu plugin de tag
  # demorar mais; 0 anuncia na hora, sem espera.
  announce-delay-ticks: 20
  # Esconder as mensagens padrão do Minecraft de entrada/saída
  # ("Fulano entrou no jogo"/"Fulano saiu do jogo"). Independente do
  # "announce": pode desativar as duas sem colocar um anúncio no lugar.
  hide-join-quit-messages: true
  # Mundos que não irá receber os Join-Items
  join-item-world-blacklist: []

  # Efeitos de entrada por grupo/permissao (VIPs entram com foguete/particula/
  # som proprios). Os grupos sao avaliados DE CIMA PRA BAIXO e vale o PRIMEIRO
  # que o jogador tiver permissao -- entao coloque o VIP mais alto no topo.
  # Um grupo com "permissao: ''" (vazio) vale para todo mundo (bom pro ultimo).
  efeitos:
    ativado: true
    grupos:
      - permissao: 'starlobby.efeito.vip'
        # Solta um foguete no jogador ao entrar.
        foguete: true
        # Nome de uma particula (FLAME, HEART, VILLAGER_HAPPY, SPELL_WITCH...).
        # Deixe '' para nenhuma.
        particula: 'FLAME'
        # Som ao entrar. '' para nenhum.
        som: 'ENTITY_PLAYER_LEVELUP'
      # Exemplo de um grupo para todos (sem permissao) - desligado por padrao:
      # - permissao: ''
      #   foguete: false
      #   particula: 'VILLAGER_HAPPY'
      #   som: ''

# Sistema de mensagens automáticas (item 21).
auto-message:
  enabled: true
  delay: 320
  # O "chat" pode ser uma linha unica OU uma LISTA de linhas. Numa lista, cada
  # item vira uma linha e '' (vazio) vira uma linha em branco. Cores com & e
  # tambem hexadecimal &#RRGGBB (servidores 1.16+).
  messages:
    msg1:
      chat: '&b&lStarPlugins&f Compre plugins exclusivos em &bhttps://starplugins.com.br/'
      actionbar: '&b&lStarPlugins'
    msg2:
      chat:
        - ''
        - '&#49F8FF&lBem-vindo ao servidor!'
        - '&7Aproveite sua estadia.'
        - ''
