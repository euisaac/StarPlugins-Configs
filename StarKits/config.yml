#
# Sistema de kits do StarPlugins.

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       ID: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

# Banco de dados
Banco:
  # Tipos: SQLITE, MYSQL
  # SQLITE guarda tudo em plugins/StarKits/dados.db e nao precisa de configuracao.
  Tipo: SQLITE
  # Aceita tanto "meu.host.com" quanto "meu.host.com:3306".
  IP: 'localhost'
  Porta: 3306
  Database: 'minecraft'
  Usuario: 'root'
  Senha: ''
  # Conexoes simultaneas (apenas MYSQL).
  Pool: 10

# Opcoes gerais
Opcoes:
  # Abrir o menu ao digitar /kit sem argumentos.
  Menu: true
  # Sistema de rastreio: marca os itens entregues para poder bani-los/atualiza-los
  # depois pelo painel. Itens com dados custom de OUTROS plugins (PDC proprio) sao
  # sempre entregues SEM a marca, para nao quebrar a funcao deles. Deixe em false
  # para desligar a marca em TODOS os itens (o painel de rastreio deixa de agir).
  Rastreio:
    Ativar: true
  # Recusar a coleta quando nao houver espaco para todos os itens.
  Verificar inventario cheio: true
  # Esconder dos menus os kits em que o jogador nao tem permissao.
  Esconder sem permissao: false
  # A lore de espera substitui a lore original do icone.
  Lore aguardar sobrepoe: true

  # A opcao "Kit de ativacao" no /editarkit aparece sozinha quando o StarVips
  # ou o yVips estao instalados. Ligue aqui para mostrar sempre, util se o seu
  # sistema de VIP for outro e chamar /starkits ativacao por comando.
  Sempre mostrar kit de ativacao: false

  # Acrescenta uma lore identificando o dono nos itens entregues.
  Lore do dono:
    Ativar: false
    Lore:
      - ''
      - '&f Item de &b{player}'
      - ''
    # Materiais que nunca recebem essa lore E também ficam FORA do sistema de
    # rastreio (a marca de rastreio faz um round-trip na meta do item que, em
    # alguns itens custom/com funcao de outro plugin, apaga a "alma" do item e
    # ele deixa de funcionar ao pegar o kit). Coloque aqui o material do item
    # que estiver quebrando ao ser recebido do kit.
    Materiais ignorados: [ 'CHEST', 'HOPPER', 'BELL', 'COMMAND_BLOCK', 'TNT', 'PAPER' ]

# Opcoes da importacao (/starkits importar <pasta>)
Importacao:
  # Troca o inicio da permissao dos kits importados.
  # Deixe o antigo vazio para manter as permissoes como estao, sem mexer nos
  # grupos ja configurados no seu gerenciador de permissoes.
  # Exemplo: 'outroplugin.' vira 'starkits.'
  Prefixo de permissao antigo: ''
  Prefixo de permissao novo: 'starkits.'

  # Traz sozinho os kits do StarEssentials quando o servidor sobe.
  #
  # Nada e apagado la: o plugins/StarEssentials/kits.yml fica intacto. So vem o
  # que ainda nao veio (a lista fica em importados-staressentials.txt), entao
  # kit editado ou apagado aqui nao volta sozinho no proximo start.
  #
  # Com o StarKits presente, o StarEssentials nao registra mais /kit, /kits e
  # companhia — os comandos ficam todos com o StarKits.
  StarEssentials automatica: true

# Sons dos menus. Formato: SOM ou SOM:volume:tom
# Deixe vazio ('') para desativar um som especifico.
Sons:
  Usar: true
  Abrir menu: 'BLOCK_CHEST_OPEN:1:1'
  Abrir categoria: 'UI_BUTTON_CLICK:1:1'
  Recolher kit: 'ENTITY_PLAYER_LEVELUP:1:2'
  Preview: 'UI_BUTTON_CLICK:1:1'
  Voltar: 'UI_BUTTON_CLICK:1:0.8'
  Erro: 'ENTITY_VILLAGER_NO:1:1'

# Setas usadas em todos os menus
Setas:
  Voltar:
    CustomSkull: false
    URL: ''
    ID: ARROW
    Glow: true
    Name: '&cVoltar'
    Lore:
      - '&7Clique para voltar ao menu anterior.'
  Anterior:
    CustomSkull: false
    URL: ''
    ID: ARROW
    Glow: true
    Name: '&cAnterior'
    Lore:
      - '&7Clique para voltar a pagina anterior.'
  Proximo:
    CustomSkull: false
    URL: ''
    ID: ARROW
    Glow: true
    Name: '&aProxima'
    Lore:
      - '&7Clique para ir a proxima pagina.'
