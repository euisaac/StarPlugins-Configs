# Ajuste de um item rastreado: encantamentos e banimento.
#
# Cada encantamento do item vira uma coluna:
#   SlotsAumentar -> botao de subir  (linha de cima)
#   SlotsLivro    -> o livro         (linha do meio)
#   SlotsDiminuir -> botao de descer (linha de baixo)

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       ID: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

Nome: '&8{slot} ➜ {kit}'
Tamanho: 54

# Onde o item aparece, no topo do menu.
ItemSlot: 4

SlotsAumentar: [ 19, 20, 21, 22, 23, 24, 25 ]
SlotsLivro:    [ 28, 29, 30, 31, 32, 33, 34 ]
SlotsDiminuir: [ 37, 38, 39, 40, 41, 42, 43 ]

AnteriorSlot: 27
ProximoSlot: 35
BackSlot: 45

Lore item:
  - ''
  - '&f{slot}'
  - ''
  - '&fEntregues: &a{entregues}'
  - '&fEm circulacao: &e{circulacao}'
  - '&fJa removidas: &c{removidos}'
  - ''
  - '&7Alterar um encantamento aqui corrige'
  - '&7as copias que os jogadores ja tem,'
  - '&7assim que eles mexerem no item.'
  - '&8Versao do item: {versao}'

Itens:
  # Placeholders disponiveis nos tres itens abaixo:
  #   {encantamento}      nome do encantamento
  #   {nivel}             nivel atual em romano
  #   {numero}            nivel atual em numero
  #   {aumentado}         como fica depois de um clique de aumentar
  #   {aumentado_numero}  o mesmo, em numero
  #   {diminuido}         como fica depois de um clique de diminuir
  #   {diminuido_numero}  o mesmo, em numero
  #   {aumentado5}        como fica com shift + clique de aumentar
  #   {diminuido5}        como fica com shift + clique de diminuir

  Livro:
    CustomSkull: false
    URL: ''
    ID: ENCHANTED_BOOK
    Glow: false
    Name: '&b{encantamento} {nivel}'
    Lore:
      - ''
      - '&7Nivel atual: &f{nivel} &7({numero})'
      - ''

  Aumentar:
    CustomSkull: false
    URL: ''
    ID: LIME_DYE
    Glow: false
    Name: '&aAumentar &7» &f{nivel} &a➜ &f{aumentado}'
    Lore:
      - '&7{encantamento}'
      - ''
      - '&7Nivel atual: &f{nivel} &7({numero})'
      - '&aClique: &f{aumentado} &7({aumentado_numero})'
      - '&aShift + clique: &f{aumentado5}'

  Diminuir:
    CustomSkull: false
    URL: ''
    ID: RED_DYE
    Glow: false
    Name: '&cDiminuir &7» &f{nivel} &c➜ &f{diminuido}'
    Lore:
      - '&7{encantamento}'
      - ''
      - '&7Nivel atual: &f{nivel} &7({numero})'
      - '&cClique: &f{diminuido} &7({diminuido_numero})'
      - '&cShift + clique: &f{diminuido5}'

  Banir:
    Slot: 53
    CustomSkull: false
    URL: ''
    ID: BARRIER
    Glow: false
    Name: '&c&lBanir item'
    Lore:
      - '&7O item passa a ser removido do'
      - '&7inventario de quem o tiver, assim que'
      - '&7ele for movimentado.'
      - ''
      - '&fCopias em circulacao: &e{circulacao}'
      - '&fJa removidas: &c{removidos}'
      - ''
      - '&cClique para banir.'

  Desbanir:
    Slot: 53
    CustomSkull: false
    URL: ''
    ID: STRUCTURE_VOID
    Glow: true
    Name: '&a&lLiberar item'
    Lore:
      - '&c&lESTE ITEM ESTA BANIDO'
      - ''
      - '&fFalta remover: &e{circulacao}'
      - '&fJa removidas: &c{removidos}'
      - ''
      - '&aClique para liberar o item de novo.'

  Vazio:
    Slot: 31
    CustomSkull: false
    URL: ''
    ID: GRAY_STAINED_GLASS_PANE
    Glow: false
    Name: '&7Sem encantamentos'
    Lore:
      - '&8Este item nao tem encantamentos'
      - '&8para ajustar.'
