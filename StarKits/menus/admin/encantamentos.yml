# Editor de encantamentos em massa.
#
# Cada encantamento presente no conjunto ocupa uma coluna:
#   SlotsAumentar  -> botao de subir o nivel   (linha de cima)
#   SlotsLivro     -> o livro do encantamento  (linha do meio)
#   SlotsDiminuir  -> botao de descer o nivel  (linha de baixo)
#
# As tres listas precisam ter o mesmo tamanho: cada posicao forma uma coluna.
# SlotsPreview e a coluna da direita, mostrando a armadura de pe:
# capacete, peitoral, calca e botas, de cima para baixo.

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       ID: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

Nome: '&8{alvo} ➜ {kit}'
Tamanho: 54

SlotsAumentar: [ 1, 2, 3, 4, 5, 6 ]
SlotsLivro:    [ 10, 11, 12, 13, 14, 15 ]
SlotsDiminuir: [ 19, 20, 21, 22, 23, 24 ]

SlotsPreview: [ 8, 17, 26, 35 ]

AnteriorSlot: 45
ProximoSlot: 53
BackSlot: 49

Itens:
  # Placeholders disponiveis nos tres itens abaixo:
  #   {encantamento} nome do encantamento
  #   {nivel}        nivel atual em romano ("V" ou "IV a VII")
  #   {numero}       nivel atual em numero ("5" ou "4 a 7")
  #   {minimo}       menor nivel entre os itens
  #   {maximo}       maior nivel entre os itens
  #   {itens}        quantos itens tem este encantamento
  #   {aumentado}    como fica depois de um clique de aumentar
  #   {diminuido}    como fica depois de um clique de diminuir
  #   {aumentado5}   como fica com shift + clique de aumentar
  #   {diminuido5}   como fica com shift + clique de diminuir

  Livro:
    CustomSkull: false
    URL: ''
    ID: ENCHANTED_BOOK
    Glow: false
    Name: '&b{encantamento} {nivel}'
    Lore:
      - ''
      - '&7Nivel atual: &f{nivel} &7({numero})'
      - '&7Aplicado em &f{itens}&7 item(ns).'
      - ''

  Aumentar:
    CustomSkull: false
    URL: ''
    ID: LIME_DYE
    Glow: false
    Name: '&aAumentar &7» &f{nivel} &a➜ &f{aumentado}'
    Lore:
      - '&7{encantamento}'
      - ''
      - '&7Nivel atual: &f{nivel}'
      - '&aClique: &f{aumentado}'
      - '&aShift + clique: &f{aumentado5}'

  Diminuir:
    CustomSkull: false
    URL: ''
    ID: RED_DYE
    Glow: false
    Name: '&cDiminuir &7» &f{nivel} &c➜ &f{diminuido}'
    Lore:
      - '&7{encantamento}'
      - ''
      - '&7Nivel atual: &f{nivel}'
      - '&cClique: &f{diminuido}'
      - '&cShift + clique: &f{diminuido5}'
      - ''
      - '&7O nivel minimo e &f1&7.'

  # Mostrado quando o conjunto nao tem nenhum encantamento.
  Vazio:
    Slot: 22
    CustomSkull: false
    URL: ''
    ID: BARRIER
    Glow: false
    Name: '&cNenhum encantamento'
    Lore:
      - '&7Os itens deste conjunto nao possuem'
      - '&7encantamentos para alterar.'

  # Preenche os espacos vazios da coluna de preview.
  PreviewVazio:
    CustomSkull: false
    URL: ''
    ID: GRAY_STAINED_GLASS_PANE
    Glow: false
    Name: '&7{peca}'
    Lore:
      - '&8Nenhuma peca neste espaco.'
