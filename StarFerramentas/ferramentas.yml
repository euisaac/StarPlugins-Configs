# ---------------------------------------------------------------------------
# StarFerramentas - as ferramentas
#
# Cada chave dentro de "Ferramentas:" e uma ferramenta. O nome da chave e o id
# usado em /starferramentas dar <jogador> <id> e na permissao
# starferramentas.usar.<id>.
#
# Renomear, apagar ou criar ferramentas aqui e livre: o loader nao reclama
# deste arquivo nem repoe os exemplos que voce tirar.
#
# ===========================================================================
#  MODOS
# ===========================================================================
#
# *** CUBO ***
# Quebra uma area em cubo em volta do bloco (a classica picareta de tunel /
# de bandeja).
#   Nivel de quebra: tamanho do cubo (3 = 3x3x3) [NUMERO]
#
# *** PILAR ***
# Quebra a coluna inteira de blocos do mesmo tipo (a varinha de areia).
#   Limite: teto de blocos da coluna [NUMERO]
#
# *** CONSTRUTOR ***
# Cria uma coluna do mesmo bloco clicado, para o lado em que voce clicou.
#   Comprimento: tamanho da coluna [NUMERO]
#   Consumir blocos: tira os blocos do inventario do jogador [true/false]
#
# *** CANHAO ***
# Enche de TNT todos os dispensers de uma area. Marque a area com clique
# esquerdo (canto 1) e clique direito (canto 2), e clique direito de novo no
# ar para encher.
#   Quantidade de tnt: quanto entra em cada dispenser [NUMERO]
#
# *** FABRICACAO ***
# Fabrica sozinho, dentro do bau clicado, tudo o que der.
#   Fabricacoes: os RESULTADOS que a varinha sabe fabricar [LISTA]
#
# *** PE_DE_CABRA ***
# Quebra spawners e devolve o spawner em item, com o mob dentro.
#   Comandos ao usar: comandos rodados no console; aceita %jogador%,
#                     %entidade%, %mundo%, %x%, %y%, %z% [LISTA]
#
# *** DRENAR ***
# Tira gelo e agua de uma area.
#   Raio: 3 limpa uma area de 7x7x7 [NUMERO]
#
# *** GELO ***
# Derrete o gelo da area, virando agua.
#   Raio: igual ao de cima [NUMERO]
#
# *** COLHEITADEIRA ***
# Colhe as plantacoes maduras, replanta sozinho e transforma terra em terra
# arada. Respeita toque suave e fortuna.
#   Raio: tamanho da area colhida [NUMERO]
#   Raio da terra: area em que a terra vira terra arada [NUMERO]
#   Somente uma camada: colhe so no nivel do bloco clicado [true/false]
#   Vender colheita: vende o que colheu em vez de entregar [true/false]
#   Multiplicador: multiplica o dinheiro da venda [DECIMAL]
#
# *** IMA ***
# Puxa para o inventario todos os itens caidos por perto.
#   Raio: distancia em blocos [NUMERO]
#
# *** RAIO ***
# Cai um raio no lugar clicado, carregando os creepers em volta.
#
# *** VENDA ***
# Vende tudo que estiver no bau clicado.
#   Multiplicador: multiplica o valor pago [DECIMAL]
#
# *** ORGANIZAR ***
# Organiza o conteudo do bau clicado.
#
# *** MOTOSSERRA ***
# Derruba a arvore inteira de uma vez (com usos, cooldown e lore proprios).
# Com ela na mao nao e preciso agachar nem usar machado.
#   Maximo de blocos / Quebrar folhas / Replantar: iguais aos do config.yml
#
# *** ARCO ***
# Arco cujas flechas perseguem o alvo. Tudo que nao estiver escrito aqui vem
# da secao "Arco" do config.yml.
#   Alcance / Alvos / Forca da curva / Travar no mirado / Dano extra / Rastro
#
# ===========================================================================
#  OPCOES QUE VALEM PARA QUALQUER MODO
# ===========================================================================
#
# Tipo ...................... material do item
# Nome ...................... nome do item
# Lore ...................... descricao; use {} onde entram os usos restantes
# Quantidade ................ quantos itens saem no /starferramentas dar
# Encantamentos ............. lista no formato "ENCANTAMENTO:NIVEL"
# Flags ..................... lista de ItemFlag (HIDE_ENCHANTS, HIDE_ATTRIBUTES...)
# Brilho .................... brilho de encantado, sem encantamento visivel
# Modelo customizado ........ CustomModelData, para textura propria (1.14+)
# Modelo do item ............ item_model, para textura propria (1.21.2+)
# Tempo de espera ........... espera entre um uso e outro, em milissegundos
# Coleta automatica ......... os drops vao direto para o inventario
# Quebra instantanea ........ o bloco quebra no primeiro toque
# Toque suave ............... toque suave escondido (o bloco cai inteiro)
# Somente mesmo tipo ........ so quebra blocos iguais ao primeiro
# Somente dentro de terreno . so funciona dentro de terreno protegido
# Indestrutivel ............. a ferramenta nunca quebra
# Dano vanilla .............. o uso normal do jogo tambem gasta a ferramenta
# Marcar indestrutivel ...... marca o item como indestrutivel para o cliente
# Multiferramenta ........... o item vira picareta, pa ou machado conforme o bloco
# Usos ...................... durabilidade propria; sem isto vale a do jogo
#                             (cada uso da ferramenta gasta um; a motosserra
#                             gasta um por arvore, nao por tronco)
# Barra de usos ............. a barra de durabilidade acompanha os usos
# Manter no inventario ...... nao pode ser jogado fora nem perdido na morte
# Particular ................ so o dono usa (o dono e quem recebeu o item)
# Bigorna exp ............... xp para juntar duas na bigorna (-1 desliga)
# Bigorna limite ............ teto de usos da ferramenta juntada (-1 desliga)
# Estatisticas .............. conta os blocos nas estatisticas do jogador
# Permitir encantar ......... deixa o jogador encantar a ferramenta na mesa e
#                             na bigorna (true por padrao)
# Permissao ................. permissao extra exigida (alem da usar.<id>)
# Acao ...................... CLIQUE_DIREITO ou CLIQUE_ESQUERDO, nos modos
#                             que aceitam os dois
# Blocos permitidos ......... so estes blocos sao quebrados
# Blocos bloqueados ......... estes blocos nunca sao quebrados
# Drops permitidos .......... so estes itens caem
# Drops bloqueados .......... estes itens nunca caem
# Mundos permitidos ......... so funciona nestes mundos
# Mundos bloqueados ......... nao funciona nestes mundos
# Plugins notificados ....... plugins avisados da quebra, so para esta ferramenta
#
# ===========================================================================
#  HABILIDADES
# ===========================================================================
#
# Habilidade nao e o modo: o modo e o que a ferramenta faz sempre, a habilidade
# e um poder que o jogador LIGA com o clique direito, dura alguns segundos e
# depois entra em tempo de espera.
#
# Habilidade:
#   Tipo ............... LASER, VEIA, FUSAO ou NENHUMA
#   Sempre ligada ...... true faz o poder valer sempre, sem clique, sem duracao
#                        e sem tempo de espera (e o caso da Arma Laser)
#   Duracao ............ segundos ligada
#   Tempo de espera .... segundos de recarga depois que acaba
#   Alcance ............ no laser, quantos blocos a mais o tunel avanca na
#                        direcao em que o jogador esta olhando
#   Particula .......... a particula do feixe (FLAME, CRIT, SMOKE...); vazio
#                        nao desenha feixe nenhum
#   Exigir agachado .... true pede o jogador agachado para ligar
#   Permissao .......... permissao extra so para a habilidade
#   Sons.Ligou / Sons.Acabou
#
# LASER: enquanto esta ligada, cada golpe abre a mesma area do modo CUBO
# esticada para a frente pelo Alcance -- um 3x3 com Alcance 10 vira um tunel de
# 3x3x11 por golpe, com o feixe desenhado ate o fim. O tunel sai na direcao em
# que o jogador esta olhando, inclusive na diagonal e para cima ou para baixo.
#
# VEIA: quebrar um bloco leva junto todos os blocos iguais grudados nele (a veia
# de minerio inteira). Aqui o Alcance e o teto de blocos por veia.
#
# FUSAO: o que cai ja vem do jeito que sairia do forno -- minerio vira barra,
# areia vira vidro. Vale para qualquer ferramenta que quebre blocos.
#
# Em ferramenta que ja usa o clique direito para trabalhar (varinha de venda e
# afins), ligar a habilidade pede o jogador agachado -- senao um clique so
# faria as duas coisas.
#
# Blocos e drops aceitam "MATERIAL" e "MATERIAL:DADO".
# ---------------------------------------------------------------------------

# Nao mexa: e por este numero que o plugin sabe que o modelo do arquivo mudou.
Versao do modelo: 1

Ferramentas:

  super_area:
    Modo: CUBO
    Nivel de quebra: 3
    # Efeito visual (só aparência) tocado no centro do que a ferramenta quebra.
    # Nome de partícula do Bukkit; ex.: EXPLOSION, EXPLOSION_EMITTER, POOF, FLAME.
    # Deixe de fora ou vazio para nenhum efeito.
    Efeito: EXPLOSION
    # Opcoes que o dono libera para o jogador ligar/desligar com /ferramenta.
    # Ids:
    #   'dropar' ........... ligada, o que voce quebra cai no chao; desligada,
    #                        vai direto para o inventario
    #   'drops-permitidos' . ligada, so cai o que esta em "Drops permitidos";
    #                        desligada, cai tudo o que o bloco daria -- os
    #                        "Drops bloqueados" valem nos dois casos
    #   'area' ............. o 3x3: ligada quebra a area toda, desligada quebra
    #                        so o bloco batido
    #   'efeito' ........... o efeito visual da ferramenta
    #   'coleta' ........... coleta automatica (o mesmo que 'dropar' ao
    #                        contrario; some da tela quando 'dropar' esta la)
    # 'dropar' e 'area' aparecem sozinhas no modo CUBO, e 'drops-permitidos'
    # aparece sozinha em quem tem lista de permitidos. Escrever aqui serve para
    # fixar o estado inicial de cada uma.
    #
    # Dois jeitos de escrever:
    #   Opcoes-do-jogador:      | Opcoes-do-jogador:
    #     - drops               |   drops: ativado
    #     - coleta              |   coleta: desativado
    # A lista simples usa o padrao da opcao; a forma "id: ativado/desativado"
    # fixa o estado inicial que o jogador recebe. Tire a lista para travar tudo.
    # (O 'efeito' ate aparece sozinho por ter Efeito acima; deixamos escrito so
    # para o jogador poder desligar a explosao e para o dono fixar o padrao.)
    Opcoes-do-jogador:
      dropar: desativado
      drops-permitidos: ativado
      area: ativado
      efeito: ativado
    # O poder que o jogador liga com o clique direito (veja HABILIDADES no
    # cabecalho). Tire a secao inteira, ou ponha Tipo: NENHUMA, para a picareta
    # nao ter habilidade.
    Habilidade:
      Tipo: LASER
      Duracao: 15
      Tempo de espera: 60
      Alcance: 10
      Particula: FLAME
      Exigir agachado: false
      Permissao: ''
      Sons:
        Ligou: 'ENTITY_BLAZE_SHOOT;0.8;1.4'
        Acabou: 'BLOCK_FIRE_EXTINGUISH;0.8;1.0'
    Somente mesmo tipo: false
    # false = a picareta gasta a durabilidade normal do jogo a cada uso e quebra
    # no fim (o Inquebravel continua valendo). Ponha true para ela nunca quebrar.
    Indestrutivel: false
    # false = ninguem consegue encantar esta ferramenta, nem na mesa nem com
    # livro na bigorna. Ela ja vem com os encantamentos de baixo.
    Permitir encantar: false
    # Os drops dos blocos quebrados vao direto para o inventario do jogador,
    # como se ele tivesse minerado cada um (senao cairiam espalhados no tunel).
    Coleta automatica: true
    Tipo: DIAMOND_PICKAXE
    Nome: '&b&lSuper Area'
    Lore:
      - '&7Item especial: quebra em &f3x3&7.'
      - '&7Clique direito liga o &claser &7por 15s.'
      - '&8Gerencie em &7/ferramenta'
    Encantamentos:
      - 'DIG_SPEED:5'
    Blocos bloqueados:
      - 'SPAWNER'
    Drops permitidos:
      - 'COAL'
      - 'IRON_ORE'
      - 'GOLD_ORE'
      - 'REDSTONE'
      - 'LAPIS_LAZULI'
      - 'DIAMOND'
      - 'EMERALD'
      - 'QUARTZ'
      - 'RAW_IRON'
      - 'RAW_GOLD'
      - 'RAW_COPPER'

  # A mesma picareta 3x3, mas com o laser SEMPRE ligado: nao tem clique para
  # ativar, nao tem duracao e nao tem tempo de espera -- o poder e a propria
  # ferramenta.
  arma_laser:
    Modo: CUBO
    Nivel de quebra: 3
    Habilidade:
      Tipo: LASER
      Sempre ligada: true
      Alcance: 10
      Particula: FLAME
    Coleta automatica: true
    Indestrutivel: false
    Permitir encantar: false
    Tipo: DIAMOND_PICKAXE
    Nome: '&c&lArma Laser'
    Lore:
      - '&7Picareta &f3x3 &7com o &claser sempre ligado&7.'
      - '&7Cada golpe abre &f10 blocos &7para a frente.'
      - '&8Gerencie em &7/ferramenta'
    Encantamentos:
      - 'DIG_SPEED:5'
    Blocos bloqueados:
      - 'SPAWNER'
    Opcoes-do-jogador:
      dropar: desativado
      area: ativado

  # Habilidade VEIA: fora dela e uma picareta comum (Nivel de quebra 1 = so o
  # bloco batido); ligada, cada golpe leva a veia de minerio inteira.
  picareta_veia:
    Modo: CUBO
    Nivel de quebra: 1
    Habilidade:
      Tipo: VEIA
      Duracao: 20
      Tempo de espera: 45
      Alcance: 64
      Particula: ''
      Sons:
        Ligou: 'ENTITY_EXPERIENCE_ORB_PICKUP;0.8;0.6'
        Acabou: 'BLOCK_FIRE_EXTINGUISH;0.8;1.0'
    Coleta automatica: true
    Tipo: IRON_PICKAXE
    Nome: '&a&lPicareta Veia'
    Lore:
      - '&7Clique direito para levar a &aveia inteira&7.'
      - '&7Dura &f20s&7, recarrega em &f45s&7.'
      - '&8Gerencie em &7/ferramenta'
    Encantamentos:
      - 'DIG_SPEED:3'
    Blocos bloqueados:
      - 'SPAWNER'

  # Habilidade FUSAO: ligada, o que cai ja vem fundido (minerio vira barra).
  picareta_fundicao:
    Modo: CUBO
    Nivel de quebra: 1
    Habilidade:
      Tipo: FUSAO
      Duracao: 30
      Tempo de espera: 60
      Particula: ''
      Sons:
        Ligou: 'BLOCK_FIRE_AMBIENT;0.9;1.2'
        Acabou: 'BLOCK_FIRE_EXTINGUISH;0.8;1.0'
    Coleta automatica: true
    Tipo: GOLDEN_PICKAXE
    Nome: '&6&lPicareta de Fundicao'
    Lore:
      - '&7Clique direito e o que cair ja vem &6fundido&7.'
      - '&7Dura &f30s&7, recarrega em &f60s&7.'
      - '&8Gerencie em &7/ferramenta'
    Encantamentos:
      - 'DIG_SPEED:3'

  picareta_bandeja:
    Modo: CUBO
    Nivel de quebra: 3
    Somente mesmo tipo: false
    Indestrutivel: true
    Tipo: DIAMOND_PICKAXE
    Nome: '&e&lPicareta Bandeja'
    Lore:
      - '&7Limpa a terra e a netherrack em volta, em &f3x3&7.'
      - '&8Gerencie em &7/ferramenta'
    Encantamentos:
      - 'DIG_SPEED:5'
    Blocos permitidos:
      - 'DIRT'
      - 'NETHERRACK'

  varinha_areia:
    Modo: PILAR
    Tempo de espera: 2000
    Usos: 500
    Limite: 256
    Tipo: DIAMOND_HOE
    Nome: '&e&lVarinha de Areia'
    Lore:
      - '&7Derruba a coluna de areia inteira.'
      - '&8Usos: &7{}'
    Blocos permitidos:
      - 'SAND'

  varinha_venda_1:
    Modo: VENDA
    Tempo de espera: 5000
    Usos: 50
    Tipo: STICK
    Nome: '&6&lVarinha de Venda &7I'
    Lore:
      - '&7Vende tudo o que estiver no bau clicado.'
      - '&8Usos: &7{}'

  varinha_venda_2:
    Modo: VENDA
    Tempo de espera: 5000
    Usos: 50
    Multiplicador: 1.5
    Tipo: STICK
    Nome: '&6&lVarinha de Venda &7II'
    Lore:
      - '&7Vende tudo o que estiver no bau clicado.'
      - '&7Paga &fx1.5 &7do valor normal.'
      - '&8Usos: &7{}'

  varinha_raio:
    Modo: RAIO
    Tipo: STICK
    Usos: 5
    Nome: '&b&lVarinha de Raio'
    Lore:
      - '&7Faz cair um raio no lugar clicado.'
      - '&8Usos: &7{}'

  varinha_ima:
    Modo: IMA
    Tipo: STICK
    Raio: 5
    Usos: 500
    Nome: '&4&lVarinha Ima'
    Lore:
      - '&7Puxa os itens caidos num raio de &f5 blocos&7.'
      - '&8Usos: &7{}'

  enxada_colheitadeira:
    Modo: COLHEITADEIRA
    Raio: 3
    Raio da terra: 3
    Coleta automatica: true
    Tipo: DIAMOND_HOE
    Usos: 500
    Nome: '&d&lEnxada Colheitadeira'
    Lore:
      - '&7Colhe, replanta e ara a terra em volta.'
      - '&8Usos: &7{}'

  varinha_canhao:
    Modo: CANHAO
    Quantidade de tnt: 64
    Tipo: DIAMOND_AXE
    Usos: 30
    Nome: '&5&lVarinha de Canhao'
    Lore:
      - '&7Enche de TNT os dispensers da area marcada.'
      - '&7Esquerdo marca o canto 1, direito o canto 2.'
      - '&8Usos: &7{}'

  varinha_fabricacao:
    Modo: FABRICACAO
    Tipo: STICK
    Usos: 3000
    Nome: '&9&lVarinha de Fabricacao'
    Lore:
      - '&7Bata num bau para fabricar TNT sozinho.'
      - '&8Usos: &7{}'
    Fabricacoes:
      - 'TNT'

  varinha_construtor:
    Modo: CONSTRUTOR
    Tipo: DIAMOND_AXE
    Usos: 1000
    Comprimento: 5
    Consumir blocos: true
    Nome: '&2&lVarinha de Construcao'
    Lore:
      - '&7Estica uma coluna do bloco clicado.'
      - '&8Usos: &7{}'

  varinha_gelo:
    Modo: GELO
    Tipo: STICK
    Usos: 300
    Raio: 10
    Nome: '&3&lDerretedor de Gelo'
    Lore:
      - '&7Derrete o gelo num raio de &f10 blocos&7.'
      - '&8Usos: &7{}'

  varinha_drenagem:
    Modo: DRENAR
    Tipo: STICK
    Usos: 300
    Raio: 10
    Nome: '&3&lVarinha de Drenagem'
    Lore:
      - '&7Tira agua e gelo num raio de &f10 blocos&7.'
      - '&8Usos: &7{}'

  varinha_organizar:
    Modo: ORGANIZAR
    Tipo: STICK
    Usos: 300
    Nome: '&1&lVarinha Organizadora'
    Lore:
      - '&7Arruma e junta as pilhas do bau clicado.'
      - '&8Usos: &7{}'

  pe_de_cabra:
    Modo: PE_DE_CABRA
    Tipo: GOLDEN_HOE
    Usos: 25
    Nome: '&1&lPe de Cabra'
    Lore:
      - '&7Recolhe o gerador de mobs com o mob dentro.'
      - '&8Usos: &7{}'
    Comandos ao usar: []

  machado_motosserra:
    Modo: MOTOSSERRA
    Tipo: DIAMOND_AXE
    Usos: 400
    Maximo de blocos: 250
    Quebrar folhas: true
    Replantar: true
    Coleta automatica: true
    Nome: '&6&lMotosserra'
    Lore:
      - '&7Derruba a arvore inteira num golpe so.'
      - '&8Usos: &7{}'
    Encantamentos:
      - 'DIG_SPEED:3'

  arco_teleguiado:
    Modo: ARCO
    Tipo: BOW
    Usos: 250
    Alcance: 40
    Alvos: JOGADORES
    Forca da curva: 0.28
    Travar no mirado: true
    Dano extra: 1.0
    Rastro: 'CRIT_MAGIC'
    Nome: '&c&lArco Teleguiado'
    Lore:
      - '&7As flechas perseguem o alvo mirado.'
      - '&8Usos: &7{}'
    Encantamentos:
      - 'ARROW_INFINITE:1'
    Flags:
      - HIDE_ENCHANTS
