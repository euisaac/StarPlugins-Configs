# ---------------------------------------------------------------------------
# StarFerramentas - as ferramentas
#
# Cada chave dentro de "Ferramentas:" e uma ferramenta. O nome da chave e o id
# usado em /starferramentas dar <jogador> <id> e na permissao
# starferramentas.usar.<id>.
#
# Renomear, apagar ou criar ferramentas aqui e livre: o loader nao reclama
# deste arquivo nem repoe os exemplos que voce tirar.
#
# ===========================================================================
#  MODOS
# ===========================================================================
#
# *** CUBO ***
# Quebra uma area em cubo em volta do bloco (a classica picareta de tunel /
# de bandeja).
#   Nivel de quebra: tamanho do cubo (3 = 3x3x3) [NUMERO]
#
# *** PILAR ***
# Quebra a coluna inteira de blocos do mesmo tipo (a varinha de areia).
#   Limite: teto de blocos da coluna [NUMERO]
#
# *** CONSTRUTOR ***
# Cria uma coluna do mesmo bloco clicado, para o lado em que voce clicou.
#   Comprimento: tamanho da coluna [NUMERO]
#   Consumir blocos: tira os blocos do inventario do jogador [true/false]
#
# *** CANHAO ***
# Enche de TNT todos os dispensers de uma area. Marque a area com clique
# esquerdo (canto 1) e clique direito (canto 2), e clique direito de novo no
# ar para encher.
#   Quantidade de tnt: quanto entra em cada dispenser [NUMERO]
#
# *** FABRICACAO ***
# Fabrica sozinho, dentro do bau clicado, tudo o que der.
#   Fabricacoes: os RESULTADOS que a varinha sabe fabricar [LISTA]
#
# *** PE_DE_CABRA ***
# Quebra spawners e devolve o spawner em item, com o mob dentro.
#   Comandos ao usar: comandos rodados no console; aceita %jogador%,
#                     %entidade%, %mundo%, %x%, %y%, %z% [LISTA]
#
# *** DRENAR ***
# Tira gelo e agua de uma area.
#   Raio: 3 limpa uma area de 7x7x7 [NUMERO]
#
# *** GELO ***
# Derrete o gelo da area, virando agua.
#   Raio: igual ao de cima [NUMERO]
#
# *** COLHEITADEIRA ***
# Colhe as plantacoes maduras, replanta sozinho e transforma terra em terra
# arada. Respeita toque suave e fortuna.
#   Raio: tamanho da area colhida [NUMERO]
#   Raio da terra: area em que a terra vira terra arada [NUMERO]
#   Somente uma camada: colhe so no nivel do bloco clicado [true/false]
#   Vender colheita: vende o que colheu em vez de entregar [true/false]
#   Multiplicador: multiplica o dinheiro da venda [DECIMAL]
#
# *** IMA ***
# Puxa para o inventario todos os itens caidos por perto.
#   Raio: distancia em blocos [NUMERO]
#
# *** RAIO ***
# Cai um raio no lugar clicado, carregando os creepers em volta.
#
# *** VENDA ***
# Vende tudo que estiver no bau clicado.
#   Multiplicador: multiplica o valor pago [DECIMAL]
#
# *** ORGANIZAR ***
# Organiza o conteudo do bau clicado.
#
# *** MOTOSSERRA ***
# Derruba a arvore inteira de uma vez (com usos, cooldown e lore proprios).
# Com ela na mao nao e preciso agachar nem usar machado.
#   Maximo de blocos / Quebrar folhas / Replantar: iguais aos do config.yml
#
# *** ARCO ***
# Arco cujas flechas perseguem o alvo. Tudo que nao estiver escrito aqui vem
# da secao "Arco" do config.yml.
#   Alcance / Alvos / Forca da curva / Travar no mirado / Dano extra / Rastro
#
# ===========================================================================
#  OPCOES QUE VALEM PARA QUALQUER MODO
# ===========================================================================
#
# Tipo ...................... material do item
# Nome ...................... nome do item
# Lore ...................... descricao; use {} onde entram os usos restantes
# Quantidade ................ quantos itens saem no /starferramentas dar
# Encantamentos ............. lista no formato "ENCANTAMENTO:NIVEL"
# Flags ..................... lista de ItemFlag (HIDE_ENCHANTS, HIDE_ATTRIBUTES...)
# Brilho .................... brilho de encantado, sem encantamento visivel
# Modelo customizado ........ CustomModelData, para textura propria (1.14+)
# Modelo do item ............ item_model, para textura propria (1.21.2+)
# Tempo de espera ........... espera entre um uso e outro, em milissegundos
# Coleta automatica ......... os drops vao direto para o inventario
# Quebra instantanea ........ o bloco quebra no primeiro toque
# Toque suave ............... toque suave escondido (o bloco cai inteiro)
# Somente mesmo tipo ........ so quebra blocos iguais ao primeiro
# Somente dentro de terreno . so funciona dentro de terreno protegido
# Indestrutivel ............. a ferramenta nunca quebra
# Dano vanilla .............. o uso normal do jogo tambem gasta a ferramenta
# Marcar indestrutivel ...... marca o item como indestrutivel para o cliente
# Multiferramenta ........... o item vira picareta, pa ou machado conforme o bloco
# Usos ...................... durabilidade propria; sem isto vale a do jogo
#                             (cada uso da ferramenta gasta um; a motosserra
#                             gasta um por arvore, nao por tronco)
# Barra de usos ............. a barra de durabilidade acompanha os usos
# Manter no inventario ...... nao pode ser jogado fora nem perdido na morte
# Particular ................ so o dono usa (o dono e quem recebeu o item)
# Bigorna exp ............... xp para juntar duas na bigorna (-1 desliga)
# Bigorna limite ............ teto de usos da ferramenta juntada (-1 desliga)
# Estatisticas .............. conta os blocos nas estatisticas do jogador
# Permitir encantar ......... deixa o jogador encantar a ferramenta na mesa e
#                             na bigorna (true por padrao)
# Permissao ................. permissao extra exigida (alem da usar.<id>)
# Acao ...................... CLIQUE_DIREITO ou CLIQUE_ESQUERDO, nos modos
#                             que aceitam os dois
# Blocos permitidos ......... so estes blocos sao quebrados
# Blocos bloqueados ......... estes blocos nunca sao quebrados
# Drops permitidos .......... so estes itens caem
# Drops bloqueados .......... estes itens nunca caem
# Mundos permitidos ......... so funciona nestes mundos
# Mundos bloqueados ......... nao funciona nestes mundos
# Plugins notificados ....... plugins avisados da quebra, so para esta ferramenta
#
# Blocos e drops aceitam "MATERIAL" e "MATERIAL:DADO".
# ---------------------------------------------------------------------------

# Nao mexa: e por este numero que o plugin sabe que o modelo do arquivo mudou.
Versao do modelo: 1

Ferramentas:

  picareta_tunel:
    Modo: CUBO
    Nivel de quebra: 3
    # Efeito visual (só aparência) tocado no centro do que a ferramenta quebra.
    # Nome de partícula do Bukkit; ex.: EXPLOSION, EXPLOSION_EMITTER, POOF, FLAME.
    # Deixe de fora ou vazio para nenhum efeito.
    Efeito: EXPLOSION
    # Opcoes que o dono libera para o jogador ligar/desligar com /ferramenta.
    # Ids:
    #   'dropar' ........... ligada, o que voce quebra cai no chao; desligada,
    #                        vai direto para o inventario
    #   'drops-permitidos' . ligada, so cai o que esta em "Drops permitidos";
    #                        desligada, cai tudo o que o bloco daria -- os
    #                        "Drops bloqueados" valem nos dois casos
    #   'area' ............. o 3x3: ligada quebra a area toda, desligada quebra
    #                        so o bloco batido
    #   'efeito' ........... o efeito visual da ferramenta
    #   'coleta' ........... coleta automatica (o mesmo que 'dropar' ao
    #                        contrario; some da tela quando 'dropar' esta la)
    # 'dropar' e 'area' aparecem sozinhas no modo CUBO, e 'drops-permitidos'
    # aparece sozinha em quem tem lista de permitidos. Escrever aqui serve para
    # fixar o estado inicial de cada uma.
    #
    # Dois jeitos de escrever:
    #   Opcoes-do-jogador:      | Opcoes-do-jogador:
    #     - drops               |   drops: ativado
    #     - coleta              |   coleta: desativado
    # A lista simples usa o padrao da opcao; a forma "id: ativado/desativado"
    # fixa o estado inicial que o jogador recebe. Tire a lista para travar tudo.
    # (O 'efeito' ate aparece sozinho por ter Efeito acima; deixamos escrito so
    # para o jogador poder desligar a explosao e para o dono fixar o padrao.)
    Opcoes-do-jogador:
      dropar: desativado
      drops-permitidos: ativado
      area: ativado
      efeito: ativado
    Somente mesmo tipo: false
    # false = a picareta gasta a durabilidade normal do jogo a cada uso e quebra
    # no fim (o Inquebravel continua valendo). Ponha true para ela nunca quebrar.
    Indestrutivel: false
    # false = ninguem consegue encantar esta ferramenta, nem na mesa nem com
    # livro na bigorna. Ela ja vem com os encantamentos de baixo.
    Permitir encantar: false
    # Os drops dos blocos quebrados vao direto para o inventario do jogador,
    # como se ele tivesse minerado cada um (senao cairiam espalhados no tunel).
    Coleta automatica: true
    Tipo: DIAMOND_PICKAXE
    Nome: '&f --{ &a&lPicareta Tunel &f}-- '
    Lore:
      - '&8&m---------------------------------------'
      - '&7 Esta picareta abre um tunel de 3x3.'
      - '&f'
      - '&a&l Blocos bloqueados:'
      - '&f - &7Gerador de mobs'
      - '&f'
      - '&7 So os minerios sao dropados.'
      - '&8&m---------------------------------------'
    Encantamentos:
      - 'DIG_SPEED:5'
    Blocos bloqueados:
      - 'SPAWNER'
    Drops permitidos:
      - 'COAL'
      - 'IRON_ORE'
      - 'GOLD_ORE'
      - 'REDSTONE'
      - 'LAPIS_LAZULI'
      - 'DIAMOND'
      - 'EMERALD'
      - 'QUARTZ'
      - 'RAW_IRON'
      - 'RAW_GOLD'
      - 'RAW_COPPER'

