# ---------------------------------------------------------------------------
# Mensagens do StarFerramentas.
#
# Aceita &a para cor e &#RRGGBB nas versoes 1.16+. Uma mensagem vazia ('')
# simplesmente nao e enviada - e assim que voce desliga um aviso sem precisar
# de uma chave "Ativado" para cada um.
# ---------------------------------------------------------------------------

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

Prefixo: '&6&lFERRAMENTAS &8| &r'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  Somente jogador: '&cEste comando so funciona dentro do jogo.'
  Jogador nao encontrado: '&cOps! Este jogador nao foi encontrado.'
  Numero invalido: '&cOps! "%valor%" nao e um numero valido.'
  Recarregado: '&aConfiguracoes recarregadas em %tempo%ms.'
  Uso: '&cUse: %uso%'
  Ajuda:
    - '&f'
    - '  &6&lSTARFERRAMENTAS'
    - '  &7Ferramentas e varinhas especiais.'
    - '&f'
    - '  &e/starferramentas dar <jogador> <ferramenta> [qtd] &7- entrega uma ferramenta'
    - '  &e/ferramentas editor &7- menu com todas as ferramentas, para editar'
    - '  &e/ferramentas editar [ferramenta] &7- edita a da mao (ou a que voce indicar)'
    - '  &e/ferramentas criar <nome> &7- cria uma ferramenta nova'
    - '  &e/ferramentas arvore &7- diz por que a arvore mirada nao cai'
    - '  &e/starferramentas usos <quantidade> &7- ajusta os usos da ferramenta na mao'
    - '  &e/starferramentas listar &7- mostra todas as ferramentas'
    - '  &e/starferramentas recarregar &7- recarrega os arquivos'
    - '  &e/derrubar &7- liga e desliga a derrubada de arvores'
    - '&f'

Ferramenta:
  Nao encontrada: '&cOps! Nao existe nenhuma ferramenta com o id "%ferramenta%".'
  Recebeu: '&aVoce recebeu &f%quantidade%x %ferramenta%&a.'
  Entregue: '&aVoce entregou &f%quantidade%x %ferramenta%&a para &f%jogador%&a.'
  Inventario cheio: '&cOps! O inventario de %jogador% esta cheio.'
  Sem item na mao: '&cOps! Segure uma ferramenta do plugin na mao.'
  Usos alterados: '&aA ferramenta agora tem &f%usos% &ausos.'
  Tempo de espera: '&cCalma ai! Espere mais &f%tempo%s &cpara usar de novo.'
  Sem usos: '&cOps! Esta ferramenta acabou de gastar o ultimo uso.'
  Quebrou: '&cA sua ferramenta quebrou de tanto usar!'
  Nao pode encantar: '&cOps! Esta ferramenta nao pode ser encantada.'
  Mundo bloqueado: '&cOps! Esta ferramenta nao funciona neste mundo.'
  Sem permissao: '&cOps! Voce nao tem permissao para usar esta ferramenta.'
  Particular: '&cOps! Esta ferramenta pertence a &f%dono%&c.'
  Fora de terreno: '&cOps! Esta ferramenta so funciona dentro de um terreno seu.'
  Sem acesso: '&cOps! Voce nao pode mexer nos blocos daqui.'
  Nada aconteceu: '&7Nada foi encontrado para esta ferramenta fazer aqui.'
  Lista:
    Cabecalho:
      - '&f'
      - '  &6&lFERRAMENTAS DISPONIVEIS &7(%total%)'
      - '&f'
    Linha: '  &e%id% &7- &f%modo% &8(%usos%)'
    Rodape:
      - '&f'
      - '  &7Use &e/starferramentas dar <jogador> <id> &7para entregar.'
      - '&f'
    Usos ilimitados: 'usos ilimitados'
    Usos: '%usos% usos'

Habilidade:
  # Chat, na hora de ligar e quando o tempo acaba.
  Ligou: '&b&lHABILIDADE &8| &fVoce ativou o &b%habilidade% &fpor &b%tempo%s&f!'
  Acabou: '&b&lHABILIDADE &8| &fO &b%habilidade% &fdesativou. Recarrega em &b%tempo%s&f.'
  Ja ligada: '&cOps! Esta habilidade ja esta ativada.'
  Tempo de espera: '&cCalma ai! Faltam &f%tempo%s &cpara a habilidade recarregar.'
  Sem permissao: '&cOps! Voce nao tem permissao para usar esta habilidade.'
  # Barra de acao enquanto a habilidade esta ligada. Vazio desliga o contador.
  Barra: '&b&l%habilidade% &fEm uso por &b%tempo%s'
  # Como o nome de cada habilidade aparece nas mensagens.
  Nomes:
    LASER: 'LASER'
    VEIA: 'VEIA'
    FUSAO: 'FUSAO'

Venda:
  Vendido: '&aVoce vendeu &f%itens% itens &apor &f$%valor%&a.'
  Vendido com multiplicador: '&aVoce vendeu &f%itens% itens &apor &f$%valor% &7(x%multiplicador%)&a.'
  Nada para vender: '&cOps! Nao ha nada vendavel dentro deste bau.'
  Sem economia: '&cOps! Nenhum plugin de economia foi encontrado no servidor.'
  Nao e recipiente: '&cOps! Clique num bau, num barril ou num ba de armadilha.'

Canhao:
  Canto 1: '&aCanto &f1 &amarcado em &f%x%, %y%, %z%&a.'
  Canto 2: '&aCanto &f2 &amarcado em &f%x%, %y%, %z%&a.'
  Sem selecao: '&cOps! Marque os dois cantos da area antes.'
  Area grande demais: '&cOps! A area marcada tem mais de %limite% blocos.'
  Sem tnt: '&cOps! Voce nao tem TNT suficiente no inventario.'
  Nenhum dispenser: '&cOps! Nao ha nenhum dispenser na area marcada.'
  Encheu: '&aVoce encheu &f%dispensers% dispensers &acom &f%tnt% TNT&a.'

Fabricacao:
  Fabricou: '&aVoce fabricou &f%quantidade%x %item%&a.'
  Nada para fabricar: '&cOps! Nao ha material suficiente neste bau.'

Pe de cabra:
  Quebrou: '&aVoce recolheu um gerador de &f%entidade%&a.'
  Nao e spawner: '&cOps! Clique num gerador de mobs.'

Colheitadeira:
  Colheu: '&aVoce colheu &f%quantidade% &aplantacoes.'
  Vendeu: '&aVoce colheu &f%quantidade% &aplantacoes e recebeu &f$%valor%&a.'
  Nada maduro: '&cOps! Nao ha nada maduro por aqui.'

Ima:
  Puxou: '&aVoce puxou &f%quantidade% &aitens.'
  Nada por perto: '&cOps! Nao ha nenhum item caido por perto.'

Organizar:
  Organizou: '&aBau organizado: &f%itens% &aitens.'

Construtor:
  Construiu: '&aVoce colocou &f%quantidade% &ablocos.'
  Sem blocos: '&cOps! Voce nao tem blocos suficientes no inventario.'
  Sem espaco: '&cOps! Nao ha espaco livre para a coluna.'

Gelo:
  Derreteu: '&aVoce derreteu &f%quantidade% &ablocos de gelo.'
  Nada: '&cOps! Nao ha gelo por perto.'

Drenar:
  Drenou: '&aVoce drenou &f%quantidade% &ablocos.'
  Nada: '&cOps! Nao ha agua nem gelo por perto.'

Arvore:
  Derrubou: '&aVoce derrubou uma arvore de &f%blocos% &ablocos.'
  Grande demais: '&cOps! Esta arvore e grande demais (limite de %limite% blocos).'
  Machado fraco: '&cOps! O seu machado nao aguenta derrubar esta arvore inteira.'
  Sem folhas: '&cEsta arvore nao tem folhas por perto, entao so o bloco batido caiu. (Desligue "Exigir folhas" no config para derrubar mesmo assim.)'
  Somente base: '&cCorte pelo tronco de baixo para derrubar a arvore inteira. (Desligue "Somente pela base" no config para cortar pelo meio.)'
  Bloqueada: '&cNao consegui derrubar esta arvore: algo esta protegendo os blocos (plugin de protecao ou terreno). Veja "Eventos > Plugins de protecao" no config.'
  Mundo bloqueado: '&cOps! Nao da para derrubar arvores neste mundo.'
  Desativada: '&cA derrubada de arvores esta desligada (Arvores > Ativado, no config.yml).'
  Sem permissao: '&cVoce nao tem a permissao &fstarferramentas.arvore&c para derrubar arvores.'
  Desligada: '&eA sua derrubada de arvores esta desligada. Use &f/derrubar &epara ligar.'
  Agache: '&eAgache &7(shift) &eenquanto quebra o tronco para derrubar a arvore inteira.'
  Precisa machado: '&eUse um &fmachado &epara derrubar a arvore inteira.'
  Cancelada: '&cOutro plugin cancelou a quebra deste tronco antes do StarFerramentas, entao a arvore nao caiu. O console diz quem escuta esse evento.'
  Tempo de espera: '&cCalma ai! Espere mais &f%tempo%s &cpara derrubar outra arvore.'
  Ligou: '&aDerrubada de arvores &lLIGADA&a. Agache e quebre o tronco.'
  Desligou: '&eDerrubada de arvores &lDESLIGADA&e.'

Arco:
  Travou: '&7Alvo travado: &f%alvo%&7.'
  Sem alvo: '&7Nenhum alvo por perto; a flecha seguiu reto.'

Sons:
  Ferramenta usada: ''
  Ferramenta negada: 'ENTITY_VILLAGER_NO;0.7;1.0'
  Venda: 'ENTITY_EXPERIENCE_ORB_PICKUP;0.8;1.2'
  Arvore: 'BLOCK_WOOD_BREAK;0.8;1.2'
  Alternar: 'UI_BUTTON_CLICK;0.7;1.4'
