# Configuração do menu da bigorna
# Configurações da interface gráfica

titulo: "&8StarBirgorna"

titulo_escolher_acao: "&6Escolher Ação"

titulo_editar_lore: "&6Editar Lore"

# Slots do inventário
slots:
  item_esquerdo: 11
  item_direito: 15
  resultado: 13
  confirmar: 21
  cancelar: 23

# Itens do menu
itens:
  fundo:
    material: GRAY_STAINED_GLASS_PANE
    nome: ""
    lore: []

  item_esquerdo:
    material: AIR
    nome: "&eItem Esquerdo"
    lore:
      - "&7Coloque o item aqui"

  item_direito:
    material: AIR
    nome: "&eItem Direito"
    lore:
      - "&7Coloque o item aqui"

  resultado:
    material: AIR
    nome: "&aResultado"
    lore:
      - "&7O resultado aparecerá aqui"

  confirmar:
    material: LIME_DYE
    nome: "&aConfirmar"
    lore:
      - "&7Clique para confirmar a operação"

  cancelar:
    material: RED_DYE
    nome: "&cCancelar"
    lore:
      - "&7Clique para cancelar"

  nametag:
    material: NAME_TAG
    nome: "&eRenomear Item"
    lore:
      - "&7Clique para renomear o item"
      - "&7Digite o nome no chat"

  acao_renomear:
    material: NAME_TAG
    nome: "&eRenomear Item"
    lore:
      - "&7Clique para renomear o item"

  acao_lore:
    material: BOOK
    nome: "&eEditar Lore"
    lore:
      - "&7Clique para editar a lore do item"

# Textos para operações
textos:
  renomear: "&eRenomear Item"
  combinar: "&eCombinar Itens"
  encantar: "&eEncantar Item"
