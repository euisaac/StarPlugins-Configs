# ---------------------------------------------------------------------------
#  StarPortal - nomes dos comandos
#
#  Os nomes do plugin.yml continuam valendo sempre (/portal, /portais). O que
#  voce escrever aqui e registrado ALEM deles: o primeiro nome da linha vira o
#  comando e os outros, separados por |, viram apelidos.
#
#  Exemplo:  portal: 'passagem|pt'
#
#  Deixe vazio para nao registrar nada alem do padrao.
# ---------------------------------------------------------------------------

Versao do modelo: 1

comandos:
  portal: ''

  # So o StarPortalArmas usa esta linha.
  portalarma: ''
