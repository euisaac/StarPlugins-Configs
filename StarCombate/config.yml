#
# Plugin criado por Eulsaac.

# Conexao com o banco de dados usado para salvar dados de jogadores (Mito, estatisticas de X1 e arenas).
Database:
  # Tipos disponiveis: SQLITE, MYSQL
  Tipo: SQLITE
  Host: localhost
  Porta: 3306
  Nome: starcombate
  Usuario: root
  Senha: ''
  Debug: false

# Comandos e aliases de cada sistema do plugin. Altere o nome do comando ou
# adicione/remova aliases livremente - use /starcombate reload para aplicar.
Comandos:
  StarCombate:
    Comando: 'starcombate'
    Aliases: [ starcombat ]
  Arena:
    Comando: 'arena'
    Aliases: [ arenas ]
  X1:
    Comando: 'x1'
    Aliases: [ 1vs1, desafio, desafiar ]
  Pvp:
    Comando: 'pvp'
    Aliases: []
  Mito:
    Comando: 'mito'
    Aliases: [ mitos ]
  Oldcombate:
    Comando: 'modopvp'
    Aliases: [ oldcombate, ocm ]

# Mensagens gerais do plugin (nao especificas de um modulo).
Mensagens:
  Sem-permissao: '&cVoce nao possui permissao para isto.'
  Apenas-jogador: '&cEste comando so pode ser executado por um jogador.'
  Jogador-nao-encontrado: '&cEste jogador nao esta online.'
  Comando-invalido: '&cComando invalido. Use /{comando} ajuda para ver os comandos disponiveis.'
  Reload:
    - '&aConfiguracoes do StarCombate recarregadas com sucesso.'
  Help:
    - ''
    - '&b&lSTARCOMBATE'
    - '&f/{comando} reload &8- &7Recarrega as configuracoes do plugin.'
    - '&f/{comando} versao &8- &7Mostra a versao do plugin.'
    - ''
