# Modulo: X1 (1v1)
# Comando configuravel em config.yml (Comandos.X1)

# Formato de exibicao de quantia: LETRA (1.5K, 2M...) ou NUMERO (1.500,00)
Formatacao: 'LETRA'

Opcoes:
  # Tempo (segundos) para o desafio expirar.
  Tempo expirar: 120
  # Tempo (segundos) de preparo antes do PVP ser liberado.
  Tempo pvp: 5
  # Tempo (segundos) para os itens dropados na arena serem recolhidos/limpos apos a luta.
  Tempo recolher: 30
  # Minimo de dinheiro (Vault) necessario para apostar no X1. 0 para desativar o minimo.
  Minimo money: 0.0
  # Comandos permitidos durante um X1.
  Comandos:
    - '/g'
    - '/l'
    - '/tell'
  # Comandos bloqueados enquanto o jogador estiver desafiando/sendo desafiado.
  Comandos desafiando blacklist: []
  # Delay (segundos) para poder desafiar novamente apos um X1.
  Delay desafiar: 60
  # Quantidade de vezes que o Mito pode recusar/ignorar um X1 antes de perder a tag.
  Mito quantia: 3
  # Bloquear o jogador de levar itens do inventario para o camarote (espectador).
  camarote-block-items: true
  # Desativa completamente o sistema de apostas do X1.
  bet-disabled: false

# Sistema de arenas automaticas: em vez de setar pos1/pos2/saida manualmente,
# o plugin cola o schematic configurado em um espaco livre do mundo escolhido
# sempre que um X1 comeca, e libera o espaco novamente ao final da luta.
# Isso permite varios X1 simultaneos sem necessidade de criar arenas manualmente.
Arena automatica:
  Ativar: false
  Mundo: 'world_x1'
  Schematic: 'x1arena'
  # Distancia (blocos) entre cada arena colada na grade do mundo.
  Espacamento: 200
  # Quantidade maxima de X1 simultaneos usando arena automatica.
  Maximo simultaneas: 20
  # Posicoes relativas (x,y,z) a partir da origem onde o schematic e colado.
  Pos1: '5,1,5'
  Pos2: '-5,1,-5'
  Saida: '0,1,20'
  Camarote: '0,15,0'

