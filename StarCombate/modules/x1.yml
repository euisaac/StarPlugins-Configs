  Nao possui: '&cVoce nao possui &f{money} &cde coins.'
  Nao possui outro: '&cO outro jogador nao possui &f{money} &cde coins.'
  Si mesmo: '&cVoce nao pode utilizar esta acao a si mesmo.'
  Ja em x1: '&cVoce ja esta em um X1.'
  Alvo em x1: '&cEste jogador ja esta em um X1.'
  Camarote nao: '&cO camarote nao foi setado.'
  Pos nao: '&cAs posicoes da arena nao foram configuradas corretamente.'
  Setado: '&aLocal &7({local})&a da arena manual de X1 setado com sucesso.'
  Sem arena livre: '&cNao ha nenhuma arena de X1 disponivel no momento. Tente novamente em instantes.'
  Teleportado: '&aVoce foi teleportado.'
