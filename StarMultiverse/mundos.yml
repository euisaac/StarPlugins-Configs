# ---------------------------------------------------------------------------
#  StarMultiverse - mundos registrados
#
#  Este arquivo e escrito pelo plugin (/mv criar, /mv modificar, menu). Pode
#  editar a mao com o servidor desligado; com ele ligado use os comandos.
#
#  Propriedades de cada mundo (todas opcionais; o que faltar usa o padrao):
#    Ambiente: NORMAL | NETHER | END           (como o mundo foi criado)
#    Tipo: NORMAL | PLANO | BIOMAS_GRANDES | AMPLIFICADO
#    Semente: ''                               (vazio = aleatoria na criacao)
#    Gerador: ''                               (VAZIO = gerador interno de mundo vazio,
#                                               ou o nome de um plugin gerador)
#    Estruturas: true
#    Alias: '&aNome bonito'                    (aparece nos menus e mensagens)
#    Icone: 'GRASS_BLOCK'                      (item do menu)
#    Carregar automaticamente: true
#    Escondido: false                          (some da lista para quem nao e staff)
#    Exige permissao: false                    (starmultiverse.acesso.<mundo>)
#    PvP: true
#    Dificuldade: PACIFICO | FACIL | NORMAL | DIFICIL
#    Modo de jogo: ''                          (SOBREVIVENCIA | CRIATIVO | AVENTURA | ESPECTADOR; vazio nao forca)
#    Voo: ''                                   (true | false; vazio nao mexe)
#    Monstros: true
#    Animais: true
#    Fome: true
#    Cura automatica: true
#    Tempo: LIVRE                              (LIVRE | DIA | MEIO_DIA | TARDE | NOITE | MEIA_NOITE | <ticks>)
#    Clima: LIVRE                              (LIVRE | LIMPO | CHUVA | TEMPESTADE)
#    Manter spawn na memoria: true
#    Mundo de respawn: ''
#    Respawn na cama: true
#    Limite de jogadores: -1                   (-1 = sem limite)
#    Taxa de entrada: 0                        (dinheiro do Vault cobrado ao entrar)
#    Descarregar quando vazio: 0               (minutos sem ninguem; 0 = nunca)
#    Mensagem de entrada: ''
#    Nether: ''                                (mundo para onde o portal do nether leva)
#    End: ''                                   (mundo para onde o portal do end leva)
#    Spawn: ''                                 (x;y;z;yaw;pitch, escrito pelo /mv definirspawn)
# ---------------------------------------------------------------------------

Mundos: {}
