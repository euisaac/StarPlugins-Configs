Assistente:
  Pedir nome: |-
    &b&lASSISTENTE DE MUNDOS
    &7Digite no chat o &fnome &7do novo mundo (letras, numeros, - e _).
    &7Digite &ccancelar &7para desistir.
  Pedir semente: |-
    &7Agora digite a &fsemente &7do mundo, ou &fpular &7para uma aleatoria.
    &7Digite &ccancelar &7para desistir.
  Cancelado: '&7Assistente cancelado.'
  Expirado: '&cO assistente expirou por falta de resposta.'
  Nome em uso: '&cJa existe um mundo (ou pasta) chamado &f{mundo}&c. Digite outro nome.'
  Nome invalido: '&cNome invalido. Use letras, numeros, - e _ (ate 32 caracteres).'
  Escolher ambiente: '&7Agora escolha o ambiente e o modelo no menu.'

Quem:
  Cabecalho: '&b&lQUEM ESTA ONDE &7({total} online)'
  Linha: ' {alias} &8(&f{quantidade}&8): &7{jogadores}'
  Vazio: ' {alias} &8(&f0&8): &8ninguem'

Lista:
  Cabecalho: '&b&lMUNDOS &7({carregados} carregados de {total})'
  Linha: ' &8- {alias} &8(&7{mundo}&8) {ambiente} &8| {estado} &8| &f{jogadores} &7jogador(es) {escondido}'
  Vazia: '&7Nenhum mundo registrado. Use &f/{comando} criar <nome> <ambiente>&7.'

