  Recarregado: '&aConfiguracoes recarregadas. &7{mundos} mundos registrados.'
  Mundo desconhecido: '&cO mundo &f{mundo} &cnao esta registrado. Use &f/{comando} lista&c.'
  Mundo nao carregado: '&cO mundo &f{mundo} &cesta descarregado. Use &f/{comando} carregar {mundo}&c.'
