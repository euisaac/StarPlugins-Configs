# ---------------------------------------------------------------------------
#  StarMultiverse - mensagens
#
#  Mensagem em branco nao e enviada: e assim que voce desliga um aviso sem
#  precisar de uma opcao no config. Em quase todas valem {mundo} e {alias}.
# ---------------------------------------------------------------------------
Versao do modelo: 1

Prefixo: '&b&lMULTIVERSE &8> &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
