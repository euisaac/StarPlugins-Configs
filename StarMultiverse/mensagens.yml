  &7Monstros: {monstros} &8| &7Animais: {animais} &8| &7Fome: {fome} &8| &7Cura: {cura}
  &7Tempo: {tempo} &8| &7Clima: {clima} &8| &7Spawn na memoria: {memoria}
  &7Respawn: {respawn} &8| &7Cama: {cama} &8| &7Taxa: &f{taxa} &8| &7Descarrega vazio: &f{descarregar}
  &7Nether: {nether} &8| &7End: {end} &8| &7Escondido: {escondido} &8| &7Exige permissao: {permissao}
  &7Spawn: &f{spawn}
  &7Pasta: &f{tamanho}

Verificar:
  Cabecalho: '&b&lDIAGNOSTICO DOS MUNDOS'
  Ok: '&aNenhum problema encontrado.'
  Nao carregado: ' &e! &f{mundo} &7esta registrado com carregamento automatico mas nao esta carregado.'
  Pasta faltando: ' &c! &f{mundo} &7esta registrado mas a pasta nao existe no servidor.'
  Gerador faltando: ' &c! &f{mundo} &7usa o gerador &f{gerador}&7, que nao esta instalado.'
  Pasta sem registro: ' &e! &7A pasta &f{pasta} &7parece um mundo e nao esta registrada. Use &f/{comando} importar {pasta} <ambiente>&7.'
  Spawn inseguro: ' &e! &7O spawn de &f{mundo} &7nao e seguro (o bloco de apoio sera usado).'
  Respawn invalido: ' &c! &f{mundo} &7aponta o respawn para &f{respawn}&7, que nao existe.'
  Portal invalido: ' &c! &f{mundo} &7aponta o portal para &f{destino}&7, que nao existe.'
  Taxa sem vault: ' &e! &f{mundo} &7cobra taxa de entrada mas nao ha economia (Vault) instalada.'
  Rodape: '&7{problemas} problema(s) encontrado(s).'

Historico:
  Cabecalho: '&b&lHISTORICO &7(ultimas {quantidade} acoes)'
  Linha: ' &8{data} &7{autor}: &f{acao}'
  Vazio: '&7Nenhuma acao registrada ainda.'

Ajuda:
  Jogador: |-
    &b&lMULTIVERSE
    &f/{comando} &7abre o menu de mundos
    &f/{comando} lista &7lista os mundos
    &f/{comando} info <mundo> &7detalhes de um mundo
    &f/{comando} tp <mundo> &7vai para um mundo
    &f/{comando} spawn &7vai para o spawn do mundo atual
    &f/{comando} quem &7mostra quem esta em cada mundo
  Admin: |-
    &b&lMULTIVERSE &7- staff
    &f/{comando} criar <nome> <normal|nether|end|vazio|plano> [-s semente] [-g gerador] [-t tipo] [-m modelo] [-e false]
    &f/{comando} importar <pasta> <ambiente> [-g gerador] &7registra um mundo que ja existe
    &f/{comando} carregar|descarregar <mundo>
    &f/{comando} remover <mundo> &7tira do registro (mantem a pasta)
    &f/{comando} deletar <mundo> &7manda para a lixeira
    &f/{comando} clonar <origem> <novo>
    &f/{comando} regenerar <mundo> [-s semente|aleatoria]
    &f/{comando} backup <mundo> [lista] &8| &f/{comando} restaurar <mundo> [backup]
    &f/{comando} lixeira [restaurar <pasta> | esvaziar]
    &f/{comando} tp [jogador] <mundo> &8| &f/{comando} definirspawn
    &f/{comando} modificar <mundo> <propriedade> <valor> &8| &f/{comando} propriedades
    &f/{comando} ancora definir|ir|remover|lista [nome]
    &f/{comando} limpar <mundo> [monstros|animais|itens|todos]
    &f/{comando} salvar [mundo] &8| &f/{comando} verificar &8| &f/{comando} historico [n]
    &f/{comando} recarregar
