  &b&lMUNDO {alias} &8(&7{mundo}&8)
  &7Estado: {estado} &8| &7Ambiente: {ambiente} &8| &7Tipo: &f{tipo}
  &7Semente: &f{semente} &8| &7Gerador: &f{gerador} &8| &7Estruturas: {estruturas}
  &7Jogadores: &f{jogadores}&7/{limite} &8| &7Entidades: &f{entidades} &8| &7Chunks: &f{chunks}
