# ---------------------------------------------------------------------------
#  StarMultiverse - nomes de comando
#
#  Os comandos base ja vem do plugin.yml (/starmultiverse com as aliases mv,
#  multiverso e smv, e /mvtp). Aqui voce cria nomes ALEM daqueles, separados
#  por | (o primeiro vira o comando, os outros viram aliases). Deixe em branco
#  para nao criar nenhum.
#
#  Nos subcomandos, cada chave a esquerda e fixa (o codigo usa ela) e a lista a
#  direita e o que o jogador digita. Apagar a linha desliga o subcomando.
# ---------------------------------------------------------------------------
Versao do modelo: 1

comandos:
  starmultiverse: ''
  mvtp: ''

subcomandos:
  menu: 'menu|gui'
  lista: 'lista|list|mundos'
  info: 'info|ver|detalhes'
  quem: 'quem|who|jogadores'
  tp: 'tp|ir|teleportar'
  spawn: 'spawn'
  definirspawn: 'definirspawn|setspawn|spawnaqui'
  criar: 'criar|create|novo'
  importar: 'importar|import'
  carregar: 'carregar|load'
  descarregar: 'descarregar|unload'
  remover: 'remover|remove|esquecer'
  deletar: 'deletar|delete|apagar|excluir'
  clonar: 'clonar|clone|copiar'
  regenerar: 'regenerar|regen'
  backup: 'backup|copia'
  restaurar: 'restaurar|restore'
  lixeira: 'lixeira|trash'
  modificar: 'modificar|set|definir|mudar'
  propriedades: 'propriedades|props|opcoes'
  ancora: 'ancora|ancoras|anchor'
  limpar: 'limpar|purge|purgar'
  salvar: 'salvar|save'
  confirmar: 'confirmar|confirm|sim'
  cancelar: 'cancelar|cancel|nao'
  verificar: 'verificar|check|diagnostico'
  historico: 'historico|log|registro'
  recarregar: 'recarregar|reload'
  ajuda: 'ajuda|help|?'
