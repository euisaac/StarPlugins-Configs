    Voo:
      Slot: 14
      Material: 'FEATHER'
      Nome: '&fVoo: {valor}'
      Lore:
        - '&eClique &7para mudar.'
    Monstros:
      Slot: 15
      Material: 'ROTTEN_FLESH'
      Nome: '&fMonstros: {valor}'
      Lore:
        - '&eClique &7para alternar.'
    Animais:
      Slot: 16
      Material: 'PORKCHOP'
      Nome: '&fAnimais: {valor}'
      Lore:
        - '&eClique &7para alternar.'
    Fome:
      Slot: 19
      Material: 'BREAD'
      Nome: '&fFome: {valor}'
      Lore:
        - '&eClique &7para alternar.'
    Cura automatica:
      Slot: 20
      Material: 'GOLDEN_APPLE'
      Nome: '&fCura automatica: {valor}'
      Lore:
        - '&eClique &7para alternar.'
    Tempo:
      Slot: 21
      Material: 'CLOCK'
      Nome: '&fTempo: {valor}'
      Lore:
        - '&eClique &7para mudar.'
    Clima:
      Slot: 22
      Material: 'WATER_BUCKET'
      Nome: '&fClima: {valor}'
      Lore:
        - '&eClique &7para mudar.'
    Spawn na memoria:
      Slot: 23
      Material: 'BOOK'
      Nome: '&fSpawn na memoria: {valor}'
      Lore:
        - '&eClique &7para alternar.'
    Respawn na cama:
      Slot: 24
      Material: 'RED_BED'
      Nome: '&fRespawn na cama: {valor}'
      Lore:
        - '&eClique &7para alternar.'
    Escondido:
      Slot: 25
      Material: 'ENDER_EYE'
      Nome: '&fEscondido: {valor}'
      Lore:
        - '&7Some da lista para quem nao e staff.'
        - '&eClique &7para alternar.'
    Exige permissao:
      Slot: 28
      Material: 'TRIPWIRE_HOOK'
      Nome: '&fExige permissao: {valor}'
      Lore:
        - '&7So entra quem tem'
        - '&fstarmultiverse.acesso.{mundo}'
        - '&eClique &7para alternar.'
    Carregar:
      Slot: 37
      Material: 'LIME_DYE'
      Nome: '&aCarregar mundo'
    Descarregar:
      Slot: 37
      Material: 'GRAY_DYE'
      Nome: '&cDescarregar mundo'
      Lore:
        - '&7Os jogadores dentro dele vao para'
        - '&7o mundo de retorno.'
    Salvar:
      Slot: 38
      Material: 'WRITABLE_BOOK'
      Nome: '&eSalvar mundo'
    Limpar:
      Slot: 39
      Material: 'LAVA_BUCKET'
      Nome: '&6Limpar entidades'
      Lore:
        - '&7Monstros, animais, itens no chao'
        - '&7e orbes de experiencia.'
        - ''
        - '&eClique &7para abrir.'
    Backup:
      Slot: 40
      Material: 'CHEST'
      Nome: '&bFazer backup'
      Lore:
        - '&7Copia a pasta do mundo para'
        - '&7plugins/StarMultiverse/backups.'
    Info:
      Slot: 41
      Material: 'PAPER'
      Nome: '&fInformacoes'
      Lore:
        - '&7Mostra tudo no chat.'
    Deletar:
      Slot: 43
      Material: 'TNT'
      Nome: '&4Deletar mundo'
      Lore:
        - '&7Descarrega e manda a pasta para a'
        - '&7lixeira (da para restaurar depois).'
        - ''
        - '&cPede confirmacao no chat.'
    Voltar:
      Slot: 49
      Material: 'ARROW'
      Nome: '&eVoltar'

Limpar:
