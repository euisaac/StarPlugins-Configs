# ---------------------------------------------------------------------------
#  StarMultiverse - menus
#
#  Slot -1 esconde o item: e assim que voce tira um botao do menu sem precisar
#  de uma opcao "Ativar" para cada um.
#
#  Placeholders da lista de mundos: {mundo}, {alias}, {ambiente}, {estado},
#  {jogadores}, {limite}, {dificuldade}, {modo}, {pvp}, {tempo}, {clima}.
#  Nos botoes de propriedade vale {valor}.
# ---------------------------------------------------------------------------
Versao do modelo: 2

Mundos:
  Titulo: '&8Mundos &7({pagina}/{paginas})'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '
  # Slots onde os mundos sao listados, na ordem.
  Slots dos mundos: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]
  Mundo:
    # O material vem do icone do mundo (propriedade "icone"); estes sao os
    # padroes por ambiente quando o mundo nao tem icone proprio.
    Icones:
      NORMAL: 'GRASS_BLOCK'
      NETHER: 'NETHERRACK'
      THE_END: 'END_STONE'
      VAZIO: 'GLASS'
      PLANO: 'SANDSTONE'
      DESCARREGADO: 'BARRIER'
    Nome: '{alias} &8({mundo})'
    Lore:
      - '&7Ambiente: {ambiente}'
      - '&7Estado: {estado}'
      - '&7Jogadores: &f{jogadores}&7/{limite}'
      - '&7Dificuldade: {dificuldade} &8| &7PvP: {pvp}'
      - '&7Tempo: {tempo} &8| &7Clima: {clima}'
      - ''
      - '&eClique &7para ir ate ele.'
    Lore admin:
      - '&eClique direito &7para gerenciar.'
      - '&eShift + clique &7para ver quem esta la.'
  Itens:
    Anterior:
      Slot: 45
      Material: 'ARROW'
      Nome: '&ePagina anterior'
    Proximo:
      Slot: 53
      Material: 'ARROW'
      Nome: '&eProxima pagina'
    Criar:
      Slot: 49
      Material: 'NETHER_STAR'
      Nome: '&aCriar um mundo'
      Lore:
        - '&7Abre o assistente: voce digita o'
        - '&7nome no chat e escolhe o ambiente'
        - '&7e o modelo aqui no menu.'
    Quem:
      Slot: 47
      Material: 'PLAYER_HEAD'
      Nome: '&bQuem esta onde'
      Lore:
        - '&7Mostra no chat os jogadores de'
        - '&7cada mundo.'
    Ancoras:
      Slot: 51
      Material: 'COMPASS'
      Nome: '&dAncoras'
      Lore:
        - '&7Pontos salvos pela staff.'
    Fechar:
      Slot: 48
      Material: 'RED_DYE'
      Nome: '&cFechar'

Ancoras:
  Titulo: '&8Ancoras'
  Linhas: 4
  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '
  Slots das ancoras: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25 ]
  Ancora:
    Material: 'ENDER_PEARL'
    Nome: '&d{ancora}'
    Lore:
      - '&7Mundo: {alias}'
      - '&7Posicao: &f{x}, {y}, {z}'
      - ''
      - '&eClique &7para ir ate ela.'
      - '&eShift + clique direito &7para remover.'
  Itens:
    Voltar:
      Slot: 31
      Material: 'ARROW'
      Nome: '&eVoltar'

Mundo:
