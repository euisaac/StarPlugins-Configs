      Slot: 4
      Material: 'ENDER_PEARL'
      Nome: '&aIr para {alias}'
      Lore:
        - '&7Estado: {estado}'
        - '&7Jogadores: &f{jogadores}'
        - ''
        - '&eClique &7para ir ate o spawn.'
    Spawn aqui:
      Slot: 10
      Material: 'BEACON'
      Nome: '&bDefinir spawn aqui'
      Lore:
        - '&7O spawn do mundo passa a ser'
        - '&7onde voce esta agora.'
        - '&8(voce precisa estar nele)'
    PvP:
