  Linhas: 4
  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '
  # Em cada botao, {quantidade} e quanto existe no mundo AGORA. Se voce apagar
  # a lista Lore, o plugin escreve a contagem sozinho.
  Itens:
    Monstros:
      Slot: 10
      Material: 'ROTTEN_FLESH'
      Nome: '&cMonstros'
      Lore:
        - '&7Zumbi, esqueleto, creeper, slime,'
        - '&7ghast, dragao e companhia.'
        - ''
        - '&7No mundo agora: &f{quantidade}'
        - ''
        - '&eClique &7para remover.'
    Animais:
      Slot: 12
      Material: 'PORKCHOP'
      Nome: '&aAnimais e mobs pacificos'
      Lore:
        - '&7Animais, peixes, lula, morcego,'
        - '&7aldeao, golem e afins.'
        - ''
        - '&7No mundo agora: &f{quantidade}'
        - ''
        - '&eClique &7para remover.'
    Itens:
      Slot: 14
      Material: 'CHEST'
      Nome: '&eItens no chao'
      Lore:
        - '&7So o que esta jogado no chao.'
        - ''
        - '&7No mundo agora: &f{quantidade}'
        - ''
        - '&eClique &7para remover.'
    XP:
      Slot: 16
      Material: 'EXPERIENCE_BOTTLE'
      Nome: '&bOrbes de experiencia'
      Lore:
        - '&7As bolinhas de XP no chao.'
        - ''
        - '&7No mundo agora: &f{quantidade}'
        - ''
        - '&eClique &7para remover.'
    Todos:
      Slot: 22
      Material: 'LAVA_BUCKET'
      Nome: '&6Limpar tudo'
      Lore:
        - '&7Todos os grupos de uma vez, mais'
        - '&7flechas e afins. Suportes de'
        - '&7armadura e veiculos ficam.'
        - ''
        - '&7No mundo agora: &f{quantidade}'
        - ''
        - '&eClique &7para remover.'
    Voltar:
      Slot: 31
      Material: 'ARROW'
      Nome: '&eVoltar'

