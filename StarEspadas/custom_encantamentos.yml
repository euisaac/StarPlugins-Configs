# ---------------------------------------------------------------------------
#  StarEspadas - encantamentos criados pelo servidor
#
#  Mesmo formato do encantamentos.yml; os dois arquivos sao lidos juntos.
#  Uma chave repetida nos dois vale a do encantamentos.yml.
#  Os exemplos abaixo mostram os tipos que ficaram de fora do arquivo principal.
# ---------------------------------------------------------------------------
Versao do modelo: 1

Encantamentos:
  chama:
    Tipo: CHAMA
    Nome: 'Chama Viva'
    Padrao: 0
    Maximo: 5
    Bonus por nivel: 10.0
    # Segundos de fogo por nivel.
    Segundos: 2
    Permissao: ''
    Slot: 28
    Precos padrao:
      dinheiro: 10000
    Precos por nivel:
      dinheiro: 5000
    Icone:
      Pode evoluir:
        Material: BLAZE_POWDER
        Nome: '&a{nome}'
        Lore:
          - '&7Chance de incendiar o alvo'
          - '&7a cada golpe.'
          - ''
          - '&f > Nivel: &b{nivel}&f/&b{maximo}'
          - '&f > Chance atual: &b{bonus}%'
          - '&f > Proximo nivel: &b{proximo_bonus}%'
          - ''
          - '&f > Custo: &a{preco}'
          - ''
          - '&aClique para evoluir.'
      Nao pode evoluir:
        Material: BLAZE_POWDER
        Nome: '&c{nome}'
        Lore:
          - '&7Chance de incendiar o alvo'
          - '&7a cada golpe.'
          - ''
          - '&f > Nivel: &b{nivel}&f/&b{maximo}'
          - '&f > Chance atual: &b{bonus}%'
          - '&f > Proximo nivel: &b{proximo_bonus}%'
          - ''
          - '&f > Custo: &a{preco}'
          - ''
          - '&cVoce nao tem o suficiente.'
      Maximo:
        Material: BLAZE_POWDER
        Nome: '&6{nome}'
        Lore:
          - '&7Chance de incendiar o alvo'
          - '&7a cada golpe.'
          - ''
          - '&f > Nivel: &b{nivel}&f/&b{maximo}'
          - '&f > Chance atual: &b{bonus}%'
          - ''
          - '&6Nivel maximo.'

