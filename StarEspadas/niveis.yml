# ---------------------------------------------------------------------------
#  StarEspadas - niveis da espada
#
#  A espada sobe de nivel com os abates que ela mesma fez. O nivel nao fica
#  gravado no item, so os abates: mexer nesta tabela vale para as espadas que
#  ja estao no mundo.
#
#  Cada nivel diz quantos abates acumulados exige e o que da:
#    Bonus de pilhagem     % somado ao multiplicador de drops
#    Bonus de recompensa   % somado ao dinheiro dos abates
#    Comandos              rodam pelo console ao chegar no nivel ({jogador} {nivel})
#
#  O nivel 1 e o inicial (0 abates). Crie quantos quiser.
# ---------------------------------------------------------------------------
