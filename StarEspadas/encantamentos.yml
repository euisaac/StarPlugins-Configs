# ---------------------------------------------------------------------------
#  StarEspadas - encantamentos pagos
#
#  Sao evoluidos pelo menu (shift + botao direito com a espada, ou /espadas
#  evoluir) e pagos com as economias do economias.yml. Cada nivel custa
#  "Precos padrao" + "Precos por nivel" x nivel atual.
#
#  Tipos disponiveis (Tipo:):
#    SORTE             +Bonus% de drops por nivel, em todo mob
#    SORTE_CHEFE       +Bonus% de drops por nivel, so nos mobs com Chefe: true (mobs.yml)
#    RECOMPENSA_DUPLA  Bonus% de chance por nivel de dobrar o dinheiro do abate
#    ACUMULO           Bonus% de chance por nivel de os drops irem direto ao inventario
#    EXPERIENCIA       +Bonus% de experiencia do mob por nivel
#    VAMPIRISMO        Bonus% de chance por nivel de curar "Cura" de vida ao abater
#    CHAMA             Bonus% de chance por nivel de incendiar o alvo por "Segundos"
#    VELOCIDADE        Bonus% de chance por nivel de ganhar Velocidade ao abater
#    CABECA            Bonus% de chance por nivel de o mob soltar a propria cabeca
#    RAIO              Bonus% de chance por nivel de um raio (so visual) cair no abate
#    COMANDO           Bonus% de chance por nivel de rodar os "Comandos" no abate
#
#  Placeholders dos icones: {nome} {nivel} {maximo} {bonus} {proximo_bonus} {preco}
#  Maximo -1 = sem limite. Slot e a posicao no menu de evolucao.
#
#  Os encantamentos que voce criar podem ficar no custom_encantamentos.yml,
#  que e lido junto com este.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "Textura"):
#       Dono: 'Notch'
#
# Com "Textura" ou "Dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "Textura".
#
# A cabeca por "Dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "Textura".
# ---------------------------------------------------------------------------

