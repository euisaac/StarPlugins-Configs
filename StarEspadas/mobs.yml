# ---------------------------------------------------------------------------
#  StarEspadas - mobs
#
#  O que cada mob rende quando morre pela espada de farm. A chave e o tipo da
#  entidade (ZOMBIE, SKELETON, ENDER_DRAGON...). Mob que nao esta na lista
#  usa o "Padrao". Um mob com nome customizado pode ter uma regra propria em
#  "Por nome" (o nome e comparado sem cores).
#
#  Campos:
#    Nome                 como o mob aparece nas mensagens
#    Chefe                true = vale o encantamento Cacador de Chefes
#    Multiplicar drops    false = a pilhagem nao mexe nos drops dele
#    Abates               quantos abates o mob vale (para o nivel e o top)
#    Experiencia extra    experiencia somada a que o mob ja solta
#    Recompensas          economia: valor, pago a cada abate
#    Comandos             rodam pelo console a cada abate ({jogador} {mob})
# ---------------------------------------------------------------------------
Versao do modelo: 1

Padrao:
  Nome: '{tipo}'
  Chefe: false
  Multiplicar drops: true
  Abates: 1
  Experiencia extra: 0
  Recompensas:
    dinheiro: 2.0
  Comandos: []

# Mobs que a espada ignora por completo: nao rendem nada e nao contam abate.
Ignorados:
  - 'ARMOR_STAND'
  - 'VILLAGER'
  - 'WANDERING_TRADER'
  - 'ITEM_FRAME'
  - 'PAINTING'
  - 'PLAYER'

