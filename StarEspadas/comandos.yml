# ---------------------------------------------------------------------------
#  StarEspadas - nomes de comando
#
#  Os comandos base ja vem do plugin.yml. Aqui voce cria nomes ALEM daqueles,
#  separados por | (o primeiro vira o comando, os outros viram aliases).
#  Deixe em branco para nao criar nenhum.
#
#  Nos subcomandos, cada chave a esquerda e fixa (o codigo usa ela) e a lista a
#  direita e o que o jogador digita. Apagar a linha desliga o subcomando -- e
#  assim que voce deixa um recurso so pelo menu.
# ---------------------------------------------------------------------------
Versao do modelo: 1

comandos:
  espadas: ''
  starespadas: ''

subcomandos:
  evoluir: 'evoluir|encantar|encantamentos'
  espadas: 'espadas|lista|loja'
  top: 'top|ranking|rank'
  perfil: 'perfil|stats|status'
  info: 'info|espada|ver'
  ajuda: 'ajuda|help|?'

subcomandos admin:
  recarregar: 'recarregar|reload'
  dar: 'dar|give|entregar'
  darlivro: 'darlivro|livro|givebook'
  setar: 'setar|set|definir'
  encantar: 'encantar|encantamento|enchant'
  ver: 'ver|perfil'
  info: 'info|status'
