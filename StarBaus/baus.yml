# ---------------------------------------------------------------------------
#  StarBaus - os tipos de bau do servidor
#
#  Cada tipo e um molde. Os baus colocados no mundo guardam so o identificador
#  do tipo, entao mexer aqui muda todos eles de uma vez -- inclusive os que ja
#  estao no chao.
#
#  A forma facil de mexer nisto e o &e/starbaus editor&r: ele escreve neste
#  mesmo arquivo, com o item guardado exatamente como esta na sua mao.
#
#  Especie:
#    NORMAL   - varias paginas de armazenamento.
#    ESTOQUE  - um unico item, em quantidade muito maior que uma pilha.
#    LIGADO   - todos os baus deste tipo do mesmo dono mostram o mesmo conteudo.
#
#  Recursos (nome que aparece na permissao e na lista do editor):
#    succao, coleta-mobs, coleta-blocos, colheita, auto-venda, auto-fundicao,
#    auto-compactacao, auto-craft, filtro, organizacao, ima-de-xp, vinculo,
#    notificacao, holograma, convidados, acesso-remoto, busca, estatisticas
# ---------------------------------------------------------------------------

