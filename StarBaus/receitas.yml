# ---------------------------------------------------------------------------
#  StarBaus - as transformacoes automaticas
#
#  As tres listas fazem a mesma conta: "tantos de um material viram tantos de
#  outro". O que muda e qual recurso do bau usa cada uma.
#
#    Fundicao      -> recurso auto-fundicao
#    Compactacao   -> recurso auto-compactacao
#    Montagem      -> recurso auto-craft
#
#  Item com nome, lore ou encantamento NUNCA e transformado: ele quase sempre e
#  um item especial de outro plugin, e virar lingote seria destruir o que o
#  jogador tinha de mais raro.
#
#  Nome de material que nao existe na versao do servidor e ignorado em silencio,
#  entao da para deixar aqui as receitas das versoes novas e das antigas juntas.
# ---------------------------------------------------------------------------

