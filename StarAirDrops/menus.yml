    Nome: '&aTop coletas'
  Vitorias:
    Slot: 40
    Material: 'DIAMOND'
    Nome: '&bTop vitorias'
  Premios:
    Slot: 42
    Material: 'GOLD_INGOT'
    Nome: '&6Top premios'
  Voltar:
    Slot: 36
    Material: 'BARRIER'
    Nome: '&cVoltar'

# O painel de acesso do tipo CLIQUE.
