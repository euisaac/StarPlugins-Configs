  Linhas: 3
  Fundo:
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: '&8...'
  Alvo:
    Material: 'LIME_STAINED_GLASS_PANE'
    Nome: '&a&lCLIQUE!'
    Lore:
      - ''
      - ' &7Acertos: &a{acertos}&7/&a{total}'
      - ''
