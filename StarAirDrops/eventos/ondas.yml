# AirDrop de Ondas: mobs nascem em volta ate a ultima onda ser limpa.
# Os campos sao os mesmos de comum.yml, que traz a explicacao de cada um.
#
# A ordem das ondas e a ordem em que elas aparecem aqui. Atraso e o tempo, em
# segundos, entre a onda anterior ser limpa e esta comecar.

Nome: '&dAirDrop de Ondas'
Descricao: 'Sobreviva as ondas de mobs para abrir a caixa.'
Tipo: ONDAS
Ativado: true
Peso: 8
Raridade: SORTEADA

Anunciar: true
Anunciar local: true
Secreto: false
Permissao: ''

Expira em: 1200
Captura em: 3
Tranca: 5
Coletas: 3

Animacao: METEORO
Altura: 55
Velocidade: 1.0
Raio ao cair: false
Explosao ao cair: true

Mundos: []
Comandos ao cair: []
Comandos ao abrir: []

Caixa:
  Material: CHEST
  Modelo: 0
  Deslocamento do holograma:
    X: 0.0
    Y: 1.6
    Z: 0.0
  Holograma:
    - '&d&lAIRDROP DE ONDAS{temporada}'
    - '&7Raridade: {raridade}'
    - '&7Onda &e{onda}&7/&e{ondas} &8- &f{mobs} &7mob(s)'
    - '&7Estado: {estado}'

