# ==========================================================================
#  StarAirDrops - textos
#
#  Mensagem vazia ('') simplesmente nao e enviada: e assim que se desliga um
#  aviso sem precisar de uma opcao "Ativar" para cada um.
#
#  {prefixo} nos anuncios publicos e o prefixo da temporada em vigor.
# ==========================================================================

Versao do modelo: 1

Prefixo: '&6&lAIRDROP &8» &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  So jogador: '&cEste comando so funciona dentro do jogo.'
  Jogador offline: '&cO jogador &f{jogador} &cnao esta online.'
  Carregando: '&cOs dados ainda estao carregando; tente de novo em instantes.'
  Sem temporada: '&7Nenhuma'
  Desconhecido: '&7???'

# Os estados de um airdrop, usados no holograma, no menu e nas mensagens.
Estados:
  Caindo: '&eCaindo'
  Trancado: '&cTrancado'
  Chefe: '&5Chefe vivo'
  Ondas: '&dEm combate'
  No chao: '&aLiberado'
  Aberto: '&bAberto'
  Expirado: '&7Expirado'

AirDrop:
  Anuncio: '{prefixo}&eUm &f{evento} &e({raridade}&e) esta descendo!'
  Anuncio com local: '{prefixo}&eUm &f{evento} &e({raridade}&e) esta descendo em &f{mundo} &7{x}, {y}, {z}&e!'
  Anuncio secreto: '{prefixo}&8Algo caiu em algum lugar do mapa... procure.'
  Titulo: '&6&lAIRDROP<nl>&f{evento} &7- {raridade}'
  Aterrissou: '{prefixo}&aO &f{evento} &atocou o chao! Corra ate ele.'
  Expirou: '{prefixo}&7O &f{evento} &7#{id} expirou sem ninguem coletar.'
  Descoberto: '&6Voce achou um airdrop secreto: &f{evento}&6!'
  Aviso: '{prefixo}&eUm airdrop cai em &f{segundos} &esegundos.'
  Secreto no menu: '&cVoce ainda nao descobriu onde este airdrop caiu.'
  Chuva comecou: '{prefixo}&6Chuva de &f{evento} &6em &f{mundo} &6por &f{minutos} &6minuto(s)!'
  Chuva terminou: '{prefixo}&7A chuva de &f{evento} &7acabou.'

Coleta:
  Capturando: '&eSegurando o &f{evento}&e... fique perto por &f{segundos}s&e.'
  Barra: '&7[{barra}&7] &f{porcento}%'
  Captura cancelada: '&cA captura foi interrompida.'
  Longe demais: '&cChegue mais perto da caixa.'
  Sumiu: '&cEste airdrop nao existe mais.'
  Ja coletou: '&cVoce ja coletou este airdrop.'
  Trancada: '&cA caixa esta {estado}&c. Faltam &f{mobs} &cmob(s) e &f{tranca}s&c.'
  Em combate: '&cVoce esta em combate; espere para coletar.'
  Carregando: '&cSeus dados ainda estao carregando; tente de novo em instantes.'
  Inventario cheio: '&cLibere espaco no inventario para coletar este airdrop.'
  Ganhou: '&aVoce recebeu: &f{premios}'
  Coletou: '&aVoce coletou o &f{evento} &a({raridade}&a).'
  Primeiro: '&6Voce foi o primeiro a abrir o &f{evento}&6!'
  Ajudou: '&aVoce ajudou e recebeu: &f{premios}'
  Anuncio: '{prefixo}&f{jogador} &eabriu o &f{evento} &e({raridade}&e) e levou &f{premios}&e!'
  Entrou na zona: '&cVoce entrou na zona de combate do &f{evento} &c({raio} blocos).'

Requisitos:
  Sem permissao: '&cVoce nao tem acesso a este airdrop.'
  Sem chave: '&cVoce precisa da chave do &f{evento} &cpara abrir.'
  Sem item: '&cVoce precisa de &f{item} &cno inventario.'
  Sem nivel: '&cVoce precisa do nivel &f{nivel}&c.'
  Sem dinheiro: '&cVoce precisa de &f{valor} {moeda}&c.'
  Sem missao: '&cVoce precisa concluir a missao &f{missao} &cantes.'
  Cooperativo: '&cE preciso ter &f{jogadores} &cjogadores em &f{raio} &cblocos para abrir.'
  Digite a senha: '&eDigite a senha da caixa no chat.'
  Senha errada: '&cSenha errada.'

Hackeamento:
  Titulo: '&6&lPAINEL DE ACESSO<nl>&f{codigo}'
  Digite: '&eDigite &f{codigo} &eno chat em ate &f{segundos}s&e.'
  Acertou: '&aAcesso liberado!'
  Falhou: '&cAcesso negado. Tente de novo.'

Chefe:
  Barra: '&5{nome} &8[{barra}&8] &f{vida}&7/&f{maxima}'
  Derrotado: '&aVoce derrotou o chefe do &f{evento}&a!'

Ondas:
  Comecou: '&dOnda &f{onda}&7/&f{total} &d- &f{mobs} &dmob(s)!'

Radar:
  Apontando: '&6{evento} &7- &f{distancia}m &7- {estado}'
  Nenhum: '&7Nenhum airdrop por perto.'
  Nenhum curto: '&7-'
  Nenhum aviso: '&cNao ha nenhum airdrop no seu mundo agora.'
  Apontado: '&aA bussola aponta para o &f{evento}&a.'
  Recebido: '&aVoce recebeu o radar de airdrop.'
  Sem dinheiro: '&cVoce precisa de &f{valor} {moeda} &cpara pegar o radar.'
  Gratis: '&agratis'

Missoes:
  Concluida: '&aMissao concluida: &f{missao} &a- {premios}'
  Anuncio: '{prefixo}&f{jogador} &econcluiu a missao &f{missao}&e!'
  Estados:
    Concluida: '&aConcluida'
    Em andamento: '&eEm andamento'
    Nao comecada: '&7Nao comecada'
    Carregando: '&7Carregando...'

Ranking:
  Vazio: '&7-'
  Colunas:
    coletas: '&aColetas'
    vitorias: '&bVitorias'
    premios: '&6Premios'

Estatisticas:
  Linhas: |
    &8&m--------------------------------
    &6&lAIRDROPS &7- &f{jogador}
    &7Coletas: &f{coletas}
    &7Vitorias: &f{vitorias}
    &7Premios: &f{premios}
    &7Melhor tempo: &f{tempo}
    &8&m--------------------------------

Sinalizador:
  Chamado: '&aUm &f{evento} &avem ai em &f{segundos}s&a. Saia de perto!'
  Espere: '&cEspere &f{segundos}s &cpara usar outro sinalizador.'
  Cheio: '&cJa ha airdrops demais no ar; tente daqui a pouco.'
  Evento sumiu: '&cO evento &f{id} &cnao existe mais.'
  Falhou: '&cNao foi possivel chamar o airdrop aqui.'

Protecao:
  Nao pode quebrar: '&cA caixa do airdrop nao pode ser quebrada.'

Entrada:
  Como cancelar: '&7Digite &fcancelar &7para desistir.'
  Cancelado: '&cCancelado.'
  Tempo esgotado: '&cO tempo para responder acabou.'

Admin:
  Recarregado: '&aStarAirDrops recarregado.'
  Uso iniciar: '&cUse: /starairdrops iniciar <evento> [mundo]'
  Uso aqui: '&cUse: /starairdrops aqui <evento>'
  Uso parar: '&cUse: /starairdrops parar <id|todos>'
  Uso chuva: '&cUse: /starairdrops chuva <evento> <minutos> [intervalo] [mundo]'
  Uso combo: '&cUse: /starairdrops combo <evento> <quantidade> [mundo]'
  Uso dar: '&cUse: /starairdrops {tipo} <jogador> <evento> [quantidade]'
  Uso radar: '&cUse: /starairdrops radar <jogador> [quantidade]'
  Evento desconhecido: '&cO evento &f{evento} &cnao existe.'
  Mundo desconhecido: '&cO mundo &f{mundo} &cnao existe.'
  Nao coube: '&cNao foi possivel iniciar: ou o teto de ativos foi batido, ou nao ha lugar bom no mundo.'
  Iniciado: '&aAirdrop &f#{id} &a({evento}&a) em &f{mundo} &7{x}, {y}, {z}&a.'
  Parado: '&aO airdrop &f#{id} &afoi removido.'
  Parados: '&a{quantidade} airdrop(s) removido(s).'
  Sem esse id: '&cNao ha nenhum airdrop com o id &f{id}&c.'
  Combo: '&a{quantidade} caixa(s) de &f{evento} &alancada(s).'
  Item entregue: '&aVoce deu &f{quantidade}x {tipo} &ade &f{evento} &apara &f{jogador}&a.'
  Listar:
    Cabecalho: '&8&m----------- &6&lSTARAIRDROPS &8&m-----------'
    Evento: ' &7{id} &8- &f{nome} &7({tipo}, peso {peso}) {estado}'
    Ativo: ' &e#{id} &f{evento} &7{raridade} &8- {estado} &7em {mundo} {x}, {y}, {z}'
    Automatico: ' &b{tipo} &8- &7proxima em &f{segundos}s {estado}'
    Ligado: '&aligado'
    Desligado: '&cdesligado'
  Info geral: |
    &8&m--------------------------------
    &6&lSTARAIRDROPS
    &7Ativos: &f{ativos}&7/&f{maximo}
    &7Eventos: &f{eventos} &8| &7Raridades: &f{raridades} &8| &7Missoes: &f{missoes}
    &7Chuvas em andamento: &f{chuvas}
    &7Banco: &f{banco} &8| &7Temporada: &f{temporada}
    &8&m--------------------------------
  Info drop: |
    &8&m--------------------------------
    &6&lAIRDROP &f#{id}
    &7Evento: &f{evento} &8| &7Raridade: {raridade}
    &7Estado: {estado} &8| &7Expira em: &f{expira}s
    &7Coletas: &f{coletas} &8| &7Restantes: &f{restantes}
    &7Local: &f{mundo} {x}, {y}, {z}
    &8&m--------------------------------
  Armas:
    Cabecalho: |
      &8&m--------------------------------
      &6&lSTARARMAS &7- {estado}
      &7Armas: &f{armas} &8| &7Municoes: &f{municoes} &8| &7Acessorios: &f{acessorios}
      &8&m--------------------------------
    Instalado: '&aintegrado'
    Ausente: '&cnao encontrado'
    Todas: '&7todas'
    Raridade: ' {raridade} &8- &7faixas: &f{faixas} &8| &7arma &f{arma}% &7municao &f{municao}% &7acessorio &f{acessorio}% &8| &7sem catalogo: &c{faltando}'

