# ==========================================================================
#  StarAirDrops - temporada
#
#  A temporada nao cria evento nenhum: ela pinta os que ja existem. Prefixo
#  nas mensagens publicas, particula na queda, sufixo no holograma e um
#  multiplicador nos premios.
#
#  O periodo e escrito em MM-dd e vira o ano sem susto: de 12-20 a 01-05 vale
#  em dezembro e em janeiro. A de maior Prioridade manda quando duas valem no
#  mesmo dia; a Padrao e o "resto do ano" e perde de qualquer outra.
#
#  Eventos exclusivos: eventos que so entram no sorteio automatico durante a
#  temporada. Fora dela eles continuam existindo e podem ser chamados no
#  comando.
# ==========================================================================

