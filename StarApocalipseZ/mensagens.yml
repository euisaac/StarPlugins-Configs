  Anuncio: '&e{jogador} &7chegou ao nivel de sobrevivente &f{nivel}&7.'
  Marco: '&6Marco alcancado: &r{nome}&6.'
  Perdeu: '&cVoce perdeu &f{pontos} &cpontos ao morrer.'
  Perfil-Nao-Carregado: '&cSeu perfil ainda esta carregando. Tente de novo.'

