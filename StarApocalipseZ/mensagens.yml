  Pegou: '&2Voce foi infectado. Procure um antidoto.'
  Curado: '&aA infeccao passou.'
  Curado-Antidoto: '&aO antidoto fez efeito. Voce esta limpo.'
  Ja-Infectado: '&cEste jogador ja esta infectado.'
  Nao-Infectado: '&cEste jogador nao esta infectado.'
  Dado: '&aVoce infectou &f{jogador}&a.'
  Removido: '&aVoce curou &f{jogador}&a.'
  Sem-Antidoto: '&cVoce nao tem um antidoto.'
  Nao-Esta-Infectado: '&7Voce nao esta infectado.'
  Antidoto-Entregue: '&aVoce recebeu &f{quantidade}x &aantidoto.'
  Antidoto-Dado: '&aEntregue &f{quantidade}x &aantidoto para &f{jogador}&a.'
  Morreu: '&4{jogador} nao resistiu a infeccao.'

