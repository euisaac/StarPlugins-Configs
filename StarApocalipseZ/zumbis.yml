# ============================================================================
#  Tipos de zumbi
#  Cada tipo e uma variante com nome, aparencia e habilidades proprias.
#  Quando um zumbi nasce, o plugin sorteia entre os tipos que cabem naquele
#  nivel e naquele lugar, usando o Peso como chance relativa.
#
#  O tipo COMUM (peso alto, sem habilidade) e o que segura a maior parte dos
#  sorteios: sem ele, todo zumbi do mapa seria especial.
#
#  Queimar-No-Sol so e consultado quando Spawn > Queimar-No-Sol esta ligado no
#  config.yml. Com ele desligado (o padrao), nenhum morto do plugin pega fogo.
#
#  ---------------------------------------------------------------------------
#  HABILIDADES
#  Formato: 'NOME; Chave=Valor; Chave=Valor'
#  Chaves aceitas por todas: Cooldown (tempo), Chance (0-100), Alcance (blocos)
#
#    INVESTIDA    Forca=1.4              avanca em linha reta sobre o alvo
#    SALTO        Forca=0.9              pula por cima de muros e cercas
#    CUSPE        Dano=3; Efeito=POISON;120;0
#    EXPLODIR     Poder=2.5; Fogo=false; Quebrar=false; AoMorrer=true
#    GRITO        Raio=25; Reforco=0     chama os zumbis proximos para o alvo
#    REVIVER      Raio=8; Maximo=3       levanta de volta os zumbis abatidos
#    INVOCAR      Tipo=COMUM; Quantidade=2; Maximo=6
#    PUXAR        Forca=1.2              arrasta o alvo para perto
#    EMPURRAR     Forca=1.5
#    CEGAR        Duracao=4s
#    FOME         Duracao=10s; Nivel=1
#    TELEPORTE    Distancia=10           surge atras do alvo
#    ESCUDO       Duracao=5s; Nivel=1    resistencia temporaria
#    VENENO       Duracao=6s; Nivel=0    aplica no golpe
#    FRENESI      Vida=30; Nivel=1       acelera quando a vida cai
#    REGENERAR    Vida=2.0
#    CURAR_ALIADOS Raio=10; Vida=4.0
#    QUEBRAR_PORTA Tempo=2s              derruba porta, vidro e madeira fraca
#    ONDA_DE_CHOQUE Raio=6; Dano=4; Forca=1.2
#    RAIO         Dano=6                 so faz sentido em chefe
#    ESCALAR      Forca=0.42             sobe a parede que separa do alvo
#    VOAR         Impulso=0.62; Impulso-Inicial=0.95; Sustentacao=0.08;
#                 Distancia-Minima=8     decola e voa ate o alvo (pede elytra
#                                        no peitoral para a asa aparecer)
#    RECUAR       Forca=0.75; Altura=0.32; Duracao=2s; Nivel=1
#                                        gatilho: pula para tras ao APANHAR
#    INVISIVEL    Duracao=8s             some da vista (armadura continua visivel)
#    AURA         Efeito=WITHER; Nivel=0; Raio=6; Duracao=4s
#                                        efeito continuo em quem chega perto
#    ROUBAR_VIDA  Vida=2                 gatilho: o golpe alimenta o morto
#    CORROER      Desgaste=30            gatilho: gasta a armadura de quem apanha
#    ESPINHOS     Dano=2                 gatilho: devolve parte do golpe recebido
#    PEDRA        Delay=1s; Dano=5; Velocidade=1.6
#                                        mira, espera e arremessa uma pedra;
#                                        acerta o que estiver no caminho,
#                                        inclusive o que estiver voando
#    DIVIDIR      Quantidade=2; Nivel=-5 ao morrer, vira dois menores
# ============================================================================

