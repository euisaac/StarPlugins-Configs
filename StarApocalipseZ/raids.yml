# ============================================================================
#  Raids
#  O ataque com hora marcada: ondas de mortos contra um ponto -- a base do
#  jogador, o spawn de uma cidade ou onde o administrador mandar.
#
#  Uma raid pode comecar sozinha (Raids > Espontanea-A-Cada no config.yml),
#  por comando (/starapocalipsez raid <modelo> <jogador>) ou como parte de
#  uma zona de perigo.
#
#  ---------------------------------------------------------------------------
#  SOBRE O TAMANHO DAS ONDAS
#  Uma onda NAO nasce de uma vez: ela entra numa fila e o motor solta um
#  punhado por tique (Raids > Spawn-Por-Tique no config.yml). E por isso que
#  uma onda de setenta mortos nao trava o servidor -- e por isso que ela chega
#  em levas, o que ainda parece mais com um cerco de verdade.
#
#  A onda so conta como limpa depois de nascer inteira. O chefe e sempre o
#  ultimo a entrar, para nao apanhar sozinho enquanto a escolta ainda chega.
# ============================================================================

Raids:

  ASSEDIO:
    Nome: '&cAssedio'
    Peso: 50
    # Faixa de nivel do lugar onde a raid pode comecar sozinha.
    Nivel-Minimo: 1
    Nivel-Maximo: 45
    # Raio em que os mortos nascem em volta do alvo.
    Raio-De-Spawn: 38
    # Tempo maximo da raid inteira. Estourou, ela e cancelada.
    Duracao-Maxima: '30m'
    # Tempo entre uma onda e a proxima depois que a anterior e limpa.
    Intervalo-Entre-Ondas: '15s'
    # Bonus de nivel somado a cada morto da raid.
    Bonus-De-Nivel: 12
    # Contagem regressiva antes da primeira onda.
    Preparacao: '30s'

    Ondas:
      1:
        Quantidade: 18
        Composicao:
          - 'COMUM:60'
          - 'CORREDOR:40'
        Bonus-De-Nivel: 0
      2:
        Quantidade: 26
        Composicao:
          - 'CORREDOR:40'
          - 'COMUM:25'
          - 'ARIDO:20'
          - 'ESCALADOR:15'
        Bonus-De-Nivel: 4
      3:
        Quantidade: 34
        Composicao:
          - 'CORREDOR:30'
          - 'TANQUE:20'
          - 'CUSPIDOR:20'
          - 'ATIRADOR:15'
          - 'GRITADOR:15'
        Bonus-De-Nivel: 8
      4:
        Quantidade: 42
        Composicao:
          - 'TANQUE:25'
          - 'EXPLOSIVO:20'
          - 'CACADOR:20'
          - 'ESCALADOR:20'
          - 'NECROMANTE:15'
        Bonus-De-Nivel: 14
      5:
        Quantidade: 30
        Composicao:
          - 'CACADOR:35'
          - 'TANQUE:25'
          - 'SOLDADO:25'
          - 'BERSERKER:15'
        Bonus-De-Nivel: 20
        Chefe: 'CHEFE_CARNICEIRO'

    Recompensas:
      # Para todo mundo que participou (ver Raids > Participacao no config).
      Participacao:
        Pontos: 300
        Comandos: []
        Itens:
          - 'Item=GOLDEN_APPLE; Quantidade=3'
          - 'Item=ARROW; Quantidade=32'
      # So para quem mais matou.
      Destaque:
        Pontos: 900
        Comandos: []
        Itens:
          - 'Item=DIAMOND; Quantidade=8'
          - 'Arma=*; Raridade=RARO'

  INVASAO:
