# ==========================================================================
#  StarSkins - nomes dos comandos
#
#  Aqui voce troca o nome do comando e as aliases sem mexer no jar. O
#  primeiro nome da linha e o comando principal; os outros, separados por
#  |, viram aliases.
#
#  Os nomes que ja vem do plugin.yml (/skin, /skins, /pele, /starskins,
#  /sskins) continuam valendo de qualquer jeito.
#  Deixe vazio para nao registrar nenhum nome extra.
#
#  Exemplo:  skin: 'minhaskin|aparencia'
# ==========================================================================

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

comandos:
  skin: ''
  starskins: ''
