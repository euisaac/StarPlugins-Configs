# ============================================================
#  StarLiveInterativa - mobs especiais
#
#  A ação "Mob especial" (ESPECIAL) faz nascer um destes, pelo id
#  (o nome antes dos dois pontos). Por padrão os presentes caros
#  (gatilho "Presente de valor" no config.yml) chamam os especiais.
#
#  Campos:
#    nome           nome em cima do mob (cores com & e &#rrggbb)
#    mob            tipo do mob (ZOMBIE, SPIDER, WITHER_SKELETON...)
#    vida           vida máxima (corações x2)
#    tamanho        1.0 = normal (precisa da 1.20.5+ para mudar)
#    velocidade     1.0 = normal
#    dano           dano do golpe (vazio = o do mob)
#    armadura       NENHUMA, COURO, FERRO, OURO, DIAMANTE, NETHERITA
#    so-capacete    true = só o capacete (não queima de dia)
#    brilho         contorno brilhante
#    cor-da-barra   PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
#    lacaio         mob que ele chama (Invocar Lacaios / Divisão)
#    poderes        id: { recarga: segundos, dano: valor }  (os dois são opcionais)
#
#  Poderes que ele usa no alvo:
#    RELAMPAGO, BOLA_DE_FOGO, SALTO_ESMAGADOR, INVOCAR_LACAIOS, TELEPORTE,
#    PUXAR, EMPURRAR, CONGELAR, VENENO, WITHER, LEVITACAO, CEGUEIRA,
#    CHUVA_DE_FLECHAS, TERREMOTO, METEORO, DRENAR_VIDA
#  Nele mesmo: REGENERACAO, ESCUDO
#  Passivos (sempre ligados): FURIA, VAMPIRISMO, ESPINHOS, AURA_DE_FOGO,
#    EXPLODIR_AO_MORRER, DIVIDIR_AO_MORRER
#
#  Nenhum poder quebra bloco nem põe fogo no mapa.
# ============================================================

geral:
  # Quantos especiais podem estar vivos ao mesmo tempo por streamer (o resto é ignorado).
  maximo-vivos-por-streamer: 6
  # Quantos um mesmo presente faz nascer, no máximo (combo incluído).
  maximo-por-presente: 3
  # Some sozinho depois de tantos segundos (0 = só sai quando morrer).
  some-depois-de-segundos: 300
  # Barra de vida no topo da tela de quem está perto.
  barra-de-vida: true
  # Multiplica o dano de todos os poderes (0.5 = metade).
  dano-dos-poderes: 1.0
  # Segundos mínimos entre dois poderes do mesmo mob.
  intervalo-entre-poderes: 2.5
  # Especiais não pegam fogo no sol.
  queimar-no-sol: false
  # Nome em cima do mob. {nome} = nome do especial, {doador} = quem mandou o presente.
  formato-do-nome: "{nome} &8• &e{doador}"

especiais:
