# ==========================================================================
#  StarInterativo - mensagens
#  Use & para cores. Cada mensagem pode ter varias linhas (lista).
# ==========================================================================

Prefixo: '&6&lMINA &8» &7'

Vinculo:
  Pedido:
    - ''
    - '{prefixo}&fVoce esta tentando vincular o TikTok &d@{tiktok}&f?'
    - '{prefixo}&7Se foi voce, digite &a/interativo confirmar&7.'
    - ''
  Botao confirmar: '&a&l[CONFIRMAR]'
  Botao negar: '&c&l[NAO FUI EU]'
  Dica confirmar: '&7Clique para vincular &d@{tiktok}'
  Confirmado: '{prefixo}&aPronto! Seu TikTok &d@{tiktok} &aesta vinculado. Seu boneco ja pode minerar na live.'
  Negado: '{prefixo}&7Pedido de vinculo recusado.'
  Sem pedido: '{prefixo}&cNenhum pedido de vinculo para voce. Comente &f/vincular {nick} &cno chat da live.'
  Nao vinculado: '{prefixo}&7Voce ainda nao vinculou o TikTok. Comente &f/vincular {nick} &7no chat da live e depois use &a/interativo confirmar&7.'
  Desvinculado: '{prefixo}&7Seu TikTok &d@{tiktok} &7foi desvinculado.'

Mineracao:
  Titulo: '{prefixo}&fVoce minerou na live: &e+{pedras} pedras &8(total {total})'
  Linha: '  &8• &f{qtd}x &7{bloco} &8(+{pedras})'

Recompensa: '{prefixo}&dVoce ganhou: &f{texto}'
Evento global: '{prefixo}&e{texto}'

Pedras: '{prefixo}&fVoce tem &e{pedras} pedras &8· &7{blocos} blocos minerados'
Top:
  Titulo: '{prefixo}&6Ranking da mina:'
  Linha: '  &e{pos}. &f{nome} &8- &e{pedras} pedras'
  Vazio: '{prefixo}&7Ninguem minerou ainda.'

Caixa:
  Comprou: '{prefixo}&aVoce abriu a &f{caixa} &ae ganhou &f{texto}&a!'
Erro: '{prefixo}&c{erro}'
Jogo offline: '{prefixo}&cO jogo da live esta fechado agora. Tente quando a live estiver no ar.'
Sem conexao: '{prefixo}&cSem conexao com o TikBooster. Avise a staff.'
Carregando: '{prefixo}&7Carregando...'
Recarregado: '{prefixo}&aConfiguracao recarregada.'
Sem permissao: '{prefixo}&cVoce nao tem permissao.'

Ajuda:
  - '{prefixo}&6Comandos da mina:'
  - '  &e/interativo &7- abre o menu (pedras, caixas, pocoes e picaretas)'
  - '  &e/interativo confirmar &7- confirma o vinculo com o TikTok'
  - '  &e/interativo pedras &7- mostra suas pedras'
  - '  &e/interativo top &7- ranking da mina'
  - '  &e/interativo boss &7- vida do boss / quando ele volta'
  - '  &e/interativo desvincular &7- solta seu TikTok deste nick'
  - '  &7Na live: comente &f/vincular SeuNick &7para comecar.'
