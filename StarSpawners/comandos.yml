#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                    Comandos  ·  StarSpawners                         ║
#  ╚══════════════════════════════════════════════════════════════════════╝
#
#  Nome e apelidos do comando do plugin. Precisa de /starspawners recarregar
#  (ou reiniciar o servidor) depois de mudar aqui.
#
#  O primeiro nome da lista de Apelidos vira o nome "principal" do comando
#  (o que aparece nas mensagens de erro do proprio Bukkit); os demais sao
#  apelidos de verdade. Pra tirar um apelido (ex: /spawners batendo com outro
#  plugin), so apagar a linha dele. Pelo menos um precisa sobrar.

Starspawners:
  # false desliga o comando inteiro - nem o nome principal responde mais.
  Ativado: true

  Apelidos:
    - starspawners
    - ss
    - spawners
    - starspawner
