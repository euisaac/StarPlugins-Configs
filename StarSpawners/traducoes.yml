# =========================================================
#  StarSpawners - Traduções
#  Nomes em português usados nos menus, actionbar, holograma e mensagens de
#  stack no lugar do nome em inglês (ex: COW -> Vaca, DIRT -> Terra).
#
#  Cobre todos os mobs/animais do Minecraft (1.8-1.21) e um conjunto amplo
#  dos itens mais comuns (drops de mobs, minérios, comida, blocos, etc).
#  Qualquer coisa que não estiver aqui usa um nome formatado automaticamente
#  a partir do nome em inglês (não fica com o texto "cru" tipo ROTTEN_FLESH).
#
#  Sinta-se à vontade pra adicionar/editar traduções aqui.
# =========================================================

