# =========================================================
#  StarSpawners - Mensagens
#  Use "&" para cores. Placeholders variam por mensagem.
#
#  O formato da actionbar, do holograma do spawner e da nametag de pilhas de
#  mob/item ficam no config.yml (seções actionbar, holograma, stack-mobs e
#  stack-itens). O texto/formato dos menus (título, nome e lore de item) fica
#  no menus.yml. Aqui ficam só as mensagens de chat.
# =========================================================

