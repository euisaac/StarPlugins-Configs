# menus.yml - Configuração completa dos menus StarCrafter
# Edite aqui para customizar nomes, lendas, materiais

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (vale em qualquer
# versao) e UM destes dois campos:
#
#       material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

menus:
  main:
    title: '&6StarCrafter - Menu Principal'
    size: 27
    items:
      criar_craft:
        slot: 11
        material: CRAFTING_TABLE
        name: '&a&lCriar Novo Craft'
        lore:
          - '&7Clique para abrir o editor'
          - '&7de craft 3x3 personalizada'
      bloquear_craft:
        slot: 15
        material: BARRIER
        name: '&c&lBloquear Craft'
        lore:
          - '&7Clique para bloquear crafts vanilla'
          - '&7na mesa e crafter'
      lista_crafts:
        slot: 13
        material: BOOK
        name: '&9&lLista de Crafts'
        lore:
          - '&7Visualizar crafts criados'

  craft_editor:
    title: '&bEditor de Craft - 3x3'
    size: 45
    grid_material: BLACK_STAINED_GLASS_PANE
    grid_name: '&7'
    grid_lore:
      - '&7'
    result_slot: 24
    result_material: BARRIER
    result_name: '&eResultado - Clique para definir'
    result_lore:
      - '&7Segure o item resultado e clique'
    save_slot: 26
    save_material: EMERALD
    save_name: '&a&lSalvar Craft'
    save_lore:
      - '&7Salva o craft no crafts.yml'
    back_slot: 44
    back_material: ARROW
    back_name: '&c&lVoltar'
    back_lore:
      - '&7Voltar para a lista de crafts'

  craft_list:
    title: '&bLista de Crafts Personalizados'
    size: 54

  block_craft:
    title: '&4&lBloquear Craft Vanilla'
    size: 27
    items:
      bloquear_novo:
        slot: 13
        material: ANVIL
        name: '&c&lBloquear Novo Craft'
        lore:
          - '&7Clique e digite o ID'
          - '&7no chat (ex: DIRT)'
          - '&eDigite cancelar para voltar'
      voltar:
        slot: 26
        material: ARROW
        name: '&a&lVoltar'

