# StarCompBot - competicao de tempo em call no Discord
#
# Este produto e um ADDON do StarDiscord: ele NAO tem token proprio nem abre uma
# segunda conexao com o Discord. Quem fala com o Discord e o bot do StarDiscord,
# que ja esta no ar -- este addon so acrescenta os comandos e os eventos.
#
# Para funcionar, o bot do StarDiscord precisa das intents de MEMBROS e de VOZ
# ligadas no portal do Discord (Server Members Intent e, no codigo do StarDiscord,
# GUILD_VOICE_STATES). Sem elas o Discord nao avisa quem entra e sai das calls.

Banco:
  # SQLite guarda tudo num arquivo dentro da pasta do plugin e nao pede nada a mais.
  # MySQL so e necessario se voce quiser compartilhar os dados entre varios servidores.
  Tipo: SQLite # SQLite ou MySQL

  # Usados somente quando Tipo: MySQL
  IP: localhost:3306
  DB: starcompbot
  User: root
  Pass: ''

Competicao:
  # De quanto em quanto tempo (segundos) o ranking fixado e reescrito no Discord.
  # Mexer muito abaixo disso so gasta limite de requisicao do Discord.
  AtualizarRankingSegundos: 10

  # De quanto em quanto tempo (segundos) o tempo de quem esta em call e somado.
  # E tambem o passo da conferencia de termino da competicao.
  ContarTempoSegundos: 5

  # De quanto em quanto tempo (segundos) o tempo acumulado vai para o banco.
  # Entre uma gravacao e outra o tempo vive na memoria; se o servidor cair, o que
  # se perde e no maximo este intervalo.
  GravarSegundos: 30

  # Quantos vencedores a competicao tem, quando o servidor nao definiu o proprio.
  VencedoresPadrao: 1

  # Quantas pessoas aparecem na embed do ranking, quando o servidor nao definiu.
  ParticipantesPadrao: 10

  # Quantos escudos uma pessoa pode acumular.
  MaximoDeEscudos: 3

  # Avisos no chat do jogo antes de uma competicao agendada comecar, em minutos.
  # Cada um sai uma vez so. Deixe a lista vazia para nao avisar nada.
  AvisarMinutosAntes:
    - 10
    - 5

Recompensas:
  # Liga a entrega das recompensas no jogo. O vinculo Discord <-> jogador vem do
  # StarDiscord (o mesmo do /vincular); quem nao vinculou nao recebe.
  Ativar: true

  # Cada premio escolhe no menu (/competicao > Recompensas > posicao) se os
  # comandos saem "na hora" (assim que a competicao acaba, mesmo com o jogador
  # offline) ou "quando estiver online" (espera ele entrar; se ja esta online,
  # sai na hora). Tudo fica no historico, marcado como entregue quando sai.

  # Quantos dias um premio esperando o jogador continua valendo (0 = para sempre).
  ValidadeDias: 30

  # Gift card da loja do servidor (precisa da RedeStar-Loja 1.0.12+). O valor e
  # definido em cada premio, no menu. O codigo vai na DM, no menu
  # "Minhas recompensas" e no /minhasrecompensas do Discord.
  GiftCard:
    # Endereco do site para resgatar. Vazio = o que a RedeStar-Loja usa.
    Site: ''
    # No chat, quando o jogador esta online. {codigo} {valor} {site}
    Mensagem:
      - '&6&l[Competicao] &eVoce ganhou um gift card de &6R$ {valor}&e!'
      - '&eCodigo: &f&l{codigo} &7(resgate no site da loja{site})'

  # DM no Discord para cada vencedor com o premio (e o gift card).
  DM:
    Ativar: true

  # Avisa o jogador no chat ao entregar.
  Mensagem:
    - '&6&l[Competicao] &eVoce recebeu a recompensa de &6{posicao}o lugar &eem &6{evento}&e!'

  # Anuncia para o servidor inteiro (deixe vazio para nao anunciar).
  Anuncio:
    - '&6&l[Competicao] &e{jogador} ficou em &6{posicao}o lugar &eem &6{evento}&e!'

# Avisa no Discord (DM) quem esta participando sem ter vinculado a conta.
# Avisos de competicao agendada no chat do jogo. Aceita &a, &6, &l...
# Trocas: %evento% (nome), %quando% (data e hora), %minutos% (contagem regressiva).
messages:
  compAgendadaAnuncio: '&6&l[Competicao] &eA competicao &6%evento% &ecomeca em &6%quando%&e!'
  compAgendadaFaltam: '&6&l[Competicao] &eA competicao &6%evento% &ecomeca em &6%minutos% minuto(s)&e!'
  # Quando a competicao comeca (agora ou no horario agendado).
  compIniciadaAnuncio: '&6&l[Competicao] &aA competicao &6%evento% &acomecou! Entre numa call do Discord para contar tempo. Termina em &6%termino%&a.'
  # Quando termina sozinha: o titulo e uma linha por premiado (ate 5).
  compFinalizadaAnuncio: '&6&l[Competicao] &eA competicao &6%evento% &eterminou!'
  compFinalizadaLinha: '&e%posicao%o lugar: &f%nome% &7- &6%tempo%'
  compFinalizadaSemNinguem: '&7Ninguem registrou tempo desta vez.'

AvisarNaoVinculado: true
MensagemNaoVinculado: 'Voce esta participando de uma competicao, mas sua conta do jogo nao esta vinculada. Use /vincular para vincular e poder receber a recompensa.'
