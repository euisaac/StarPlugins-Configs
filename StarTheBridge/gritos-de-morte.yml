# ==========================================================================
#  StarTheBridge - gritos de morte
#
#  O som que a partida inteira ouve quando o jogador morre.
#  Som: nome do XSeries (SOM;volume;tom); nomes antigos tambem funcionam.
#
#  Preco 0 e sem Padrao: so sai das caixas misteriosas. Padrao: true = todo
#  mundo tem. Raridades: COMUM, RARO, EPICO, LENDARIO.
#  Permissao opcional: quem tem a permissao ja possui o item
#  (starthebridge.<tipo>.<id> e starthebridge.<tipo>.* tambem funcionam).
# ==========================================================================

