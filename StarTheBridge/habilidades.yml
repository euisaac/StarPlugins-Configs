# ==========================================================================
#  StarTheBridge - habilidades
#
#  Uma habilidade por modo (1v1, 2v2, 3v3, 4v4, ranqueado). O jogador seleciona
#  uma por modo. Tipo decide o que ela faz; Valor de cada nivel e o quanto:
#    HEADSHOT (multiplicador do dano na cabeca)   VIDA_EXTRA (coracoes)
#    VELOCIDADE (nivel do efeito)  SALTO (nivel)  REGENERACAO (coracoes ao pontuar)
#    FLECHA_RAPIDA (% mais rapido) BLOCOS_EXTRAS (pilhas)  MACAS_EXTRAS (macas)
#    ARQUEIRO (% dano da flecha)   ESPADACHIM (% dano da espada)
#    VAMPIRO (coracoes por abate)  ESCUDO (segundos de protecao a mais)
#    FLECHA_DE_FOGO (segundos)     MINERADOR (nivel de pressa)  TANQUE (% dano a menos)
#  Niveis: o 1 desbloqueia (Coins/Cash), os seguintes evoluem. Sem preco = so
#  nas caixas. Raridades: COMUM, RARO, EPICO, LENDARIO.
#  Permissao: starthebridge.habilidade.<modo>.<id> ou starthebridge.habilidade.*
# ==========================================================================

