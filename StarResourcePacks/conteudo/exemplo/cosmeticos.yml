# ============================================================
#  Cosmeticos que os jogadores vestem pelo /cosmeticos.
#
#  Tipo          CHAPEU, COSTAS (mochila, asas, capa) ou BALAO. Um de cada por vez.
#  Categoria     aba do guarda-roupa (nome bonito em menus.yml).
#  Livre         true = todo mundo tem. Senao: starresourcepacks.cosmetico.<id>
#                (ou a "Permissao" que voce escrever).
#  Raridade      comum, raro, epico, lendario ou mitico (cor e ordem no guarda-roupa).
#  Preco         em moedas; 0 = nao esta a venda (so por permissao ou "Livre").
#  Modelo        modelo 3D em resource_pack/assets/exemplo/models/ (sem .json; outro namespace: ns:caminho).
#  Ajuste        COSTAS e BALAO: posicao (blocos) a partir do pe do jogador,
#                Z positivo = para a frente; mais Rotacao (graus) e Escala.
#                Muda na hora pelo editor.
#                CHAPEU animado: posicao a partir do centro da cabeca.
#  Exibicao      CHAPEU parado: ajuste do modelo na cabeca (pixels), pelo editor + "Testar".
#  Animacao      Tipo GIRAR (graus por tique), BATER (vai e volta), FLUTUAR,
#                BALANCAR ou PULSAR; Eixo X/Y/Z; Velocidade; Amplitude (graus,
#                ou blocos no FLUTUAR). A peca gira em volta do centro do modelo.
#                Chapeu com Animacao ou Pecas vira uma peca que segue a cabeca.
#  Pecas         modelo em varias partes, cada uma com Modelo, Ajuste e Animacao
#                (as duas asas batendo, por exemplo). No lugar de "Modelo".
#  Particulas    Tipo, "A cada" (tiques), Quantidade, Posicao (a partir dos pes do jogador) e Espalhar.
#  Corda         BALAO: desenha a cordinha ate a mao do jogador.
#  Esconder do dono  o proprio jogador nao ve (bom para pecas grandes).
#  Alternativo   o que aparece em servidor 1.8 a 1.13.
#  Receita       igual a dos itens (veja o cabecalho do itens.yml).
#
#  Costas: o modelo e lido com o NORTE encostado nas costas do jogador.
# ============================================================
