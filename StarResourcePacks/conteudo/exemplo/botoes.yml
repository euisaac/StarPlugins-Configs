# ============================================================
#  Botoes e icones de menu.
#
#  Sao itens comuns (mesma secao "Itens" do itens.yml), so que feitos para
#  aparecer dentro dos menus: papel com uma textura 16x16 desenhada.
#  Use em menus.yml como exemplo:botao_voltar, exemplo:botao_fechar...
#  Para trocar o desenho, troque a imagem em resource_pack/assets/exemplo/textures/item/.
#
#  botao_*        botoes dos menus do plugin (guarda-roupa, bancada, emotes).
#  tela_botao_*   botoes das telas cheias (boas-vindas, anuncios).
#  emoji_*        os emojis como item, para servir de icone (emotes.yml).
# ============================================================
Itens:
  botao_voltar:
    Material: PAPER
    Nome: '&f'
    Textura: item/botao_voltar
  botao_avancar:
