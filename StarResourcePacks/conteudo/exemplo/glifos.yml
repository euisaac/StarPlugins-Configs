# ============================================================
#  Glifos: imagens para usar em textos -> {glifo:exemplo:hud_coracao_cheio}
#  ou %starresourcepacks_glifo_exemplo:hud_coracao_cheio% em outros plugins.
#
#  Textura       imagem em resource_pack/assets/exemplo/textures/ (sem .png).
#  Altura        altura da imagem na tela, em pixels do jogo.
#  Subida        quanto ela sobe a partir da linha do texto.
#
#  Fundo de menu: {fundo:exemplo:guarda_roupa} no titulo (servidor 1.19+).
#  A imagem do fundo tem o tamanho da tela do bau (176x222 para 6 linhas)
#  e usa Subida 13 para encostar no topo. As casas ficam nos mesmos lugares
#  do bau comum: e so desenhar por cima.
#
#  HUD: os icones de 9x9 (coracao, fome, mana, moeda, escudo) e as pecas da
#  bussola (fundo + letras N, S, L, O + marcador) servem para montar barras
#  na tela do jogador.
# ============================================================
Glifos:
  # ---------------------------------------------------------- fundos de menu
  guarda_roupa:
    Textura: interface/guarda_roupa
    Altura: 222
    Subida: 13
  bancada:
    Textura: interface/bancada
    Altura: 222
    Subida: 13
  emotes:
    Textura: interface/emotes
    Altura: 222
    Subida: 13
