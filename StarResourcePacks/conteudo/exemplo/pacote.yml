# Informacoes deste pacote de conteudo. O nome da pasta vira o namespace
# (exemplo:cartola). Para criar o seu, copie esta pasta com outro nome.
#
# Como um pacote e montado:
#   pacote.yml, itens.yml, moveis.yml, cosmeticos.yml, blocos.yml...  (as configuracoes)
#   resource_pack/assets/<namespace>/models/    modelos 3D (.json do Blockbench)
#   resource_pack/assets/<namespace>/textures/  imagens (.png)
#   resource_pack/assets/...                    qualquer outra coisa de pacote de recursos (sons, fontes,
#                                               itens do jogo): entra no pacote final como esta.
# Pacotes prontos de outros formatos podem ser soltos inteiros em conteudo/ (ou importados pelo
# painel do site / /srp importar): o plugin escreve os .yml dele e usa os arquivos do jeito que vieram.
Nome: 'Exemplo StarResourcePacks'
Ativo: true
