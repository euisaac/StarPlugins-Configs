# ============================================================
#  Emojis do chat (servidor 1.13+). Escreva :id: ou um dos atalhos.
#
#  Nome          nome que aparece na lista de emojis.
#  Textura       imagem em resource_pack/assets/exemplo/textures/ (sem .png). As do exemplo sao 16x16.
#  Atalhos       textos que tambem viram o emoji (opcional).
#  Altura/Subida tamanho e altura da imagem na linha (padrao 9 e 8).
#  Permissao     deixe vazio para todos.
# ============================================================
Emojis:
  sorriso:
    Nome: 'Sorriso'
    Textura: emoji/sorriso
    Atalhos: [':)', ':-)']
    Altura: 9
    Subida: 8
