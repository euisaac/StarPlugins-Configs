# ============================================================
#  Emotes: animacoes de corpo que o jogador solta pelo menu de emotes.
#
#  O plugin mostra um boneco (com a cabeca e a armadura do jogador) fazendo
#  a animacao no lugar dele.
#
#  Nome          nome no menu.
#  Icone         item do menu: um id deste pacote (exemplo:emoji_sorriso) ou
#                um material do jogo (DIAMOND).
#  Raridade      comum, raro, epico, lendario ou mitico.
#  Livre         true = todo mundo tem; false = precisa ser liberado ao jogador.
#  Duracao       tamanho da animacao em tiques (20 = 1 segundo).
#  Repetir       true = fica repetindo ate o jogador se mexer.
#  Quadros       tique -> pose. Cada parte recebe 'X, Y, Z' em graus e o plugin
#                faz a passagem suave de um quadro para o outro. Parte que nao
#                aparece num quadro continua como estava.
#                Partes: Cabeca, Corpo, BracoDireito, BracoEsquerdo,
#                PernaDireita, PernaEsquerda.
#                Dica: braco para cima = X -170; para a frente = X -90;
#                perna para a frente (sentado) = X -90.
# ============================================================
Emotes:
  acenar:
    Nome: '&eAcenar'
    Icone: exemplo:emoji_sorriso
    Raridade: comum
    Livre: true
    Duracao: 40
    Repetir: false
    Quadros:
      '0': {Cabeca: '0, 0, 0', BracoDireito: '-10, 0, 10', BracoEsquerdo: '-10, 0, -10'}
      '8': {BracoDireito: '-170, 0, 20', Cabeca: '0, 0, 5'}
      '16': {BracoDireito: '-170, 0, -20'}
      '24': {BracoDireito: '-170, 0, 20'}
      '32': {BracoDireito: '-170, 0, -20'}
      '40': {BracoDireito: '-10, 0, 10', Cabeca: '0, 0, 0'}

