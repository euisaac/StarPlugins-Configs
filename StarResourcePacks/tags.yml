# ============================================================
#  StarResourcePacks - tags por imagem
#  Cada tag vira uma plaquinha: use {tag:<id>} nos textos do plugin ou
#  %starresourcepacks_tag_<id>% em qualquer outro (chat, tab, scoreboard).
#  Texto: letras, numeros e + - ! ? . * / : #   |  cores em #RRGGBB
#  Fundo 2: segunda cor para degrade (vazio = cor unica). Borda/Sombra vazias = automaticas.
#  Formato: PLACA, PILULA, RETA, FAIXA, ETIQUETA, CONTORNO ou TEXTO.  Degrade: VERTICAL ou HORIZONTAL.
#  Icone: ESTRELA, CORACAO, COROA, DIAMANTE, RAIO, CAVEIRA, ESPADA, ESCUDO, FOGO, NOTA, CHECK, MAIS
#    (Lado do icone: ESQUERDA ou DIREITA; Cor do icone: vazia = a da letra).
#  Brilho: filete claro no topo.  Espaco: 0 a 6 pixels entre a borda e o texto.  Contorno: letra contornada.
#  Pelo jogo: /srp tag criar <id> <texto> [#fundo] [#letra]
# ============================================================
Tags:
