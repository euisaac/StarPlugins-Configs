Hospedagem:
  Subindo: '&7Subindo o pacote (&f{tamanho}&7) para a hospedagem da StarPlugins...'
  Upado: '&aPacote hospedado na StarPlugins (&f{tamanho}&a). Os jogadores passam a baixar de: &f{url}'
  Ja subindo: '&eO pacote ja esta subindo; aguarde terminar.'
  Sem pacote: '&cAinda nao ha pacote montado. Use &f/srp textura construir&c.'
  Sem premium: '&cHospedar o pacote na StarPlugins e um beneficio do &6Premium&c (starplugins.com.br). Sem ele o pacote sai pela porta deste servidor ou por um link seu em &fUrl externa&c.'
  Sem licenca: '&cO site nao reconheceu este servidor: o IP e a porta precisam ser os da licenca.'
  Grande: '&cO pacote passa do limite da hospedagem: &f{erro}&c Reduza as texturas ou use um link seu em &fUrl externa&c.'
  Falhou: '&cNao foi possivel subir o pacote: &f{erro}&c. Ele continua saindo pela hospedagem deste servidor.'
  Modo nao usa: '&eO pacote subiu, mas &fHospedagem.Modo&e esta em &f{modo}&e: troque para &fAUTO&e ou &fPREMIUM&e no config.yml para os jogadores baixarem de la.'
  Externa em uso: '&eO pacote subiu, mas este servidor usa o link de &fUrl externa&e, que tem prioridade: apague-o do config.yml para os jogadores baixarem da StarPlugins.'
  Porta trocada: |-
    &eA porta &f{pedida}&e ja esta em uso nesta maquina (outro servidor?). O pacote esta saindo pela &f{porta}&e.
    &7Para quem entra de fora conseguir baixar:
    &f1) &7Servidor no seu PC ou numa maquina so sua: libere a &f{porta}&7 (TCP) no firewall/roteador.
    &f2) &7Hospedagem com portas contadas: crie uma porta extra no painel dela e ponha em &fHospedagem.Porta&7.
    &f3) &7Sem porta extra: suba o &fpacote/pacote.zip&7 num site seu e use &fHospedagem.Modo: EXTERNA&7.
  Sem porta: |-
    &cNenhuma porta livre de &f{pedida}&c a &f{ultima}&c: o pacote esta montado, mas ninguem consegue baixar.
    &f1) &7Feche o que estiver usando essas portas, ou troque &fHospedagem.Porta&7 no config.yml.
    &f2) &7Hospedagem com portas contadas: crie uma porta extra no painel dela e ponha em &fHospedagem.Porta&7.
    &f3) &7Sem porta extra: suba o &fpacote/pacote.zip&7 num site seu e use &fHospedagem.Modo: EXTERNA&7.

