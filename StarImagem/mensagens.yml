  Recarregado: '&aRecarregado: {telas} tela(s), {avisos} aviso(s) no console.'

Editor:
  Ligado: |-
    &aModo edicao LIGADO. &7Olhe para a tela:
    &f  esquerdo &7em dois cantos: escolher o que colocar ali (area, botao, texto, imagem...)
    &f  direito &7em cima de algo: editar (acoes, dica, mover, apagar) &8| &fdireito &7no vazio: menu da pagina
    &f  agachado + clique&7: apagar &8| &f/imagem editar desfazer &7volta &8| &f/imagem editar &7desliga
  Desligado: '&7Modo edicao desligado.'
  Pequena: '&cPedaco pequeno demais. Marque dois cantos mais afastados.'
  Digite a acao: '&aPedaco marcado &7(x {x}, y {y}, {largura}x{altura}). &fEscolha no menu o que colocar &7(ou feche e digite a acao no chat, ex.: &fcomando: warp loja&7).'
  Nada aqui: '&7Nao ha nada para apagar embaixo do cursor.'
  Movido: '&f{id} &amudou de lugar. &7(/imagem editar desfazer)'
  Criada: '&aArea &f{id} &acriada na tela &f{tela} &a({acoes} acao(oes)).'
  Apagada: '&f{id} &eapagado. &7(/imagem editar desfazer)'
  Desfeito: '&aDesfeito.'
  Nada para desfazer: '&7Nada para desfazer.'
  So areas: '&7Agachado + clique apaga so areas criadas no modo edicao (o resto se edita no arquivo ou no painel).'
  Cancelado: '&7Cancelado.'
  Componente: '&b{tipo} &f{id} &7em x {x}, y {y} ({largura}x{altura}), {acoes} acao(oes).'

