Ajuda:
  Titulo: '&8&m          &r &b&lStarImagem &8&m          '
  Linha: ' &b/{comando} {sub} &7{uso} &8- &f{descricao}'
  Menu: ' &a/{comando} &7sozinho abre o menu: tudo daqui em botoes, sem decorar comando.'
  criar: 'Cria uma tela. Com uma pasta de imagens: uma pagina por imagem, com setas.'
  colocar: 'Coloca a tela: depois clique com o direito na parede (canto superior esquerdo).'
  cancelar: 'Desiste do /imagem colocar.'
  remover: 'Tira a tela que voce esta olhando (ou pelo numero).'
  trocar: 'Troca a tela que voce esta olhando por outra.'
  info: 'Dados da tela olhada (ou de uma tela pelo id): paginas, avisos, imagens faltando.'
  lista: 'Telas criadas e telas colocadas.'
  tablet: 'Da o tablet de uma tela (mapa na mao, cursor pelo olhar).'
  editar: 'Modo edicao: marque dois cantos e escolha no menu o que colocar; direito edita, agachado+clique apaga.'
  pagina: 'Muda a pagina de uma tela colocada (otimo para apresentacao com tela compartilhada).'
  imagens: 'Lista os arquivos da pasta imagens/.'
  sincronizar: 'Sincroniza agora com o painel do site.'
  recarregar: 'Rele config, mensagens, telas e imagens.'
  ajuda: 'Esta lista.'

Etiquetas:
  Centro: 'no meio da tela'
