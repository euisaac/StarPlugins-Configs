    &7Jogadores usando: &f{sessoes} &8| &7sua pagina: &f{pagina} &8| &7cursor: &f{cursor}
  Info tela: |-
    &bTela {tela} &8- &f{nome}
    &7Tamanho: &f{tamanho} mapas ({pixels} px) &8| &7paginas: &f{paginas} &8| &7componentes: &f{componentes}
    &7FPS: &f{fps} &8| &7raio: &f{raio} &8| &7alcance: &f{alcance} &8| &7compartilhada: {compartilhada}
