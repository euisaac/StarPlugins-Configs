# ==========================================================================
#  StarMineradora - as telas
#
#  Material passa pelo XSeries: o mesmo nome funciona na 1.8 e na 1.21.
# ==========================================================================

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

Versao do modelo: 4

Principal:
  Titulo: '&8Mineradora'
  Linhas: 3
  Enfeite:
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
  Informacao:
    Slot: 13
    Material: PAPER
    Nome: '&f{tipo}'
    Lore:
      - '&7Estado: &f{estado}'
      - '&7Progresso: &f{progresso}%'
      - '&7Blocos minerados: &f{blocos}'
      - '&7Combustivel: &f{combustivel}/{combustivel_max}'
  Iniciar Montagem:
    Slot: 11
    Material: LIME_STAINED_GLASS_PANE
    Nome: '&a&lINICIAR MONTAGEM'
    Lore:
      - '&7A estrutura comeca a subir'
      - '&7sozinha, bloco a bloco.'
  Iniciar Mineracao:
    Slot: 11
    Material: LIME_STAINED_GLASS_PANE
    Nome: '&a&lINICIAR MINERACAO'
    Lore:
      - '&7O poco comeca a descer'
      - '&7sozinho, camada por camada.'
  Pausar:
    Slot: 11
    Material: YELLOW_STAINED_GLASS_PANE
    Nome: '&e&lPAUSAR MINERACAO'
    Lore:
      - '&7Para a escavacao onde'
      - '&7esta, sem perder o progresso.'
  Despausar:
    Slot: 11
    Material: LIME_STAINED_GLASS_PANE
    Nome: '&a&lDESPAUSAR MINERACAO'
    Lore:
      - '&7A mineracao esta pausada.'
      - '&7Clique para continuar de'
      - '&7onde parou.'
  Configurar Saida:
    Slot: 15
    Material: HOPPER
    Nome: '&e&lCONFIGURAR SAIDA'
    Lore:
      - '&7Escolha o que sai por'
      - '&7cada lado da estrutura.'
  Desmontar:
    Slot: 17
    Material: RED_STAINED_GLASS_PANE
    Nome: '&c&lDESMONTAR'
    Lore:
      - '&7Remove so a ESTRUTURA do mundo.'
      - '&7A maquina continua no lugar --'
      - '&7monte de novo quando quiser.'
  Pegar:
    Slot: 17
    Material: BARRIER
    Nome: '&c&lPEGAR MINERADORA'
    Lore:
      - '&7Guarda a mineradora de volta'
      - '&7no seu inventario, em item,'
      - '&7com o combustivel preservado.'
  Comprar Combustivel:
    Slot: 4
    Material: BLAZE_POWDER
    Nome: '&e&lCOMPRAR COMBUSTIVEL'
    Lore:
      - '&7Tanque: &f{combustivel}/{combustivel_max}'
      - ''
      - '&aClique para abrir a loja'
  Fechar:
    Slot: 26
    Material: ARROW
    Nome: '&cFechar'

