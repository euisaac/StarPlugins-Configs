    Nome: '&f{tipo}'
    Lore:
      - '&7Quebrar o bloco da maquina'
      - '&7desmonta a estrutura (se houver)'
      - '&7e devolve a mineradora em item,'
      - '&7com o combustivel preservado.'
      - ''
      - '&7Combustivel: &f{combustivel}/{combustivel_max}'
  Confirmar:
    Slot: 11
    Material: BARRIER
    Nome: '&a&lCONFIRMAR'
    Lore:
      - '&7Desmonta e quebra a mineradora'
      - '&7de vez. Ela volta pro seu'
      - '&7inventario, em item.'
  Cancelar:
    Slot: 15
    Material: ARROW
    Nome: '&cCANCELAR'
    Lore:
      - '&7Nada acontece: a mineradora'
      - '&7continua como estava.'

