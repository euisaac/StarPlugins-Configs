Loja Combustivel:
  Titulo: '&8Comprar combustivel'
  Linhas: 3
  Enfeite:
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
  Informacao:
    Slot: 4
    Material: PAPER
    Nome: '&f{tipo}'
    Lore:
      - '&7Tanque: &f{combustivel}/{combustivel_max}'
      - '&7Moeda: &f{moeda}'
  # Cada opcao aparece como um botao. "Quantidade" e o combustivel creditado; o
  # preco sai sozinho de "Loja.Preco por unidade de combustivel" (config.yml).
  Opcoes:
    - Quantidade: 100
      Slot: 11
      Material: COAL
      Nome: '&a&l+100 COMBUSTIVEL'
      Lore:
        - '&7Preco: &f{preco}'
        - ''
        - '&aClique para comprar'
    - Quantidade: 500
      Slot: 13
      Material: COAL_BLOCK
      Nome: '&a&l+500 COMBUSTIVEL'
      Lore:
        - '&7Preco: &f{preco}'
        - ''
        - '&aClique para comprar'
    - Quantidade: 1000
      Slot: 15
      Material: BLAZE_ROD
      Nome: '&a&l+1000 COMBUSTIVEL'
      Lore:
        - '&7Preco: &f{preco}'
        - ''
        - '&aClique para comprar'
  Voltar:
    Slot: 22
    Material: ARROW
    Nome: '&cVoltar'

Loja Mineradoras:
  Titulo: '&8Loja de mineradoras'
  Linhas: 3
  Enfeite:
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
  # Acrescentado embaixo da lore de cada tipo (a mesma do mineradoras.yml:
  # Item.Lore) so nesta tela -- so aparecem tipos com "Preco na loja" > 0.
  Lore extra:
    - ''
    - '&7Preco: &f{preco}'
    - '&aClique para comprar'
  Fechar:
    Slot: 26
    Material: ARROW
    Nome: '&cFechar'
