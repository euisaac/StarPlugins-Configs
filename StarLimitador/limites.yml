# ============================================================
#  StarLimitador - limites.yml
#
#  Cada CATEGORIA vira uma aba do /limites. Crie quantas quiser.
#    Tipo: BLOCOS    -> blocos colocados (redstone, spawners, baus...)
#          MOBS      -> criaturas que nascem (ovo, spawner, cria, natural)
#          ENTIDADES -> suportes de armadura, molduras, carrinhos, barcos...
#    Area: 1 = o limite vale POR CHUNK; 2 = a cada 2x2 chunks; 3 = 3x3...
#    Padrao (so MOBS): limite de cada mob que NAO esta listado (0 = sem).
#    Limite total: teto somando tudo da categoria na area (0 = sem teto).
#    Mundos: [] = todos; ou a lista dos mundos onde a categoria vale.
#    Slot: onde a categoria aparece no menu principal.
#
#  Cada LINHA (dentro de Limites):
#    Alvos: os blocos/mobs/entidades que ela conta. Pode usar o nome
#           moderno em qualquer versao (REPEATER vale tambem na 1.8) e
#           curinga (*_BUTTON = todos os botoes).
#    Limite: quantos cabem na area.   Bloqueado: true = nao pode de jeito nenhum.
#    Area / Mundos / Icone / Lore: opcionais (sem eles vale o da categoria).
#
#  Nao precisa mexer aqui: a staff edita tudo pelo /limites (botao de
#  modo edicao) ou pelo /limitador.
# ============================================================
