# ------------------------------------------------------------------------
#  StarSkyBlock - os nomes dos comandos
#
#  Aqui você escolhe como os comandos do plugin vão se chamar no seu servidor.
#  Separe os apelidos com | -- o primeiro nome é o principal.
#
#  Deixe uma linha vazia ('') para ficar só com o que já vem no plugin.
#
#  ATENÇÃO: mudança de comando só vale depois de REINICIAR o servidor.
#  Recarregar não troca comando já registrado, e mexer nisso com o servidor
#  no ar deixaria dois nomes vivos ao mesmo tempo.
# ------------------------------------------------------------------------

Versao do modelo: 1

comandos:
  # Já registrados pelo plugin: /ilha, /is, /ilhas, /island, /skyblock, /sb
  ilha: ''

  # Já registrados: /ilhaadmin, /isadmin, /adminilha
  ilhaadmin: ''

  # Já registrados: /starskyblock, /ssb, /starsky
  starskyblock: ''
