# ------------------------------------------------------------------------
#  StarSkyBlock - os biomas que o jogador pode escolher
#
#  Uma lista escrita, e nao "todos os biomas do servidor": a 1.21 tem mais de
#  sessenta, e a maioria nao serve para uma ilha (os do fim do mundo, as
#  cavernas, as variantes de rio). Lista curta e um menu que se usa;
#  sessenta e um menu que se fecha.
#
#  Bioma que nao existe na versao do seu servidor e avisado no console e
#  pulado -- numa 1.8 os que nasceram depois simplesmente nao aparecem.
#
#  Trocar o bioma NAO reseta a ilha: bioma e propriedade da coluna, nao dos
#  blocos, entao repinta-lo nao mexe em nada que o jogador construiu. Por isso
#  o /ilha bioma e de graca e vale a qualquer momento.
#
#  Tudo isto tambem pode ser editado por menu: /starskyblock config
# ------------------------------------------------------------------------

