# ------------------------------------------------------------------------
#  StarSkyBlock - limites de blocos por ilha
#
#  Quantos blocos de cada tipo uma ilha pode ter, contando a ilha inteira
#  (mundo normal, nether e end). É o que segura fazenda de funil, spawner
#  empilhado e redstone pesada.
#
#  Formato:
#    MATERIAL: limite inicial
#
#  A melhoria "limites" do melhorias.yml multiplica todos os limites daqui:
#  com Valor 2, cada limite dobra.
#
#  Zero ou negativo = sem limite. Apague a linha para tirar o limite.
#  Admin e quem tem starskyblock.ignorar não são barrados.
# ------------------------------------------------------------------------

Versao do modelo: 1

Ativar: true

Limites:
  HOPPER: 64
  SPAWNER: 10
  BEACON: 2
  PISTON: 64
  STICKY_PISTON: 64
  OBSERVER: 64
  DISPENSER: 32
  DROPPER: 32
  CHEST: 200
  TRAPPED_CHEST: 32
