# ------------------------------------------------------------------------
#  StarSkyBlock - as missões
#
#  OBJETIVOS: escritos como  TIPO:ALVO:QUANTIDADE  (o alvo aceita QUALQUER).
#  Uma missão pode ter vários; ela só fica pronta quando todos terminam.
#
#  Os 16 tipos:
#    QUEBRAR    COLOCAR    COLHER     MATAR      PESCAR     FABRICAR
#    FUNDIR     ENCANTAR   FERMENTAR  DOMAR      TOSQUIAR   VENDER
#    ENTREGAR   GERAR      NIVEL      TEMPO
#
#  Nos tipos NIVEL e TEMPO o alvo não existe: escreva  NIVEL:25.
#
#  FREQUENCIA:
#    UNICA      termina e acabou (a trilha de conquistas)
#    DIARIA     zera na virada do dia
#    SEMANAL    zera na virada da semana
#    INFINITA   termina, paga, SOBE DE NÍVEL e recomeça maior
#
#  As diárias e semanais zeram pela data, e não por tarefa agendada: servidor
#  desligado na virada (ou fora do ar por dias) zera certo sozinho.
#
#  DE QUEM:
#    ILHA       todo mundo empurra o mesmo número, e o prêmio é da ilha
#    JOGADOR    cada um tem o seu
#
#  Use os dois. Missão de ilha faz o time trabalhar junto; a de jogador
#  impede que o veterano termine tudo antes de o novato chegar.
#
#  Tudo isto também pode ser editado por menu: /starskyblock config
# ------------------------------------------------------------------------

Versao do modelo: 1

# Avisar na barra de ação a cada avanço. Desligue num servidor muito cheio.
Avisar a cada avanco: true

# A ordem das abas no menu de missões. Categoria que não estiver aqui entra
# no fim, na ordem em que aparecer.
Ordem das categorias:
  - comeco
  - mineracao
  - fazenda
  - combate
  - ilha

Missoes:

  # ====================================================================
  #  Começo -- a trilha do primeiro dia
  # ====================================================================

  primeira-arvore:
    Categoria: comeco
    Nome: '&aA primeira árvore'
    Icone: OAK_SAPLING
    Descricao:
      - '&7Toda ilha começa com uma árvore.'
      - '&7Corte a sua e plante outra.'
    Frequencia: UNICA
    De quem: ILHA
    Objetivos:
      - 'QUEBRAR:OAK_LOG:10'
      - 'COLOCAR:OAK_SAPLING:1'
    Recompensa:
      Dinheiro: 250
      Experiencia da ilha: 10
      Cristais: 1
      Itens:
        - 'OAK_SAPLING:2'
      Mensagem:
        - '&a&lMISSÃO! &7Você plantou a semente do seu futuro.'

  primeiro-gerador:
    Categoria: comeco
    Nome: '&7O gerador'
    Icone: COBBLESTONE
    Descricao:
      - '&7Água e lava juntas viram pedra.'
      - '&7É a mina da sua ilha.'
    Frequencia: UNICA
    De quem: ILHA
    Objetivos:
      - 'GERAR:QUALQUER:64'
    Exige:
      - primeira-arvore
    Recompensa:
      Dinheiro: 500
      Experiencia da ilha: 15
      Cristais: 2
      Itens:
        - 'STONE_PICKAXE:1:EFFICIENCY:1'

  primeira-fazenda:
    Categoria: comeco
    Nome: '&6A primeira fazenda'
    Icone: WHEAT
    Descricao:
      - '&7Plante, espere e colha.'
      - '&7Só conta o que está no ponto.'
    Frequencia: UNICA
    De quem: ILHA
    Objetivos:
      - 'COLHER:WHEAT:32'
    Recompensa:
      Dinheiro: 400
      Experiencia da ilha: 12
      Cristais: 1
      Itens:
        - 'BREAD:16'

  # ====================================================================
  #  Mineração
  # ====================================================================

  minerador:
    Categoria: mineracao
    Nome: '&7Minerador'
    Icone: IRON_PICKAXE
    Descricao:
      - '&7Quebre pedra. Muita pedra.'
      - ''
      - '&e&lINFINITA &7- cada nível pede mais e paga mais.'
    Frequencia: INFINITA
    De quem: JOGADOR
    Objetivos:
      - 'QUEBRAR:COBBLESTONE:500'
    Infinita:
      # Nível 1 pede 500; nível 2 pede 500 x 1.7; e assim por diante.
      Fator da meta: 1.7
      Acrescimo da meta: 0
      # Zero é sem teto.
      Nivel maximo: 0
      Fator do premio: 1.6
    Recompensa:
      Dinheiro: 300
      Experiencia da ilha: 8
      Cristais: 1

  cacador-de-ferro:
    Categoria: mineracao
    Nome: '&fCaçador de ferro'
    Icone: IRON_INGOT
    Descricao:
      - '&7Melhore o gerador e o ferro começa a sair.'
    Frequencia: INFINITA
    De quem: ILHA
    Objetivos:
      - 'GERAR:IRON_ORE:64'
      - 'FUNDIR:IRON_INGOT:64'
    Infinita:
      Fator da meta: 1.8
      Nivel maximo: 0
      Fator do premio: 1.7
    Recompensa:
      Banco da ilha: 1500
      Experiencia da ilha: 25
      Cristais: 3

  diamante:
