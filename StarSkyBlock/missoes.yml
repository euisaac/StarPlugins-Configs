# ------------------------------------------------------------------------
#  StarSkyBlock - as missoes
#
#  OBJETIVOS: escritos como  TIPO:ALVO:QUANTIDADE  (o alvo aceita QUALQUER).
#  Uma missao pode ter varios; ela so fica pronta quando todos terminam.
#
#  Os 16 tipos:
#    QUEBRAR    COLOCAR    COLHER     MATAR      PESCAR     FABRICAR
#    FUNDIR     ENCANTAR   FERMENTAR  DOMAR      TOSQUIAR   VENDER
#    ENTREGAR   GERAR      NIVEL      TEMPO
#
#  Nos tipos NIVEL e TEMPO o alvo nao existe: escreva  NIVEL:25.
#
#  FREQUENCIA:
#    UNICA      termina e acabou (a trilha de conquistas)
#    DIARIA     zera na virada do dia
#    SEMANAL    zera na virada da semana
#    INFINITA   termina, paga, SOBE DE NIVEL e recomeca maior
#
#  As diarias e semanais zeram pela data, e nao por tarefa agendada: servidor
#  desligado na virada (ou fora do ar por dias) zera certo sozinho.
#
#  DE QUEM:
#    ILHA       todo mundo empurra o mesmo numero, e o premio e da ilha
#    JOGADOR    cada um tem o seu
#
#  Use os dois. Missao de ilha faz o time trabalhar junto; a de jogador
#  impede que o veterano termine tudo antes de o novato chegar.
#
#  Tudo isto tambem pode ser editado por menu: /starskyblock config
# ------------------------------------------------------------------------

Versao do modelo: 1

# Avisar na barra de acao a cada avanco. Desligue num servidor muito cheio.
Avisar a cada avanco: true

# A ordem das abas no menu de missoes. Categoria que nao estiver aqui entra
# no fim, na ordem em que aparecer.
Ordem das categorias:
  - comeco
  - mineracao
  - fazenda
  - combate
  - ilha

Missoes:

  # ====================================================================
  #  Comeco -- a trilha do primeiro dia
  # ====================================================================

  primeira-arvore:
    Categoria: comeco
    Nome: '&aA primeira arvore'
    Icone: OAK_SAPLING
    Descricao:
      - '&7Toda ilha comeca com uma arvore.'
      - '&7Corte a sua e plante outra.'
    Frequencia: UNICA
    De quem: ILHA
    Objetivos:
      - 'QUEBRAR:OAK_LOG:10'
      - 'COLOCAR:OAK_SAPLING:1'
    Recompensa:
      Dinheiro: 250
      Experiencia da ilha: 10
      Cristais: 1
      Itens:
        - 'OAK_SAPLING:2'
      Mensagem:
        - '&a&lMISSAO! &7Voce plantou a semente do seu futuro.'

  primeiro-gerador:
    Categoria: comeco
    Nome: '&7O gerador'
    Icone: COBBLESTONE
    Descricao:
      - '&7Agua e lava juntas viram pedra.'
      - '&7E a mina da sua ilha.'
    Frequencia: UNICA
    De quem: ILHA
    Objetivos:
      - 'GERAR:QUALQUER:64'
    Exige:
      - primeira-arvore
    Recompensa:
      Dinheiro: 500
      Experiencia da ilha: 15
      Cristais: 2
      Itens:
        - 'STONE_PICKAXE:1:EFFICIENCY:1'

  primeira-fazenda:
    Categoria: comeco
    Nome: '&6A primeira fazenda'
    Icone: WHEAT
    Descricao:
      - '&7Plante, espere e colha.'
      - '&7So conta o que esta no ponto.'
    Frequencia: UNICA
    De quem: ILHA
    Objetivos:
      - 'COLHER:WHEAT:32'
    Recompensa:
      Dinheiro: 400
      Experiencia da ilha: 12
      Cristais: 1
      Itens:
        - 'BREAD:16'

  # ====================================================================
  #  Mineracao
  # ====================================================================

  minerador:
    Categoria: mineracao
    Nome: '&7Minerador'
    Icone: IRON_PICKAXE
    Descricao:
      - '&7Quebre pedra. Muita pedra.'
      - ''
      - '&e&lINFINITA &7- cada nivel pede mais e paga mais.'
    Frequencia: INFINITA
    De quem: JOGADOR
    Objetivos:
      - 'QUEBRAR:COBBLESTONE:500'
    Infinita:
      # Nivel 1 pede 500; nivel 2 pede 500 x 1.7; e assim por diante.
      Fator da meta: 1.7
      Acrescimo da meta: 0
      # Zero e sem teto.
      Nivel maximo: 0
      Fator do premio: 1.6
    Recompensa:
      Dinheiro: 300
      Experiencia da ilha: 8
      Cristais: 1

  cacador-de-ferro:
    Categoria: mineracao
    Nome: '&fCacador de ferro'
    Icone: IRON_INGOT
    Descricao:
      - '&7Melhore o gerador e o ferro comeca a sair.'
    Frequencia: INFINITA
    De quem: ILHA
    Objetivos:
      - 'GERAR:IRON_ORE:64'
      - 'FUNDIR:IRON_INGOT:64'
    Infinita:
      Fator da meta: 1.8
      Nivel maximo: 0
      Fator do premio: 1.7
    Recompensa:
      Banco da ilha: 1500
      Experiencia da ilha: 25
      Cristais: 3

  diamante:
