# ------------------------------------------------------------------------
#  StarSkyBlock - os tipos de ilha
#
#  Cada modelo aponta para um arquivo dentro da pasta 'modelos/'. Dois
#  formatos são aceitos:
#
#    .ilha       o formato do próprio plugin. Não precisa de nada instalado
#                e não se importa com a versão em que foi salvo. Você cria o
#                seu dentro do jogo:
#
#                  /ilhaadmin salvarmodelo <nome>
#
#                (marque os dois cantos com a varinha antes -- veja o comando)
#
#    .schem      o do WorldEdit, lido quando o WorldEdit está instalado.
#                Serve para quem já tem uma biblioteca de ilhas pronta.
#                Aviso honesto: o conteúdo dos baús NÃO atravessa nesse
#                formato. Se o seu modelo precisa de baú cheio, salve pelo
#                formato próprio -- ele guarda os itens inteiros.
#
#  Escrever o nome sem extensão faz o plugin procurar nas duas.
#
#  Nether e end são opcionais: deixe em branco e a ilha simplesmente não
#  terá aquela dimensão.
#
#  Tudo isto também pode ser editado por menu: /starskyblock config
# ------------------------------------------------------------------------

Versao do modelo: 1

Modelos:

  planicie:
    Nome: '&aPlanície'
    Icone: GRASS_BLOCK
    Slot: 11
    Descricao:
      - '&7A ilha clássica: um pedaço de terra,'
      - '&7uma árvore e o que você fizer daí.'
      - ''
      - '&7Boa para quem está começando.'
    # Vazio libera para todo mundo.
    Permissao: ''

    Arquivo: 'planicie'
    Arquivo do nether: 'planicie_nether'
    Arquivo do end: 'planicie_end'

    Bioma: PLAINS
    Bioma do nether: NETHER_WASTES
    Bioma do end: THE_END

    # Onde o jogador nasce, contando a partir da origem do modelo.
    Casa:
      X: 0.5
      Y: 1.0
      Z: 0.5
      Direcao: 0

  cogumelo:
    Nome: '&dCogumelo'
    Icone: RED_MUSHROOM_BLOCK
    Slot: 13
    Descricao:
      - '&7Uma ilha de micélio, com cogumelo'
      - '&7gigante no lugar da árvore.'
      - ''
      - '&7Mais difícil: não tem madeira de graça.'
    Permissao: ''

    Arquivo: 'cogumelo'
    Arquivo do nether: 'cogumelo_nether'
    Arquivo do end: 'cogumelo_end'

    Bioma: MUSHROOM_FIELDS
    Bioma do nether: NETHER_WASTES
    Bioma do end: THE_END

    Casa:
      X: 0.5
      Y: 1.0
      Z: 0.5
      Direcao: 0

  # Exemplo de modelo só para quem tem uma permissão -- um modelo de VIP, por
  # exemplo. Ele aparece na lista para todos, mas só quem tem a permissão
  # consegue escolher.
  deserto:
    Nome: '&eDeserto'
    Icone: SAND
    Slot: 15
    Descricao:
      - '&7Areia, cacto e nada mais.'
      - ''
      - '&7O começo mais duro que existe.'
      - '&6Exclusivo para VIP.'
    Permissao: 'starskyblock.modelo.deserto'

    Arquivo: 'deserto'
    Arquivo do nether: ''
    Arquivo do end: ''

    Bioma: DESERT
    Bioma do nether: ''
    Bioma do end: ''

    Casa:
      X: 0.5
      Y: 1.0
      Z: 0.5
      Direcao: 0
