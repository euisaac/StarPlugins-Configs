    &f/ilha warp minhas|criar|apagar [nome] &8- &7os da sua ilha
    &7(ou uma placa com &f[warp] &7na 1ª linha e o nome na 2ª)
    &8&m-------- &foutros &8--------
    &f/ilha visitar [jogador] &8- &7conhece outra ilha
    &f/ilha avaliar <1-5> &8- &7dá nota para a ilha que visita
    &f/ilha top &8- &7o ranking das ilhas
    &f/ilha chat &8- &7fala só com a sua ilha
    &f/ilha voar &8- &7voa dentro da ilha
    &f/ilha resetar &8- &7começa tudo de novo
    &f/ilha apagar &8- &7acaba com a ilha (só o dono)
    &8&m---------------------------------
  Admin: |
    &8&m---------------------------------
    &c&lADMINISTRAÇÃO DAS ILHAS
    &f/ilhaadmin listar &8- &7números do servidor
    &f/ilhaadmin info <jogador>
    &f/ilhaadmin ir <jogador> [nether|end]
    &f/ilhaadmin resetar <jogador>
    &f/ilhaadmin apagar <jogador>
    &f/ilhaadmin dono <jogador> <novo dono>
    &f/ilhaadmin adicionar <jogador> <dono da ilha> &8- &7põe no time
    &f/ilhaadmin remover <jogador> &8- &7tira do time
    &f/ilhaadmin modelo <jogador> <id do modelo>
    &f/ilhaadmin nivel <jogador> <número>
    &f/ilhaadmin melhoria <jogador> <id> <nível>
    &f/ilhaadmin liberar <jogador> <nether|end>
    &f/ilhaadmin borda <jogador> <cor>
    &f/ilhaadmin banco <jogador> <dar|tirar|definir> <valor>
    &f/ilhaadmin cristais <jogador> <quantidade>
    &f/ilhaadmin experiencia <jogador> <quantidade>
    &f/ilhaadmin calcular <jogador> &8- &7reconta a ilha
    &f/ilhaadmin calculartodas &8- &7reconta todas, uma de cada vez
    &f/ilhaadmin desbanir <jogador> <banido>
    &f/ilhaadmin espiar &8- &7vê o chat de todas as ilhas
    &f/ilhaadmin aviso <jogador> <mensagem> &8- &7fala com o time
    &f/ilhaadmin inativas <dias> [apagar] &8- &7ilhas paradas
    &8&m-------- &fmodelos de ilha &8--------
    &f/ilhaadmin varinha &8- &7a varinha que marca os cantos
    &f/ilhaadmin pos1|pos2 &8- &7marca um canto sem a varinha
    &f/ilhaadmin salvarmodelo <nome>
    &7Fique de pé onde a ilha deve nascer antes de salvar.
    &8&m---------------------------------
  Produto: |
    &8&m---------------------------------
    &e&lStarSkyBlock &7v{versao}
    &7Ilhas: &f{ilhas} &8| &7Modelos: &f{modelos}
    &f/starskyblock config &8- &7edita tudo por menu
    &f/starskyblock versao &8- &7esta tela
    &f/starskyblock recarregar &8- &7lê os arquivos de novo
    &f/starskyblock salvar &8- &7grava as ilhas agora
    &7Desenvolvido por EuIsaac
    &8&m---------------------------------

# A ferramenta de salvar modelos de ilha (/ilhaadmin varinha).
Modelo:
  Varinha entregue: |
    &aPronto, a varinha está no seu inventário.
    &7Clique &fesquerdo &7num canto e &fdireito &7no outro.
    &7Depois fique de pé onde a ilha deve nascer e use &f/ilhaadmin salvarmodelo <nome>&7.
  Primeiro canto: '&aPrimeiro canto em &f{x}, {y}, {z}&a. &7Seleção: &f{volume} &7blocos.'
  Segundo canto: '&aSegundo canto em &f{x}, {y}, {z}&a. &7Seleção: &f{volume} &7blocos.'
  Sem selecao: '&cMarque os dois cantos antes. Use &f/ilhaadmin varinha&c.'
  Nome invalido: '&cUse só letras, números, - e _ no nome do modelo.'
  Selecao grande demais: '&cA seleção tem &f{volume} &cblocos. O limite é 2.000.000.'
  Salvo: |
    &aModelo &f{nome} &asalvo!
    &7Blocos: &f{blocos} &8| &7materiais diferentes: &f{paleta}
    &7Agora aponte um modelo do &fmodelos.yml &7para o arquivo &f{nome}&7.
  Falhou: '&cNão consegui salvar o modelo: &f{erro}'

