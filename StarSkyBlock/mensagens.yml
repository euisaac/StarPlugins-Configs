# ------------------------------------------------------------------------
#  StarSkyBlock - todo texto que o plugin fala
#
#  Mensagem vazia ('') nao e enviada: e assim que voce desliga um aviso sem
#  precisar de uma opcao para cada um.
#
#  Cores: use &a, &e, &c... e tambem &#RRGGBB nas versoes 1.16+.
#  Em titulo, <nl> separa o titulo do subtitulo.
# ------------------------------------------------------------------------

Versao do modelo: 1

Prefixo: '&e&lSKYBLOCK &8| &f'

