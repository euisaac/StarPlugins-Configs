    &c&lADMINISTRACAO DAS ILHAS
    &f/ilhaadmin listar &8- &7numeros do servidor
    &f/ilhaadmin ir <jogador>
    &f/ilhaadmin info <jogador>
    &f/ilhaadmin resetar <jogador>
    &f/ilhaadmin apagar <jogador>
    &f/ilhaadmin dono <jogador> <novo dono>
    &f/ilhaadmin fase <jogador> <fase>
    &f/ilhaadmin nivel <jogador> <numero>
    &f/ilhaadmin banco <jogador> <dar|tirar|definir> <valor>
    &f/ilhaadmin desbanir <jogador> <banido>
    &8&m---------------------------------
  Produto: |
    &8&m---------------------------------
    &e&lStarSkyBlock &7v{versao}
    &7Ilhas: &f{ilhas} &8| &7Modelos: &f{modelos}
    &f/starskyblock config &8- &7edita tudo por menu
    &f/starskyblock recarregar &8- &7le os arquivos de novo
    &f/starskyblock salvar &8- &7grava as ilhas agora
    &7Desenvolvido por EuIsaac
    &8&m---------------------------------

# A ferramenta de salvar modelos de ilha (/ilhaadmin varinha).
Modelo:
  Varinha entregue: |
    &aPronto, a varinha esta no seu inventario.
    &7Clique &fesquerdo &7num canto e &fdireito &7no outro.
    &7Depois fique de pe onde a ilha deve nascer e use &f/ilhaadmin salvarmodelo <nome>&7.
  Primeiro canto: '&aPrimeiro canto em &f{x}, {y}, {z}&a. &7Selecao: &f{volume} &7blocos.'
  Segundo canto: '&aSegundo canto em &f{x}, {y}, {z}&a. &7Selecao: &f{volume} &7blocos.'
  Sem selecao: '&cMarque os dois cantos antes. Use &f/ilhaadmin varinha&c.'
  Nome invalido: '&cUse so letras, numeros, - e _ no nome do modelo.'
  Selecao grande demais: '&cA selecao tem &f{volume} &cblocos. O limite e 2.000.000.'
  Salvo: |
    &aModelo &f{nome} &asalvo!
    &7Blocos: &f{blocos} &8| &7materiais diferentes: &f{paleta}
    &7Agora aponte um modelo do &fmodelos.yml &7para o arquivo &f{nome}&7.
  Falhou: '&cNao consegui salvar o modelo: &f{erro}'

# Os titulos das telas. O menus.yml pode ganhar de qualquer um deles: o que
# estiver escrito la vale; o que ficar vazio la cai aqui.
