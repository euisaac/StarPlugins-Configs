# O que os placeholders respondem quando o jogador ainda não tem ilha.
#
# São dois de propósito: numa scoreboard, "Nível: 0" fica certo e
# "Nível: Sem Info" fica torto. Deixe '' em qualquer um para a linha sair
# em branco.
Placeholder:
  Sem ilha: '&cSem Info'
  Sem ilha nos numeros: '0'

