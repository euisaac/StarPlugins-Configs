  Principal: '&8{ilha}'
  Missoes: '&8Missoes'
  Modelos: '&8Tipos de ilha'
  Membros: '&8Membros da ilha'
  Melhorias: '&8Melhorias da ilha'
  Banco: '&8Banco da ilha'
  Loja: '&8Loja da ilha'
  Bandeiras: '&8Regras da ilha'
  Cargos: '&8Cargos da ilha'
  Warps: '&8Warps da ilha'
  Top: '&8Ranking das ilhas'
  Visitas: '&8Ilhas abertas'
  Banidos: '&8Barrados na ilha'
  Confirmar: '&8Tem certeza?'
  Configuracao: '&8Configuracao'
  Editor: '&8Editor'

  # As perguntas da tela de confirmar.
  Confirmar reset: 'Isso apaga a sua ilha inteira e comeca do zero.'
  Confirmar modelo: 'Isso refaz a sua ilha com o modelo {modelo}. Tudo que esta la se perde.'
  Confirmar expulsar: 'Tirar {jogador} da ilha.'

# O que os placeholders respondem quando o jogador ainda nao tem ilha.
#
# Sao dois de proposito: numa scoreboard, "Nivel: 0" fica certo e
# "Nivel: Sem Info" fica torto. Deixe '' em qualquer um para a linha sair
# em branco.
Placeholder:
  Sem ilha: '&cSem Info'
  Sem ilha nos numeros: '0'

