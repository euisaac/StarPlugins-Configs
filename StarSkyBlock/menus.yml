# ------------------------------------------------------------------------
#  StarSkyBlock - o desenho de TODAS as telas
#
#  Cada tela tem:
#
#    Titulo    o texto do topo ('' usa o do mensagens.yml)
#    Linhas    de 1 a 6 (cada linha tem 9 slots; eles comecam no 0)
#    Enfeite   o vidro que fecha os buracos
#    Slots     onde a lista aparece (so nas telas com lista)
#    Itens     os botoes
#    Modelos   como cada item da lista e escrito, por estado
#
#  Para TIRAR um botao, ponha  Slot: -1  (a configuracao dele fica guardada
#  aqui, esperando o dia em que voce quiser de volta).
#
#  Para POR UM BOTAO SEU em qualquer tela, escreva mais um item com
#  "Comandos" -- veja o exemplo "loja-do-servidor" no menu Principal.
#
#  Todo item aceita:
#    Slot        onde ele fica (-1 desliga)
#    Acao        o que o clique faz (a lista esta em cada tela)
#    Material    o icone ('' deixa o menu escolher: a cabeca do jogador,
#                o item que a loja vende, o icone do modelo...)
#    Nome        o nome do item
#    Lore        as linhas de baixo
#    Brilho      true da o brilho de encantado
#    Permissao   so quem tem ve o item ('' = todo mundo)
#    Comandos    lista de comandos rodados no clique
#    Fechar      true fecha o menu antes de rodar os comandos
#
#  Os comandos aceitam os mesmos prefixos das recompensas de missao:
#    jogador: loja          console: give {jogador} diamond 1
#    op: gamemode creative  mensagem: &aOi!
#    som: ENTITY_PLAYER_LEVELUP    titulo: &aTitulo<nl>&7Subtitulo
#    link: seusite.com.br          espera: 20
#
#  Tudo isto tambem pode ser editado por menu: /starskyblock config
# ------------------------------------------------------------------------

Versao do modelo: 1

Menus:

  # ====================================================================
  #  O menu do /ilha
  #
  #  Acoes: RETRATO MISSOES MODELOS MEMBROS MELHORIAS BANCO LOJA
  #         BANDEIRAS CARGOS WARPS TOP VISITAS IR CALCULAR RESETAR
  #         FECHAR NENHUMA
  #
  #  Trocas: {ilha} {id} {dono} {descricao} {jogador} {cargo} {modelo}
  #          {bioma} {nivel} {valor} {experiencia} {banco} {cristais}
  #          {barra} {porcento} {falta} {membros} {membros_max} {tamanho}
  #          {warps} {warps_max} {banidos} {missoes} {missoes_prontas}
  #          {gerador} {posicao} {aberta}
  # ====================================================================
  Principal:
    Titulo: '&8{ilha}'
    Linhas: 6
    Enfeite:
      Ativar: true
      Material: GRAY_STAINED_GLASS_PANE
    Itens:

      retrato:
        Slot: 13
        Acao: RETRATO
        Material: PLAYER_HEAD
        Nome: '&6&l{ilha}'
        Lore:
          - '&7Dono: &f{dono}'
          - '&7{descricao}'
          - ''
          - '&7Nivel: &a{nivel}'
          - '{barra} &7{porcento}%'
          - '&7Faltam &f{falta} &7pontos'
          - ''
          - '&7Valor: &a{valor} &8| &7Experiencia: &d{experiencia}'
          - '&7Banco: &6{banco} &8| &7Cristais: &b{cristais}'
          - '&7Tamanho: &f{tamanho}x{tamanho}'
          - '&7Modelo: &f{modelo}'
          - ''
          - '&7Ilha n&f{id} &8| &7Ranking: &e#{posicao}'

      missoes:
        Slot: 20
        Acao: MISSOES
        Material: BOOK
        Nome: '&b&lMissoes'
        Lore:
          - '&7O que fazer, e o que voce ganha'
          - '&7por ter feito.'
