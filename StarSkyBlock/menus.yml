        Material: EMERALD
        Nome: '&a&lLoja'
        Lore:
          - '&7Venda o que a ilha produz.'
          - '&7O dinheiro cai no banco dela.'
          - ''
          - '&eClique para abrir.'

      regras:
        Slot: 29
        Acao: BANDEIRAS
        Material: REDSTONE_TORCH
        Nome: '&c&lRegras'
        Lore:
          - '&7PvP, mobs, visitantes, redstone...'
          - ''
          - '&eClique para abrir.'

      cargos:
        Slot: 30
        Acao: CARGOS
        Material: NAME_TAG
        Nome: '&d&lCargos'
        Lore:
          - '&7Quem pode fazer o que na ilha.'
          - ''
          - '&eClique para abrir.'

      warps:
        Slot: 31
        Acao: WARPS
        Material: ENDER_PEARL
        Nome: '&5&lWarps'
        Lore:
          - '&7Pontos salvos: &f{warps}&7/&f{warps_max}'
          - ''
          - '&eClique para abrir.'

      modelos:
        Slot: 32
        Acao: MODELOS
        Material: STRUCTURE_BLOCK
        Nome: '&3&lTipo de ilha'
        Lore:
          - '&7O seu: &f{modelo}'
          - ''
          - '&cTrocar refaz a ilha do zero.'
          - ''
          - '&eClique para abrir.'

      ranking:
        Slot: 33
