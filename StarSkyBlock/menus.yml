        Material: PLAYER_HEAD
        Nome: '&a&lMembros'
        Lore:
          - '&7Gente na ilha: &f{membros}&7/&f{membros_max}'
          - ''
          - '&eClique para abrir.'

      melhorias:
        Slot: 22
        Acao: MELHORIAS
        Material: ANVIL
        Nome: '&e&lMelhorias'
        Lore:
          - '&7Gaste o banco da ilha para'
          - '&7crescer, caber mais e minerar melhor.'
          - ''
          - '&7Gerador: &fnivel {gerador}'
          - ''
          - '&eClique para abrir.'

      banco:
        Slot: 23
        Acao: BANCO
        Material: GOLD_INGOT
        Nome: '&6&lBanco'
        Lore:
          - '&7Saldo: &f{banco}'
          - '&7Cristais: &b{cristais}'
          - ''
          - '&eClique para abrir.'

      loja:
