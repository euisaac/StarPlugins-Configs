          - '&7Reconta bloco por bloco.'
          - ''
          - '&7So e preciso se o valor parecer'
          - '&7errado -- a contagem do dia a dia'
          - '&7ja acompanha tudo sozinha.'
          - ''
          - '&eClique para recontar.'

      resetar:
        Slot: 42
        Acao: RESETAR
        Material: TNT
        Nome: '&4&lResetar a ilha'
        Lore:
          - '&cApaga tudo e comeca do zero.'
          - '&cNao tem volta.'
          - ''
          - '&eClique para comecar.'

      fechar:
        Slot: 49
        Acao: FECHAR
        Material: BARRIER
        Nome: '&c&lFechar'
