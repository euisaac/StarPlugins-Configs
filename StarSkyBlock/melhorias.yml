# ------------------------------------------------------------------------
#  StarSkyBlock - as melhorias da ilha
#
#  Cada melhoria é uma escada: o nível 0 é o 'Valor inicial' (o que a ilha já
#  tem de graça) e cada degrau tem um Custo e um Valor novo.
#
#  Os ids abaixo são os que o plugin entende. Você pode mudar nome, ícone,
#  preços, valores e quantos degraus quiser -- mas não os ids.
#
#    tamanho       lado do quadrado protegido (e da borda), em blocos
#    membros       quantas pessoas cabem na ilha (contando o dono)
#    gerador       o nível do gerador de pedra (ver geradores.yml)
#    mobs          teto de mobs vivos por pedaço da ilha
#    funis         funis por pedaço
#    multiplicador multiplica o que a loja da ilha paga
#    plantacoes    acelera as plantações (1.5 = metade das vezes cresce 2x)
#    spawners      acelera os spawners (2 = o dobro de mobs)
#    drops         multiplica o que os mobs soltam (e a experiência)
#    efeitos       efeitos de poção para o time dentro da ilha (veja abaixo)
#    warps         quantos warps a ilha pode ter
#    banco         teto do banco da ilha (0 = sem teto)
#    bau           linhas do baú da ilha, de 1 a 6 (0 = sem baú)
#    cooperados    quantos cooperados a ilha pode ter ao mesmo tempo
#    limites       multiplica todos os limites do limites.yml
#
#  O 'gerador' e o 'efeitos' não usam o Valor: o do gerador é a tabela do
#  geradores.yml, e o do efeitos é a lista 'Efeitos' de cada degrau.
#
#  Cada degrau aceita também:
#    Nivel da ilha: 10       a ilha precisa estar nesse nível para comprar
#    Permissao: 'vip.algo'   quem compra precisa ter essa permissão
#    Comandos: [...]         comandos rodados na compra ({jogador} {ilha}...)
#
#  Tudo isto também pode ser editado por menu: /starskyblock config
# ------------------------------------------------------------------------

Versao do modelo: 1

# De onde sai o dinheiro de uma melhoria (e de liberar o nether e o end):
#
#   BANCO      do banco da ilha (o padrão -- faz o time trabalhar junto)
#   DINHEIRO   do bolso de quem clicou, pela economia do servidor
#              (Vault, StarEconomia... o que estiver no config.yml)
#   CRISTAIS   dos cristais que as missões pagam
#
# Em DINHEIRO o custo vira mais um sumidouro de moeda do servidor, que é o que
# um servidor com inflação precisa.
Pagar com: BANCO

