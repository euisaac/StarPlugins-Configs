# ------------------------------------------------------------------------
#  StarSkyBlock - as melhorias da ilha
#
#  Cada melhoria e uma escada: o nivel 0 e o 'Valor inicial' (o que a ilha ja
#  tem de graca) e cada degrau tem um Custo (tirado do banco da ilha) e um
#  Valor novo.
#
#  Os ids abaixo sao os que o plugin entende. Voce pode mudar nome, icone,
#  precos, valores e quantos degraus quiser -- mas nao os ids.
#
#    tamanho       lado do quadrado protegido, em blocos
#    membros       quantas pessoas cabem na ilha (contando o dono)
#    gerador       o nivel do gerador de cobblestone (ver geradores.yml)
#    mobs          teto de mobs vivos por pedaco da ilha
#    funis         funis por pedaco
#    multiplicador multiplica o que a loja da ilha paga
#
#  O 'gerador' e o unico cujo Valor nao e usado: o que muda com o nivel dele
#  e a tabela de minerios do geradores.yml. Deixe o Valor igual ao nivel para
#  a lore do menu fazer sentido.
#
#  Tudo isto tambem pode ser editado por menu: /starskyblock config
# ------------------------------------------------------------------------

Versao do modelo: 1

Melhorias:

  tamanho:
    Nome: 'Tamanho da ilha'
    Icone: GRASS_BLOCK
    Slot: -1
    Descricao:
      - '&7Aumenta o quadrado protegido'
