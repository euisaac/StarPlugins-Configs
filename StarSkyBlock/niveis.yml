# ------------------------------------------------------------------------
#  StarSkyBlock - quanto vale cada bloco
#
#  O VALOR da ilha e a soma dos blocos que ela tem, cada um pelo numero
#  abaixo. O NIVEL sai de (valor + experiencia) dividido pelos 'Pontos por
#  nivel'.
#
#  A contagem e mantida a cada bloco colocado e quebrado -- perguntar o nivel
#  de uma ilha nao varre nada. A varredura completa existe para a ilha que
#  veio de outro plugin ou saiu de sincronia, e e sempre pedida:
#
#    /ilha calcular
#
#  Bloco sem valor escrito aqui vale o 'Valor padrao do bloco'. Deixe em zero
#  para que so o que esta na lista conte -- e o que impede o jogador de subir
#  de nivel empilhando terra.
#
#  Tudo isto tambem pode ser editado por menu: /starskyblock config
# ------------------------------------------------------------------------

Versao do modelo: 1

Valor padrao do bloco: 0

# Quantos pontos valem um nivel.
Pontos por nivel: 100

# Quanto a experiencia das missoes pesa no nivel, em relacao ao valor dos
# blocos. 1 quer dizer "um ponto de experiencia vale um ponto de bloco".
Peso da experiencia: 1

