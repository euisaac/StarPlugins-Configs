# ------------------------------------------------------------------------
#  StarSkyBlock - configuração geral
#
#  Cada assunto tem o seu arquivo, para nada ficar perdido no meio de tudo:
#
#    config.yml       este aqui: economia, banco de dados, sons, ranking
#    mundo.yml        o mundo das ilhas, distância e tamanho
#    ilha.yml         criação, kit, membros, teleporte, reset, warps, banco
#    dimensoes.yml    o nether e o end de cada ilha, e os portais
#    borda.yml        a borda colorida em volta da ilha
#    holograma.yml    o letreiro que flutua na entrada da ilha
#    limites.yml      quantos blocos de cada tipo cabem na ilha
#
#    modelos.yml      os tipos de ilha (e os arquivos de cada uma)
#    melhorias.yml    as melhorias compradas pela ilha
#    missoes.yml      as missões
#    niveis.yml       quanto vale cada bloco
#    geradores.yml    o que sai do gerador de pedra
#    loja.yml         a loja da ilha
#    biomas.yml       os biomas que dá para escolher
#    menus.yml        todos os menus
#    mensagens.yml    todas as mensagens
#    comandos.yml     os nomes dos comandos
#
#  Quase tudo também pode ser editado por menu, dentro do jogo:
#  /starskyblock config
# ------------------------------------------------------------------------

Versao do modelo: 1

Debug: false

# A barra que aparece no holograma, nos menus e nos placeholders de barra.
#
# Do jeito que vem: &8[&a██████&7████&8]
#
# Para a barra fina, troque os dois caracteres por | :
#   Cheio: '|'
#   Vazio: '|'
Barra de progresso:
  Prefixo: '&8['
  Sufixo: '&8]'
  Cheio: '█'
  Vazio: '█'
  Tamanho: 10
  Cor cheia: '&a'
  Cor vazia: '&7'

Ranking:
  # NIVEL, VALOR, BANCO, MISSOES ou AVALIACAO.
  Criterio: NIVEL
  Tamanho: 10

Compatibilidade:
  # Além dos placeholders próprios (%starskyblock_...%), responder também aos
  # do formato %skyblock_...% -- os mesmos nomes que outros plugins de ilha
  # usam, para quem está trocando e não quer reescrever a scoreboard.
  Placeholders skyblock: true

Sons:
  Erro: 'ENTITY_VILLAGER_NO;1;1'
  Sucesso: 'ENTITY_PLAYER_LEVELUP;1;1.4'
  Clique: 'UI_BUTTON_CLICK;1;1'
  Nivel: 'UI_TOAST_CHALLENGE_COMPLETE;1;1'
  Missao pronta: 'ENTITY_EXPERIENCE_ORB_PICKUP;1;1.6'
  Missao paga: 'ENTITY_PLAYER_LEVELUP;1;1.2'

Economia:
  # VAULT, STARECONOMIA, PLACEHOLDER ou COMANDO.
  Tipo: VAULT
  Simbolo: '$'
  Moeda do StarEconomia: 'coins'

  # Só para o tipo PLACEHOLDER.
  Placeholder de saldo: ''

  # Só para o tipo COMANDO. {jogador} e {valor} são trocados.
  Comando de retirar: ''
  Comando de dar: ''

Banco de dados:
  # SQLITE ou MYSQL. O SQLite não precisa de nada instalado.
  Tipo: SQLITE
  Prefixo das tabelas: 'starskyblock_'

  Host: localhost
  Porta: 3306
  Banco: minecraft
  Usuario: root
  Senha: ''

  # De quanto em quanto tempo as ilhas que mudaram vão para o banco.
  Salvar a cada segundos: 300
