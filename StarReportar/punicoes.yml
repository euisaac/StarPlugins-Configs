# Punicoes do menu de gerenciar (/reportes -> Q no jogador -> Punir).
# Cada uma com a propria permissao e os comandos que o console roda.
#
# Placeholders dos comandos: {jogador} (reportado), {staff}, {motivos} (todos
# os motivos em aberto contra ele), {motivo} (o ultimo), {punicao}, {id},
# {servidor}, {prova}, {partida}, {replay}.
#
# Troque os comandos pelos do seu plugin de punicoes.

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#       Dono: '{jogador}'   # a cabeca de quem vai ser punido
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

Punicoes:
  aviso:
    Nome: '&eAvisar'
    Permissao: 'starreportar.punicao.aviso'
    Icone:
      Slot: 10
      Material: YELLOW_DYE
      Nome: '&eAvisar &f{jogador}'
      Lore:
        - '&7Da um aviso formal.'
    Comandos:
      - 'warn {jogador} {motivos}'
  mute:
    Nome: '&6Silenciar 1 hora'
    Permissao: 'starreportar.punicao.mute'
    Icone:
      Slot: 11
      Material: ORANGE_DYE
      Nome: '&6Silenciar &f{jogador} &7(1h)'
      Lore:
        - '&7Para ofensa e spam.'
    Comandos:
      - 'tempmute {jogador} 1h {motivos}'
  expulsar:
    Nome: '&cExpulsar'
    Permissao: 'starreportar.punicao.expulsar'
    Icone:
      Slot: 12
      Material: LEATHER_BOOTS
      Nome: '&cExpulsar &f{jogador}'
      Lore:
        - '&7Tira do servidor agora.'
    Comandos:
      - 'kick {jogador} {motivos}'
  banir7:
    Nome: '&4Banir 7 dias'
    Permissao: 'starreportar.punicao.banir7'
    Icone:
      Slot: 14
      Material: IRON_AXE
      Nome: '&4Banir &f{jogador} &7(7 dias)'
      Lore:
        - '&7Anti-jogo, bug, teaming.'
    Comandos:
      - 'tempban {jogador} 7d {motivos}'
  banir30:
    Nome: '&4Banir 30 dias'
    Permissao: 'starreportar.punicao.banir30'
    Icone:
      Slot: 15
      Material: DIAMOND_AXE
      Nome: '&4Banir &f{jogador} &7(30 dias)'
      Lore:
        - '&7Uso de hack.'
    Comandos:
      - 'tempban {jogador} 30d {motivos}'
  banir:
    Nome: '&4&lBanir para sempre'
    Permissao: 'starreportar.punicao.banir'
    Icone:
      Slot: 16
      Material: DIAMOND_AXE
      Nome: '&4&lBanir &f{jogador} &7(permanente)'
      Brilho: true
      Lore:
        - '&7Reincidencia grave.'
    Comandos:
      - 'ban {jogador} {motivos}'
