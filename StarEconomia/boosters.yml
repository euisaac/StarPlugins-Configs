# boosters.yml -- multiplicadores de saldo (boosters), por moeda especifica ou "geral" (todas).
#
# Um booster fica ATIVO para um jogador de tres formas (podem valer ao mesmo tempo):
#   1) Permissao ("permissao" abaixo) -- enquanto o jogador tiver a permissao, o booster fica
#      ligado o tempo todo, sem prazo (ex: perk de um rank VIP no permissions.yml/LuckPerms).
#      Esta e a UNICA forma de um booster ficar "permanente" -- comando e item sao sempre por
#      tempo determinado.
#   2) Comando -- "/stareconomia booster dar <jogador> <id> <tempo>" liga o booster por aquele
#      tempo (o argumento e OBRIGATORIO). O tempo aceita numero+unidade (s=segundos, m=minutos,
#      h=horas, d=dias), combinaveis: "45s", "5m", "1h30m", "2d" -- tem tab-complete com
#      sugestoes prontas. Um numero sozinho (sem letra) ainda e aceito como segundos.
#   3) Item -- com "item.habilitado: true", "/stareconomia booster item <jogador> <id> <tempo>
#      [quantidade]" da um item fisico pro jogador (mesmo formato de tempo do comando acima, e
#      tambem obrigatorio -- cada leva gerada pode ter uma duracao diferente, fica gravada no
#      proprio item). Clicar nele com o botao direito consome 1 unidade e liga o booster por
#      esse tempo. O item guarda o id do booster e a duracao nele mesmo (NBT), entao pode ser
#      vendido/negociado/dropado normalmente ate ser usado -- e o placeholder {tempo} no
#      nome/lore do item (abaixo) mostra a duracao certa de cada leva.
#
# "moeda" filtra em qual moeda o booster vale -- vazio ("") = booster GERAL, vale pra qualquer
# moeda habilitada. "tipos" filtra que TIPO de credito e afetado (ADICIONAR, GANHO, RECEBER,
# GASTO, REMOVER, SETAR, ENVIAR -- vazio = todos); "GANHO" cobre tanto abate (ver "abate:" em
# Economias/<id>.yml) quanto qualquer plugin de loja que credite pelo Vault (EconomyShopGUI-
# Premium, StarLoja etc). "origens" filtra pelo NOME DO PLUGIN de origem do credito (o mesmo nome
# que aparece no historico/log como "Plugin: X", ver history.track-spent) -- vazio = qualquer
# origem, inclusive abate (que nao tem uma origem detectada). Combine "tipos: ['GANHO']" +
# "origens: []" pra um booster que so afeta abate, ou "origens: ['EconomyShopGUI-Premium',
# 'StarLoja']" pra um booster que so afeta vendas dessas lojas especificamente.
#
# Boosters aplicaveis ao mesmo credito SOMAM o "bonus-percentual" entre si (nao multiplicam) --
# dois boosters de +100% ativos ao mesmo tempo dao +200% (x3 no total), nao x4. So afeta
# CREDITOS de verdade (deposito) -- pix entre jogadores (/moeda pagar) nunca e multiplicado.
#
# "duracao-padrao-segundos" so serve de fallback pra quem conceder o booster programaticamente
# (API) sem informar um tempo -- o comando em si SEMPRE exige o tempo, nao usa este valor.
# "item.duracao-segundos" e o mesmo tipo de fallback, mas pro item (usado se algum item antigo,
# gerado antes de existir o argumento de tempo, nao tiver a duracao gravada nele).
#
# Boosters concedidos por comando ou item NAO sobrevivem a um restart do servidor (ficam so em
# memoria, de proposito -- sao temporarios por natureza); os concedidos por permissao (VIP) nao
# dependem disso, voltam sozinhos.
#
# Exemplos abaixo desativados ("ativo: false") -- ajuste, ative e rode "/stareconomia reload".
boosters:
  vip-almas:
    ativo: false
    nome: '&d2x Almas (VIP)'
    moeda: 'almas'
    bonus-percentual: 100.0
    tipos: ['GANHO']
    origens: []
    permissao: 'stareconomia.booster.vip-almas'
    duracao-padrao-segundos: 3600
    item:
      habilitado: true
      material: EXPERIENCE_BOTTLE
      nome: '&d&lBooster: 2x Almas &7({tempo})'
      lore:
        - ''
        - '&7Um frasco de experiencia brilhante,'
        - '&7pulsando com energia das almas.'
        - ''
        - '&fEfeito: &d+100% almas &7(abate)'
        - '&fDuracao: &d{tempo}'
        - ''
        - '&e&lClique direito para ativar!'
      duracao-segundos: 3600

  vendas-em-dobro:
    ativo: false
    nome: '&62x em vendas'
    moeda: ''
    bonus-percentual: 100.0
    tipos: ['GANHO']
    origens: ['EconomyShopGUI-Premium', 'StarLoja']
    permissao: ''
    duracao-padrao-segundos: 1800
    item:
      habilitado: false
      material: EXPERIENCE_BOTTLE
      nome: '&6&lBooster: 2x Vendas &7({tempo})'
      lore:
        - ''
        - '&7Um frasco de experiencia dourado,'
        - '&7cheio de sorte para negociar.'
        - ''
        - '&fEfeito: &6+100% em vendas &7(qualquer moeda)'
        - '&fDuracao: &6{tempo}'
        - ''
        - '&e&lClique direito para ativar!'
      duracao-segundos: 1800
