  historico-truncado: "&7... e mais &f{restante} &7registro(s). Use um plugin de logs para o historico completo."

  uso-banip: "&cUso correto: &e/banip <jogador> <tempo|perm> [motivo]"
  uso-unbanip: "&cUso correto: &e/unbanip <ip|jogador>"
  uso-tempban: "&cUso correto: &e/tempban <jogador> <tempo> [motivo]"
  uso-tempmute: "&cUso correto: &e/tempmute <jogador> <tempo> [motivo]"
  uso-checkban: "&cUso correto: &e/checkban <jogador>"
  uso-checkmute: "&cUso correto: &e/checkmute <jogador>"
  uso-checkbanip: "&cUso correto: &e/checkbanip <ip|jogador>"
