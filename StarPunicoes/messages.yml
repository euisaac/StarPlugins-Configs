# =========================================================
#  StarPunicoes - mensagens (100% em portugues, edite a vontade)
#  Placeholders sao escritos entre chaves, ex: {jogador}
#  Cores usam o padrao '&' do Minecraft.
# =========================================================

prefixo: "&c&lSTARPUNICOES&f "

geral:
  sem-permissao: "&cVoce nao tem permissao para usar este comando."
  jogador-desconhecido: "&cO jogador &e{jogador} &cnunca entrou neste servidor."
