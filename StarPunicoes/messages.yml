  recarregado: "&aConfiguracoes e mensagens recarregadas com sucesso."
  ajuda-titulo: "&8&m----&r &cStarPunicoes &8&m----"
  ajuda-linha: "&7Use &e/starpunicoes reload &7para recarregar as configuracoes."

punicoes:
