  avisos-cabecalho: "&7Avisos de &e{jogador}&7: &f{quantidade}"
  avisos-linha: "&8 - &7[&f{data}&7] &f{autor}&7: &f{motivo}"

  historico-cabecalho: "&7Historico de &e{jogador}&7 (&f{quantidade} &7registros):"
