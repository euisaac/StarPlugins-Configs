  uso-desbanir: "&cUso correto: &e/desbanir <jogador>"
  uso-mutar: "&cUso correto: &e/mutar <jogador> [tempo|perm] [motivo] &7(sem tempo = permanente)"
  uso-desmutar: "&cUso correto: &e/desmutar <jogador>"
  uso-kick: "&cUso correto: &e/kick <jogador> [motivo]"
  uso-avisar: "&cUso correto: &e/avisar <jogador> [motivo]"
  uso-avisos: "&cUso correto: &e/avisos <jogador>"
  uso-historico: "&cUso correto: &e/historico <jogador>"

  ban-tela: |-
    &4&lVoce foi banido!
    &7Motivo: &f{motivo}
    &7Punido por: &f{autor}
    &7Duracao: &f{duracao}
    &7Punicao e provas: &f{link}
