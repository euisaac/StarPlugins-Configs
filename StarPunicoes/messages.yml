  unbanip-nao-banido: "&eO IP &f{ip} &cnao possui um banimento ativo."

  checkban-resultado: "&e{jogador} &7esta banido por &f{autor}&7. Motivo: &f{motivo}&7. Data: &f{data}&7. Duracao: &f{duracao}"
