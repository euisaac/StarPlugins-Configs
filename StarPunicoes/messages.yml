  banido-broadcast: |-
    &c{jogador} &ffoi banido!
    &7Motivo: &f{motivo}
    &7Punido por: &f{autor}
    &7Duracao: &f{duracao}
  desbanido: "&aO banimento de &e{jogador} &afoi removido."
  nao-estava-banido: "&e{jogador} &cnao possui um banimento ativo."

  mutado-aviso: "&cVoce esta mutado. Motivo: &e{motivo}&c. Tempo restante: &e{duracao}"
  mutado-executor: "&aVoce mutou &e{jogador} &apor &e{duracao}&a."
  desmutado: "&aO mute de &e{jogador} &afoi removido."
  nao-estava-mutado: "&e{jogador} &cnao possui um mute ativo."

  kick-tela: |-
    &4&lVoce foi expulso do servidor!
    &7Motivo: &f{motivo}
    &7Expulso por: &f{autor}
    &7Punicao e provas: &f{link}
  kick-executor: "&aVoce expulsou &e{jogador}&a."

  avisado-aviso: "&eVoce recebeu um aviso! &7Motivo: &f{motivo} &7- Por: &f{autor}"
