# Bonificações por visualização
#
# O influenciador pede o bônus de um conteúdo que a staff JÁ validou:
#   /influencer solicitar (link) (bonificação) [descrição]
#   ex.: /influencer solicitar https://youtu.be/abc 100k passou de 120 mil
# ou clicando no conteúdo validado em /influencer validacoes.
#
# O pedido chega no Discord (discord.bonus_channel_id, ou o canal das
# validações) e no menu /influencer bonificacoes. Aprovado, os comandos de
# "recompensas" rodam pelo console. Jogador offline recebe quando entrar.
#
# Dá para criar e editar pelo menu /influencer bonificacoes, ou aqui mesmo.
# O id (50k, 100k, 1m) é o que o jogador digita no comando.
#
# Variáveis nas recompensas: {player} {views} {bonus} {link}

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       icone: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

bonificacoes:
  50k:
    nome: "&e50 mil visualizações"
    visualizacoes: 50000
    icone: GOLD_INGOT
    descricao: "Bônus para conteúdo validado que passou de 50 mil visualizações."
    recompensas:
      - "eco give {player} 5000"
  100k:
    nome: "&6100 mil visualizações"
    visualizacoes: 100000
    icone: GOLD_BLOCK
    descricao: "Bônus para conteúdo validado que passou de 100 mil visualizações."
    recompensas:
      - "eco give {player} 15000"
