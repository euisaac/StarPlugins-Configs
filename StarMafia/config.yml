# Configuração do StarMafia
# Ativar ou desativar o nascimento de bebê quando dois jogadores dormem em camas adjacentes
enableBabyVillagerSpawning: true

# Chance de nascimento do bebê (0 a 100, onde 100 = 100%)
babyVillagerSpawnChance: 30

# Tempo em segundos que a pessoa fica presa pelo comando /torar (0 para tempo indefinido)
torarLockDurationSeconds: 5

# Sistema de bebês/filhos como NPCs (requer o Citizens instalado)
bebes:
  # A cada quantos minutos o servidor verifica idade/fase/seguir dos filhos
  intervaloChecagemMinutos: 60
  # Se a mãe deixar o "seguir" desativado por mais desses dias, ele é reativado automaticamente
  diasParaReativarSeguir: 5
  # Dias da semana considerados "final de semana": nesses dias o filho passa algumas horas
  # visitando um dos pais (ver finalDeSemanaHoras/finalDeSemanaCom abaixo), voltando pra mãe
  # sozinho depois. Aceita nomes em português (domingo, segunda, terca, quarta, quinta, sexta,
  # sabado) ou em inglês (SUNDAY, MONDAY, etc.)
  diaComPai:
    - "sexta"
    - "sabado"
    - "domingo"
  # Quantas horas dura a visita nos dias de diaComPai
  finalDeSemanaHoras: 3
  # Quem o filho visita nesses dias: aleatorio (sorteia entre pai e mãe), pai, ou mae
  finalDeSemanaCom: "aleatorio"
  # Berçário: quando o pai/mãe que o bebê deveria seguir no momento está offline, o bebê é
  # levado até aqui (num ponto aleatório dentro do raio) em vez de ficar parado sozinho.
  # Definido com /starmafia setbercario, na localização de quem executa o comando.
  bercario:
    raioBlocos: 10
    # Custo pra deixar o bebê no berçário (pago pela mãe), cobrado a cada hora que ele ficar lá
    custoPorHora: 10000.0
  # Idade (em anos) em que cada fase começa. 1 semana real = 1 ano de idade do personagem.
  idade:
    crianca: 5
    adolescente: 16
    # Com essa idade o filho pode virar adulto - a mãe decide no /bebe se continua com ele
    # (vira ADULTO, permanente) ou deixa ele ir embora (deixa de existir)
    sai: 18
  # Nicks de jogadores usados como skin (sorteado aleatoriamente), separados por sexo em cada fase.
  # Se a lista do sexo sorteado estiver vazia, usa a lista do outro sexo como reserva.
  skins:
    bebe:
      menino:
        - "anhyeuemnhieu"
        - "maliksson"
      menina:
        - "anhyeuemnhieu"
        - "maliksson"
    crianca:
      menino:
        - "ChiefDeer"
        - "maliksson"
      menina:
        - "ChiefDeer"
        - "maliksson"
    adolescente:
      menino:
        - "anhyeuemnhieu"
        - "maliksson"
      menina:
        - "anhyeuemnhieu"
        - "maliksson"
    adulto:
      menino:
        - "anhyeuemnhieu"
        - "maliksson"
      menina:
        - "anhyeuemnhieu"
        - "maliksson"
  # Tamanho do NPC (1.0 = tamanho normal de jogador). Cresce suavemente do "min" até o "max"
  # conforme a idade avança dentro de cada fase (ex: bebê vai de 0.3 recém-nascido até 0.5
  # perto de virar criança). Adulto é diferente: ao virar adulto, sorteia um valor fixo
  # entre min e max (não cresce mais depois, já que a idade não importa mais nessa fase).
  escala:
    bebe:
      min: 0.3
      max: 0.5
    crianca:
      min: 0.5
      max: 0.75
    adolescente:
      min: 0.75
      max: 0.95
    adulto:
      min: 0.95
      max: 1.0

# Sistema de pensão semanal dos bebês (requer Vault + um plugin de economia instalado)
pensao:
  # Valor cobrado a cada cobrança semanal - sorteado entre o mínimo e o máximo quando a
  # pensão é ativada (cada bebê pode ter um valor diferente)
  valorMinimo: 30.0
  valorMaximo: 80.0
  # Intervalo, em dias, entre cada cobrança de pensão
  intervaloDias: 7
  # A cada quantos minutos o servidor verifica se alguma pensão venceu
  intervaloChecagemMinutos: 30
  # Depois de ativar a pensão, quantos minutos até poder desativar de novo (ativar nunca tem
  # espera). Evita ligar/desligar repetidamente perto do vencimento.
  minutosParaDesativar: 60
  # Comando executado pelo console quando o pagador não paga a pensão a tempo
  # %player% = nome do pagador (quem vai preso) | %parceiro% = nome de quem teve o bebê com ele
  comandoJail: "prender %player% obsidian 15m Nao pagou a pensao do bebe com %parceiro%"

# Ativar ou desativar o comando /beijar
enableKissCommand: true

# Mensagens de beijo globais (true = todos veem, false = só os envolvidos)
globalKissMessages: true

# Mensagens globais do comando /torar (true = todos veem, false = só os envolvidos)
globalToraMessages: true

