#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                       StarBosses  ·  Comandos                        ║
#  ╚══════════════════════════════════════════════════════════════════════╝
#
#  Nome e apelidos dos dois comandos do plugin. Depois de mudar:
#  /starbosses recarregar (nao precisa reiniciar o servidor).
#
#  O primeiro nome da lista e o principal; os outros sao apelidos. Para tirar
#  um apelido que bate com outro plugin, apague a linha dele (pelo menos um
#  nome precisa sobrar).

# /bosses - menu dos jogadores (armazem, top, loja, bosses, amuletos...)
Bosses:
  # false desliga o comando inteiro.
  Ativado: true
  # true = se outro plugin ja tiver um /boss, o do StarBosses passa na frente.
  # Ao desligar o StarBosses, o do outro volta.
  Substituir outros plugins: true
  Apelidos:
    - bosses
    - boss

# /starbosses - comandos da staff (editor, dar ovos, pontos de spawn...)
StarBosses:
  Ativado: true
  Substituir outros plugins: false
  Apelidos:
    - starbosses
    - sbosses
    - bossadmin
