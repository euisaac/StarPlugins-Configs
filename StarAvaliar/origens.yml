# Menu "Onde voce conheceu o servidor?"
#
# Cada opcao e um item do menu. Chaves:
#   Ativar: true/false
#   Slot: posicao no menu (0 = primeiro slot)
#   Material / Textura (cabeca por textura: hash, URL ou base64) / Dono (cabeca de um jogador)
#   Nome, Lore, Brilho
#   Digitar: true -> depois do clique o jogador escreve no chat (ex.: "Outros: conte onde foi")
#   Pergunta: texto enviado no chat quando Digitar esta ligado
#   Indicacao: true -> o jogador digita o nick de quem o chamou (recompensa em config.yml > Indicacao)
#   Recompensas: comandos rodados pelo console ({jogador})
#
# Subopcoes: quando existem, o clique abre um segundo menu (ex.: YouTube -> qual YouTuber).
# Sem subopcoes, a resposta conta so para a opcao.
# As subopcoes aceitam as mesmas chaves (menos Subopcoes).
#
# Tudo isto tambem pode ser editado em jogo: /staravaliar -> Editar opcoes.

Versao do modelo: 1

Menu:
  Titulo: '&aOnde voce conheceu o servidor?'
  Linhas: 3
  # Vidro nos slots vazios (vazio = sem preenchimento).
  Preenchimento: 'BLACK_STAINED_GLASS_PANE'
  # Botao para pular a pergunta. Ativar: false = o jogador tem que responder.
  Pular:
    Ativar: false
    Slot: 22
    Material: BARRIER
    Nome: '&cPular'
    Lore:
      - '&7Prefiro nao responder.'
  # Botao de voltar dentro dos submenus.
  Voltar:
    Material: ARROW
    Nome: '&cVoltar'
    Lore:
      - '&7Voltar para as opcoes.'

Opcoes:
  youtube:
    Ativar: true
    Slot: 11
    Material: PLAYER_HEAD
    Textura: 'd45586065f02e85530125f466df107c1c8d3e143101032c2b47807115bbda2f0'
    Nome: '&cYouTube'
    Lore:
      - '&7Vi um video no YouTube.'
      - ''
      - '&eClique para escolher o canal!'
    Submenu:
      Titulo: '&cQual canal do YouTube?'
      Linhas: 3
    Subopcoes:
      canal1:
        Slot: 11
        Material: PLAYER_HEAD
        Dono: 'Notch'
        Nome: '&fCanal 1'
        Lore:
          - '&7Troque pelo nome do YouTuber'
          - '&7e o Dono pelo nick dele.'
      canal2:
        Slot: 13
        Material: PLAYER_HEAD
        Dono: 'jeb_'
        Nome: '&fCanal 2'
        Lore:
          - '&7Troque pelo nome do YouTuber.'
      outro:
        Slot: 15
        Material: PAPER
        Nome: '&7Outro canal'
        Lore:
          - '&7Nao esta na lista? Digite o nome.'
        Digitar: true
        Pergunta: '&eDigite o nome do canal onde voce viu o servidor:'
  tiktok:
