    adiar: 'Tempo de jogo ao clicar em "mais tarde".'
    sugestao: 'Pede uma sugestao no chat depois da nota.'
    sugestao obrigatoria: 'Nao deixa digitar pular.'
    fonte: 'ESTATISTICA (Minecraft) ou PLUGIN.'
    staff: 'Liga o /avaliarstaff.'
