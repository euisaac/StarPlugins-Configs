    staff tempo: 'Tempo de jogo minimo para avaliar a equipe.'
    comentario: 'Pede um comentario depois da nota.'
    autor: 'O staff avaliado ve o nick de quem avaliou.'
    offline: 'Mostra no /avaliarstaff quem esta offline.'
