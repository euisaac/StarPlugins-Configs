#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                      StarTerrenos - bandeiras                        ║
#  ║   Bandeira e a regra que vale para quem NAO e membro do terreno,     ║
#  ║   e para o mundo em volta (fogo, explosao, mobs).                    ║
#  ║                                                                      ║
#  ║   Este arquivo nao cria bandeira nova: ele muda o nome, o icone, o   ║
#  ║   texto, o valor padrao e quem pode mexer em cada uma.               ║
#  ║                                                                      ║
#  ║   Ativar: false  -> a bandeira some do menu, mas a regra continua    ║
#  ║                     valendo pelo Padrao escrito aqui.                ║
#  ║   Padrao         -> o que vale enquanto ninguem mexer nela.          ║
#  ║   Permissao      -> quem pode mudar (vazio = todos os donos).        ║
#  ╚══════════════════════════════════════════════════════════════════════╝

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

