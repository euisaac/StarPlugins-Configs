#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                        StarTerrenos - menus                          ║
#  ║   Slot -1 esconde o botao. Os nomes de material valem para 1.8 ate   ║
#  ║   1.21: escreva o nome novo que o plugin acha o equivalente antigo.  ║
#  ╚══════════════════════════════════════════════════════════════════════╝
#
#  Marcadores que valem em qualquer tela:
#    {terreno} {dono} {tipo} {mundo} {area} {largura} {comprimento} {altura}
#    {membros} {subterrenos} {venda} {preco} {x} {y} {z} {entrada} {herdar}
#    {min_x} {min_z} {max_x} {max_z} {mensagem_entrada} {mensagem_saida}
#    {visto} {estado} {leilao} {lider} {leilao_termina}
#    {jogador} {blocos_totais} {blocos_usados} {blocos_restantes}
#    {blocos_ganhos} {blocos_bonus} {limite} {meus_terrenos}
#

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

#
# ═══════════════════════════  MENU DO TERRENO  ══════════════════════════════
#
Menu do terreno:
  Titulo: '&8Terreno de {dono}'
  Linhas: 5

  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  Botoes:
    Informacoes:
      Slot: 10
      Material: 'PAPER'
      Nome: '&a&lINFORMACOES'
      Lore:
        - '&7Tudo sobre este terreno.'
        - ''
        - '&7 ⤷ Nome: &f{terreno}'
        - '&7 ⤷ Dono: &f{dono} &8({visto})'
        - '&7 ⤷ Tipo: &f{tipo} &8| {estado}'
        - '&7 ⤷ Mundo: &f{mundo}'
        - '&7 ⤷ Tamanho: &f{largura}x{comprimento}'
        - '&7 ⤷ Area: &f{area} &7blocos'
        - ''
        - '&aCLIQUE &fpara mudar o nome'

    Membros:
      Slot: 12
      Material: 'BOOK'
      Nome: '&a&lMEMBROS'
      Lore:
        - '&7Quem pode entrar e mexer'
        - '&7no seu terreno.'
        - ''
        - '&7 ⤷ Membros: &f{membros}'
        - ''
        - '&aCLIQUE &fpara gerenciar'

    Bandeiras:
      Slot: 13
      Material: 'REDSTONE_TORCH'
      Nome: '&a&lBANDEIRAS'
      Lore:
        - '&7As regras que valem aqui:'
        - '&7PvP, fogo, explosao, mobs...'
        - ''
        - '&aCLIQUE &fpara ver todas'

    Mensagens:
      Slot: 14
      Material: 'OAK_SIGN'
      Nome: '&a&lMENSAGENS'
      Lore:
        - '&7O aviso de quem entra e'
        - '&7de quem sai do terreno.'
        - ''
        - '&7 ⤷ Entrada: &f{mensagem_entrada}'
        - '&7 ⤷ Saida: &f{mensagem_saida}'
        - ''
        - '&aCLIQUE &fpara escrever'

    Entrada:
      Slot: 16
      Material: 'COMPASS'
      Nome: '&a&lPONTO DE ENTRADA'
      Lore:
        - '&7Onde o teleporte chega.'
        - ''
        - '&7 ⤷ Marcado: &f{entrada}'
        - ''
        - '&aESQUERDO &fpara ir ate la'
        - '&aDIREITO &fpara marcar aqui'

    Venda:
      Slot: 20
      Material: 'EMERALD'
      Nome: '&a&lVENDER'
      Lore:
        - '&7Anuncie o terreno para'
        - '&7outros jogadores.'
        - ''
        - '&7 ⤷ A venda: &f{venda}'
        - '&7 ⤷ Preco: &f{preco}'
        - ''
        - '&aCLIQUE &fpara abrir'

    Subterrenos:
      Slot: 21
      Material: 'ITEM_FRAME'
      Nome: '&a&lSUBTERRENOS'
      Lore:
        - '&7Pedacos dentro do terreno'
        - '&7com regras proprias.'
        - ''
        - '&7 ⤷ Criados: &f{subterrenos}'
        - ''
        - '&aCLIQUE &fpara ver'

    Icone:
      Slot: 22
      Material: 'PAINTING'
      Nome: '&a&lICONE'
      Lore:
        - '&7O desenho que este terreno'
        - '&7mostra na sua lista.'
        - ''
        - '&aCLIQUE &fpara escolher'

    Blocos:
      Slot: 23
      Material: 'GRASS_BLOCK'
      Nome: '&a&lBLOCOS DE TERRENO'
      Lore:
        - '&7O quanto de chao voce'
        - '&7ainda pode marcar.'
        - ''
        - '&7 ⤷ Livres: &a{blocos_restantes}'
        - '&7 ⤷ Em uso: &f{blocos_usados}'
        - ''
        - '&aCLIQUE &fpara abrir'

    Abandonar:
      Slot: 24
      Material: 'BARRIER'
      Nome: '&c&lABANDONAR TERRENO'
      Lore:
        - '&7O terreno some e o chao'
        - '&7volta a ser de todos.'
        - ''
        - '&cIsto nao tem volta.'
        - ''
        - '&aCLIQUE &fpara abandonar'

    Meus terrenos:
      Slot: 30
      Material: 'CHEST'
      Nome: '&a&lMEUS TERRENOS'
      Lore:
        - '&7 ⤷ Voce tem: &f{meus_terrenos}&7/&f{limite}'
        - ''
        - '&aCLIQUE &fpara ver a lista'

    Comprar:
      Slot: 32
      Material: 'GOLD_INGOT'
      Nome: '&a&lCOMPRAR TERRENO'
      Lore:
        - '&7Este terreno esta a venda.'
        - ''
        - '&7 ⤷ Preco: &a{preco}'
        - '&7 ⤷ Dono: &f{dono}'
        - ''
        - '&aCLIQUE &fpara comprar'

    Lance:
      Slot: 32
      Material: 'GOLD_INGOT'
      Nome: '&e&lDAR LANCE'
      Lore:
        - '&7Este terreno esta em leilao.'
        - ''
        - '&7 ⤷ Lance atual: &f{leilao}'
        - '&7 ⤷ Maior lance: &f{lider}'
        - '&7 ⤷ Termina em: &f{leilao_termina}'
        - '&7 ⤷ Dono: &f{dono} &8({visto})'
        - ''
        - '&aCLIQUE &fpara cobrir o lance'

    Fechar:
      Slot: 40
      Material: 'BARRIER'
      Nome: '&cFechar'
      Lore: []

