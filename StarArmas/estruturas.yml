# =====================================================================
#  Estruturas de defesa
#  -------------------------------------------------------------------
#  Torres e cercas que o jogador coloca no chao para defender a base.
#
#  QUEM PODE MEXER, QUEM NAO LEVA DANO
#  A estrutura guarda o dono, e o resto vem do plugin de terreno que o
#  servidor ja usa -- StarTerrenos, GriefDefender ou GriefPrevention,
#  nessa ordem. Quem tem confianca no terreno nao leva dano da cerca nem
#  da torre, e quem tem confianca de construtor tambem recarrega,
#  desliga e recolhe. Sem plugin de terreno, so o dono.
#
#  DOIS TIPOS
#    TORRE    procura alvo sozinha dentro do alcance e atira nele
#             (com "Explosao:" ela vira MORTEIRO: solta uma bomba do
#             alto em cima do alvo, boa contra horda)
#    LIGACAO  postes que acendem um feixe de um para o proximo
#    MINA     espera alguem chegar perto, estoura e some
#    ALARME   nao machuca: avisa o dono que tem gente na base
#
#  Campos:
#    Tipo, Raridade, Bloco, Vida, Limite por jogador, Permissao
#    Dano, Particula, Particulas por bloco, No alvo
#    Torre:   Alcance, Tiros por segundo, Alvos, Precisa enxergar
#    Ligacao: Distancia maxima, Intervalo, Espessura, Ligacoes maximas,
#             Altura (1 = cerca de uma linha; 4 = PAREDE de laser)
#    Boneco:  Ativado, Altura, Item, Pequeno, Bracos, Nome, Visivel
#
#  O EJETOR QUE GIRA
#  Com "Boneco.Ativado: true" nasce um suporte invisivel e sem colisao
#  com o "Item" na CABECA dele. Pondo um BLOCO ali (um dispensador, um
#  caldeirao), o que aparece no jogo e o bloco assentado em cima da base
#  GIRANDO para onde a torre atira: base + ejetor, uma estrutura de dois
#  blocos. So CUBO INTEIRO serve: caldeirao, alambique e bigorna sao desenhados
#  como item chato na cabeca, e nao como bloco. Item fino (uma enxada,
#  uma vara) fica com cara de enfeite flutuando.
#
#  "Coluna" e o bloco do CORPO da torre, entre a base e o ejetor. Ele
#  fica parado (nao gira) e existe para o ejetor nao parecer flutuando:
#  base + corpo + ejetor viram uma coluna de tres blocos. Vazio desliga,
#  e "Altura da coluna" desloca so ele.
#
#  "Nivel" e EM QUAL BLOCO acima da base a peca fica: 1 e logo em cima
#  dela, 2 e o proximo. Com o corpo no 1 e o ejetor no 2, a torre vira
#  uma coluna de tres blocos sem vao nenhum.
#
#  A "Coluna" e um bloco DE VERDADE, posto no mundo, e o ejetor e uma
#  peca de armadura invisivel com o bloco no capacete. Nao e capricho: o
#  jogo desenha o bloco do capacete a 62,5% do tamanho, entao duas pecas
#  assim nunca encostam uma na outra. O corpo, que fica parado, nao
#  precisa ser entidade; o ejetor, que gira para o alvo, precisa. A
#  coluna so entra se o lugar estiver vazio, e sai junto com a torre.
#
#  Para a coluna, prefira CERCA ou GRADE (IRON_BARS, OAK_FENCE,
#  NETHER_BRICK_FENCE, COBBLESTONE_WALL): elas sao finas e ja tem cara de
#  mastro. Bloco cheio no meio deixa a torre com jeito de pilha de cubos.
#
#  ---------------------------------------------------------------
#  DRONE (Tipo: DRONE) -- o hangar
#
#  Aqui a arma SAI DO LUGAR. O bloco fica no chao gastando energia e
#  escolhendo o alvo dentro do "Alcance"; quem vai ate la e o drone, que
#  ronda a base e atira de perto. Contra quem se esconde atras do muro, e
#  a unica defesa que chega.
#
#    Ativado          liga o drone
#    Item             o que aparece voando (bloco inteiro fica melhor)
#    Pequeno          true deixa o drone do tamanho de um drone mesmo
#    Altura           a que altura, acima do hangar, ele ronda
#    Altura do ataque a que altura, acima do alvo, ele para para atirar
#    Raio             o tamanho da volta que ele da quando nao tem alvo
#    Velocidade       em blocos por TIQUE (0.35 = 7 blocos por segundo)
#    Alcance do tiro  de que distancia ele ja consegue atirar
#
#  O drone so voa quando tem alguem por perto para ver, e volta para o
#  hangar quando a energia acaba ou a estrutura e desligada. A coleira do
#  "Alcance" e o que o prende aquela base: ele nao persegue um zumbi ate
#  o outro lado do mapa.
#
#  "Altura" e "Altura da coluna" sao um retoque fino somado por cima do
#  nivel, para encostar meio bloco de um jeito ou de outro. Deixe em 0
#  se estiver bom.
#
#  Ligue "Visivel: true" se quiser o boneco a mostra, com bracos e a
#  peca na mao. E so enfeite: pode ser apagado e recriado a qualquer
#  momento.
#
#  O MORTEIRO E A VISAO DELE
#  A torre comum pergunta se ENXERGA o alvo em linha reta
#  ("Precisa enxergar"). O morteiro pergunta outra coisa: se a BOMBA
#  CHEGA nele. Por isso ele acerta por cima de um muro (o arco passa)
#  e nao acerta quem esta debaixo de um teto (o arco bate nele).
#
#  CERCA EM CADEIA
#  "Ligacoes maximas" diz em quantos vizinhos cada poste acende. Com 2
#  (o padrao) da para fechar um quadrado: cada poste liga no anterior e
#  no proximo, e o ultimo fecha no primeiro.
#    Energia: Maxima, Por uso, Por item, Itens
#    Efeitos: Colocar, Ligar, Atirar, Acerto, Recarregar, Recolher,
#             Sem energia
#
#  Alvos: MONSTRO, ANIMAL, JOGADOR ou TODOS.
#
#  MONSTRO e so o que ataca: zumbi, esqueleto, creeper, aranha, slime,
#  ghast, phantom, warden e companhia. Vaca, ovelha, aldeao, golem,
#  morcego e lobo NAO entram ai -- eles so viram alvo se voce escrever
#  ANIMAL (ou TODOS) na lista, e nenhuma defesa que vem pronta faz isso.
#  A explosao do morteiro e da mina respeita a mesma lista: a bomba nao
#  mata o rebanho do dono da base junto com o zumbi.
#
#  Energia "Maxima: 0" faz a estrutura funcionar para sempre, sem
#  recarga. Os "Itens" aceitam tanto o id de uma municao do
#  municoes.yml quanto o nome de um material do jogo.
# =====================================================================
