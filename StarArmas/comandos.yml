# Nomes dos comandos.
#
# Cada linha e "nome|alias|alias". O primeiro e o comando principal e os
# outros sao atalhos. Os nomes que ja vem do plugin.yml continuam
# valendo mesmo se voce apaga-los daqui.
Versao do modelo: 1

comandos:
  armas: "armas|arma|armamento|guns"
  municoes: "municoes|municao|balas"
  acessorios: "acessorios|acessorio|pecas"
  estruturas: "estruturas|estrutura|defesas|torres"
  stararmas: "stararmas|sarmas|admarmas"
