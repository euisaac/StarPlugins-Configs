# Aparencia dos menus.
#
# O icone de cada arma e o material da propria arma, entao arma nova
# aparece no catalogo sozinha, sem cadastrar icone aqui.
#
# Titulo com mais de 32 caracteres e cortado: antes da 1.19 o servidor
# recusa titulos maiores.
Versao do modelo: 1

Catalogo:
  Titulo: "&8Armas do servidor"
  Lore:
    - "&7Categoria: &f{categoria}"
    - "&7Dano: &f{dano} &7| Cabeca: &fx{cabeca}"
    - "&7Cadencia: &f{cadencia}/s &7| Alcance: &f{alcance}"
    - "&7Pente: &f{pente} &7| Modo: &f{modo}"
    - "&7Municao: &f{municao}"
    - ""
    - "&eClique para receber"

Municoes:
  Titulo: "&8Municoes"

Acessorios:
  Titulo: "&8Acessorios"

Bancada:
  Titulo: "&8Bancada de armas"
  Encaixe vazio:
    Material: "GRAY_STAINED_GLASS_PANE"

Instalar:
  Titulo: "&8Escolher a peca"

Estruturas:
  Titulo: "&8Estruturas de defesa"

Gerenciar:
  Titulo: "&8Gerenciar estrutura"

Navegacao:
  Anterior:
    Material: "ARROW"
    Nome: "&ePagina anterior"
  Proxima:
    Material: "ARROW"
    Nome: "&eProxima pagina"
  Fechar:
    Material: "BARRIER"
    Nome: "&cFechar"
