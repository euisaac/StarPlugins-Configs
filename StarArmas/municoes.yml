# =====================================================================
#  Municoes
#  -------------------------------------------------------------------
#  Municao aqui nao e so "a bala que a arma aceita": ela carrega os
#  proprios multiplicadores, o proprio impacto e ate a propria explosao.
#  E o que faz a mesma arma virar outra coisa so trocando o pente.
#
#  Modificadores (tudo opcional; 1.0 = nao muda nada):
#    Dano, Velocidade, Alcance, Espalhamento, Recuo, Cadencia,
#    Recarga, Gravidade, Volume, Zoom
#    Pente extra, Perfuracao extra, Projeteis extra  (somam, nao multiplicam)
#
#  No alvo (tudo opcional):
#    Fogo: tiques de fogo
#    Efeitos: ["TIPO:duracao:nivel", ...]
#    Empurrao, Raio, Roubo de vida, Dano extra, Congelar
#
#  Apagar uma municao daqui e permitido: ela nao volta na proxima subida.
#  So lembre de tirar o nome dela da lista "Municao.Tipos" das armas.
# =====================================================================
Versao do modelo: 1

