# ==========================================================================
#  StarDuelos - mensagens
#
#  Deixe uma mensagem vazia ('') para desligar o aviso.
#  {prefixo} = o prefixo abaixo. <nl> = quebra de linha (em titulos separa
#  titulo e subtitulo). Botoes clicaveis: [texto](/comando|dica do mouse).
#  Cores: &a, &l... e hex &#RRGGBB (1.16+). Aceita PlaceholderAPI.
# ==========================================================================
