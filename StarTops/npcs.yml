#  StarTops - NPCs plantados no mundo
#
#  Nao edite este arquivo na mao para adicionar NPCs -- use
#  "/startops topentidade <top> [tipo|JOGADOR] [skin]" em cima do local
#  desejado e depois ajuste aqui. "/startops removerentidade" tira o mais
#  proximo.
#
#  Cada entrada: Mundo/X/Y/Z/Yaw/Pitch, Tipo de entidade (um EntityType do
#  Bukkit, ou JOGADOR para um NPC com skin de jogador via Skin), Linhas (o
#  nome mostrado acima do NPC -- so a primeira linha e usada, o resto e so
#  pra documentar o que aparece no holograma dele quando houver Citizens/
#  FancyNpcs com holograma proprio) e Comando ao clicar (vazio abre o menu
#  daquele top; aceita os mesmos placeholders das Linhas, mais {jogador}
#  para quem clicou, e o prefixo "console:" para rodar como console).
# ==========================================================================

