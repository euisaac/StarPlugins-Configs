# ==========================================================================
#  StarTops - recompensas de posicao
#
#  "Recompensas:" define cada recompensa uma vez (aparencia na fila de
#  pendentes, itens a entregar, comandos a rodar). "Tabelas:" diz, por top,
#  qual posicao (ou faixa "3-10") sorteia qual recompensa.
#
#  Nas Tabelas, o valor de cada posicao/faixa e uma ou mais opcoes separadas
#  por ";", cada uma "peso,id" (ou so "id" para peso 1) -- e assim que da pra
#  ter mais de uma recompensa possivel pra mesma colocacao, sorteada com
#  chance proporcional ao peso.
#
#  Nos Comandos de uma recompensa, use "console: comando" (roda pelo
#  console) ou so o texto (vira mensagem pro jogador). Placeholders
#  disponiveis: {jogador} {top} {periodo} {posicao} {valor} {pontos}.
# ==========================================================================

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o Material 'PLAYER_HEAD' (o mesmo nome vale
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

Versao do modelo: 1

Recompensas:
  caixa_ouro:
    Exibir:
      Material: GOLD_BLOCK
      Nome: '&6&lCaixa de Ouro'
      Lore:
        - '&7Top: &f{top}'
        - '&7Posicao: &f#{posicao} &7({periodo})'
        - ''
        - '&aCLIQUE &7para coletar.'
      Brilho: true
    Comandos:
      - 'console: eco dar {jogador} 500'

  caixa_prata:
    Exibir:
      Material: IRON_BLOCK
      Nome: '&f&lCaixa de Prata'
      Lore:
        - '&7Top: &f{top}'
        - '&7Posicao: &f#{posicao} &7({periodo})'
        - ''
        - '&aCLIQUE &7para coletar.'
    Comandos:
      - 'console: eco dar {jogador} 150'

  caixa_bronze:
    Exibir:
      Material: COPPER_BLOCK
      Nome: '&c&lCaixa de Bronze'
      Lore:
        - '&7Top: &f{top}'
        - '&7Posicao: &f#{posicao} &7({periodo})'
        - ''
        - '&aCLIQUE &7para coletar.'
    Comandos:
      - 'console: eco dar {jogador} 50'

Tabelas:
  dinheiro_semanal:
    "1": caixa_ouro
    "2": caixa_prata
    "3-5": caixa_bronze
    "6-10": "70,caixa_bronze;30,caixa_prata"
