# ==========================================================================
#  StarTops - as telas
#
#  Material passa pelo XSeries: o mesmo nome funciona na 1.8 e na 1.21.
#  Cabeca: Material PLAYER_HEAD + Textura (hash/URL/base64) ou Dono (nick).
#
#  Cada tela tem:
#    Titulo, Linhas    Titulo (ate 32 caracteres nas versoes antigas) e altura.
#    Enfeite           O vidro do fundo (Ativar: false deixa vazio).
#    Slots             Onde o conteudo paginado entra (tops, jogadores do
#                       ranking, recompensas pendentes), na ordem escrita.
#    Itens             Botoes fixos: Slot/Slots, Material, Textura, Dono,
#                       Nome, Lore, Brilho, Permissao, Esconder sem
#                       permissao e Acoes.
#
#  Acoes proprias:  principal | top <id> | pontos | recompensas | coletartudo
#                   anterior | proxima | fechar
#  Acoes gerais:    comando: <cmd> | console: <cmd> | mensagem: <texto> |
#                   anuncio: <texto> | som: <SOM;volume;tom>
#
#  Substituicoes comuns a toda tela: {jogador} {pontos} {posicao_pontos}
#  {pagina} {paginas}. Placeholders do PlaceholderAPI tambem funcionam.
# ==========================================================================

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o Material 'PLAYER_HEAD' (o mesmo nome vale
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#       Dono: '{jogador}'   # a cabeca de quem abriu o menu
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

Versao do modelo: 1

# ---------------------------------------------------------------------------
#  /tops -- Slots recebe um icone por top visivel, na ordem do tops.yml.
# ---------------------------------------------------------------------------
Principal:
  Titulo: '&8Tops'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]

  Top:
    Material: BOOK
    Nome: '&e{top}'
    Lore:
      - ''
      - '&7Periodo: {periodo}'
      - ''
      - '&aCLIQUE &7para ver o ranking.'

  Itens:
    perfil:
      Slot: 4
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&e&lSUAS INFORMACOES'
      Lore:
        - ''
        - '&fPontos: &a{pontos}'
        - '&fSua posicao no top de pontos: &a{posicao_pontos}'
        - ''

    pontos:
      Slot: 40
      Material: NETHER_STAR
      Nome: '&d&lRANKING DE PONTOS'
      Lore:
        - ''
        - '&7Cada posicao em cada top'
        - '&7vale pontos. Veja quem lidera.'
        - ''
        - '&aCLIQUE &7para visualizar.'
      Acoes:
        - 'pontos'

    recompensas:
      Slot: 49
      Material: CHEST
      Nome: '&6&lRECOMPENSAS'
      Lore:
        - ''
        - '&7Recompensas pendentes de'
        - '&7colocacoes em tops semanais/mensais.'
        - ''
        - '&aCLIQUE &7para coletar.'
      Acoes:
        - 'recompensas'

# ---------------------------------------------------------------------------
#  Ranking de um top (ou dos pontos). Extras: {top}, {periodo},
#  {minha_posicao}. No item de cada jogador: {posicao}, {jogador}, {valor}.
# ---------------------------------------------------------------------------
Top:
  Titulo: '&8Top {top}'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]

  Jogador:
    Material: PLAYER_HEAD
    Usar a cabeca do jogador: true
    Nome: '&e{posicao}. &f{jogador}'
    Lore:
      - ''
      - '&fValor: &a{valor}'
      - '&fPosicao: &a{posicao}'
      - ''
    Brilho no primeiro: true

  Vazio:
    Mostrar: false
    Material: GRAY_STAINED_GLASS_PANE
    Nome: '&7{posicao}. &8---'
    Lore: []

  Itens:
    eu:
      Slot: 4
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&e{jogador}'
      Lore:
        - ''
        - '&fSua posicao: &a{minha_posicao}'
        - ''
    anterior:
      Slot: 48
      Material: ARROW
      Nome: '&ePagina anterior'
      Lore:
        - '&7Pagina {pagina} de {paginas}'
      Acoes:
        - 'anterior'
    voltar:
      Slot: 49
      Material: BARRIER
      Nome: '&cVoltar'
      Acoes:
        - 'principal'
    proxima:
      Slot: 50
      Material: ARROW
      Nome: '&eProxima pagina'
      Lore:
        - '&7Pagina {pagina} de {paginas}'
      Acoes:
        - 'proxima'

# ---------------------------------------------------------------------------
#  Recompensas pendentes. Extras: {quantidade_pendente}. No item de cada
#  recompensa: {top}, {posicao}, {periodo}, {valor} (ja vem do
#  recompensas.yml -> Exibir, mas os mesmos valores estao disponiveis para
#  qualquer Lore extra que voce escrever nos botoes fixos abaixo).
# ---------------------------------------------------------------------------
Recompensas:
  Titulo: '&8Recompensas pendentes'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]

  Vazio:
    Mostrar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: '&7Vazio'
    Lore: []

  Itens:
    coletar_tudo:
      Slot: 49
      Material: HOPPER
      Nome: '&a&lCOLETAR TUDO'
      Lore:
        - ''
        - '&7Voce tem &f{quantidade_pendente} &7recompensa(s)'
        - '&7pendente(s).'
        - ''
        - '&aCLIQUE &7para coletar todas de uma vez.'
      Acoes:
        - 'coletartudo'
    voltar:
      Slot: 45
      Material: BARRIER
      Nome: '&cVoltar'
      Acoes:
        - 'principal'
