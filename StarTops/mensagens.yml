# ==========================================================================
#  StarTops - textos
#
#  Mensagem vazia ('') simplesmente nao e enviada. Cores: &a, &c, ... e hex
#  no formato &#RRGGBB.
# ==========================================================================

Versao do modelo: 1

Prefixo: '&6&lTOPS &8- &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  So jogador: '&cEste comando so funciona dentro do jogo.'
  Top invalido: '&cNao existe um top chamado &f{top}&c.'
  Jogador nao encontrado: '&cO jogador &f{jogador} &cnunca entrou neste servidor.'
  Sem posicao no top: '&f{jogador} &7nao aparece no top &f{top}&7.'

# Textos curtos usados nos menus, nas listagens e nos placeholders.
Etiquetas:
  Sem posicao: '&7--'
  Ninguem: '&7Ninguem'
  Periodo geral: '&fGeral'
  Periodo semanal: '&fSemanal'
  Periodo mensal: '&fMensal'

Top:
  Atualizando: '&7Carregando o ranking...'
  Posicao de outro: '&f{jogador} &7esta na posicao &f#{posicao} &7do top &f{top} &7com &f{valor}&7.'

Recompensa:
  Coletada: '{prefixo}&aVoce coletou a recompensa da posicao &f#{posicao} &ado top &f{top}&a.'
  Sem espaco: '&cLibere espaco no inventario antes de coletar.'

Administracao:
  Recarregado: '{prefixo}&aConfiguracoes recarregadas. &7({tops} top(s))'
  Recalculado: '{prefixo}&aO top &f{top} &afoi recalculado.'
  Cabecalho lista: '&8&m--------&r &6&lTOPS CONFIGURADOS &8&m--------'
  Linha lista: '&8- &f{id} &7-> fonte: {fonte} &7(&f{fonte_real}&7) &7| periodo: {periodo} &7| {status}'
  Rodape lista: '&8&m----------------------------------------'
  Uso fechar: '&cUse: &f/startops fechar <top>'
  Uso topentidade: '&cUse: &f/startops topentidade <top> [tipo|JOGADOR] [skin]'
  Uso topholograma: '&cUse: &f/startops topholograma <top>'
  Uso topboneco: '&cUse: &f/startops topboneco <top> [posicao]'
  Entidade criada: '{prefixo}&aEntidade do top &f{top} &acriada onde voce esta.'
  Entidade removida: '{prefixo}&aEntidade removida.'
  Nenhuma entidade perto: '&cNenhuma entidade do StarTops perto de voce.'

Ajuda:
  Cabecalho: '&8&m--------&r &6&lSTARTOPS &8&m--------'
  Cabecalho admin: '&8&m--------&r &6&lSTARTOPS ADMIN &8&m--------'
  Linha: '&6/{comando} &8- &f{descricao}'
  Rodape: '&8&m----------------------------------'
