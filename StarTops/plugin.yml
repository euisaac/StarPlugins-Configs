name: StarTops
version: '${project.version}'
main: com.starlabs.startops.StarTops
api-version: '1.13'
authors: [ EuIsaac ]
description: '${project.description}'
website: https://starplugins.com.br

# Baixadas pelo loader a partir do Maven Central: sao os drivers do banco de
# dados, que os servidores modernos nao trazem mais embutidos.
libraries:
  - org.xerial:sqlite-jdbc:3.45.3.0
  - com.mysql:mysql-connector-j:8.4.0

# Nenhum e obrigatorio: sem eles, o StarTops so fica sem aquela fonte/
# integracao especifica. Os hooks com os demais StarPlugins sao por reflexao.
softdepend:
  - PlaceholderAPI
  - StarBanco
  - StarEconomia
  - StarRankMortes
  - StarTempoJogado
  - StarBedWars
  - StarEggWars
  - StarSkyWars
  - StarTheBridge
  - StarMurder
  - StarReviver
  - Citizens
  - FancyNpcs
  - DecentHolograms

# Secoes que o dono do servidor monta do jeito dele: o conferidor de config do
# loader nao acusa nem repoe o que estiver aqui dentro.
starplugins:
  config-livre:
    - "tops.yml Tops"
    - "hologramas.yml Entidades"
    - "npcs.yml Entidades"
    - "armorstands.yml Entidades"
    - "recompensas.yml Recompensas"
    - "recompensas.yml Tabelas"

commands:
  tops:
    aliases: [ top, rankings, ranking ]
    description: Abre o menu de tops
    usage: /<command> [top] [jogador]
  startops:
    aliases: [ stops, topsadmin ]
    description: Comandos administrativos do StarTops
    usage: /<command> [listar | topholograma | topentidade | topboneco | removerentidade | fechar | recarregar]

permissions:
  startops.usar:
    description: Permite abrir o menu de tops e coletar recompensas
    default: 'true'
  startops.ver:
    description: Permite ver a posicao de outro jogador num top
    default: 'op'
  startops.admin:
    description: Acesso aos comandos administrativos
    default: 'op'
  startops.bypass:
    description: Nao entra em nenhum ranking nem pontua
    default: 'false'
