# ---------------------------------------------------------------------------
#  StarEventos - arenas
#
#  Este arquivo e escrito pelo plugin. Ele guarda os lugares de cada evento --
#  entradas, saida, camarote, area -- que voce marca no jogo com o
#  /stareventos editor ou com os comandos do proprio evento:
#
#    /<evento> setloc <local>   marca onde voce esta
#    /<evento> addloc           acrescenta uma entrada
#    /<evento> varinha          pega a varinha da area
#    /<evento> definir          usa a selecao da varinha como area
#
#  Os lugares ficam aqui, e nao no arquivo do evento, para o plugin nunca
#  precisar reescrever aquele arquivo -- assim os comentarios que explicam
#  cada opcao continuam la, intactos.
#
#  Formato dos lugares: mundo;x;y;z;yaw;pitch
#  Formato das areas:   mundo;x1;y1;z1;x2;y2;z2
# ---------------------------------------------------------------------------

Arenas: {}
