      Slot: 10
      Material: 'PLAYER_HEAD'
      Nome: '&e&lSEU PERFIL'
      Lore:
        - '&7Como voce vai nos eventos.'
        - ''
        - ' &8» &fVitorias: &7{vitorias}'
        - ' &8» &fParticipacoes: &7{participacoes}'
        - ' &8» &fPosicao no TOP: &7{posicao}'
    Eventos:
      Slot: 12
      Material: 'NETHER_STAR'
      Nome: '&e&lEVENTOS'
      Lore:
        - '&7Todos os eventos do servidor,'
        - '&7com horarios e premios.'
        - ''
        - ' &8» &fCadastrados: &7{quantidade}'
        - ' &8» &fAcontecendo: &7{andando}'
        - ''
        - '&aClique para ver.'
    Top:
      Slot: 14
      Material: 'GOLD_INGOT'
      Nome: '&6&lTOP JOGADORES'
      Lore:
        - '&7Quem mais venceu eventos'
        - '&7neste servidor.'
        - ''
        - '&aClique para ver.'
    Recompensas:
      Slot: 16
      Material: 'CHEST'
      Nome: '&a&lSUAS RECOMPENSAS'
      Lore:
        - '&7Premios que nao couberam no'
        - '&7seu inventario na hora.'
        - ''
        - '&aClique para pegar.'
    Opcoes:
      Slot: 22
      Material: 'COMPARATOR'
      Nome: '&f&lSUAS PREFERENCIAS'
      Lore:
        - ''
        - ' &8» &fAnuncios no chat: {anuncios}'
        - ' &8» &fEntrar sozinho: {fila}'
        - ''
        - '&aClique esquerdo &7- trocar os anuncios'
        - '&aClique direito &7- trocar a entrada sozinha'

