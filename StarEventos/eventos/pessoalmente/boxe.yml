# ---------------------------------------------------------------------------
#  Boxe -- luta de maos limpas, decidida nos rounds
#
#  Este arquivo e um evento. Copie-o com outro nome, mude o Comando e a arena,
#  e voce tem um segundo Boxe rodando em outro lugar.
#
#  Os lugares da arena NAO ficam aqui: eles sao marcados no jogo e gravados no
#  arenas.yml. Use /stareventos editor boxe ou /boxe setloc.
#
#  Marcadores que valem nos textos deste arquivo:
#    {evento} {comando} {jogador} {jogadores} {restantes} {tempo} {atual} {total}
#  Um pedaco pode virar botao: <click:run_command:/boxe>ENTRAR</click>
# ---------------------------------------------------------------------------

Versao do modelo: 1

# NAO ALTERE: e o tipo que decide como o evento funciona.
Tipo: BOXE

Nome: 'Boxe'

# Use "comando|apelido|apelido" para dar mais de um nome ao comando.
Comando: 'boxe'

# Desligue para o plugin nem carregar este evento.
Ativar: true

# Segundos ate o evento se encerrar sozinho. 0 = sem limite.
Tempo maximo: 420

Minimo de jogadores: 2
# 0 = sem limite.
Maximo de jogadores: 0

#
# ═════════════════════════════════  ANUNCIOS  ═══════════════════════════════
#
# Quantos convites saem no chat antes das inscricoes fecharem.
Anuncios:
  Quantidade: 4
  # Segundos entre um convite e outro.
  Intervalo: 60

# A contagem depois de todos ja teleportados.
Aquecimento:
  Intervalo: 10
  # Deixar o jogador andar durante a contagem.
  Pode andar: false

#
# ══════════════════════════════════  NO MENU  ═══════════════════════════════
#
Menu:
  # Posicao na lista do /eventos (menor aparece antes).
  Ordem: 41
  Aparecer: true
  Aparecer no TOP: true

  Item:
    Material: 'LEATHER'
    Nome: '&e&lBOXE'
    Lore:
      - '&7So vale soco: nada de espada.'
      - '&7Quem leva a maioria dos rounds vence.'
      - ''
      - ' &8» &fSuas vitorias: &7{vitorias}'
      - ' &8» &fEstado: {estado}'
      - ' &8» &fEntrada: &7{entrada}'

#
# ══════════════════════════════  COMPRAR A ATIVACAO  ════════════════════════
#
# Deixa o jogador pagar para o evento comecar na hora, pelo menu.
Comprar:
  Ativar: true
  # Vazio = qualquer um pode comprar.
  Permissao: ''
  # Segundos ate o mesmo jogador poder comprar de novo.
  Espera: 900
  Economias:
    dinheiro: 5000.0

#
# ═══════════════════════════════  ENTRAR CUSTA  ═════════════════════════════
#
Custos:
  # Segundos de tempo online exigidos. 0 = sem exigencia.
  Tempo online: 0
  # Deixe vazio para entrar de graca.
  Economias: {}

#
# ════════════════════════════════════  REGRAS  ══════════════════════════════
#
Regras:
  # Tag que o vencedor carrega ate o proximo evento (%stareventos_tag%).
  Tag: '&e[Boxe]'

  PvP: true
  # Dano de queda, fogo, lava... o dano do evento em si nunca depende disto.
  Dano natural: false
  # Exigir mochila vazia. Com "Guardar o inventario" ligado no config, o
  # plugin guarda e devolve sozinho -- ninguem precisa esvaziar nada.
  Inventario vazio: true
  Manter XP: true
  Dropar ao morrer: false

  # Efeitos durante o evento inteiro. Formato: EFEITO:nivel-segundos
  Efeitos: []
  # Efeitos ao pisar num bloco. Formato: BLOCO,EFEITO:nivel-segundos
  Efeitos por bloco: []

#
# ══════════════════════════════════════  KIT  ═══════════════════════════════
#
# O que o jogador veste e carrega dentro do evento. Tudo isto e devolvido ao
# normal quando ele sai.
Kit:
  Armadura:
    Capacete:
      Material: 'LEATHER_HELMET'
      Nome: '&eBoxe'
    Peitoral:
      Material: 'LEATHER_CHESTPLATE'
      Nome: '&eBoxe'
    Calca:
      Material: 'LEATHER_LEGGINGS'
      Nome: '&eBoxe'
    Botas:
      Material: 'LEATHER_BOOTS'
      Nome: '&eBoxe'
  Itens:
    luva:
      Material: 'LEATHER'
      Nome: '&cLuva de Boxe'
      Lore:
        - '&7Com ela na mao o soco vale.'
      Slot: 0

#
# ═════════════════════════════════════  PLACAR  ═════════════════════════════
#
Placar:
  Ativar: true
  Titulo: '&6&lBOXE'
  Linhas:
    - '&8&m                    '
    - '&fRound: &e{round}&f/&e{rounds}'
    - '&fSeus golpes: &e{golpes}'
    - '&fRounds ganhos: &e{rounds_ganhos}'
    - '&fQuedas: &e{quedas}&f/&e{limite_de_quedas}'
    - '&fTempo: &e{tempo}'
    - '&8&m                    '
    - '&6starplugins.com.br'

#
# ════════════════════════════════  DO BOXE  ═════════════════════════════════
#
Opcoes:
  # Rounds da luta. Quem fechar a maioria deles vence -- da para perder os
  # primeiros e ainda virar o ultimo.
  # 0 desliga os rounds: ai o evento vale o ultimo em pe, como uma briga comum.
  Rounds: 3
  Duracao do round: 60
  Intervalo entre rounds: 10

  # Soco e soco: com um item na mao o golpe nao sai. A luva do kit conta como
  # mao livre (ela e reconhecida pelo nome abaixo).
  So com as maos: true
  Nome da luva: '&cLuva de Boxe'

  # Dano fixo de cada golpe, em meios coracoes. O que o jogador veste nao muda
  # nada: a luta se ganha no ringue, nao no inventario.
  Dano por golpe: 2.0

  # Quanto cada golpe e cada nocaute valem no placar do evento.
  Pontos por golpe: 1.0
  Pontos por nocaute: 5.0

  # Chegar a zero de vida nao mata: e queda. O lutador fica alguns segundos no
  # chao (sem bater e sem apanhar) e volta; na queda que passar do limite, vem
  # o nocaute e ele sai da luta.
  Nocaute:
    Quedas ate perder: 3
    Segundos no chao: 5
    # Efeitos de quem esta no chao. Formato: EFEITO:nivel-segundos
    Efeitos: [ 'BLINDNESS:0' ]

#
# ═════════════════════════  CHAVEAMENTO E APOSTAS  ══════════════════════════
#
# Com os duelos ligados, o evento vira um torneio: dois no ringue por vez, o
# perdedor sai e o vencedor volta para o fim da fila. Desligue para todos
# socarem todos ao mesmo tempo.
Duelos:
  Ativar: true
  # Segundos entre uma luta e a proxima.
  Intervalo: 8

# A plateia aposta em quem vai ganhar a luta. O dinheiro de quem errou paga
# quem acertou, e volta inteiro se a luta acabar sem vencedor.
Apostas:
  Ativar: true
  Economia: 'dinheiro'
  Minimo: 100.0
  Maximo: 100000.0

#
# ═══════════════════════════════════  VITORIA  ══════════════════════════════
#
# Como se ganha chegando a algum lugar.
Vitoria:
  Ativar: false
  # Ganhar ao cair no vazio (o Dropper invertido).
  No vazio: false
  # Blocos que, ao serem pisados, dao a vitoria.
  Blocos: []
  # Placa em que se clica para ganhar. A primeira linha e o identificador.
  Placa:
    Linha 1: '&3[Boxe]'
    Linha 2: '&aClique aqui'
    Linha 3: '&apara ganhar'
    Linha 4: '&ao evento.'

#
# ═════════════════════════════════  CHECKPOINT  ═════════════════════════════
#
Checkpoint:
  Marcar:
    Ativar: false
    Blocos: []
    Placa:
      Linha 1: '&3[Boxe]'
      Linha 2: '&aClique para'
      Linha 3: '&amarcar seu'
      Linha 4: '&acheckpoint.'
  Voltar:
    Ativar: false
    # Voltar ao checkpoint ao cair no vazio, em vez de ser eliminado.
    No vazio: false
    Blocos: []
    Placa:
      Linha 1: '&3[Boxe]'
      Linha 2: '&aClique para'
      Linha 3: '&avoltar ao'
      Linha 4: '&acheckpoint.'

#
# ══════════════════════════════  DESCLASSIFICAR  ════════════════════════════
#
Desclassificar:
  No vazio: false
  Blocos: [ 'LAVA' ]

#
# ══════════════════════════════════════  TIMES  ═════════════════════════════
#
Times:
  Ativar: false
  # Quantos jogadores por time. "2v2" = dois em cada.
  Modo: '2v2'
  Minimo de times: 2
  # 0 = sem limite.
  Maximo de times: 0
  Formacao automatica: true
  Fogo amigo: false
  # true = o time inteiro sai quando o ultimo membro cai.
  Eliminacao por time: true
  Cores: [ 'RED', 'BLUE', 'GREEN', 'YELLOW', 'LIGHT_PURPLE', 'AQUA', 'GOLD', 'WHITE' ]
  Spawns:
    # Exigir um spawn por time para o evento poder comecar.
    Exigir: false
  Selecao:
    Ativar: true
    # Abrir a tela de escolha assim que o jogador entra.
    Abrir ao entrar: true

#
# ═════════════════════════════════  MENSAGENS  ══════════════════════════════
#
# Mensagens diretas, so para o jogador. Vazio ('') nao envia nada.
Mensagens:
  Entrou: '&aVoce entrou no evento &f{evento}&a. Boa sorte!'
  Saiu: '&cVoce saiu do evento &f{evento}&c.'
  Ja esta dentro: '&cVoce ja esta neste evento.'
  Ja esta em outro: '&cVoce ja esta participando de outro evento.'
  Nao esta dentro: '&cVoce nao esta neste evento.'
  Nao esta aberto: '&cAs inscricoes do &f{evento} &cnao estao abertas.'
  Lotado: '&cO evento &f{evento} &cja esta cheio.'
  Sem permissao: '&cVoce nao tem permissao para isso.'
  Sem saldo: '&cVoce precisa de &f{custo} &cpara entrar.'
  Inventario cheio: '&cEsvazie seu inventario para entrar no evento.'
  Limite de ip: '&cJa ha {quantidade} jogador(es) deste IP no evento. Limite: {maximo}.'
  Morreu: '&cVoce foi eliminado!'
  Caiu: '&cVoce caiu e foi eliminado!'
  Desclassificado: '&cVoce foi desclassificado!'
  Checkpoint marcado: '&aCheckpoint marcado.'
  Voltou ao checkpoint: '&eVoce voltou ao ultimo checkpoint.'
  Entrou no camarote: '&aVoce esta assistindo ao evento. Use &f/{comando} sair &apara voltar.'
  Sem camarote: '&cEste evento nao tem camarote.'
  Sem aposta: '&cNao ha aposta aberta agora.'
  Nao esta duelando: '&cSo da para apostar em quem esta lutando.'
  Ja apostou: '&cVoce ja apostou nesta luta.'
  Aposta baixa: '&cA aposta minima e maior que isso.'
  Aposta alta: '&cA aposta maxima e menor que isso.'
  Apostou: '&aVoce apostou &f{valor} &aem &f{jogador}&a.'
  Aposta paga: '&aVoce acertou a aposta e levou &f{valor} {moeda}&a!'
  So com as maos: '&cNo boxe o golpe e de mao limpa: guarde o que esta segurando.'
  Levantou: '&aVoce levantou! Volte para a luta.'
  Nocauteado: '&cNocaute! Voce caiu vezes demais.'
  Perdeu a luta: '&cVoce perdeu a luta nos rounds.'
  Actionbar no chao: '&cNo chao... levanta em &f{tempo}s'
  Actionbar golpe: '&aAcertou &f{jogador} &8| &fgolpes no round: &e{golpes}'
  Actionbar apanhou: '&c{jogador} &facertou voce!'

  Ajuda: |
    &8&m----------------------------------------
    &6&l{evento}
    &e/{comando} &8- &7entrar no evento
    &e/{comando} sair &8- &7sair do evento
    &e/{comando} assistir &8- &7ir para o camarote
    &e/{comando} apostar <jogador> <valor> &8- &7apostar numa luta
    &8&m----------------------------------------
  Ajuda staff: |
    &8&m----------------------------------------
    &6&l{evento} &7- administracao
    &e/{comando} &8- &7entrar no evento
    &e/{comando} iniciar &8- &7comecar agora
    &e/{comando} parar &8- &7derrubar o evento
    &e/{comando} forcar &8- &7pular os anuncios
    &e/{comando} locais &8- &7abrir o editor
    &e/{comando} setloc <local> &8- &7marcar um lugar
    &e/{comando} addloc &8- &7marcar uma entrada
    &e/{comando} varinha &8- &7pegar a varinha da area
    &e/{comando} definir &8- &7usar a selecao como area
    &8&m----------------------------------------

#
# ══════════════════════════════  ANUNCIOS DE TEXTO  ═════════════════════════
#
# Mensagens para o servidor inteiro. Vazio ('') nao envia nada.
Anuncios de texto:
  Convite: |

    &8&m----------------------------------------
    &6&l{evento}
    &fEntre clicando &e&l<click:run_command:/{comando}>AQUI</click>&f ou digitando &e/{comando}&f.
    &fJogadores: &e{jogadores} &8| &fAviso &e{atual}&f/&e{total}
    &8&m----------------------------------------

  Actionbar convite: '&6{evento} &8» &fentre com &e/{comando}'
  Titulo convite: '&6&l{evento}<nl>&fentre com &e/{comando}'

  Aquecimento: |

    &6&l{evento}
    &fOs jogadores foram teleportados. Comeca em &e{tempo}&f.
    &fParticipando: &e{jogadores}&f.

  Actionbar aquecimento: '&eComeca em {tempo}...'
  Barra aquecimento: '&e{evento} &7- comeca em {tempo}'

  Comecou: |

    &6&l{evento}
    &a&lCOMECOU! &fBoa sorte aos &e{jogadores} &fparticipantes.

  Titulo comecou: '&a&lVALENDO!<nl>&f{evento}'
  Actionbar jogo: '&fRestam &e{jogadores} &8| &f{tempo}'
  Barra jogo: '&6{evento} &7- {tempo}'

  Vitoria: |

    &8&m----------------------------------------
    &6&l{evento}
    &e&l{jogador} &fvenceu o evento!
    &8&m----------------------------------------

  Eliminado: '&8» &e{jogador} &ffoi eliminado. Restam &e{restantes}&f.'
  Time eliminado: '&8» &fO {time} &ffoi eliminado.'
  Time venceu: |

    &8&m----------------------------------------
    &6&l{evento}
    &fO {time} &fvenceu o evento!
    &8&m----------------------------------------

  Sem jogadores: |

    &6&l{evento}
    &cNao teve gente suficiente; o evento foi cancelado.

  Sem vencedor: |

    &6&l{evento}
    &cO evento acabou sem vencedor.

  Cancelado: |

    &6&l{evento}
    &cO evento foi cancelado pela equipe.

  Tempo esgotado: |

    &6&l{evento}
    &cO tempo acabou.

  Actionbar entrou: '&e{jogador} &fentrou no {evento}'
  Round: |

    &6&l{evento}
    &e&lROUND {round}&f/&e{rounds} &8- &fvalendo!

  Round extra: |

    &6&l{evento}
    &c&lROUND EXTRA! &fO primeiro golpe decide.

  Round vencido: '&8» &e{jogador} &flevou o round &e{round} &fcom &e{golpes} &fgolpe(s).'
  Round empatado: '&8» &fO round &e{round} &fterminou empatado.'
  Queda: '&8» &e{jogador} &fcaiu! &7({quedas}/{limite}) &fLevanta em &e{tempo}s&f.'
  Nocaute: |

    &6&l{evento}
    &c&lNOCAUTE! &e{jogador} &fnao levantou mais.

  Luta vencida: '&8» &e{jogador} &fvenceu a luta com &e{rounds} &fround(s).'
  Actionbar descanso: '&eRound {round}/{rounds} em {tempo}'
  Duelo: |

    &6&l{evento}
    &fNo ringue: &e{jogador1} &fcontra &e{jogador2}&f!
    &7Aposte com &f/{comando} apostar <jogador> <valor>&7.

  Duelo vencido: '&8» &e{jogador} &fvenceu o duelo!'
  Actionbar proximo duelo: '&eProxima luta em {tempo}'

#
# ════════════════════════════════  PREMIACAO  ═══════════════════════════════
#
# Formato: 'chance,chave-do-recompensas.yml'
Recompensas:
  - '100.0,vencedor'
  - '5.0,raro'

# Para quem participou e nao venceu. So ganha quem ficou ate o fim: ser
# eliminado conta, sair no meio nao.
Recompensa por participacao:
  Dar aos vencedores: false
  Lista: []
