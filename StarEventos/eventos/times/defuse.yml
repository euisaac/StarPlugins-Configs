# ---------------------------------------------------------------------------
#  Defuse -- um time planta, o outro desarma
#
#  Este arquivo e um evento. Copie-o com outro nome, mude o Comando e a arena,
#  e voce tem um segundo Defuse rodando em outro lugar.
#
#  Os lugares da arena NAO ficam aqui: eles sao marcados no jogo e gravados no
#  arenas.yml. Use /stareventos editor defuse ou /defuse setloc.
#
#  Marcadores que valem nos textos deste arquivo:
#    {evento} {comando} {jogador} {jogadores} {restantes} {tempo} {atual} {total}
#  Um pedaco pode virar botao: <click:run_command:/defuse>ENTRAR</click>
# ---------------------------------------------------------------------------

Versao do modelo: 1

# NAO ALTERE: e o tipo que decide como o evento funciona.
Tipo: DEFUSE

Nome: 'Defuse'

# Use "comando|apelido|apelido" para dar mais de um nome ao comando.
Comando: 'defuse|bomba'

# Desligue para o plugin nem carregar este evento.
Ativar: true

# Segundos ate o evento se encerrar sozinho. 0 = sem limite.
Tempo maximo: 1800

Minimo de jogadores: 4
# 0 = sem limite.
Maximo de jogadores: 0

#
# ═════════════════════════════════  ANUNCIOS  ═══════════════════════════════
#
# Quantos convites saem no chat antes das inscricoes fecharem.
Anuncios:
  Quantidade: 4
  # Segundos entre um convite e outro.
  Intervalo: 40

# A contagem depois de todos ja teleportados.
Aquecimento:
  Intervalo: 10
  # Deixar o jogador andar durante a contagem.
  Pode andar: false

#
# ══════════════════════════════════  NO MENU  ═══════════════════════════════
#
Menu:
  # Posicao na lista do /eventos (menor aparece antes).
  Ordem: 55
  Aparecer: true
  Aparecer no TOP: true

  Item:
    Material: 'TNT'
    Nome: '&e&lDEFUSE'
    Lore:
      - '&7Plante a bomba no ponto A ou B.'
      - '&7Do outro lado: impeca ou desarme.'
      - ''
      - ' &8» &fSuas vitorias: &7{vitorias}'
      - ' &8» &fEstado: {estado}'
      - ' &8» &fEntrada: &7{entrada}'
      - ''
      - '&7Ativar agora custa &f{preco}&7.'
      - '&aClique para ativar ou entrar.'

#
# ══════════════════════════════  COMPRAR A ATIVACAO  ════════════════════════
#
# Deixa o jogador pagar para o evento comecar na hora, pelo menu.
Comprar:
  Ativar: true
  # Vazio = qualquer um pode comprar.
  Permissao: ''
  # Segundos ate o mesmo jogador poder comprar de novo.
  Espera: 900
  Economias:
    dinheiro: 5000.0

#
# ═══════════════════════════════  ENTRAR CUSTA  ═════════════════════════════
#
Custos:
  # Segundos de tempo online exigidos. 0 = sem exigencia.
  Tempo online: 0
  # Deixe vazio para entrar de graca.
  Economias: {}

#
# ════════════════════════════════════  REGRAS  ══════════════════════════════
#
Regras:
  # Tag que o vencedor carrega ate o proximo evento (%stareventos_tag%).
  Tag: '&e[Defuse]'

  PvP: true
  # Dano de queda, fogo, lava... o dano do evento em si nunca depende disto.
  Dano natural: true
  # Exigir mochila vazia. Com "Guardar o inventario" ligado no config, o
  # plugin guarda e devolve sozinho -- ninguem precisa esvaziar nada.
  Inventario vazio: true
  Manter XP: true
  Dropar ao morrer: false

  # Efeitos durante o evento inteiro. Formato: EFEITO:nivel-segundos
  Efeitos: []
  # Efeitos ao pisar num bloco. Formato: BLOCO,EFEITO:nivel-segundos
  Efeitos por bloco: []

#
# ══════════════════════════════════════  KIT  ═══════════════════════════════
#
# O que o jogador veste e carrega dentro do evento. Tudo isto e devolvido ao
# normal quando ele sai.
Kit:
  Armadura:
    Capacete:
      Material: 'IRON_HELMET'
      Nome: '&eDefuse'
    Peitoral:
      Material: 'IRON_CHESTPLATE'
      Nome: '&eDefuse'
  Itens:
    espada:
      Material: 'IRON_SWORD'
      Nome: '&fFaca'
      Slot: 0
      Esconder atributos: true
    arco:
      Material: 'BOW'
      Nome: '&fArma'
      Slot: 1
      Encantamentos: [ 'ARROW_INFINITE:1' ]
      Inquebravel: true
      Esconder atributos: true
    flecha:
      Material: 'ARROW'
      Quantidade: 1
      Slot: 7

#
# ═════════════════════════════════════  PLACAR  ═════════════════════════════
#
Placar:
  Ativar: true
  Titulo: '&6&lDEFUSE'
  Linhas:
    - '&8&m                    '
    - '&fRound: &e{round}'
    - '&fPlacar: &e{placar}'
    - '&fSeu time: {time}'
    - '&fVoce e: {papel}'
    - '&fBomba: {bomba}'
    - '&fTempo: &e{tempo}'
    - '&8&m                    '
    - '&6starplugins.com.br'

#
# ════════════════════════════════  A ARENA  ═════════════════════════════════
#
# A area cobre o mapa. Os pontos A e B nao sao marcados no editor: eles
# sao os blocos que voce construiu (um material para cada, logo abaixo em
# Opcoes.Sites). Mudar o ponto de lugar e mudar o bloco de lugar.
Area:
  Ativar: true
  Exigir: true
  Quebrar: false
  Recolher: false
  Blocos: []

#
# ═══════════════════════════════  DO DEFUSE  ════════════════════════════════
#
Opcoes:
  # Rounds que um time precisa vencer para levar o evento.
  Rounds para ganhar: 3
  Tempo do round: 120
  Intervalo entre rounds: 8
  # Os times trocam de lado a cada round, como manda o modo.
  Trocar de lado: true

  # A bomba.
  Tempo da bomba: 40
  Tempo para plantar: 5
  Tempo para desarmar: 7
  # Plantar e desarmar exigem ficar parado: sair do bloco cancela a conta.

  Item da bomba: 'TNT'
  Nome da bomba: '&c&lBOMBA'
  Slot da bomba: 8
  Bloco da bomba: 'TNT'
  Som da bomba: 'BLOCK_NOTE_BLOCK_PLING;2;1'

  Forca da explosao: 4.0
  # Deixe false: a explosao nao pode abrir buraco no mapa.
  Explosao quebra blocos: false

  Pontos por plantar: 2.0
  Pontos por desarmar: 2.0

  # Os pontos da bomba, pelos blocos que voce construiu neles.
  Raio do site: 4.0
  Sites:
    A:
      Materiais: [ 'GOLD_BLOCK' ]
    B:
      Materiais: [ 'IRON_BLOCK' ]

  # Como cada fim de round aparece no chat.
  Motivos:
    Bomba explodiu: 'a bomba explodiu'
    Bomba desarmada: 'a bomba foi desarmada'
    Atacantes mortos: 'os atacantes cairam'
    Defensores mortos: 'os defensores cairam'
    Tempo do round: 'o tempo acabou'

#
# ═══════════════════════════════════  VITORIA  ══════════════════════════════
#
# Como se ganha chegando a algum lugar.
Vitoria:
  Ativar: false
  # Ganhar ao cair no vazio (o Dropper invertido).
  No vazio: false
  # Blocos que, ao serem pisados, dao a vitoria.
  Blocos: []
  # Placa em que se clica para ganhar. A primeira linha e o identificador.
  Placa:
    Linha 1: '&3[Defuse]'
    Linha 2: '&aClique aqui'
    Linha 3: '&apara ganhar'
    Linha 4: '&ao evento.'

#
# ═════════════════════════════════  CHECKPOINT  ═════════════════════════════
#
Checkpoint:
  Marcar:
    Ativar: false
    Blocos: []
    Placa:
      Linha 1: '&3[Defuse]'
      Linha 2: '&aClique para'
      Linha 3: '&amarcar seu'
      Linha 4: '&acheckpoint.'
  Voltar:
    Ativar: false
    # Voltar ao checkpoint ao cair no vazio, em vez de ser eliminado.
    No vazio: false
    Blocos: []
    Placa:
      Linha 1: '&3[Defuse]'
      Linha 2: '&aClique para'
      Linha 3: '&avoltar ao'
      Linha 4: '&acheckpoint.'

#
# ══════════════════════════════  DESCLASSIFICAR  ════════════════════════════
#
Desclassificar:
  No vazio: false
  Blocos: [ 'LAVA' ]

#
# ══════════════════════════════════════  TIMES  ═════════════════════════════
#
Times:
  Ativar: true
  # Quantos jogadores por time. "2v2" = dois em cada.
  Modo: '4v4'
  Minimo de times: 2
  # Dois lados, sempre: o evento e de um time contra o outro.
  Maximo de times: 2
  Formacao automatica: true
  Fogo amigo: false
  # true = o time inteiro sai quando o ultimo membro cai.
  Eliminacao por time: true
  Cores: [ 'RED', 'BLUE', 'GREEN', 'YELLOW', 'LIGHT_PURPLE', 'AQUA', 'GOLD', 'WHITE' ]
  Spawns:
    # Exigir um spawn por time para o evento poder comecar.
    Exigir: true
  Selecao:
    Ativar: true
    # Abrir a tela de escolha assim que o jogador entra.
    Abrir ao entrar: true

#
# ═════════════════════════════════  MENSAGENS  ══════════════════════════════
#
# Mensagens diretas, so para o jogador. Vazio ('') nao envia nada.
Mensagens:
  Entrou: '&aVoce entrou no evento &f{evento}&a. Boa sorte!'
  Saiu: '&cVoce saiu do evento &f{evento}&c.'
  Ja esta dentro: '&cVoce ja esta neste evento.'
  Ja esta em outro: '&cVoce ja esta participando de outro evento.'
  Nao esta dentro: '&cVoce nao esta neste evento.'
  Nao esta aberto: '&cAs inscricoes do &f{evento} &cnao estao abertas.'
  Lotado: '&cO evento &f{evento} &cja esta cheio.'
  Sem permissao: '&cVoce nao tem permissao para isso.'
  Sem saldo: '&cVoce precisa de &f{custo} &cpara entrar.'
  Inventario cheio: '&cEsvazie seu inventario para entrar no evento.'
  Limite de ip: '&cJa ha {quantidade} jogador(es) deste IP no evento. Limite: {maximo}.'
  Morreu: '&cVoce foi eliminado!'
  Caiu: '&cVoce caiu e foi eliminado!'
  Desclassificado: '&cVoce foi desclassificado!'
  Checkpoint marcado: '&aCheckpoint marcado.'
  Voltou ao checkpoint: '&eVoce voltou ao ultimo checkpoint.'
  Entrou no camarote: '&aVoce esta assistindo ao evento. Use &f/{comando} sair &apara voltar.'
  Sem camarote: '&cEste evento nao tem camarote.'
  Levou a bomba: '&cVoce esta com a bomba! Plante no ponto A ou B.'
  Fora do site: '&cVoce nao esta num ponto de bomba.'
  Plantando: '&eFique parado por {tempo}s para plantar no {site}...'
  Desarmando: '&eFique parado por {tempo}s para desarmar...'
  Acao cancelada: '&cVoce se mexeu; a conta parou.'
  Morreu no round: '&cVoce caiu neste round. Volta no proximo!'
  Actionbar plantando: '&ePlantando... &f{tempo}s'
  Actionbar desarmando: '&eDesarmando... &f{tempo}s'

  Ajuda: |
    &8&m----------------------------------------
    &6&l{evento}
    &e/{comando} &8- &7entrar no evento
    &e/{comando} sair &8- &7sair do evento
    &e/{comando} assistir &8- &7ir para o camarote
    &8&m----------------------------------------
  Ajuda staff: |
    &8&m----------------------------------------
    &6&l{evento} &7- administracao
    &e/{comando} &8- &7entrar no evento
    &e/{comando} iniciar &8- &7comecar agora
    &e/{comando} parar &8- &7derrubar o evento
    &e/{comando} forcar &8- &7pular os anuncios
    &e/{comando} locais &8- &7abrir o editor
    &e/{comando} setloc <local> &8- &7marcar um lugar
    &e/{comando} addloc &8- &7marcar uma entrada
    &e/{comando} varinha &8- &7pegar a varinha da area
    &e/{comando} definir &8- &7usar a selecao como area
    &8&m----------------------------------------

#
# ══════════════════════════════  ANUNCIOS DE TEXTO  ═════════════════════════
#
# Mensagens para o servidor inteiro. Vazio ('') nao envia nada.
Anuncios de texto:
  Convite: |

    &8&m----------------------------------------
    &6&l{evento}
    &fEntre clicando &e&l<click:run_command:/{comando}>AQUI</click>&f ou digitando &e/{comando}&f.
    &fJogadores: &e{jogadores} &8| &fAviso &e{atual}&f/&e{total}
    &8&m----------------------------------------

  Actionbar convite: '&6{evento} &8» &fentre com &e/{comando}'
  Titulo convite: '&6&l{evento}<nl>&fentre com &e/{comando}'

  Aquecimento: |

    &6&l{evento}
    &fOs jogadores foram teleportados. Comeca em &e{tempo}&f.
    &fParticipando: &e{jogadores}&f.

  Actionbar aquecimento: '&eComeca em {tempo}...'
  Barra aquecimento: '&e{evento} &7- comeca em {tempo}'

  Comecou: |

    &6&l{evento}
    &a&lCOMECOU! &fBoa sorte aos &e{jogadores} &fparticipantes.

  Titulo comecou: '&a&lVALENDO!<nl>&f{evento}'
  Actionbar jogo: '&fRestam &e{jogadores} &8| &f{tempo}'
  Barra jogo: '&6{evento} &7- {tempo}'

  Vitoria: |

    &8&m----------------------------------------
    &6&l{evento}
    &e&l{jogador} &fvenceu o evento!
    &8&m----------------------------------------

  Eliminado: '&8» &e{jogador} &ffoi eliminado. Restam &e{restantes}&f.'
  Time eliminado: '&8» &fO {time} &ffoi eliminado.'
  Time venceu: |

    &8&m----------------------------------------
    &6&l{evento}
    &fO {time} &fvenceu o evento!
    &8&m----------------------------------------

  Sem jogadores: |

    &6&l{evento}
    &cNao teve gente suficiente; o evento foi cancelado.

  Sem vencedor: |

    &6&l{evento}
    &cO evento acabou sem vencedor.

  Cancelado: |

    &6&l{evento}
    &cO evento foi cancelado pela equipe.

  Tempo esgotado: |

    &6&l{evento}
    &cO tempo acabou.

  Actionbar entrou: '&e{jogador} &fentrou no {evento}'
  Round: |

    &8&m----------------------------------------
    &6&l{evento} &8- &fround &e{round}
    &fAtacando: &e{atacantes}
    &fPlacar: &e{placar}
    &8&m----------------------------------------

  Portador: '&8» &e{jogador} &festa com a bomba.'
  Plantando: '&8» &e{jogador} &festa plantando no &e{site}&f!'
  Desarmando: '&8» &e{jogador} &festa desarmando!'
  Plantada: |

    &c&lA BOMBA FOI PLANTADA NO {site}!
    &fExplode em &e{tempo}s&f.

  Desarmada: '&8» &a{jogador} &adesarmou a bomba!'
  Explodiu: '&8» &c&lA BOMBA EXPLODIU NO {site}!'
  Round vencido: '&8» &f{time} &fvenceu o round &8(&7{motivo}&8) &8| &fplacar: &e{placar}'
  Round sem vencedor: '&8» &fRound sem vencedor. Placar: &e{placar}'
  Trocaram de lado: '&8» &fOs lados trocaram: agora quem ataca e o {atacantes}&f.'
  Caiu: '&8» &e{jogador} &fcaiu. Restam &e{restantes}&f.'
  Sem sites: |

    &6&l{evento}
    &cNenhum ponto de bomba foi encontrado na arena. Avise a equipe.

  Actionbar round: '&fRound {round} &8| &e{tempo}'
  Actionbar bomba: '&c&lBOMBA: {tempo}s'
  Actionbar intervalo: '&eRound {round} em {tempo}'

#
# ════════════════════════════════  PREMIACAO  ═══════════════════════════════
#
# Formato: 'chance,chave-do-recompensas.yml'
Recompensas:
  - '100.0,vencedor'
  - '5.0,raro'

# Para quem participou e nao venceu. So ganha quem ficou ate o fim: ser
# eliminado conta, sair no meio nao.
Recompensa por participacao:
  Dar aos vencedores: false
  Lista: []
