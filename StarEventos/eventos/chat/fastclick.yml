# ---------------------------------------------------------------------------
#  Clique Rapido -- so um dos botoes vale
#
#  Evento de chat: ninguem e teleportado para lugar nenhum e nao ha arena para
#  montar. Ele pode rodar a qualquer hora, com o servidor cheio, sem tirar
#  ninguem do que estava fazendo.
#
#  Marcadores que valem nos textos deste arquivo:
#    {evento} {comando} {jogador} {resposta} {atual} {total} {tempo}
#  Um pedaco pode virar botao: <click:run_command:/cliquerapido|fastclick>AQUI</click>
# ---------------------------------------------------------------------------

Versao do modelo: 1

# NAO ALTERE: e o tipo que decide como o evento funciona.
Tipo: FASTCLICK

Nome: 'Clique Rapido'

# Use "comando|apelido|apelido" para dar mais de um nome ao comando.
Comando: 'cliquerapido|fastclick'

Ativar: true

#
# ═════════════════════════════════  RODADAS  ════════════════════════════════
#
# Quantas vezes a pergunta e repetida antes do evento desistir.
Anuncios:
  Quantidade: 3
  # Segundos entre uma repeticao e outra.
  Intervalo: 20

# Quantas vezes o mesmo jogador pode tentar. 0 = sem limite.
Tentativas por jogador: 3

#
# ══════════════════════════════════  NO MENU  ═══════════════════════════════
#
Menu:
  Ordem: 56
  Aparecer: true
  Aparecer no TOP: true

  Item:
    Material: 'LEVER'
    Nome: '&e&lCLIQUE RAPIDO'
    Lore:
      - '&7Uma grade de botoes no chat.'
      - '&7So um deles e o certo.'
      - ''
      - ' &8» &fSuas vitorias: &7{vitorias}'
      - ' &8» &fEstado: {estado}'
      - ' &8» &fTentar custa: &7{entrada}'
      - ''
      - '&7Ativar agora custa &f{preco}&7.'
      - '&aClique para ativar o evento.'

#
# ══════════════════════════════  COMPRAR A ATIVACAO  ════════════════════════
#
Comprar:
  Ativar: true
  Permissao: ''
  Espera: 900
  Economias:
    dinheiro: 3000.0

#
# ═══════════════════════════════  TENTAR CUSTA  ═════════════════════════════
#
# O custo e cobrado a cada tentativa, e nao so de quem acerta.
Custos:
  Tempo online: 0
  Economias: {}

#
# ════════════════════════════════════  REGRAS  ══════════════════════════════
#
Regras:
  Tag: '&e[Clique Rapido]'

#
# ═══════════════════════════  DO CLIQUE RAPIDO  ═════════════════════════════
#
Opcoes:
  Linhas: 3
  Colunas: 7
  # Como aparecem os botoes. O certo e igual aos outros de proposito.
  Botao: '&7&l[X]'
  Botao certo: '&7&l[X]'
  # Tamanho do codigo escondido em cada botao.
  Tamanho do codigo: 8

#
# ═════════════════════════════════  MENSAGENS  ══════════════════════════════
#
Mensagens:
  Nao esta aberto: '&cO &f{evento} &cnao esta acontecendo agora. Espere o proximo!'
  Sem permissao: '&cVoce nao tem permissao para isso.'
  Sem saldo: '&cVoce precisa de &f{custo} &cpara tentar.'
  Sem tentativas: '&cVoce ja usou todas as suas tentativas.'
  Errou: '&cEsse nao era o botao certo.'

  Ajuda: |
    &8&m----------------------------------------
    &6&l{evento}
    &e/{comando} <resposta> &8- &7responder
    &8&m----------------------------------------
  Ajuda staff: |
    &8&m----------------------------------------
    &6&l{evento} &7- administracao
    &e/{comando} <resposta> &8- &7responder
    &e/{comando} iniciar &8- &7comecar agora
    &e/{comando} parar &8- &7derrubar o evento
    &8&m----------------------------------------

#
# ══════════════════════════════  ANUNCIOS DE TEXTO  ═════════════════════════
#
Anuncios de texto:
  Convite: |

    &8&m----------------------------------------
    &6&l{evento}
    &fClique no botao certo:
    {grade}
    &8&m----------------------------------------

  Vitoria: |

    &8&m----------------------------------------
    &6&l{evento}
    &e&l{jogador} &facertou! A resposta era &e{resposta}&f.
    &8&m----------------------------------------

  Tempo esgotado: |

    &6&l{evento}
    &cO tempo acabou e ninguem acertou. A resposta era &e{resposta}&f.

  Cancelado: |

    &6&l{evento}
    &cO evento foi cancelado pela equipe.

  Sem jogadores: ''
  Comecou: ''

#
# ════════════════════════════════  PREMIACAO  ═══════════════════════════════
#
Recompensas:
  - '100.0,vencedor'

Recompensa por participacao:
  Dar aos vencedores: false
  Lista: []
