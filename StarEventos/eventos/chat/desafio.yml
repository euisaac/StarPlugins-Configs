# ---------------------------------------------------------------------------
#  Desafio -- uma meta para cumprir jogando
#
#  Evento de chat: ninguem e teleportado para lugar nenhum e nao ha arena para
#  montar. Ele pode rodar a qualquer hora, com o servidor cheio, sem tirar
#  ninguem do que estava fazendo.
#
#  Marcadores que valem nos textos deste arquivo:
#    {evento} {comando} {jogador} {resposta} {atual} {total} {tempo}
#  Um pedaco pode virar botao: <click:run_command:/desafio|challenge>AQUI</click>
# ---------------------------------------------------------------------------

Versao do modelo: 1

# NAO ALTERE: e o tipo que decide como o evento funciona.
Tipo: DESAFIO

Nome: 'Desafio'

# Use "comando|apelido|apelido" para dar mais de um nome ao comando.
Comando: 'desafio|challenge'

Ativar: true

#
# ═════════════════════════════════  RODADAS  ════════════════════════════════
#
# Quantas vezes a pergunta e repetida antes do evento desistir.
Anuncios:
  Quantidade: 3
  # Segundos entre uma repeticao e outra.
  Intervalo: 20

# Quantas vezes o mesmo jogador pode tentar. 0 = sem limite.
Tentativas por jogador: 0

#
# ══════════════════════════════════  NO MENU  ═══════════════════════════════
#
Menu:
  Ordem: 59
  Aparecer: true
  Aparecer no TOP: true

  Item:
    Material: 'DIAMOND_PICKAXE'
    Nome: '&e&lDESAFIO'
    Lore:
      - '&7Uma meta para cumprir jogando.'
      - '&7Nao precisa parar o que estava fazendo.'
      - ''
      - ' &8» &fSuas vitorias: &7{vitorias}'
      - ' &8» &fEstado: {estado}'
      - ' &8» &fTentar custa: &7{entrada}'
      - ''
      - '&7Ativar agora custa &f{preco}&7.'
      - '&aClique para ativar o evento.'

#
# ══════════════════════════════  COMPRAR A ATIVACAO  ════════════════════════
#
Comprar:
  Ativar: true
  Permissao: ''
  Espera: 900
  Economias:
    dinheiro: 3000.0

#
# ═══════════════════════════════  TENTAR CUSTA  ═════════════════════════════
#
# O custo e cobrado a cada tentativa, e nao so de quem acerta.
Custos:
  Tempo online: 0
  Economias: {}

#
# ════════════════════════════════════  REGRAS  ══════════════════════════════
#
Regras:
  Tag: '&e[Desafio]'

#
# ═══════════════════════════════  DO DESAFIO  ═══════════════════════════════
#
# Uma meta e sorteada a cada evento. Formato:
#   TAREFA,ALVO,QUANTIDADE,NOME
#
# Tarefas: QUEBRAR (blocos), PESCAR (qualquer coisa), MATAR (criaturas).
# No MATAR, use TODOS para valer qualquer criatura.
Opcoes:
  Metas:
    - 'QUEBRAR,STONE,100,pedras'
    - 'QUEBRAR,COAL_ORE,10,minerios de carvao'
    - 'QUEBRAR,OAK_LOG,32,troncos'
    - 'PESCAR,PEIXE,5,peixes'
    - 'MATAR,ZOMBIE,15,zumbis'
    - 'MATAR,TODOS,25,criaturas'
  Nomes:
    QUEBRAR: 'minere'
    PESCAR: 'pesque'
    MATAR: 'mate'

#
# ═════════════════════════════════  MENSAGENS  ══════════════════════════════
#
Mensagens:
  Nao esta aberto: '&cO evento &f{evento} &cnao esta aberto agora.'
  Sem permissao: '&cVoce nao tem permissao para isso.'
  Sem saldo: '&cVoce precisa de &f{custo} &cpara tentar.'
  Sem tentativas: '&cVoce ja usou todas as suas tentativas.'
  Errou: ''

  Ajuda: |
    &8&m----------------------------------------
    &6&l{evento}
    &e/{comando} <resposta> &8- &7responder
    &8&m----------------------------------------
  Ajuda staff: |
    &8&m----------------------------------------
    &6&l{evento} &7- administracao
    &e/{comando} <resposta> &8- &7responder
    &e/{comando} iniciar &8- &7comecar agora
    &e/{comando} parar &8- &7derrubar o evento
    &8&m----------------------------------------

#
# ══════════════════════════════  ANUNCIOS DE TEXTO  ═════════════════════════
#
Anuncios de texto:
  Convite: |

    &8&m----------------------------------------
    &6&l{evento}
    &fDesafio: &e&l{tarefa} {meta} {alvo}&f!
    &7O primeiro a conseguir ganha.
    &8&m----------------------------------------

  Actionbar progresso: '&fDesafio: &e{feito}&7/&e{meta} &f{alvo}'
  Vitoria: |

    &8&m----------------------------------------
    &6&l{evento}
    &e&l{jogador} &facertou! A resposta era &e{resposta}&f.
    &8&m----------------------------------------

  Sem vencedor: |

    &6&l{evento}
    &cNinguem acertou a tempo.

  Tempo esgotado: |

    &6&l{evento}
    &cO tempo acabou e ninguem acertou. A resposta era &e{resposta}&f.

  Cancelado: |

    &6&l{evento}
    &cO evento foi cancelado pela equipe.

  Sem jogadores: ''
  Comecou: ''

#
# ════════════════════════════════  PREMIACAO  ═══════════════════════════════
#
Recompensas:
  - '100.0,vencedor'

Recompensa por participacao:
  Dar aos vencedores: false
  Lista: []
