# ---------------------------------------------------------------------------
#  StarEventos - mensagens
#
#  Mensagem vazia ('') nao e enviada: e assim que se desliga um aviso sem
#  precisar de uma opcao no config.yml para cada um.
#
#  As mensagens de dentro de cada evento (entrar, sair, vencer) ficam no
#  arquivo do proprio evento, na pasta eventos/.
#
#  Um pedaco de texto pode virar botao clicavel:
#    <click:run_command:/sumo>ENTRAR</click>
# ---------------------------------------------------------------------------

Versao do modelo: 1

Prefixo: '&6&lEVENTOS &8» &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  So jogador: '&cEsse comando so funciona no jogo.'
  Numero invalido: '&f{valor} &cnao e um numero valido.'
  Jogador desconhecido: '&cO jogador &f{jogador} &cnao esta online.'
  Recarregado: '&aConfiguracoes recarregadas.'
  Inventario cheio: '&cO seu inventario esta cheio.'
  Inventario devolvido: '&aDevolvemos o que voce tinha antes do evento.'
  Carregando: '&7Buscando...'
  Comando bloqueado: '&cVoce nao pode usar esse comando durante o evento.'
  Sem saldo: '&cVoce nao tem o suficiente. Custo: &f{custo}&c.'
  Sem ajuda: '&cEste evento nao tem ajuda escrita.'
  Evento sumiu: '&cEste evento nao existe mais. Avise a equipe.'
  Uso da aposta: '&cUse: /<evento> apostar <jogador> <valor>'
  Anuncios ligados: '&aVoce voltara a receber os anuncios dos eventos.'
  Anuncios desligados: '&cVoce nao recebera mais os anuncios dos eventos.'
  Fila ligada: '&aVoce entrara sozinho nos proximos eventos.'
  Fila desligada agora: '&cVoce nao entrara mais sozinho nos eventos.'
  Fila desligada: '&cA fila automatica esta desligada neste servidor.'

