# ==========================================================================
#  StarSkyWars - habilidades
#
#  Habilidades.<modo>.<id>: Nome, Raridade, Icone/Textura, Descricao, Tipo,
#  Gratis, Na caixa, Permissao e Niveis (Preco, Valor, Extra, Descricao).
#
#  O Tipo diz o que a habilidade faz; Valor e Extra mudam por nivel:
#   SEM_DANO_DE_QUEDA        Valor = % do dano de queda anulado
#   RECUPERAR_FLECHA         Valor = % de chance de a flecha voltar
#   FLECHA_EXPLOSIVA         Valor = % de chance; Extra = poder da explosao
#   FORCA_AO_ABATER          Valor = segundos; Extra = nivel do efeito
#   REGENERACAO_AO_ABATER    Valor = segundos; Extra = nivel
#   VELOCIDADE_AO_ABATER     Valor = segundos; Extra = nivel
#   VELOCIDADE_COM_POUCA_VIDA Valor = segundos; Extra = coracoes que ativam
#   EXPLOSAO_AO_MORRER       Valor = poder da explosao
#   SEM_FOME                 (sem valor)
#   DANO_DE_PEROLA           Valor = % do dano da perola anulado
#   DANO_NA_CABECA           Valor = % de dano extra na cabeca
#   RESISTENCIA_AO_FOGO      Valor = % do dano de fogo anulado
#   VIDA_EXTRA               Valor = coracoes extras
#   ROUBO_DE_VIDA            Valor = % do dano que vira vida
#   DANO_A_DISTANCIA         Valor = % de dano extra com flechas
#   RESISTENCIA_A_EXPLOSAO   Valor = % do dano de explosao anulado
#   ESQUIVA                  Valor = % de chance de anular um golpe
#   EFEITO_AO_INICIAR        Extra = EFEITO:nivel (a partida toda)
#   ITEM_AO_ABATER           Extra = item (formato dos kits)
#   SEGUNDA_CHANCE           Valor = % da vida ao sobreviver (1x por partida)
#   GOLPE_DE_FOGO            Valor = % de chance; Extra = segundos
#   GOLPE_CONGELANTE         Valor = % de chance; Extra = segundos
#   DANO_EXTRA               Valor = % de dano extra corpo a corpo
#   BLOCOS_INFINITOS         Valor = % de chance de nao gastar o bloco
#   CURA_AO_ABATER           Valor = % da vida curada ao abater
# ==========================================================================

