# ==========================================================================
#  StarSkyWars - kits
#
#  Kits.<modo>.<id>: Nome, Raridade (COMUM, RARO, EPICO, LENDARIO), Icone
#  (material) ou Textura (cabeca), Descricao, Gratis (todo mundo tem),
#  Na caixa (pode sair da caixa misteriosa), Permissao (quem tem a permissao
#  tem o kit) e Niveis.
#
#  Cada nivel descreve o kit inteiro daquele nivel: Preco (por economia do
#  economias.yml; vazio ou 0 no nivel 1 = so na caixa, a nao ser que seja
#  Gratis), Itens, Capacete/Peitoral/Calca/Botas, Efeitos (EFEITO:nivel,
#  duram a partida toda), Comandos (console, {jogador}) e Descricao.
#
#  Formato de item: 'MATERIAL : quantidade : enchant=NOME:nivel : name=&a...
#  : lore=a|b : pocao=EFEITO:nivel:segundos : cor=R,G,B : inquebravel'
#  Os nomes de material e encantamento sao os modernos (o plugin traduz).
#
#  Os mesmos kits valem para todos os modos; mude, tire ou acrescente a
#  vontade em cada modo.
# ==========================================================================

