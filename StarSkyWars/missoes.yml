# ==========================================================================
#  StarSkyWars - missoes
#
#  Missoes.<id>: Nome, Modo (solo, dupla... ou TODOS), Tipo, Quantidade,
#  Periodo (PERMANENTE, DIARIA, SEMANAL, MENSAL), Descricao, Icone/Textura,
#  Requer (id de outra missao que precisa estar concluida), Recompensas e
#  Recompensas texto (o que aparece no menu).
#
#  Tipos: VITORIAS, ABATES, ELIMINACOES, ASSISTENCIAS, JOGOS, FIRST_BLOOD,
#  BAUS_ABERTOS, WINSTREAK, TEMPO_JOGADO (minutos), MORTES.
#  Recompensas: 'coins: 100', 'xp: 50', 'fragmentos: 5', 'caixa: kits 2',
#  'booster: 2;30', 'pontos: 10', 'comando: ...', 'mensagem: ...'.
# ==========================================================================

