# ==========================================================================
#  StarSkyWars - baus
#
#  Baus.<tipo>: Minimo e Maximo de itens por bau, e Itens ('chance : ITEM
#  : quantidade : opcoes'). A chance e um peso: 75 sai o triplo de 25.
#  Formato de item: 'MATERIAL : quantidade : enchant=NOME:nivel : name=&a...
#  : lore=a|b : pocao=EFEITO:nivel:segundos : cor=R,G,B'. Nomes modernos.
#
#  Perfis: o que a votacao da sala escolhe (Votacao.Opcoes no config).
#  Cada perfil diz o tipo de bau das ilhas, do centro e do reabastecimento.
#  'suprimentos' e o bau que cai no centro no evento SUPRIMENTOS.
# ==========================================================================

Versao do modelo: 1

Perfis:
  basico:
    Nome: 'Básico'
    Icone: 'CHEST'
    Descricao:
      - '&7Poucos itens e armaduras fracas.'
      - '&7Para quem gosta de PvP limpo.'
    Ilha: 'ilha_basico'
    Centro: 'centro_basico'
    Reabastecer ilha: 'reabastecer_ilha'
    Reabastecer centro: 'reabastecer_centro'
  normal:
    Nome: 'Normal'
    Icone: 'TRAPPED_CHEST'
    Descricao:
      - '&7O SkyWars de sempre.'
    Ilha: 'ilha_normal'
    Centro: 'centro_normal'
    Reabastecer ilha: 'reabastecer_ilha'
    Reabastecer centro: 'reabastecer_centro'
