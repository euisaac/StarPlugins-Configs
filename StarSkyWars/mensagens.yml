  Jogador: |-
    <nl>
     &b&lSKYWARS
     &a/sw jogar [modo] &8- &7Jogar
     &a/sw sair &8- &7Sair da partida
     &a/sw loja &8- &7Kits, habilidades e cosméticos
     &a/sw estatisticas [jogador] &8- &7Suas estatísticas
