     &a/sw caixas &8- &7Caixas misteriosas
     &a/sw boosters &8- &7Seus boosters
     &a/sw top [tipo] &8- &7Rankings
     &a/sw votar &8- &7Votar nos baús da sala
     &a/sw chat &8- &7Liga/desliga o chat do SkyWars
     &a/grupo &8- &7Grupos para jogar junto
     &a/reconectar &8- &7Voltar para a partida
     &a/lobby &8- &7Voltar ao lobby
    <nl>
  Admin: |-
    &c&lADMIN
    &c/sw setlobby &8- &7Define o lobby
    &c/sw criar <id> <modo> &8- &7Cria uma arena no mundo atual
    &c/sw spawn adicionar [ilha] &8- &7Adiciona um spawn (nova ilha, ou na ilha N)
    &c/sw centro | espera | espectador &8- &7Define posições
    &c/sw bau escanear|adicionar|limpar &8- &7Baús do mapa
    &c/sw borda|salas|minimo|vazio <n> &8- &7Ajustes da arena
    &c/sw salvar &8- &7Salva o mundo como modelo e abre as salas
    &c/sw editar <id> &8- &7Abre o modelo para edição
    &c/sw ativar|desativar|info|remover <id>
    &c/sw lista &8- &7Arenas e salas
    &c/sw iniciar &8- &7Força o início da sua sala
    &c/sw tp <sala> &8- &7Vai até uma sala
    &c/sw npc <modo|estatisticas|remover>
    &c/sw holotop <tipo|auto|remover> [modo]
    &c/sw caixa [remover] &8- &7Caixa misteriosa no bloco que você olha
    &c/sw givecaixa|fragmentos|coins|xp|pontos|booster|desbloquear|estatistica <jogador> ...
    &c/sw mundo carregar <nome> &8- &7Carrega um mundo
    &c/sw recarregar
    <nl>
  Grupo: |-
