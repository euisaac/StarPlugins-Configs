# ==========================================================================
#  StarSkyWars - menus
#
#  Cada tela tem Titulo, Linhas (1 a 6), Enfeite (o vidro de fundo), Slots
#  (onde o conteudo paginado entra) e Itens (os botoes fixos).
#
#  Botao: Slot ou Slots, Material (ou PLAYER_HEAD com Dono/Textura), Nome,
#  Lore, Brilho, Permissao, Mostrar (condicao que a tela entende) e Acoes.
#  Acoes: 'menu: <tela> [argumento]', 'jogar: <modo> [mapa]', 'sair',
#  'voltar', 'anterior', 'proxima', 'fechar', 'comando: ...', 'console: ...',
#  'mensagem: ...', 'som: ...' e as acoes proprias de cada tela.
#
#  Todas as variaveis do jogador valem aqui: {jogador} {nivel} {coins}
#  {vitorias} {abates_solo} {winstreak_mensal} {liga} {kit} ...
# ==========================================================================

Versao do modelo: 1

# --------------------------------------------------------------------------
#  Modelos: como os kits, habilidades e cosmeticos aparecem na loja.
#  {nome} {raridade} {nivel} {nivel_maximo} {preco} {preco_evolucao}
#  {proximo_nivel} {tipo} {modo}; as linhas {descricao}, {descricao_nivel}
#  e {evolucao} viram varias linhas. Material vazio ou {icone} usa o icone
#  do item.
# --------------------------------------------------------------------------
Modelos:
  Selecionado:
    Material: '{icone}'
    Nome: '&a{nome}'
    Lore:
      - '&8{tipo}'
      - ''
      - '{descricao}'
      - '{descricao_nivel}'
      - ''
      - ' &8▶ &fRaridade: {raridade}'
      - ' &8▶ &fNível: &7{nivel}/{nivel_maximo}'
      - '{evolucao}'
      - ''
      - '&bSelecionado'
  Desbloqueado:
    Material: '{icone}'
    Nome: '&a{nome}'
    Lore:
      - '&8{tipo}'
      - ''
      - '{descricao}'
      - '{descricao_nivel}'
      - ''
      - ' &8▶ &fRaridade: {raridade}'
      - ' &8▶ &fNível: &7{nivel}/{nivel_maximo}'
      - '{evolucao}'
      - ''
      - '&aClique para selecionar'
  Comprar:
    Material: '{icone}'
    Nome: '&c{nome}'
    Lore:
      - '&8{tipo}'
      - ''
      - '{descricao}'
      - '{descricao_nivel}'
      - ''
      - ' &8▶ &fRaridade: {raridade}'
      - ' &8▶ &fPreço: &7{preco}'
      - ''
      - '&eClique para comprar'
  Bloqueado:
    Material: 'GRAY_DYE'
    Nome: '&c{nome}'
    Lore:
      - '&8{tipo}'
      - ''
      - '{descricao}'
      - ''
      - ' &8▶ &fRaridade: {raridade}'
      - ''
      - '&dEncontrado na caixa misteriosa'
  # Entra no lugar de {evolucao} quando o item tem um proximo nivel.
  Evolucao:
    Lore:
      - ' &8▶ &fEvoluir para o nível {proximo_nivel}: &7{preco_evolucao}'
      - ' &7(clique direito)'

Enfeite padrao: &enfeite
  Ativar: true
  Material: 'GRAY_STAINED_GLASS_PANE'
  Nome: ' '
  So fora do conteudo: true

