# ==========================================================================
#  StarSkyWars - niveis
#
#  Cada faixa (0, 1-3, 4, 5-10, outros) diz o Nome (a tag do nivel, com
#  {nivel}) e o XP que cada nivel da faixa custa para subir. O nivel do
#  jogador e calculado do xp total: subir e so passar de faixa.
#  'outros' vale para todo nivel que nao esta em nenhuma faixa.
# ==========================================================================

Versao do modelo: 1

Nivel maximo: 1000

Niveis:
  0:
    Nome: '&7[{nivel}✩]'
    XP: 500
  1-4:
    Nome: '&7[{nivel}✩]'
    XP: 1000
  5-9:
    Nome: '&a[{nivel}✩]'
    XP: 2500
  10-19:
    Nome: '&b[{nivel}✩]'
    XP: 5000
  20-29:
    Nome: '&e[{nivel}✩]'
    XP: 7500
  30-49:
    Nome: '&6[{nivel}✩]'
    XP: 10000
  50-99:
    Nome: '&c[{nivel}✩]'
    XP: 15000
  outros:
    Nome: '&5[{nivel}✩]'
    XP: 20000
