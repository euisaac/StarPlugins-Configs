# =====================================================================
#  StarCosmeticos - nomes dos comandos
#
#  Os comandos /cosmeticos e /starcosmeticos ja existem sem mexer aqui.
#  Este arquivo serve para dar outros nomes a eles, sem tocar no jar --
#  util quando outro plugin do servidor ja usa o mesmo nome.
#
#  Formato: 'principal|apelido|apelido'. Deixe vazio para nao criar nada.
#  Precisa reiniciar o servidor para valer.
# =====================================================================

comandos:
  cosmeticos: 'cosmeticos|cosmetico|cosmetics|gadgets'
  starcosmeticos: 'starcosmeticos|starcosm'
