# =====================================================================
#  StarCosmeticos - as janelas
#
#  Todo item aceita:
#    Slot / Slots       onde ele aparece (Slots e uma lista)
#    Item               material; nomes novos funcionam em versao antiga
#    Textura            base64, URL ou hash, para cabecas
#    Dono               nick, para usar a skin de um jogador
#    Nome / Lore / Brilho / Quantidade / Encantamentos
#    Permissao          quem nao tem nao consegue clicar
#    Esconder sem permissao
#    Acoes              lista extra, alem do que o botao ja faz
#
#  Acoes disponiveis: fechar, atualizar, comando: <cmd>, console: <cmd>,
#  op: <cmd>, mensagem: <texto>, anuncio: <texto>, titulo: <texto>,
#  actionbar: <texto>, som: <SOM;volume;tom>.
#
#  As chaves dos itens (voltar, proximo, limpar...) sao reconhecidas pelo
#  plugin: nao troque o nome delas, so o visual.
# =====================================================================

