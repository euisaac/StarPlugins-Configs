# ---------------------------------------------------------------------------
#  StarBunkers - tudo que o jogador le
#
#  Mensagem vazia ('') nao e enviada: e assim que voce desliga um aviso sem
#  precisar de uma opcao separada para ele.
#
#  O prefixo entra em toda mensagem simples. As listas (Ajuda, Ajuda do bunker,
#  Admin.Ajuda, Bunker.Info) saem sem prefixo, uma linha por vez.
# ---------------------------------------------------------------------------
Versao do modelo: 1

Prefixo: '&2&lBUNKERS &8» &r'

Geral:
  So jogador: '&cEste comando so funciona dentro do jogo.'
  Sem permissao: '&cVoce nao tem permissao para isso.'
  Jogador offline: '&cO jogador &f{jogador} &cprecisa estar online.'
  Numero invalido: '&cDigite um numero valido.'
  Tempo invalido: '&cDigite um tempo valido, como &f7d&c, &f12h &cou &f30m&c.'
  # Serve para toda pergunta feita no chat.
  Palavra de cancelar: 'cancelar'
  # Serve para o que nao tem volta e e digitado no chat (abandonar o bunker).
  Palavra de confirmar: 'confirmar'
  Cancelado: '&7Voce cancelou.'

Menu:
  Sim: '&aSim'
  Nao: '&cNao'
  Ligado: '&aligado'
  Desligado: '&cdesligado'
  Online: '&aonline'
  Offline: '&7offline'
  Trancado: '&ctrancado'
  Destrancado: '&adestrancado'
  Sem dono: '&7ninguem'
  Sem busca: '&7nada'
  Sem categoria: '&7Sem tipo'
  Sem boas vindas: '&7nenhuma'
  Todas as categorias: '&aTodos'
  Nao definido: '&cnao definido'
  Opcao atual: ' &f• &a{nome}'
  Opcao: ' &f• &7{nome}'

  Acesso dono: '&aSeu bunker'
  Acesso amigo: '&aVoce e amigo daqui'
  Acesso livre: '&aLivre para alugar'
  Acesso visitante: '&eA porta esta aberta'
  Acesso barrado: '&cPorta trancada'

  Filtros:
    TODOS: 'Todos'
    DISPONIVEIS: 'Disponiveis'
    ALUGADOS: 'Alugados'
    MEUS: 'Meus bunkers'
    AMIGO: 'Sou amigo'

  Ordens:
    PADRAO: 'Padrao'
    PRECO: 'Preco'
    TAMANHO: 'Tamanho'
    VISITAS: 'Mais visitados'
    RECENTES: 'Mais novos'
    NOME: 'Nome'

  Estados:
    Livre: '&alivre'
    Alugado: '&ealugado'
    Vencido: '&cvencido'
    Incompleto: '&cincompleto'

Ajuda:
  - '&8&m-------------------------------'
  - '&2&lBUNKERS'
  - '&f/bunker &7- abre o menu do seu bunker'
  - '&f/bunkers &7- todos os bunkers do servidor'
  - '&f/bunkers livres &7- so os que estao para alugar'
  - '&f/bunkers buscar <texto> &7- procura por nome, dono ou descricao'
  - '&f/bunkers ir <id> &7- vai ate um bunker'
  - '&f/bunkers info <id> &7- os detalhes de um bunker'
  - '&f/bunkers cofre &7- o que sobrou de um aluguel vencido'
  - '&8&m-------------------------------'

Ajuda do bunker:
  - '&8&m-------------------------------'
  - '&2&lO SEU BUNKER'
  - '&f/bunker &7- abre o menu'
  - '&f/bunker amigos &7- quem pode entrar'
  - '&f/bunker trancar &7- fecha a porta'
  - '&f/bunker destrancar &7- abre a porta'
  - '&f/bunker ir &7- teleporta para o seu bunker'
  - '&f/bunker renovar &7- paga mais um periodo'
  - '&f/bunker registro &7- quem apareceu por la'
  - '&f/bunker cofre &7- itens guardados'
  - '&f/bunker abandonar &7- devolve o bunker'
  - '&8&m-------------------------------'

Bunker:
  Nao existe: '&cNao existe nenhum bunker com o id &f{id}&c.'
  Nao e seu: '&cO bunker &f{id} &cnao e seu.'
  Incompleto: '&cO bunker &f{id} &cainda nao esta pronto para alugar.'
  Sem spawn: '&cEste bunker ainda nao tem um ponto de chegada.'
  Trancado: '&cO bunker &f{bunker} &cesta trancado.'
  Teleportado: '&aVoce chegou em &f{bunker}&a.'
  Voce nao tem: '&eVoce ainda nao alugou nenhum bunker. Veja os que estao livres:'
  Escolha: '&eVoce tem mais de um bunker. Escreva o id depois do comando:'
  Item da lista: ' &f• &a{id} &7- {bunker}'
  Uso do ir: '&cUse: &f/{comando} {subcomando} <bunker>'
  Uso do info: '&cUse: &f/{comando} {subcomando} <bunker>'

  Digite o nome: |-
    &eDigite no chat o novo nome do seu bunker.
    &7Ate {maximo} letras. Escreva &f{cancelar} &7para desistir.
  Nome trocado: '&aO seu bunker agora se chama &f{bunker}&a.'
  Nome grande: '&cO nome pode ter no maximo &f{maximo} &cletras.'
  Digite a descricao: |-
    &eDigite no chat a descricao do seu bunker.
    &7Ate {maximo} letras. Escreva &f{cancelar} &7para desistir.
  Descricao trocada: '&aDescricao atualizada.'
  Descricao grande: '&cO texto pode ter no maximo &f{maximo} &cletras.'
  Digite as boas vindas: |-
    &eDigite no chat a mensagem que quem entrar vai ler.
    &7Escreva &f{cancelar} &7para desistir.
  Boas vindas trocadas: '&aMensagem de boas-vindas atualizada.'
  Texto bloqueado: '&cEsse texto tem uma palavra que nao e permitida.'
  Icone trocado: '&aIcone atualizado.'
  Icone tirado: '&7O icone voltou ao padrao.'
  Sem icone: '&cPonha um item na casa do meio antes de confirmar.'
  Categoria trocada: '&aO seu bunker agora e do tipo &f{categoria}&a.'
  Categoria tirada: '&7O seu bunker ficou sem tipo.'

  Info:
    - '&8&m-------------------------------'
    - '&a{bunker} &7({id})'
    - '&fMorador: &a{dono}'
    - '&fTipo: &a{categoria}'
    - '&fPorta: {estado}'
    - '&fAmigos: &a{amigos}'
    - '&fVisitas: &a{visitas}'
    - '&fTamanho: &a{tamanho} &7blocos'
    - '&fAluguel: &a{preco} &7por &f{duracao}'
    - '&fVence em: &a{vence}'
    - '&8&m-------------------------------'

Aluguel:
  Alugado: '&aVoce alugou o bunker &f{bunker} &apor &f{preco}&a. O aluguel vale por &f{tempo}&a.'
  Alugado por admin: '&aVoce recebeu o bunker &f{bunker} &apor &f{tempo}&a.'
  Ja alugado: '&cEsse bunker acabou de ser alugado por outra pessoa.'
  Em andamento: '&cEsse bunker esta sendo alugado neste momento. Tente de novo em instantes.'
  No limite: '&cVoce ja tem &f{limite} &cbunker(s). Abandone um antes de alugar outro.'
  Sem dinheiro: '&cVoce precisa de &f{preco} &cpara isso.'
  Sem moeda: '&cA moeda deste bunker nao existe mais. Avise a administracao.'
  Cedo demais: '&cVoce so pode renovar quando faltar &f{porcentagem}% &cdo prazo.'
  Renovado: '&aAluguel de &f{bunker} &arenovado por &f{preco}&a. Vence em &f{vence}&a.'
  Auto renovado: '&aO aluguel de &f{bunker} &afoi renovado sozinho por &f{preco}&a.'
  Auto falhou: '&cNao deu para renovar &f{bunker} &csozinho: faltou &f{preco}&c.'
  Auto desligada no servidor: '&cA renovacao automatica esta desligada neste servidor.'
  Confirme abandonar: |-
    &cIsso devolve o bunker &f{bunker} &ce tudo que estiver nele.
    &cSe for isso mesmo: &f/{comando} {subcomando} {id} {confirmar}
  Abandonado: '&7Voce abandonou o bunker &f{bunker}&7. O que foi pago nao volta.'
  Desalugado: '&cUm administrador tirou o seu aluguel de &f{bunker}&c.'
  Vai vencer: '&eO aluguel de &f{bunker} &evence em &f{tempo}&e.'
  Venceu: '&cO aluguel de &f{bunker} &cvenceu e o bunker voltou para o servidor.'
  Venceu na sua ausencia: '&cO aluguel de &f{bunker} &cvenceu enquanto voce estava fora.'

Tranca:
  Trancou: '&aO bunker &f{bunker} &aesta trancado. So voce e os seus amigos entram.'
  Destrancou: '&eO bunker &f{bunker} &eesta destrancado: qualquer um pode entrar.'
  Ja trancado: '&cO bunker &f{bunker} &cja esta trancado.'
  Ja destrancado: '&cO bunker &f{bunker} &cja esta destrancado.'
  Expulsou: '&7{quantidade} pessoa(s) que estavam la dentro foram para fora.'
  Expulso: '&c{dono} &ctrancou o bunker &f{bunker}&c.'
  Barrado: '&cO bunker &f{bunker} &cesta trancado. Fale com &f{dono}&c.'
  Alarme: '&c&lALARME &8» &fAlguem tentou entrar no seu bunker &a{bunker}&f: &e{jogador}'
  Alarme ligado: '&aO alarme do bunker foi ligado.'
  Alarme desligado: '&7O alarme do bunker foi desligado.'
  Confirme limpar: '&cSegure SHIFT e clique de novo para apagar o registro.'
  Registro limpo: '&aO registro de &f{bunker} &afoi apagado.'

Amigos:
  Digite: |-
    &eDigite no chat o nome de quem vai virar seu amigo no bunker.
    &7Escreva &f{cancelar} &7para desistir.
  Procurando: '&7Procurando &f{jogador}&7...'
  Nunca entrou: '&cO jogador &f{jogador} &cnunca entrou neste servidor.'
  Adicionado: '&a{jogador} &aagora entra no seu bunker.'
  Removido: '&7{jogador} &7nao entra mais no seu bunker.'
  Ja e: '&c{jogador} &cja e seu amigo neste bunker.'
  Voce mesmo: '&cVoce ja e o dono.'
  No limite: '&cO seu bunker so cabe &f{limite} &camigo(s).'
  So o dono: '&cSo o dono do bunker mexe nisso.'
  Sem convidar: '&cVoce nao pode chamar outras pessoas para este bunker.'
  Voce entrou: '&a{dono} &ate deixou entrar no bunker &f{bunker}&a.'
  Voce saiu: '&cVoce nao entra mais no bunker &f{bunker}&c.'

Cofre:
  Guardamos: '&eGuardamos &f{quantidade} &eitem(ns) do seu bunker. Use &f/bunkers cofre&e.'
  Retirado: '&aItem retirado do cofre.'
  Inventario cheio: '&cAbra espaco no seu inventario antes de retirar.'

Busca:
