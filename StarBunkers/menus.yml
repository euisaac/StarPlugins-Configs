# ---------------------------------------------------------------------------
#  StarBunkers - as telas
#
#  Slot -1 (ou a chave apagada) desliga o botao: e assim que voce tira o cofre,
#  o registro ou a categoria do menu sem precisar de uma opcao "Ativar" para
#  cada um.
#
#  "Slots" e a lista de casas onde o conteudo aparece; a quantidade delas e o
#  que define quantos itens cabem por pagina.
#
#  As trocas valem em todas as telas de bunker:
#    {id} {bunker} {dono} {descricao} {categoria} {preco} {moeda} {duracao}
#    {vence} {visitas} {amigos} {tamanho} {estado} {alarme}
#  E, onde faz sentido: {seu preco} {seu acesso} {desconto} {auto}
#  {limite amigos} {boas vindas} {area} {mundo} {spawn} {holograma}
# ---------------------------------------------------------------------------
Versao do modelo: 1

