# ---------------------------------------------------------------------------
#  StarBunkers - os nomes dos comandos
#
#  Os nomes do plugin.yml ja funcionam sempre. O que voce escrever aqui
#  ACRESCENTA nomes -- util quando /base ja e de outro plugin do seu servidor.
#  Separe as alternativas por "|"; a primeira e a principal.
#
#  Nos subcomandos, apagar a linha DESLIGA o subcomando: quem quiser o recurso
#  so pelo menu e so deixar em branco.
# ---------------------------------------------------------------------------
Versao do modelo: 1

comandos:
  bunker: ''
  bunkers: ''
  starbunkers: ''

# Subcomandos do /bunker (o menu do bunker do jogador).
subcomandos:
  amigos: 'amigos|amigo|convidar'
  trancar: 'trancar|fechar|trancado'
  destrancar: 'destrancar|abrir|destrancado'
  ir: 'ir|casa|home'
  renovar: 'renovar|pagar'
  cofre: 'cofre|itens|guardados'
  registro: 'registro|acessos|entradas'
  abandonar: 'abandonar|devolver'
  ajuda: 'ajuda|help|?'

# Subcomandos do /bunkers (a lista do servidor).
subcomandos lista:
  buscar: 'buscar|procurar|search'
  ir: 'ir|visitar|tp'
  meus: 'meus|minhas|meu'
  livres: 'livres|disponiveis|alugar'
  cofre: 'cofre|itens|guardados'
  info: 'info|detalhes'
  ajuda: 'ajuda|help|?'

subcomandos admin:
  criar: 'criar|create|novo'
  editar: 'editar|gerenciar|menu'
  varinha: 'varinha|wand|area'
  apagar: 'apagar|deletar|remover'
  alugar: 'alugar|dar'
  desalugar: 'desalugar|tirar'
  destrancar: 'destrancar|abrir'
  listar: 'listar|lista|list'
  historico: 'historico|log'
  recarregar: 'recarregar|reload|rl'
  info: 'info|versao'
