# =====================================================
#                     StarAjuda
#         Menu de ajuda customizável (/ajuda)
# =====================================================
#
# Este arquivo desenha o menu de /ajuda. Você pode editar tudo à mão aqui OU
# pelo editor no jogo: /starajuda editor (abre o /ajuda em modo de edição).
#
# MATERIAL de qualquer item aceita:
#   - Nome de um Material (ex.: GRASS_BLOCK, PAPER, PLAYER_HEAD)
#   - cabeca:<valor base64>   -> cabeça com textura (do minecraft-heads etc.)
#   - cabeca-nick:<nick>      -> cabeça com a skin do jogador <nick>
#
# TIPO de uma categoria:
#   - MENU -> clicar abre um submenu com um item por comando/função
#   - LORE -> não abre nada; a ajuda fica só na lore (passar o mouse por cima)

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       dono: 'Notch'
#       dono: '{player}'   # a cabeca de quem abriu o menu
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

menu:
  titulo: "&8Central de Ajuda"
  linhas: 6
  # Item fixo que explica pra que serve o menu.
  info:
    slot: 4
    material: BOOK
    nome: "&e&lCentral de Ajuda"
    lore:
      - "&7Aqui você encontra ajuda sobre"
      - "&7os recursos do servidor."
      - ""
      - "&7Clique em uma categoria abaixo."

# Cada categoria é um item no menu principal.
categorias:
  terreno:
    slot: 20
    material: GRASS_BLOCK
    nome: "&a&lTerreno"
    tipo: MENU
    lore:
      - "&7Tudo sobre proteger e"
      - "&7gerenciar o seu terreno."
      - ""
      - "&eClique para ver os comandos"
    submenu:
      titulo: "&8Ajuda › Terreno"
      linhas: 3
    itens:
      claim:
        slot: 11
        material: PAPER
        nome: "&a/terreno claim"
        lore:
          - "&7Reivindica o terreno onde você está."
      flags:
        slot: 13
        material: OAK_SIGN
        nome: "&a/terreno flags"
        lore:
          - "&7Gerencia as permissões do terreno."
      confiar:
        slot: 15
        material: PLAYER_HEAD
        nome: "&a/terreno confiar <jogador>"
        lore:
          - "&7Dá acesso ao terreno para um amigo."

  economia:
    slot: 22
    material: GOLD_INGOT
    nome: "&6&lEconomia"
    tipo: MENU
    lore:
      - "&7Dinheiro, loja e pagamentos."
      - ""
      - "&eClique para ver os comandos"
    submenu:
      titulo: "&8Ajuda › Economia"
      linhas: 3
    itens:
      saldo:
        slot: 12
        material: SUNFLOWER
        nome: "&6/saldo"
        lore:
          - "&7Mostra quanto dinheiro você tem."
      pagar:
        slot: 14
        material: EMERALD
        nome: "&6/pagar <jogador> <valor>"
        lore:
          - "&7Transfere dinheiro para outro jogador."

  regras:
    slot: 24
    material: BOOK
    nome: "&c&lRegras"
    tipo: LORE
    lore:
      - "&71. Não use hacks."
      - "&72. Respeite todos os jogadores."
      - "&73. Nada de spam no chat."
      - ""
      - "&8(categoria do tipo LORE: só leitura)"
