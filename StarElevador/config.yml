# Onde os elevadores ficam guardados.
# SQLITE: arquivo plugins/StarElevador/elevadores.db, nao precisa configurar nada.
# MYSQL: preencha os dados abaixo. Ao trocar de SQLITE para MYSQL, os elevadores
# do elevadores.db vao sozinhos para o MySQL na primeira subida.
# O elevators.yml antigo e migrado sozinho e fica guardado como elevators.yml.migrado.
database:
  type: SQLITE
  host: 'localhost'
  port: 3306
  database: 'minecraft'
  username: 'root'
  password: ''
  # Varios servidores no mesmo MySQL: use um prefixo diferente em cada um,
  # senao os elevadores de um aparecem no outro.
  table-prefix: 'starelevador_'
