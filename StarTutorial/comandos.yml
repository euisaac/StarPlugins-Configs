# ---------------------------------------------------------------------------
#  StarTutorial - os nomes dos comandos
#
#  Os nomes do plugin.yml (/tutorial e /startutorial) ja funcionam sempre.
#  O que voce escrever aqui ACRESCENTA nomes -- util quando /tutorial ja e de
#  outro plugin do seu servidor. Separe as alternativas por "|"; a primeira e
#  a principal.
#
#  Nos subcomandos, apagar a linha DESLIGA o subcomando: quem quiser o recurso
#  so pelo menu e so deixar em branco.
# ---------------------------------------------------------------------------
Versao do modelo: 1

comandos:
  tutorial: ''
  startutorial: ''

subcomandos:
  sair: 'sair|parar|cancelar|quit'
  pular: 'pular|proximo|skip'
  lista: 'lista|listar|tutoriais'
  ajuda: 'ajuda|help|?'

subcomandos admin:
  editor: 'editor|editar|gerenciar'
  recarregar: 'recarregar|reload|rl'
  setnpc: 'setnpc|criarnpc'
  delnpc: 'delnpc|removernpc'
  iniciar: 'iniciar|colocar|start'
  tirar: 'tirar|remover|parar'
  zerar: 'zerar|resetar|limpar'
  ver: 'ver|progresso|olhar'
  info: 'info|versao'
