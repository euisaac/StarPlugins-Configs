# ---------------------------------------------------------------------------
#  StarTutorial - as telas do jogador
#
#  So a tela que o JOGADOR ve fica aqui. As telas do editor
#  (/startutorial editor) tem layout fixo: elas ganham campo novo a cada
#  recurso do produto, e um arquivo antigo simplesmente esconderia o campo.
#
#  Slot -1 (ou a chave apagada) desliga o botao.
#  "Slots" e a lista de casas onde os tutoriais aparecem; a quantidade delas
#  e o que define quantos cabem por pagina.
#
#  Na moldura do tutorial, a linha {descricao} e trocada pelas linhas de
#  "Descricao" do proprio tutorial -- pode virar tres linhas ou nenhuma.
# ---------------------------------------------------------------------------
Versao do modelo: 1

Tutoriais:
  Titulo: '&8Tutoriais &7({pagina}/{paginas})'
  Linhas: 5
  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25 ]

  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '

  Tutorial:
    Nome: '{nome}'
    Lore:
      - '{descricao}'
      - ''
      - '&7Passos: &f{passos}'
      - '&7Duracao aproximada: &f{duracao}s'
      - '&7Situacao: {estado}'
      - '&7Voce ja fez &f{vezes}x&7.'
      - ''
      - '&eClique para comecar.'

  Fechar:
    Slot: 40
    Material: BARRIER
    Nome: '&cFechar'
    Lore:
      - '&7Fecha o menu.'

  Anterior:
    Slot: 38
    Material: ARROW
    Nome: '&ePagina anterior'
    Lore:
      - '&7Vai para a pagina &f{pagina}&7.'
  Proxima:
    Slot: 42
    Material: ARROW
    Nome: '&eProxima pagina'
    Lore:
      - '&7Vai para a pagina &f{pagina}&7.'
