# ==========================================================================
#  StarMagoFarms - cristais de mana
# --------------------------------------------------------------------------
#  O item que recarrega os magos. O jogador clica no mago com o cristal na
#  mao (shift = usa quantos precisar) ou usa "Recarregar" no painel.
#  Item: Material, Nome, Lore, Brilho, Textura (cabeca), Modelo (1.14+).
#  {mana} na lore vira a mana do cristal.
#  Loja: Ativar, Preco (por cristal), Moeda (vazio = a do config), Slot, Permissao.
#  Cada mago escolhe quais aceita em "Mana.Cristais aceitos" (vazio = todos).
#  Tambem se edita em jogo: /magosadmin editor > Cristais de mana
# ==========================================================================

Cristais:

  pequeno:
    Item:
      Material: PRISMARINE_CRYSTALS
      Nome: '&bCristal de Mana &7(pequeno)'
      Lore:
        - '&7Recarrega &b{mana} &7de mana de um mago.'
        - ''
        - '&eClique no mago com ele na mao.'
        - '&8Shift: usa quantos precisar.'
      Brilho: true
    Mana: 25
    Loja:
      Ativar: true
      Preco: 150
      Slot: 37

  medio:
