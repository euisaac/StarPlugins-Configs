# ==========================================================================
#  StarMagoFarms - magos
# --------------------------------------------------------------------------
#  Cada mago fica num lugar so: aparencia, mana, magias, niveis e loja.
#  Tudo aqui tambem se edita em jogo: /magosadmin editor
#
#  APARENCIA
#    Modo: MAGO (corpo pequeno com roupa e varinha) ou ORBE (so a cabeca
#          flutuando).
#    Cabeca.Textura: hash, URL ou base64 da textura (sites de cabecas).
#    Cabeca.Item serializado: preenchido pelo editor ("Cabeca da mao") -
#          serve qualquer item, ate com textura do seu pacote.
#    Roupa.Cor: '#RRGGBB' (armadura de couro pintada).
#    Varinha: Material + Modelo (CustomModelData do pacote, 1.14+) + Brilho,
#          ou "Item serializado" (editor: "Varinha da mao").
#    Bracos / Corpo visivel / Pequeno / Flutuar / Altura
#    Girar: OLHAR (vira para o jogador perto), GIRAR ou PARADO
#    Particula: em volta do mago (WITCH, HAPPY_VILLAGER, FLAME, END_ROD...)
#    Contorno brilhante: brilho em volta (1.9+)
#
#  MANA
#    Infinita: nunca acaba. Regeneracao por minuto: enche sozinha.
#    Sem regeneracao = funciona por "cargas": recarregue com cristais
#    (cristais.yml) ou comprando no painel. Cristais aceitos: lista de ids
#    (vazia = aceita todos).
#
#  MAGIAS (quantas quiser, de tipos iguais ou diferentes)
#    Tipo: CRESCER | COLHER | ARVORES | CEIFAR | INVOCAR | SPAWNERS | ANIMAIS | ASPIRAR
#    Comuns: Nome, Alvos, Custo de mana (so gasta se a magia fez algo),
#            XP por acao, Chance, Limite por onda (0 = todos), Raio extra,
#            Nivel minimo, Ligada de fabrica (false = o jogador liga no menu),
#            Particula, Som
#    CRESCER: Estagios, Altura maxima (cana/cacto/bambu)
#    COLHER:  Replantar, Destino (BOLSA | CHAO | BAU), Altura maxima (cana/
#             cacto/bambu so sao colhidos com essa altura; a base fica)
#    CEIFAR:  Dano (0 = mata), Ignorar nomeados, Guardar XP, XP por mob, Destino
#    INVOCAR: Virtual (sem mob: so os Drops), Quantidade, Limite na area,
#             Drops ('MATERIAL quantidade chance'), XP por mob, Sem IA, Destino
#    SPAWNERS: Reducao (segundos tirados da espera a cada onda)
#    ANIMAIS: Crescer filhotes, Reproduzir, Quantidade, Limite na area
#    ASPIRAR: Destino
#    Alvos das plantas: WHEAT, CARROTS, POTATOES, BEETROOTS, NETHER_WART, COCOA,
#      SUGAR_CANE, CACTUS, BAMBOO, MELON_STEM, PUMPKIN_STEM, MELON, PUMPKIN,
#      SWEET_BERRY_BUSH, TORCHFLOWER_CROP. '*' = todas.
#    Alvos de mob: nome do mob (ZOMBIE, COW...), aceita curinga (*_ZOMBIE).
#      No CEIFAR, '*' pega so os hostis.
#
#  NIVEIS (1, 2, 3...: o que faltar herda do nivel de baixo)
#    Raio, Altura, Intervalo (segundos), Mana maxima, Bolsa (0 = sem limite),
#    Forca (multiplica estagios, dano, mobs e colheita), XP para evoluir,
#    Custo para evoluir.
#
#  LOJA: Ativar, Preco, Moeda (vazio = a do config), Slot (-1 = proximo),
#    Permissao. Permissao (fora da loja) = para COLOCAR. Limite por jogador
#    deste tipo (0 = so o limite geral). Mundos: onde pode (vazio = todos).
#  Holograma.Linhas: vazio = o "Holograma padrao" do config.yml.
# ==========================================================================

