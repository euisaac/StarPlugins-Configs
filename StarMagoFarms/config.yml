# ==========================================================================
#  StarMagoFarms - configuracao geral
# --------------------------------------------------------------------------
#  Os magos (aparencia, magias, niveis, loja) ficam no magos.yml.
#  Os cristais de mana ficam no cristais.yml.
#  Textos no mensagens.yml; telas no menus.yml.
#  Tudo pode ser editado em jogo: /magosadmin editor
# ==========================================================================

Versao do modelo: 1

Debug: false

# --------------------------------------------------------------------------
# Banco de dados. SQLITE (arquivo na pasta do plugin) ou MYSQL.
# Trocar de banco exige reiniciar o servidor.
# --------------------------------------------------------------------------
Banco:
  Tipo: SQLITE
  Host: localhost
  Porta: 3306
  Banco: minecraft
  Usuario: root
  Senha: ''
  Prefixo: 'starmagofarms_'

# Economia usada na loja, na evolucao e (quando nao escolhida abaixo) na venda
# e na compra de mana:
#   vault                  a economia do Vault (padrao)
#   stareconomia           a moeda principal do StarEconomia
#   stareconomia-<moeda>   uma moeda do StarEconomia
Economia: vault

# --------------------------------------------------------------------------
# Colocar magos
# --------------------------------------------------------------------------
Colocar:
  # Distancia minima (blocos) entre dois magos.
  Distancia minima: 6
  # false = a area de um mago nao pode encostar na area de outro.
  Areas podem se sobrepor: true
  # Mundos onde nenhum mago pode ser colocado.
  Mundos bloqueados:
    - 'world_the_end'
  # Pergunta aos plugins de protecao (terrenos, regioes) se o jogador pode
  # construir ali antes de deixar colocar.
  Respeitar protecoes: true
  # Shift + clique direito no mago guarda ele de volta no inventario.
  Guardar com shift: true

# Quantos magos cada jogador pode ter colocados. Vale o MAIOR entre o padrao e
# as permissoes que ele tiver. -1 = sem limite.
Limites:
  Padrao: 3
  Por permissao:
    starmagofarms.limite.vip: 6
    starmagofarms.limite.mvp: 10

# --------------------------------------------------------------------------
# Funcionamento
# --------------------------------------------------------------------------
Funcionamento:
  # Os magos trabalham com o dono offline?
  Dono offline: true
  # Blocos: o mago so trabalha com algum jogador a essa distancia. 0 = sempre
  # (com o chunk carregado; mago em chunk descarregado nunca trabalha).
  Precisa de jogador perto: 0
  # Quando a bolsa enche: CHAO (o que sobra cai do lado do mago),
  # PERDER (o que sobra some) ou PARAR (as magias que juntam itens param).
  Bolsa cheia: CHAO

# Magos do jogador com estas permissoes lancam as magias mais rapido.
# Valor = % a menos no intervalo (maximo 90). Vale a maior.
Intervalo:
  Reducao por permissao:
    starmagofarms.rapido.vip: 10

# --------------------------------------------------------------------------
# Mana
# --------------------------------------------------------------------------
Mana:
  # Comprar mana pelo painel do mago (alem dos cristais e da regeneracao).
  Compra:
    Ativar: true
    Preco por ponto: 5
    # Vazio = a Economia la de cima.
    Moeda: ''

# --------------------------------------------------------------------------
# Venda da bolsa
# --------------------------------------------------------------------------
Venda:
  # Vazio = a Economia la de cima.
  Moeda: ''
  # Preco de UMA unidade. O que nao estiver aqui nao se vende (so se coleta).
  # Cada mago ainda tem um "Multiplicador de venda" no magos.yml.
  Precos:
    WHEAT: 2
    WHEAT_SEEDS: 0.2
    CARROT: 1.5
    POTATO: 1.5
    POISONOUS_POTATO: 0.5
    BEETROOT: 2
    BEETROOT_SEEDS: 0.2
    NETHER_WART: 3
    COCOA_BEANS: 2
    SUGAR_CANE: 2
    CACTUS: 2
    BAMBOO: 0.5
    MELON_SLICE: 1
    PUMPKIN: 6
    SWEET_BERRIES: 1.5
    ROTTEN_FLESH: 1
    BONE: 2
    ARROW: 1
    STRING: 2
    SPIDER_EYE: 3
    GUNPOWDER: 4
    ENDER_PEARL: 15
    IRON_INGOT: 25
    GOLD_NUGGET: 3
    GOLD_INGOT: 30
    BLAZE_ROD: 12
    MAGMA_CREAM: 8
    SLIME_BALL: 5
    LEATHER: 4
    BEEF: 3
    PORKCHOP: 3
    CHICKEN: 2
    MUTTON: 3
    FEATHER: 1
    EGG: 1
    WHITE_WOOL: 2
  # % a mais na venda para quem tem a permissao. Vale a maior.
  Bonus por permissao:
    starmagofarms.bonus.vip: 10
  # Segundos entre os resumos da venda automatica no chat do dono. 0 = sem resumo.
  Resumo da venda automatica: 60

# --------------------------------------------------------------------------
# Amigos (/magos amigos): o que eles podem fazer nos seus magos.
#   ABRIR, COLETAR, VENDER, RECARREGAR, MAGIAS, EVOLUIR   (* = tudo)
# Guardar, renomear, ligar bau e trocar a venda automatica sao so do dono.
# --------------------------------------------------------------------------
Amigos:
  Maximo: 10
  Podem:
    - ABRIR
    - COLETAR
    - RECARREGAR
    - MAGIAS

# --------------------------------------------------------------------------
# Visual
# --------------------------------------------------------------------------
Visual:
  # Flutuar, girar e olhar para o jogador. Desligado, os magos ficam parados.
  Animacao: true
  # So anima quem tem jogador a essa distancia (economiza servidor).
  Distancia da animacao: 32
  # Feixe de particulas da varinha ate o que a magia acertou.
  Feixe de magia: true
  Particula do feixe: WITCH
  # Particula do mago dormindo (sem mana).
  Particula sem mana: CLOUD
  # Barra de mana e de XP: {barra} e {barra_xp}.
  Tamanho da barra: 10
  Barra cheia: '&b|'
  Barra vazia: '&8|'

# Holograma de quem nao tem um proprio no magos.yml.
# {nome} {dono} {nivel} {nivel_max} {mana} {mana_max} {barra} {proxima}
# {estado} {bolsa} {bolsa_max} {xp} {xp_max} {barra_xp} {raio} {modo}
Holograma padrao:
  - '{nome} &7Nv.{nivel}'
  - '{barra} &b{mana}&7/&b{mana_max}'
  - '{estado} &8| &7proxima: &f{proxima}'

# O item do mago (quando o mago nao tem "Item.Nome"/"Item.Lore" proprios).
# {descricao} vira a descricao do mago; {magias} vira uma linha por magia.
Item do mago:
  Nome: '{nome} &7(Nv. {nivel})'
  Linha de magia: ' &8• {magia}'
  Lore:
    - '{descricao}'
    - ''
    - '&7Magias:'
    - '{magias}'
    - ''
    - ' &7Nivel: &f{nivel}&7/&f{nivel_max}'
    - ' &7Mana: &b{mana}&7/&b{mana_max}'
    - ' &7Raio: &f{raio} &7blocos  &7Intervalo: &f{intervalo}s'
    - ' &7Bolsa: &f{bolsa_max} &7itens'
    - ''
    - '&eClique com o direito no chao para colocar.'

# --------------------------------------------------------------------------
Sons:
  Clique: 'UI_BUTTON_CLICK;0.6;1.2'
  Erro: 'ENTITY_VILLAGER_NO;0.8;1'
  Pagina: 'ITEM_BOOK_PAGE_TURN;0.8;1'
  Colocar: 'ENTITY_ENDERMAN_TELEPORT;0.6;1.4'
  Guardar: 'ENTITY_ITEM_PICKUP;0.8;0.8'
  Magia: 'BLOCK_NOTE_BLOCK_PLING;0.35;1.8'
  Evoluir: 'ENTITY_PLAYER_LEVELUP;0.8;1.2'
  Recarregar: 'ENTITY_PLAYER_LEVELUP;0.5;2'
  Vender: 'ENTITY_EXPERIENCE_ORB_PICKUP;0.8;1'

Menus:
  # Milissegundos minimos entre dois cliques (evita clique duplo).
  Intervalo entre cliques: 150
