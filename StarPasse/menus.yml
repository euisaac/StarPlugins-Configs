        - '&aCLIQUE &7para ver.'
      Acoes:
        - 'diarias'
    voltar:
      Slot: 40
      Material: BARRIER
      Nome: '&c&lVOLTAR'
      Acoes:
        - 'principal'
    eventos:
      Slot: 42
      Material: FIREWORK_ROCKET
      Nome: '&d&lEVENTOS'
