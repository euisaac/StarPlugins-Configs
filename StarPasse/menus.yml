        - '&aCLIQUE &7para ver.'
      Acoes:
        - 'eventos'
    anterior:
      Slot: 36
      Material: ARROW
      Nome: '&e&lPAGINA ANTERIOR'
      Acoes:
        - 'anterior'
    proxima:
      Slot: 44
      Material: ARROW
      Nome: '&e&lPROXIMA PAGINA'
      Acoes:
