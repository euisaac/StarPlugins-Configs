# ==========================================================================
#  StarPasse - passe PREMIUM
#
#  Quem tem o premium (por comando: /starpasse passe setar <jogador> premium,
#  ou pela permissao starpasse.premium com 'Premium por permissao' ligado)
#  usa esta tabela de pontos e recebe estas recompensas, alem das gratuitas.
#
#  Mesmo formato do gratuito.yml. 'Permissao' e uma permissao extra que
#  tambem vale como premium (alem de starpasse.premium).
# ==========================================================================

Nome: '&dPremium'
Pontos por nivel: 100
Nivel maximo: 30
Permissao: ''

Acoes ao subir:
  - 'titulo: &d&lNIVEL {nivel}!<nl>&fPasse premium'
  - 'som: ENTITY_PLAYER_LEVELUP;1;1.3'

Itens:
  Sem passe:
    Material: FURNACE_MINECART
    Nome: '&d&lNIVEL {nivel} &7(premium)'
    Lore:
      - ''
      - '&fRecompensas:'
      - '{recompensas}'
      - ''
      - '&cVoce nao tem o passe premium.'
      - '&7Compre na loja para liberar.'
  Bloqueado:
    Material: FURNACE_MINECART
    Nome: '&c&lNIVEL {nivel} &7(premium)'
    Lore:
      - ''
      - '&fRecompensas:'
      - '{recompensas}'
      - ''
      - '&fPontos para chegar: &e{pontos_acumulados}'
      - '&fSituacao: {status}'
  Disponivel:
    Material: CHEST_MINECART
    Nome: '&d&lNIVEL {nivel} &7(premium)'
    Lore:
      - ''
      - '&fRecompensas:'
      - '{recompensas}'
      - ''
      - '&fSituacao: {status}'
  Resgatado:
    Material: FURNACE_MINECART
    Nome: '&7&lNIVEL {nivel} &7(premium)'
    Lore:
      - ''
      - '&fRecompensas:'
      - '{recompensas}'
      - ''
      - '&fSituacao: {status}'
  Vazio:
    Material: FURNACE_MINECART
    Nome: '&7&lNIVEL {nivel} &7(premium)'
    Lore:
      - ''
      - '&7Este nivel nao tem recompensa premium.'

