# ==========================================================================
#  StarPasse - baralho para GERAR SEMANAS sozinho
#
#  Usado por /starpasse semanas gerar e por 'Temporada nova.Gerar semanas
#  sozinho' (config.yml): o plugin sorteia daqui tantas missoes gratuitas e
#  premium por semana e escreve os arquivos semana-1.yml, semana-2.yml...
#  APAGANDO os que existem.
#
#  Mesmo formato do diarias.yml. {semana} nos textos vira o numero da semana.
#  Missao com 'Exclusiva: premium' entra na cota premium; as outras na cota
#  gratuita.
# ==========================================================================

Missoes:
  minerador:
    Nome: 'Semana {semana} - Minerador'
    Tipo: QUEBRAR
    Alvos: [ 'COAL_ORE', 'DEEPSLATE_COAL_ORE', 'IRON_ORE 2', 'DEEPSLATE_IRON_ORE 2' ]
    Necessario: 150
    Pontos: 60
    Item:
      Material: IRON_PICKAXE
      Nome: '&eMinerador'
      Lore:
        - '&7Minere &e150 &7minerios de carvao ou ferro.'

  lenhador:
    Nome: 'Semana {semana} - Lenhador'
    Tipo: QUEBRAR
    Alvos: [ '*_LOG' ]
    Necessario: 250
    Pontos: 50
    Item:
      Material: IRON_AXE
      Nome: '&eLenhador'
      Lore:
        - '&7Corte &e250 &7troncos.'

  fazendeiro:
    Nome: 'Semana {semana} - Fazendeiro'
    Tipo: COLHER
    Alvos: [ 'WHEAT', 'CARROTS', 'POTATOES', 'BEETROOTS' ]
    Necessario: 300
    Pontos: 50
    Item:
      Material: GOLDEN_HOE
      Nome: '&eFazendeiro'
      Lore:
        - '&7Colha &e300 &7plantacoes.'

  cacador:
    Nome: 'Semana {semana} - Cacador'
    Tipo: MATAR
    Alvos: [ 'ZOMBIE', 'SKELETON', 'SPIDER', 'CREEPER 2', 'ENDERMAN 3' ]
    Necessario: 100
    Pontos: 70
    Item:
      Material: IRON_SWORD
      Nome: '&eCacador'
      Lore:
        - '&7Mate &e100 &7monstros.'

  construtor:
    Nome: 'Semana {semana} - Construtor'
    Tipo: COLOCAR
    Alvos: []
    Necessario: 500
    Pontos: 50
    Item:
      Material: BRICKS
      Nome: '&eConstrutor'
      Lore:
        - '&7Coloque &e500 &7blocos.'

  ferreiro:
    Nome: 'Semana {semana} - Ferreiro'
    Tipo: FUNDIR
    Alvos: [ 'IRON_INGOT', 'GOLD_INGOT 2' ]
    Necessario: 128
    Pontos: 70
    Item:
      Material: FURNACE
      Nome: '&eFerreiro'
      Lore:
        - '&7Funda &e128 &7barras.'

  artesao:
    Nome: 'Semana {semana} - Artesao'
    Tipo: FABRICAR
    Alvos: []
    Necessario: 200
    Pontos: 50
    Item:
      Material: CRAFTING_TABLE
      Nome: '&eArtesao'
      Lore:
        - '&7Fabrique &e200 &7itens.'

  pescador:
    Nome: 'Semana {semana} - Pescador'
    Tipo: PESCAR
    Alvos: []
    Necessario: 40
    Pontos: 60
    Item:
      Material: FISHING_ROD
      Nome: '&ePescador'
      Lore:
        - '&7Pesque &e40 &7itens.'

  arqueiro:
    Nome: 'Semana {semana} - Arqueiro'
