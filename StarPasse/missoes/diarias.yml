      Material: OAK_LOG
      Nome: '&eLenhador'
      Lore:
        - '&7Corte &e80 &7troncos.'

  pescador:
    Nome: 'Pescador'
    Tipo: PESCAR
    Alvos: []
    Necessario: 15
    Pontos: 30
    Dificuldade: media
    Item:
      Material: FISHING_ROD
      Nome: '&ePescador'
      Lore:
        - '&7Pesque &e15 &7itens.'

  construtor:
    Nome: 'Construtor'
    Tipo: COLOCAR
    Alvos: []
    Necessario: 200
    Pontos: 20
    Dificuldade: facil
