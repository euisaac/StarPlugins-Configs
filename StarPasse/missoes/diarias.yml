# ==========================================================================
#  StarPasse - missoes DIARIAS (o baralho)
#
#  Todo dia o plugin sorteia 'Diarias.Quantidade' (config.yml) missoes daqui.
#  O sorteio e o mesmo em todos os servidores que compartilham o banco.
#
#  Cada missao:
#    Nome          Como aparece nas mensagens.
#    Tipo          A acao (lista no fim do arquivo).
#    Alvos         O que conta. Nome do material/entidade, com curinga (*_ORE)
#                  e peso opcional ('DIAMOND_ORE 5' = vale 5). Vazio ou '*'
#                  conta tudo. Tipos de texto (CHAT_CONTEM, COMANDO,
#                  CONQUISTA, PLACEHOLDER) comparam o texto.
#    Necessario    Quanto e preciso.
#    Pontos        Pontos de passe ao concluir.
#    Dificuldade   facil, media ou dificil (usada no sorteio por dificuldade).
#    Exclusiva     premium ou gratuito (opcional).
#    Permissao     So aparece para quem tem (opcional).
#    Item          Como aparece no menu. Substituicoes: {progresso}
#                  {necessario} {porcentagem} {barra} {pontos} {status}
#                  {etapa} {etapas} {info} {tipo} {dificuldade}
#
#  Missao em etapas: no lugar de Tipo/Alvos/Necessario, uma secao 'Etapas'
#  com varias (1, 2, 3...), cada uma com Tipo, Alvos, Necessario, Pontos e
#  Info (linhas mostradas por {info}). Veja a missao 'mineracao-completa'.
#
#  Tipos: QUEBRAR COLHER PLANTAR COLOCAR MATAR MATAR_JOGADORES MORRER DANO
#  FLECHAR LANCAR PESCAR FABRICAR FUNDIR ENCANTAR POCAO REPARAR COMER DOMAR
#  PROCRIAR TOSQUIAR ORDENHAR NEGOCIAR COLETAR MEL ANDAR CORRER AGACHAR NADAR
#  PLANAR VOAR PULAR TEMPO_JOGADO CHAT CHAT_CONTEM XP ENTRAR DORMIR COMANDO
#  PLACEHOLDER CONQUISTA
# ==========================================================================

Diarias:
  Nome: 'Missoes diarias'

Missoes:
  minerador:
    Nome: 'Minerador do dia'
    Tipo: QUEBRAR
    Alvos:
      - 'STONE'
      - 'COBBLESTONE'
      - 'DEEPSLATE'
    Necessario: 300
    Pontos: 20
    Dificuldade: facil
    Item:
      Material: STONE_PICKAXE
      Nome: '&eMinerador do dia'
      Lore:
        - '&7Quebre &e300 &7blocos de pedra.'

  carvoeiro:
    Nome: 'Carvoeiro'
    Tipo: QUEBRAR
    Alvos:
      - 'COAL_ORE'
      - 'DEEPSLATE_COAL_ORE'
    Necessario: 40
    Pontos: 25
    Dificuldade: facil
    Item:
      Material: COAL
      Nome: '&eCarvoeiro'
      Lore:
        - '&7Minere &e40 &7minerios de carvao.'

  ferreiro:
    Nome: 'Ferreiro'
    Tipo: FUNDIR
    Alvos:
      - 'IRON_INGOT'
    Necessario: 32
    Pontos: 30
    Dificuldade: media
    Item:
      Material: IRON_INGOT
      Nome: '&eFerreiro'
      Lore:
        - '&7Funda &e32 &7barras de ferro.'

  cacador:
    Nome: 'Cacador'
    Tipo: MATAR
    Alvos:
      - 'ZOMBIE'
      - 'SKELETON'
      - 'SPIDER'
      - 'CREEPER 2'
    Necessario: 30
    Pontos: 30
    Dificuldade: media
    Item:
      Material: IRON_SWORD
      Nome: '&eCacador'
      Lore:
        - '&7Mate &e30 &7monstros.'
        - '&7Creeper vale &e2&7.'

  fazendeiro:
    Nome: 'Fazendeiro'
    Tipo: COLHER
    Alvos:
      - 'WHEAT'
      - 'CARROTS'
      - 'POTATOES'
      - 'BEETROOTS'
    Necessario: 100
    Pontos: 25
    Dificuldade: facil
    Item:
      Material: WHEAT
      Nome: '&eFazendeiro'
      Lore:
        - '&7Colha &e100 &7plantacoes maduras.'

  lenhador:
    Nome: 'Lenhador'
    Tipo: QUEBRAR
    Alvos:
      - '*_LOG'
    Necessario: 80
    Pontos: 20
    Dificuldade: facil
