  mineracao-completa:
    Nome: 'Mineracao completa'
    Pontos: 30
    Dificuldade: dificil
    Etapas:
      1:
        Tipo: QUEBRAR
        Alvos: [ 'COAL_ORE', 'DEEPSLATE_COAL_ORE' ]
        Necessario: 20
        Pontos: 5
