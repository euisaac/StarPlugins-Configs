    Tipo: ANDAR
    Necessario: 2000
    Pontos: 20
    Dificuldade: facil
    Item:
      Material: LEATHER_BOOTS
      Nome: '&eAndarilho'
      Lore:
        - '&7Ande &e2.000 &7blocos.'

  maratonista:
