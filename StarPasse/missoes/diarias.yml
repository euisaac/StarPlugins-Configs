  artesao:
    Nome: 'Artesao'
    Tipo: FABRICAR
    Alvos: []
    Necessario: 64
    Pontos: 20
    Dificuldade: facil
    Item:
      Material: CRAFTING_TABLE
      Nome: '&eArtesao'
      Lore:
