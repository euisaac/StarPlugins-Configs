# ==========================================================================
#  StarPasse - textos
#
#  Mensagem vazia ('') simplesmente nao e enviada: e assim que se desliga um
#  aviso sem precisar de uma opcao "Ativar" para cada um.
#  Cores: &a, &c, ... e hex no formato &#RRGGBB.
#  Mensagem com {prefixo} decide sozinha onde ele entra; as outras recebem o
#  prefixo na frente.
# ==========================================================================

Versao do modelo: 1

Prefixo: '&6&lPASSE &8- &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  So jogador: '&cEste comando so funciona dentro do jogo.'
  Inativo: '&cO passe de batalha esta inativo (sem banco de dados). Avise a equipe.'
  Jogador offline: '&cO jogador &f{jogador} &cnao esta online.'
  Jogador nao encontrado: '&cO jogador &f{jogador} &cnunca entrou neste servidor.'
  Carregando: '&cSeu passe ainda esta carregando; tente de novo em instantes.'
  Numero invalido: '&cO numero &f{valor} &cnao vale.'
  Comando desconhecido: '&cO subcomando &f{comando} &cnao existe. Use &f/passe ajuda&c.'
  Uso: '&cUse: &f{uso}'

# Textos curtos usados nos menus, nas listagens e nos placeholders.
Etiquetas:
  Sim: '&aSim'
  Nao: '&cNao'
  Sem posicao: '&7--'
  Ninguem: '&7Ninguem'
  Nenhum: '&7Nenhum'
  Sem recompensa: '&7Nenhuma'
  Sem proxima: '&7--'
  Ja abriu: '&aja aberta'
  Temporada terminada: '&cterminada'
  Separador de lista: '&7, '
  Separador de recompensas: '&7, '
  # Cada recompensa na lore dos niveis ({recompensa} e o Nome do recompensas.yml).
  Linha de recompensa: '&8- {recompensa}'
  # Como uma missao aparece nos placeholders ("Minerador (12/50)").
  Missao com progresso: '{missao} &7({progresso}/{necessario})'
  Exclusiva premium: '&dExclusiva do passe premium'
  Exclusiva gratuito: '&aExclusiva do passe gratuito'
  Dificuldades:
    facil: '&aFacil'
    media: '&eMedia'
    dificil: '&cDificil'
  Tops:
    nivel: '&6Nivel'
    missoes: '&eMissoes'
    pontos: '&bPontos'

# O nome de cada acao, para as lores ({tipo}).
Acoes:
  QUEBRAR: 'Quebrar blocos'
  COLHER: 'Colher plantacoes'
  PLANTAR: 'Plantar'
  COLOCAR: 'Colocar blocos'
  MATAR: 'Matar mobs'
  MATAR_JOGADORES: 'Matar jogadores'
  MORRER: 'Morrer'
  DANO: 'Causar dano'
  FLECHAR: 'Acertar projeteis'
  LANCAR: 'Lancar projeteis'
  PESCAR: 'Pescar'
  FABRICAR: 'Fabricar itens'
  FUNDIR: 'Fundir no forno'
  ENCANTAR: 'Encantar itens'
  POCAO: 'Fazer pocoes'
  REPARAR: 'Usar a bigorna'
  COMER: 'Comer'
  DOMAR: 'Domar animais'
  PROCRIAR: 'Procriar animais'
  TOSQUIAR: 'Tosquiar ovelhas'
  ORDENHAR: 'Ordenhar vacas'
  NEGOCIAR: 'Negociar com aldeoes'
  COLETAR: 'Coletar itens'
  MEL: 'Colher mel'
  ANDAR: 'Andar'
  CORRER: 'Correr'
  AGACHAR: 'Andar agachado'
  NADAR: 'Nadar'
  PLANAR: 'Planar de elytra'
  VOAR: 'Voar'
  PULAR: 'Pular'
  TEMPO_JOGADO: 'Tempo jogado'
  CHAT: 'Falar no chat'
  CHAT_CONTEM: 'Dizer no chat'
  XP: 'Ganhar experiencia'
  ENTRAR: 'Entrar no servidor'
  DORMIR: 'Dormir'
  COMANDO: 'Usar um comando'
  PLACEHOLDER: 'Alcancar um valor'
  CONQUISTA: 'Concluir conquistas'

# Unidades de tempo, curtas.
Tempo:
  Dias: 'd'
  Horas: 'h'
  Minutos: 'm'
  Segundos: 's'

# A barrinha de progresso das lores e do actionbar.
Barra:
  Tamanho: 20
  Cheio: '|'
  Vazio: '|'
  Cor cheia: '&a'
  Cor vazia: '&8'

# O resumo do /passe status. Substituicoes: {jogador} {passe} {nivel}
# {nivel_maximo} {pontos} {pontos_nivel} {pontos_necessarios} {barra_nivel}
# {missoes_concluidas} {sequencia} {saldo} {pendentes} {abertas} {andamento}
# {temporada} {semana} {semanas} {diarias_tempo}
Status: |-
  &8&m----------&r &6&lPASSE DE {jogador} &8&m----------
  &fPasse: &e{passe}
  &fNivel: &e{nivel}&7/&e{nivel_maximo} &8| &fPontos: &e{pontos}
  &fProximo nivel: {barra_nivel} &7{pontos_nivel}/{pontos_necessarios}
  &fMissoes concluidas: &e{missoes_concluidas} &8| &fSequencia diaria: &e{sequencia} dias
  &fMissoes abertas: &e{abertas} &7({andamento} em andamento)
  &fRecompensas para resgatar: &e{pendentes}
  &fTemporada &e{temporada} &8| &fSemana &e{semana}&7/&e{semanas} &8| &fDiarias viram em &e{diarias_tempo}
  &8&m------------------------------------

# Aviso de progresso, nas porcentagens de 'Missoes.Avisar em' do config.
# Substituicoes: {missao} {categoria} {progresso} {necessario} {porcentagem}
# {barra} {etapa} {etapas} {pontos}
Missoes:
  Progresso chat: '&7Voce progrediu na missao &e{missao}&7: &f{progresso}&7/&f{necessario} &8({porcentagem}%)'
  Progresso actionbar: '&e{missao} &8| {barra} &7{progresso}/{necessario}'
  Barra de chefe: '&e{missao} &8- &f{progresso}&7/&f{necessario}'
  Etapa concluida: '&aEtapa &f{etapa}&7/&f{etapas} &ada missao &e{missao} &aconcluida! &7(+{pontos} pontos)'
  Concluida: '&a&lMISSAO CONCLUIDA! &e{missao} &7(+{pontos} pontos)'
  Status:
    Nao iniciada: '&7Nao iniciada'
    Andamento: '&eEm andamento'
    Concluida: '&aConcluida'
  # Linhas acrescentadas no fim da lore da missao, conforme a situacao.
  Lore:
    Nao iniciada:
      - ''
      - '&7Progresso: {barra} &7{progresso}/{necessario}'
      - '&fRecompensa: &e+{pontos} pontos'
    Andamento:
      - ''
      - '&7Progresso: {barra} &7{progresso}/{necessario} &8({porcentagem}%)'
      - '&fRecompensa: &e+{pontos} pontos'
    Concluida:
      - ''
      - '&a&lCONCLUIDA'
    Exclusiva premium:
      - ''
      - '&dExclusiva do passe premium.'
      - '&7Compre o passe premium na loja.'
    Exclusiva gratuito:
      - ''
      - '&aExclusiva do passe gratuito.'
    Impulso:
      - '&d+{impulso}% de progresso (impulso ativo)'

Diarias:
  Progresso chat: '&7Voce progrediu na missao diaria &e{missao}&7: &f{progresso}&7/&f{necessario} &8({porcentagem}%)'
  Progresso actionbar: '&e{missao} &8| {barra} &7{progresso}/{necessario}'
  Barra de chefe: '&e{missao} &8- &f{progresso}&7/&f{necessario}'
  Concluida: '&a&lMISSAO DIARIA CONCLUIDA! &e{missao} &7(+{pontos} pontos)'
  Todas concluidas: '&6&lDIARIAS COMPLETAS! &eVoce concluiu todas as &f{quantidade} &emissoes de hoje. &7(+{pontos} pontos)'
  Sequencia: '&6Sequencia diaria: &e{sequencia} &6dia(s) seguido(s)!'
  Sequencia com bonus: '&6Sequencia diaria: &e{sequencia} &6dia(s) seguido(s)! &7(+{pontos} pontos de bonus)'
  # Para o servidor inteiro, na virada do dia.
  Novas: '&eAs missoes diarias foram renovadas! Veja em &f/passe diarias&e.'
  Desligadas: '&cAs missoes diarias estao desligadas.'

Semanas:
  Concluida: '&6&lSEMANA {semana} COMPLETA! &eVoce concluiu todas as missoes da semana. &7(+{pontos} pontos)'
  Nova semana: '&eA &f{categoria} &edo passe de batalha abriu! Veja em &f/passe missoes&e.'
  Bloqueada: '&cA semana {semana} ainda nao abriu.'
  Nao existe: '&cNao existe a semana &f{semana}&c.'
  Status:
    Bloqueada: '&cBloqueada'
    Aberta: '&aAberta'
    Travada: '&7Encerrada'
    Concluida: '&aConcluida'

Eventos:
  Concluida: '&a&lMISSAO DE EVENTO CONCLUIDA! &e{missao} &7(+{pontos} pontos)'
  Fechado: '&cO evento &f{evento} &cnao esta aberto: {status}'
  Nao existe: '&cNao existe o evento &f{evento}&c.'
  Status:
    Antes: '&eComeca em {tempo}'
    Andamento: '&aEm andamento &7(termina em {tempo})'
    Acabou: '&cJa acabou'
    Concluido: '&aConcluido'
    Sem permissao: '&cVoce nao tem acesso a este evento'
    Exige: '&cConclua antes: {exigidas}'

# Ao subir de nivel. Substituicoes: {nivel} {nivel_maximo} {passe} {pontos}
Nivel:
  Subiu: '&aVoce subiu para o nivel &f{nivel} &ado passe! &7Veja as recompensas em &f/passe recompensas&7.'
  Maximo: '&6Voce chegou ao nivel maximo (&f{nivel}&6) do passe! Parabens!'
  Excedente: '&e{pontos} &7pontos alem do nivel maximo viraram &e{valor}&7.'

Recompensas:
  Resgatada: '&aRecompensas do nivel &f{nivel} &7({passe}) &aresgatadas: {recompensas}'
  Recebida: '&aVoce recebeu as recompensas do nivel &f{nivel} &7({passe})&a: {recompensas}'
  Pendentes ao entrar: '&eVoce tem &f{quantidade} &erecompensa(s) para resgatar! Use &f/passe recompensas&e.'
  Nada para resgatar: '&cVoce nao tem recompensas para resgatar.'
  Bloqueada: '&cVoce ainda nao chegou ao nivel &f{nivel}&c.'
  Ja resgatada: '&cVoce ja resgatou as recompensas do nivel &f{nivel}&c.'
  Sem passe: '&cSo quem tem o passe &f{passe} &cpode resgatar isto.'
  Sem recompensa: '&7Este nivel nao tem recompensa.'
  Status:
    Bloqueado: '&cBloqueado'
    Disponivel: '&aCLIQUE para resgatar!'
    Resgatado: '&7Ja resgatado'
    Sem passe: '&cVoce nao tem este passe'
    Vazio: '&7Sem recompensa'

Passe:
  Trocado: '&aSeu passe agora e o &f{passe}&a!'
  Resetado: '&cSeu passe foi zerado por um administrador.'

Temporada:
  # Para o servidor inteiro, ao abrir uma temporada nova.
  Nova: '&6&lNOVA TEMPORADA! &eA temporada &f{temporada} &edo passe de batalha comecou. Boa sorte!'

Top:
  Atualizando: '&7Atualizando o top, um instante...'

