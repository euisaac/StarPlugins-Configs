  Mao vazia: '&cSegure um item na mao.'
  Material: '&aItem na mao: &f{material} &7(nome no servidor: {cru})'

Ajuda:
  Jogador: |-
    &8&m----------&r &6&lPASSE DE BATALHA &8&m----------
    &e/{comando} &7- abre o passe
    &e/{comando} recompensas &7- as recompensas de cada nivel
    &e/{comando} missoes &7- as semanas de missoes
    &e/{comando} semana <n> &7- as missoes de uma semana
    &e/{comando} diarias &7- as missoes de hoje
    &e/{comando} eventos &7- os eventos
    &e/{comando} top [nivel|missoes|pontos] &7- o ranking
    &e/{comando} impulsos &7- seus impulsos ativos
    &e/{comando} status &7- seu resumo
    &e/{comando} resgatar &7- resgata todas as recompensas pendentes
    &8&m------------------------------------
  Admin: |-
    &8&m----------&r &6&lSTARPASSE ADMIN &8&m----------
    &e/{comando} recarregar
    &e/{comando} pontos <dar|remover|setar> <jogador|online> <n>
    &e/{comando} nivel setar <jogador> <n>
    &e/{comando} passe setar <jogador|online|todos> <gratuito|premium>
    &e/{comando} missao <lista | ids <categoria> | progresso|concluir|resetar <jogador> <categoria> <id> [n]>
    &e/{comando} diarias <info|sortear>
    &e/{comando} temporada <info|nova|inicio <data>>
    &e/{comando} semanas gerar [semanas] [gratuitas] [premium]
    &e/{comando} impulso <adicionar|remover|lista> ...
    &e/{comando} saldo <dar|remover|setar> <jogador> <valor>
    &e/{comando} resetar <jogador> &8| &e/{comando} resgatar <jogador>
    &e/{comando} ver <jogador> &8| &e/{comando} npc <criar|remover> &8| &e/{comando} material
    &8&m------------------------------------
