  Linha: '&8- &d+{porcentagem}% &fde {tipo} &7em {afeta} &8({tempo})'
  Servidor comecou: '&d&lIMPULSO! &7O servidor ganhou &d+{porcentagem}% &7de {tipo} em {afeta} por &f{tempo}&7.'
  Servidor terminou: '&7O impulso de &d+{porcentagem}% &7de {tipo} em {afeta} acabou.'
  Jogador comecou: '&d&lIMPULSO! &7Voce ganhou &d+{porcentagem}% &7de {tipo} em {afeta} por &f{tempo}&7.'
  Jogador terminou: '&7Seu impulso de &d+{porcentagem}% &7de {tipo} em {afeta} acabou.'
  Lista servidor: '&dImpulsos do servidor:'
  Lista jogador: '&dImpulsos de {jogador}:'
  Adicionado: '&aImpulso dado a &f{jogador}&a.'
  Removido: '&aImpulsos de &f{alvo} &aremovidos.'
  Invalido: '&cImpulso invalido. Tipo: PROGRESSO, PONTOS ou RECOMPENSAS; porcentagem > 0; duracao como 1h, 2d ou permanente.'

