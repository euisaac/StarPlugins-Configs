  Pontos: '&aPontos de &f{jogador}&a: {modo} &f{pontos}&a.'
  Pontos todos: '&a{pontos} pontos aplicados a todos os jogadores online.'
  Nivel: '&aNivel de &f{jogador} &adefinido para &f{nivel}&a.'
  Passe: '&aPasse de &f{jogador} &aagora e &f{passe}&a.'
  Passe online: '&aTodos os jogadores online agora tem o passe &f{passe}&a.'
  Passe todos: '&aTodos os jogadores (online e offline) agora tem o passe &f{passe}&a.'
