#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                       StarFactions - menus                           ║
#  ║   Cada botao tem Slot, Material, Nome e Lore. Slot -1 esconde o      ║
#  ║   botao. Material: '{jogador}' usa a cabeca do jogador da vez.       ║
#  ║   Os nomes de material valem de 1.8 ate 1.21 (escreva o nome novo).  ║
#  ╚══════════════════════════════════════════════════════════════════════╝
#
# Marcadores da facao, validos em quase todo menu:
#   {tag} {tagpura} {nome} {descricao} {lider} {membros} {membros_max} {online}
#   {poder} {poder_max} {terras} {terras_max} {temporarias} {temporarias_max}
#   {coins} {valor} {geradores} {geradores_armazenados} {geradores_colocados}
#   {armazem_max} {kdr} {abates} {mortes} {aliados} {aliados_max} {rivais}
#   {pedidos_alianca} {pedidos_entrada} {criada} {base} {escudo} {sob_ataque}
#   {vulneravel} {aberta} {ff_membros} {ff_aliados} {vitorias} {derrotas}
#   {discord} {boletins} {posicao} {moeda}
# Do jogador: {jogador} {cargo} {cargo_simbolo} {poder_jogador}
#   {poder_jogador_max} {abates_jogador} {mortes_jogador} {kdr_jogador} {visto}

Versao do modelo: 1

Menu da faccao:
  Titulo: '&8Facao {tagpura}'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '
  Botoes:
    Informacoes:
      Slot: 4
      Material: WHITE_BANNER
      Nome: '{tag} &f{nome}'
      Lore:
        - '&7{descricao}'
        - ''
        - '&7Lider: &f{lider}'
        - '&7Membros: &f{membros}/{membros_max} &8({online} online)'
        - '&7Poder: &f{poder}/{poder_max}'
        - '&7Terras: &f{terras}/{terras_max} &8(+{temporarias} temporarias)'
        - '&7Valor: &f{valor} &8(#{posicao})'
        - '&7KDR: &f{kdr} &8({abates}/{mortes})'
        - ''
        - '&7Vulneravel: {vulneravel}  &7Sob ataque: {sob_ataque}'
        - '&7Escudo: {escudo}'
        - '&7Criada em &f{criada}'
    Jogador:
      Slot: 49
      Material: '{jogador}'
      Nome: '&e{jogador} &7({cargo})'
      Lore:
        - '&7Poder: &f{poder_jogador}/{poder_jogador_max}'
        - '&7Abates: &f{abates_jogador}  &7Mortes: &f{mortes_jogador}'
        - '&7KDR: &f{kdr_jogador}'
    Membros:
      Slot: 19
      Material: PLAYER_HEAD
      Nome: '&aMembros'
      Lore:
        - '&7{membros}/{membros_max} membros, {online} online.'
        - '&7Pedidos de entrada: &f{pedidos_entrada}'
        - ''
        - '&eClique para ver.'
    Terras:
      Slot: 20
      Material: FILLED_MAP
      Nome: '&2Terras'
      Lore:
        - '&7Definitivas: &f{terras}/{terras_max}'
        - '&7Temporarias: &f{temporarias}/{temporarias_max}'
        - ''
        - '&eClique para abrir o mapa e'
        - '&edominar clicando.'
    Base:
      Slot: 21
      Material: RED_BED
      Nome: '&dBase da facao'
      Lore:
        - '&7Base: {base}'
        - ''
        - '&eEsquerdo: &7ir para a base'
        - '&eDireito: &7definir a base aqui'
    Banco:
      Slot: 22
      Material: GOLD_INGOT
      Nome: '&6Banco'
      Lore:
        - '&7Saldo: &f{coins}'
        - ''
        - '&eClique para depositar ou sacar.'
    Bau:
      Slot: 23
      Material: CHEST
      Nome: '&6Bau da facao'
      Lore:
        - '&7Um bau dividido com a facao.'
        - ''
        - '&eClique para abrir.'
    Armazem:
      Slot: 24
      Material: SPAWNER
      Nome: '&2Armazem de geradores'
      Lore:
        - '&7Guardados: &f{geradores_armazenados}/{armazem_max}'
        - '&7Colocados nas terras: &f{geradores_colocados}'
        - ''
        - '&eClique para abrir.'
    Melhorias:
      Slot: 25
      Material: ANVIL
      Nome: '&bMelhorias'
      Lore:
        - '&7Mais membros, bau, poder,'
        - '&7aliados, voo e muito mais.'
        - ''
        - '&eClique para ver.'
    Relacoes:
      Slot: 28
      Material: IRON_SWORD
      Nome: '&cRelacoes'
      Lore:
        - '&7Aliados: &f{aliados}/{aliados_max}'
        - '&7Rivais: &f{rivais}'
        - '&7Pedidos de alianca: &f{pedidos_alianca}'
        - ''
        - '&eClique para ver.'
    Permissoes:
      Slot: 29
      Material: WRITABLE_BOOK
      Nome: '&ePermissoes'
      Lore:
        - '&7O que cada cargo e cada'
        - '&7relacao pode fazer.'
        - ''
        - '&eClique para editar.'
    Boletins:
      Slot: 30
      Material: PAPER
      Nome: '&fMural'
      Lore:
        - '&7{boletins} boletim(ns) no mural.'
        - ''
        - '&eClique para ver.'
    Historico:
      Slot: 31
      Material: BOOK
      Nome: '&fHistorico'
      Lore:
        - '&7Tudo o que aconteceu na facao.'
        - ''
        - '&eClique para ver.'
    Configuracoes:
      Slot: 32
      Material: COMPARATOR
      Nome: '&7Configuracoes'
      Lore:
        - '&7Cor da tag, brasao, fogo amigo,'
        - '&7Discord, nome e descricao.'
        - ''
        - '&eClique para abrir.'
    Top:
      Slot: 33
      Material: GOLD_BLOCK
      Nome: '&6Top facoes'
      Lore:
        - '&7A sua facao: &f#{posicao}'
        - ''
        - '&eClique para ver o ranking.'
    Escudo:
      Slot: 34
      Material: SHIELD
      Nome: '&9Escudo'
      Lore:
        - '&7Terras imunes a explosoes.'
        - '&7Estado: {escudo}'
        - ''
        - '&eClique para ligar.'
    Batalha:
      Slot: 40
      Material: DIAMOND_SWORD
      Nome: '&cBatalhas'
      Lore:
        - '&7Vitorias: &f{vitorias}  &7Derrotas: &f{derrotas}'
        - ''
        - '&eClique para ver os comandos.'
    Sair:
      Slot: 53
      Material: BARRIER
      Nome: '&cSair da facao'
      Lore:
        - '&7O lider desfaz a facao.'

