Menu do mapa:
  Titulo: '&8Mapa ({x}, {z})'
  # Material de cada tipo de terra no mapa.
  Terras:
    Voce: PLAYER_HEAD
    Livre: GRAY_STAINED_GLASS_PANE
    Membro: LIME_STAINED_GLASS_PANE
    Aliado: LIGHT_BLUE_STAINED_GLASS_PANE
    Neutro: WHITE_STAINED_GLASS_PANE
    Rival: RED_STAINED_GLASS_PANE
    Vulneravel: MAGENTA_STAINED_GLASS_PANE
    Protegida: ORANGE_STAINED_GLASS_PANE
    Guerra: BLACK_STAINED_GLASS_PANE
  # Nome e lore de cada tipo. {terra} {x} {z} {bloco_x} {bloco_z} {expira}
  Textos:
    Voce:
      Nome: '&eVoce esta aqui'
      Lore:
        - '&7{terra}'
        - '&7Chunk {x}, {z}'
        - ''
        - '&aEsquerdo: dominar'
        - '&cDireito: abandonar'
    Livre:
      Nome: '{terra}'
      Lore:
        - '&7Chunk {x}, {z} &8({bloco_x}, {bloco_z})'
        - ''
        - '&aClique para dominar.'
    Membro:
      Nome: '{terra}'
      Lore:
        - '&7Chunk {x}, {z}'
        - '&7Tipo: {expira}'
        - ''
        - '&cDireito: abandonar'
    Aliado:
      Nome: '{terra}'
      Lore:
        - '&7Chunk {x}, {z}'
    Neutro:
      Nome: '{terra}'
      Lore:
        - '&7Chunk {x}, {z}'
    Rival:
      Nome: '{terra}'
      Lore:
        - '&7Chunk {x}, {z}'
    Vulneravel:
      Nome: '{terra} &d(vulneravel)'
      Lore:
        - '&7Chunk {x}, {z}'
        - '&dMais terras do que poder!'
        - ''
        - '&aClique para dominar por cima.'
    Protegida:
      Nome: '{terra}'
      Lore:
        - '&7Chunk {x}, {z}'
    Guerra:
      Nome: '{terra}'
      Lore:
        - '&7Chunk {x}, {z}'
  # Os botoes ficam na ultima linha (slots 45 a 53).
  Botoes:
    Oeste:
      Slot: 45
      Material: ARROW
      Nome: '&fOeste'
    Norte:
      Slot: 46
      Material: ARROW
      Nome: '&fNorte'
    Sul:
      Slot: 47
      Material: ARROW
      Nome: '&fSul'
    Leste:
      Slot: 48
      Material: ARROW
      Nome: '&fLeste'
    Modo:
      Slot: 50
      Material: CLOCK
      Nome: '&eModo: {modo}'
      Lore:
        - '&7Temporaria custa {custo_temporaria}'
        - '&7do banco e expira sozinha.'
        - ''
        - '&eClique para trocar.'
    Ver terras:
      Slot: 51
      Material: ENDER_EYE
      Nome: '&bBordas em particulas: {ver_terras}'
    Informacoes:
      Slot: 52
      Material: BOOK
      Nome: '&fTerras da facao'
      Lore:
        - '&7Definitivas: &f{terras}/{terras_max}'
        - '&7Temporarias: &f{temporarias}/{temporarias_max}'
        - '&7Poder: &f{poder}/{poder_max}'
    Voltar:
      Slot: 53
      Material: BARRIER
      Nome: '&cVoltar'

