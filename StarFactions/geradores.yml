#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                    StarFactions - geradores                          ║
#  ║   Armazem de geradores da facao e o valor de cada um no top.         ║
#  ╚══════════════════════════════════════════════════════════════════════╝

Versao do modelo: 1

# Como o gerador sai do armazem:
#   ITEM    -> o proprio plugin entrega um gerador (spawner) do tipo certo.
#   COMANDO -> roda um comando de console. Use com plugins de gerador que tem
#              item proprio. Marcadores: {jogador} {tipo} {quantidade}
Retirar como: ITEM
Comando para dar: 'spawners give {jogador} {tipo} {quantidade}'

# O item entregue no modo ITEM (e o que a picareta Silk 2 derruba).
# Marcadores: {nome} {tipo}
Item:
  Nome: '&eGerador de {nome}'
  Lore:
    - '&7Tipo: &f{nome}'
    - ''
    - '&7Coloque para usar ou guarde'
    - '&7no armazem da facao.'

# Itens de gerador de outros plugins: quando o item nao traz o tipo por dentro,
# o nome dele (sem cor) e comparado com o "Nome" de cada tipo abaixo.
Reconhecer pelo nome: true

# Valor de cada tipo no "valor da facao" (top) e o nome mostrado.
