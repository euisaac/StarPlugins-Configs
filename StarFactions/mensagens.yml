Ajuda:
  Jogador: |
    &r
    &6&lCOMANDOS DE FACAO
    &r
    &6› &f/{comando} &8- &7abre o menu da facao
    &6› &f/{comando} criar <tag> <nome> &8- &7cria uma facao
    &6› &f/{comando} info [tag/jogador] &8- &7informacoes de uma facao
    &6› &f/{comando} convidar <jogador> &8- &7convida alguem
    &6› &f/{comando} aceitar [tag] &8- &7aceita um convite
    &6› &f/{comando} entrar <tag> &8- &7pede para entrar
    &6› &f/{comando} sair &8- &7sai da facao
    &6› &f/{comando} promover|rebaixar|expulsar <jogador>
    &6› &f/{comando} mapa [auto|menu] &8- &7mapa das terras
    &6› &f/{comando} dominar [raio] [temporaria] &8- &7domina terras
    &6› &f/{comando} abandonar [todas] &8- &7abandona terras
    &6› &f/{comando} verterras &8- &7mostra as bordas das terras
    &6› &f/{comando} base | setbase &8- &7vai para / define a base
    &6› &f/{comando} depositar|sacar <valor> &8- &7banco da facao
    &6› &f/{comando} bau | armazem | melhorias
    &6› &f/{comando} aliar|rival|neutro <tag> &8- &7relacoes
    &6› &f/{comando} boletim <mensagem> &8- &7publica no mural
    &6› &f/{comando} escudo [ativar] &8- &7escudo contra explosoes
    &6› &f/{comando} voar &8- &7voa nas terras da facao
    &6› &f/{comando} chat [faccao|aliados|global] &8- &7modo de chat
    &6› &f/{comando} batalha &8- &7batalhas de arena
    &6› &f/{comando} poder [jogador] &8- &7poder e abates
    &6› &f/{comando} top | lista &8- &7ranking e lista de facoes
    &6› &f/. <mensagem> &8- &7chat da facao  &6/ac &8- &7chat de aliados
    &r
  Admin: |
    &r
    &c&lSTAFF DE FACOES
    &r
    &c› &f/{comando} recarregar | salvar
    &c› &f/{comando} bypass &8- &7ignora a protecao das terras
    &c› &f/{comando} espiar &8- &7ve os chats das facoes
    &c› &f/{comando} zona <protegida|guerra|livre> [raio]
    &c› &f/{comando} deletar <tag>
    &c› &f/{comando} info <tag> | nome <tag> <nome>
    &c› &f/{comando} lider <tag> <jogador>
    &c› &f/{comando} colocar <jogador> <tag> | tirar <jogador>
    &c› &f/{comando} poder|podermax <jogador> <valor>
    &c› &f/{comando} coins <tag> <dar|tirar|definir> <valor>
    &c› &f/{comando} melhoria <tag> <tipo> <nivel>
    &c› &f/{comando} escudo <tag> <remover|tempo>
    &c› &f/{comando} item <tipo> <jogador> [quantidade]
    &c› &f/{comando} arena <criar|remover|spawn1|spawn2|saida|canto1|canto2|lista> <nome>
    &r

