#  Como cada permissao aparece escrita no menu de cargos.
Nomes das permissoes:
  EXPULSAR: 'Expulsar membros'
  CONVIDAR: 'Convidar jogadores'
  ACEITAR_PEDIDO: 'Aceitar solicitacoes'
  ACESSAR_BAU: 'Acessar o bau'
  DEPOSITAR: 'Depositar no banco'
  SACAR: 'Sacar do banco'
  IR_BASE: 'Ir para a base'
  DEFINIR_BASE: 'Definir a base'
  APAGAR_BASE: 'Apagar a base'
  ALIADO_ADICIONAR: 'Fazer aliancas'
  ALIADO_REMOVER: 'Desfazer aliancas'
  RIVAL_ADICIONAR: 'Declarar rivais'
  RIVAL_REMOVER: 'Encerrar rivalidades'
  BOLETIM: 'Escrever boletins'
  FOGO_AMIGO_MEMBRO: 'Fogo amigo dos membros'
  FOGO_AMIGO_ALIADO: 'Fogo amigo dos aliados'
  TAG_PROPRIA: 'Usar tag propria'
  MUDAR_CARGO: 'Promover e rebaixar'
  MUDAR_TAG: 'Trocar a cor da tag'
  MUDAR_NOME: 'Trocar o nome'
  MUDAR_DESCRICAO: 'Trocar a descricao'
  MUDAR_ENTRADA: 'Trocar o tipo de entrada'
  MERCADO: 'Comprar no mercado'
