Ajuda:
  Jogador: |
    &r
    &b&lCOMANDOS DO CLAN
    &r
    &b› &f/clan &8- &7abre o menu do clan
    &b› &f/clan criar <tag> <nome> &8- &7cria um clan
    &b› &f/clan info [clan/jogador] &8- &7mostra as informacoes
    &b› &f/clan online &8- &7lista os clans com gente online
    &b› &f/clan top &8- &7mostra o ranking dos clans
    &b› &f/clan convidar <jogador> &8- &7convida alguem
    &b› &f/clan convites &8- &7lista os seus convites
    &b› &f/clan aceitar <clan> &8- &7aceita um convite
    &b› &f/clan solicitar <clan> &8- &7pede para entrar
    &b› &f/clan sair &8- &7sai do clan
    &b› &f/clan desfazer &8- &7desfaz o clan
    &r
    &b› &f/clan membros &8- &7lista os membros
    &b› &f/clan cargos &8- &7gerencia os cargos
    &b› &f/clan expulsar <jogador> &8- &7expulsa um membro
    &b› &f/clan transferir <jogador> &8- &7passa a lideranca
    &r
    &b› &f/clan base &8- &7vai para a base do clan
    &b› &f/clan bau &8- &7abre o bau do clan
    &b› &f/clan banco &8- &7abre o banco do clan
    &b› &f/clan mercado &8- &7abre o mercado do clan
    &b› &f/clan boletins &8- &7le o mural do clan
    &r
    &b› &f/clan cor &8- &7troca a cor da tag
    &b› &f/clan nome <nome> &8- &7troca o nome
    &b› &f/clan descricao <texto> &8- &7troca a descricao
    &b› &f/clan aliados &8- &7gerencia as aliancas
    &b› &f/clan rivais &8- &7gerencia as rivalidades
    &b› &f/clan fogoamigo &8- &7liga e desliga o fogo amigo
    &r
    &b› &f/cc <mensagem> &8- &7fala no chat do clan
    &b› &f/ac <mensagem> &8- &7fala no chat dos aliados
    &r
  Admin: |
    &r
    &b&lCOMANDOS ADMINISTRATIVOS
    &r
    &b› &f/starclans recarregar &8- &7recarrega os arquivos
    &b› &f/starclans info &8- &7estado do plugin
    &b› &f/starclans deletar <clan> &8- &7apaga um clan
    &b› &f/starclans verificar <clan> &8- &7verifica um clan
    &b› &f/starclans desverificar <clan> &8- &7tira a verificacao
    &b› &f/starclans definirlider <clan> <jogador> &8- &7troca o lider
    &b› &f/starclans item <tipo> <jogador> [quantia] &8- &7da um item especial
    &b› &f/starclans membros <clan> <quantia> &8- &7define as vagas de membro
    &b› &f/starclans aliados <clan> <quantia> &8- &7define as vagas de aliado
    &b› &f/starclans rivais <clan> <quantia> &8- &7define as vagas de rival
    &b› &f/starclans bau <clan> <linhas> &8- &7define as linhas do bau
    &b› &f/starclans banco <clan> <valor> &8- &7define o dinheiro do clan
    &b› &f/starclans resetarkdr <clan> &8- &7zera abates e mortes
    &b› &f/starclans entrar <clan> <jogador> &8- &7poe alguem no clan
    &b› &f/starclans sair <jogador> &8- &7tira alguem do clan
    &b› &f/starclans salvar &8- &7grava tudo agora
    &r

