#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                        StarClans - mercado                           ║
#  ║   A loja interna do clan: melhorias compradas com o dinheiro do      ║
#  ║   jogador ou com o dinheiro guardado no banco do clan.               ║
#  ║                                                                      ║
#  ║   Apagar um item daqui simplesmente tira ele do menu -- mas uma      ║
#  ║   atualizacao do modelo devolve o padrao dele; para desligar sem      ║
#  ║   que volte, ponha o Slot em -1.                                      ║
#  ╚══════════════════════════════════════════════════════════════════════╝

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 4

Menu:
  Titulo: '&8Mercado &7» &f{nome}'
  #  Cinco linhas com duas prateleiras: as EXPANSOES na segunda linha (11 a 15)
  #  e as MELHORIAS na quarta (29 a 33). A linha vazia entre elas e o que separa
  #  os dois grupos sem precisar de titulo.
  Linhas: 5
  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '
  Voltar:
    Slot: 40
    Material: 'ARROW'
    Nome: '&c&lVOLTAR'
    Lore: []
  Comprado:
    #  Como o item fica depois que o clan comprou o que ele vende e nao da mais
    #  para comprar de novo (a tag no Discord, o fly, o gradiente...). Itens que
    #  se compra varias vezes, como a troca de banner, nunca ficam assim.
    #
    #  Material vazio mantem o material do proprio item.
    #  {item} e o nome que o item tem na vitrine.
    Material: ''
    Nome: '{item}'
    Lore:
      - '&7O seu clan ja tem isto.'
      - '&r'
      - '&a&lJA COMPRADO'

  Pagamento:
    #  A pergunta "de onde sai o dinheiro", que aparece ao clicar num item com
    #  'Pagar com: ESCOLHER'. Com o banco do clan desligado no config.yml ela
    #  nao aparece: existe um bolso so, e nao ha o que perguntar.
    #
    #  Placeholders: {item} {preco} {moeda} {saldo_clan} {saldo_jogador}
    Titulo: '&8Pagar com &7» &f{item}'
    Linhas: 3
    Enfeite:
      Ativar: true
      Material: 'GRAY_STAINED_GLASS_PANE'
      Nome: ' '
    Clan:
      Slot: 11
      Material: 'GOLD_INGOT'
      Nome: '&6&lBANCO DO CLAN'
      Lore:
        - '&7Paga com o caixa que o clan juntou.'
        - '&r'
        - '&7Guardado: &a{moeda}{saldo_clan}'
        - '&7Custa: &a{moeda}{preco}'
        - '&r'
        - '&a&lCLIQUE &fpara pagar com o clan'
    Jogador:
      Slot: 15
      Material: 'EMERALD'
      Nome: '&a&lA MINHA CARTEIRA'
      Lore:
        - '&7Paga do seu proprio bolso, sem'
        - '&7mexer no caixa do clan.'
        - '&r'
        - '&7Voce tem: &a{moeda}{saldo_jogador}'
        - '&7Custa: &a{moeda}{preco}'
        - '&r'
        - '&a&lCLIQUE &fpara pagar do seu bolso'
    Voltar:
      Slot: 22
      Material: 'ARROW'
      Nome: '&c&lVOLTAR'
      Lore: []

#  Cada item tem:
#    Slot        - onde fica no menu
#    Preco       - quanto custa
#    Pagar com   - JOGADOR (a carteira de quem clicou), CLAN (o banco do clan),
#                  CASH (uma moeda do StarEconomia) ou ESCOLHER (o jogador
#                  decide na hora, numa tela; com o banco desligado vale
#                  como JOGADOR)
#    Permissao   - '' libera a todos
#    Acao        - o que acontece na compra:
#                    EXPANDIR_BAU, EXPANDIR_MEMBROS, EXPANDIR_ALIADOS,
#                    EXPANDIR_RIVAIS, RESETAR_KDR, VERIFICAR, COR_HEX,
#                    COMANDOS (so roda a lista de Comandos)
#    Comandos    - rodados no console; placeholders {jogador} {tag} {nome}
#
#  Placeholders na lore: {preco} {moeda} {tag} {nome} {membros} {aliados}
#                        {rivais} {linhas} {banco}
Itens:
  expandir-membros:
    Slot: 11
    Preco: 150000.0
    Pagar com: ESCOLHER
    Permissao: ''
    Acao: EXPANDIR_MEMBROS
    Comandos: []
    Display:
      Material: 'BRICK'
      Nome: '&a&lMAIS UMA VAGA DE MEMBRO'
      Lore:
        - '&7Aumenta em &f1 &7o limite de'
        - '&7membros do clan.'
        - '&r'
        - '&7Vagas agora: &f{membros}'
        - '&7Preco: &a{moeda}{preco}'
        - '&r'
        - '&a&lCLIQUE &fpara comprar'

  expandir-bau:
    Slot: 12
    Preco: 300000.0
    Pagar com: ESCOLHER
    Permissao: ''
    Acao: EXPANDIR_BAU
    Comandos: []
    Display:
      Material: 'CHEST'
      Nome: '&a&lMAIS UMA LINHA DE BAU'
      Lore:
        - '&7Aumenta em &f1 &7o numero de'
        - '&7linhas do bau do clan.'
        - '&r'
        - '&7Linhas agora: &f{linhas}'
        - '&7Preco: &a{moeda}{preco}'
        - '&r'
        - '&a&lCLIQUE &fpara comprar'

  expandir-aliados:
    Slot: 13
    Preco: 100000.0
    Pagar com: ESCOLHER
    Permissao: ''
    Acao: EXPANDIR_ALIADOS
    Comandos: []
    Display:
      Material: 'QUARTZ'
      Nome: '&a&lMAIS UMA VAGA DE ALIADO'
      Lore:
        - '&7Aumenta em &f1 &7o limite de'
        - '&7aliancas do clan.'
        - '&r'
        - '&7Vagas agora: &f{aliados}'
        - '&7Preco: &a{moeda}{preco}'
        - '&r'
        - '&a&lCLIQUE &fpara comprar'

  expandir-rivais:
    Slot: 14
    Preco: 100000.0
    Pagar com: ESCOLHER
    Permissao: ''
    Acao: EXPANDIR_RIVAIS
    Comandos: []
    Display:
      Material: 'NETHER_WART'
      Nome: '&a&lMAIS UMA VAGA DE RIVAL'
      Lore:
        - '&7Aumenta em &f1 &7o limite de'
        - '&7rivalidades do clan.'
        - '&r'
        - '&7Vagas agora: &f{rivais}'
        - '&7Preco: &a{moeda}{preco}'
        - '&r'
        - '&a&lCLIQUE &fpara comprar'

  resetar-kdr:
    Slot: 33
    Preco: 500000.0
    Pagar com: ESCOLHER
    Permissao: ''
    Acao: RESETAR_KDR
    Comandos: []
    Display:
      Material: 'NETHER_STAR'
      Nome: '&a&lZERAR O KDR'
      Lore:
        - '&7Zera os abates e as mortes'
        - '&7de todo o clan.'
        - '&r'
        - '&7Preco: &a{moeda}{preco}'
        - '&r'
        - '&a&lCLIQUE &fpara comprar'

  fly:
    Slot: 29
    Preco: 1500.0
    #  CASH cobra uma moeda do StarEconomia da carteira de quem clicou.
    #  O id da moeda e o que voce deu a ela la; sem o StarEconomia na casa,
    #  a compra e recusada em vez de sair de graca.
    Pagar com: CASH
    Moeda: 'cash'
    Permissao: ''
    Acao: FLY
    Comandos: []
    Display:
      Material: 'FEATHER'
      Nome: '&b&lVOO DO CLAN'
      Lore:
        - '&7Os membros passam a voar dentro'
        - '&7dos terrenos do clan.'
        - '&r'
        - '&7Preco: &b{preco} &7de cash'
        - '&r'
        - '&a&lCLIQUE &fpara comprar'

  expandir-homes:
    #  Uma vaga de home a mais. O teto e "Base.Maximo de homes" no config.yml.
    Slot: 15
    Preco: 200000.0
    Pagar com: ESCOLHER
    Permissao: ''
    Acao: EXPANDIR_HOMES
    Comandos: []
    Display:
      Material: 'LODESTONE'
      Nome: '&b&lMAIS UMA HOME'
      Lore:
        - '&7Uma vaga de ponto a mais para o clan.'
        - '&r'
        - '&7Vagas agora: &f{maximo_homes}'
        - '&7Preco: &a{moeda}{preco}'
        - '&r'
        - '&a&lCLIQUE &fpara comprar'

  troca-de-banner:
    #  Da direito a UMA troca do banner do clan. A primeira definicao do
    #  banner e de graca; este item e para quem quiser mudar depois.
    #  Pode ser comprado varias vezes -- as trocas acumulam.
    Slot: 32
    Preco: 75000.0
    Pagar com: ESCOLHER
    Permissao: ''
    Acao: TROCA_DE_BANNER
    Comandos: []
    Display:
      Material: 'WHITE_BANNER'
      Nome: '&e&lTROCAR O BANNER'
      Lore:
        - '&7Libera uma troca do banner do clan.'
        - '&r'
        - '&7Trocas guardadas: &f{trocas_de_banner}'
        - '&7Preco: &a{moeda}{preco}'
        - '&r'
        - '&a&lCLIQUE &fpara comprar'

  tag-discord:
    #  Da ao clan a tag no Discord do servidor: um cargo com a COR do clan, mais
    #  um chat e uma call privados, visiveis so para quem e do clan. Quem monta
    #  isso e o StarDiscordClan -- sem esse produto na casa o item nao aparece
    #  na vitrine, porque nao haveria quem entregasse a compra.
    #
    #  Compra unica: o item continua na vitrine, mas clicar de novo responde que
    #  o clan ja esta no limite.
    Slot: 31
    Preco: 1500.0
    Pagar com: CASH
    Moeda: 'cash'
    Permissao: ''
    Acao: TAG_DISCORD
    Comandos: []
    Display:
      Material: 'HEART_OF_THE_SEA'
      Nome: '&b&lTAG NO DISCORD'
      Lore:
        - '&7O clan ganha um cargo com a cor dele'
        - '&7no Discord, mais um chat e uma call'
        - '&7so para os membros.'
        - '&r'
        - '&7Preco: &a{preco} cash'
        - '&r'
        - '&a&lCLIQUE &fpara comprar'

  cargos-proprios:
    #  Libera o clan para CRIAR cargos proprios, alem dos do cargos.yml: nome,
    #  simbolo, peso, icone e permissoes, cargo a cargo. O teto de quantos cada
    #  clan pode criar esta no config.yml, em Cargos.
    #
    #  A permissao starclans.cargos libera o mesmo sem passar por aqui, para
    #  quem quiser dar a um grupo inteiro.
    Slot: 34
    Preco: 400000.0
    Pagar com: ESCOLHER
    Permissao: ''
    Acao: CARGOS_PROPRIOS
    Comandos: []
    Display:
      Material: 'WRITABLE_BOOK'
      Nome: '&a&lCARGOS DO CLAN'
      Lore:
        - '&7O clan passa a criar os proprios'
        - '&7cargos, com nome, simbolo, icone'
        - '&7e permissoes a escolher.'
        - '&r'
        - '&7Preco: &a{moeda}{preco}'
        - '&r'
        - '&a&lCLIQUE &fpara comprar'

  cor-hex:
    Slot: 30
    Preco: 1500000.0
    Pagar com: ESCOLHER
    Permissao: ''
    Acao: COR_HEX
    Comandos: []
    Display:
      Material: 'NAME_TAG'
      Nome: '&a&lTAG COM GRADIENTE'
      Lore:
        - '&7Libera as cores hex e o gradiente'
        - '&7na tag do clan.'
        - '&r'
        - '&7Preco: &a{moeda}{preco}'
        - '&r'
        - '&a&lCLIQUE &fpara comprar'
