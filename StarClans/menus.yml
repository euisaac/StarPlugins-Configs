#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                         StarClans - menus                            ║
#  ║   Slot -1 esconde o botao. "Material: {jogador}" vira a cabeca do    ║
#  ║   jogador da vez.                                                    ║
#  ║                                                                      ║
#  ║   Placeholders comuns em todos os menus:                             ║
#  ║     {tag} {tagcolorida} {nome} {descricao} {lider} {cargo}           ║
#  ║     {simbolo} {jogador} {membros} {maximo_membros} {online}          ║
#  ║     {aliados} {maximo_aliados} {rivais} {maximo_rivais}              ║
#  ║     {banco} {moeda} {abates} {mortes} {kdr} {linhas} {verificado}    ║
#  ║     {criado} {entrada} {base} {ff_membros} {ff_aliados}              ║
#  ╚══════════════════════════════════════════════════════════════════════╝

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

#
# ══════════════════════  MENU DE QUEM NAO TEM CLAN  ═══════════════════════
#
Menu sem clan:
  Titulo: '&8Clans'
  Linhas: 3

  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  Botoes:
    Perfil:
      Slot: 10
      Material: '{jogador}'
      Nome: '&b&l{jogador}'
      Lore:
        - '&r'
        - '&7Clan: &f{clan}'
        - '&7Abates: &f{abates}'
        - '&7Mortes: &f{mortes}'
        - '&7KDR: &f{kdr}'
        - '&r'
    Criar:
      Slot: 12
      Material: 'EMERALD_BLOCK'
      Nome: '&a&lCRIAR CLAN'
      Lore:
        - '&7Monte o seu proprio clan.'
        - '&r'
        - '&7Custo: &a{moeda}{custo}'
        - '&r'
        - '&a&lCLIQUE &fpara criar'
    Convites:
      Slot: 13
      Material: 'PAPER'
      Nome: '&e&lCONVITES'
      Lore:
        - '&7Convites que voce recebeu.'
        - '&r'
        - '&7Pendentes: &f{convites}'
        - '&r'
        - '&a&lCLIQUE &fpara ver'
    Procurar:
      Slot: 14
      Material: 'COMPASS'
      Nome: '&b&lPROCURAR CLAN'
      Lore:
        - '&7Veja os clans abertos e'
        - '&7peca para entrar.'
        - '&r'
        - '&a&lCLIQUE &fpara ver'
    Online:
      Slot: 15
      Material: 'ENDER_PEARL'
      Nome: '&b&lCLANS ONLINE'
      Lore:
        - '&7Quem esta jogando agora.'
        - '&r'
        - '&a&lCLIQUE &fpara ver'
    Top:
      Slot: 16
      Material: 'DIAMOND'
      Nome: '&6&lTOP CLANS'
      Lore:
        - '&7Os melhores clans do servidor.'
        - '&r'
        - '&a&lCLIQUE &fpara ver'
    Ligas:
      #  So aparece com o StarLigas instalado; -1 esconde de vez.
      Slot: 22
      Material: 'GOLDEN_APPLE'
      Nome: '&6&lLIGAS DE CLANS'
      Lore:
        - '&7Dispute as ligas do servidor'
        - '&7e garanta premios exclusivos.'
        - '&r'
        - '&a&lCLIQUE &fpara abrir'
    Fechar:
      Slot: 26
      Material: 'BARRIER'
      Nome: '&c&lFECHAR'
      Lore: []

#
# ══════════════════════════  MENU DO CLAN  ════════════════════════════════
#
Menu do clan:
  Titulo: '&8{tag} &7» &f{nome}'
  Linhas: 6

  # O titulo da tela do bau compartilhado; o tamanho vem das linhas do clan.
  Titulo do bau: '&8Bau &7» &f{nome}'

  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  Botoes:
    Informacoes:
      Slot: 4
      Material: '{jogador}'
      Nome: '&b&l{tagcolorida}'
      Lore:
        - '&7{descricao}'
        - '&r'
        - '&7Nome: &f{nome}'
        - '&7Lider: &f{lider}'
        - '&7Seu cargo: &f{simbolo}{cargo}'
        - '&7Fundado em: &f{criado}'
        - '&7Verificado: {verificado}'
        - '&7Entrada: &f{entrada}'
        - '&r'
        - '&7Membros: &f{membros}&7/&f{maximo_membros} &8(&a{online} online&8)'
        - '&7Abates: &f{abates} &8| &7Mortes: &f{mortes} &8| &7KDR: &f{kdr}'
        - '&r'
    Membros:
      Slot: 19
      Material: 'PLAYER_HEAD'
      Nome: '&b&lMEMBROS'
      Lore:
        - '&7Todos os membros do clan.'
        - '&r'
        - '&7No clan: &f{membros}&7/&f{maximo_membros}'
        - '&7Online: &a{online}'
        - '&r'
        - '&a&lCLIQUE &fpara ver'
    Cargos:
      Slot: 20
      Material: 'NAME_TAG'
      Nome: '&b&lCARGOS'
      Lore:
        - '&7O que cada cargo pode fazer.'
        - '&r'
        - '&a&lCLIQUE &fpara gerenciar'
    Convites:
      Slot: 21
      Material: 'PAPER'
      Nome: '&e&lCONVITES E PEDIDOS'
      Lore:
        - '&7Quem foi convidado e quem'
        - '&7pediu para entrar.'
        - '&r'
        - '&7Pedidos: &f{solicitacoes}'
        - '&r'
        - '&a&lCLIQUE &fpara ver'
    Boletins:
      Slot: 22
      Material: 'BOOK'
      Nome: '&e&lMURAL'
      Lore:
        - '&7Os recados do clan.'
        - '&r'
        - '&7Nao lidos: &f{nao_lidos}'
        - '&r'
        - '&a&lCLIQUE &fpara ler'
    Aliados:
      Slot: 23
      Material: 'GOLDEN_CHESTPLATE'
      Nome: '&a&lALIADOS'
      Lore:
        - '&7Os clans amigos.'
        - '&r'
        - '&7Aliados: &f{aliados}&7/&f{maximo_aliados}'
        - '&7Propostas: &f{propostas}'
        - '&r'
        - '&a&lCLIQUE &fpara gerenciar'
    Rivais:
      Slot: 24
      Material: 'IRON_SWORD'
      Nome: '&c&lRIVAIS'
      Lore:
        - '&7Os clans inimigos.'
        - '&r'
        - '&7Rivais: &f{rivais}&7/&f{maximo_rivais}'
        - '&r'
        - '&a&lCLIQUE &fpara gerenciar'
    Bau:
      Slot: 28
      Material: 'CHEST'
      Nome: '&6&lBAU DO CLAN'
      Lore:
        - '&7Guarde itens com o clan.'
        - '&r'
        - '&7Linhas: &f{linhas}'
        - '&r'
        - '&a&lCLIQUE &fpara abrir'
        - '&e&lCLIQUE DIREITO &fpara o historico'
    Banco:
      Slot: 29
      Material: 'GOLD_INGOT'
      Nome: '&6&lBANCO DO CLAN'
      Lore:
        - '&7O caixa comum do clan.'
        - '&r'
        - '&7Guardado: &a{moeda}{banco}'
        - '&r'
        - '&a&lCLIQUE &fpara abrir'
    Base:
      Slot: 30
      Material: 'COMPASS'
      Nome: '&b&lBASE DO CLAN'
      Lore:
        - '&7O ponto de encontro do clan.'
        - '&r'
        - '&7Local: &f{base}'
        - '&r'
        - '&a&lCLIQUE &fpara ir'
        - '&e&lCLIQUE DIREITO &fpara definir aqui'
    Mercado:
      Slot: 31
      Material: 'EMERALD'
      Nome: '&a&lMERCADO'
      Lore:
        - '&7Melhorias para o clan.'
        - '&r'
        - '&a&lCLIQUE &fpara abrir'
    Cor:
      Slot: 32
      Material: 'INK_SAC'
      Nome: '&d&lCOR DA TAG'
      Lore:
        - '&7A cor das letras da tag.'
        - '&r'
        - '&7Agora: &f{tagcolorida}'
        - '&r'
        - '&a&lCLIQUE &fpara trocar'
    Gerenciar:
      Slot: 33
      Material: 'COMPARATOR'
      Nome: '&b&lCONFIGURACOES'
      Lore:
        - '&7Nome, descricao, entrada e'
        - '&7a sua tag dentro do clan.'
        - '&r'
        - '&a&lCLIQUE &fpara abrir'
    Fogo amigo:
      Slot: 37
      Material: 'FLINT_AND_STEEL'
      Nome: '&c&lFOGO AMIGO'
      Lore:
        - '&7Deixa ou nao membros e aliados'
        - '&7se machucarem.'
        - '&r'
        - '&7Membros: {ff_membros}'
        - '&7Aliados: {ff_aliados}'
        - '&r'
        - '&a&lCLIQUE &fpara os membros'
        - '&e&lCLIQUE DIREITO &fpara os aliados'
    Top:
      Slot: 39
      Material: 'DIAMOND'
      Nome: '&6&lTOP CLANS'
      Lore:
        - '&7Os melhores clans do servidor.'
        - '&r'
        - '&a&lCLIQUE &fpara ver'
    Online:
      Slot: 40
      Material: 'ENDER_PEARL'
      Nome: '&b&lCLANS ONLINE'
      Lore:
        - '&7Quem esta jogando agora.'
        - '&r'
        - '&a&lCLIQUE &fpara ver'
    Ligas:
      #  So aparece com o StarLigas instalado; -1 esconde de vez.
      Slot: 41
      Material: 'GOLDEN_APPLE'
      Nome: '&6&lLIGAS DE CLANS'
      Lore:
        - '&7Dispute as ligas do servidor'
        - '&7e garanta premios exclusivos.'
        - '&r'
        - '&a&lCLIQUE &fpara abrir'
    Sair:
      Slot: 44
      Material: 'OAK_DOOR'
      Nome: '&c&lSAIR DO CLAN'
      Lore:
        - '&7Voce deixa de ser membro.'
        - '&r'
        - '&c&lCLIQUE &fpara sair'
    Desfazer:
      #  So aparece para o lider; ocupa o mesmo lugar do botao de sair.
      Slot: 44
      Material: 'TNT'
      Nome: '&4&lDESFAZER O CLAN'
      Lore:
        - '&7Apaga o clan para todo mundo.'
        - '&7Nao tem volta.'
        - '&r'
        - '&c&lCLIQUE &fpara desfazer'
    Fechar:
      Slot: 49
      Material: 'BARRIER'
      Nome: '&c&lFECHAR'
      Lore: []

