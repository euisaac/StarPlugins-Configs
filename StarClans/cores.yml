#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                         StarClans - cores                            ║
#  ║   As cores que o lider pode escolher para a tag do clan.             ║
#  ║                                                                      ║
#  ║   Apague uma cor daqui e ela some do menu -- e assim que se guarda   ║
#  ║   uma cor para VIP, deixando so a permissao dela ligada.             ║
#  ╚══════════════════════════════════════════════════════════════════════╝

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

#  Cada cor tem:
#    Codigo     - o codigo de cor (&0 a &f) ou hex (&#RRGGBB)
#    Permissao  - deixe '' para liberar a todos
#
#  A ordem do arquivo e a ordem do menu.
Cores:
