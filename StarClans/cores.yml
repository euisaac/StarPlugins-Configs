#  ── Cores hex e gradiente ───────────────────────────────────────────────
#  Precisam de servidor 1.16+ e da permissao starclans.cor.hex (ou do item
#  especial "Cor hex"). Em servidor antigo a cor e simplesmente ignorada.
#
#  Formatos aceitos no Codigo:
#    '&#54DAF4'                  cor unica
#    '<g:FF0000:00FF00>'         gradiente entre duas cores
