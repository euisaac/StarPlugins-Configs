# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

comandos:
  clan: 'clan|clans|cla|clas|guilda|guildas'
  clanchat: 'clanchat|cc'
  aliadochat: 'aliadochat|ac'
