# Todas as mensagens do plugin.
# Deixe uma mensagem vazia ('') para nao enviar nada.
# Suporta &a, &#0ae9ff e <nl> para quebra de linha.
# As linhas com <click:...> e <hover:...> continuam clicaveis, igual ao sistema antigo.
#
# Aqui o nome do vip e {vip}. O {display_name} e coisa dos arquivos de vip,
# em plugins/StarVips/vips/, onde ele evita reescrever o nome colorido em
# cada item.

# --- Gerais ---------------------------------------------------------
Sem permissao: '&cVoce nao tem permissao para isto.'
Somente jogador: '&cApenas jogadores in-game podem usar este comando.'
Jogador nao encontrado: '&cO jogador &f{player}&c nao foi encontrado.'
Nao e numero: '&cO valor informado nao e um numero.'
Sintaxe: '&cUse: /{command} {syntax}'
Cancelou: '&cOperacao cancelada.'
Recarregado: '&aStarVips recarregado com sucesso.'
Duracao invalida: '&cDuracao invalida: &f{duration}&c. Use 1d, 12h, 30m ou permanente.'
Placeholder sem vip: '&7Nenhum'

