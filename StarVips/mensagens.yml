# --- /vips ----------------------------------------------------------
Vips nenhum: '&cVoce nao tem nenhum vip.'
Vips nenhum alvo: '&cO jogador &f{player}&c nao tem nenhum vip.'
# O &r depois do nome fecha a cor e o negrito do vip, senao eles vazam para o
# resto da linha. O vip expirado usa o formato de baixo, sem tempo restante.
Vips formato: '  &8(<click:suggest_command:{id}><hover:show_text:"Clique para copiar">{id}</hover></click>) {vip_display}&r {status_cor} &7{expire_remaining}'
Vips formato expirado: '  &8(<click:suggest_command:{id}><hover:show_text:"Clique para copiar">{id}</hover></click>) {vip_display}&r {status_cor}'
Vips: |

  &aSeus vips:

  &f  ID:            &fVIP:

  {format}

Vips alvo: |

  &aVips de &f{player}&a:

  &f  ID:            &fVIP:

  {format}

