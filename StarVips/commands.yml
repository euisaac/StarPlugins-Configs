#
# Nomes dos comandos do plugin.
#
# Use "comando|alias|alias" para criar apelidos.
# Por exemplo: 'darvip|givevip|addvip'
#
# Se um nome ja pertencer a outro plugin (o sistema antigo, por exemplo), o StarVips
# avisa no console na inicializacao e o comando so responde com o prefixo
# /starvips:<comando>. Nesse caso, remova o plugin antigo ou troque o nome aqui.

Comandos:
  # --- Jogador -----------------------------------------------------
  vip: 'vip'
  vips: 'vips'
  tempovip: 'tempovip|timevip'
  trocarvip: 'trocarvip|tradevip'
  usarkey: 'usarkey|usarchave|usekey'
  ativarvip: 'ativarvip|activevip'
  verkeys: 'verkeys|chaves|keys'
  bonusvip: 'bonusvip|vipbonus'
  creditovip: 'creditovip|creditosvip'
  partyvip: 'partyvip'

  # --- Mercado -----------------------------------------------------
  vendervip: 'vendervip|sellvip'
  cancelarvendavip: 'cancelarvendavip|cancelarvenda|sellcancelvip'
  comprarvip: 'comprarvip|buyvip'
  vendasvip: 'vendasvip|sellsvip'

  # --- Administracao -----------------------------------------------
  darvip: 'darvip|givevip|addvip'
  setarvip: 'setarvip|setvip'
  removervip: 'removervip|removevip'
  removertempovip: 'removertempovip|removetimevip'
  removervipplayer: 'removervipplayer|removevipplayer'
  darchave: 'darchave|darkey|givekey'
  gerarkey: 'gerarkey|generatekey'
  criarkey: 'criarkey|createkey'
  editarkey: 'editarkey|editkey'
  removerkey: 'removerkey|deletarkey|deletekey'
  congelarvip: 'congelarvip|freezevip'
  infovip: 'infovip|vipinfo'
  starvips: 'starvips'
