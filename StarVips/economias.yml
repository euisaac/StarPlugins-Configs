#
# Moedas aceitas no mercado de chaves e nos upgrades.
#
# Provedores disponiveis:
#   VAULT         - a economia principal do servidor (precisa do Vault)
#   CREDITO       - os creditos VIP do proprio StarVips
#   PLAYERPOINTS  - PlayerPoints
#   COMANDO       - qualquer outro plugin, por comandos e placeholder
#
# O provedor COMANDO usa tres campos extras:
#   Saldo: '%plugin_saldo%'                 placeholder que devolve o saldo
#   Retirar: [ 'plugin tirar {player} {valor}' ]
#   Depositar: [ 'plugin dar {player} {valor}' ]
# Ele so funciona com o jogador online, porque o saldo vem de um placeholder.

# Moeda que ja vem selecionada ao colocar uma chave a venda.
# Deixe '' (vazio) para nao pre-selecionar nenhuma.
Padrao: 'dinheiro'

Economias:
  dinheiro:
    Provedor: 'VAULT'
    # Nome por extenso, usado nas mensagens.
    Nome: 'Dinheiro'
    # Nome curto, usado nas listas e lores.
    Abreviado: 'coins'
    # Permitir comprar de um jogador que esteja offline.
    Permitir offline: true
    # Deixe '' para liberar a todos.
    Permissao: ''
    Item:
      material: 'GOLD_INGOT'
      name: '&aDinheiro'
      lore:
        - ''
        - ' &7Seu saldo: &f{balance}'
        - ''
        - '&aClique para escolher'

  creditos:
    Provedor: 'CREDITO'
    Nome: 'Creditos VIP'
    Abreviado: 'creditos'
    Permitir offline: true
    Permissao: ''
    Item:
      material: 'DIAMOND'
      name: '&bCreditos VIP'
      lore:
        - ''
        - ' &7Seu saldo: &f{balance}'
        - ''
        - '&aClique para escolher'

