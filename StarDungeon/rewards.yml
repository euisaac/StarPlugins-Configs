# =========================================================
#              StarDungeon - Recompensas
#   Entregues a cada jogador quando uma dungeon e concluida.
#   "material" usa o nome do XSeries/Bukkit (ex: DIAMOND).
#   "chance" e a probabilidade (0-100) do item ser sorteado;
#   se omitida, o item sempre e entregue.
# =========================================================

recompensas:
  dinheiro-minimo: 50
  dinheiro-maximo: 150
  itens:
    - material: DIAMOND
      quantidade-minima: 1
      quantidade-maxima: 3
      chance: 100
    - material: GOLDEN_APPLE
      quantidade-minima: 1
      quantidade-maxima: 1
      chance: 25
    - material: EMERALD
      quantidade-minima: 1
      quantidade-maxima: 5
      chance: 60
