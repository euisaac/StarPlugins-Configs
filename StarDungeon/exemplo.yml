# =========================================================
#           StarDungeon - Dungeon de exemplo
#
#  Esta dungeon ja vem com 3 rounds de mobs configurados
#  (incluindo um boss com skill e efeitos no ultimo round).
#  Falta apenas voce (admin) redefinir os locais dela no seu
#  mundo.
#
#  Dentro do jogo, use /dungeonadmin setup exemplo para abrir
#  o menu de configuracao. Nele voce define spawn, saida,
#  regiao (fique no canto e clique), pontos de spawn por
#  round (com o marcador de spawn), boss, gates fisicos
#  (com o machado de portao) e efeitos de pocao de cada mob.
#
#  Depois disso a dungeon ja fica ativa (vem "ativada: true"
#  por padrao) e pode ser testada com /dungeon (menu) ou
#  /dungeon fila entrar exemplo.
#
#  OBS: assim que voce editar algo pelo menu, o plugin
#  reescreve este arquivo e estes comentarios somem - isso e
#  normal (limitacao do formato YAML do Bukkit).
# =========================================================

