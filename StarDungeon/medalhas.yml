# =========================================================
#              StarDungeon - Medalhas do perfil
#   Cada medalha desbloqueia sozinha quando a estatistica do
#   jogador alcanca o "valor". Use /dungeonadmin reload para
#   aplicar as mudancas.
#
#   Estatisticas disponiveis:
#     dungeons_completadas, mortes, mobs_mortos, bosses_mortos,
#     melhor_tempo (em segundos - use comparacao: MENOR_IGUAL),
#     passes_solo, dungeons_jogadas, vitorias_sem_morrer,
#     vitorias_solo, vitorias_em_grupo, eventos_participados,
#     eventos_vencidos, recordes_batidos,
#     dificuldade.<FACIL|NORMAL|MEDIO|DIFICIL|EXTREMO>.vitorias,
#     dungeon.<nome-da-dungeon>.vitorias
#   Addons (ex: StarDungeonInfinita) registram medalhas proprias
#   com as estatisticas deles - elas aparecem junto destas.
#
#   raridade: COMUM, INCOMUM, RARA, EPICA ou LENDARIA
#   oculta: true esconde nome e requisito ate desbloquear.
#   comandos: rodam pelo console ao desbloquear (%jogador%).
# =========================================================

# A partir de qual raridade o desbloqueio e anunciado no chat para todos.
anunciar-a-partir-de: EPICA
# Som tocado para quem desbloqueia (nome XSound). Vazio desativa.
som-desbloqueio: UI_TOAST_CHALLENGE_COMPLETE

medalhas:
  primeiros-passos:
    nome: "Primeiros Passos"
    icone: LEATHER_BOOTS
    raridade: COMUM
    estatistica: dungeons_completadas
    valor: 1
    descricao:
      - "&7Conclua sua primeira dungeon."
