# ============================================================
#  Sistema de RTP (Teleporte Aleatório) — inspirado no BetterRTP
# ============================================================
rtp:

  # Configuração padrão usada em QUALQUER mundo que não tenha uma
  # entrada customizada em 'mundos-customizados' abaixo.
  # É essa configuração que vale para mundos marcados com 'rtp: true' no /mundos,
  # a menos que o nome do mundo apareça também em 'mundos-customizados'.
  padrao:
    raio-maximo: 1000
    raio-minimo: 100
    centro-x: 0
    centro-z: 0
    formato: SQUARE          # SQUARE ou CIRCLE
    y-maximo: 320
    y-minimo: 60
    usar-worldborder: true
    cooldown: 30             # segundos

  # Segurança aplicada a TODO RTP, independente do mundo
  seguranca:
    # Impede que o jogador seja teleportado para dentro/perto de blocos perigosos
    # (água, lava, cactos, folhas, ar, bedrock, etc). Recomendado: true
    evitar-terrenos-perigosos: true

    # Quantas tentativas o plugin faz até desistir e avisar o jogador
    tentativas-maximas: 30

    # Quantos locais candidatos são gerados e verificados em paralelo por rodada.
    # Valores maiores encontram um local mais rápido, mas geram mais chunks de uma vez.
    # O carregamento/geração dos chunks é sempre assíncrono e o teleporte final usa
    # teleportAsync, então o servidor nunca trava esperando terreno novo ser gerado —
    # o jogador é movido assim que o chunk de destino estiver pronto.
    tentativas-paralelas: 4

    # Tempo máximo (em segundos) que a busca por um local seguro pode durar antes
    # de desistir, mesmo que ainda existam tentativas disponíveis. Evita que o
    # jogador fique esperando indefinidamente exposto a perigo (mobs, queda, etc.)
    # em mundos onde gerar terreno novo está demorando muito.
    tempo-limite-segundos: 8

    # Blocos nos quais o RTP NUNCA vai pousar (topo, chão ou "cabeça" do local sorteado)
    blacklist-blocos:
      - WATER
      - LAVA
      - CACTUS
      - OAK_LEAVES
      - JUNGLE_LEAVES
      - SPRUCE_LEAVES
      - BIRCH_LEAVES
      - DARK_OAK_LEAVES
      - ACACIA_LEAVES
      - MANGROVE_LEAVES
      - CHERRY_LEAVES
      - AZALEA_LEAVES
      - FLOWERING_AZALEA_LEAVES
      - AIR
      - VOID_AIR
      - CAVE_AIR
      - BEDROCK
      - KELP
      - KELP_PLANT
      - FIRE
      - SOUL_FIRE
      - MAGMA_BLOCK
      - POWDER_SNOW
      - SWEET_BERRY_BUSH

  # Título, subtítulo e som exibidos/tocados ao concluir QUALQUER RTP
  # (tanto pelo comando /rtp quanto pelo clique num mundo com 'rtp: true' no /mundos)
  efeito:
    title: "&a&lTeletransportado!"
    subtitle: "&7Boa sorte na aventura"
    som: ENTITY_ENDERMAN_TELEPORT
    volume: 1.0
    pitch: 1.0

  # Mundos com configuração própria (usar o NOME EXATO do mundo no servidor, não a chave do /mundos)
  # [MaxRadius] e [MinRadius] devem ser positivos e diferentes entre si.
  #
  # IMPORTANTE: se 'usar-worldborder' for true, o raio-maximo é automaticamente
  # limitado ao tamanho real do WorldBorder do mundo (com uma margem de segurança).
  # Isso evita que o plugin sorteie coordenadas fora da borda e gaste tempo à toa
  # gerando chunks que nunca serão usados. Configure o raio-maximo pensando no
  # tamanho que a borda TERÁ quando o mundo crescer, sem medo de exagerar.
  mundos-customizados:

    world_the_end:
      usar-worldborder: true
      raio-maximo: 1000
      raio-minimo: 250
      centro-x: 0
      centro-z: 0
      preco: 0
      formato: SQUARE
      y-maximo: 320
      y-minimo: 0
      cooldown: 1800

    recursos:
      usar-worldborder: true
      raio-maximo: 10000
      raio-minimo: 150
      centro-x: 0
      centro-z: 0
      preco: 0
      formato: CIRCLE
      y-maximo: 320
      y-minimo: 40
      biomas: []             # vazio = qualquer bioma. Ex: [DESERT, FOREST]
      rtp-ao-morrer: false   # se true, reposiciona o jogador ao renascer neste mundo
      cooldown: 60

    # O Nether é detectado automaticamente pelo plugin (via World.Environment do
    # Bukkit) e usa um algoritmo diferente de busca: como o teto do Nether é sempre
    # sólido, o plugin escaneia a coluna vertical inteira procurando uma bolsa de
    # ar sobre chão sólido, em vez de procurar "o ponto mais alto" (que no Nether
    # seria sempre o teto de bedrock/netherrack). Ajuste o y-minimo/y-maximo para
    # ficar longe do piso (y=0) e do teto (y=127) de bedrock.
    world_nether:
      usar-worldborder: true
      raio-maximo: 1000
      raio-minimo: 100
      centro-x: 0
      centro-z: 0
      preco: 0
      formato: SQUARE
      y-maximo: 100
      y-minimo: 32
      cooldown: 60

  # Executa o RTP em outro mundo quando o comando/clique acontece a partir do mundo listado.
  # Formato: "mundo-de-origem": "mundo-de-destino"
  overrides:
    spawn: world
    creative_world: world
