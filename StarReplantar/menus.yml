# ---------------------------------------------------------------------------
#  StarReplantar - a tela do /replantar
#
#  Slot -1 esconde o item: e assim que voce tira um botao do menu sem precisar
#  de uma opcao "Ativar" para cada um.
#
#  Cada botao de opcao tem um material e um nome para quando esta ligado e
#  outro para quando esta desligado. Na lore valem {estado}, {jogador},
#  {colheitas}, {replantes}, {mudas} e {area}.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "Textura"):
#       Dono: 'Notch'
#       Dono: '{jogador}'   # a cabeca de quem abriu o menu
#
# Com "Textura" ou "Dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "Textura".
#
# A cabeca por "Dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "Textura".
# ---------------------------------------------------------------------------

Versao do modelo: 1

Principal:
  Titulo: '&8Replantar'
  Linhas: 3
  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '
  Itens:
    Plantacoes:
      Slot: 10
      Ligado:
        Material: 'WHEAT'
        Nome: '&aReplante das plantacoes'
      Desligado:
        Material: 'WHEAT_SEEDS'
        Nome: '&cReplante das plantacoes'
      Lore:
        - '&7O que voce colhe e replantado'
        - '&7sozinho, sem perder a semente.'
        - ''
        - '&7Estado: {estado}'
        - ''
        - '&eClique &7para alternar.'
    Clique direito:
      Slot: 12
      Ligado:
        Material: 'IRON_HOE'
        Nome: '&aColheita com o clique direito'
      Desligado:
        Material: 'WOODEN_HOE'
        Nome: '&cColheita com o clique direito'
      Lore:
        - '&7Colha a plantacao crescida com o'
        - '&7clique direito, sem quebrar nada.'
        - ''
        - '&7Estado: {estado}'
        - ''
        - '&eClique &7para alternar.'
    Inventario:
      Slot: 14
      Ligado:
        Material: 'CHEST'
        Nome: '&aColheita direto no inventario'
      Desligado:
        Material: 'ENDER_CHEST'
        Nome: '&cColheita direto no inventario'
      Lore:
        - '&7A colheita vai direto para o seu'
        - '&7inventario em vez de cair no chao.'
        - ''
        - '&7Estado: {estado}'
        - ''
        - '&eClique &7para alternar.'
    Efeitos:
      Slot: 16
      Ligado:
        Material: 'BLAZE_POWDER'
        Nome: '&aParticulas e sons'
      Desligado:
        Material: 'GUNPOWDER'
        Nome: '&cParticulas e sons'
      Lore:
        - '&7Os efeitos que aparecem quando'
        - '&7algo e replantado ou plantado.'
        - ''
        - '&7Estado: {estado}'
        - ''
        - '&eClique &7para alternar.'
    Estatisticas:
      Slot: 22
      Material: 'PLAYER_HEAD'
      Nome: '&a{jogador}'
      Lore:
        - '&7Plantacoes colhidas: &f{colheitas}'
        - '&7Replantes feitos: &f{replantes}'
        - '&7Mudas que se plantaram: &f{mudas}'
        - '&7Colheitas em area: &f{area}'
