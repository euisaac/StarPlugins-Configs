# ---------------------------------------------------------------------------
#  StarReplantar - nomes de comando
#
#  Os comandos base ja vem do plugin.yml. Aqui voce cria nomes ALEM daqueles,
#  separados por | (o primeiro vira o comando, os outros viram aliases).
#  Deixe em branco para nao criar nenhum.
#
#  Nos subcomandos, cada chave a esquerda e fixa (o codigo usa ela) e a lista a
#  direita e o que o jogador digita. Apagar a linha desliga o subcomando -- e
#  assim que voce deixa um recurso so pelo menu.
# ---------------------------------------------------------------------------
Versao do modelo: 1

comandos:
  replantar: ''
  starreplantar: ''

subcomandos:
  plantacoes: 'plantacoes|plantacao|replante'
  cliquedireito: 'cliquedireito|clique|direito'
  inventario: 'inventario|inv|autopegar'
  efeitos: 'efeitos|particulas|sons'
  estatisticas: 'estatisticas|stats|status'
  ajuda: 'ajuda|help|?'

subcomandos admin:
  recarregar: 'recarregar|reload'
  info: 'info|status'
  ver: 'ver|perfil'
  alternar: 'alternar|toggle|setar'
  ajuda: 'ajuda|help|?'
