# ---------------------------------------------------------------------------
#  Os brilhos do servidor.
#
#  CADA CHAVE E UM BRILHO. O nome da chave e o id: e o que o jogador escreve em
#  /brilho <id> e o que entra na permissao.
#
#  CAMPOS
#    Nome        o que aparece no menu (aceita cores, hex e gradiente)
#    Icone       o item que representa o brilho no menu
#    Lore        linhas extras na lore do item, alem das do menus.yml
#    Permissao   quem pode usar. Apagando a linha, vale starbrilho.brilho.<id>.
#                Deixe '' para liberar a todos.
#    Cores       a lista de cores. Hex (#FF0000), nome (VERMELHO) ou codigo (&c)
#    Animacao    FIXO, CICLO, GRADIENTE, PULSAR, ARCO_IRIS ou ALEATORIO
#    Velocidade  tiques por passo. MENOR e mais rapido (20 tiques = 1 segundo)
#    Ordem       posicao no menu; menor vem antes
#    Aura        a poeira colorida (ver o cabecalho do config.yml)
#
#  AS ANIMACOES
#    FIXO       uma cor so, parada.
#    CICLO      pula de uma cor para a outra, sem passar pelo meio.
#    GRADIENTE  desliza de uma cor para a outra em degrade. E o que o jogador
#               reconhece como "brilho RGB".
#    PULSAR     acende e apaga sem trocar de tom.
#    ARCO_IRIS  percorre o circulo de cores inteiro; ignora a lista de Cores.
#    ALEATORIO  sorteia uma cor da lista a cada passo -- o mesmo sorteio para
#               todo mundo, entao ninguem ve uma cor diferente do vizinho.
#
#  SOBRE A COR EXATA
#    O contorno luminoso so aceita as 16 cores do Minecraft, entao um #FF7F00
#    aparece na silhueta como a mais parecida delas. Quem mostra o tom exato e
#    a Aura. Nos brilhos RGB abaixo ela ja vem ligada por isso.
#
#  A AURA
#    Ativar     liga a poeira colorida
#    Formato    CONTORNO, ANEL, ESPIRAL, NUVEM ou COROA
#    Pontos     quantos pontos por quadro (1 a 48)
#    Raio       distancia dos pontos ao corpo, em blocos
#    Altura     ate que altura eles sobem
#    Intervalo  tiques entre um quadro e o outro; maior gasta menos rede
#    Tamanho    tamanho do ponto (so da 1.13 em diante)
# ---------------------------------------------------------------------------
