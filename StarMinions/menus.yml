    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '

  Tipo:
    Nome: '{tipo}'
    Lore:
      - ''
      - ' &7Trabalho: &f{trabalho}'
      - ' &7Niveis: &f{niveis}'
      - ' &7Alcance inicial: &f{alcance}'
      - ' &7Velocidade inicial: &f{velocidade}'
      - ' &7Estoque inicial: &f{estoque} &7slots'
      - ''
      - ' &8Id: {tipo_id}'

  Vazio:
    Slot: 22
    Material: BARRIER
    Nome: '&cNenhum tipo carregado'
