# ------------------------------------------------------------------------- #
#                    StarMinions - aprimoramentos                             #
#                                                                             #
#  Aprimoramento e diferente de nivel: o nivel e um caminho unico e caro, o    #
#  aprimoramento e ESCOLHA. Dois minions de mesmo nivel podem estar afinados   #
#  para coisas diferentes -- e e isso que da o que decidir depois que o nivel  #
#  bate no teto.                                                               #
#                                                                             #
#  As chaves abaixo sao as que o plugin conhece. Voce pode mudar nome, preco,  #
#  icone, maximo e em quais tipos elas aparecem. Se APAGAR uma secao, o        #
#  aprimoramento sai do jogo e o efeito dele some junto.                       #
#                                                                             #
#   Alcance     - soma +1 bloco de alcance por nivel                           #
#   Velocidade  - tira 5% do tempo de espera por nivel                         #
#   Estoque     - soma +1 slot de estoque interno por nivel                    #
#   Fortuna     - soma +0,25 no multiplicador de producao por nivel            #
#   Eficiencia  - tira 15% do gasto de combustivel por nivel                   #
#   Autovenda   - libera a venda automatica do minion                          #
#                                                                             #
#  Preco de cada compra = Preco + (Preco por nivel x quantos ja comprou).      #
#  Tipos: vazio vale para todos; aceita o id do arquivo (minerador) ou o       #
#  trabalho (MINERADOR), e aceita curinga (min*).                              #
#  Slot: -1 deixa o menu escolher a vaga.                                      #
# ------------------------------------------------------------------------- #

Versao do modelo: 1

