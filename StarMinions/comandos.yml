# ------------------------------------------------------------------------- #
#                       StarMinions - comandos                                #
#                                                                             #
#  Aqui voce troca os nomes dos comandos e dos subcomandos.                    #
#  Separe os sinonimos com |. O PRIMEIRO nome e o que aparece nas mensagens.   #
#  Linha em branco ('') DESLIGA o subcomando -- quem quiser o recurso so pelo  #
#  menu e so apagar o nome.                                                    #
#                                                                             #
#  Os nomes que ja estao no plugin.yml continuam funcionando de qualquer       #
#  jeito; o que voce escrever aqui e registrado por cima.                      #
# ------------------------------------------------------------------------- #

Versao do modelo: 1

comandos:
  minions: 'minions|minion|ajudantes|mn'
  starminions: 'starminions|sminions|admminions|adminion'

subcomandos:
  tipos: 'tipos|lista|catalogo'
  coletar: 'coletar|recolher|pegar'
  top: 'top|ranking|rank'
  amigo: 'amigo|amigos|permitir'
  ajuda: 'ajuda|help|?'

subcomandos admin:
  recarregar: 'recarregar|reload|rl'
  dar: 'dar|give'
  tipos: 'tipos|lista'
  ver: 'ver|olhar|inspecionar'
  limpar: 'limpar|apagar'
  info: 'info|status'
