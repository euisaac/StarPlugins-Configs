# Minion Cacador
#
# Ataca os mobs ao alcance.
#
# Os drops nao sao recolhidos do chao: o minion se anuncia como autor do golpe e
# o que o mob soltaria vai direto para o estoque. Assim nada se perde em lava,
# em agua corrente ou no limite de itens do servidor.
#
# Jogador nunca e alvo, em nenhuma configuracao.

Versao do modelo: 1

Nome: '&cMinion Cacador'
Trabalho: CACADOR
# Vazio libera para todos. Preencha para vender o tipo por permissao.
Permissao: ''

Item:
  # Cole em Textura o base64, a url ou o hash de uma cabeca para dar
  # cara propria ao seu minion. Vazio deixa a cabeca padrao.
  Material: PLAYER_HEAD
  Textura: ''
  Nome: '&cMinion Cacador &7[Nivel {nivel}]'
  Lore:
    - ''
    - ' &7Ataca os mobs em volta e guarda o drop.'
    - ''
    - ' &7Ferramenta: &fespada'
    - ' &7Nivel: &f{nivel}&7/&f{nivel_maximo}'
    - ''
    - ' &e&l(!) &fClique num bloco para colocar.'

Entidade:
  Nome: '&7[&e{nivel}&7] &cMinion Cacador &7({dono})'
  # O que o boneco usa na cabeca. Troque por um bloco (CARVED_PUMPKIN,
  # IRON_BLOCK...) se nao quiser mexer com textura.
  Cabeca: PLAYER_HEAD
  Textura: ''
  Cor da armadura: '200, 0, 0'
  Pequeno: true

Ferramenta:
  Obrigatoria: true
  Aceitas:
    - '*_SWORD'

Area:
  # FACE (so a frente), LINHA (os quatro lados), AREA (quadrado) ou
  # ESFERA (bola). Do mais barato para o mais caro, nessa ordem.
  Modo: ESFERA
  # Lista vazia aceita qualquer coisa. Aceita curinga (*_ORE).
  Alvos:
    - 'ZOMBIE'
    - 'SKELETON'
    - 'SPIDER'
    - 'CAVE_SPIDER'
    - 'CREEPER'
    - 'ENDERMAN'
    - 'WITCH'
    - 'SLIME'
    - 'MAGMA_CUBE'
    - 'BLAZE'
    - 'PIG_ZOMBIE'
    - 'ZOMBIFIED_PIGLIN'
    - 'HUSK'
    - 'STRAY'
    - 'DROWNED'
    - 'PHANTOM'
    - 'PILLAGER'
    - 'VINDICATOR'

Opcoes:
  # Dano por golpe. 20 mata quase tudo de uma vez.
  Dano: 20.0
  Mobs por vez: 2

# Um nivel so precisa escrever o que MUDA: o que faltar vem do nivel
# anterior. Requisitos valem para subir PARA aquele nivel.
