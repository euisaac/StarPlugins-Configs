# Minion Fundidor
#
# A mesma ideia do fabricante, mas com a lista de fundicoes: o que entra na
# fornalha de um lado e sai do outro.
#
# Nao gasta carvao: o custo aqui e o tempo do minion e o combustivel dele,
# quando o combustivel estiver ligado no config.yml.
#
# Formato: MATERIAL;QUANTIDADE > MATERIAL;QUANTIDADE

Versao do modelo: 1

Nome: '&cMinion Fundidor'
Trabalho: FUNDIDOR
# Vazio libera para todos. Preencha para vender o tipo por permissao.
Permissao: ''

Item:
  # Cole em Textura o base64, a url ou o hash de uma cabeca para dar
  # cara propria ao seu minion. Vazio deixa a cabeca padrao.
  Material: PLAYER_HEAD
  Textura: ''
  Nome: '&cMinion Fundidor &7[Nivel {nivel}]'
  Lore:
    - ''
    - ' &7Funde o que esta no bau ligado.'
    - ''
    - ' &7Ferramenta: &fnenhuma'
    - ' &7Nivel: &f{nivel}&7/&f{nivel_maximo}'
    - ''
    - ' &e&l(!) &fClique num bloco para colocar.'

Entidade:
  Nome: '&7[&e{nivel}&7] &cMinion Fundidor &7({dono})'
  # O que o boneco usa na cabeca. Troque por um bloco (CARVED_PUMPKIN,
  # IRON_BLOCK...) se nao quiser mexer com textura.
  Cabeca: PLAYER_HEAD
  Textura: ''
  Cor da armadura: '255, 120, 0'
  Pequeno: true

Ferramenta:
  Obrigatoria: false
  Aceitas: []

Area:
  # FACE (so a frente), LINHA (os quatro lados), AREA (quadrado) ou
  # ESFERA (bola). Do mais barato para o mais caro, nessa ordem.
  Modo: FACE
  # Lista vazia aceita qualquer coisa. Aceita curinga (*_ORE).
  Alvos: []

Opcoes:
  Receitas por vez: 4
  Fundicoes:
    - 'RAW_IRON;1 > IRON_INGOT;1'
    - 'IRON_ORE;1 > IRON_INGOT;1'
    - 'RAW_GOLD;1 > GOLD_INGOT;1'
    - 'GOLD_ORE;1 > GOLD_INGOT;1'
    - 'RAW_COPPER;1 > COPPER_INGOT;1'
    - 'COBBLESTONE;1 > STONE;1'
    - 'SAND;1 > GLASS;1'
    - 'OAK_LOG;1 > CHARCOAL;1'
    - 'BEEF;1 > COOKED_BEEF;1'
    - 'PORKCHOP;1 > COOKED_PORKCHOP;1'
    - 'CHICKEN;1 > COOKED_CHICKEN;1'
    - 'COD;1 > COOKED_COD;1'
    - 'SALMON;1 > COOKED_SALMON;1'

# Um nivel so precisa escrever o que MUDA: o que faltar vem do nivel
# anterior. Requisitos valem para subir PARA aquele nivel.
Niveis:
  1:
    Alcance: 2
    Velocidade: 300
    Estoque: 9
    Multiplicador: 1
