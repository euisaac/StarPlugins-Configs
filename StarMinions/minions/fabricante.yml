# Minion Fabricante
#
# Troca um conjunto de itens por outro, seguindo as receitas abaixo.
#
# As receitas NAO usam o livro de receitas do servidor de proposito: assim voce
# pode dizer que neste minion oito pedras viram um bloco, sem mexer no que o
# jogador consegue fazer na bancada.
#
# Formato: MATERIAL;QUANTIDADE[,MATERIAL;QUANTIDADE] > MATERIAL;QUANTIDADE
# Os ingredientes saem primeiro do bau ligado e depois do estoque interno.

Versao do modelo: 1

Nome: '&fMinion Fabricante'
Trabalho: FABRICANTE
# Vazio libera para todos. Preencha para vender o tipo por permissao.
Permissao: ''

Item:
  # A textura da cabeca. Aceita o hash (como esta aqui), a url completa ou
  # o base64. Vazio deixa a cabeca padrao.
  # Esta veio de https://namemc.com/skin/deee035a22e2bb36
  Material: PLAYER_HEAD
  Textura: '2f556e3032114b811ebf00ee0983637d4e2bc2b8e8f26ab48364f9b636c890e6'
  Nome: '&fMinion Fabricante &7[Nivel {nivel}]'
  Lore:
    - ''
    - ' &7Transforma o que esta no bau em outra coisa.'
    - ''
    - ' &7Ferramenta: &fnenhuma'
    - ' &7Nivel: &f{nivel}&7/&f{nivel_maximo}'
    - ''
    - ' &e&l(!) &fClique num bloco para colocar.'

Entidade:
  Nome: '&7[&e{nivel}&7] &fMinion Fabricante &7({dono})'
  # O que o boneco usa na cabeca. Troque por um bloco (CARVED_PUMPKIN,
  # IRON_BLOCK...) se nao quiser mexer com textura.
  Cabeca: PLAYER_HEAD
  Textura: '2f556e3032114b811ebf00ee0983637d4e2bc2b8e8f26ab48364f9b636c890e6'
  Cor da armadura: '220, 220, 220'
  Pequeno: true

Ferramenta:
  Obrigatoria: false
  Aceitas: []

Area:
  # FACE (so a frente), LINHA (os quatro lados), AREA (quadrado) ou
  # ESFERA (bola). Do mais barato para o mais caro, nessa ordem.
  Modo: FACE
  # Lista vazia aceita qualquer coisa. Aceita curinga (*_ORE).
  Alvos: []

Opcoes:
  Receitas por vez: 4
  Receitas:
    - 'IRON_INGOT;9 > IRON_BLOCK;1'
    - 'GOLD_INGOT;9 > GOLD_BLOCK;1'
    - 'DIAMOND;9 > DIAMOND_BLOCK;1'
    - 'COAL;9 > COAL_BLOCK;1'
    - 'REDSTONE;9 > REDSTONE_BLOCK;1'
    - 'OAK_LOG;1 > OAK_PLANKS;4'
    - 'COBBLESTONE;8,COAL;1 > FURNACE;1'
    - 'SUGAR_CANE;3 > PAPER;3'

# Um nivel so precisa escrever o que MUDA: o que faltar vem do nivel
# anterior. Requisitos valem para subir PARA aquele nivel.
