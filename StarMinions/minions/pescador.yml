# Minion Pescador
#
# Pesca em qualquer poca de agua ao alcance.
#
# A tabela de pescados fica AQUI, e nao na tabela de saque do servidor: as
# tabelas nativas mudaram de formato varias vezes entre a 1.8 e a 1.21, e o que
# o dono do servidor quer mesmo e decidir o que sai e com que chance.
#
# Formato: MATERIAL;QUANTIDADE;CHANCE. A chance de cada linha e INDEPENDENTE:
# duas linhas de 100 entregam as duas, duas de 50 podem nao entregar nenhuma.

Versao do modelo: 1

Nome: '&9Minion Pescador'
Trabalho: PESCADOR
# Vazio libera para todos. Preencha para vender o tipo por permissao.
Permissao: ''

Item:
  # Cole em Textura o base64, a url ou o hash de uma cabeca para dar
  # cara propria ao seu minion. Vazio deixa a cabeca padrao.
  Material: PLAYER_HEAD
  Textura: ''
  Nome: '&9Minion Pescador &7[Nivel {nivel}]'
  Lore:
    - ''
    - ' &7Pesca sozinho na agua ao lado.'
    - ''
    - ' &7Ferramenta: &fvara de pescar'
    - ' &7Nivel: &f{nivel}&7/&f{nivel_maximo}'
    - ''
    - ' &e&l(!) &fClique num bloco para colocar.'

Entidade:
  Nome: '&7[&e{nivel}&7] &9Minion Pescador &7({dono})'
  # O que o boneco usa na cabeca. Troque por um bloco (CARVED_PUMPKIN,
  # IRON_BLOCK...) se nao quiser mexer com textura.
  Cabeca: PLAYER_HEAD
  Textura: ''
  Cor da armadura: '0, 110, 255'
  Pequeno: true

Ferramenta:
  Obrigatoria: true
  Aceitas:
    - 'FISHING_ROD'

Area:
  # FACE (so a frente), LINHA (os quatro lados), AREA (quadrado) ou
  # ESFERA (bola). Do mais barato para o mais caro, nessa ordem.
  Modo: ESFERA
  # Lista vazia aceita qualquer coisa. Aceita curinga (*_ORE).
  Alvos: []

Opcoes:
  Alturas: 0
  Pescados:
    - 'COD;1;60.0'
    - 'SALMON;1;22.0'
    - 'TROPICAL_FISH;1;4.0'
    - 'PUFFERFISH;1;4.0'
    - 'STICK;1;3.0'
    - 'STRING;1;3.0'
    - 'BONE;1;2.0'
    - 'INK_SAC;1;1.0'

# Um nivel so precisa escrever o que MUDA: o que faltar vem do nivel
# anterior. Requisitos valem para subir PARA aquele nivel.
