# Minion Minerador
#
# Quebra os blocos da lista de alvos que estiverem ao alcance.
#
# Com "Somente gerador: true" ele so mexe em bloco de gerador de pedra (agua e
# lava encostadas) -- e o que separa a fazenda de cobblestone do minion que
# comeria a montanha inteira do servidor.

Versao do modelo: 1

Nome: '&bMinion Minerador'
Trabalho: MINERADOR
# Vazio libera para todos. Preencha para vender o tipo por permissao.
Permissao: ''

Item:
  # A textura da cabeca. Aceita o hash (como esta aqui), a url completa ou
  # o base64. Vazio deixa a cabeca padrao.
  # Esta veio de https://namemc.com/skin/229cced16750abab
  Material: PLAYER_HEAD
  Textura: 'afd4fcfebf0be3ea4d9fa9298548d191ed3e38317bd074126fa244841145c597'
  Nome: '&bMinion Minerador &7[Nivel {nivel}]'
  Lore:
    - ''
    - ' &7Quebra minerio e pedra em volta.'
    - ''
    - ' &7Ferramenta: &fpicareta'
    - ' &7Nivel: &f{nivel}&7/&f{nivel_maximo}'
    - ''
    - ' &e&l(!) &fClique num bloco para colocar.'

Entidade:
  Nome: '&7[&e{nivel}&7] &bMinion Minerador &7({dono})'
  # O que o boneco usa na cabeca. Troque por um bloco (CARVED_PUMPKIN,
  # IRON_BLOCK...) se nao quiser mexer com textura.
  Cabeca: PLAYER_HEAD
  Textura: 'afd4fcfebf0be3ea4d9fa9298548d191ed3e38317bd074126fa244841145c597'
  Cor da armadura: '0, 170, 255'
  Pequeno: true

Ferramenta:
  Obrigatoria: true
  Aceitas:
    - '*_PICKAXE'

Area:
  # FACE (so a frente), LINHA (os quatro lados), AREA (quadrado) ou
  # ESFERA (bola). Do mais barato para o mais caro, nessa ordem.
  Modo: LINHA
  # Lista vazia aceita qualquer coisa. Aceita curinga (*_ORE).
  Alvos:
    - 'STONE'
    - 'COBBLESTONE'
    - 'DEEPSLATE'
    - 'COBBLED_DEEPSLATE'
    - 'ANDESITE'
    - 'DIORITE'
    - 'GRANITE'
    - 'NETHERRACK'
    - '*_ORE'
    - 'ANCIENT_DEBRIS'
    - 'OBSIDIAN'

Opcoes:
  # Com true, so quebra bloco de gerador de pedra (agua + lava ao lado).
  Somente gerador: false
  # Quantos blocos ele quebra por vez.
  Blocos por vez: 1
  # Quantos blocos acima da propria altura tambem entram no alcance.
  Alturas: 0

# Um nivel so precisa escrever o que MUDA: o que faltar vem do nivel
# anterior. Requisitos valem para subir PARA aquele nivel.
