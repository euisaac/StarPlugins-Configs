# Minion Coletor
#
# Junta os itens caidos em volta.
#
# Serve tanto para limpar o chao de uma fazenda de mob quanto para recolher o
# que outro minion nao conseguiu guardar. Deixe a lista de alvos vazia para ele
# pegar tudo, ou escreva materiais para ele pegar so aquilo.

Versao do modelo: 1

Nome: '&eMinion Coletor'
Trabalho: COLETOR
# Vazio libera para todos. Preencha para vender o tipo por permissao.
Permissao: ''

Item:
  # A textura da cabeca. Aceita o hash (como esta aqui), a url completa ou
  # o base64. Vazio deixa a cabeca padrao.
  # Esta veio de https://namemc.com/skin/37236d8098e6b5ca
  Material: PLAYER_HEAD
  Textura: '12baa9fbec32681cf6197fe8e4fad9dad867d53aeb63345ea0e7d8353f1137c5'
  Nome: '&eMinion Coletor &7[Nivel {nivel}]'
  Lore:
    - ''
    - ' &7Junta os itens caidos em volta.'
    - ''
    - ' &7Ferramenta: &fpa'
    - ' &7Nivel: &f{nivel}&7/&f{nivel_maximo}'
    - ''
    - ' &e&l(!) &fClique num bloco para colocar.'

Entidade:
  Nome: '&7[&e{nivel}&7] &eMinion Coletor &7({dono})'
  # O que o boneco usa na cabeca. Troque por um bloco (CARVED_PUMPKIN,
  # IRON_BLOCK...) se nao quiser mexer com textura.
  Cabeca: PLAYER_HEAD
  Textura: '12baa9fbec32681cf6197fe8e4fad9dad867d53aeb63345ea0e7d8353f1137c5'
  Cor da armadura: '255, 220, 0'
  Pequeno: true

Ferramenta:
  Obrigatoria: true
  Aceitas:
    - '*_SHOVEL'
    - '*_SPADE'

Area:
  # FACE (so a frente), LINHA (os quatro lados), AREA (quadrado) ou
  # ESFERA (bola). Do mais barato para o mais caro, nessa ordem.
  Modo: ESFERA
  # Lista vazia aceita qualquer coisa. Aceita curinga (*_ORE).
  Alvos: []

Opcoes:
  Itens por vez: 16

# Um nivel so precisa escrever o que MUDA: o que faltar vem do nivel
# anterior. Requisitos valem para subir PARA aquele nivel.
