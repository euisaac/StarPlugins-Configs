# Minion Criador
#
# Cria animais gastando a racao que estiver no bau ligado.
#
# O filhote nasce direto, em vez de o casal entrar no modo de amor: o modo de
# amor so existe na API a partir da 1.12 e depende do tique do proprio mob, o
# que faria o minion nao funcionar em metade das versoes suportadas.
#
# Quando a populacao bate no teto ele passa a ABATER os adultos (se "Abater no
# limite" estiver ligado), e os drops caem no estoque. E o que fecha o ciclo sem
# precisar de um cacador ao lado.

Versao do modelo: 1

Nome: '&2Minion Criador'
Trabalho: CRIADOR
# Vazio libera para todos. Preencha para vender o tipo por permissao.
Permissao: ''

Item:
  # A textura da cabeca. Aceita o hash (como esta aqui), a url completa ou
  # o base64. Vazio deixa a cabeca padrao.
  # Esta veio de https://namemc.com/skin/f7e115ab38f6fe6d
  Material: PLAYER_HEAD
  Textura: '34977f497ba1b7902385febbe76f7293adb50a707ce7ec7c9c23e3a03e7d42e2'
  Nome: '&2Minion Criador &7[Nivel {nivel}]'
  Lore:
    - ''
    - ' &7Cria animais e colhe quando lota.'
    - ''
    - ' &7Ferramenta: &fnenhuma'
    - ' &7Nivel: &f{nivel}&7/&f{nivel_maximo}'
    - ''
    - ' &e&l(!) &fClique num bloco para colocar.'

Entidade:
  Nome: '&7[&e{nivel}&7] &2Minion Criador &7({dono})'
  # O que o boneco usa na cabeca. Troque por um bloco (CARVED_PUMPKIN,
  # IRON_BLOCK...) se nao quiser mexer com textura.
  Cabeca: PLAYER_HEAD
  Textura: '34977f497ba1b7902385febbe76f7293adb50a707ce7ec7c9c23e3a03e7d42e2'
  Cor da armadura: '120, 200, 90'
  Pequeno: true

Ferramenta:
  Obrigatoria: false
  Aceitas: []

Area:
  # FACE (so a frente), LINHA (os quatro lados), AREA (quadrado) ou
  # ESFERA (bola). Do mais barato para o mais caro, nessa ordem.
  Modo: ESFERA
  # Lista vazia aceita qualquer coisa. Aceita curinga (*_ORE).
  Alvos:
    - 'COW'
    - 'SHEEP'
    - 'PIG'
    - 'CHICKEN'
    - 'RABBIT'
    - 'MOOSHROOM'

Opcoes:
  # Teto de animais no alcance. Obrigatorio: sem ele o minion enche o
  # chunk de bicho ate o servidor engasgar.
  Maximo de animais: 20
  Abater no limite: true
  Abates por vez: 1
  Dano: 20.0
  Racao:
    - 'WHEAT'
    - 'WHEAT_SEEDS'
    - 'SEEDS'
    - 'CARROT'
    - 'POTATO'
    - 'BEETROOT'

# Um nivel so precisa escrever o que MUDA: o que faltar vem do nivel
# anterior. Requisitos valem para subir PARA aquele nivel.
