# Minion Vendedor
#
# Vende o que estiver no bau ligado (ou no proprio estoque, quando nao ha bau).
#
# E o minion que fecha o ciclo de uma fazenda: os outros produzem para dentro de
# um bau, este esvazia o bau em dinheiro. O valor vai para o cofre dele, que o
# dono recolhe pelo menu.
#
# Os precos ficam no precos.yml. Item sem preco fica onde esta -- o vendedor
# nunca apaga o que nao sabe vender.
#
# O Multiplicador dos niveis aqui vale como bonus no valor da venda.

Versao do modelo: 1

Nome: '&dMinion Vendedor'
Trabalho: VENDEDOR
# Vazio libera para todos. Preencha para vender o tipo por permissao.
Permissao: ''

Item:
  # A textura da cabeca. Aceita o hash (como esta aqui), a url completa ou
  # o base64. Vazio deixa a cabeca padrao.
  # Esta veio de https://namemc.com/skin/57e3024dfd85c681
  Material: PLAYER_HEAD
  Textura: '2de30bf8e3e9f3856c6588cbf9080d065763bd8c2b4a1ba7c3bd49ddfba2e54a'
  Nome: '&dMinion Vendedor &7[Nivel {nivel}]'
  Lore:
    - ''
    - ' &7Vende o conteudo do bau ligado.'
    - ''
    - ' &7Ferramenta: &farco'
    - ' &7Nivel: &f{nivel}&7/&f{nivel_maximo}'
    - ''
    - ' &e&l(!) &fClique num bloco para colocar.'

Entidade:
  Nome: '&7[&e{nivel}&7] &dMinion Vendedor &7({dono})'
  # O que o boneco usa na cabeca. Troque por um bloco (CARVED_PUMPKIN,
  # IRON_BLOCK...) se nao quiser mexer com textura.
  Cabeca: PLAYER_HEAD
  Textura: '2de30bf8e3e9f3856c6588cbf9080d065763bd8c2b4a1ba7c3bd49ddfba2e54a'
  Cor da armadura: '200, 0, 255'
  Pequeno: true

Ferramenta:
  Obrigatoria: true
  Aceitas:
    - 'BOW'
    - 'CROSSBOW'

Area:
  # FACE (so a frente), LINHA (os quatro lados), AREA (quadrado) ou
  # ESFERA (bola). Do mais barato para o mais caro, nessa ordem.
  Modo: FACE
  # Lista vazia aceita qualquer coisa. Aceita curinga (*_ORE).
  Alvos: []

Opcoes:
  # Quantas pilhas ele vende por vez.
  Pilhas por vez: 8

# Um nivel so precisa escrever o que MUDA: o que faltar vem do nivel
# anterior. Requisitos valem para subir PARA aquele nivel.
Niveis:
  1:
    Alcance: 2
    Velocidade: 600
    Estoque: 9
    Multiplicador: 1
  2:
    Velocidade: 550
