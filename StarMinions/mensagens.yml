# ------------------------------------------------------------------------- #
#                        StarMinions - mensagens                              #
#                                                                             #
#  Mensagem em branco ('') NAO e enviada. E assim que voce desliga um aviso    #
#  sem precisar de uma opcao no config.                                       #
#                                                                             #
#  Cores: &a classico, &#RRGGBB hex (1.16+) e <g:FF0000:00FF00> gradiente.     #
# ------------------------------------------------------------------------- #

# Nao mexa: e por este numero que o plugin sabe que o modelo mudou e guarda o
# seu arquivo antigo ao lado antes de trazer o novo.
Versao do modelo: 1

Prefixo: '&6&lMINIONS &8» &f'

Erros:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  Sem permissao no tipo: '&cVoce nao pode usar o {tipo}&c.'
  Sem permissao no nivel: '&cVoce nao pode subir para o nivel &f{nivel}&c.'
  Somente jogador: '&cEste comando e so para jogadores.'
  Subcomando desconhecido: '&cNao existe o subcomando &f{argumento}&c.'

  Tipo desconhecido: '&cNao existe o tipo de minion &f{tipo}&c.'
  Mundo bloqueado: '&cNao da para colocar minion neste mundo.'
  Sem espaco: '&cPrecisa de um bloco livre em cima para o minion ficar.'
  Ja tem minion: '&cJa existe um minion nesse lugar.'
  Perto demais: '&cTem outro minion perto demais. Deixe pelo menos &f{distancia}&c blocos.'
  Limite atingido: '&cVoce ja tem o maximo de &f{limite}&c minions.'
  Area protegida: '&cVoce nao pode construir aqui.'
  Nao e seu: '&cEste minion nao e seu.'
  Agache para recolher: '&7Agache e bata no minion para recolher ele.'
  Minion sumiu: '&cO minion nao esta mais la.'

  Nivel maximo: '&cEste minion ja esta no nivel maximo.'
  Faltam acoes: '&cFaltam &f{faltam}&c acoes (o nivel pede &f{necessarias}&c).'
  Sem dinheiro: '&cVoce precisa de &f{preco}&c para isso.'
  Aprimoramento no maximo: '&cO {aprimoramento} &cja esta no maximo.'
  Precisa do aprimoramento: '&cCompre o {aprimoramento} &cantes de ligar isso.'

  Nao e container: '&cIsso nao e um bau, barril ou funil.'
  Container longe: '&cO bau precisa estar a no maximo &f{distancia}&c blocos do minion.'
  Estoque vazio: '&cO estoque deste minion esta vazio.'
  Cofre vazio: '&cNao ha nada no cofre deste minion.'
  Nada para coletar: '&cNenhum minion seu tem algo para recolher agora.'

  Combustivel cheio: '&cEste minion ja esta com o tanque cheio.'
  Nao e combustivel: '&cEste item nao serve de combustivel.'

  Sem ferramenta na mao: '&cSegure a ferramenta que voce quer colocar no minion.'
  Ferramenta invalida: '&cO {tipo} &cnao trabalha com essa ferramenta.'
  Autovenda desligada: '&cA venda automatica esta desligada neste servidor.'

  Nenhum minion perto: '&cChegue mais perto de um minion seu.'
  Uso do amigo: '&cUse: &f/minions {comando} <adicionar|remover|lista> [jogador]'
  Precisa estar online: '&cO jogador &f{jogador}&c precisa estar online.'
  Nao e amigo: '&f{jogador}&c nao esta na lista deste minion.'
  Uso do dar: '&cUse: &f/starminions {comando} <jogador> <tipo> [nivel] [quantidade]'
  Uso do ver: '&cUse: &f/starminions {comando} <jogador>'
  Uso do limpar: '&cUse: &f/starminions {comando} <jogador> confirmar'

Minion:
  Colocado: '&aMinion colocado! &7({atuais}/{limite}) &f{tipo}'
  Recolhido: '&aVoce recolheu o {tipo}&a. &7Cofre: &f{valor}'
  Recebido: '&aVoce recebeu um {tipo} &7(nivel {nivel})&a.'
  Melhorado: '&aO {tipo} &asubiu para o nivel &f{nivel}&a!'
  Aprimorado: '&aO {aprimoramento} &afoi para o nivel &f{nivel}&a!'
  Girado: '&aO minion agora olha para o &f{direcao}&a.'
  Clique no bau: '&eAgora clique no bau que o minion deve usar.'
  Ligado: '&aMinion ligado ao bau em &f{x}, {y}, {z}&a.'
  Desligado: '&7O minion nao esta mais ligado a nenhum bau.'
  Ferramenta trocada: '&aFerramenta trocada.'
  Estoque coletado: '&aVoce recolheu &f{quantidade}&a pilha(s) do minion.'
  Cofre coletado: '&aVoce recolheu &f{valor}&a do cofre do minion.'
  Coletado tudo: '&aRecolhido de &f{minions}&a minion(s): &f{pilhas}&a pilha(s) e &f{valor}&a.'
  Abastecido: '&aAbastecido! &7Carga: &f{tempo} &7- pago: &f{valor}'
  Teleportado: '&aVoce foi ate o {tipo}&a em &f{x}, {y}, {z}&a.'
  Amigo adicionado: '&a{jogador} &aagora pode abrir este minion.'
  Amigo removido: '&7{jogador} nao pode mais abrir este minion.'
  Amigos: '&7Podem abrir este minion: &f{jogadores}'
  Sem amigos: '&7Ninguem alem de voce pode abrir este minion.'

# O que aparece no balao sobre o minion parado.
Avisos:
  Sem ferramenta: '&c&l! &fSem ferramenta'
  Ferramenta gasta: '&c&l! &fFerramenta gasta'
  Estoque cheio: '&c&l! &fEstoque cheio'
  Sem combustivel: '&c&l! &fSem combustivel'
  Sem alvo: '&e&l! &fNada para fazer'
  Dono offline: '&7&l! &fDono offline'
  Sem preco: '&c&l! &fNada aqui tem preco'

Etiquetas:
  Nenhum: '&7nenhum'
  Vazio: '&cvazio'
  Nao ligado: '&cnao ligado'
  Ligado: '&aligado'
  Desligado: '&cdesligado'
  Trabalhando: '&atrabalhando'
  Maximo: '&6maximo'
  Infinita: '&binfinita'

Direcoes:
  NORTE: 'Norte'
  SUL: 'Sul'
  LESTE: 'Leste'
  OESTE: 'Oeste'

Top:
  Cabecalho: |-
    &8&m-----------------------------------
    &6&lTOP MINIONS &7(por acoes)
  Linha: ' &e{posicao}. &f{dono} &7- {tipo} &7[{nivel}] &8- &a{acoes}'
  Vazio: ' &7Nenhum minion colocado ainda.'
  Rodape: '&8&m-----------------------------------'

Admin:
  Recarregado: '&aStarMinions recarregado.'
  Item entregue: '&aVoce entregou um {tipo} &apara &f{jogador}&a.'
  Limpo: '&aForam recolhidos &f{quantidade}&a minion(s) de &f{jogador}&a.'
  Linha do tipo: ' &e{tipo_id} &8- &f{tipo} &7({trabalho}, {niveis} niveis)'
  Info: |-
    &8&m-----------------------------------
    &6&lSTARMINIONS &7v{versao}
    &7Minions colocados: &f{minions}
    &7Tipos carregados: &f{tipos}
    &7Banco de dados: &f{banco}
    &7Economia: &f{economia}
    &8&m-----------------------------------

Ajuda:
  Jogador: |-
    &8&m-----------------------------------
    &6&lSTARMINIONS
    &e/minions &7- a lista dos seus minions
    &e/minions tipos &7- o que cada tipo faz
    &e/minions coletar &7- recolhe tudo de uma vez
    &e/minions top &7- os minions que mais trabalharam
    &e/minions amigo &7- libera alguem no minion mais proximo
    &7Clique com o botao direito no minion para abrir o menu.
    &7Agache e bata nele para recolher.
    &8&m-----------------------------------
  Admin: |-
    &8&m-----------------------------------
    &6&lSTARMINIONS &7(admin)
    &e/starminions recarregar
    &e/starminions dar <jogador> <tipo> [nivel] [qtd]
    &e/starminions tipos
    &e/starminions ver <jogador>
    &e/starminions limpar <jogador> confirmar
    &e/starminions info
    &8&m-----------------------------------
