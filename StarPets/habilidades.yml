#
#  Poderes de combate dos pets.
#
#  COMO O JOGADOR GANHA UMA
#    - Tomo: um item que a equipe entrega (/petsadmin tomo <jogador> <id>) ou
#      que sai de caixa, loja, evento. Clicando com ele no proprio pet,
#      AQUELE pet aprende para sempre -- e o poder vai junto com o bicho.
#    - Permissao: quem tem starpets.habilidade.<id> usa a habilidade em
#      qualquer pet dele, sem precisar de tomo.
#
#  COMO SE USA
#    Montado no pet: BATER solta a habilidade escolhida, SHIFT + bater abre o
#    menu para trocar, so SHIFT desce. Fora da montaria, o menu do pet tem o
#    botao Habilidades. E nos modos em que o pet briga, ele mesmo solta o
#    poder de vez em quando (campo "Chance no combate").
#
#  CAMPOS
#  Nome            Como ela aparece no menu, no tomo e nas mensagens.
#  Raridade        COMUM, RARA, EPICA ou LENDARIA. Muda a cor do tomo.
#  Cor             Opcional: sobrescreve a cor da raridade.
#  Material do tomo  Item usado como tomo. Alternativas com |.
#  Icone           Item no menu de habilidades. Alternativas com |.
#  Descricao       Linhas de explicacao no menu e no tomo.
#  Permissao       Caminho alternativo ao tomo; sem ela e sem tomo, nao aparece.
#  Efeito          BOLA            bola que viaja e estoura onde bate
#                  LASER           linha reta que fere tudo no caminho
#                  RAIOS           um raio em cada alvo do raio, um a um
#                  METEOROS        pedras caindo do ceu em volta da mira
#                  EXPLOSAO_PERTO  estouro em volta do proprio pet
#                  ONDA            empurra para longe quem esta perto
#                  REDEMOINHO      puxa para perto quem esta no raio
#                  PRAGA           joga efeitos de pocao em quem esta no raio
#                  CURA            devolve vida ao dono e ao pet
#  Dano            Dano em cada alvo atingido (na CURA, vida devolvida).
#  Raio            Alcance do estouro, em blocos.
#  Alcance         Quanto a bola, o laser ou a mira alcancam.
#  Velocidade      Blocos por tique da bola (0.9 e rapido, 0.4 e lento).
#  Cooldown        Segundos de espera entre um uso e outro.
#  Chance no combate  Chance, em %, de o PROPRIO pet soltar brigando.
#  Atinge jogadores  false deixa a habilidade so para mobs.
#  Poe fogo        Deixa em chamas quem for atingido.
#  Pocoes          So na PRAGA: EFEITO:segundos:nivel, um por linha.
#  Particulas      Nomes tentados em ordem; o primeiro que existir e usado.
#  Som             NOME:volume:tom, com alternativas separadas por |.
#  Tipos de pet    Lista de tipos do pets.yml que podem usar. Vazio = todos.
#

