#
#  Tipos de pet e a experiencia que cada mob da.
#
#  Cada chave de "Pets:" e um tipo. O jogador precisa da permissao
#  starpets.tipo.<chave> para capturar aquele tipo (ou starpets.tipo.*).
#
#  Entidade      Nome do mob. Se ele nao existir na versao do servidor, o tipo
#                e ignorado sem erro -- por isso da para deixar mobs novos
#                listados aqui mesmo rodando numa 1.8.
#  Vida          Vida no nivel 1 (2 = um coracao).
#  Dano          Dano por golpe no nivel 1.
#  Velocidade    Velocidade de movimento (0.3 e o normal de um mob).
#  Bau           Slots do bau do pet (multiplo de 9, ate 54). 0 = sem bau.
#  Capturavel    false tira o mob do laco: o pet so entra por
#                /petsadmin dar. E assim que o dragao funciona.
#  Montaria      O dono pode subir no pet e dirigir olhando para onde quer ir.
#                Vem ligada em todos; ponha false no tipo para desligar nele.
#  Chance de captura   Chance, em %, do laco segurar o mob.
#

