# ---------------------------------------------------------------------------
#  StarLixeiro - telas
#
#  Slot: -1 esconde o botao. As posicoes vao de 0 ate o tamanho do menu -1
#  (uma linha tem 9 slots).
#
#  Marcadores que valem em qualquer texto daqui:
#    {lixeiro} {chave} {tipo} {tempo} {intervalo} {estado} {mundos} {itens}
#    {entidades} {total} {data} {hora} {atras} {autor} {quantidade} {material}
#    {mundo} {pagina} {paginas} {jogador} {valor} {linhas}
# ---------------------------------------------------------------------------

Versao do modelo: 1

#
# ═══════════════════════════  VISAO DOS LIXEIROS  ═══════════════════════════
#
Lixeiros:
  Titulo: '&8Lixeiros'
  Linhas: 5

  Slots: [ 10, 11, 12, 13, 14, 15, 16,
           19, 20, 21, 22, 23, 24, 25 ]

  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  # O material vem do 'Icone' do lixeiro, no lixeiros.yml.
  Item:
    Nome: '{lixeiro}'
    Lore:
      - '&7Tipo: &f{tipo}'
      - '&7Intervalo: &f{intervalo}'
      - '&7Mundos: &f{mundos}'
      - ''
      - '&7Proxima limpeza: &a{tempo}'
      - '&7Ultima limpeza: &f{itens} &7itens, &f{entidades} &7criaturas'

  Botoes:
    Historico:
      Slot: 40
      Material: 'PAPER'
      Nome: '&e&lHISTORICO'
      Lore:
        - '&7Veja o que ja foi limpo e'
        - '&7quais itens sairam do chao.'
        - ''
        - '&aClique para abrir.'
    Voltar:
      Slot: 36
      Material: 'BARRIER'
      Nome: '&cFechar'
      Lore: []
    Anterior:
      Slot: 37
      Material: 'ARROW'
      Nome: '&aPagina anterior'
      Lore: [ '&7Pagina {pagina} de {paginas}' ]
    Proxima:
      Slot: 43
      Material: 'ARROW'
      Nome: '&aProxima pagina'
      Lore: [ '&7Pagina {pagina} de {paginas}' ]

#
# ══════════════════════════════  HISTORICO  ═════════════════════════════════
#
Historico:
  Titulo: '&8Historico de limpezas'
  Linhas: 6

  Slots: [ 10, 11, 12, 13, 14, 15, 16,
           19, 20, 21, 22, 23, 24, 25,
           28, 29, 30, 31, 32, 33, 34,
           37, 38, 39, 40, 41, 42, 43 ]

  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  Item:
    Material: 'PAPER'
    Nome: '&e{lixeiro} &8- &7{atras}'
    Lore:
      - '&7Quando: &f{data} as {hora}'
      - '&7Itens: &f{itens}'
      - '&7Criaturas: &f{entidades}'
      - '&7Forcada por: &f{autor}'
      - ''
      - '&aClique para ver os itens.'

  Botoes:
    Filtro:
      Slot: 48
      Material: 'HOPPER'
      Nome: '&e&lFILTRO'
      Lore:
        - '&7Mostrando: &f{lixeiro}'
        - ''
        - '&aClique para trocar.'
    Voltar:
      Slot: 49
      Material: 'BARRIER'
      Nome: '&cVoltar'
      Lore: []
    Anterior:
      Slot: 45
      Material: 'ARROW'
      Nome: '&aPagina anterior'
      Lore: [ '&7Pagina {pagina} de {paginas}' ]
    Proxima:
      Slot: 53
      Material: 'ARROW'
      Nome: '&aProxima pagina'
      Lore: [ '&7Pagina {pagina} de {paginas}' ]

#
# ═══════════════════════════  ITENS DE UMA LIMPEZA  ═════════════════════════
#
Itens:
  Titulo: '&8Limpeza de {hora}'
  Linhas: 6

  Slots: [ 10, 11, 12, 13, 14, 15, 16,
           19, 20, 21, 22, 23, 24, 25,
           28, 29, 30, 31, 32, 33, 34,
           37, 38, 39, 40, 41, 42, 43 ]

  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  # Linhas coladas embaixo da lore que o item ja tinha.
  Item:
    Lore:
      - ''
      - '&7Quantidade: &f{quantidade}'
      - '&7Mundo: &f{mundo}'

  # O mesmo item quando a staff pode resgatar.
  Item resgate:
    Lore:
      - ''
      - '&7Quantidade: &f{quantidade}'
      - '&7Mundo: &f{mundo}'
      - ''
      - '&aClique &7para pegar uma pilha.'
      - '&aShift + clique &7para pegar tudo que couber.'

  # A criatura que foi removida.
  Entidade:
    Material: 'ZOMBIE_HEAD'
    Nome: '&f{material}'
    Lore:
      - '&7Quantidade: &f{quantidade}'
      - '&7Mundo: &f{mundo}'

  Botoes:
    Resumo:
      Slot: 4
      Material: 'PAPER'
      Nome: '&e{lixeiro}'
      Lore:
        - '&7Quando: &f{data} as {hora}'
        - '&7Itens: &f{itens}'
        - '&7Criaturas: &f{entidades}'
    Voltar:
      Slot: 49
      Material: 'BARRIER'
      Nome: '&cVoltar'
      Lore: []
    Anterior:
      Slot: 45
      Material: 'ARROW'
      Nome: '&aPagina anterior'
      Lore: [ '&7Pagina {pagina} de {paginas}' ]
    Proxima:
      Slot: 53
      Material: 'ARROW'
      Nome: '&aProxima pagina'
      Lore: [ '&7Pagina {pagina} de {paginas}' ]

