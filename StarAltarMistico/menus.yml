    Nome: '&ePagina anterior'
    Lore:
      - '&7Ir para a pagina {pagina}'
  Proxima:
    Material: ARROW
    Nome: '&eProxima pagina'
    Lore:
      - '&7Ir para a pagina {pagina}'

