Guardiao:
  Titulo: '&8Guardiao de {id}'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '
  Itens:
    Ativar:
      Material: LEVER
      Nome: '&aGuardiao ligado'
      Lore:
        - '&7Ligado: {estado}'
        - '&7Quando o tempo acaba, o altar invoca'
        - '&7o guardiao. Os itens so saem quando'
        - '&7alguem derrotar ele.'
        - ''
        - '&eClique para alternar'
    Entidade:
      Material: ''
      Nome: '&aEntidade'
      Lore:
        - '&7Atual: &f{entidade}'
        - ''
        - '&eClique para escolher'
    Nome:
      Material: NAME_TAG
      Nome: '&aNome'
      Lore:
        - '&7Atual: {nome}'
        - ''
        - '&eClique para mudar'
    Vida:
      Material: GOLDEN_APPLE
      Nome: '&aVida'
      Lore:
        - '&7Atual: &f{vida}'
        - ''
        - '&eEsquerdo/Direito &7+10 / -10'
        - '&eShift &7+100 / -100 &8| &eQ &7digitar'
    Tempo limite:
      Material: CLOCK
      Nome: '&aTempo para derrotar'
      Lore:
        - '&7Atual: &f{tempo}'
        - '&7Passou do tempo, o guardiao foge'
        - '&7e ninguem ganha nada.'
        - ''
        - '&eEsquerdo/Direito &7+30s / -30s'
        - '&eShift &7+5min / -5min &8| &eQ &7digitar'
    Prender:
      Material: LEAD
      Nome: '&aPreso ao raio do altar'
      Lore:
        - '&7Ligado: {estado}'
        - '&7Se ele sair do raio, volta para o altar.'
    Drop onde morreu:
      Material: HOPPER
      Nome: '&aItens onde ele morreu'
      Lore:
        - '&7Ligado: {estado}'
        - '&7Desligado: os itens saem do altar.'
    Drops normais:
      Material: ROTTEN_FLESH
      Nome: '&aDrops normais do mob'
      Lore:
        - '&7Ligado: {estado}'
        - '&7O que o mob deixaria cair (e o XP).'
    Copiar:
      Material: ARMOR_STAND
      Nome: '&aCopiar meu equipamento'
      Lore:
        - '&7Vista a armadura e segure a arma'
        - '&7que o guardiao deve usar e clique.'
        - '&7O equipamento atual aparece embaixo.'
        - ''
        - '&eClique &7copiar &8| &eShift + direito &7limpar'
    Holograma:
      Material: ARMOR_STAND
      Nome: '&aHolograma do guardiao'
      Lore:
        - '&7Linhas mostradas durante a batalha: &f{linhas}'
        - ''
        - '&eClique para editar'

Entidades:
  Titulo: '&8Escolha a entidade'
  Linhas: 6
  Enfeite:
    Ativar: false
  Entidade:
    Lore:
      - ''
      - '&eClique para escolher'

Colocados:
  Titulo: '&8Altares colocados'
  Linhas: 6
  Enfeite:
    Ativar: false
  Altar:
    Nome: '&f#{numero} {altar}'
    Lore:
      - '&7Local: &f{mundo} {x}, {y}, {z}'
      - '&7Estado: {estado}'
      - '&7Proxima liberacao: &e{tempo}'
      - '&7Jogadores perto: &f{jogadores}/{minimo}'
      - '&7Liberacoes desde o inicio: &f{liberacoes}'
      - ''
      - '&eEsquerdo &7teleportar'
      - '&eDireito &7forcar liberacao'
      - '&eShift + esquerdo &7forcar sem guardiao'
      - '&eShift + direito &7remover do mundo'
  Vazio:
    Material: PAPER
    Nome: '&7Nenhum altar colocado'
    Lore: []

# ---------------------------------------------------------------- jogadores

Jogador:
  Titulo: '&8Altares misticos'
  Linhas: 4
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '
  Slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]
  Altar:
    Nome: '{altar}'
    Lore:
      - '&7Local: &f{mundo} {x}, {y}, {z}'
      - '&7Situacao: {estado}'
      - '&7Libera em: &e{tempo}'
      - '&7Jogadores perto: &f{jogadores}/{minimo}'
      - ''
      - '&eClique para ver as recompensas'
    # Acrescentado quando o jogador pode teleportar.
    Lore teleporte:
      - '&eDireito para ir ate la'
  Vazio:
    Material: PAPER
    Nome: '&7Nenhum altar no servidor'
    Lore: []

Previa:
  Titulo: '&8{altar}'
  Linhas: 6
  Enfeite:
    Ativar: false
  Recompensa:
    Lore:
      - ''
      - '&7Chance: &a{chance}'
      - '&7Quantidade: &f{quantidade}'
  Vazio:
    Material: PAPER
    Nome: '&7Este altar ainda nao tem recompensas'
    Lore: []
  Itens:
    Info:
      Material: ''
      Nome: '{altar}'
      Lore:
        - '&7Situacao: {estado}'
        - '&7Libera em: &e{tempo}'
        - '&7Precisa de &f{minimo} &7jogador(es) perto.'
        - '&7Recompensas por vez: &f{drops}'
        - '&7Guardiao: {guardiao}'

Confirmar:
  Titulo: '{pergunta}'
  Linhas: 3
  Enfeite:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '
  Itens:
    Confirmar:
      Slot: 11
      Material: LIME_WOOL
      Nome: '&aConfirmar'
      Lore:
        - '&7{pergunta}'
    Cancelar:
      Slot: 15
      Material: RED_DYE
      Nome: '&cCancelar'
      Lore: []
