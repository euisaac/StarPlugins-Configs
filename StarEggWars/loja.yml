# ==========================================================================
#  StarEggWars - loja da partida (NPC de itens)
#
#  Categorias na primeira linha do menu, itens no miolo. Preco no formato
#  "MATERIAL : quantidade" (IRON_INGOT, GOLD_INGOT, DIAMOND ou EMERALD).
#  "Perde": true = o item some ao morrer; false = e permanente (armadura,
#  espada, picareta e machado permanentes voltam a cada vida; picareta,
#  machado e espada seguem a regra "Rebaixar ao morrer" do config.yml).
#  "Nivel": itens com o mesmo Grupo e niveis crescentes (picareta de
#  madeira -> pedra -> ferro) so mostram o proximo nivel para o jogador.
#  Formato de item igual ao dos kits ("cor=equipe" tinge com a equipe).
#  Itens especiais sao reconhecidos pelo material: FIRE_CHARGE (bola de
#  fogo), TNT, EGG (ovo de ponte), CHEST (torre), MAGMA_CREAM (estilingue),
#  IRON_GOLEM_SPAWN_EGG (golem), SILVERFISH_SPAWN_EGG (traca), SPONGE.
# ==========================================================================

