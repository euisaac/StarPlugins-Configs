# ==========================================================================
#  StarEggWars - melhorias da equipe (NPC de melhorias)
#
#  Cada melhoria tem um "Tipo" que define o efeito e os niveis com preco
#  ("MATERIAL : quantidade"). Tipos:
#    GERADOR     - acelera os geradores que estao dentro da ilha da equipe
#                  (Raio da ilha da arena, a partir do ovo; Valor = % mais
#                  rapido, por cima do nivel que o gerador ja tem)
#    PRESSA      - pressa para a equipe (Valor = nivel do efeito)
#    AFIACAO     - afiacao nas espadas da equipe (Valor = nivel)
#    PROTECAO    - protecao nas armaduras da equipe (Valor = nivel)
#    REGENERACAO - cura quem esta na ilha (Valor = nivel)
#    VIDA        - coracoes extras (Valor = coracoes)
#    DRAGAO      - dragao extra na morte subita (Valor = quantidade)
# ==========================================================================

Versao do modelo: 1

