# ==========================================================================
#  StarEggWars - nomes dos comandos
#
#  Troque o nome ou as aliases de um comando sem mexer no jar. Formato
#  "principal|alias|alias". Vazio = so os nomes padrao do plugin (os do
#  plugin.yml). Com a linha preenchida, SO os nomes dela valem: o que nao
#  estiver nela deixa de existir (ex.: spawn: "spawn|s" libera /l, /leave e
#  /sairew para outros plugins).
#    spawn - sai da partida e volta ao spawn deste servidor (/ew setlobby)
#    lobby - manda para o lobby do proxy (config.yml > Geral > Lobby servidor;
#            funciona sem plugin no proxy, pelo canal do BungeeCord)
# ==========================================================================

Versao do modelo: 4

comandos:
  ew: ''
  grupo: ''
  reconectar: ''
  rastrear: ''
  missoes: ''
  spawn: ''
  lobby: ''
  amigo: ''

# Atalhos para QUALQUER comando do servidor (nao so os do plugin). Cada um
# tem um nome livre; "origem" e o comando de verdade e "atalho" sao os nomes
# curtos, separados por virgula. O que vier depois do atalho e repassado no
# fim, e a permissao continua sendo a do comando de origem. Exemplo:
#
#   atalhos:
#     # nome para o atalho
#     criativo:
#       origem: 'gamemode creative'
#       atalho: 'gmc, criativo'      # /gmc Steve vira /gamemode creative Steve
#     modo:
#       origem: 'gamemode'
#       atalho: 'gm'                 # /gm 1 vira /gamemode 1
#     iniciar:
#       origem: 'ew iniciar'
#       atalho: 'start'              # /start vira /ew iniciar
#
# Vale no chat e no console; o /ew recarregar aplica sem reiniciar.
atalhos: {}
