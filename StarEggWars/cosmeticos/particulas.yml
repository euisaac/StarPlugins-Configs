# ==========================================================================
#  StarEggWars - cosmeticos/particulas.yml - efeitos de particula do spawn
#
#  Um efeito que acompanha o jogador no lobby. "Particula" e o nome da
#  particula (FLAME, HEART, VILLAGER_HAPPY, CLOUD, REDSTONE, ENCHANTMENT_TABLE,
#  PORTAL, NOTE, LAVA, SNOWBALL, CRIT, SPELL_WITCH, FIREWORKS_SPARK...).
#  "Forma":
#    AURA    - nuvem em volta do corpo ("Quantidade" por vez)
#    ANEL    - dois pontos girando nos pes
#    ESPIRAL - helice subindo pelo corpo
#    TRILHA  - deixa um rastro so quando anda
#    ASAS    - duas asas nas costas
#    HALO    - aureola girando acima da cabeca
#    CHUVA   - nuvenzinha na cabeca pingando a "Particula"
#    ORBITA  - tres pontos orbitando o corpo
#    CORACAO - um coracao pulsando nas costas
#    DUPLA   - helice dupla subindo e descendo pelo corpo
#  "Cor: R,G,B" (opcional) pinta as formas desenhadas (ANEL, ESPIRAL,
#  ASAS, HALO, ORBITA, CORACAO, DUPLA) com poeira dessa cor. Na 1.8, que
#  nao tem cor, sai a particula antiga mais parecida.
#  Permissoes: stareggwars.particula.<chave> / stareggwars.particula.*
#
#  "Coins" e a moeda interna (ganha jogando). "Cash" e o dinheiro do
#  servidor: com "Cash.Tipo: STARECONOMIA" no config.yml, o valor sai da
#  moeda do StarEconomia -- da para vender qualquer cosmetico nela.
#  "Ativar: false" tira o cosmetico da loja sem apagar a linha dele.
#  "Desde: N" marca a versao do arquivo em que o cosmetico chegou: e o que
#  faz um cosmetico novo entrar UMA vez em quem ja tinha o arquivo. Pode
#  apagar o cosmetico que quiser -- o que voce apagou nao volta.
# ==========================================================================

