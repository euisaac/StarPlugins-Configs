# ==========================================================================
#  StarEggWars - cosmeticos/kits.yml - kits
#
#  Um kit e aplicado na entrada de cada vida (nasce e renasce com ele).
#  Kits.<modo> vale para aquele modo (solo, dupla, trio, quarteto, ranqueado);
#  Kits.todos vale para todos os modos de uma vez.
#
#  Campos:
#    Nome, Material (icone), Raridade (COMUM, RARO, EPICO, LENDARIO),
#    Permissao (opcional: quem tem ja possui), Descricao (linhas da lore),
#    Niveis.<n>: Coins e Cash (0 e 0 = so pela caixa misteriosa), Itens,
#    Comandos (console, {jogador}) e Descricao propria do nivel.
#
#  Formato de item: "MATERIAL : quantidade : enchant=NOME:nivel : name=&aNome
#  : effect=EFEITO:nivel:segundos : cor=equipe". "cor=equipe" tinge la,
#  argila, vidro e couro com a cor da equipe.
#  Permissao para ter todos os kits: stareggwars.kit.*
# ==========================================================================

