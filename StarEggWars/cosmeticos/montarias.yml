# ==========================================================================
#  StarEggWars - cosmeticos/montarias.yml - montarias do spawn
#
#  Ao escolher, o jogador ja aparece montado (e volta a montar quando entra
#  no lobby). Descer (agachar) faz a montaria sumir: escolha de novo para
#  montar. Ninguem mais sobe nela e ela nao toma dano.
#  "Entidade": qualquer bicho (HORSE, DONKEY, MULE, SKELETON_HORSE,
#  ZOMBIE_HORSE, PIG, COW, SHEEP, WOLF, POLAR_BEAR, CHICKEN...). Os cavalos
#  usam a direcao do proprio jogo; os outros sao dirigidos pelo plugin (W/S
#  na direcao do olhar, A/D de lado, espaco pula) e nao tem IA propria.
#  Na 1.8-1.10 burro/mula/esqueleto/zumbi viram variantes do cavalo.
#  "Cor" (cavalo): WHITE, CREAMY, CHESTNUT, BROWN, BLACK, GRAY, DARK_BROWN.
#  "Estilo": NONE, WHITE, WHITEFIELD, WHITE_DOTS, BLACK_DOTS.
#  "Armadura": IRON_HORSE_ARMOR, GOLDEN_HORSE_ARMOR, DIAMOND_HORSE_ARMOR.
#  "Velocidade": cavalo = atributo do jogo (~0.22 padrao); os outros =
#  blocos por tick (0.25 = anda como um jogador correndo). "Pulo": cavalo
#  0 a 2; os outros = impulso do pulo (0.5 = um bloco, 0 = nao pula).
#  Permissoes: stareggwars.montaria.<chave> / stareggwars.montaria.*
# ==========================================================================

