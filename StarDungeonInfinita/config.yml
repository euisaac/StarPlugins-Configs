# =========================================================
#                 StarDungeonInfinita
#   Dungeons infinitas: as salas vao sendo geradas conforme
#   o grupo abre as portas. Quase tudo daqui tambem pode ser
#   ajustado em jogo pelo menu da staff (/dginf admin).
# =========================================================

# Mundo vazio onde as dungeons sao montadas (criado sozinho).
mundo: "dungeon_infinita"
# Altura do chao das salas nesse mundo.
altura-chao: 64
# Distancia (em blocos) entre as areas de corridas diferentes e entre os
# andares de uma mesma corrida. Aumente se usar salas muito grandes.
distancia-entre-corridas: 6000
distancia-entre-andares: 2500
# Pagar para comecar uma corrida (Vault ou StarEconomia). O preco e o
# "preco" da dificuldade vezes o multiplicador do tamanho das salas (que
# depende de quantos jogadores tem o grupo). Em grupo o lider escolhe no menu
# se o valor e dividido entre todos ou se ele paga sozinho.
pagamento:
  ativo: false
  dividir-padrao: true
  multiplicador-tamanho:
    pequena: 1.0
    media: 1.5
    grande: 2.0

# Modo "perder itens" (botao no menu da Infinita): quem cair larga o inventario
# no chao da sala; em troca o loot e o dinheiro da corrida sobem.
perder-itens:
  permitir: true
  loot: 1.5
  dinheiro: 1.75

# Placeholder %stardungeon_infinita% (precisa do PlaceholderAPI): mostra a sala em
# que o jogador esta, e fica vazio fora da dungeon. Tambem existem
# %stardungeon_infinita_sala%, _andar, _dificuldade e _tema.
placeholder:
  # O espaco antes do simbolo faz parte do texto (fica entre as aspas).
  formato: " {cor}✧ {sala}"
  # Cor a partir de cada sala.
  cores:
    1: "&a"
    10: "&e"
    20: "&6"
    35: "&c"
    50: "&5"
    80: "&4"

# Quantas corridas podem acontecer ao mesmo tempo.
maximo-corridas: 30
# Quem cai do servidor no meio da corrida tem esse tempo (segundos) para
# entrar de novo e voltar para o grupo. 0 = sai da corrida na hora.
reconexao-segundos: 180
# Parede escura a 1 bloco atras de cada portao ainda fechado (esconde o vazio do
# outro lado); some quando a porta abre. "nenhum" desliga.
bloco-cortina-portao: "minecraft:black_wool"
# Ao reiniciar o plugin (ou o servidor), as corridas sao guardadas e continuam
# de onde pararam. Sala que estava em combate recomeca o combate.
manter-corridas-ao-reiniciar: true
# Tempo (em ms) por tick que o plugin pode gastar colando/limpando blocos.
# Mais = salas aparecem mais rapido; menos = mais folga para o servidor.
ms-por-tick: 6

# Para onde os jogadores voltam ao sair/terminar. Vazio = de onde vieram.
# Defina em jogo com /dginf admin > Definir saida (formato mundo;x;y;z;yaw;pitch).
saida: ""

# Tamanho das salas conforme quantos jogadores tem o grupo. Toda sala de
# um tamanho tem o mesmo lado (impar) e a saida fica no meio de cada parede
# (3 blocos de largura, 4 de altura, logo acima do chao).
# mobs-base: quantos mobs por sala de combate antes da escala por jogador.
tamanhos:
  pequena:
    nome: "&aPequena"
    lado: 17
    altura: 9
    ate-jogadores: 2
    mobs-base: 3
  media:
    nome: "&eMedia"
    lado: 25
    altura: 11
    ate-jogadores: 4
    mobs-base: 4
  grande:
    nome: "&cGrande"
    lado: 33
    altura: 13
    ate-jogadores: 100
    mobs-base: 6

# Maximo de jogadores num grupo da dungeon infinita.
maximo-jogadores-grupo: 8

dificuldades:
  FACIL:
    nome: "&aFacil"
    icone: LIME_DYE
    vida: 0.7
    dano: 0.7
    loot: 0.8
    dinheiro: 0.7
    salas-por-andar: 6
    # Multiplica a quantidade de mobs por sala.
    mobs: 1.0
    # Custo para comecar a corrida (com pagamento.ativo).
    preco: 0
  NORMAL:
    nome: "&eNormal"
    icone: YELLOW_DYE
    vida: 1.0
    dano: 1.0
    loot: 1.0
    dinheiro: 1.0
    salas-por-andar: 8
    # Multiplica a quantidade de mobs por sala.
    mobs: 1.3
    # Custo para comecar a corrida (com pagamento.ativo).
    preco: 500
  DIFICIL:
    nome: "&cDificil"
    icone: RED_DYE
    vida: 1.5
    dano: 1.35
    loot: 1.3
    dinheiro: 1.5
    salas-por-andar: 10
    # Multiplica a quantidade de mobs por sala.
    mobs: 1.7
    # Custo para comecar a corrida (com pagamento.ativo).
    preco: 1500
  PESADELO:
    nome: "&4&lPesadelo"
    icone: WITHER_ROSE
    vida: 2.3
    dano: 1.8
    loot: 1.7
    dinheiro: 2.2
    salas-por-andar: 12
    # Multiplica a quantidade de mobs por sala.
    mobs: 2.2
    # Custo para comecar a corrida (com pagamento.ativo).
    preco: 4000

# Como os mobs crescem. A ideia e mais VIDA, nao mais mobs:
#   vida  = base x dificuldade x (1 + vida-por-jogador x (jogadores-1))
#           x (1 + vida-por-sala x sala) x (1 + vida-por-andar x (andar-1))
#   mobs  = mobs-base do tamanho + mobs-por-jogador x (jogadores-1)  (arredonda pra baixo)
# Balanceamento automatico: se o grupo limpa as salas rapido e quase sem levar
# dano, as proximas salas ficam mais dificeis (mais vida, mais dano e mais mobs);
# se alguem cai ou a sala demora muito, volta a aliviar. 1.0 = normal.
balanceamento:
  ativo: true
  passo: 0.15
  minimo: 1.0
  maximo: 3.0
  # Rapido = ate esses segundos por mob; lento = a partir desses.
  segundos-por-mob-rapido: 6
  segundos-por-mob-lento: 14
  # Dano levado na sala, em fracao da vida do grupo (1.0 = a vida inteira de todos).
  dano-leve: 0.35
  dano-pesado: 0.9
  # Quanto o desafio pesa no dano (a vida usa ele inteiro) e mobs a mais por ponto.
  peso-no-dano: 0.6
  mobs-por-ponto: 2.5

escala:
  # Multiplica o dano de todos os mobs (os valores dos temas sao a base).
  dano-global: 1.7
  vida-por-jogador: 0.6
  mobs-por-jogador: 0.35
  # Mobs a mais conforme a corrida avanca (por sala vencida e por andar) e o teto.
  mobs-por-sala: 0.08
  mobs-por-andar: 0.5
  mobs-maximo: 14
  dano-por-jogador: 0.05
  vida-por-sala: 0.06
  dano-por-sala: 0.025
  vida-por-andar: 0.35
  dano-por-andar: 0.12
  # Vida do boss tambem cresce mais com o grupo.
  vida-boss-por-jogador: 0.85
  # A partir dessa vida o mob passa a usar "vida virtual" (o dano recebido e
  # dividido), porque o servidor limita a vida maxima real (padrao 1024/2048).
  vida-real-maxima: 1000

# Chance (peso) de cada tipo de sala aparecer atras de uma porta nova.
# BOSS nao entra aqui: ele aparece sozinho ao fim de cada andar.
geracao:
  pesos:
    COMBATE: 60
    ELITE: 12
    BAU: 16
    DESCANSO: 8
    # Corredor: mobs nascem conforme o grupo avanca pelo corredor.
    CORREDOR: 12
    # Horda: portais soltam ondas de mobs (so nas dificuldades de horda-dificuldades).
    HORDA: 10
    # Sala das Portas: corredor escuro com celas (baus e mimicos).
    PORTAS: 8
    # Corredor Escuro: sem tocha na mao, a Sombra aparece.
    ESCURO: 8
    # Armadilha: prende so quem entrou; ondas + flechas e espinhos.
    ARMADILHA: 7
  horda-dificuldades: [DIFICIL, PESADELO]
  armadilha-a-partir-da-sala: 4
  armadilha-intervalo-segundos: 4
  # Sombra (salas escuras): segundos no escuro sem luz na mao ate ela vir,
  # dano por segundo (2 = 1 coracao), espera depois de morta e luz maxima
  # que ainda conta como escuro.
  sombra-segundos-no-escuro: 4
  sombra-dano: 2.0
  sombra-espera-segundos: 20
  sombra-luz-maxima: 3
  # Chances: bau da sala das portas ser mimico; ponto de emboscada soltar
  # monstros; mob de combate vir invisivel (espreitador).
  chance-mimico: 0.3
  chance-emboscada: 0.6
  chance-espreitador: 0.12
  # Elite so a partir dessa sala do andar.
  elite-a-partir-da-sala: 3
  # Descanso nao aparece duas vezes seguidas e so depois de N salas desde o ultimo.
  descanso-intervalo-minimo: 4
  # Fogueira do descanso: vida curada por segundo de quem esta dentro da sala
  # (a aura so roda com alguem na sala).
  descanso-cura-por-segundo: 1.0
  # Salas de tesouro/descanso costumam ser becos sem saida (o grupo volta e abre outra porta).
  chance-beco-sem-saida: 0.65
  # Quantas portas novas uma sala de combate abre (1 + chance de mais).
  chance-segunda-porta: 0.35
  chance-terceira-porta: 0.10
  # Quando o grupo entra numa sala de combate, puxa quem ficou para tras.
  puxar-grupo-ao-entrar: true
  # Segundos de preparo antes dos mobs aparecerem.
  preparo-segundos: 3
  # Combate pode ter ondas: chance de vir uma segunda onda.
  chance-segunda-onda: 0.30
  # Chance de cada ponto de bau escondido (la azul-clara) virar um bau com loot do tema
  # (um pouco menos itens que o bau normal). O ponto que nao sorteia fica vazio.
  chance-bau-escondido: 0.35

# Tema "aleatorio": cada andar sorteia um tema diferente do anterior.
# Ao terminar um andar o grupo pode continuar (mais forte) ou sair.
manter-inventario: true
# Os jogadores caidos voltam quando a sala de combate atual e limpa.
reviver-ao-limpar-sala: true
# Vida (fracao) com que o jogador volta.
vida-ao-reviver: 0.5

recompensas:
  # Dinheiro (Vault) por sala de combate limpa, por jogador.
  dinheiro-por-sala: 25
  # Cresce com a profundidade: + esse tanto por sala ja vencida.
  dinheiro-cresce-por-sala: 0.05
  dinheiro-por-boss: 400
  # Comandos ao derrotar o boss de um andar (para cada jogador vivo).
  # Placeholders: %jogador% %andar% %sala% %dificuldade% %tema%
  comandos-boss: []
  # Comandos ao terminar a corrida (sair ou cair), conforme a sala alcancada.
  # Cada chave e a sala minima; vale a MAIOR faixa alcancada. Exemplo:
  #   comandos-por-sala:
  #     "10": ["eco give %jogador% 1000"]
  #     "25": ["eco give %jogador% 5000"]
  comandos-por-sala: {}

# Comandos liberados dentro da dungeon infinita (sem a barra).
comandos-permitidos:
  - dginf
  - dungeoninfinita
  - infinita
  - dungeon
  - r
  - g
  - tell
  - msg

# Blocos que marcam pontos especiais nas salas (troque se sua sala usa la
# como decoracao). Sao removidos ao colar a sala.
marcadores:
  mob: "minecraft:red_wool"
  boss: "minecraft:purple_wool"
  bau: "minecraft:yellow_wool"
  entrada: "minecraft:lime_wool"
  # Bau escondido: coloque em nichos discretos (atras de estante, recuo da parede...).
  # Vale em qualquer tipo de sala; vira bau so pela chance geracao.chance-bau-escondido.
  bau-escondido: "minecraft:light_blue_wool"
  # Gatilho (salas de corredor): no chao do corredor; quando o grupo passa, os mobs aparecem.
  gatilho: "minecraft:orange_wool"

# Blocos novos que nao existem na versao do servidor caem num substituto.
# Ja existe uma lista padrao; aqui voce pode adicionar ou trocar.
substitutos: {}

# Banco dos recordes: SQLITE (arquivo) ou MYSQL.
banco:
  tipo: SQLITE
  mysql:
    host: localhost
    porta: 3306
    banco: stardungeon
    usuario: root
    senha: ""
