# ============================================================
#  StarDungeonPets - mensagens
#  {prefixo} pode ser usado em qualquer mensagem.
#  Deixe uma mensagem vazia ("") para nao enviar nada.
# ============================================================

prefixo: "&8[&bPets&8] &7"

sem-permissao: "{prefixo}&cVocê não tem permissão para isso."
so-jogador: "{prefixo}&cSó jogadores podem usar isso."
pet-inexistente: "{prefixo}&cNão existe pet com o id &f{pet}&c."
nao-possui: "{prefixo}&cVocê não possui o pet {pet}&c."
escolheu: "{prefixo}Agora {pet} &7acompanha você nas dungeons!"
guardou: "{prefixo}Você guardou o seu pet. Nenhum pet vai te acompanhar."
recebeu: "{prefixo}&aVocê ganhou o pet {pet}&a! Use &f/petdungeon &apara escolher."
perdeu: "{prefixo}&cO pet {pet} &cfoi removido da sua coleção."
subiu-nivel: "{prefixo}{pet} &7subiu para o nível &e{nivel}&7!"
reviveu: "&d{pet} &dde {dono} reviveu &f{jogador}&d! &7(&f{restam} &7usos até a sala &f{proxima}&7)"

menu:
  titulo: "&8Pets da Dungeon"
  nao-possui: "&cVocê não possui"
  ativo: "&a✔ Este pet está ativo"
  clique-escolher: "&eClique para escolher"
  clique-guardar: "&eClique para guardar"

admin:
  uso-dar: "{prefixo}&cUse: /petdungeonadmin dar <jogador> <pet>"
  uso-remover: "{prefixo}&cUse: /petdungeonadmin remover <jogador> <pet>"
  uso-ver: "{prefixo}&cUse: /petdungeonadmin ver <jogador>"
  jogador-desconhecido: "{prefixo}&cO jogador &f{jogador} &cnunca entrou neste servidor."
  deu: "{prefixo}&aVocê deu o pet {pet} &apara &f{jogador}&a."
  ja-tinha: "{prefixo}&e{jogador} &ejá tinha o pet {pet}&e."
  removeu: "{prefixo}&aVocê removeu o pet {pet} &ade &f{jogador}&a."
  nao-tinha: "{prefixo}&e{jogador} &enão tinha o pet {pet} &e(setado)."
  ver-titulo: "&b&lPets de {jogador}"
  recarregado: "{prefixo}&aRecarregado! &f{pets} &apets carregados."

ajuda-jogador:
  - "&b&lPets da Dungeon"
  - "&f/{comando} &7- abre o menu dos seus pets"
  - "&f/{comando} <pet> &7- escolhe o pet ativo"
  - "&f/{comando} guardar &7- guarda o pet"

ajuda-admin:
  - "&b&lPets da Dungeon &7(staff)"
  - "&f/{comando} dar <jogador> <pet> &7- dá um pet"
  - "&f/{comando} remover <jogador> <pet> &7- tira um pet"
  - "&f/{comando} ver <jogador> &7- pets e números de um jogador"
  - "&f/{comando} menu &7- catálogo de todos os pets"
  - "&f/{comando} recarregar &7- recarrega config, pets e mensagens"
