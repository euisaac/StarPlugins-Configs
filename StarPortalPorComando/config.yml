# ==========================================================================
#  StarPortalPorComando - configuracao
#
#  As areas em si NAO ficam aqui: elas sao criadas no jogo (marque os dois
#  cantos com a varinha e use /starportalporcomando criar <nome>) e ficam
#  guardadas no areas.yml, ao lado. Este arquivo cuida do que vale para o
#  produto inteiro.
# ==========================================================================

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

Geral:
  # Mostra no console cada disparo e cada resposta de chat capturada.
  Debug: false

  # Quantas areas o servidor aceita ao todo. 0 = sem limite.
  Limite de areas: 0

Verificacao:
  # De quantos em quantos ticks a presenca de cada jogador e refeita.
  # 10 ticks = meio segundo. E esta tarefa que cuida do gatilho
  # "Permanecer", do fim do aquecimento e dos casos que o movimento nao
  # cobre (teleporte de outro plugin, area criada em volta de quem esta
  # parado). Baixar demais custa CPU a toa.
  Ticks: 10

  # Alem da tarefa acima, recalcula na hora em que o jogador muda de bloco.
  # E o que faz a area parecer instantanea. Desligue so se o seu servidor
  # tiver um problema serio de performance no evento de movimento.
  No movimento: true

  # Quem sai do servidor dentro de uma area dispara o gatilho "Sair".
  # Desligue se os seus comandos de saida dependerem de o jogador estar
  # mesmo online (dar item, teleportar).
  Disparar saida ao sair do servidor: true

  # Mostra na actionbar quantos segundos faltam para o aquecimento acabar.
  Contagem no aquecimento: true

  # De quantos em quantos segundos o dados.yml (usos e entradas de cada
  # jogador) vai para o disco. A gravacao acontece fora da thread principal.
  Salvar os dados a cada: 60

Contorno:
  # De quantos em quantos ticks o contorno das areas e redesenhado.
  Ticks: 12

  # Teto de particulas por area em cada desenho. Passando disso, o
  # espacamento e afrouxado sozinho ate caber -- e assim que uma area de
  # 200 blocos de lado nao derruba a banda do servidor.
  Maximo de particulas por area: 400

# A varinha que marca os dois cantos: esquerdo o primeiro, direito o
# segundo. Ela e reconhecida por uma marca escondida, nao pelo material --
# renomear na bigorna nao quebra nada.
Varinha:
  Material: BLAZE_ROD
  Nome: '&d&lVarinha de area'
  Lore:
    - '&7Marca os cantos das areas do'
    - '&7StarPortalPorComando.'
    - ''
    - '&fClique esquerdo num bloco&7: primeiro canto'
    - '&fClique direito num bloco&7: segundo canto'
    - ''
    - '&7Depois: &f/starportalporcomando criar <nome>'

# Formato: SOM, SOM;volume ou SOM;volume;tom. Deixe vazio para nao tocar.
Sons:
  Clique: 'UI_BUTTON_CLICK;1;1'
  Sucesso: 'ENTITY_PLAYER_LEVELUP;1;1.4'
  Erro: 'ENTITY_VILLAGER_NO;1;1'

# So importa quando alguma area cobra um valor para disparar.
Economia:
  # VAULT, STARECONOMIA ou COMANDO.
  #   VAULT        - qualquer economia registrada no Vault
  #   STARECONOMIA - fala direto com o produto irmao
  #   COMANDO      - para as economias que nao se registram em lugar nenhum:
  #                  o saldo e lido por placeholder e o dinheiro sai por
  #                  comando de console
  Tipo: VAULT

  # So no modo STARECONOMIA.
  Moeda do StarEconomia: 'dinheiro'

  Simbolo: '$'

  # So no modo COMANDO.
  Placeholder do saldo: ''
  Comando de retirar: ''
  Comando de dar: ''

