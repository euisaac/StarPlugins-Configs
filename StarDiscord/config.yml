# =========================================================
#  Mute espelhado do jogo (StarPunicoes)
# =========================================================
# Quando alguem e mutado no Minecraft, ele tambem fica sem falar no Discord -
# no chat e na call. O silenciamento e feito por um CARGO com "Enviar mensagens"
# e "Falar" negados, e nao pelo mute de call do Discord, que so funciona para
# quem esta numa call naquele instante e nao alcanca o chat.
#
# O mute fica gravado no banco: quem sai do servidor do Discord e volta perde os
# cargos, mas o cargo de mute e recolocado assim que ele entra de novo.
Mute:
  Ativado: true
  # ID do cargo usado para silenciar. Deixe vazio que o bot cria o cargo sozinho
  # na primeira vez (e nega falar/escrever em todas as categorias), gravando o ID
  # aqui. Para isso o bot precisa da permissao "Gerenciar cargos", e o cargo dele
  # precisa estar ACIMA do cargo de mute na lista de cargos do Discord.
  Cargo: ''
  Nome-Do-Cargo: 'Mutado'
  # Manda uma DM avisando (com motivo e quanto falta) ao mutar e ao desmutar.
  Avisar-Por-DM: true
  DM-Mutado: 'Voce foi silenciado no Discord porque foi mutado no servidor.'
  DM-Desmutado: 'Seu silenciamento no Discord acabou.'

# Banimentos espelhados entre o jogo e o Discord (precisa do StarPunicoes para
# o lado jogo -> Discord). O bot precisa da permissao "Banir membros" e de um
# cargo acima do da pessoa.
Banimento:
  Ativado: true
  # BANIR: a conta vinculada e banida do Discord e desbanida sozinha quando a
  #        pena do jogo vence.
  # CARGO: a conta recebe o cargo abaixo (ex.: um cargo que so ve o canal de
  #        apelacao). Sair e voltar ao Discord nao tira o cargo.
  Acao: BANIR
  Cargo: ''
  Avisar-Por-DM: true
  DM-Banido: 'Voce foi banido do Discord porque foi banido do servidor.'
  DM-Desbanido: 'Seu banimento no Discord acabou.'
  # Quando a staff bane/desbane alguem DIRETO no Discord, roda estes comandos
  # no console para o jogador vinculado. {player}, {motivo}, {discord_id}.
  # Funciona com qualquer plugin de punicao.
  Do-Discord-Para-O-Jogo:
    Ativado: false
    Ao-Banir:
      - 'ban {player} Banido no Discord: {motivo}'
    Ao-Desbanir:
      - 'pardon {player}'
