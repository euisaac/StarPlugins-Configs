    - ''
  Vinculou:
    - ''
    - '&aVocê vinculou com sucesso o discord.'
    - '&aConta: &f{discord_username}&a.'
    - '&aID: &f{discord_id}&a.'
    - ''
  Vinculado:
    - ''
    - '&aVocê vinculou com sucesso o discord.'
    - '&aConta: &f{discord_username}&a.'
    - '&aID: &f{discord_id}&a.'
    - ''
  Verifique:
    - ''
    - '&aDigite o código enviado à sua DM para completar a verificação.'
