Database:
  Tipo: SQLite # MySQL ou SQLite
  IP: localhost:3306
  DB: test
  User: admin
  Pass: ''
  Debug: true

# Comandos e aliases do plugin
Comando:
  Discord:
    Comando: 'discord'
    Aliases: [ dc ]
  Vincular:
    Comando: 'vincular'
    Aliases: [ vinculardc, dcvincular, discordvincular, vinculardiscord, dc ]
  Desvincular:
    Comando: 'desvinculardiscord'
    Aliases: [ desvincular, desvinculardc, dcdesvincular, discorddesvincular ]
  VerDiscord:
    Comando: 'verdiscord'
    Aliases: [ userdc, verdc, discordver, dcver ]
  ConfigDiscord:
    Comando: 'configdiscord'
    Aliases: [ configdc, perfildiscord ]

  # Comando no discord
  Discord-Command:
    enabled: true
    commands: [ 'vincular' ]

# Tag do vinculado
# %stardiscord_tag%
Tag: 
   vinculado: ' &2✔ '
   nao-vinculado: ' &c✘ '

# Tag de Booster Minecraft
# %stardiscord_tagboost%
TagBoost: 
   1xboost: ' &d🚀 ' #Enviou 1 boost no servidor
   2xboost: ' &5🚀 ' #Enviou 2 boosts no servidor

# Configurações do bot
Bot:
  # Token do bot
  Token: ''
  # ID do grupo (guilda) do discord
  Guild: ''
  # Canal onde caem os avisos de boost, para contar quantos boosts cada pessoa deu.
  # Deixe '' (vazio) para o bot usar sozinho o CANAL DE SISTEMA do Discord (onde
  # ele mesmo posta "Fulano impulsionou o servidor!"). Preencha com o ID do canal
  # só se seus avisos de boost ficam em outro canal.
  BoostChannel: ''
  # Ligue (true) só se, nos logs, seus avisos de boost "N vezes" forem N boosts
  # de uma vez (simultaneos). Se o "N vezes" for o total acumulado da pessoa,
  # deixe false (padrao) para nao contar duas vezes.
  BoostContarVezes: false
  # Status do bot
  # Deixe '' (vazio para não usar)
  Status: 'Survival Destiny - %players_online% Online.' # Use %players_online% para mostrar jogadores online
  # Link de convite do Discord
  Invite: 'https://discord.gg/SEU_LINK_AQUI'

# Sistema de aviso para vincular
Aviso:
  Ativar: true
  Mensagem:
    - ' '
    - ' &aVoce ainda não se vinculou ao discord.'
    - ' &aUtilize &f/discord&a para vincular.'
    - ' '

# Opções gerais do plugin
Opcoes:
  # /discord sem argumentos abre MENU: quem ja vinculou cai no /perfildiscord;
  # quem nao vinculou ve "Vincular minha conta" e "Nosso Discord" (link).
  # false = /discord so manda o link no chat, como antes.
  DiscordPorMenu: true
  # Bypass de cargos automáticos no Discord.
  # A permissão stardiscord.bypass já funciona sozinha: quem tiver essa permissão
  # (ex: staff) não recebe cargos automaticamente, só ativando manualmente em /perfildiscord.
  # Esta opção aqui é um interruptor GERAL: se true, aplica esse mesmo comportamento
  # para TODOS os jogadores, sem precisar dar a permissão individualmente.
  Bypass: false
  # Enviar mensagem no chat apenas se estiver vinculado
  ChatVinculado: false
  # Habilitar o jogador desvincular o discord
  Desvincular: false
  # Recompensas dadas ao vincular pela primeira vez
  # As recompensas são cadastradas na recompensas.yml
  # Use: chance,recompense
  Recompensas:
    - '100,Reco1'
  # Sistema de verificação do server booster
  Booster:
    Ativar: false
    # ID do cargo do booster
    CargoID: '761437104990846988'
    # Comandos que serão executados
    Comandos:
      # Ao virar booster
      Booster:
        # Executar o comando sempre ao logar
        # caso false, será executado apenas uma vez
        AoLogar: false
        Lista:
          - 'tell {player} {player} Você ainda é Booster.'
          - 'darvip {player} booster 15d'
      # Ao não ser mais booster
      NaoBooster:
        Lista:
          - 'tell {player} {player} Você não é mais Booster.'
          - 'setarvip {player} Booster 1s'

# Mensagens gerais do plugin
Mensagens:
  Permissao: '&cVocê não tem permissão para isto.'
  Cancelou: '&cVocê cancelou a ação.'
