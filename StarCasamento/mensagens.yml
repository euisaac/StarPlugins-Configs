Ajuda:
  Comandos: |
    &d&lSTARCASAMENTO &7- &fComandos
    &f/casamento &7Abre o menu do casamento.
    &f/casamento casar <jogador> &7Pede alguem em casamento.
    &f/casamento aceitar &7Aceita o pedido aberto.
    &f/casamento negar &7Recusa o pedido aberto.
    &f/casamento cancelar &7Cancela o pedido que voce fez.
    &f/casamento divorciar &7Desfaz o seu casamento.
    &f/casamento tp &7Teleporta ate o seu parceiro.
    &f/casamento casa &7Vai para a casa do casal.
    &f/casamento definircasa &7Define a casa do casal aqui.
    &f/casamento removercasa &7Apaga a casa do casal.
    &f/casamento chat [mensagem] &7Conversa em particular com o parceiro.
    &f/casamento presente &7Da o item da sua mao para o parceiro.
    &f/casamento beijo &7Beija o seu parceiro.
    &f/casamento abraco &7Abraca o seu parceiro.
    &f/casamento pvp &7Liga ou desliga o dano entre voces.
    &f/casamento mochila &7Abre a mochila do parceiro.
    &f/casamento compartilhar &7Deixa o parceiro abrir a sua mochila.
    &f/casamento sobrenome <nome> &7Define o sobrenome do casal.
    &f/casamento cor &7Escolhe a cor do coracao.
    &f/casamento visto &7Mostra quando o parceiro entrou pela ultima vez.
    &f/casamento info [jogador] &7Mostra os dados de um casamento.
    &f/casamento lista &7Lista os casais do servidor.
    &f/casamento parceiros &7Lista os seus parceiros.
    &f/casamento padres &7Mostra os padres online.
  Admin: |
    &d&lSTARCASAMENTO &7- &fAdministracao
    &f/starcasamento recarregar &7Recarrega os arquivos de configuracao.
    &f/starcasamento versao &7Mostra a versao e o banco em uso.
    &f/starcasamento casar <jogador1> <jogador2> &7Casa dois jogadores na forca.
    &f/starcasamento divorciar <jogador1> <jogador2> &7Desfaz um casamento na forca.
    &f/starcasamento migrar marriagemaster confirmar &7Importa os dados do MarriageMaster.
  Uso divorciar admin: '&cUse &f/starcasamento divorciar <jogador1> <jogador2>&c.'
  Uso casar admin: '&cUse &f/starcasamento casar <jogador1> <jogador2>&c.'
