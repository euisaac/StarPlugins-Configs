#  Mensagens do StarCasamento.
#  Cores: &a, &c, ... e hex no formato &#RRGGBB.
#  Deixe '' (vazio) para nao enviar a mensagem.
#
#  "Versao do modelo" e o numero deste arquivo dentro do jar. Quando ele sobe
#  numa atualizacao, o plugin guarda o seu arquivo como mensagens-antigo-vX.yml
#  e escreve o modelo novo no lugar -- e assim que as mensagens novas chegam.
Versao do modelo: 1

Prefixo: '&d&lStarCasamento &8» &r'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  Somente jogador: '&cApenas jogadores in-game podem fazer isso.'
  Jogador nao encontrado: '&cO jogador &f{jogador}&c nao foi encontrado.'
  Jogador offline: '&cO jogador &f{jogador}&c nao esta online.'
  Parceiro offline: '&cSeu parceiro nao esta online.'
  Parceiro nao encontrado: '&cVoce nao e casado com &f{jogador}&c.'
  Nao e casado: '&cVoce nao e casado.'
  Casal nao encontrado: '&f{jogador}&c e &f{parceiro}&c nao sao casados.'
  Comando desconhecido: '&cO subcomando &f{comando}&c nao existe.'
  Recarregado: '&aConfiguracoes recarregadas com sucesso.'
  Versao: '&7StarCasamento &fv{versao} &8| &7Banco: &f{banco} &8| &7Casais: &f{casamentos}'

