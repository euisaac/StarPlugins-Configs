# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o Material 'PLAYER_HEAD' (o mesmo nome vale
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

Versao do modelo: 2

# A mesa de troca em si. Os slots sao fixos (4x4 itens de cada lado, divisoria no meio, botoes na ultima linha);
# aqui so se muda a aparencia dos botoes e dos vidros.
Mesa:
  Titulo: '&8Troca com {jogador}'

  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
    # Divisoria do meio: acende de cima para baixo na contagem (os dois confirmaram).
    Material confirmado: LIME_STAINED_GLASS_PANE
    # Barra embaixo de cada lado: vermelha ate o lado confirmar, verde depois.
    Barra aguardando: RED_STAINED_GLASS_PANE
    Barra confirmada: LIME_STAINED_GLASS_PANE

  Cabeca seu:
    Nome: '&a&l{jogador}'
    Lore:
      - '{estado}'

  Cabeca dele:
    Nome: '&e&l{alvo}'
    Lore:
      - '{estado_alvo}'

  Dinheiro seu:
    Material: GOLD_INGOT
    Nome: '&6Seu dinheiro na troca'
    Lore:
      - '&f{valor_seu}'
      - ''
      - '&eClique para digitar um valor.'

  Dinheiro dele:
    Material: GOLD_NUGGET
    Nome: '&6Dinheiro dele na troca'
    Lore:
      - '&f{valor_alvo}'

  Confirmar:
    Material confirmado: EMERALD_BLOCK
    Material aguardando: EMERALD
    Nome: '&a&lCONFIRMAR'
    Lore:
      - '&7Clique para {acao_confirmar} a troca.'
      - ''
      - '&7Voce: {estado}'
      - '&7Ele: {estado_alvo}'

  Cancelar:
    Material: REDSTONE_BLOCK
    Nome: '&c&lCANCELAR'
    Lore:
      - '&7Clique para cancelar a troca.'

Admin:
  Titulo: '&8Painel das trocas'
  Linhas: 3
  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
    So fora do conteudo: false
  Itens:
    Trancar:
      Slot: 10
      Material: '{material_trancado}'
      Nome: '&6Convites de troca'
      Lore:
        - '&7Estado atual: {trancado}'
        - ''
        - '&eClique para trocar.'
      Permissao: startrocas.admin
      Acoes:
        - 'trancar'
    Debug:
      Slot: 12
      Material: PAPER
      Nome: '&6Modo debug'
      Lore:
        - '&7Estado atual: {debug}'
        - ''
        - '&eClique para trocar.'
      Permissao: startrocas.admin
      Acoes:
        - 'debug'
    Ativas:
      Slot: 14
      Material: ENDER_EYE
      Nome: '&6Trocas em andamento'
      Lore:
        - '&7{ativas} troca(s) agora.'
        - ''
        - '&eClique para monitorar.'
      Permissao: startrocas.admin
      Acoes:
        - 'monitorlista'
    Historico:
      Slot: 16
      Material: BOOK
      Nome: '&6Historico de trocas'
      Lore:
        - '&7{total_historico} registro(s).'
        - ''
        - '&eClique para abrir.'
      Permissao: startrocas.admin
      Acoes:
        - 'historico'
    Recarregar:
      Slot: 22
      Material: EMERALD
      Nome: '&aRecarregar configuracoes'
      Permissao: startrocas.admin
      Acoes:
        - 'recarregar'

Historico:
  Titulo: '&8Historico ({pagina}/{paginas})'
  Linhas: 6
  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43 ]
  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
  Registro:
    Nome: '&e#{id} &7- &f{quando}'
    Lore:
      - '&7{jogador} &8<-> &7{alvo}'
      - '&7Itens: &f{itens_a} &7/ &f{itens_b}'
      - '&7Dinheiro: &f{valor_a} &7/ &f{valor_b}'
      - '&7Resultado: {resultado}'
      - '&7Servidor: &f{servidor}'
    Materiais:
      CONCLUIDA: LIME_DYE
      CANCELADA: GRAY_DYE
  Itens:
    Voltar:
      Slot: 45
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes:
        - 'voltar'
    Anterior:
      Slot: 48
      Material: ARROW
      Nome: '&ePagina anterior'
      Acoes:
        - 'anterior'
    Proxima:
      Slot: 50
      Material: ARROW
      Nome: '&eProxima pagina'
      Acoes:
        - 'proxima'

MonitorLista:
  Titulo: '&8Trocas ativas ({pagina}/{paginas})'
  Linhas: 6
  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43 ]
  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
    So fora do conteudo: true
  Registro:
    Nome: '&e{jogador} &8<-> &e{alvo}'
    Lore:
      - '&7Itens: &f{itens_a} &7/ &f{itens_b}'
      - '&7Dinheiro: &f{valor_a} &7/ &f{valor_b}'
      - '&7Confirmados: &f{confirmados}/2'
      - ''
      - '&eClique para monitorar.'
  Itens:
    Voltar:
      Slot: 45
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes:
        - 'voltar'
    Anterior:
      Slot: 48
      Material: ARROW
      Nome: '&ePagina anterior'
      Acoes:
        - 'anterior'
    Proxima:
      Slot: 50
      Material: ARROW
      Nome: '&eProxima pagina'
      Acoes:
        - 'proxima'

# Espelho, so de leitura, de uma troca em andamento -- para a staff conferir
# sem participar. Mesmos slots da mesa de verdade.
Monitor:
  Titulo: '&8Monitorando {jogador} <-> {alvo}'
  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
    Material confirmado: LIME_STAINED_GLASS_PANE
    Barra aguardando: RED_STAINED_GLASS_PANE
    Barra confirmada: LIME_STAINED_GLASS_PANE
  Voltar:
    Slot: 52
    Material: RED_DYE
    Nome: '&cVoltar'
  Atualizar:
    Slot: 53
    Material: CLOCK
    Nome: '&eAtualizar'
