#  Menu de compra do item, aberto por /manterinv loja.
#
#  Substituicoes que valem no Titulo, no Nome e na Lore dos itens:
#    {quantidade}     - quantos itens o botao vende
#    {preco}          - preco total do botao
#    {preco_unitario} - preco de uma unidade (config.yml)
#    {saldo}          - quanto o jogador tem
#    {item}           - nome do item, sem cores
#
#  Acao aceita COMPRAR e FECHAR.
#
#  Use "Slots: [ 11, 12 ]" no lugar de "Slot" para repetir o botao.
#
#  "Versao do modelo" e o numero deste arquivo dentro do jar. Quando ele sobe
#  numa atualizacao, o plugin guarda o seu arquivo como loja-antigo-vX.yml e
#  escreve o modelo novo no lugar.

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

Versao do modelo: 1

Menu:
  Titulo: '&8Loja do Manter Inventario'
  Linhas: 3

  # Vidro de fundo nos slots vazios.
  Preenchimento:
    Ativar: true
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Itens:
    comprar-1:
      Slot: 11
      Acao: COMPRAR
      Quantidade da compra: 1
      Material: PRISMARINE_SHARD
      Nome: '&b&l1x &fManter Inventario'
      Lore:
        - ' '
        - '&7Preco: &a${preco}'
        - '&7Seu saldo: &f${saldo}'
        - ' '
        - '&eClique para comprar!'

    comprar-5:
      Slot: 13
      Acao: COMPRAR
      Quantidade da compra: 5
      Material: PRISMARINE_SHARD
      Quantidade: 5
      Nome: '&b&l5x &fManter Inventario'
      Lore:
        - ' '
        - '&7Preco: &a${preco}'
        - '&7Seu saldo: &f${saldo}'
        - ' '
        - '&eClique para comprar!'

    comprar-10:
      Slot: 15
      Acao: COMPRAR
      Quantidade da compra: 10
      Material: PRISMARINE_SHARD
      Quantidade: 10
      Nome: '&b&l10x &fManter Inventario'
      Lore:
        - ' '
        - '&7Preco: &a${preco}'
        - '&7Seu saldo: &f${saldo}'
        - ' '
        - '&eClique para comprar!'

    fechar:
      Slot: 22
      Acao: FECHAR
      Material: BARRIER
      Nome: '&c&lFechar'
      Lore:
        - '&7Fecha o menu.'
