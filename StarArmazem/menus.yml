# ------------------------------------------------------------------
#  Menus do StarArmazem
#
#  Cada botao: Slot, Material (ou Textura para cabeca), Nome, Lore e
#  Brilho. Slot: -1 esconde o botao sem apagar a configuracao dele.
#  O botao de fechar/voltar e o RED_DYE em todas as telas.
#
#  O painel da staff (/stararmazem) NAO e configuravel aqui de
#  proposito: se ele dependesse deste arquivo, um arquivo quebrado
#  tiraria a ferramenta que serve para consertar.
# ------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

Versao do modelo: 1

Armazem:
  Titulo: '&8Armazem &7- {terreno}'
  Linhas: 6
  # Onde as plantacoes aparecem (em ordem). O resto vira paginas.
  Slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  Enfeite:
    Ativar: true
    Material: 'BLACK_STAINED_GLASS_PANE'
    Nome: ' '
  # Como cada plantacao aparece. Sem 'Material', usa o proprio item.
  # Placeholders: {nome} {quantidade} {capacidade} {porcentagem} {barra}
  #   {precos} (uma linha por moeda) {total} {bolsa} {estado} {cliques}
  Plantacao:
    Nome: '{nome}'
    Lore:
      - '&7Guardado: &f{quantidade} &8/ &7{capacidade}'
      - '{barra} &7{porcentagem}%'
      - ''
      - '&7Preco por unidade:'
      - '{precos}'
      - '&7Vale agora: &a{total}'
      - '{bolsa}'
      - ''
      - '&7Recolhendo: {estado}'
      - ''
      - '{cliques}'
  Botoes:
    Informacoes:
      Slot: 4
      Material: 'BOOK'
      Nome: '&e&lARMAZEM'
      Lore:
        - '&7Dono: &f{dono}'
        - '&7Terreno: &f{terreno}'
        - ''
        - '&7Itens guardados: &f{itens}'
        - '&7Capacidade: &f{capacidade} {tipo_capacidade}'
        - '&7Nivel: &f{nivel}'
        - ''
        - '&7Seu limite de venda: &f{limite_venda}'
        - '&7Seu bonus: &a{bonus}%'
        - '{booster}'
        - ''
        - '&7Recolhendo: {estado}'
    VenderTudo:
      Slot: 46
      Textura: 'd883f946202bbdf25f8a1062e8c3317194333128207c89a474bde300c533dc3c'
      Nome: '&a&lVENDER TUDO'
      Lore:
        - '&7Vende tudo que voce pode'
        - '&7vender neste armazem.'
        - ''
        - '&7Vale agora: &a{total}'
        - ''
        - '&eClique para vender.'
    Depositar:
      Slot: 47
      Material: 'ENDER_CHEST'
      Nome: '&b&lDEPOSITAR'
      Lore:
        - '&7Coloque itens no armazem.'
        - ''
        - '&eClique esquerdo &7abre a tela de deposito.'
        - '&eClique direito &7guarda direto tudo do'
        - '&7seu inventario que for do armazem.'
    Recompensas:
      Slot: 48
      Material: 'CHEST'
      Nome: '&6&lRECOMPENSAS'
      Lore:
        - '&7Premios que sairam enquanto'
        - '&7o armazem trabalhava.'
        - ''
        - '&7Guardadas: &f{recompensas}'
        - ''
        - '&eClique para ver.'
    Fechar:
      Slot: 49
      Material: 'RED_DYE'
      Nome: '&c&lFECHAR'
      Lore: []
    Ligar:
      Slot: 50
      Material: 'LEVER'
      Nome: '&e&lRECOLHIMENTO'
      Lore:
        - '&7Liga e desliga o recolhimento'
        - '&7automatico deste armazem.'
        - ''
        - '&7Agora: {estado}'
        - ''
        - '&eClique para alternar.'
    AutoVenda:
      Slot: 51
      Material: 'GOLD_INGOT'
      Nome: '&6&lAUTO VENDA'
      Lore:
        - '&7Vende sozinho, de tempos em'
        - '&7tempos, enquanto o dono esta'
        - '&7no terreno.'
        - ''
        - '&7Agora: {estado}'
        - ''
        - '{permissao}'
    Melhorar:
      Slot: 52
      Material: 'ANVIL'
      Nome: '&d&lMELHORAR CAPACIDADE'
      Lore:
        - '&7Capacidade: &f{capacidade}'
        - '&7Nivel: &f{nivel}&7/&f{niveis}'
        - ''
        - '&7Proximo nivel: &a+{por_nivel}'
        - '&7Custa: &f{preco}'
        - ''
        - '&eClique para melhorar.'
    MelhorarNoTopo:
      Material: 'ANVIL'
      Nome: '&d&lCAPACIDADE MAXIMA'
      Lore:
        - '&7Capacidade: &f{capacidade}'
        - ''
        - '&aEste armazem ja esta no maximo.'
    Categorias:
      Slot: 0
      Material: 'COMPASS'
      Nome: '&e&lCATEGORIAS'
      Lore:
        - '&7Mostrando: &f{categoria}'
        - ''
        - '&eClique para escolher.'
    Historico:
      Slot: 8
      Material: 'WRITABLE_BOOK'
      Nome: '&e&lHISTORICO'
      Lore:
        - '&7As ultimas vendas'
        - '&7deste armazem.'
        - ''
        - '&eClique para ver.'
    Anterior:
      Slot: 45
      Material: 'ARROW'
      Nome: '&7Pagina anterior'
      Lore: []
    Proxima:
      Slot: 53
      Material: 'ARROW'
      Nome: '&7Proxima pagina'
      Lore: []
    Voltar:
      Slot: -1
      Material: 'RED_DYE'
      Nome: '&c&lVOLTAR'
      Lore: []

