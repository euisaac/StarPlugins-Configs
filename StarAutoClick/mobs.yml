# ==========================================================================
#  StarAutoClick - os mobs
#
#  Todos os mobs da 1.8 ate a 1.21 ja vem cadastrados. Mob que nao existe
#  na versao do seu servidor e pulado em silencio (o Tatu numa 1.8, por
#  exemplo). Apague o que nao quiser vender, ou ponha 'Ativo: false'.
#
#  Cada mob:
#    Ordem                  posicao no menu (menor primeiro)
#    Entidade               tipo do Bukkit; aceita o nome antigo e o novo
#                           (PIG_ZOMBIE ou ZOMBIFIED_PIGLIN, SNOWMAN ou SNOW_GOLEM)
#    Nome                   como aparece nas telas e mensagens
#    Categoria              texto livre para a lore ({categoria})
#    Textura                hash da cabeca (minecraft-heads) ou base64
#    Permissao              quem tem ataca sem comprar (vazio = ninguem)
#    Permissao para comprar exigida para comprar (vazio = todos podem)
#    XP                     XP vanilla por morte (config: XP.Dar XP vanilla)
#    mcMMO                  XP de mcMMO por morte, conforme a arma na mao
#    Precos                 lista; numero solto = moeda padrao, ou 'moeda:valor'
#    Ativo                  false esconde o mob sem apagar
#    Icone                  (opcional) troca o modelo do menus.yml so para
#                           este mob:
#                             Icone:
#                               Desbloqueado: {Material, Textura, Nome, Lore}
#                               Bloqueado:    {Material, Textura, Nome, Lore}
#
#  Sem 'Permissao', a permissao de liberar sem comprar e starautoclick.mob.<id>.
# ==========================================================================

