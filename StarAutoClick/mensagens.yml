# ==========================================================================
#  StarAutoClick - textos
#
#  Mensagem vazia ('') simplesmente nao e enviada: e assim que se desliga um
#  aviso sem precisar de uma opcao "Ativar" para cada um.
#  Cores: &a, &c, ... e hex no formato &#RRGGBB. Placeholders do
#  PlaceholderAPI funcionam em qualquer texto.
# ==========================================================================

Versao do modelo: 1

Prefixo: '&6&lAUTO-CLICK &8- &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  So jogador: '&cEste comando so funciona dentro do jogo.'
  Inativo: '&cO auto-click esta inativo (sem banco de dados). Avise a equipe.'
  Carregando: '&cSeus dados ainda estao carregando; tente de novo em instantes.'
  Jogador offline: '&cO jogador &f{jogador} &cnao esta online.'
  Numero invalido: '&cO numero &f{valor} &cnao vale.'
  Tempo invalido: '&cO tempo &f{valor} &cnao vale. Use 30s, 10m, 2h, 1d.'
  Mob invalido: '&cNao existe um mob chamado &f{mob}&c.'
  Comando desconhecido: '&cO subcomando &f{comando} &cnao existe. Use &f/autoclick ajuda&c.'
  Uso: '&cUse: &f{uso}'
  Recarregado: '&aConfiguracoes recarregadas.'

# Textos curtos usados nos menus e nos placeholders.
Etiquetas:
  Ligado: '&aLigado'
  Desligado: '&cDesligado'
  Infinito: '&bInfinito'
  Sem tempo: '&cEsgotado'
  Gratis: '&bLiberado por permissao'
  Comprado: '&aDesbloqueado'
  Bloqueado: '&cBloqueado'
  Mob ativo: '&aAtivo'
  Mob desativado: '&cDesativado'
  Clique para ativar: '&aClique para ativar'
  Clique para desativar: '&cClique para desativar'
  Separador de precos: '&7, '
  Sem preco: '&aGratis'
  Nenhum: '&7Nenhum'
  Alvos: '&e{alvos} alvos simultaneos'

Tempo:
  Dias: 'd'
  Horas: 'h'
  Minutos: 'm'
  Segundos: 's'

Alternar:
  Ligou: '&aVoce ligou o auto-click.'
  Desligou: '&cVoce desligou o auto-click.'
  Sem tempo: '&cVoce nao tem mais tempo de auto-click. Compre mais em &f/autoclick tempo&c.'
  Tempo acabou: '&cSeu tempo de auto-click acabou. O auto-click foi desligado.'
  Sem mobs: '&cVoce ainda nao desbloqueou nenhum mob. Veja &f/autoclick mobs&c.'
  Ligou titulo: ''
  Ligou subtitulo: ''
  Desligou titulo: ''
  Desligou subtitulo: ''
  Ligou actionbar: '&a&lAUTO-CLICK &aligado!'
  Desligou actionbar: '&c&lAUTO-CLICK &cdesligado!'

Motor:
  # Repetida enquanto o auto-click esta atacando (config: Clique.Aviso).
  Actionbar: '&6&lAUTO-CLICK &7» &fTempo restante: &e{tempo} &7» &fAlvos: &e{alvos}'
  Actionbar infinito: '&6&lAUTO-CLICK &7» &fTempo: &bInfinito &7» &fAlvos: &e{alvos}'
  Mundo bloqueado: '&cO auto-click nao funciona neste mundo.'
  Regiao bloqueada: '&cO auto-click nao funciona nesta regiao.'
  Fora do terreno: '&cO auto-click so funciona dentro do seu terreno.'
  Sem arma: '&cSegure uma arma para o auto-click atacar.'

Compra:
  Sem saldo: '&cVoce nao tem &f{moeda} &csuficiente. Falta: &f{falta}&c.'
  Sem permissao para comprar: '&cVoce nao tem permissao para comprar isto.'
  Moeda indisponivel: '&cA moeda &f{moeda} &cnao esta disponivel neste servidor. Avise a equipe.'
  Ja tem mob: '&cVoce ja desbloqueou este mob.'
  Mob comprado: '&aVoce desbloqueou o mob {mob}&a por &f{precos}&a.'
  Tempo comprado: '&aVoce comprou &f{tempo} &ade auto-click por &f{precos}&a. Agora voce tem &f{tempo_total}&a.'
  Tempo maximo: '&cVoce ja tem o maximo de tempo acumulado (&f{maximo}&c).'
  Alvos comprado: '&aAgora o seu auto-click atinge &f{alvos} &amobs por vez.'
  Alvos maximo: '&cVoce ja esta no maximo de alvos simultaneos.'
  Cancelada: '&cCompra cancelada.'

Mob:
  Ativado: '&aO mob {mob} &avoltou a ser atacado pelo auto-click.'
  Desativado: '&cO mob {mob} &cnao sera mais atacado pelo auto-click.'

Diario:
  Recebeu: '&aVoce recebeu &f{tempo} &ade auto-click gratis por hoje!'

Admin:
  Tempo dado: '&aVoce deu &f{tempo} &ade auto-click para &f{jogador}&a.'
  Tempo tirado: '&aVoce tirou &f{tempo} &ade auto-click de &f{jogador}&a.'
  Tempo definido: '&aO tempo de &f{jogador} &aagora e &f{tempo}&a.'
  Tempo recebido: '&aVoce recebeu &f{tempo} &ade auto-click.'
  Mob dado: '&aO mob {mob} &afoi liberado para &f{jogador}&a.'
  Mobs dados: '&aTodos os mobs foram liberados para &f{jogador}&a.'
  Mob tirado: '&aO mob {mob} &afoi removido de &f{jogador}&a.'
  Mobs tirados: '&aTodos os mobs foram removidos de &f{jogador}&a.'
  Mob recebido: '&aVoce recebeu o mob {mob}&a no auto-click.'
  Alvos definidos: '&aOs alvos simultaneos de &f{jogador} &aagora sao &f{alvos}&a.'
  Ligou: '&aVoce ligou o auto-click de &f{jogador}&a.'
  Desligou: '&aVoce desligou o auto-click de &f{jogador}&a.'
  Resetado: '&aOs dados de auto-click de &f{jogador} &aforam zerados.'
  Ver: |
    &6&l{jogador}
    &fStatus: {status}
    &fTempo: &e{tempo}
    &fAlvos simultaneos: &e{alvos}
    &fMobs desbloqueados: &e{mobs}&7/&e{mobs_total}
    &fMobs: &7{lista_mobs}
    &fMortes pelo auto-click: &e{mortes}
    &fTempo total usado: &e{tempo_usado}

Ajuda:
  Jogador: |

    &6&lAUTO-CLICK &7- &fComandos
    &e/autoclick &7- &fAbre o menu.
    &e/autoclick ligar|desligar &7- &fLiga ou desliga o auto-click.
    &e/autoclick mobs &7- &fAbre a tela de mobs.
    &e/autoclick tempo &7- &fAbre a loja de tempo.
    &e/autoclick alvos &7- &fEvolui os alvos simultaneos.

  Admin: |

    &6&lAUTO-CLICK &7- &fAdministracao
    &e/starautoclick recarregar &7- &fRecarrega os arquivos.
    &e/starautoclick tempo dar|tirar|definir <jogador> <tempo> &7- &fMexe no tempo.
    &e/starautoclick mob dar|tirar <jogador> <mob|todos> &7- &fLibera ou remove mobs.
    &e/starautoclick alvos <jogador> <n> &7- &fDefine os alvos simultaneos.
    &e/starautoclick ligar|desligar <jogador> &7- &fLiga ou desliga o auto-click de alguem.
    &e/starautoclick ver <jogador> &7- &fMostra os dados de alguem.
    &e/starautoclick resetar <jogador> &7- &fZera os dados de alguem.
    &e/starautoclick mobs &7- &fLista os ids dos mobs.
