# ============================================================================
#  StarRichPresence - modos de jogo
# ============================================================================
#
#  Cada modo diz O QUE aparece no Discord e QUANDO ele vale.
#
#  Como o plugin escolhe o modo do jogador:
#    1. modo forcado por /rp definir (ou por outro plugin, pela API);
#    2. entre os modos cujas "Condicoes" batem, o de MAIOR "Prioridade";
#    3. nenhum bateu -> o modo "Padrao".
#
#  Todo campo que um modo nao escrever e herdado do "Padrao". Entao basta
#  mudar o que for diferente.
#
#  ---------------------------------------------------------------------------
#  Condicoes (todas precisam bater; dentro de uma lista, basta um item):
#    Mundos:        [world, "slimefun_*"]         (* vale qualquer coisa)
#    Servidores:    [destiny]                     (compara com "Servidor" do config.yml)
#    Regioes:       [spawn, arena]                (WorldGuard 6 ou 7)
#    Areas:         ["mundo;-100,0,-100;100,256,100"]
#    Permissao:     "grupo.vip"
#    Modo de jogo:  [CREATIVE, SPECTATOR]
#    Em partida:    true                          (minigames da StarPlugins)
#    Jogos:         [StarBedWars, StarEggWars]    (qual minigame)
#    Placeholders:  ["%vault_group% == vip", "%player_level% >= 10"]
#                   operadores: ==  !=  >  <  >=  <=  contem
#  ---------------------------------------------------------------------------
#  Variaveis (valem em todos os textos, junto com o PlaceholderAPI):
#    {modo} {jogador} {mundo} {servidor} {servidor_nome} {online} {max}
#    Em partida: {jogo} {arena} {modo_partida} {mapa} {equipe}
#                {equipe_tamanho} {jogadores} {vivos} {id_partida}
#  ---------------------------------------------------------------------------
#  Onde cada campo aparece:
#    LabyMod ............ texto unico do modo (Discord e lista de amigos)
#    Lunar .............. Jogo / Variante / Estado do jogo / Estado do jogador
#                         / Mapa  +  Time (Atual/Maximo)
#    Feather ............ Discord.Detalhes (linha de cima)
#                         Discord.Estado (linha de baixo)
#                         Discord.Imagem + Texto da imagem  +  Time
#  Texto vazio = campo nao enviado. As cores sao removidas (o Discord nao
#  mostra cor).
# ============================================================================

Versao do modelo: 1

Modos:
  Padrao:
    Nome: "Lobby"
    Prioridade: 0
    LabyMod: "{modo}"
    Lunar:
      Jogo: "{modo}"
      Variante: ""
      Estado do jogo: ""
      Estado do jogador: "{online} online"
      Mapa: ""
    Discord:
      Detalhes: "Jogando {modo}"
      Estado: "{online}/{max} jogadores"
      Imagem: ""
      Texto da imagem: ""
    Time:
      Atual: ""
      Maximo: ""

  # Cada servidor da rede tem o proprio "Servidor:" no config.yml; o modo
  # vale pelo servidor em que o jogador esta.
  Survival:
    Nome: "&6&lSurvival"
    Prioridade: 10
    Condicoes:
      Servidores: [destiny]
    Lunar:
      Mapa: "{mundo}"

  Slimefun:
    Nome: "&2&lSlimefun"
    Prioridade: 10
    Condicoes:
      Servidores: [slimefun]

  Anarquia:
    Nome: "&c&lAnarquia"
    Prioridade: 10
    Condicoes:
      Servidores: [anarquia]

  # Qualquer minigame da StarPlugins que registre partidas no loader.
  Partida:
    Nome: "{jogo}"
    Prioridade: 100
    Condicoes:
      Em partida: true
    LabyMod: "{jogo} - {mapa}"
    Lunar:
      Jogo: "{jogo}"
      Variante: "{modo_partida}"
      Estado do jogo: "Em partida"
      Estado do jogador: "{vivos}/{jogadores} vivos"
      Mapa: "{mapa}"
    Discord:
      Detalhes: "Jogando {jogo} ({modo_partida})"
      Estado: "Mapa {mapa}"
    Time:
      Atual: "{equipe_tamanho}"
      Maximo: "{equipe_tamanho}"
