# ============================================================
#  StarAnuncios - o jogador aluga um horário e a mensagem dele
#  vai ao ar para o servidor inteiro, uma vez, naquela hora.
#
#  Alugar: /anuncios -> hora -> minuto -> digita a mensagem ->
#  vê a prévia -> confirma e paga. O dinheiro só sai na
#  confirmação; desistir ou sair do jogo não custa nada.
# ============================================================

debug: false

# Fuso dos horários (ex.: America/Sao_Paulo). Vazio = o do servidor.
# Servidor hospedado fora do Brasil costuma estar em UTC: 3h de diferença.
fuso-horario: ""

# Minutos de cada hora em que há vaga (cada um é um "slot").
# Ex.: [0, 30] = duas vagas por hora; [0, 15, 30, 45] = quatro. Até 9.
minutos: [0, 20, 40]

# Com menos que isto de antecedência, o horário de hoje vira o de amanhã.
antecedencia-minutos: 1

# Anúncios futuros por jogador. Por permissão: staranuncios.limite.<n>
limite-anuncios-por-jogador: 6

# Desconto por permissão: staranuncios.desconto.<porcentagem> (vale o maior).
# Ex.: staranuncios.desconto.20 = 20% mais barato.

# Palavra que o jogador digita no chat para desistir.
palavra-cancelar: "cancelar"

# Nome usado quando o console anuncia (/anuncios admin anunciar).
nome-do-console: "Servidor"

reserva:
  # Segundos para digitar a mensagem; a vaga fica segura nesse tempo.
  tempo-para-digitar: 90

mensagem:
  tamanho-minimo: 5
  tamanho-maximo: 120
  # Sem staranuncios.links, links e convites são recusados.
  bloquear-links: true
  # Sem staranuncios.cores, os códigos de cor (&a, &#RRGGBB) saem da mensagem.
  palavras-bloqueadas: []

cancelamento:
  # Quanto volta quando o próprio jogador cancela.
  reembolso-porcentagem: 50
  # Faltando menos que isto, não dá mais para editar nem cancelar.
  minutos-antes-bloqueia: 5

perdidos:
  # Anúncio que não foi ao ar (servidor desligado na hora) é devolvido.
  reembolsar: true
  # Minutos de atraso aceitos antes de considerar perdido.
  tolerancia-minutos: 3

menu-title: "&8Anúncios - Escolha uma Hora"
menu-size: 27

menus:
  escolher-slot: "&8Anúncios - {hour}h"
  confirmar: "&8Confirmar anúncio"
  meus: "&8Meus anúncios"
  gerenciar: "&8Gerenciar anúncio"
  sons: "&8Som do anúncio"
  admin: "&8Anúncios - Equipe"

items:
  available:
    material: "LIME_DYE"
    name: "&a{hour}h &7(livre)"
    lore:
      - ""
  rented:
    material: "YELLOW_DYE"
    name: "&e{hour}h &7(vagas sobrando)"
    lore:
      - ""
  unavailable:
    material: "RED_DYE"
    name: "&c{hour}h &7(cheio)"
    lore:
      - ""
  slot-livre: "&a● &f{horario} &aLivre"
  slot-alugado: "&c● &f{horario} &7{player}"
  slot-reservado: "&6● &f{horario} &6Reservado"
  lore-slots: "&7Vagas: &e{slots}/{total}"
  lore-preco: "&7Preço: &a$ {price}"

# Preço e posição no menu de cada hora. Hora fora da lista não é alugável.
