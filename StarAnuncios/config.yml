manager-item:
  slot: 26
  material: "BOOK"
  name: "&aMeus anúncios"
  lore:
    - "&7Editar, trocar o som ou cancelar"
    - "&7os anúncios que você agendou."

agenda-item:
  # -1 esconde o item.
  slot: 25
  material: "CLOCK"
  name: "&eAgenda de hoje"

admin-item:
  # Só aparece para quem tem staranuncios.admin.
  slot: 24

anuncio:
  # {player} = quem anunciou, {message} = a mensagem, {hora} = a hora.
  # Aceita PlaceholderAPI (do jogador que anunciou), ex.: %vault_prefix%.
  format:
    - ""
    - "&6&l[ANÚNCIO] &e{player} &7disse: &f{message}"
    - ""
  # Também mostrar no console.
  console: true
  sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
  # Sons que o jogador pode escolher em "Meus anúncios".
  sons:
    - "ENTITY_EXPERIENCE_ORB_PICKUP"
    - "BLOCK_NOTE_BLOCK_PLING"
    - "BLOCK_NOTE_BLOCK_BELL"
    - "ENTITY_PLAYER_LEVELUP"
    - "BLOCK_ANVIL_USE"
    - "ENTITY_VILLAGER_YES"
    - "UI_TOAST_CHALLENGE_COMPLETE"
    - "BLOCK_AMETHYST_BLOCK_CHIME"
  titulo:
    ativado: false
    titulo: "&6&lANÚNCIO"
    subtitulo: "&e{player}&7: &f{message}"
    entrada: 10
    fica: 60
    saida: 15
  actionbar:
    ativado: false
    texto: "&6Anúncio de &e{player}&7: &f{message}"
  bossbar:
    ativado: true
    texto: "&6Anúncio de &e{player}&7: &f{message}"
    # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    cor: "YELLOW"
    segundos: 15

auto-mensagem:
  enabled: true
  interval: 10 # em minutos
  # Várias mensagens vão em rodízio. Sem a lista, vale "mensagem".
  mensagens:
    - "&6&lANÚNCIOS &fUse &e/anuncios &fpara anunciar no servidor! Vagas limitadas por horário."
    - "&6&lANÚNCIOS &fVeja o que vai ao ar hoje com &e/anuncios agenda&f."
  mensagem: ""

