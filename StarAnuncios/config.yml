  - {horario: 5, valor: 5000, slot: 5}
  - {horario: 6, valor: 10000, slot: 6}
  - {horario: 7, valor: 10000, slot: 7}
  - {horario: 8, valor: 10000, slot: 8}
  - {horario: 9, valor: 10000, slot: 9}
  - {horario: 10, valor: 10000, slot: 10}
  - {horario: 11, valor: 10000, slot: 11}
  - {horario: 12, valor: 15000, slot: 12}
  - {horario: 13, valor: 15000, slot: 13}
  - {horario: 14, valor: 15000, slot: 14}
  - {horario: 15, valor: 15000, slot: 15}
  - {horario: 16, valor: 15000, slot: 16}
  - {horario: 17, valor: 15000, slot: 17}
  - {horario: 18, valor: 20000, slot: 18}
