# ==========================================================================
#  StarFloresta - mensagens
#
#  Mensagem vazia ('') não é enviada: é assim que se desliga um aviso.
#  {prefixo} põe o prefixo no meio do texto. Blocos com | são várias linhas.
#  Títulos: 'Título<nl>Subtítulo'.
# ==========================================================================

Versao do modelo: 1

Prefixo: '&2&lFLORESTA &8» &7'

Etiquetas:
  Dia: 'd'
  Hora: 'h'
  Minuto: 'min'
  Segundo: 's'

Geral:
  Sem permissao: '&cVocê não tem permissão para isso.'
  So jogador: '&cSó jogadores podem usar este comando.'
  Desligado: '&cA floresta está desligada (sem banco de dados). Avise a staff.'
  Carregando: '&7Seus dados ainda estão carregando, tente de novo em instantes.'
  Subcomando desconhecido: '&cComando desconhecido. Use &f/{comando} ajuda&c.'
  Jogador nunca jogou: '&cO jogador &f{jogador} &cnunca passou pela floresta.'
  Numero invalido: '&c"{valor}" não é uma quantidade válida.'

Floresta:
  Titulo ao entrar: '{floresta}<nl>&7Corte madeira e junte lenha!'
  Entrou: '&aVocê entrou na {floresta}&a. &7Seu machado está na mão!'
  Saiu: '&7Você saiu da {floresta}&7. Seu machado foi guardado.'
  Teleportado: ''
  Inventario cheio: '&cSeu inventário está cheio: libere um espaço para receber o machado.'
  Sem permissao: '&cVocê não tem acesso à {floresta}&c.'
  Machado minimo: '&cA {floresta} &cexige o {machado}&c. Evolua em &f/machado&c.'
  Indisponivel: '&cA {floresta} &cainda não está pronta. Avise a staff.'
  Nao esta: '&cVocê não está numa floresta.'
  Sem saida: ''
  Nao existe: '&cA floresta &f{floresta} &cnão existe.'
  Nenhuma: '&cA floresta ainda não foi aberta. Volte mais tarde!'
  Nenhuma staff: '&cNenhuma floresta criada. Use &f/florestaadmin gerar principal 25 &cpara gerar uma pronta.'
  Protegido: '&cAqui só se corta madeira.'
  Comando bloqueado: '&cEste comando não pode ser usado na floresta.'

Corte:
  Sem machado: '&cUse o seu &fmachado da floresta &cpara cortar.'
  Machado fraco: '&cSeu machado não corta &f{madeira}&c. Precisa do {machado}&c: &f/machado'
  Ninguem corta: '&cNenhum machado corta &f{madeira}&c.'
  Fora da floresta: '&cO machado da floresta só corta dentro da floresta.'
  Queimada: '&7Esta madeira está queimada. Volta em &f{tempo}&7.'
  # Barra de ação a cada corte. {lenha} (somada nos cortes seguidos)
  # {blocos} {madeira} {total} {booster}
  Ganho: '&a+{lenha} Lenha &8| &7{madeira} &8| &fTotal: {total}'
  Ganho com booster: '&a+{lenha} Lenha &6(Booster {booster}x) &8| &fTotal: {total}'

Machado:
  De graca: 'grátis'
  Maximo: '&aNível máximo!'
  No maximo: '&aSeu machado já está no nível máximo!'
  Sem permissao: '&cO {machado} &cnão está liberado para você.'
  Moeda indisponivel: '&cEste machado não pode ser comprado agora (economia &f{moeda}&c fora do ar). Avise a staff.'
  Sem saldo: '&cFalta &f{falta} &cpara evoluir. Custo: &f{custo}&c.'
  Falhou: '&cNão foi possível cobrar a evolução; nada foi tirado de você.'
  Evoluiu: '&aSeu machado evoluiu para {machado}&a!'
  Titulo ao evoluir: '&a&lMACHADO EVOLUÍDO<nl>{machado}'
  # Anunciado para todos quando alguém chega no ÚLTIMO machado ('' desliga).
  Anuncio: '{prefixo}&f{jogador} &7chegou ao {machado}&7!'
  Ja tem: '&7Você já tem este machado.'
  Evolua o anterior: '&cEvolua o machado anterior primeiro.'
  Nao solta: '&cO machado da floresta não pode ser jogado fora.'
  Nao guarda: '&cO machado da floresta não pode ser guardado aqui.'

Booster:
  Ligou: '{prefixo}&6&lBOOSTER! &eLenha &f{multiplicador}x &epor &f{tempo}&e. Corra para a &f/floresta&e!'
  Acabou: '&7O booster de lenha acabou.'
  Lembrete: '&6Booster de lenha &f{multiplicador}x &8| &7acaba em &f{tempo}'

Lenha:
  Saldo: '&7Sua lenha: &a{lenha} &8(já juntou {total})'
  Saldo de outro: '&7Lenha de &f{jogador}&7: &a{lenha} &8(já juntou {total})'
  Envio desligado: '&cO envio de lenha está desligado.'
  Uso enviar: '&cUse: &f/lenha enviar <jogador> <quantidade>'
  Abaixo do minimo: '&cO mínimo para enviar é &f{minimo}&c.'
  Para si mesmo: '&cVocê não pode enviar lenha para si mesmo.'
  Sem saldo: '&cVocê só tem &f{lenha} &clenha.'
  Falhou: '&cNão foi possível enviar agora; sua lenha foi devolvida.'
  Enviou: '&aVocê enviou &f{lenha} &alenha para &f{jogador}&a.'
  Recebeu: '&aVocê recebeu &f{lenha} &alenha de &f{jogador}&a.'

# /floresta info (variáveis do jogador: {lenha} {lenha_total} {cortes}
# {machado} {machado_nivel} {machado_niveis} {proximo_machado} {proximo_custo})
Info:
  Cabecalho: |-
    &8&m
    &2&lSUA FLORESTA
    &7Lenha: &a{lenha} &8(já juntou {lenha_total})
    &7Machado: {machado} &8({machado_nivel}/{machado_niveis})
    &7Madeiras cortadas: &f{cortes}
  # Uma linha por madeira. {madeira} {cortes} {lenha} (por bloco) {corta}
  Madeira: '&8▸ &f{madeira}&7: {cortes} &8({lenha} lenha) {corta}'
  Corta: '&a✔'
  Nao corta: '&c✘'
  Rodape: |-
    &7Próximo: {proximo_machado} &8- &f{proximo_custo}
    &8&m
  Rodape maximo: |-
    &aSeu machado está no nível máximo!
    &8&m

Ajuda:
  Cabecalho: '&8&m          &r &2&lFLORESTA &8&m          '
  # {comando} {uso} {descricao}
  Linha: '&a/{comando} {uso} &8- &7{descricao}'
  Rodape: ''

# Descrição de cada subcomando na ajuda (a lista vem do próprio plugin).
