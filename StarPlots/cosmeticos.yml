# ------------------------------------------------------------------------
#  StarPlots - os blocos que o dono compra para o terreno
#
#  Tres catalogos: Chao (o piso do terreno), Parede (a linha que contorna o
#  terreno, na altura do chao) e Borda (o que fica em cima da parede).
#
#  Cada item tem:
#    Nome        o que aparece no menu
#    Bloco       um material ou uma mistura com pesos (STONE,COBBLESTONE:30)
#    Preco       0 = gratis. O que e comprado fica desbloqueado para sempre
#                no perfil do jogador, e vale em qualquer terreno dele.
#    Permissao   '' = todo mundo
#    Icone       o material do icone ('' usa o primeiro bloco da mistura)
#
#  Alem do catalogo, o jogador pode usar o bloco da mao ou digitar a
#  propria mistura (ver "Permitir bloco da mao" no config.yml).
# ------------------------------------------------------------------------

