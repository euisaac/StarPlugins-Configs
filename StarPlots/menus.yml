# ------------------------------------------------------------------------
#  StarPlots - o desenho de TODAS as telas
#
#  Cada tela tem:
#
#    Titulo    o texto do topo ('' usa o do mensagens.yml)
#    Linhas    de 1 a 6 (cada linha tem 9 slots; eles comecam no 0)
#    Enfeite   o vidro que fecha os buracos
#    Slots     onde a lista aparece (so nas telas com lista)
#    Itens     os botoes
#    Modelos   como cada item da lista e escrito, por estado
#
#  Para TIRAR um botao, ponha  Slot: -1  (a configuracao dele fica guardada
#  aqui, esperando o dia em que voce quiser de volta).
#
#  Para POR UM BOTAO SEU em qualquer tela, escreva mais um item com
#  "Comandos" -- veja o exemplo "loja" no menu Principal.
#
#  Todo item aceita:
#    Slot        onde ele fica (-1 desliga)
#    Acao        o que o clique faz (a lista esta em cada tela)
#    Material    o icone ('' deixa o menu escolher: a cabeca do dono, o
#                icone do terreno, o bloco do catalogo...)
#    Nome        o nome do item
#    Lore        as linhas de baixo
#    Brilho      true da o brilho de encantado
#    Permissao   so quem tem ve o item ('' = todo mundo)
#    Comandos    lista de comandos rodados no clique
#    Fechar      true fecha o menu antes de rodar os comandos
#
#  Os comandos aceitam prefixos:
#    jogador: loja          console: give {jogador} diamond 1
#    op: gamemode creative  mensagem: &aOi!
#    som: ENTITY_PLAYER_LEVELUP    titulo: &aTitulo<nl>&7Subtitulo
#    link: seusite.com.br          espera: 20
#
#  Trocas de terreno (valem em toda tela que mostra um terreno):
#    {terreno} {nome} {id} {x} {z} {mundo} {dono} {descricao} {status}
#    {numero} {membros} {negados} {media} {estrelas} {notas} {visitas}
#    {preco} {aluguel} {locatario} {aluguel_restante} {bioma} {mesclas}
#    {grupo} {voo} {visitas_abertas} {criado} {cargo} {jogador} {favorito}
#    {chao} {parede} {borda}
#
#  Tudo isto tambem pode ser editado por menu: /starplots config
# ------------------------------------------------------------------------

