# ------------------------------------------------------------------------
#  StarPlots - os modelos de terreno
#
#  Um modelo e um terreno inteiro guardado em arquivo (pasta modelos/, no
#  formato proprio do plugin, que abre em qualquer versao e nao precisa de
#  WorldEdit).
#
#  Para criar um: construa num terreno e use
#    /terrenoadmin modelo salvar <nome>
#  O plugin grava o arquivo e escreve a secao aqui. Depois ajuste o nome, o
#  icone, o preco e a permissao.
#
#  O jogador aplica pelo painel do terreno (Modelos): o terreno e limpo e
#  o modelo entra centralizado, com o chao dele no chao do terreno. Um
#  modelo maior que o terreno e recusado.
#
#  Na Descricao, cada linha vira uma linha da lore do item no menu.
#
#  Exemplo (o arquivo modelos/casa-simples.terreno precisa existir):
#
#  Modelos:
#    casa-simples:
#      Nome: '&eCasa simples'
#      Icone: OAK_DOOR
#      Preco: 2500
#      Permissao: ''
#      Descricao:
#        - '&7Uma casa de madeira pronta,'
#        - '&7com bau e cama.'
# ------------------------------------------------------------------------

Versao do modelo: 1

Modelos: {}
