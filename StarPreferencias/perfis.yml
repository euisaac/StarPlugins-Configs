# StarPreferencias - perfis prontos
#
# Um perfil liga/desliga varias preferencias de uma vez (/preferencias perfil
# <nome> ou pelo botao "Perfis" no menu principal). O que nao estiver listado
# em "definir" fica como o jogador ja tinha.

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

Versao do modelo: 1

perfis:
  social:
    nome: '&aModo Social'
    material: 'LIME_DYE'
    lore:
      - '&7Liga chat, convites e'
      - '&7todos os avisos.'
    definir:
      chat-global: true
      chat-local: true
      convite-cla: true
      convite-casamento: true
      anuncio-mercado: true
      anuncio-leilao: true
      aviso-torneio: true
      aviso-evento: true
      aviso-calendario: true
      aviso-passe: true
      aviso-aniversario: true

  focado:
    nome: '&eModo Focado'
    material: 'BOOK'
    lore:
      - '&7Desliga chat e avisos.'
      - '&7PvP e mensagens continuam.'
    definir:
      chat-global: false
      chat-local: false
      anuncio-mercado: false
      anuncio-leilao: false
      aviso-torneio: false
      aviso-evento: false
      aviso-calendario: false
      aviso-passe: false
      aviso-aniversario: false

  pvp-puro:
    nome: '&cModo PvP'
    material: 'DIAMOND_SWORD'
    lore:
      - '&7So o PvP fica ligado,'
      - '&7o resto e desligado.'
    definir:
      pvp: true
      teleporte: false
      mensagens-privadas: false
      pagamentos: false
      convite-cla: false
      convite-casamento: false
      chat-global: false
      chat-local: false
      anuncio-mercado: false
      anuncio-leilao: false
      cosmeticos-outros: false
      flutuantes-outros: false
      brilho-outros: false
      aviso-torneio: false
      aviso-evento: false
      aviso-calendario: false
      aviso-passe: false
      aviso-aniversario: false

  performance:
    nome: '&bModo Performance'
    material: 'REDSTONE'
    lore:
      - '&7Desliga efeitos visuais de'
      - '&7outros jogadores no seu cliente.'
    definir:
      cosmeticos-outros: false
      flutuantes-outros: false
      brilho-outros: false
