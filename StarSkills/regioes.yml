# Regioes do WorldGuard onde as skills ficam DESLIGADAS: dentro delas nenhuma
# skill ganha XP e nenhuma habilidade funciona.
#
# Use o id da regiao (o mesmo do /rg list). So o id vale em qualquer mundo;
# 'mundo:regiao' vale so naquele mundo. Vale a regiao inteira: se o jogador
# esta dentro de uma regiao da lista (mesmo que tambem esteja em outra), as skills param ali.
#
# Tambem da para mexer pelo jogo (permissao starskills.admin):
#   /starskills regiao desativar [regiao]   desliga as skills na regiao
#   /starskills regiao ativar <regiao>      liga de novo
#   /starskills regiao lista                mostra a lista e as regioes onde voce esta
#
# Sem o WorldGuard instalado, esta lista nao faz nada.
Regioes desativadas: []
