# ==========================================================================
#  StarSkills - skill: Escavacao
#
#  XP:            o que rende XP nesta skill (nome do XSeries do bloco/item ou
#                 da entidade -> XP). Aceita curinga: *_ORE, OAK_*, *.
#  Habilidades:   como cada habilidade cresce com o nivel.
#    Passiva:  Maximo (chance/bonus no teto) e Nivel para o maximo (onde
#              chega la; antes disso cresce em linha reta a partir do zero).
#              Nivel para desbloquear: antes dele a habilidade nao existe.
#    Ativa:    Duracao base (s) + 1s a cada 'Bonus de duracao a cada niveis'
#              niveis, ate Duracao maxima; Cooldown (s) depois que acaba.
#  Extras:        os ajustes finos de cada habilidade.
#
#  O nome, a descricao e os textos ficam no idioma (idiomas/<idioma>.yml).
# ==========================================================================

Ativar: true
# Material do icone no menu.
Icone: DIAMOND_SHOVEL
# Teto de nivel so desta skill; 0 usa o "Niveis.Nivel maximo" do config.
Nivel maximo: 0
# Multiplica todo XP desta skill.
Multiplicador de XP: 1.0

# Blocos que rendem XP com a pa (bloco colocado por jogador nao conta).
XP:
  DIRT: 40
  COARSE_DIRT: 40
  ROOTED_DIRT: 50
  GRASS_BLOCK: 40
  PODZOL: 60
  MYCELIUM: 80
  DIRT_PATH: 40
  FARMLAND: 40
  SAND: 40
  RED_SAND: 40
  GRAVEL: 40
  CLAY: 80
  SNOW_BLOCK: 20
  SNOW: 10
  SOUL_SAND: 80
  SOUL_SOIL: 80
  MUD: 60
  MUDDY_MANGROVE_ROOTS: 60
  POWDER_SNOW: 20

Habilidades:
  # Cava instantaneo e rola o tesouro varias vezes por bloco.
  giga_broca:
    Ativar: true
    Nivel para desbloquear: 0
    Duracao base: 2
    Bonus de duracao a cada niveis: 50
    Duracao maxima: 30
    Cooldown: 240
  # Chance de desenterrar um tesouro ao cavar.
  caca_tesouros:
    Ativar: true
    Nivel para desbloquear: 0
    Maximo: 15
    Nivel para o maximo: 1000

Extras:
  Giga broca:
    # Quantas vezes o tesouro e sorteado por bloco enquanto ligada.
    Rolagens de tesouro: 3
  Som ao achar tesouro: 'ENTITY_EXPERIENCE_ORB_PICKUP;1;1.5'
  # Os tesouros: Item, Quantidade, Peso, Nivel (minimo), XP (bonus) e Blocos
  # (de quais blocos ele sai; sem a lista, de qualquer um).
  Tesouros:
    tijolo_argila:
      Item: CLAY_BALL
      Quantidade: 1
      Peso: 30
      Nivel: 0
      XP: 40
      Blocos: [ DIRT, GRASS_BLOCK, CLAY, MUD ]
    graveto:
      Item: STICK
      Quantidade: 2
      Peso: 30
      Nivel: 0
      XP: 20
    osso:
      Item: BONE
      Quantidade: 1
      Peso: 20
      Nivel: 50
      XP: 60
    silex:
      Item: FLINT
      Quantidade: 1
      Peso: 25
      Nivel: 50
      XP: 40
      Blocos: [ GRAVEL ]
    cogumelo:
      Item: RED_MUSHROOM
      Quantidade: 1
      Peso: 15
      Nivel: 100
      XP: 80
      Blocos: [ DIRT, GRASS_BLOCK, MYCELIUM, PODZOL ]
    bola_de_neve:
      Item: SNOWBALL
      Quantidade: 4
      Peso: 20
      Nivel: 0
      XP: 20
      Blocos: [ SNOW_BLOCK, SNOW, POWDER_SNOW ]
    polvora:
