      Nome: '&c&lVOLTAR'
      Acoes:
        - 'voltar'
    anterior:
      Slot: 48
      Material: PAPER
      Nome: '&e&lPÁGINA ANTERIOR'
      Acoes:
        - 'anterior'
    proxima:
      Slot: 50
      Material: PAPER
      Nome: '&e&lPRÓXIMA PÁGINA'
      Acoes:
        - 'proxima'

