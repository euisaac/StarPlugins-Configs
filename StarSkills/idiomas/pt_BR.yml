# ==========================================================================
#  StarSkills - idioma: Português (Brasil)
#
#  Tudo que o jogador lê sai daqui: mensagens, nomes e descrições das skills,
#  das habilidades e das categorias. Para outro idioma, copie este arquivo
#  com outro nome (ex.: es_ES.yml), traduza e aponte em Idioma no config.yml.
#  Chave que faltar num idioma cai no pt_BR do jar.
#
#  Mensagem vazia ('') simplesmente não é enviada: é assim que se desliga um
#  aviso sem precisar de uma opção "Ativar" para cada um.
#  Cores: &a, &c, ... e hex no formato &#RRGGBB.
# ==========================================================================

Versao do modelo: 1

Prefixo: '&6&lSKILLS &8- &7'

Geral:
  Sem permissao: '&cVocê não tem permissão para isso.'
  So jogador: '&cEste comando só funciona dentro do jogo.'
  Inativo: '&cO plugin de skills está inativo (sem banco de dados). Avise a equipe.'
  Jogador nao encontrado: '&cO jogador &f{jogador} &cnunca entrou neste servidor.'
  Carregando: '&cSuas skills ainda estão carregando; tente de novo em instantes.'
  Numero invalido: '&cO número &f{valor} &cnão vale.'
  Tempo invalido: '&cO tempo &f{valor} &cnão vale. Use 30m, 2h, 1d ou permanente.'
  Skill invalida: '&cNão existe uma skill chamada &f{skill}&c. Veja &f/skills lista&c.'
  Comando desconhecido: '&cO subcomando &f{comando} &cnão existe. Use &f/skills ajuda&c.'
  Uso: '&cUse: &f{uso}'

# Textos curtos usados nos menus, nas listagens e nos placeholders.
Etiquetas:
  Sim: '&aSim'
  Nao: '&cNão'
  Sem posicao: '&7--'
  Ninguem: '&7Ninguém'
  Nenhuma: '&7Nenhuma'
  Sem limite: '&7sem limite'
  Maximo: '&6MÁX'
  Estrela: '&6✫'
  # Quando o prestígio passa de 5, as estrelas viram isto.
  Estrelas resumidas: '{estrela}&6x{prestigio}'
  Separador de lista: '&7, '
  Liberada: '&aLiberada'
  Bloqueada: '&cBloqueada'
  Libera no nivel: '&cLibera no nível {nivel}'
  Desligada: '&8Desligada no servidor'
  Ligada: '&a&lLIGADA &7({tempo})'
  Em recarga: '&cRecarga: {tempo}'
  Pronta: '&aPronta para usar'
  Ativa: '&dAtiva'
  Passiva: '&bPassiva'
  Todas: '&fTodas'
  Poder: '&6Poder'
  Permanente: '&apermanente'
  Sem impulso: '&7sem impulso'
  Ligado: '&aLigado'
  Desligado: '&cDesligado'
  Sem nome: '&7sem nome'

# A linha de "valor atual" de cada habilidade no menu, por formato. Uma
# habilidade pode ter a própria em Habilidades.<id>.Detalhe.
Formatos:
  CHANCE: '&fChance: &a{valor} &7(máx. {maximo} no nível {nivel_maximo})'
  BONUS_PORCENTAGEM: '&fBônus: &a{valor} &7(máx. {maximo} no nível {nivel_maximo})'
  BONUS_FIXO: '&fBônus: &a{valor} &7(máx. {maximo} no nível {nivel_maximo})'
  DURACAO: '&fDuração: &a{duracao}s &7(máx. {duracao_maxima}s) &8| &fRecarga: &c{cooldown}'
  DESBLOQUEIO: '&fLibera no nível: &a{desbloqueio}'

Tempo:
  Dias: 'd'
  Horas: 'h'
  Minutos: 'm'
  Segundos: 's'

Categorias:
  COLETA: '&aColeta'
  COMBATE: '&cCombate'
  OFICIO: '&eOfício'
  AVENTURA: '&bAventura'

Ferramentas:
  PICARETA: 'picareta'
  PA: 'pá'
  MACHADO: 'machado'
  ENXADA: 'enxada'
  VARA: 'vara de pescar'
  ESPADA: 'espada'
  ARCO: 'arco'
  MAO_VAZIA: 'punhos'
  NENHUMA: 'ferramenta'

Bichos:
  LOBO: 'um lobo'
  GATO: 'um gato'
  CAVALO: 'um cavalo'

# ---------------------------------------------------------------------------
#  Ganho de XP. {skill} {xp} {nivel} {atual} {necessario} {porcentagem} {barra}
# ---------------------------------------------------------------------------
XP:
  Chat: '&a+{xp} XP &7em &f{skill} &7({porcentagem}%)'
  Actionbar: '&a+{xp} XP &8| &f{skill} &7Nv. {nivel} &8[{barra}&8] &7{porcentagem}%'
  Barra de chefe: '&f{skill} &7Nv. &e{nivel} &8| &a+{xp} XP &8| &7{atual}/{necessario}'

Nivel:
  Subiu: '&aVocê subiu para o nível &e{nivel} &aem &e{skill}&a! &7(poder: {poder})'
  Maximo: '&6Você chegou ao &lNÍVEL MÁXIMO &6de &e{skill}&6! Veja o prestígio no menu.'
  Recompensa: '&aVocê recebeu as recompensas do nível &e{nivel}&a!'
  Anuncio: '&e{jogador} &fchegou ao nível &e{nivel} &fem &e{skill}&f!'
  Anuncio maximo: '&6&l✫ &e{jogador} &fchegou ao &6&lNÍVEL MÁXIMO &fem &e{skill}&f!'
  Desbloqueou: '&d&l+ &fVocê desbloqueou &d{habilidade} &fem &e{skill}&f!'

Prestigio:
  Feito: '&6&l✫ &fVocê prestigiou &e{skill}&f! Prestígio &6{prestigio} &7(+{bonus}% de XP para sempre).'
  Anuncio: '&6&l✫ &e{jogador} &fprestigiou &e{skill} &fpela &6{prestigio}ª &fvez!'
  DESLIGADO: '&cO prestígio está desligado neste servidor.'
  SEM_TETO: '&cEsta skill não tem nível máximo, então não dá para prestigiar.'
  NIVEL_INSUFICIENTE: '&cVocê precisa chegar ao nível máximo de &f{skill} &cpara prestigiar.'
  MAXIMO: '&cVocê já está no prestígio máximo de &f{skill}&c.'
  SEM_DINHEIRO: '&cPrestigiar custa &f{custo} &ce você não tem esse valor.'
  SEM_PERMISSAO: '&cVocê não tem permissão para prestigiar.'
  PODE: ''

Impulso:
  Anuncio: '&d&l⚡ &fImpulso de XP ligado: &d+{porcentagem}% &fem &d{skill} &fpor &d{tempo}&f!'
  Acabou: '&d&l⚡ &fO impulso de XP acabou.'

# ---------------------------------------------------------------------------
#  Avisos das habilidades ativas e passivas.
# ---------------------------------------------------------------------------
Avisos:
  Preparou: '&7Você preparou sua &f{ferramenta}&7... &8({tempo}s)'
  Preparo acabou: '&7Você baixou a &f{ferramenta}&7.'
  Ativou: '&d&l» &d{habilidade} &fLIGADA por &d{duracao}s&f!'
  Ativou perto: '&d{jogador} &7usou &d{habilidade}&7!'
  Acabou: '&7{habilidade} &7acabou.'
  Em recarga: '&c{habilidade} &cestá em recarga: &f{tempo}&c.'
  Pronta: '&a{habilidade} &aestá pronta de novo!'
  Ferramenta quebrou: '&cSua ferramenta quebrou no meio do serviço!'
  Mao firme: '&a&l+ &7Mão firme: o bloco não foi gasto.'
  Faro de minerio: '&b&l+ &7Faro de minério: você achou &f{item} &7x{quantidade}!'
  Caca tesouros: '&e&l+ &7Tesouro! Você desenterrou &f{item} &7x{quantidade}.'
  Tesouro do mar: '&b&l+ &7Tesouro do mar! Você fisgou &f{item} &7x{quantidade}.'
  Sacudir: '&b&l+ &7Você sacudiu o bicho e caiu &f{item}&7.'
  Pesca no gelo: '&bVocê abriu um buraco no gelo para pescar.'
  Sangrando: '&c&l✖ &cVocê está sangrando!'
  Parou de sangrar: '&aVocê parou de sangrar.'
  Sangramento aplicado: '&c&l✖ &7Inimigo sangrando!'
  Golpe critico: '&c&l✖ &7GOLPE CRÍTICO!'
  Desarmado: '&cVocê foi desarmado!'
  Desarmou: '&aVocê desarmou &f{jogador}&a!'
  Desarme falhou: '&7O inimigo segurou a arma com punhos de aço.'
  Punhos de aco: '&aSeus punhos de aço seguraram a arma!'
  Atordoado: '&cVocê foi atordoado por uma flecha!'
  Atordoou: '&e&l+ &7Você atordoou o alvo!'
  Desviou flecha: '&a&l+ &7Você desviou a flecha!'
  Esquivou: '&a&l+ &7Você esquivou de metade do golpe!'
  Contra ataque: '&a&l+ &7Contra-ataque!'
  Contra atacado: '&cVocê foi contra-atacado!'
  Rolamento: '&a&l+ &7Você rolou e amorteceu a queda.'
  Rolamento perfeito: '&a&l+ &7ROLAMENTO PERFEITO! Quase nada de dano.'
  Chamado: '&aVocê chamou {bicho} da natureza!'
  Chamado bloqueado: '&cO Chamado da Natureza libera no nível &f{nivel} &cde Domar.'
  Chamado sem itens: '&cVocê precisa de &f{quantidade}x {item} &cna mão para chamar.'
  Chamado demais: '&cVocê já tem &f{maximo} &cbichos deste tipo por perto.'
  Conhecimento animal: '&e&l✎ &f{tipo} &7de &f{dono} &8| &fNome: &7{nome} &8| &fVida: &a{vida}&7/&a{vida_maxima}'
  Ingrediente poupado: '&a&l+ &7Ingrediente poupado!'
  Sorte arcana: '&d&l+ &7Sorte arcana: XP em dobro!'
  Reembolso arcano: '&d&l+ &7Reembolso arcano: &f{niveis} &7nível(is) de volta!'
  Cartografo: '&b&l+ &7Bioma novo no mapa: &f{bioma}&7.'

Reparo:
  Intacto: '&cEste item não precisa de reparo.'
  Nao reparavel: '&cEste item não pode ser reparado aqui.'
  Nivel insuficiente: '&cVocê precisa do nível &f{nivel} &cde Reparo para reparar este item.'
  Sem material: '&cVocê precisa de &f{material} &cno inventário para reparar.'
  Feito: '&aVocê reparou &f{item} &7(+{restaurado} pontos, agora em {porcentagem}%)&a.'
  Encantamentos mantidos: '&d&l✔ &7Reparo arcano: os encantamentos foram mantidos!'
  Encantamentos rebaixados: '&e&l! &7Os encantamentos foram rebaixados no reparo.'
  Encantamentos parcialmente: '&e&l! &7Alguns encantamentos se perderam e outros foram rebaixados.'
  Encantamentos perdidos: '&c&l✖ &7Os encantamentos se perderam no reparo.'

Reciclagem:
  Nao reciclavel: '&cEste item não pode ser reciclado aqui.'
  Um por vez: '&cRecicle um item de cada vez.'
  So inteiro: '&cSó itens sem desgaste podem ser reciclados.'
  Nada: '&cEste item está gasto demais para render alguma coisa.'
  Feita: '&aVocê reciclou &f{item} &ae recebeu &f{quantidade}x {material}&a.'
  Livro: '&d&l✔ &7Reciclagem arcana: os encantamentos foram para um livro!'
  Encantamentos perdidos: '&c&l✖ &7Os encantamentos se perderam na reciclagem.'

Top:
  Carregando: '&7Carregando o ranking...'

Configuracoes:
  XP ligado: '&aAvisos de XP ligados.'
  XP desligado: '&cAvisos de XP desligados.'
  Habilidades ligado: '&aAvisos de habilidades ligados.'
  Habilidades desligado: '&cAvisos de habilidades desligados.'
  Barra ligada: '&aBarra de progresso ligada.'
  Barra desligada: '&cBarra de progresso desligada.'

Lista:
  Cabecalho: '&6&lSKILLS &fde &e{jogador} &7(poder {poder})'
  Linha: ' &8- &f{skill} &7Nv. &e{nivel} &8({xp}/{necessario} XP) {estrelas}'
  Rodape: ''

Info:
  Cabecalho: '&6&l{skill} &7(você: nível {nivel})'
  Habilidade: ' &8- &f{habilidade} &8[{tipo}&8] &7{estado} &8| &7{valor}'

Ajuda:
  Jogador: |-
    &6&lSKILLS &8- &fComandos
     &e/skills &7- abre o menu
     &e/skills <skill> &7- abre uma skill (ex.: /skills mineracao)
     &e/skills top [skill] &7- o ranking de poder ou de uma skill
     &e/skills ativas &7- suas habilidades ativas e recargas
     &e/skills config &7- seus avisos e barra
     &e/skills lista &7- seus níveis no chat
     &e/skills info <skill> &7- as habilidades de uma skill no chat
     &7Clique direito com a ferramenta prepara a habilidade ativa dela.
  Admin: |-
    &6&lSTARSKILLS &8- &fAdministração
     &e/starskills recarregar
     &e/starskills nivel <setar|dar|tirar> <jogador> <skill|todas> <n>
     &e/starskills xp <dar|setar|tirar> <jogador> <skill> <n>
     &e/starskills prestigio setar <jogador> <skill> <n>
     &e/starskills resetar <jogador> [skill]
     &e/starskills impulso <porcentagem> <tempo|permanente> [skill]
     &e/starskills impulso parar
     &e/starskills ver <jogador>
     &e/starskills info

Admin:
  Recarregado: '&aStarSkills recarregado.'
  Info: |-
    &6&lSTARSKILLS &f{versao}
     &fSkills ligadas: &e{skills} &8| &fBanco: &e{banco} &8| &fIdioma: &e{idioma}
     &fFórmula: &e{formula} &8| &fImpulso: &e{impulso} &8| &fJogadores em memória: &e{online}
  Impulso ligado: '&aImpulso de &f+{porcentagem}% &aligado em &f{skill} &apor &f{tempo}&a.'
  Impulso parado: '&aImpulso desligado.'
  Nivel ajustado: '&aNível de &f{jogador} &aem &f{skill} &aajustado (&f{valor}&a).'
  XP ajustado: '&aXP de &f{jogador} &aem &f{skill} &aajustado (&f{valor}&a).'
  Prestigio ajustado: '&aPrestígio de &f{jogador} &aem &f{skill} &aagora é &f{valor}&a.'
  Resetado: '&aAs skills de &f{jogador} &a(&f{skill}&a) foram zeradas.'
  Aviso ao jogador: '&eSuas skills foram ajustadas por um administrador.'

