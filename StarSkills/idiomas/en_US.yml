# ==========================================================================
#  StarSkills - language: English (US)
#
#  Everything the player reads comes from here: messages, skill, ability and
#  category names and descriptions. To add another language, copy this file
#  under a new name (e.g. es_ES.yml), translate it and set Idioma in
#  config.yml. Any key missing from a language falls back to pt_BR.
#
#  An empty message ('') is simply not sent.
#  Colors: &a, &c, ... and hex as &#RRGGBB.
# ==========================================================================

