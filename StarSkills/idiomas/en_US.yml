  Habilidade: ' &8- &f{habilidade} &8[{tipo}&8] &7{estado} &8| &7{valor}'

Ajuda:
  Jogador: |-
    &6&lSKILLS &8- &fCommands
     &e/skills &7- opens the menu
     &e/skills <skill> &7- opens a skill (e.g. /skills mining)
     &e/skills top [skill] &7- the power or skill leaderboard
     &e/skills ativas &7- your active abilities and cooldowns
     &e/skills config &7- your notifications and bar
     &e/skills lista &7- your levels in chat
     &e/skills info <skill> &7- a skill's abilities in chat
     &7Right-click with the tool to ready its active ability.
  Admin: |-
    &6&lSTARSKILLS &8- &fAdministration
     &e/starskills recarregar
     &e/starskills nivel <setar|dar|tirar> <player> <skill|todas> <n>
     &e/starskills xp <dar|setar|tirar> <player> <skill> <n>
     &e/starskills prestigio setar <player> <skill> <n>
     &e/starskills resetar <player> [skill]
     &e/starskills impulso <percent> <time|permanente> [skill]
     &e/starskills impulso parar
     &e/starskills ver <player>
     &e/starskills info

Admin:
  Recarregado: '&aStarSkills reloaded.'
  Info: |-
    &6&lSTARSKILLS &f{versao}
     &fEnabled skills: &e{skills} &8| &fDatabase: &e{banco} &8| &fLanguage: &e{idioma}
     &fFormula: &e{formula} &8| &fBoost: &e{impulso} &8| &fPlayers in memory: &e{online}
  Impulso ligado: '&aBoost of &f+{porcentagem}% &aenabled in &f{skill} &afor &f{tempo}&a.'
  Impulso parado: '&aBoost disabled.'
  Nivel ajustado: '&aLevel of &f{jogador} &ain &f{skill} &aadjusted (&f{valor}&a).'
  XP ajustado: '&aXP of &f{jogador} &ain &f{skill} &aadjusted (&f{valor}&a).'
