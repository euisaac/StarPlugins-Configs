# ==========================================================================
#  StarCaixas - nomes dos comandos
#
#  Aqui voce troca o nome dos comandos e acrescenta apelidos, sem mexer no
#  jar. Separe com | -- o primeiro e o nome principal e o resto vira apelido.
#
#  Os nomes que ja vem no plugin (/caixas e /starcaixas, com os apelidos
#  deles) continuam funcionando de qualquer jeito. Deixe uma linha vazia para
#  nao registrar nada a mais.
#
#  Exemplo: comandos.caixas: 'caixas|cx|baus'
# ==========================================================================

Versao do modelo: 1

comandos:
  caixas: ''
  starcaixas: ''
