# ==========================================================================
#  StarCaixas - textos
#
#  Mensagem vazia ('') simplesmente nao e enviada: e assim que se desliga um
#  aviso sem precisar de uma opcao "Ativar" para cada um.
#
#  Use <nl> para separar titulo e subtitulo nas mensagens de titulo.
# ==========================================================================

Versao do modelo: 1

Prefixo: '&6&lCAIXAS &8» &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  Carregando: '&cSeus dados ainda estao carregando; tente de novo em instantes.'
  So jogador: '&cEste comando so funciona dentro do jogo.'
  Jogador offline: '&cO jogador &f{jogador} &cnao esta online.'
  Jogador desconhecido: '&cNunca vi o jogador &f{jogador} &cpor aqui.'
  Erro no banco: '&cNao foi possivel falar com o banco de dados; olhe o console.'

Caixa:
  Nao existe: '&cA caixa &f{caixa} &cnao existe.'
  Sem permissao: '&cVoce nao tem acesso a caixa &f{caixa}&c.'
  Sem chave: '&cVoce nao tem chave para a caixa &f{caixa}&c.'
  Em recarga: '&cEspere &f{tempo} &cpara abrir a caixa &f{caixa} &cde novo.'
  Sem recompensa: '&cNao ha nenhuma recompensa disponivel para voce nesta caixa.'
  Sem pre-visualizacao: '&cA caixa &f{caixa} &cnao mostra as recompensas.'
  Dada: '&aVoce deu &f{quantidade}x {caixa} &apara &f{jogador}&a.'
  Aberta para: '&aA caixa &f{caixa} &afoi aberta para &f{jogador}&a.'
  Nao abriu: '&cNao foi possivel abrir a caixa &f{caixa} &cpara &f{jogador}&c.'
  # Usadas dentro das lores; sao pedacos de texto, nao mensagens de chat.
  Sem recarga: '&aliberada'
  Livre: '&aliberada'
  Sem limite: '&asem limite'

Abertura:
  Ja esta abrindo: '&cTermine a abertura que ja esta em andamento.'
  Caixa ocupada: '&cAlguem ja esta abrindo esta caixa; espere a vez.'
  Longe demais: '&cChegue mais perto da caixa para abri-la.'
  Inventario cheio: '&cSeu inventario esta cheio; abra espaco antes.'
  Premio recebido: '&aVoce tirou &f{premio} &ada caixa &f{caixa}&a!'
  Marco alcancado: '&6Voce chegou a &f{aberturas} &6aberturas de &f{caixa} &6e ganhou &f{marco}&6!'
  Pendentes entregues: '&aVoce recebeu &f{quantidade} &apremio(s) que tinham ficado para tras.'

Anuncio:
  # Enviada para o servidor inteiro. Vazia desliga o anuncio.
  Premio: '&6{jogador} &7tirou &f{premio} &7da caixa &f{caixa}&7!'

Chave:
  Recebida: '&aVoce recebeu &f{quantidade} &achave(s) de &f{caixa}&a.'
  Perdida: '&cVoce perdeu &f{quantidade} &cchave(s) de &f{caixa}&c.'
  Dada: '&aVoce deu &f{quantidade} &achave(s) de &f{caixa} &apara &f{jogador}&a.'
  Tirada: '&aVoce tirou &f{quantidade} &achave(s) de &f{caixa} &ade &f{jogador}&a.'
  Definida: '&aAgora &f{jogador} &atem &f{quantidade} &achave(s) de &f{caixa}&a.'
  Dada a todos: '&aVoce deu &f{quantidade} &achave(s) de &f{caixa} &apara &f{jogadores} &ajogador(es).'
  Dada offline: '&aFeito. &f{jogador} &atem agora &f{total} &achave(s) de &f{caixa}&a.'
  Offline sem fisica: '&cChave fisica precisa do jogador online; &f{jogador} &cnao esta.'
  Sem chave fisica: '&cA caixa &f{caixa} &cnao tem chave fisica.'
  Nenhuma virtual: '&cVoce nao tem chave guardada de &f{caixa}&c.'
  Sacada: '&aVoce sacou &f{quantidade} &achave(s) de &f{caixa}&a.'
  Cabecalho da lista: '&6&lCHAVES DE {jogador}'
  Linha da lista: '&7- &f{caixa}&7: &e{virtuais} &7guardada(s), &e{fisicas} &7no inventario'

Bloco:
  Criado: '&aBloco de caixa criado para &f{caixa}&a.'
  Removido: '&aO bloco de caixa de &f{caixa} &afoi removido.'
  Protegido: '&cEste bloco e uma caixa e nao pode ser quebrado.'
  Ja existe: '&cJa existe uma caixa neste bloco.'
  Nao e caixa: '&cO bloco que voce esta mirando nao e uma caixa.'
  Nenhum mirado: '&cMire num bloco a ate 8 blocos de distancia.'
  Cabecalho da lista: '&6&lBLOCOS DE CAIXA &7({quantidade})'
  Linha da lista: '&7- &f{caixa} &8| &7{mundo} &f{x}&7, &f{y}&7, &f{z}'

Holograma:
  Criado: '&aHolograma &f{id} &acriado com &f{posicoes} &acolocacoes.'
  Removido: '&aO holograma &f{id} &afoi removido.'
  Nao existe: '&cNao existe holograma com o id &f{id}&c.'
  Ja existe: '&cJa existe um holograma com o id &f{id}&c.'
  Teleportado: '&aVoce foi levado ate o holograma &f{id}&a.'
  Cabecalho da lista: '&6&lHOLOGRAMAS &7({quantidade})'
  Linha da lista: '&7- &f{id} &8| &7{caixa} &8| &7{mundo} &f{x}&7, &f{y}&7, &f{z} &8| &7{posicoes} pos.'

Ranking:
  # Pedacos curtos usados nas lores, nos hologramas e nos placeholders.
  Geral: '&6Todas as caixas'
  Vazio: '&7ninguem ainda'
  Desconhecido: '&7desconhecido'
  Fora do top: '&7fora do top'

Entrada:
  Como cancelar: '&7Digite &fcancelar &7para desistir.'
  Cancelado: '&cOperacao cancelada.'
  Tempo esgotado: '&cVoce demorou demais; a operacao foi cancelada.'

Comando:
  Recarregado: '&aConfiguracoes recarregadas.'
  Salvo: '&aDados enviados para o banco.'
  Historico limpo: '&a{quantidade} registro(s) apagados do historico.'
  Uso do ver: '&cUse: /caixas ver <caixa>'
  Uso do abrir: '&cUse: /caixas abrir <caixa>'
  Uso do abrir admin: '&cUse: /starcaixas abrir <jogador> <caixa> [cobrar]'
  Uso da chave: '&cUse: /starcaixas chave <dar|tirar|definir|ver> <jogador|*> <caixa> [qtd] [fisica]'
  Uso da caixa: '&cUse: /starcaixas caixa dar <jogador> <caixa> [qtd]'
  Uso do bloco: '&cUse: /starcaixas bloco <definir <caixa>|remover|listar>'
  Uso do holograma: '&cUse: /starcaixas holograma <criar <id> <caixa|geral> [posicoes]|remover <id>|listar|ir <id>>'
  Uso do limpar: '&cUse: /starcaixas limpar historico <dias>'

  Info: |
    &8&m
    &6&lSTARCAIXAS &7v{versao}
    &7Caixas: &f{caixas} &8| &7Animacoes: &f{animacoes}
    &7Blocos no mundo: &f{blocos} &8| &7Hologramas: &f{hologramas}
    &7Banco: &f{banco} &8| &7Abrindo agora: &f{aberturas}
    &7Ranking atualizado ha &f{ranking}
    &8&m

  Ajuda do jogador: |
    &8&m
    &6&lCAIXAS
    &e/caixas &7- abre o menu das caixas
    &e/caixas chaves &7- suas chaves
    &e/caixas ver <caixa> &7- o que a caixa pode dar
    &e/caixas abrir <caixa> &7- abre uma caixa
    &e/caixas top [caixa] &7- quem mais abriu
    &e/caixas historico &7- o que voce ja tirou
    &8&m

  Ajuda do admin: |
    &8&m
    &6&lSTARCAIXAS &7- administracao
    &e/starcaixas editor &7- &fcria e edita caixas e chaves em menu
    &e/starcaixas recarregar &7- recarrega os arquivos
    &e/starcaixas info &7- estado do plugin
    &e/starcaixas salvar &7- grava os dados agora
    &e/starcaixas chave dar <jogador|*> <caixa> [qtd] [fisica]
    &e/starcaixas chave tirar <jogador> <caixa> [qtd]
    &e/starcaixas chave definir <jogador> <caixa> <qtd>
    &e/starcaixas chave ver <jogador>
    &e/starcaixas caixa dar <jogador> <caixa> [qtd]
    &e/starcaixas abrir <jogador> <caixa> [cobrar]
    &e/starcaixas bloco <definir <caixa>|remover|listar>
    &e/starcaixas holograma criar <id> <caixa|geral> [posicoes]
    &e/starcaixas holograma <remover <id>|listar|ir <id>>
    &e/starcaixas limpar historico <dias>
    &8&m
