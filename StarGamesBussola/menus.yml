# ==========================================================================
#  StarGamesBussola - menus
#
#  Cada menu fica em Menus.<nome>; a bussola abre o do config.yml (Menu).
#  Um botao tem Slot, Material, Nome, Lore, Brilho (opcional), Permissao
#  (opcional: sem ela o botao some) e as Acoes, rodadas na ordem:
#
#    LOBBY                 vai para o lobby (config.yml > Lobby)
#    SERVIDOR:<nome>       vai para aquele servidor da rede
#    COMANDO:<comando>     o jogador roda o comando (ex.: COMANDO:bw jogar solo)
#    CONSOLE:<comando>     o console roda ({jogador} = o nick)
#    MENU:<nome>           abre outro menu daqui
#    FECHAR                fecha o menu
#
#  Numa rede, a partida pode estar em outro servidor: use SERVIDOR:<nome>
#  (e, se quiser, o modo e escolhido la). Num servidor so, COMANDO:.
#
#  Nos textos: {jogador}, {jogando} (todos em partida agora) e
#  {jogando:<jogo>} ou {jogando:<jogo>:<modo>} -- quantos estao jogando
#  aquele jogo neste servidor (ex.: {jogando:bedwars}, {jogando:bedwars:solo}).
#  PlaceholderAPI tambem vale.
# ==========================================================================

