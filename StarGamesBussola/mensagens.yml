# StarGamesBussola - mensagens. Cores com &. Mensagem vazia ('') nao e enviada.

Versao do modelo: 1

Prefixo: '&a&lMinigames &8» &7'

So jogador: '&cSo um jogador pode usar este comando.'
Sem permissao: '&cVoce nao tem permissao para isso.'
Jogador offline: '&cEste jogador nao esta online.'
Recarregado: '&aConfiguracao da bussola recarregada.'
Dada: '&aBussola dada para &f{jogador}&a (se ele estiver num mundo da bussola).'
Conectando: '&7Indo para &f{servidor}&7...'
Falha ao conectar: '&cNao foi possivel ir para &f{servidor}&c.'
Sem lobby: '&cO lobby nao esta configurado (config.yml > Lobby).'
Menu nao existe: '&cO menu &f{menu} &cnao existe no menus.yml.'
Ajuda admin: |
  &8&m-------------------------------
  &a&lSTARGAMESBUSSOLA
  &f/stargamesbussola recarregar &8- &7rele os arquivos
  &f/stargamesbussola dar [jogador] &8- &7entrega a bussola
