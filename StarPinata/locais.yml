# Locais onde as pinatas nascem. O jeito facil e no jogo:
#   /pinataadmin setlocal <nome>   (salva onde voce esta)
#   /pinataadmin dellocal <nome>
# ou pelo menu do /pinataadmin > Locais.
#
# Os votos e a vaquinha sorteiam entre os nomes listados no config.yml.
# Se um local nao existir, a pinata nasce no spawn do primeiro mundo.

Locais:
  spawn:
    Mundo: world
    X: 0.5
    Y: 100.0
    Z: 0.5
