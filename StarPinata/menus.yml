  Vazio:
    Slot: 22
    Material: GRAY_DYE
    Nome: '&7Ninguem no top ainda'
    Lore:
      - '&7O top atualiza a cada poucos minutos.'
  Itens:
    Votos:
      Slot: 45
      Material: EMERALD
      Nome: '&aVotos'
      Acoes: ['tipo votos']
    Mes:
      Slot: 46
      Material: CLOCK
      Nome: '&aVotos do mes'
      Acoes: ['tipo mes']
    Golpes:
      Slot: 47
      Material: DIAMOND_SWORD
      Nome: '&cGolpes'
      Acoes: ['tipo golpes']
    Quebradas:
      Slot: 48
      Material: FIREWORK_ROCKET
      Nome: '&dEstouradas'
      Acoes: ['tipo quebradas']
    Voltar:
      Slot: 49
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes: [voltar]
    Vaquinha:
      Slot: 50
      Material: GOLD_INGOT
      Nome: '&6Vaquinha'
      Acoes: ['tipo vaquinha']
    Sequencia:
      Slot: 51
      Material: BLAZE_POWDER
      Nome: '&eSequencia'
      Acoes: ['tipo sequencia']
    Anterior:
      Slot: 36
      Material: ARROW
      Nome: '&ePagina anterior'
      Acoes: [anterior]
    Proxima:
      Slot: 44
      Material: ARROW
      Nome: '&eProxima pagina'
      Acoes: [proxima]

Vaquinha:
  Titulo: '&6Vaquinha da pinata'
  Linhas: 4
  Slots: [20, 21, 22, 23, 24]
  Enfeite:
    Material: ORANGE_STAINED_GLASS_PANE
    Nome: ' '
  Deposito:
    Material: GOLD_NUGGET
    Nome: '&6Colocar &f{valor}'
    Lore:
      - '&7Seu saldo: &f{saldo}'
      - ''
      - '&eClique para depositar.'
  Itens:
    Info:
      Slot: 4
      Material: GOLD_BLOCK
      Nome: '&6&lVaquinha'
      Lore:
        - '&7Juntado: &f{vaquinha_atual}&7/&f{vaquinha_necessario}'
        - '{vaquinha_barra}'
        - '&7Faltam: &e{vaquinha_falta}'
        - '&7Situacao: {descanso}'
        - ''
        - '&7Quem ajudou:'
        - '{contribuintes}'
    Digitar:
      Slot: 31
      Material: OAK_SIGN
      Nome: '&eOutro valor'
      Lore:
        - '&7Digite o valor no chat.'
      Acoes: [vaquinha_digitar]
    Voltar:
      Slot: 27
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes: [voltar]
