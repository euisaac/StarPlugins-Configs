Database:
  Tipo: SQLITE #Tipos: MYSQL, SQLITE
  IP: localhost:3306
  DB: starcorreio
  User: root
  Pass: ''

# Configuracoes do servidor redis (opcional). So usado para avisar o jogador na hora
# quando ele recebe um envio enquanto esta online em OUTRO servidor da rede (BungeeCord/Velocity).
# O banco de dados continua sendo a unica fonte de verdade dos envios.
redis:
  enabled: false
  host: 'localhost'
  port: 6379
  username: ''
  password: ''

# Comando e aliases (definidos no plugin.yml: correio, correios, encomendas, courier)
Comando:
  Correio:
    Comando: 'correio'
    Aliases: [correios, encomendas, courier]

# Tipo de formato de quantia: LETRA (K,M,B,T...) ou NUMERO (100, 1000...)
Formatacao: 'LETRA'

# Opcoes do NPC do correio (Citizens, opcional - ver "Opcoes" abaixo)
NPC:
  Skin: 'Notch'
  Holograma:
    Altura: 3.1
    Holograma:
      - '&6StarCorreio'
      - '&7Clique para gerenciar suas encomendas.'

# Como o botao "Enviar" do menu e o /correio enviar (sem nick) escolhem o destinatario:
#   MENU - abre um menu com a cabeca de todos os jogadores online (tem tambem o botao
#          "Digitar no chat", que serve inclusive para quem esta offline)
#   CHAT - pede o nick direto no chat
# O /correio enviar <nick> continua funcionando direto, nos dois modos.
Enviar:
  Modo: MENU

# Guarda no correio os itens que cairiam no chao porque o inventario do jogador estava cheio
# (premios, ativacao de VIP, /give, kits...). Eles aparecem numa aba propria do /correio
# ("Inventario cheio" no seletor) e o jogador e avisado no chat.
# Como nao da para saber qual plugin soltou o item, ele e recolhido quando cai colado no
# jogador e NAO cabe no inventario dele. Item jogado fora de proposito (Q, arrastar para
# fora) fica no chao normalmente.
InventarioCheio:
  Ativar: false
  # Distancia maxima (em blocos) entre o item que caiu e o jogador
  Distancia: 2.0
  # Ignora itens que saem de blocos quebrados, mobs mortos, explosoes, folhas e
  # dispensers ali do lado (mineracao, escavacao e farms ficam no chao como sempre)
  Ignorar blocos e mobs: true
  # Jogadores no criativo nao tem os itens recolhidos
  Ignorar criativo: true
  # Maximo de itens guardados assim por jogador. Cheio, o item volta a cair no chao. 0 = sem limite
  Limite: 200
  # Dias ate o item guardado expirar (e sumir). 0 = nunca expira
  Dias expiracao: 0
  # Nome mostrado como remetente no historico
  Remetente: 'Inventario cheio'
  # Mundos onde nada e recolhido
  Mundos desativados:
    - 'none'
  # Itens que NUNCA vao para o correio (mineracao, escavacao, farm).
  # Aceita o nome inteiro ou com * nas pontas: *_ORE, RAW_*, *_LOG
  Blacklist:
    - '*_ORE'
    - 'RAW_*'
    - 'ANCIENT_DEBRIS'
    - 'COAL'
    - 'CHARCOAL'
    - 'DIAMOND'
    - 'EMERALD'
    - 'LAPIS_LAZULI'
    - 'REDSTONE'
    - 'QUARTZ'
    - 'AMETHYST_SHARD'
    - 'GLOWSTONE_DUST'
    - 'FLINT'
    - 'STONE'
    - 'COBBLESTONE'
    - 'COBBLED_DEEPSLATE'
    - 'DEEPSLATE'
    - 'ANDESITE'
    - 'DIORITE'
    - 'GRANITE'
    - 'TUFF'
    - 'CALCITE'
    - 'NETHERRACK'
    - 'BLACKSTONE'
    - 'BASALT'
    - 'END_STONE'
    - 'OBSIDIAN'
    - 'DIRT'
    - 'COARSE_DIRT'
    - 'ROOTED_DIRT'
    - 'GRASS_BLOCK'
    - 'MUD'
    - 'CLAY_BALL'
    - 'GRAVEL'
    - 'SAND'
    - 'RED_SAND'
    - 'SANDSTONE'
    - 'SOUL_SAND'
    - 'SOUL_SOIL'
    - 'SNOWBALL'
    - 'ICE'
    - '*_LOG'
    - '*_STEM'
    - '*_SAPLING'

# Caixa de correio no mundo: uma cerca com a cabeca de caixa de correio em cima e o
# holograma "Correio de NICK". Quem clica nela envia itens ao dono; o dono clicando abre o
# proprio /correio. O jogador pega a caixa no botao do /correio. Para tirar: o dono
# agachado (SHIFT) quebrando, ou o botao direito no /correio (recolhe do chao a distancia).
CaixaCorreio:
  Ativar: true
  # Preco da primeira caixa do jogador (0 = gratis) e das proximas (quando ela some do
  # chao e do inventario e ele precisa de outra). Cobrado pelo Vault.
  Preco primeira: 0
  Preco: 15000
  # Caixas no chao por jogador (mais por comando: /correio caixa limite <player> <quantia>)
  Limite por jogador: 1
  # Cerca embaixo da cabeca
  Cerca: OAK_FENCE
  # Textura da cabeca colocada no chao (hash do textures.minecraft.net ou a URL inteira)
  Textura: 'eb2815b99c13bfc55b4c5c2959d157a6233ab06186459233bc1e4d4f78792c69'
  # A cada quantos segundos atualizar o "Voce recebeu X itens!"
  Atualizar segundos: 5
  Texto gratis: '&aGratis'
  Texto preco: '&2$&a{valor}'
  Item:
    CustomSkull: true
    URL: 'eb2815b99c13bfc55b4c5c2959d157a6233ab06186459233bc1e4d4f78792c69'
    ID: AIR
    Data: 0
    Name: '&eCaixa de correio'
    Lore:
      - '&7Coloque no chao para que outros'
      - '&7jogadores te enviem itens.'
      - ''
      - '&7Para tirar: agache (SHIFT) e quebre.'
  Holograma:
    # Altura da primeira linha acima da cerca e o espaco entre as linhas
    Altura: 2.05
    Espacamento: 0.27
    Linhas:
      - '&eCorreio de &f{dono}'
      - '&7Envie itens por correio.'
    # Linha acima das outras que SO o dono ve, quando tem algo esperando no correio
    # (servidor 1.18+). Deixe vazio ('') para nao mostrar.
    Dono: '&aVoce recebeu {quantia} itens!'

# Opcoes gerais do plugin
Opcoes:
  # Mundos onde nao e possivel coletar encomendas/recompensas
  World blacklist:
    - 'none'
  # Enviar aviso de recompensas/encomendas pendentes ao logar
  Logar mensagem: true
  # Limite de encomendas armazenadas por jogador
  Limite encomenda: 40
  # Ativar o sistema de encomendas entre jogadores
  Encomendas ativar: true
  # Delay (em ticks) apos o login antes de checar o correio do jogador
  Login delay: 20
  # Ativar o botao Q para deletar itens do correio
  UsarQ: true

