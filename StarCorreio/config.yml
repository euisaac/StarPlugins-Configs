# Lores de sobreposicao (adicionadas embaixo da lore original do item)
Lores:
  Principal:
    Ativar: true
    Lore:
      - ''
      - '&aBotao esquerdo para coletar'
      - '&aBotao Q para deletar'
  Recompensa:
    Ativar: true
    Lore:
      - ''
      - '&fQuantia: &b{quantia}&f.'
      - ''
      - '&aBotao ESQUERDO para coletar'
      - '&aBotao Q para deletar'
      - '&aBotao SHIFT+ESQUERDO para coletar todos'

# Registro em log (console) de coletas
logs:
  reward:
    enabled: true
    format: '[{date}:{hour}] {player} recolheu a recompensa {reward} no mundo [{world}] nas coordenadas ({coords})'
  package:
    enabled: true
    format: '[{date}:{hour}] {player} recolheu a encomenda {item} no mundo [{world}] nas coordenadas ({coords})'

# Sistema de historico de envios
Historico:
  # Dias ate um envio pendente expirar e retornar ao remetente
  Dias expiracao: 7
  # Limite de entradas no historico exibidas por jogador
  Limite por jogador: 50
  # A cada quantos minutos verificar e processar envios expirados
  Verificar minutos: 60
  # Permissao para ver o historico de outros jogadores
  Permissao staff: 'starcorreio.historico.outros'
  Mensagens:
    Titulo: '&8Historico de Envios'
    Status pendente: '&ePendente'
    Status recolhido: '&a✓ Recolhido'
    Status retornado: '&c↩ Retornado'
    Enviado para: '&7Enviado para: &f{destinatario}'
    Data envio: '&7Data: &f{data}'
    Expira em: '&7Expira em: &f{tempo}'
    Sem historico: '&cVoce nao tem envios no historico.'
    Item retornado: '&e[StarCorreio] &fSeu item &e{item} &fnao foi coletado por &e{player} &fe retornou para voce!'
    Acao puxar: '&e[Staff] Clique ESQUERDO: puxar este item para voce'
    Acao forcar: '&e[Staff] Clique DIREITO: forcar a entrega ao destinatario'
    Puxou: '&aVoce puxou o item pendente para o seu inventario.'
    Forcou: '&aVoce forcou a entrega do item pendente ao destinatario.'
    Destinatario offline: '&cO destinatario precisa estar online para forcar a entrega.'

