Importar:
  Procurando: '&7Procurando contas de outros plugins de login...'
  Nada: '&cNenhuma tabela de outro plugin de login foi encontrada (nem no MySQL configurado, nem em arquivos .db na pasta plugins).'
  Encontradas: '&aEncontrei {quantidade} fonte(s). Clique em uma para importar:'
  Linha: ' {botao:&e&n[{numero}]|comando|/starlogin importar {numero}|&fImportar esta} &f{fonte} &7({contas} linhas)'
  Liste antes: '&cUse &f/starlogin importar&c para listar as fontes e depois o número.'
  Rodando: '&cJá existe uma importação em andamento.'
  Comecou: '&7Importando de &f{fonte}&7... (pode levar alguns segundos)'
  Terminou: '&aImportação concluída em {tempo}: &f{importadas} &aconta(s) nova(s), &f{existiam} &ajá existiam, &f{ignoradas} &aignoradas (sem senha ou nick inválido). As senhas continuam as mesmas.'
  Falhou: '&cA importação falhou. Veja o console.'

Alertas:
  Senhas erradas: '&c[Alerta] &f{jogador} &7errou a senha &f{erros}x &7seguidas (&f{ip}&7).'
  Contas no IP: '&e[Alerta] &f{jogador} &7entrou de um IP com &f{contas} &7contas (&f{ip}&7). {botao:&b&n[ver]|comando|/starlogin alts {jogador}|&fListar as contas}'

Conta:
  Linha do historico: '&8• &7{quando} &f{tipo} &8({ip})'

