    &b/{rotulo} recarregar
  Uso: '&cUse: &f{uso}'
  Conta nao existe: '&cNão existe conta com o nick &f{jogador}&c.'
  Offline: '&c{jogador} não está online (ou não logou).'
  Ja logado: '&c{jogador} já está logado.'
  Sem conta para forcar: '&c{jogador} ainda não tem conta: ele precisa se registrar.'
  Login forcado: '&aLogin de &f{jogador} &aliberado.'
  Deslogado: '&a{jogador} foi tirado da conta.'
  Senha trocada: '&aSenha de &f{jogador} &atrocada.'
  Senha temporaria: |-
    {prefixo}&aSenha temporária de &f{jogador}&a: &e&l{senha} {botao:&8[&ecopiar&8]|copiar|{senha}|&fCopiar a senha}
    {prefixo}&7Passe para o jogador e peça para trocar com &f/trocarsenha&7.
  Agora original: '&a{jogador} agora entra automaticamente como original.'
  Agora pirata: '&e{jogador} agora entra com senha.'
  Pirata sem senha: '&eAtenção: {jogador} não tem senha. Defina uma com &f/starlogin trocarsenha {jogador} <senha>&e.'
  2FA removido: '&aAutenticador de &f{jogador} &aremovido.'
