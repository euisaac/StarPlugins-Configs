  Discord removido: '&aDiscord de &f{jogador} &aremovido.'
  Confirme apagar: '&cIsto apaga a conta de &f{jogador}&c para sempre. Confirme com &f/starlogin apagar {jogador} confirmar&c.'
  Confirme com shift: '&eSegure &fShift &ee clique para confirmar.'
  Conta apagada: '&aConta de &f{jogador} &aapagada.'
  Expulso conta apagada: |-
    &b&lStarLogin
    &cSua conta foi apagada pela staff.
  IP desbloqueado: '&aIP &f{ip} &adesbloqueado.'
  IP nao bloqueado: '&cO IP &f{ip} &cnão está bloqueado.'
  Spawn definido: '&aSpawn de login definido aqui. Ligue em Ajustes > Spawn de login.'
  Recarregado: '&aStarLogin recarregado.'
