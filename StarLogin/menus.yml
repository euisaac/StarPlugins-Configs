# ==========================================================================
#  StarLogin - menus
#
#  Cada menu: Titulo, Linhas (1 a 6), Enfeite (vidro de fundo) e Itens.
#  Botão: Slot (-1 esconde), Material, Nome, Lore, Brilho, e para cabeça
#  Material PLAYER_HEAD + Dono (nick) ou Textura.
#  O que cada botão FAZ é fixo; aqui muda só como ele aparece e onde fica.
#  Menus de lista (Jogadores, Contas, Historico) têm Slots: onde entra cada item.
# ==========================================================================

Versao do modelo: 1

# --------------------------------------------------------------------------
#  /conta  (jogador)
# --------------------------------------------------------------------------
Conta:
  Titulo: '&8Minha conta'
  Linhas: 4
  Enfeite:
    Ativar: true
    Material: 'BLACK_STAINED_GLASS_PANE'
  Itens:
    Info:
      Slot: 4
      Material: 'PLAYER_HEAD'
      Dono: '{jogador}'
      Nome: '&b&l{jogador}'
      Lore:
        - '&7Tipo: {tipo}'
        - '&7Criada em: &f{criada}'
        - '&7Conexão: &f{ip}'
        - ''
        - '&7Segurança da conta: {seguranca}'
    Trocar senha:
      Slot: 19
      Material: 'TRIPWIRE_HOOK'
      Nome: '&e&lTrocar senha'
      Lore:
        - '&7Escolha uma senha nova.'
        - '&7Você digita no chat e ninguém vê.'
        - ''
        - '&eClique para trocar'
    Sessao:
      Slot: 20
      Material: 'CLOCK'
      Nome: '&b&lSessão'
      Lore:
        - '&7Voltando em até &f{minutos} min &7pela'
        - '&7mesma conexão, entra sem senha.'
        - ''
        - '&7Estado: {estado}'
        - '&eClique para ligar/desligar'
    Autenticador:
      Slot: 21
      Material: 'ENDER_EYE'
      Nome: '&a&lAutenticador no celular'
      Lore:
        - '&7Pede um código do app (Google'
        - '&7Authenticator, Authy...) a cada login.'
        - '&7Mesmo com a senha, ninguém entra.'
        - ''
        - '&7Estado: {estado}'
        - '&eClique para configurar'
    Email:
      Slot: 22
      Material: 'WRITABLE_BOOK'
      Nome: '&6&lE-mail'
      Lore:
        - '&7Recupere a senha se esquecer.'
        - ''
        - '&7Atual: &f{email}'
        - '&eClique para vincular'
    Discord:
      Slot: 23
      Material: 'LAPIS_LAZULI'
      Nome: '&9&lDiscord'
      Lore:
        - '&7Aprove cada login com um botão'
        - '&7e recupere a senha pelo Discord.'
        - ''
        - '&7Vinculado: {estado}'
        - '&7Aprovação de login: {aprovacao}'
        - '&eEsquerdo &7vincular / aprovação'
        - '&eDireito &7desvincular'
    Original:
      Slot: 24
      Material: 'GOLDEN_APPLE'
      Nome: '&6&lConta original'
      Lore:
        - '&7Tem o Minecraft original deste nick?'
        - '&7Entre sem digitar senha.'
        - ''
        - '&7Estado: {estado}'
        - '&eClique para ligar/desligar'
    Historico:
      Slot: 25
      Material: 'BOOK'
      Nome: '&f&lÚltimos acessos'
      Lore:
        - '{historico}'
    Deslogar:
      Slot: 31
      Material: 'OAK_DOOR'
      Nome: '&c&lSair da conta'
      Lore:
        - '&7Fica no servidor, mas precisa'
        - '&7da senha para voltar a jogar.'
    Fechar:
      Slot: 35
      Material: 'RED_DYE'
      Nome: '&cFechar'

# --------------------------------------------------------------------------
#  /starlogin  (staff)
# --------------------------------------------------------------------------
Staff:
  Titulo: '&8StarLogin &7- painel'
  Linhas: 5
  Enfeite:
    Ativar: true
    Material: 'BLACK_STAINED_GLASS_PANE'
  Itens:
    Estatisticas:
      Slot: 4
      Material: 'BEACON'
      Nome: '&b&lStarLogin'
      Lore:
        - '&7Contas: &f{total} &8(&b{originais} &7originais&8, &a{bedrock} &7Bedrock&8)'
        - '&7Com autenticador: &f{dois_fatores}'
        - '&7Com e-mail: &f{email}  &7Discord: &f{discord}'
        - ''
        - '&7Últimas 24h:'
        - '&8• &7Contas novas: &f{novos}'
        - '&8• &7Entraram: &f{ativos}'
        - '&8• &7Senhas erradas: &c{falhas}'
        - ''
        - '&7Online: &f{online}  &7Esperando login: &e{esperando}'
        - '&7Banco: &f{banco}  &7Rede: {rede}'
        - ''
        - '&eClique para atualizar'
    Online:
      Slot: 19
      Material: 'PLAYER_HEAD'
      Dono: '{jogador}'
      Nome: '&a&lJogadores online'
      Lore:
        - '&7{online} online agora.'
        - '&7Veja como cada um entrou e'
        - '&7gerencie a conta com um clique.'
    Esperando:
      Slot: 20
      Material: 'CLOCK'
      Nome: '&e&lEsperando login'
      Lore:
        - '&7{esperando} jogador(es) ainda'
        - '&7não entraram na conta.'
        - '&7Libere quem precisar de ajuda.'
    Procurar:
      Slot: 21
      Material: 'COMPASS'
      Nome: '&b&lProcurar conta'
      Lore:
        - '&7Digite o nick (ou parte dele)'
        - '&7no chat, mesmo offline.'
    Ajustes:
      Slot: 22
      Material: 'COMPARATOR'
      Nome: '&d&lAjustes rápidos'
      Lore:
        - '&7Sessão, tempo, tentativas,'
        - '&7limites por IP, cegueira...'
        - '&7Tudo num clique, vale na hora.'
    Historico:
      Slot: 23
      Material: 'WRITABLE_BOOK'
      Nome: '&f&lHistórico'
      Lore:
        - '&7Logins, senhas erradas, bloqueios'
        - '&7e tudo o que a staff fez.'
    Importar:
      Slot: 24
      Material: 'HOPPER'
      Nome: '&6&lImportar contas'
      Lore:
        - '&7Traz as contas de outro plugin'
        - '&7de login. As senhas continuam'
        - '&7as mesmas para os jogadores.'
    Spawn:
      Slot: 25
      Material: 'ENDER_PEARL'
      Nome: '&5&lSpawn de login'
      Lore:
        - '&7Marca onde você está como o'
        - '&7lugar de quem ainda não logou.'
    Recarregar:
      Slot: 40
      Material: 'EMERALD'
      Nome: '&a&lRecarregar'
      Lore:
        - '&7Relê config, mensagens e menus.'
    Fechar:
      Slot: 44
      Material: 'RED_DYE'
      Nome: '&cFechar'

