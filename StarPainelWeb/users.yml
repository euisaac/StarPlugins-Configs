# =====================================================================
# StarPainelWeb — Usuários do painel
# =====================================================================
# O login agora é feito com Discord (pelo painel central, em
# painel.redestars.com/starpainelweb/login) — não tem mais senha.
#
# Pra adicionar alguém, copie o bloco abaixo (troque "exemplo" por um nome
# curto de sua escolha) e troque o discord-id pelo ID da pessoa:
#   Discord > Configurações > Avançado > Modo desenvolvedor (ativa)
#   > clique com o botão direito no nome dela > Copiar ID de Usuário
#
# "permissions" pode ser "*" (libera tudo) ou uma lista separada por vírgula,
# ex.: "dashboard.view,console.access"
#
# exemplo:
#   discord-id: "000000000000000000"
#   permissions: "*"
#   created_at: 1718400000000

users:
  admin:
    discord-id: "568249309573677066"
    permissions: "dashboard.view,console.access,files.manage,players.manage,whitelist.manage,users.manage,settings.manage,ban.manage,kick.manage,mute.manage,warn.manage,ips.view,mysql.view,files.solicitar,files.aprovar-solicitacoes"
    created_at: 1718400000000
