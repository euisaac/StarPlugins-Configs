# ------------------------------------------------------------------------
#  Telas do StarMercado.
#
#  Em todo item: Slot -1 esconde. Os itens a venda ocupam tudo menos a
#  ultima linha, que e a barra de botoes.
#
#  Placeholders das grades: {categoria} {ordem} {busca} {pagina} {paginas} {total}
# ------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

# Nao mexa: o plugin usa este numero para saber se o seu arquivo ficou para
# tras depois de uma atualizacao.
Versao do modelo: 1

# ------------------------------------------------------------------------
#  A tela do /mercado (modo padrao: itens direto na tela principal).
# ------------------------------------------------------------------------
Mercado:
  Titulo: '&8Mercado &7- &f{categoria}'
  Linhas: 6

  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '

  Itens:
    # Lore colada embaixo da lore original de cada item a venda.
    # {preco} {unitario} {quantidade} {vendedor} {categoria} {expira} {dentro}
    Anuncio:
      Lore:
        - ''
        - '&7Preco: &a{preco}'
        - '&7Cada: &f{unitario}'
        - '&7Vendedor: &f{vendedor}'
        - '&7Categoria: {categoria}'
        - '&7Vence em: &f{expira}'
        - ''
        - '&eClique para comprar.'
      Lore proprio:
        - '&7(seu anuncio) &eClique para tirar do mercado.'
      Lore shulker:
        - '&d{dentro} itens dentro &7- clique para ver antes de comprar.'
      Lore staff:
        - '&cShift-clique: tirar do mercado e pegar o item.'

    Vazio:
      Slot: 22
      Material: BARRIER
      Nome: '&cNenhum item por aqui'
      Lore:
        - '&7Categoria: {categoria}'
        - '&7Use o filtro para ver outras.'

    Filtro:
      Slot: 49
      Material: HOPPER
      Nome: '&eCategoria: &f{categoria}'
      Lore:
        - '&7Clique para a proxima.'
        - '&7Clique direito para a anterior.'
        - ''
      # Como cada categoria aparece na lista abaixo da lore.
      Ativa: '&a> {categoria}'
      Inativa: '&8  {categoria}'

    Ordenar:
      Slot: 50
      Material: COMPARATOR
      Nome: '&eOrdem: &f{ordem}'
      Lore:
        - '&7Clique para trocar a ordem.'
        - '&7{total} itens a venda.'

    Buscar:
      Slot: 48
      Material: OAK_SIGN
      Nome: '&eBuscar'
      Lore:
        - '&7Busca atual: &f{busca}'
        - '&7Clique para digitar.'
        - '&7Clique direito para limpar.'

    'Meus anuncios':
      Slot: 45
      Material: BOOK
      Nome: '&eMeus anuncios'
      Lore:
        - '&7Veja e cancele os seus anuncios.'

    Armazem:
      Slot: 46
      Material: ENDER_CHEST
      Nome: '&eArmazem'
      Lore:
        - '&7Itens vencidos, ganhos e devolvidos.'

    Historico:
      Slot: -1
      Material: PAPER
      Nome: '&eHistorico'
      Lore:
        - '&7As suas ultimas negociacoes.'

    Vender:
      Slot: 52
      Material: GOLD_INGOT
      Nome: '&aAnunciar o item da mao'
      Lore:
        - '&7Segure o item e clique aqui.'
        - '&7Ou use &f/mercado vender <preco>&7.'

    Trocar:
      Slot: 53
      Material: CLOCK
      Nome: '&6Ir para o leilao'
      Lore:
        - '&7Abre a tela so de leiloes.'

    Anterior:
      Slot: 47
      Material: ARROW
      Nome: '&ePagina anterior'
      Lore:
        - '&7Pagina {pagina} de {paginas}.'

    Proxima:
      Slot: 51
      Material: ARROW
      Nome: '&eProxima pagina'
      Lore:
        - '&7Pagina {pagina} de {paginas}.'

    Fechar:
      Slot: -1
      Material: BARRIER
      Nome: '&cFechar'

