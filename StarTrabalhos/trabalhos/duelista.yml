# ==========================================================================
#  StarTrabalhos - trabalho 'duelista'
#
#  O id do trabalho e o nome deste arquivo. Apague o arquivo para tirar o
#  trabalho; copie e renomeie para criar outro.
#
#  Formulas usam {nivel} e aceitam + - * / ^ %, parenteses e as funcoes
#  min max floor ceil round sqrt abs pow.
#
#  Alvos: nome do material/entidade (nomes novos ou antigos), com curinga
#  ('*_ORE' pega todo minerio, '*' pega tudo) e peso opcional
#  ('DIAMOND_ORE 3' vale tres progressos). O exato ganha do curinga.
#  Lista vazia aceita qualquer alvo.
# ==========================================================================

Nome: '&c&lDuelista'
Descricao:
  - '&7Dano corpo a corpo e flechas'
  - '&7em outros jogadores.'

# O item que representa o trabalho nos menus (Material, Nome e Lore vem do
# menus.yml; aqui tambem cabem Textura/Dono para cabeca e Brilho).
Icone:
  Material: NETHERITE_SWORD

# Posicao nas listas (menor primeiro).
Ordem: 52

# Trabalho premium exige a permissao startrabalhos.premium.
Premium: true
# Permissao extra para entrar (vazio = nenhuma).
Permissao: ''
# Pontos de trabalho necessarios para entrar.
Pontos para entrar: 50
# Nivel mais alto neste trabalho; -1 usa o do config.yml.
Nivel maximo: -1

# Quanto progresso cada nivel pede para ser concluido.
Progresso necessario: '80 * {nivel}'
# Pontos pagos ao concluir cada nivel.
Pontos por nivel: '2 * {nivel}'

# Salario por hora online com o trabalho ativo (dinheiro da economia).
# Formula com {nivel}; '0' desliga. Pago em partes, de tantos em tantos
# minutos (Salario.Pagar a cada do config.yml).
Salario por hora: 'round(120 + 20 * {nivel})'

# Missao do dia: acumule esta quantidade de progresso hoje e ganhe as
# recompensas (ids do recompensas.yml). Quantidade '0' desliga.
Missao diaria:
  Quantidade: '3 * (80 * {nivel})'
  Recompensas: [ pontos-extras, dinheiro-grande ]

# Ids do recompensas.yml.
Recompensas:
  Padrao: [ dinheiro-premium ]
  Por nivel:
    10: [ dinheiro-grande ]
    25: [ dinheiro-grande, diamantes ]
  # true paga o padrao E o do nivel; false paga so o do nivel quando ele existe.
  Somar padrao com nivel: false

# Porcentagens do nivel em que o jogador e avisado do progresso.
Avisar em: [ 25, 50, 75 ]

# O que o trabalho conta. Cada acao tem Tipo, Alvos e Multiplicador.
# Tipos: QUEBRAR COLHER PLANTAR COLOCAR MATAR MATAR_JOGADORES DANO FLECHAR
#        PESCAR FABRICAR FUNDIR ENCANTAR POCAO REPARAR COMER DOMAR PROCRIAR
#        TOSQUIAR ORDENHAR NEGOCIAR COLETAR MEL ANDAR CORRER AGACHAR NADAR
#        PLANAR VOAR PULAR TEMPO_JOGADO
Acoes:
  golpes:
    Tipo: DANO
    Alvos:
      - 'PLAYER'
    Multiplicador: 1.0
  flechas:
    Tipo: FLECHAR
    Alvos:
      - 'PLAYER'
    Multiplicador: 1.5
  abates:
    Tipo: MATAR_JOGADORES
    Alvos: []
    Multiplicador: 20

# Comandos de console rodados ao subir de nivel. Substituicoes: {jogador}
# {trabalho} {nivel} {pontos} {recompensas}
Comandos ao subir: []

# Onde o trabalho conta. Listas vazias = em todo lugar. Regioes precisam
# do WorldGuard.
Mundos permitidos: []
Mundos bloqueados: []
Regioes permitidas: []
Regioes bloqueadas: []
