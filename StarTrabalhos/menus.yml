# ---------------------------------------------------------------------------
Confirmacao:
  Titulo: '&8Confirmar?'
  Linhas: 3
  Enfeite:
    Ativar: false
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '
  Informacao:
    Slot: 13
  Confirmar:
    Slot: 11
    Material: LIME_WOOL
    Nome: '&a&lCONFIRMAR'
    Lore:
      - '&7Custa &6{preco} pontos&7.'
      - '&7Voce tem &6{pontos}&7.'
  Cancelar:
