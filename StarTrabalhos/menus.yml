# ==========================================================================
#  StarTrabalhos - as telas
#
#  Material passa pelo XSeries: o mesmo nome funciona na 1.8 e na 1.21.
#  Cabeca: Material PLAYER_HEAD + Textura (hash/URL/base64) ou Dono (nick).
#  {jogador} no Dono vira o nick de quem esta olhando.
#
#  Cada tela tem:
#    Titulo, Linhas        Titulo (ate 32 caracteres nas versoes antigas) e altura.
#    Enfeite               O vidro do fundo (desligado por padrao; Ativar: true liga).
#    Slots                 Onde o conteudo paginado entra (trabalhos, niveis, top).
#    Itens                 Botoes fixos: Slot/Slots, Material, Textura, Dono,
#                          Nome, Lore, Brilho, Permissao, Esconder sem
#                          permissao e Acoes.
#
#  Acoes proprias:  principal | meus | trabalhos <todos|gratuitos|premium|meus|disponiveis>
#                   niveis <trabalho> | top | top <trabalho> | top semanal | impulsos
#                   loja | prestigiar | entrar <trabalho> | sair <trabalho> | alternar
#                   anterior | proxima | voltar | fechar
#  Acoes gerais:    comando: <cmd> | console: <cmd> | op: <cmd> | mensagem: <texto>
#                   anuncio: <texto> | titulo: <t<nl>sub> | actionbar: <texto>
#                   som: <SOM;volume;tom>
#
#  Substituicoes em qualquer texto: {jogador} {pontos} {pontos_raw}
#  {pontos_abreviado} {posicao} {ativos} {vagas} {vagas_livres} {meus_trabalhos}
#  {trabalhos} {rotacao_tempo} {impulso_progresso} {impulso_pontos}
#  {impulso_recompensas} {pagina} {paginas}. Placeholders do PlaceholderAPI
#  tambem funcionam.
#
#  Um botao pode ter 'Condicao: rotacao' (so aparece com a rotacao ligada),
#  'Condicao: impulso' (quando o jogador tem algum impulso), 'Condicao: semanal'
#  (top semanal ligado), 'Condicao: loja' (loja ligada) ou 'Condicao: prestigio'
#  (prestigio ligado, so no menu de niveis).
# ==========================================================================

Versao do modelo: 5

# ---------------------------------------------------------------------------
#  /trabalhos -- a tela inicial. A cabeca abre "Meus trabalhos".
# ---------------------------------------------------------------------------
Principal:
  Titulo: '&8Trabalhos'
  Linhas: 4
  Enfeite:
    Ativar: false
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Itens:
    perfil:
      Slot: 4
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&6&l{jogador}'
      Lore:
        - ''
        - '&fPontos de trabalho: &6{pontos}'
        - '&fPosicao no top: &6{posicao}'
        - '&fVagas em uso: &6{ativos}&7/&6{vagas}'
        - ''
        - '&fSeus trabalhos:'
        - '&7{meus_trabalhos}'
        - ''
        - '&aCLIQUE &7para ver seus trabalhos.'
      Acoes:
        - 'meus'

    gratuitos:
      Slot: 10
      Material: CHEST
      Nome: '&a&lTRABALHOS GRATUITOS'
      Lore:
        - ''
        - '&7Abertos para todos os jogadores.'
        - ''
        - '&aCLIQUE &7para ver.'
      Acoes:
        - 'trabalhos gratuitos'

    premium:
      Slot: 12
      Material: ENDER_CHEST
      Nome: '&d&lTRABALHOS PREMIUM'
      Lore:
        - ''
        - '&7Exclusivos para quem tem'
        - '&7o passe premium.'
        - ''
        - '&aCLIQUE &7para ver.'
      Acoes:
        - 'trabalhos premium'

    todos:
      Slot: 14
      Material: BOOKSHELF
      Nome: '&f&lTODOS OS TRABALHOS'
      Lore:
        - ''
        - '&7Os &f{trabalhos} &7trabalhos do servidor,'
        - '&7gratuitos e premium juntos.'
        - ''
        - '&aCLIQUE &7para ver.'
      Acoes:
        - 'trabalhos todos'

    top:
      Slot: 16
      Material: GOLDEN_HELMET
      Nome: '&6&lTOP'
      Lore:
        - ''
        - '&7Quem tem mais pontos de'
        - '&7trabalho no servidor.'
        - '&7Sua posicao: &6{posicao}'
        - ''
        - '&aCLIQUE &7para ver.'
      Acoes:
        - 'top'

    loja:
      Slot: 19
      Material: EMERALD
      Condicao: loja
      Nome: '&a&lLOJA DE PONTOS'
      Lore:
        - ''
        - '&7Troque seus pontos por impulsos,'
        - '&7vagas extras, itens e mais.'
        - '&7Voce tem: &6{pontos} pontos'
        - ''
        - '&aCLIQUE &7para abrir.'
      Acoes:
        - 'loja'

    impulsos:
      Slot: 21
      Material: NETHER_STAR
      Nome: '&d&lIMPULSOS'
      Brilho: true
      Lore:
        - ''
        - '&7Progresso: &d+{impulso_progresso}%'
        - '&7Pontos: &d+{impulso_pontos}%'
        - '&7Recompensas: &d+{impulso_recompensas}%'
        - ''
        - '&aCLIQUE &7para ver os detalhes.'
      Acoes:
        - 'impulsos'

    semanal:
      Slot: 23
      Material: PAPER
      Condicao: semanal
      Nome: '&e&lTOP DA SEMANA'
      Lore:
        - ''
        - '&7Quem mais pontuou nesta semana.'
        - '&7Seus pontos na semana: &6{pontos_semana}'
        - '&7Sua posicao: &6{posicao_semana}'
        - '&7Virada em: &f{semana_tempo}'
        - ''
        - '&aCLIQUE &7para ver.'
      Acoes:
        - 'top semanal'

    rotacao:
      Slot: 25
      Material: CLOCK
      Condicao: rotacao
      Nome: '&b&lROTACAO DE HOJE'
      Lore:
        - ''
        - '&7Os trabalhos sorteados para hoje.'
        - '&7Proximo sorteio em: &f{rotacao_tempo}'
        - ''
        - '&aCLIQUE &7para ver.'
      Acoes:
        - 'trabalhos disponiveis'

    fechar:
      Slot: 31
      Material: RED_DYE
      Nome: '&cFechar'
      Acoes:
        - 'fechar'

# ---------------------------------------------------------------------------
#  Meus trabalhos (cabeca do menu principal, /trabalhos meus).
#
#  Os trabalhos ATIVOS aparecem nos Slots, com o desenho de 'Trabalho ativo'
#  (mesmas substituicoes de Trabalhos.Trabalho). As vagas que sobram mostram
#  'Vaga livre' (clicar abre a lista); vaga que o jogador nao tem mostra
#  'Vaga bloqueada' (ou nada, com Mostrar: false).
# ---------------------------------------------------------------------------
Meus trabalhos:
  Titulo: '&8Meus trabalhos'
  Linhas: 5
  Enfeite:
    Ativar: false
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]

  # Clique esquerdo abre os niveis; direito sai do trabalho.
  Trabalho ativo:
    Nome: '{trabalho} &7[Nv. {nivel}] {estrelas}'
    Lore:
      - '&7{descricao}'
      - ''
      - '&fNivel: &a{nivel} &7/ {nivel_maximo}'
      - '&fProgresso: {barra}'
      - '&7{progresso}/{necessario} &8({porcentagem}%)'
      - '&fProxima recompensa: &a{recompensas}'
      - '&fMissao do dia: {missao}'
      - '&fSalario: &a{salario}&7/h'
      - '{impulso}'
      - ''
      - '&eClique esquerdo para ver os niveis.'
      - '&cClique direito para sair.'
    Brilho quando ativo: true
    Impulso linha: '&d✦ +{porcentagem}% de {tipo}'
  Vaga livre:
    Material: LIME_DYE
    Nome: '&a&lVAGA LIVRE'
    Lore:
      - ''
      - '&7Voce ainda tem uma vaga para'
      - '&7escolher um trabalho.'
      - ''
      - '&aCLIQUE &7para ver os trabalhos.'
    Acoes:
      - 'trabalhos gratuitos'
  Vaga bloqueada:
    Mostrar: true
    Material: GRAY_DYE
    Nome: '&8&lVAGA BLOQUEADA'
    Lore:
      - ''
      - '&7Voce tem &f{vagas} &7vaga(s).'
      - '&7Mais vagas na loja de pontos ou'
      - '&7com a permissao &8startrabalhos.vagas.<n>'
    Acoes: []

  Itens:
    perfil:
      Slot: 4
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&6&l{jogador}'
      Lore:
        - ''
        - '&fPontos de trabalho: &6{pontos}'
        - '&fVagas em uso: &6{ativos}&7/&6{vagas}'
        - '&fVagas livres: &a{vagas_livres}'
    voltar:
      Slot: 40
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes:
        - 'voltar'

# ---------------------------------------------------------------------------
#  Lista de trabalhos (gratuitos, premium, todos, meus, disponiveis).
#  Extras: {categoria}, {quantidade}.
#
#  Em cada trabalho: {trabalho} {trabalho_id} {nivel} {nivel_maximo}
#  {progresso} {necessario} {porcentagem} {barra} {ativo} {premium}
#  {pontos_necessarios} {pontos_por_nivel} {recompensas} {acoes} {acao}
#  {detalhes} {impulso} {descricao} {prestigio} {estrelas} {bonus_prestigio}
#  {missao} {salario}. As linhas com {estrelas}, {missao}, {salario} e
#  {impulso} somem quando nao ha o que mostrar.
# ---------------------------------------------------------------------------
Trabalhos:
  Titulo: '&8Trabalhos: {categoria}'
  Linhas: 6
  Enfeite:
    Ativar: false
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]

  # Como cada trabalho e desenhado. O material vem do Icone do arquivo dele.
  Trabalho:
    Nome: '{trabalho} &7[Nv. {nivel}] {estrelas}'
    Lore:
      - '&7{descricao}'
      - ''
      - '&fO que fazer: &e{acoes}'
      - '&fNivel: &a{nivel} &7/ {nivel_maximo}'
      - '&fAtivo: {ativo}'
      - '&fPontos por nivel: &6{pontos_por_nivel}'
      - '&fRecompensas: &a{recompensas}'
      - '&fSalario: &a{salario}&7/h'
      - '&fPrestigio: &6{estrelas} &7(+{bonus_prestigio}%)'
      - ''
      - '&fProgresso: {barra} &7({progresso}/{necessario})'
      - '&fMissao do dia: {missao}'
      - '{impulso}'
      - ''
      - '{acao}'
      - '{detalhes}'
    Brilho quando ativo: true
    Acao entrar: '&aClique esquerdo para entrar.'
    Acao sair: '&cClique esquerdo para sair.'
    Acao premium: '&cSomente premium.'
    Acao pontos: '&cPrecisa de {pontos_necessarios} pontos.'
    Acao rotacao: '&cFora da rotacao de hoje.'
    Acao permissao: '&cVoce nao tem permissao.'
    Acao limite: '&cSuas vagas estao cheias.'
    Detalhes: '&eClique direito para ver os niveis.'
    Impulso linha: '&d✦ +{porcentagem}% de {tipo}'

  Itens:
    anterior:
      Slot: 48
      Material: ARROW
      Nome: '&ePagina anterior'
      Acoes:
        - 'anterior'
    proxima:
      Slot: 50
      Material: ARROW
      Nome: '&eProxima pagina'
      Acoes:
        - 'proxima'
    voltar:
      Slot: 49
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes:
        - 'principal'
    info:
      Slot: 4
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&6&l{jogador}'
      Lore:
        - '&fPontos: &6{pontos} &8| &fVagas: &6{ativos}&7/&6{vagas}'
        - '&fPagina &e{pagina}&7/&e{paginas}'
    gratuitos:
      Slot: 45
      Material: CHEST
      Nome: '&aGratuitos'
      Acoes:
        - 'trabalhos gratuitos'
    premium:
      Slot: 46
      Material: ENDER_CHEST
      Nome: '&dPremium'
      Acoes:
        - 'trabalhos premium'
    meus:
      Slot: 52
      Material: BOOK
      Nome: '&eMeus trabalhos'
      Acoes:
        - 'trabalhos meus'
    todos:
      Slot: 53
      Material: BOOKSHELF
      Nome: '&fTodos'
      Acoes:
        - 'trabalhos todos'

# ---------------------------------------------------------------------------
#  Os niveis de um trabalho. Extras: {trabalho} {nivel} {ativo} {acao}.
#  Em cada nivel: {nivel_item} {pontos_nivel} {recompensas} {necessario}
#  {progresso} {porcentagem} {barra}.
#  O botao 'trabalho' recebe o icone do trabalho e entra/sai ao clicar.
# ---------------------------------------------------------------------------
Niveis:
  Titulo: '&8Niveis: {trabalho}'
  Linhas: 6
  Enfeite:
    Ativar: false
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]
  # Quantos niveis mostrar quando o trabalho nao tem teto.
  Niveis quando sem limite: 100

  Nivel concluido:
    Material: LIME_STAINED_GLASS_PANE
    Nome: '&aNivel {nivel_item} &7- concluido'
    Lore:
      - ''
      - '&fPontos: &6{pontos_nivel}'
      - '&fRecompensas: &a{recompensas}'
      - ''
      - '&aVoce ja concluiu este nivel.'
  Nivel atual:
    Material: YELLOW_STAINED_GLASS_PANE
    Nome: '&eNivel {nivel_item} &7- atual'
    Brilho: true
    Lore:
      - ''
      - '&fPontos: &6{pontos_nivel}'
      - '&fRecompensas: &a{recompensas}'
      - ''
      - '&fProgresso: {barra}'
      - '&7{progresso}/{necessario} &8({porcentagem}%)'
  Nivel bloqueado:
    Material: RED_STAINED_GLASS_PANE
    Nome: '&cNivel {nivel_item}'
    Lore:
      - ''
      - '&fPontos: &6{pontos_nivel}'
      - '&fRecompensas: &a{recompensas}'
      - '&fNecessario: &7{necessario}'
      - ''
      - '&cConclua os niveis anteriores.'

  Itens:
    trabalho:
      Slot: 4
    anterior:
      Slot: 48
      Material: ARROW
      Nome: '&ePagina anterior'
      Acoes:
        - 'anterior'
    proxima:
      Slot: 50
      Material: ARROW
      Nome: '&eProxima pagina'
      Acoes:
        - 'proxima'
    voltar:
      Slot: 49
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes:
        - 'voltar'
    top:
      Slot: 53
      Material: GOLDEN_HELMET
      Nome: '&6Top deste trabalho'
      Lore:
        - '&7Quem tem o nivel mais alto.'
      Acoes:
        - 'top {trabalho_id}'
    prestigio:
      Slot: 45
      Material: NETHER_STAR
      Condicao: prestigio
      Nome: '&6&l✫ PRESTIGIO'
      Lore:
        - ''
        - '&7Chegou ao nivel maximo? Prestigie:'
        - '&7volta ao nivel 1 com um bonus'
        - '&7permanente de progresso.'
        - ''
        - '&fPrestigios: &6{prestigio}&7/&6{prestigio_maximo} {estrelas}'
        - '&fBonus atual: &a+{bonus_prestigio}%'
        - '&fProximo bonus: &a+{proximo_bonus}%'
        - '&fCusto: &6{custo_prestigio} pontos'
        - ''
        - '{prestigio_situacao}'
      Acoes:
        - 'prestigiar'

# ---------------------------------------------------------------------------
#  Top (pontos ou nivel de um trabalho). Extras: {tipo}, {unidade},
#  {minha_posicao}, {minha_quantidade}. No item de cada jogador: {posicao},
#  {jogador}, {quantidade}, {quantidade_raw}.
# ---------------------------------------------------------------------------
Top:
  Titulo: '&8Top {tipo}'
  Linhas: 6
  Enfeite:
    Ativar: false
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]

  Jogador:
    Material: PLAYER_HEAD
    Usar a cabeca do jogador: true
    Nome: '&6#{posicao} &f{jogador}'
    Lore:
      - ''
      - '&f{unidade}: &6{quantidade}'
    Brilho no primeiro: true

  Vazio:
    Mostrar: false
    Material: GRAY_STAINED_GLASS_PANE
    Nome: '&7#{posicao} &8vazio'
    Lore: []

  Itens:
    eu:
      Slot: 4
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&6&l{jogador}'
      Lore:
        - '&fSua posicao: &6{minha_posicao}'
        - '&fSeus {unidade}: &6{minha_quantidade}'
    geral:
      Slot: 45
      Material: GOLDEN_HELMET
      Nome: '&6Top geral'
      Lore:
        - '&7Pontos de todos os tempos.'
      Acoes:
        - 'top'
    semanal:
      Slot: 53
      Material: PAPER
      Condicao: semanal
      Nome: '&eTop da semana'
      Lore:
        - '&7Zera em: &f{semana_tempo}'
      Acoes:
        - 'top semanal'
    anterior:
      Slot: 48
      Material: ARROW
      Nome: '&ePagina anterior'
      Acoes:
        - 'anterior'
    proxima:
      Slot: 50
      Material: ARROW
      Nome: '&eProxima pagina'
      Acoes:
        - 'proxima'
    voltar:
      Slot: 49
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes:
        - 'voltar'

# ---------------------------------------------------------------------------
#  Impulsos em vigor. Um item por impulso nos Slots; em cada um: {porcentagem}
#  {tipo} {afeta} {tempo} {id}. Extras: {quantidade}, {impulso_progresso},
#  {impulso_pontos}, {impulso_recompensas}.
# ---------------------------------------------------------------------------
Impulsos:
  Titulo: '&8Impulsos'
  Linhas: 5
  Enfeite:
    Ativar: false
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]

  Servidor:
    Material: BEACON
    Nome: '&b&lIMPULSO DO SERVIDOR'
    Lore:
      - ''
      - '&d+{porcentagem}% &fde {tipo}'
      - '&7Vale para: &f{afeta}'
      - '&7Tempo restante: &f{tempo}'
  Jogador:
    Material: NETHER_STAR
    Brilho: true
    Nome: '&d&lSEU IMPULSO'
    Lore:
      - ''
      - '&d+{porcentagem}% &fde {tipo}'
      - '&7Vale para: &f{afeta}'
      - '&7Tempo restante: &f{tempo}'
  Permissao:
    Material: NAME_TAG
    Nome: '&e&lIMPULSO DE CARGO'
    Lore:
      - ''
      - '&d+{porcentagem}% &fde {tipo}'
      - '&7Vale para: &f{afeta}'
      - '&7Enquanto voce tiver o cargo.'
  Nenhum:
    Mostrar: true
    Material: GRAY_DYE
    Nome: '&7Nenhum impulso em vigor'
    Lore:
      - '&8Fique de olho nos eventos do servidor.'

  Itens:
    resumo:
      Slot: 4
      Material: NETHER_STAR
      Brilho: true
      Nome: '&d&lSEUS IMPULSOS'
      Lore:
        - ''
        - '&7Progresso: &d+{impulso_progresso}%'
        - '&7Pontos: &d+{impulso_pontos}%'
        - '&7Recompensas: &d+{impulso_recompensas}%'
        - ''
        - '&7Impulsos em vigor: &f{quantidade}'
    anterior:
      Slot: 39
      Material: ARROW
      Nome: '&ePagina anterior'
      Acoes:
        - 'anterior'
    proxima:
      Slot: 41
      Material: ARROW
      Nome: '&eProxima pagina'
      Acoes:
        - 'proxima'
    voltar:
      Slot: 40
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes:
        - 'voltar'

# ---------------------------------------------------------------------------
#  Loja de pontos. Os produtos do loja.yml entram nos Slots (ou no Slot
#  proprio de cada um). Extras: {produtos}.
# ---------------------------------------------------------------------------
Loja:
  Titulo: '&8Loja de pontos'
  Linhas: 6
  Enfeite:
    Ativar: false
    Material: BLACK_STAINED_GLASS_PANE
    Nome: ' '

  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]

  Itens:
    saldo:
      Slot: 4
      Material: GOLD_NUGGET
      Nome: '&6&lSEUS PONTOS: {pontos}'
      Lore:
        - '&7Ganhe pontos subindo de nivel'
        - '&7nos seus trabalhos.'
    anterior:
      Slot: 48
      Material: ARROW
      Nome: '&ePagina anterior'
      Acoes:
        - 'anterior'
    proxima:
      Slot: 50
      Material: ARROW
      Nome: '&eProxima pagina'
      Acoes:
        - 'proxima'
    voltar:
      Slot: 49
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes:
        - 'voltar'

# ---------------------------------------------------------------------------
#  Confirmacao de compra (e de prestigio). Extras: os do produto ({preco},
