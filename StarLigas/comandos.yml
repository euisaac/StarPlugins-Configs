#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                        StarLigas - comandos                          ║
#  ║   Os nomes dos comandos e dos subcomandos.                           ║
#  ║   Separe as aliases com | -- o primeiro nome e o principal.          ║
#  ╚══════════════════════════════════════════════════════════════════════╝

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

comandos:
  ligas: 'ligas|liga|league|leagues|ligaclan|ligasclan'
  starligas: 'starligas|sligas|admligas|admliga'

#  Cada subcomando do /ligas. Apagar uma linha daqui desliga o subcomando --
#  quem precisar dele so pelo menu e so deixar em branco.
subcomandos:
  ajuda: 'ajuda|help|?'
  placar: 'placar|top|ranking'
  recompensas: 'recompensas|premios|correio'
  mercado: 'mercado|market|loja'
  historico: 'historico|history'
  participar: 'participar|entrar|inscrever'
  info: 'info|informacoes'

#  Subcomandos do /starligas (administrativos).
subcomandos admin:
  recarregar: 'recarregar|reload|rl'
  info: 'info|status'
  adicionar: 'adicionar|add|dar'
  remover: 'remover|remove|tirar'
  definir: 'definir|set|setar'
  iniciar: 'iniciar|comecar|start'
  encerrar: 'encerrar|finalizar|stop'
  reiniciar: 'reiniciar|resetar|restart'
  inscrever: 'inscrever|participar'
  desinscrever: 'desinscrever|remover-clan'
  premiar: 'premiar|darpremio'
  salvar: 'salvar|save'
