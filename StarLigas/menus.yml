#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                         StarLigas - menus                            ║
#  ║   Slot -1 esconde o botao. "Material: {jogador}" vira a cabeca do    ║
#  ║   jogador da vez.                                                    ║
#  ║                                                                      ║
#  ║   Os icones das ligas ficam no ligas.yml: cada liga tem os proprios. ║
#  ╚══════════════════════════════════════════════════════════════════════╝

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

#
# ═══════════════════════════  MENU DAS LIGAS  ═════════════════════════════
#
Menu das ligas:
  Titulo: '&8Ligas de clans'
  Linhas: 6

  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  Vazio:
    Slot: 22
    Material: 'BARRIER'
    Nome: '&c&lNENHUMA LIGA'
    Lore:
      - '&7O servidor ainda nao tem ligas.'

  Botoes:
    Perfil:
      Slot: 49
      Material: '{jogador}'
      Nome: '&6&l{jogador}'
      Lore:
        - '&r'
        - '&7Clan: &f{clan}'
        - '&7Pontos do clan: &a{pontos}'
        - '&7Rank: &f{rank}'
        - '&r'
    Recompensas:
      Slot: 48
      Material: 'CHEST'
      Nome: '&e&lRECOMPENSAS'
      Lore:
        - '&7Os premios esperando por voce.'
        - '&r'
        - '&7Esperando: &f{recompensas}'
        - '&r'
        - '&a&lCLIQUE &fpara abrir'
    Historico:
      Slot: 50
      Material: 'BOOK'
      Nome: '&e&lHISTORICO'
      Lore:
        - '&7As ligas que ja acabaram.'
        - '&r'
        - '&a&lCLIQUE &fpara ver'
    Voltar:
      # -1 esconde; o menu das ligas e a primeira tela do plugin.
      Slot: -1
      Material: 'ARROW'
      Nome: '&c&lVOLTAR'
      Lore: []
    Voltar ao clan:
      #  Leva de volta ao menu do clan, para quem abriu as ligas por la.
      #  -1 esconde. O comando que ele roda esta no config.yml.
      Slot: 46
      Material: 'ARROW'
      Nome: '&c&lVOLTAR AO CLAN'
      Lore:
        - '&7Volta para o menu do seu clan.'
    Anterior:
      Slot: 45
      Material: 'ARROW'
      Nome: '&e&lPAGINA ANTERIOR'
      Lore: []
    Proxima:
      Slot: 53
      Material: 'ARROW'
      Nome: '&e&lPROXIMA PAGINA'
      Lore: []

