#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                       StarLigas -- Discord                           ║
#  ║   Manda o placar das ligas e o campeao de cada temporada para um     ║
#  ║   canal do Discord, por webhook. Nao precisa de bot.                 ║
#  ╚══════════════════════════════════════════════════════════════════════╝
#
#  Como criar o webhook: no Discord, Editar canal -> Integracoes -> Webhooks
#  -> Novo webhook -> Copiar URL do webhook. Cole a URL abaixo e use
#  /starligas recarregar.
#
#  Cada liga pode ir para um canal proprio, ou ficar fora do Discord, com uma
#  secao "Discord" dela no ligas.yml:
#
#    temporada-1:
#      ...
#      Discord:
#        Ativar: true        # false = esta liga nao vai para o Discord
#        Webhook: ''         # '' = usa o webhook daqui

Ativar: false
Webhook: ''

# Nome e foto com que as mensagens aparecem no canal. Foto: link de uma
# imagem (png/jpg). '' = o nome e a foto definidos no proprio webhook.
Nome: 'Ligas'
Avatar: ''

# Cor da barra lateral das mensagens.
Cor: '#9b59b6'

# Quantos clans aparecem no placar (de 1 a 25).
Top: 10

Placar ao vivo:
  Ativar: true
  # De quanto em quanto tempo o placar vai para o canal: 10m, 30m, 1h, 6h, 1d...
  A cada: '30m'
  #  EDITAR: cada liga tem UMA mensagem no canal, que vai sendo atualizada
  #          no lugar -- o canal nao enche.
  #  NOVA:   uma mensagem nova a cada envio.
  Modo: EDITAR
  # Nao manda o placar enquanto nenhum clan pontuou.
  Pular placar vazio: true

Resultado:
  # Quando uma liga encerra, manda o campeao e a classificacao final numa
  # mensagem nova.
  Ativar: true
  # Mencao junto do resultado: '@everyone', '@here', '<@&ID_DO_CARGO>' ou ''.
  Mencionar: ''

# Miniatura da cabeca do lider do clan em primeiro. {lider} = nick do lider,
# {uuid} = UUID dele. '' para nao mostrar.
Cabeca do lider: 'https://mc-heads.net/avatar/{lider}/64'

#  Textos das mensagens. O Discord aceita **negrito**, *italico* e emojis.
#  Variaveis: {liga} {clans} {restante} {encerra}
#  ({encerra} vira a contagem regressiva do proprio Discord: "em 3 dias").
#  Na linha: {medalha} {posicao} {clan} (a tag) {nome} (nome do clan)
#  {lider} {pontos}. No resultado tambem: {clan} e {pontos} do campeao.
Textos:
  Titulo do placar: '⚔️ {liga}'
  Descricao do placar: 'Classificacao da temporada · encerra {encerra}'
  Descricao sem fim: 'Classificacao da temporada'
  Linha: '{medalha} **[{clan}]** {nome} — {pontos} pontos'
  Placar vazio: '*Nenhum clan pontuou ainda.*'
  Rodape do placar: '{clans} clan(s) pontuando · atualizado'

  Titulo do resultado: '🏆 {liga} — fim da temporada'
  Descricao do resultado: 'O clan **[{clan}]** e o campeao com **{pontos}** pontos!'
  Resultado vazio: '*A liga encerrou sem nenhum clan pontuar.*'
  Rodape do resultado: '{clans} clan(s) disputaram'

  Medalhas: [ '🥇', '🥈', '🥉' ]
  # Da 4a posicao em diante.
  Medalha padrao: '`#{posicao}`'

# Respostas do comando /starligas discord.
Mensagens:
  Enviado: '&aPlacar da liga {liga} &aenviado para o Discord.'
  Enviando: '&7Mandando o placar de &f{quantidade} &7liga(s) para o Discord...'
  Desligado: '&cA integracao com o Discord esta desligada. Ligue em &fdiscord.yml &c(Ativar: true).'
  Sem webhook: '&cNenhum webhook valido para a liga {liga}&c. Confira a URL no &fdiscord.yml&c.'
  Falhou: '&cO Discord recusou o placar da liga {liga}&c: &f{erro}'

# ======================================================================
#  AVISOS -- uma mensagem no canal a cada acontecimento das ligas
# ======================================================================
#
#  Cada aviso tem:
#    Ativar      true/false
#    Webhook     '' = o canal da liga (ou o Webhook geral la de cima);
#                uma URL = um canal so para este aviso (ex.: #pontuacoes-liga)
#    Cor         cor da barra lateral
#    Mencionar   '@everyone', '@here', '<@&ID_DO_CARGO>' ou ''
#    Miniatura   a imagem do canto: '{cabeca_jogador}', '{cabeca_lider}',
#                o link de uma imagem (ex.: o logo do servidor) ou ''
#    Titulo, Descricao, Rodape   o texto (aceita **negrito**, *italico*,
#                emojis e varias linhas)
#
#  Variaveis em todos: {liga} {clan} (tag) {nome} (nome do clan)
#  {lider} (lider do clan) {total} (pontos acumulados do clan)
#  Cada aviso lista as suas proprias logo acima dele.
Avisos:

  #  Pontos que um clan ganhou. {jogador} quem pontuou, {pontos} quantos,
  #  {ligas} em que liga(s) contou, {motivo} por que (textos em Motivos),
  #  {quantidade} quantas vezes no agrupamento, {posicao} posicao do clan.
  #  "Descricao sem jogador" e quando os pontos vieram direto para o clan
  #  (plugin pela API ou /starligas pontuar <clan>).
  Pontos ganhos:
    Ativar: true
    Webhook: ''
    Cor: '#2ecc71'
    Mencionar: ''
    Miniatura: '{cabeca_jogador}'
    Titulo: '⬆️ Pontos adicionados'
    Descricao: |-
      **{jogador}** deu **{pontos}** pontos para o clã **{clan}**!

      🏆 **Liga:** {ligas}
      📝 **Motivo:** {motivo}
    Descricao sem jogador: |-
      O clã **{clan}** ganhou **{pontos}** pontos!

      🏆 **Liga:** {ligas}
      📝 **Motivo:** {motivo}
    Rodape: ''

  #  Pontos que um clan perdeu (morte, pontos negativos de mob/bloco...).
  #  Mesmas variaveis do de cima.
  Pontos perdidos:
    Ativar: false
    Webhook: ''
    Cor: '#e74c3c'
    Mencionar: ''
    Miniatura: '{cabeca_jogador}'
    Titulo: '⬇️ Pontos perdidos'
    Descricao: |-
      **{jogador}** fez o clã **{clan}** perder **{pontos}** pontos.

      🏆 **Liga:** {ligas}
      📝 **Motivo:** {motivo}
    Descricao sem jogador: |-
      O clã **{clan}** perdeu **{pontos}** pontos.

      🏆 **Liga:** {ligas}
      📝 **Motivo:** {motivo}
    Rodape: ''

  #  Um clan passou o outro e assumiu o 1o lugar de uma liga.
  #  {clan} quem assumiu, {anterior} quem era o lider, {pontos} pontos do
  #  novo lider, {diferenca} quanto ele tem a mais que o segundo.
  #  "Pausa" segura o aviso de uma mesma liga por um tempo, para dois clans
  #  trocando de lugar a cada minuto nao encherem o canal.
  Novo lider:
    Ativar: true
    Webhook: ''
    Cor: '#f1c40f'
    Mencionar: ''
    Miniatura: '{cabeca_lider}'
    Titulo: '👑 Novo líder na {liga}'
    Descricao: 'O clã **{clan}** passou o **{anterior}** e assumiu o 1º lugar com **{pontos}** pontos!'
    Rodape: ''
    Pausa: '10m'

  #  O clan subiu de rank (ranks.yml) pelos pontos acumulados.
  #  {rank} nome do rank, {rank_tag} a tag dele.
  Subiu de rank:
    Ativar: true
    Webhook: ''
    Cor: '#3498db'
    Mencionar: ''
    Miniatura: '{cabeca_lider}'
    Titulo: '⭐ {clan} subiu de rank'
    Descricao: 'O clã **{clan}** chegou ao rank **{rank}** com **{total}** pontos acumulados!'
    Rodape: ''

  #  Um clan entrou numa liga. {jogador} quem inscreveu (vazio quando foi a
  #  staff), {inscritos} quantos clans a liga tem agora.
  Clan inscrito:
    Ativar: true
    Webhook: ''
    Cor: '#1abc9c'
    Mencionar: ''
    Miniatura: '{cabeca_lider}'
    Titulo: '📋 Novo clã na {liga}'
    Descricao: 'O clã **{clan}** entrou na disputa! Agora são **{inscritos}** clãs.'
    Rodape: ''

  #  A liga comecou. {encerra} contagem regressiva do Discord, {inscritos}
  #  clans ja inscritos, {meta} pontos para vencer (- se nao tiver).
  Liga iniciada:
    Ativar: true
    Webhook: ''
    Cor: '#9b59b6'
    Mencionar: ''
    Miniatura: ''
    Titulo: '🚀 A {liga} começou!'
    Descricao: |-
      Os pontos já estão valendo. A temporada encerra {encerra}.

      📋 **Clãs inscritos:** {inscritos}
    Rodape: ''

  #  Compra no mercado da liga (gasta pontos do placar). {jogador} quem
  #  comprou, {item} o nome do item, {preco} quanto custou, {pontos} quantos
  #  pontos o clan ficou na liga.
  Compra no mercado:
    Ativar: false
    Webhook: ''
    Cor: '#e67e22'
    Mencionar: ''
    Miniatura: '{cabeca_jogador}'
    Titulo: '🛒 Compra no mercado da {liga}'
    Descricao: '**{jogador}** gastou **{preco}** pontos do clã **{clan}** em **{item}**. O clã ficou com **{pontos}** pontos.'
    Rodape: ''

  #  Pontos do mesmo jogador, pelo mesmo motivo, dentro deste tempo saem
  #  numa mensagem so, com a soma (quebrar 40 blocos = 1 aviso, nao 40).
  #  '0' = um aviso por pontuacao (cuidado: o Discord limita os envios).
  Agrupar: '1m'
  #  O aviso de pontos so sai se a soma chegar a isto.
  Minimo de pontos: 1
  #  Pontos de clan que nao esta em nenhuma liga valendo (so o acumulado)
  #  tambem viram aviso?
  Clan sem liga: false

  #  Como o {ligas} aparece.
  Todas as ligas: 'Todas as ligas'
  Sem liga: 'Só no acumulado'
  Separador de ligas: ', '

  #  A imagem de {cabeca_jogador}. {jogador} = nick, {uuid} = UUID.
  Cabeca do jogador: 'https://mc-heads.net/avatar/{jogador}/64'

  #  O {motivo} de cada tipo de ponto. "Texto" e para um acontecimento so;
  #  "Agrupado" para quando o agrupamento juntou varios ({quantidade}).
  #  {alvo} = quem morreu, o mob, o bloco, ou o texto livre do comando.
  Motivos:
    matar-jogador:
      Texto: 'Matou {alvo}'
      Agrupado: 'Matou {quantidade} jogadores'
    matar-rival:
      Texto: 'Matou {alvo}, de um clã rival'
      Agrupado: 'Matou {quantidade} jogadores de clãs rivais'
    morrer:
      Texto: 'Morreu'
      Agrupado: 'Morreu {quantidade} vezes'
    matar-mob:
      Texto: 'Matou {alvo}'
      Agrupado: 'Matou {quantidade} mobs'
    quebrar-bloco:
      Texto: 'Quebrou {alvo}'
      Agrupado: 'Quebrou {quantidade} blocos'
    pescar:
      Texto: 'Pescou um peixe'
      Agrupado: 'Pescou {quantidade} peixes'
    # /starligas pontuar <jogador|clan> <pontos> [motivo]: o {alvo} e o
    # motivo escrito no comando (ex.: "Votou no servidor").
    comando:
      Texto: '{alvo}'
      Agrupado: '{alvo} ({quantidade}x)'
      Sem texto: 'Adicionado pela staff'
    # Outro plugin pela StarLigasAPI.
    api:
      Texto: '{alvo}'
      Agrupado: '{alvo} ({quantidade}x)'
      Sem texto: 'Evento do servidor'

  #  Como mobs e blocos aparecem no {alvo}. O que nao estiver aqui sai com o
  #  nome do jogo arrumado (ZOMBIE -> Zombie, DIAMOND_ORE -> Diamond ore).
  Nomes:
    ENDER_DRAGON: 'o Dragão do End'
    WITHER: 'o Wither'
    WARDEN: 'o Warden'
    ELDER_GUARDIAN: 'um Guardião Ancião'
    ZOMBIE: 'um Zumbi'
    SKELETON: 'um Esqueleto'
    CREEPER: 'um Creeper'
    SPIDER: 'uma Aranha'
    ENDERMAN: 'um Enderman'
    BLAZE: 'um Blaze'
    DIAMOND_ORE: 'minério de diamante'
    DEEPSLATE_DIAMOND_ORE: 'minério de diamante'
    ANCIENT_DEBRIS: 'detrito ancestral'
