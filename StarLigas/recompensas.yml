#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║                      StarLigas - recompensas                         ║
#  ║   O que os clans levam quando uma liga encerra.                      ║
#  ║                                                                      ║
#  ║   A recompensa nao cai no inventario na hora: ela vai para o correio ║
#  ║   do jogador (/ligas recompensas), que recolhe quando quiser. Assim  ║
#  ║   nada se perde com o inventario cheio ou com o jogador offline.     ║
#  ╚══════════════════════════════════════════════════════════════════════╝

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "textura"):
#       Dono: 'Notch'
#
# Com "textura" ou "dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "textura".
#
# A cabeca por "dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "textura".
# ---------------------------------------------------------------------------

# Nao mexa: e por este numero que o plugin sabe atualizar o arquivo.
Versao do modelo: 1

#  Cada recompensa tem:
#    Icone     - como ela aparece no correio
#    Item      - o item entregue (apague a secao para nao dar item)
#    Comandos  - rodados no console; {jogador} {tag} {nome} {quantia}
#
#  Placeholders no icone: {quantia} {liga} {posicao}
Recompensas:
  ferro-vencedor:
    Icone:
      Material: 'IRON_BLOCK'
      Nome: '&f&lPREMIO DA LIGA DE FERRO'
      Lore:
        - '&7Voce venceu a liga de ferro.'
        - '&r'
        - '&7Quantidade: &f{quantia}'
        - '&r'
        - '&a&lCLIQUE &fpara recolher'
        - '&c&lCLIQUE DIREITO &fpara descartar'
    Item:
      Material: 'IRON_BLOCK'
      Quantidade: 64
      Nome: '&f&lRECOMPENSA DA LIGA'
      Lore:
        - '&7Premio da liga de ferro.'
    Comandos: []

  diamante:
    Icone:
      Material: 'DIAMOND'
      Nome: '&b&lDIAMANTES'
      Lore:
        - '&7Um punhado de diamantes.'
        - '&r'
        - '&7Quantidade: &f{quantia}'
        - '&r'
        - '&a&lCLIQUE &fpara recolher'
        - '&c&lCLIQUE DIREITO &fpara descartar'
    Item:
      Material: 'DIAMOND'
      Quantidade: 32
      Nome: '&b&lDIAMANTE'
      Lore: []
    Comandos: []

  dinheiro:
    Icone:
      Material: 'GOLD_INGOT'
      Nome: '&6&lPREMIO EM DINHEIRO'
      Lore:
        - '&7Dinheiro direto na conta.'
        - '&r'
        - '&7Quantidade: &f{quantia}'
        - '&r'
        - '&a&lCLIQUE &fpara recolher'
        - '&c&lCLIQUE DIREITO &fpara descartar'
    # Sem a secao "Item", so os comandos rodam.
    Comandos:
      - 'eco give {jogador} 100000'
