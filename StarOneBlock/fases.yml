# ------------------------------------------------------------------------
#  StarOneBlock - as fases da ilha
#
#  A ordem e a deste arquivo, de cima para baixo. 'Proxima' so precisa ser
#  preenchida quando voce quiser fugir dessa ordem (um atalho, um ciclo,
#  uma fase secreta).
#
#  Blocos e mobs usam PESO, nao porcentagem: 'STONE:70' e 'COAL_ORE:30' da o
#  mesmo resultado que 'STONE:7' e 'COAL_ORE:3'. Assim voce acrescenta um
#  bloco novo sem recalcular todos os outros.
#
#  Itens do bau: MATERIAL:QUANTIDADE:PESO[:ENCANTAMENTO:NIVEL...]
#  A quantidade aceita faixa: '3-8'.
#
#  Bloco, mob ou bioma que nao existe na versao do seu servidor e avisado no
#  console e pulado -- a fase continua funcionando com o resto.
#
#  Tudo isto tambem pode ser editado por menu: /staroneblock config
# ------------------------------------------------------------------------

