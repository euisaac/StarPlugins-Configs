# ------------------------------------------------------------------------
#  StarOneBlock - as melhorias da ilha
#
#  Cada melhoria e uma escada: o nivel 0 e o 'Valor inicial' (o que a ilha ja
#  tem de graca) e cada degrau tem um Custo (tirado do banco da ilha) e um
#  Valor novo.
#
#  Os ids abaixo sao os que o plugin entende. Voce pode mudar nome, icone,
#  precos, valores e quantos degraus quiser -- mas nao os ids.
#
#    tamanho       lado do quadrado protegido, em blocos
#    velocidade    quantos por cento saem da espera dos geradores
#    membros       quantas pessoas cabem na ilha (contando o dono)
#    mobs          teto de mobs vivos na ilha
#    funis         funis por pedaco
#    multiplicador multiplica o que a loja da ilha paga
#    sorte         soma pontos de chance de bau no nucleo
#
#  Tudo isto tambem pode ser editado por menu: /staroneblock config
# ------------------------------------------------------------------------

Versao do modelo: 1

