# ------------------------------------------------------------------------
#  StarOneBlock - os geradores colocaveis
#
#  Um gerador e um bloco que se refaz sozinho depois de um tempo. O jogador
#  compra pelo menu (/ilha geradores), coloca no chao e mina a vontade.
#  Para levar o gerador embora, quebre-o AGACHADO.
#
#  Materiais usam PESO, nao porcentagem: 'STONE:70' e 'COAL_ORE:30' da o
#  mesmo que 'STONE:7' e 'COAL_ORE:3'.
#
#  Espera esta em milissegundos. A melhoria 'velocidade' da ilha desconta
#  uma porcentagem dela.
#
#  Preco 0 tira o gerador da venda (ele continua funcionando se ja estiver
#  no chao, e voce ainda pode entregar um por comando).
# ------------------------------------------------------------------------

