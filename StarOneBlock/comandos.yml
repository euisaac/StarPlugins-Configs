# ------------------------------------------------------------------------
#  StarOneBlock - os nomes dos comandos
#
#  Aqui voce escolhe como os comandos do plugin vao se chamar no seu servidor.
#  Separe os apelidos com | -- o primeiro nome e o principal.
#
#  Deixe uma linha vazia ('') para ficar so com o que ja vem no plugin.
#
#  ATENCAO: mudanca de comando so vale depois de REINICIAR o servidor.
#  Recarregar nao troca comando ja registrado, e mexer nisso com o servidor
#  no ar deixaria dois nomes vivos ao mesmo tempo.
# ------------------------------------------------------------------------

Versao do modelo: 1

comandos:
  # Ja registrados pelo plugin: /ilha, /is, /ilhas, /island, /oneblock
  ilha: ''

  # Ja registrados: /ilhaadmin, /isadmin, /adminilha
  ilhaadmin: ''

  # Ja registrados: /staroneblock, /sob, /starob
  staroneblock: ''

  # Estes dois NAO vem registrados no plugin: o nome deles e o que voce
  # escrever aqui. Vazio ('') desliga o comando.
  #
  # Se outro plugin ja tiver um /spawn ou um /lobby, quem chegou primeiro fica
  # com o nome curto e o nosso responde por /staroneblock:spawn -- nesse caso
  # escolha outro nome aqui ou tire o comando do outro plugin.

  # Leva para o ponto definido com /ilhaadmin definirspawn.
  spawn: 'spawn'

  # Manda para um dos servidores de Lobby > Servidores do config.yml.
  lobby: 'lobby|hub'
