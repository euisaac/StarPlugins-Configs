          - '&7Progresso: &f{atual}&7/&f{meta}'
          - '{barra} &7{porcento}%'
          - ''
          - '&7Nivel: &a{nivel}'
          - '&7Valor: &a{valor}'
          - '&7Blocos quebrados: &f{blocos}'
          - '&7Tamanho: &f{barreira}'
          - '&7Visitantes: &f{aberta}'
