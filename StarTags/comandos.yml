# ---------------------------------------------------------------------------
#  StarTags - os nomes dos comandos
#
#  Os nomes do plugin.yml ja funcionam sempre. O que voce escrever aqui
#  ACRESCENTA nomes -- util quando /tag ja e de outro plugin do seu servidor.
#  Separe as alternativas por "|"; a primeira e a principal.
#
#  Nos subcomandos, apagar a linha DESLIGA o subcomando: quem quiser o recurso
#  so pelo menu e so deixar em branco.
# ---------------------------------------------------------------------------
Versao do modelo: 1

comandos:
  tags: ''
  brilho: ''
  sufixo: ''
  lojatags: ''
  startags: ''
  dartag: ''
  removertag: ''
  definirtag: ''
  tirartag: ''

subcomandos:
  aleatoria: 'aleatoria|aleatorio|random'
  tirar: 'tirar|remover|nenhuma'
  lista: 'lista|listar'
  ajuda: 'ajuda|help|?'

subcomandos admin:
  recarregar: 'recarregar|reload|rl'
  definir: 'definir|equipar|set'
  dar: 'dar|give'
  tirar: 'tirar|remover|remove'
  tirartag: 'tirartag|desequipar'
  sufixo: 'sufixo|suffix'
  nome: 'nome|apelido'
  ver: 'ver|info-jogador|olhar'
  info: 'info|versao'
