# ---------------------------------------------------------------------------
#  StarPlantacoesSkins - mensagens
#
#  Deixe '' para a mensagem nao aparecer.
#  Uma lista vira varias linhas de chat.
# ---------------------------------------------------------------------------
Versao do modelo: 1

Prefixo: '&a&lSKINS &8» &7'

Geral:
  Sem permissao: '&cVoce nao tem permissao para isso.'
  So jogador: '&cEste comando e so para jogadores.'
  Carregando: '&cSeus dados ainda estao carregando. Tente de novo em instantes.'
  Recarregado: '&aArquivos recarregados.'
  Uso: '&cUse: &f{uso}'
  Jogador nao encontrado: '&cNao achei o jogador &f{jogador}&c.'

Skins:
  Equipou: '&aAgora voce esta usando a skin &f{skin}&a.'
  Voltou ao original: '&aA sua enxada voltou a aparencia original.'
  Bloqueada: '&cVoce ainda nao tem a skin &f{skin}&c.'
  Nao existe: '&cA skin &f{skin} &cnao existe.'
  Nenhuma configurada: '&cNao ha nenhuma skin no skins.yml.'
  # A escolha vale mesmo assim: ela entra na proxima enxada que ele pegar.
  Sem enxada: '&7Voce nao esta com a enxada; a skin entra quando pegar uma.'

  # Avisos dos comandos de administrador.
  Deu: '&a{jogador} recebeu a skin &f{skin}&a.'
  Tirou: '&a{jogador} perdeu a skin &f{skin}&a.'
  Equipou em: '&a{jogador} esta usando a skin &f{skin}&a.'
  Recebeu: '&aVoce recebeu a skin &f{skin}&a! Use /skinsenxada.'
  Perdeu: '&cVoce perdeu a skin &f{skin}&c.'

Etiquetas:
  Original: 'original'
  Nenhuma: 'nenhuma'
  Sim: 'sim'
  Nao: 'nao'

Linha da lista: '&8- &f{skin} &7({display}&7) &8| &7permissao: &f{permissao}'

Ver:
  - ''
  - '&a&lSKINS DE &f{jogador}'
  - '&7Usando: &f{equipada}'
  - '&7Liberadas: &f{liberadas}&7/&f{total}'
  - '&7Dadas por comando: &f{lista}'
  - ''

Info:
  - ''
  - '&a&lSTARPLANTACOESSKINS &f{versao}'
  - '&7Skins: &f{skins}'
  - '&7Banco de dados: &f{banco}'
  - '&7Perfis carregados: &f{perfis}'
  - '&7StarPlantacoes: &f{base}'
  - ''

Ajuda admin:
  - ''
  - '&a&lSTARPLANTACOESSKINS'
  - '&f/starplantacoesskins dar <jogador> <skin> &7- Libera uma skin.'
  - '&f/starplantacoesskins tirar <jogador> <skin> &7- Tira uma skin.'
  - '&f/starplantacoesskins equipar <jogador> <skin|original> &7- Veste a skin.'
  - '&f/starplantacoesskins ver <jogador> &7- Mostra as skins dele.'
  - '&f/starplantacoesskins listar &7- As skins do servidor.'
  - '&f/starplantacoesskins info &7- Estado do addon.'
  - '&f/starplantacoesskins recarregar &7- Recarrega os arquivos.'
  - ''
