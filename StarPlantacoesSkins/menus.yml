# ---------------------------------------------------------------------------
#  StarPlantacoesSkins - as telas
#
#  Slot -1 esconde o item: e assim que voce tira um botao do menu sem precisar
#  de uma opcao "Ativar" para cada um.
#
#  Valem {jogador}, {equipada}, {liberadas}, {total}, {pagina} e {paginas}.
# ---------------------------------------------------------------------------
Versao do modelo: 1

Skins:
  Titulo: '&8Skins da enxada &7({pagina}/{paginas})'
  Linhas: 5
  # As vagas que recebem skin, na ordem. Quando elas nao cabem todas, o menu
  # vira pagina sozinho. A ordem de quem vem primeiro e o "Ordem" da skin.
  Slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]
  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '
  # Os blocos que a linha {status} da lore de cada skin vira.
  Status:
    Pode equipar:
      - '&aClique &7para equipar.'
    Equipada:
      - '&aVoce esta usando esta skin.'
    Bloqueada:
      - '&cVoce ainda nao tem esta skin.'
  Itens:
    Perfil:
      Slot: 4
      Material: PLAYER_HEAD
      Nome: '&a{jogador}'
      Lore:
        - '&7Usando: &f{equipada}'
        - '&7Skins: &f{liberadas}&7/&f{total}'
    # Devolve a enxada a aparencia de fabrica.
    Original:
      Slot: 40
      Material: BARRIER
      Nome: '&cAparencia original'
      Lore:
        - '&7Tira a skin e devolve a enxada'
        - '&7a aparencia normal.'
        - ''
        - '&aClique &7para voltar ao original.'
    Fechar:
      Slot: 44
      Material: RED_DYE
      Nome: '&cFechar'
      Lore: []
    # As setas so aparecem quando ha para onde ir.
    Anterior:
      Slot: 36
      Material: ARROW
      Nome: '&aPagina anterior'
      Lore:
        - '&7Pagina &f{pagina}&7/&f{paginas}'
    Proxima:
      Slot: 43
      Material: ARROW
      Nome: '&aProxima pagina'
      Lore:
        - '&7Pagina &f{pagina}&7/&f{paginas}'
