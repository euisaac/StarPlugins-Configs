    mobs:
      Slot: 19
      Material: ZOMBIE_HEAD
      Nome: '&e&lMobs atacam caidos'
      Lore:
        - '&7Estado: {cfg_mobs}'
        - ''
        - '&aClique para alternar.'
      Acoes:
