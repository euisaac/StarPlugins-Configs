# ==========================================================================
#  StarPresidente - mensagens
#
#  Cores: & e <#RRGGBB>. Mensagem vazia ('') não é enviada: é assim que se
#  desliga um aviso. Blocos com | saem uma linha por mensagem.
#  {prefixo} coloca o prefixo onde você quiser numa mensagem de várias linhas.
#
#  Variáveis que valem em quase tudo (menus, anúncios, holograma):
#    {presidente} {tag} {tempo_mandato} {mandato_tempo_no_cargo} {cofre}
#    {fase} {tempo_fase} {situacao} {proxima_eleicao} {candidatos}
#    {eleitores} {votos_total} {eleicao} {auxilio} {auxilio_intervalo}
#    {impeachment} {impeachment_necessarias} {mandatos} {lider}
#    {mandato_votos} {mandato_percentual} {mandato_arrecadado}
#    {mandato_gasto} {mandato_beneficios} {taxa_inscricao}
#  Do jogador (menus): {jogador} {eh_presidente} {votou} {meu_voto}
#    {sou_candidato} {assinou} {tempo_jogado} {saldo}
#
#  PlaceholderAPI (%starpresidente_<nome>%):
#    presidente, tem_presidente, tag, eh_presidente, eh_presidente_raw,
#    mandato_restante, mandato_restante_segundos, mandato_tempo, fase,
#    fase_raw, fase_restante, situacao, proxima_eleicao, cofre, cofre_raw,
#    candidatos, eleitores, lider, auxilio, impeachment,
#    impeachment_necessarias, mandatos, votou, meu_voto, candidato, assinou,
#    imposto_<id>, votos_<nick> (só com voto aberto),
#    top_<posição>_nome, top_<posição>_tempo (mais tempo no cargo)
# ==========================================================================

Versao do modelo: 1

Prefixo: '&6&lPRESIDÊNCIA &8» &7'

Geral:
  Sem permissao: '&cVocê não tem permissão para isso.'
  So jogador: '&cSó jogadores podem usar isso.'
  So presidente: '&cSó o presidente pode fazer isso.'
  Sem presidente: '&cO servidor está sem presidente agora.'
  Numero invalido: '&c"&f{texto}&c" não é um valor válido.'
  Tempo invalido: '&c"&f{texto}&c" não é um tempo válido. Use 30s, 10m, 2h, 7d...'
  Subcomando desconhecido: '&cNão conheço &f/{comando} {sub}&c. Use &f/{comando} ajuda&c.'
  Uso: '&cUse: &f{uso}'

Etiquetas:
  Dia: 'd'
  Hora: 'h'
  Minuto: 'min'
  Segundo: 's'
  Sim: '&aSim'
  Nao: '&cNão'
  Ninguem: '&7Ninguém'
  Sem mandato: '&7cargo vago'
  Sem previsao: '&7sem previsão'
  Sem slogan: '&8(sem slogan)'
  Secreto: '&8???'
  Staff: 'a Staff'
  Subiu: '&c▲'
  Desceu: '&a▼'
  Nunca: '&7nunca'
  Sem limite: '&7∞'
  Nenhuma: '&7nenhuma'
  Proximo mandato: '&7só no próximo mandato'
  Cofre depositar: 'colocar no cofre'
  Cofre retirar: 'tirar do cofre'
  Cofre definir: 'definir o saldo do cofre'

Fases:
  NENHUMA: '&7Sem eleição'
  INSCRICOES: '&eInscrições abertas'
  VOTACAO: '&aVotação aberta'
  SEGUNDO_TURNO: '&6Segundo turno'

Situacao:
  Inscricoes: 'Inscrições terminam em {tempo}'
  Votacao: 'Votação termina em {tempo}'
  Segundo turno: 'Segundo turno termina em {tempo}'
  Proxima: 'Próxima eleição em {tempo}'
  Manual: 'Aguardando a staff abrir a eleição'

Saidas:
  FIM: '&7Fim do mandato'
  SUCESSOR: '&7Passou o cargo ao sucessor'
  RENUNCIA: '&eRenunciou'
  IMPEACHMENT: '&cSofreu impeachment'
  REMOVIDO: '&cRemovido pela staff'

Alvos:
  TODOS: 'todos os jogadores online'
  PRESIDENTE: 'o presidente'
  NENHUM: 'o servidor'

Tipos de imposto:
  GANHOS: 'sobre os ganhos'
  PATRIMONIO: 'sobre o saldo'
  COMANDO: 'sobre transferências'
  API: 'sobre o comércio'

Formatos:
  # Cada linha do {ranking} no anúncio do resultado.
  Linha do resultado: '   &e{posicao}º &f{candidato} &8- &a{votos} votos &7({percentual}%)'
  Linhas no resultado: 5
  # Cada linha do {impostos} no /presidente info.
  Linha do imposto: '  &8• &f{imposto}&7: &e{taxa}%'

# --------------------------------------------------------------------------
#  Anúncios para o servidor inteiro (vazio = não anuncia)
# --------------------------------------------------------------------------
Anuncios:
  Inscricoes abertas: |-
    &r
    &6&l   ELEIÇÕES PRESIDENCIAIS &8- &f#{numero}
    &7   As inscrições estão abertas por &f{tempo}&7!
    &7   Quer governar o servidor? &e/presidente candidatar
    &7   Taxa de inscrição: &a{taxa}
    &r
  Eleicao aberta: |-
    &r
    &6&l   ELEIÇÕES PRESIDENCIAIS &8- &f#{numero}
    &7   Candidaturas e votação abertas por &f{tempo}&7!
    &7   &e/presidente candidatar &7ou &e/presidente candidatos
    &r
  Votacao aberta: |-
    &r
    &6&l   A URNA ESTÁ ABERTA!
    &7   &f{candidatos} &7candidato(s) na disputa. Votação por &f{tempo}&7.
    &7   Vote em &e/presidente candidatos
    &r
  Segundo turno: |-
    &r
    &6&l   SEGUNDO TURNO!
    &7   &f{primeiro} &8({percentual_primeiro}%) &7x &f{segundo} &8({percentual_segundo}%)
    &7   Ninguém passou da metade. Vote de novo por &f{tempo}&7!
    &r
  Resultado: |-
    &r
    &6&l   RESULTADO DAS ELEIÇÕES
    &7   Novo presidente: &f&l{presidente} &7com &a{votos} &7votos (&f{percentual}%&7)
    {ranking}
    &7   Total: &f{total} &7votos de &f{eleitores} &7eleitores.
    &r
  Sem candidatos: |-
    &r
    &6&l   RESULTADO DAS ELEIÇÕES
    &c   Ninguém se candidatou.
    &7   {situacao}
    &r
  Sem votos: |-
    &r
    &6&l   RESULTADO DAS ELEIÇÕES
    &c   Não houve votos suficientes.
    &7   {situacao}
    &r
  Eleicao cancelada: '&cA eleição foi cancelada pela staff. &7{situacao}'
  Novo candidato: '&e{candidato} &7se candidatou à presidência! &8"&f{slogan}&8" &7({candidatos} na disputa)'
  Desistencia: '&e{candidato} &7desistiu da candidatura.'
  Posse: |-
    &r
    &6&l   POSSE PRESIDENCIAL
    &7   &f&l{presidente} &7é o novo presidente do servidor!
    &7   Mandato de &f{duracao}&7. Eleito com &a{votos} &7votos (&f{percentual}%&7).
    &r
  Posse pela staff: '&f{presidente} &7foi nomeado presidente pela staff. Mandato de &f{duracao}&7.'
  Fim do mandato: |-
    &r
    &6&l   FIM DE MANDATO
    &7   &f{presidente} &7deixou o cargo depois de &f{tempo}&7.
    &7   Arrecadou &a{arrecadado} &7e gastou &c{gasto} &7em &f{beneficios} &7benefício(s).
    &7   {situacao}
    &r
  Renuncia: '&e{presidente} &crenunciou à presidência! &7{situacao}'
  Removido: '&e{presidente} &cfoi removido da presidência pela staff. &7{situacao}'
  Impeachment: |-
    &r
    &4&l   IMPEACHMENT!
    &c   &f{presidente} &cfoi tirado do cargo pelo abaixo-assinado dos jogadores.
    &7   {situacao}
    &r
  Impeachment andamento: '&cImpeachment de &f{presidente}&c: &f{assinaturas}&c/&f{necessarias} &cassinaturas. &7(/presidente impeachment)'
  Imposto alterado: '&f{presidente} &7mudou o &f{imposto}&7: &f{antiga}% &8→ &f{taxa}% {seta}'
  Beneficio comprado: '&f{presidente} &7comprou &f{beneficio} &7para &f{jogadores} &7jogador(es) por &a{custo}&7!'
  Beneficio para o servidor: '&f{presidente} &7liberou &f{beneficio} &7para o servidor por &a{custo}&7!'
  Auxilio definido: '&f{presidente} &7definiu o auxílio em &a{valor} &7a cada &f{intervalo}&7.'
  Auxilio desligado: '&f{presidente} &7suspendeu o auxílio.'
  Auxilio pago: '&7Auxílio de &a{valor} &7pago a &f{jogadores} &7jogadores (&a{total}&7).'
  Auxilio sem verba: '&cO cofre não tem &f{total} &cpara o auxílio. Ninguém recebeu.'
  Pronunciamento: |-
    &r
    &6&l   PRONUNCIAMENTO OFICIAL &8- &f{presidente}
    &f   {mensagem}
    &r
  Doacao: '&a{jogador} &7doou &a{valor} &7ao cofre público!'
  Presidente entrou: '&6O presidente &f{presidente} &6entrou no servidor!'

Titulos:
  Inscricoes: |-
    &6&lELEIÇÕES
    &7Inscrições abertas
  Votacao: |-
    &6&lELEIÇÕES
    &7A urna está aberta!
  Segundo turno: |-
    &6&lSEGUNDO TURNO
    &7Vote de novo!
  Posse: |-
    &6&lPRESIDENTE
    &7Parabéns, {presidente}!
  Pronunciamento: |-
