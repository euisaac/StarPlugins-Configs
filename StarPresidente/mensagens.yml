    &7do presidente {presidente}

Avisos:
  Inscricoes: '&eAs inscrições para presidente terminam em &f{tempo}&e! &7({candidatos} candidato(s))'
  Votacao: '&eA votação termina em &f{tempo}&e! &7Ainda não votou? &f/presidente candidatos'
  Segundo turno: '&eO segundo turno termina em &f{tempo}&e!'
