      Lore:
        - '&7Mandato termina em: &f{tempo_mandato}'
        - '&7Cofre público: &a{cofre}'
        - '&7Impeachment: &f{impeachment}&7/&f{impeachment_necessarias}'
    Impostos:
      Slot: 19
      Material: 'GOLD_INGOT'
      Nome: '&6&lImpostos'
      Lore:
        - '&7Ajuste as taxas dentro dos'
        - '&7limites definidos pela staff.'
        - ''
        - '&eClique para ajustar'
      Acoes:
        - 'impostos'
    Beneficios:
      Slot: 21
      Material: 'CHEST'
      Nome: '&b&lComprar benefícios'
      Lore:
        - '&7Gaste a verba pública com'
        - '&7presentes para o servidor.'
        - '&7Cofre: &a{cofre}'
        - ''
        - '&eClique para comprar'
      Acoes:
        - 'beneficios'
    Auxilio:
      Slot: 23
      Condicao: auxilio
      Material: 'BREAD'
      Nome: '&a&lAuxílio'
      Lore:
        - '&7Valor pago pelo cofre a cada'
        - '&7jogador online, a cada {auxilio_intervalo}.'
        - ''
        - '&7Atual: &a{auxilio}'
        - ''
        - '&eClique para mudar (0 desliga)'
      Acoes:
        - 'auxilio'
    Pronunciamento:
      Slot: 25
      Condicao: pronunciamento
      Material: 'BELL|NOTE_BLOCK'
      Nome: '&e&lPronunciamento oficial'
      Lore:
        - '&7Fale com o servidor inteiro.'
        - ''
        - '&eClique para escrever'
      Acoes:
        - 'pronunciamento'
    Extrato:
      Slot: 30
      Material: 'EMERALD'
      Nome: '&a&lExtrato do cofre'
      Acoes:
        - 'extrato'
    Renunciar:
      Slot: 32
      Condicao: renunciar
      Material: 'BARRIER'
      Nome: '&c&lRenunciar'
      Lore:
        - '&7Deixa o cargo agora.'
      Acoes:
        - 'renunciar'
    Voltar:
      Slot: 27
      Material: 'ARROW'
      Nome: '&cVoltar'
      Acoes:
        - 'voltar'

