# ==========================================================================
#  StarPresidente - menus
#
#  Cada tela tem Titulo, Linhas (1 a 6), Enfeite (vidro de fundo) e Itens
#  (botões). As telas de lista também têm Slots (onde a lista entra), Item
#  (como cada linha é desenhada) e Vazio (quando não há nada).
#
#  Botão:
#    Slot / Slots    onde aparece
#    Material        item (modernos servem em todas as versões; 'A|B' = o
#                    primeiro que existir). Cabeça: PLAYER_HEAD + Dono ou Textura
#    Nome, Lore      textos (variáveis do mensagens.yml e PlaceholderAPI)
#    Brilho          true/false
#    Permissao       só aparece para quem tiver ('' = todos)
#    Condicao        só aparece quando vale ('!' nega; várias separadas por
#                    vírgula): tem_presidente, presidente (você é), eleicao,
#                    sem_eleicao, inscricoes, fase_inscricoes, votacao,
#                    segundo_turno, candidato, votou, assinou, admin,
#                    impeachment, doacoes, auxilio, pronunciamento, renunciar,
#                    desistir, automatico, voto_secreto, npc, historico
#    Acoes           o que o clique faz, uma por linha:
#                      principal / candidatos / impostos / beneficios /
#                      extrato / historico / gabinete      abre a tela
#                      candidatar / desistir / slogan / impeachment / doar
#                      auxilio / pronunciamento / renunciar  (presidente)
#                      admin / admin_ajustes / admin_impostos /
#                      admin_beneficios / admin_candidatos / admin_iniciar /
#                      admin_pular / admin_apurar / admin_cancelar /
#                      admin_definir / admin_remover / admin_recarregar /
#                      'admin_cofre depositar|retirar|definir' /
#                      'admin_npc criar|remover'              (staff)
#                      voltar / fechar / anterior / proxima / atualizar
#                      jogador: <comando>   console: <comando>
#                      mensagem: <texto>    som: <SOM>
#                    Com o clique na frente só roda nesse clique:
#                      '[esquerdo] ...', '[direito] ...', '[shift] ...'
# ==========================================================================

Versao do modelo: 1

# --------------------------------------------------------------------------
#  /presidente
# --------------------------------------------------------------------------
Principal:
  Titulo: '&8Presidência'
  Linhas: 5
  Enfeite:
    Ativar: true
    Material: 'BLACK_STAINED_GLASS_PANE'
    Nome: ' '
  Itens:
    Presidente:
      Slot: 13
      Condicao: tem_presidente
      Material: 'PLAYER_HEAD'
      Dono: '{presidente}'
      Nome: '&6&lPresidente &f{presidente}'
      Lore:
        - '&8{tag}'
        - ''
        - '&7Mandato termina em: &f{tempo_mandato}'
        - '&7No cargo há: &f{mandato_tempo_no_cargo}'
        - '&7Eleito com: &a{mandato_votos} votos &8({mandato_percentual}%)'
        - ''
        - '&7Arrecadado no mandato: &a{mandato_arrecadado}'
        - '&7Gasto em benefícios: &c{mandato_gasto} &8({mandato_beneficios})'
        - '&7Auxílio atual: &a{auxilio}'
        - ''
        - '&7{situacao}'
    Sem presidente:
      Slot: 13
      Condicao: '!tem_presidente'
      Material: 'SKELETON_SKULL|SKULL_ITEM'
      Nome: '&7&lCargo vago'
      Lore:
        - '&7O servidor está sem presidente.'
        - ''
        - '&7{situacao}'
    Inscricoes:
      Slot: 20
      Condicao: 'inscricoes,!candidato'
      Material: 'WRITABLE_BOOK|BOOK_AND_QUILL'
      Nome: '&e&lCandidatar-se'
      Lore:
        - '&7Quer governar o servidor?'
        - ''
        - '&7Taxa de inscrição: &a{taxa_inscricao}'
        - '&7Candidatos: &f{candidatos}'
        - '&7{situacao}'
        - ''
        - '&eClique para se candidatar'
      Acoes:
        - 'candidatar'
    Sou candidato:
      Slot: 20
      Condicao: candidato
      Material: 'NAME_TAG'
      Nome: '&a&lVocê é candidato'
      Lore:
        - '&7{situacao}'
        - ''
        - '&eEsquerdo &7troca o slogan'
        - '&eDireito &7desiste da candidatura'
      Acoes:
        - '[esquerdo] slogan'
        - '[direito] desistir'
    Votacao:
      Slot: 20
      Condicao: 'votacao,!candidato,!inscricoes'
      Material: 'PAPER'
      Brilho: true
      Nome: '&a&lA urna está aberta!'
      Lore:
        - '&7{fase}&7: termina em &f{tempo_fase}'
        - '&7Candidatos: &f{candidatos}'
        - '&7Seu voto: &f{meu_voto}'
        - ''
        - '&eClique para votar'
      Acoes:
        - 'candidatos'
    Sem eleicao:
      Slot: 20
      Condicao: sem_eleicao
      Material: 'CLOCK|WATCH'
      Nome: '&7&lEleições'
      Lore:
        - '&7{situacao}'
        - '&7Eleições já realizadas: &f{eleicao}'
    Candidatos:
      Slot: 21
      Material: 'ARMOR_STAND'
      Nome: '&e&lCandidatos'
      Lore:
        - '&7{candidatos} candidato(s) &8| &7{eleitores} eleitor(es)'
        - '&7Liderando: &f{lider}'
        - ''
        - '&eClique para ver (e votar)'
      Acoes:
        - 'candidatos'
    Impostos:
      Slot: 22
      Material: 'GOLD_INGOT'
      Nome: '&6&lImpostos'
      Lore:
        - '&7As taxas que o presidente definiu.'
        - ''
        - '&eClique para ver'
      Acoes:
        - 'impostos'
    Beneficios:
      Slot: 23
      Material: 'CHEST'
      Nome: '&b&lBenefícios'
      Lore:
        - '&7O que o governo pode comprar'
        - '&7com a verba pública.'
        - ''
        - '&eClique para ver'
      Acoes:
        - 'beneficios'
    Cofre:
      Slot: 24
      Material: 'EMERALD'
      Nome: '&a&lCofre público'
      Lore:
        - '&7Saldo: &a{cofre}'
        - ''
        - '&eEsquerdo &7extrato (transparência)'
        - '&eDireito &7doar ao cofre'
      Acoes:
        - '[esquerdo] extrato'
        - '[direito] doar'
    Historico:
      Slot: 30
      Material: 'BOOK'
      Nome: '&f&lPresidentes anteriores'
      Lore:
        - '&7{mandatos} mandato(s) no histórico.'
        - ''
        - '&eClique para ver'
      Acoes:
        - 'historico'
    Impeachment:
      Slot: 31
      Condicao: 'impeachment,!presidente'
      Material: 'IRON_AXE'
      Nome: '&c&lImpeachment'
      Lore:
        - '&7Abaixo-assinado para tirar o presidente.'
        - ''
        - '&7Assinaturas: &f{impeachment}&7/&f{impeachment_necessarias}'
        - '&7Você assinou: {assinou}'
        - ''
        - '&eClique para assinar (ou retirar)'
      Acoes:
        - 'impeachment'
    Gabinete:
      Slot: 32
      Condicao: presidente
      Material: 'GOLDEN_HELMET|GOLD_HELMET'
      Brilho: true
      Nome: '&6&lGabinete presidencial'
      Lore:
        - '&7Impostos, benefícios, auxílio'
        - '&7e pronunciamentos.'
        - ''
        - '&eClique para governar'
      Acoes:
        - 'gabinete'
    Fechar:
      Slot: 40
      Material: 'RED_DYE|INK_SACK:1'
      Nome: '&cFechar'
      Acoes:
        - 'fechar'
    Staff:
      Slot: 44
      Permissao: 'starpresidente.admin'
      Material: 'COMMAND_BLOCK'
      Nome: '&c&lPainel da staff'
      Lore:
        - '&7Eleições, presidente, cofre,'
        - '&7impostos, benefícios e regras.'
      Acoes:
        - 'admin'

# --------------------------------------------------------------------------
#  Gabinete (só o presidente)
# --------------------------------------------------------------------------
Gabinete:
