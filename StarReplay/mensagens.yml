# Mensagens do StarReplay. Mensagem vazia ('') nao e enviada.
# Titulos: 'Titulo<nl>Subtitulo'.
Versao do modelo: 1

Prefixo: '&8[&bReplay&8] &7'

Sem permissao: '&cVoce nao tem permissao para isso.'
Recarregado: '&aConfiguracoes recarregadas.'
Jogador offline: '&cO jogador &f{jogador} &cnao esta online.'

Ajuda:
  - ''
  - '&b&lStarReplay &7- comandos'
  - '&f/{comando} &7- lista de replays'
  - '&f/{comando} assistir <id> [tempo] &7- assiste (tempo: 90, 1:30)'
  - '&f/{comando} sair &7- sai do replay'
  - '&f/{comando} info <id> &7- detalhes de um replay'
  - '&f/{comando} gravar <jogador> [segundos] &7- grava em volta de alguem'
  - '&f/{comando} parar <id|jogador> &7- para uma gravacao manual'
  - '&f/{comando} gravando &7- gravacoes em andamento'
  - '&f/{comando} lista [jogador] &7- ultimos replays no chat'
  - '&f/{comando} <jogador> &7- replays em que ele aparece'
  - '&f/{comando} entrar <jogador> &7- assiste junto com alguem'
  - '&f/{comando} apagar|proteger <id>'
  - '&f/{comando} recarregar'
  - ''

Info:
  - ''
  - '&b&lReplay &f{id}'
  - '&7Tipo: &f{tipo} &8| &7Jogo: &f{jogo}'
  - '&7Arena: &f{arena} &8| &7Modo: &f{modo}'
  - '&7Data: &f{data} &8| &7Duracao: &f{duracao}'
  - '&7Jogadores: &f{jogadores}'
  - '&7Vencedor: &f{vencedor}'
  - '&7Reportes: &f{reportes} &8| &7Protegido: &f{protegido}'
  - '&7Servidor: &f{servidor} &8| &7Tamanho: &f{tamanho} KB'
  - ''

Uso:
  Assistir: '&cUse: /replay assistir <id> [tempo]'
  Gravar: '&cUse: /replay gravar <jogador> [segundos]'
  Parar: '&cUse: /replay parar <id|jogador>'
  Info: '&cUse: /replay info <id>'
  Apagar: '&cUse: /replay apagar <id>'
  Proteger: '&cUse: /replay proteger <id>'
  Entrar: '&cUse: /replay entrar <jogador>'

Replay:
  Preparando: '&7Preparando o replay...'
  Montando cenario: '&7Montando o cenario (&f{blocos} &7blocos)...'
  Sem cenario: '&eEste replay nao tem mapa nem cenario guardado: os jogadores aparecem no vazio.'
  Tocando: '&aAssistindo &f{jogo} &8- &f{arena} &7({duracao}). &7Use a barra para controlar.'
  Nao existe: '&cReplay nao encontrado.'
  Ainda gravando: '&eEste replay ainda esta sendo gravado. Tente de novo em alguns segundos.'
  Ja assistindo: '&cVoce ja esta assistindo um replay. Use /replay sair.'
  Em partida: '&cSaia da partida antes de assistir um replay.'
  Lotado: '&cMuitos replays abertos agora. Tente daqui a pouco.'
  Outro servidor: '&cEste replay esta guardado no servidor &f{servidor}&c.'
  Quebrado: '&cNao foi possivel abrir este replay: &7{erro}'
  Sem mapa: '&cNao foi possivel montar o mundo do replay.'
  Nao assiste: '&c{jogador} nao esta assistindo nenhum replay.'
  Nao esta assistindo: '&cVoce nao esta assistindo nenhum replay.'
  Saiu: '&7Voce saiu do replay.'
  Sem estado: '&cNao foi possivel guardar o seu inventario agora; o replay nao foi aberto.'
  Restaurado: '&aSeu inventario e sua posicao foram devolvidos (o servidor caiu durante um replay).'
  Apagado: '&aReplay &f{id} &aapagado.'
  Protegido: '&aReplay &f{id} &aprotegido da limpeza automatica.'
  Desprotegido: '&eReplay &f{id} &evoltou a ser apagado pela limpeza automatica.'
  Alvo saiu: '{jogador} saiu do servidor'
  Vitoria: 'Vitoria de {vencedor}'
  Fim: '&7O replay terminou. Clique em &fContinuar &7para ver de novo ou em &fSair&7.'
  Fim titulo: '&bFim do replay'
  Chat: '&8[Replay] &f{jogador}&7: {mensagem}'
  Evento: '&e{evento}'
  Evento titulo: '<nl>&e{evento}'
  Morte: '&c{jogador} &7morreu.'
  Abate: '&c{jogador} &7foi morto por &c{assassino}&7.'
  Morte titulo: '<nl>{jogador} &7morreu'
  Abate titulo: '<nl>{assassino} &7matou {jogador}'
  Reporte: '&c&lREPORTE &f{alvo} &7reportado por &f{autor}&7: &f{motivo}'
  Reporte titulo: '&c&lREPORTE<nl>&f{alvo}'
  Seguindo: '&aSeguindo &f{jogador} &7({camera}).'
  Camera: '&7Camera: &f{camera}'
  Sem posicao: '&cEste jogador ainda nao apareceu no replay.'
  Ninguem para seguir: '&cNinguem aparece no replay agora.'
  Somente o dono: '&cSo quem abriu o replay controla o tempo.'
  Sem reporte: '&cEste replay nao tem reporte marcado.'
  Indo ao reporte: '&aIndo para o reporte em &f{tempo}&a.'
  Barra: '{barra} &f{tempo}&7/&f{total} &8| &e{velocidade} &8| &7{estado} &8| &b{seguindo}'

Linha do tempo:
  Morte: '{jogador} &7morreu'
  Abate: '{assassino} &7matou {jogador}'
  Evento: '&e{evento}'
  Reporte: '&c{alvo} &7reportado por &f{autor}&7: &f{motivo}'

Gravacao:
  Iniciada: '&aGravando &f{jogador} &apor &f{segundos}s &7(id &f{id}&7).'
  Nao deu: '&cNao foi possivel gravar este jogador agora.'
  Nao encontrada: '&cNenhuma gravacao manual ou de reporte com esse id/jogador.'
  Parada: '&aGravacao &f{id} &aencerrada; o replay sera guardado em instantes.'

Lista:
  Cabecalho: '&b{quantidade} &7replay(s) guardado(s):'
  Linha: ' &8- &f{id} &7{tipo} &f{jogo} &7{arena} &8| &7{data} &8| &f{duracao} &8| &c{reportes} rep.'

Gravando:
  Cabecalho: '&b{quantidade} &7gravacao(oes) em andamento; &f{memoria} &7jogador(es) na memoria.'
  Linha: ' &8- &f{id} &7{tipo} &f{jogo} &7{arena} &8| &f{tempo} &8| &f{jogadores} jogador(es)'

Menu:
  Jogador na lore: ' &8- &f{jogador}'
  E mais: ' &8... e mais {quantidade}'
  Confirmar apagar: 'Apagar o replay {id}?'
  Filtro escolhido: ' &a> {filtro}'
  Filtro outro: ' &7  {filtro}'

Etiquetas:
  Dia: 'd'
  Hora: 'h'
  Minuto: 'min'
  Segundo: 's'
  Sim: '&aSim'
  Nao: '&cNao'
  Nenhum: '&7-'
  Ninguem: 'ninguem'
  Tocando: '&aTocando'
  Pausado: '&ePausado'
  Terminou: '&cFim'
  Em jogo: '&aAparecendo'
  Fora: '&7Fora de cena'
  Reportado: '&c&lREPORTADO'
  Ja passou: '&7Ja passou'
  Ainda vem: '&aAinda vem'
  Camera LIVRE: 'livre'
  Camera PRIMEIRA: 'primeira pessoa'
  Camera TERCEIRA: 'terceira pessoa'
  Filtro MEUS: 'Minhas partidas'
  Filtro PARTIDAS: 'Partidas'
  Filtro REPORTES: 'Reportes'
  Filtro MANUAIS: 'Gravacoes manuais'
  Filtro FAVORITOS: 'Favoritos'
  Filtro TODOS: 'Todos'
