# ---------------------------------------------------------------------------
#  StarGamesClan - as telas
#
#  Slot -1 esconde o item: e assim que voce tira um botao do menu sem precisar
#  de uma opcao "Ativar" para cada um.
#
#  Em "Clan" valem {jogador} {tag} {cor} {nome} {dono} {cargo} {membros}
#  {maximo de membros} {online} {pontos} {vitorias} {partidas} {abates}
#  {camas} {aproveitamento} {posicao}.
#  Em "Membros" valem {jogador} {cargo} {estado} {tag} {cor}.
#  Em "Top" valem {posicao} e as mesmas contas do clan.
# ---------------------------------------------------------------------------
Versao do modelo: 2

# A tela de /clan de quem JA tem clan.
Clan:
  Titulo: '&8Clan {tag}'
  Linhas: 5
  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  # O item do meio. Com PLAYER_HEAD ele vira a cabeca do dono do clan.
  Escudo:
    Slot: 13
    Material: 'PLAYER_HEAD'
    Nome: '{cor}&l{tag} &8- &f{nome}'
    Lore:
      - '&7Dono: &f{dono}'
      - '&7Seu cargo: &r{cargo}'
      - '&7Membros: &f{membros}&7/&f{maximo de membros} &8(&a{online} online&8)'
      - ''
      - '&7Pontos: &e{pontos}'
      - '&7Posicao no top: &e#{posicao}'
      - '&7Vitorias: &f{vitorias}&7/&f{partidas} &8(&f{aproveitamento}%&8)'
      - '&7Abates: &f{abates}   &7Camas: &f{camas}'

  Membros:
    Slot: 29
    Material: 'PLAYER_HEAD'
    Nome: '&bMembros'
    Lore:
      - '&7Veja o time do clan.'
      - ''
      - '&eClique para abrir'

  Top:
    Slot: 31
    Material: 'NETHER_STAR'
    Nome: '&6Top clans'
    Lore:
      - '&7Os clans com mais pontos.'
      - ''
      - '&eClique para abrir'

  Chat:
    Slot: 33
    Material: 'PAPER'
    Nome: '&aChat do clan'
    Lore:
      - '&7Fala so com os seus membros.'
      - ''
      - '&eClique para ligar/desligar'

  # So aparece com o StarDiscordClan ligado E para o clan que tem o Discord
  # (/stargamesclan discord <tag> ligar). -1 esconde de vez.
  # Quem atualizou da 1.0.0 nao tem esta secao no arquivo: o botao aparece com
  # estes valores mesmo assim. Para mudar, copie a secao para o seu menus.yml.
  Discord:
    Slot: 22
    Material: 'LAPIS_LAZULI'
    Nome: '&9&lDiscord do clan'
    Lore:
      - '&7O cargo, o chat e a call'
      - '&7do clan no Discord do servidor.'
      - ''
      - '&eClique para abrir'
    # O comando que o botao roda (o do StarDiscordClan).
    Comando: 'discordclan'

  # Os dois dividem o mesmo lugar: quem ve "Sair" e o membro, e quem ve
  # "Desfazer" e o dono. O dono nao sai do proprio clan -- com gente dentro ele
  # precisa transferir antes, e sozinho sair e desfazer dao no mesmo.
  Sair:
    Slot: 40
    Material: 'IRON_DOOR'
    Nome: '&cSair do clan'
    Lore:
      - '&7Voce deixa de ser membro.'
      - ''
      - '&eClique para sair'

  Desfazer:
    Slot: 40
    Material: 'TNT'
    Nome: '&c&lDesfazer o clan'
    Lore:
      - '&7O clan acaba para todos os'
      - '&7membros, com os pontos dele.'
      - ''
      - '&cIsso nao tem volta.'
      - '&eClique e confirme no chat'

  Fechar:
    Slot: 44
    Material: 'RED_DYE'
    Nome: '&cFechar'
    Lore: []

# A tela de /clan de quem AINDA NAO tem clan.
Sem clan:
  Titulo: '&8Clans'
  Linhas: 3
  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  Criar:
    Slot: 11
    Material: 'NETHER_STAR'
    Nome: '&aCriar um clan'
    Lore:
      - '&7Abra o seu clan e chame o time.'
      - '&7Tag de &f{minimo} &7a &f{maximo} &7caracteres.'
      - ''
      - '&eClique para ver o comando'

  Top:
    Slot: 15
    Material: 'GOLD_INGOT'
    Nome: '&6Top clans'
    Lore:
      - '&7Clans no servidor: &f{clans}'
      - ''
      - '&eClique para abrir'

  Fechar:
    Slot: 22
    Material: 'RED_DYE'
    Nome: '&cFechar'
    Lore: []

Membros:
  Titulo: '&8Membros de {tag}'
  Linhas: 6
  Slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  Enfeite:
    Ativar: false
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  Membro:
    Material: 'PLAYER_HEAD'
    Nome: '&f{jogador}'
    Lore:
      - '&7Cargo: &r{cargo}'
      - '&7Agora: &r{estado}'
      - ''
      - '&7Dono e capitao:'
      - '&eEsquerdo &8- &7promover'
      - '&eDireito &8- &7rebaixar'
      - '&eShift + direito &8- &7expulsar'

  Voltar:
    Slot: 49
    Material: 'ARROW'
    Nome: '&cVoltar'
    Lore: []

Top:
  Titulo: '&8Top clans'
  Linhas: 6
  Slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  Enfeite:
    Ativar: false
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  Clan:
    Material: 'PLAYER_HEAD'
    Nome: '&e#{posicao} {cor}&l{tag} &8- &f{nome}'
    Lore:
      - '&7Dono: &f{dono}'
      - '&7Membros: &f{membros} &8(&a{online} online&8)'
      - ''
      - '&7Pontos: &e{pontos}'
      - '&7Vitorias: &f{vitorias}&7/&f{partidas} &8(&f{aproveitamento}%&8)'
      - '&7Abates: &f{abates}   &7Camas: &f{camas}'
    # Usada so na linha do clan de quem esta olhando.
    Lore do seu:
      - '&7Dono: &f{dono}'
      - '&7Membros: &f{membros} &8(&a{online} online&8)'
      - ''
      - '&7Pontos: &e{pontos}'
      - '&7Vitorias: &f{vitorias}&7/&f{partidas} &8(&f{aproveitamento}%&8)'
      - '&7Abates: &f{abates}   &7Camas: &f{camas}'
      - ''
      - '&a&lESTE E O SEU CLAN'

  Voltar:
    Slot: 49
    Material: 'ARROW'
    Nome: '&cVoltar'
    Lore: []
