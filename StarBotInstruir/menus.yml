# ---------------------------------------------------------------------------
#  StarBotInstruir - telas
#
#  Slot: -1 esconde o botao. As posicoes vao de 0 ate o tamanho do menu -1
#  (uma linha tem 9 slots).
#
#  Marcadores: {bot} {perfil} {clan} {cargo} {vip} {discord} {sequencia} {visitas}
#              {nivel} {pagina} {paginas} {quantidade}
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# CABECA CUSTOMIZADA -- vale para qualquer item de menu deste arquivo
# ---------------------------------------------------------------------------
# Para o item ser uma cabeca, use o material 'PLAYER_HEAD' (ou 'SKULL_ITEM:3'
# na 1.8) e UM destes dois campos:
#
#       Material: 'PLAYER_HEAD'
#       # Cabeca do minecraft-heads.com: abra a cabeca no site e copie o campo
#       # "Value" (base64). Vale tambem a URL da textura
#       # (http://textures.minecraft.net/texture/...) ou so o hash do fim dela.
#       Textura: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWUzYThhYTg1NTU0MWUxODUyYzEyOWFiODBiMTg1ZmRhZWI4NGYwZGI3ZjhiYTdjMTRkZjAxNTBjN2QyNGI5ZCJ9fX0='
#       # ...ou a cabeca de um jogador, pelo nick (no lugar de "Textura"):
#       Dono: 'Notch'
#
# Com "Textura" ou "Dono" o item vira cabeca mesmo que o material seja outro,
# mantendo nome, lore e quantidade. Os dois juntos: vale a "Textura".
#
# A cabeca por "Dono" so mostra a skin de quem o servidor ja conhece (jogador
# online, ou cuja skin ja esta guardada no servidor); de quem nao conhece fica a
# cabeca padrao (Steve) -- o servidor nao pergunta a Mojang para nao travar o
# menu. Para um icone fixo use sempre "Textura".
# ---------------------------------------------------------------------------

Versao do modelo: 1

#
# ═══════════════════════════════  LISTA DOS BOTS  ═══════════════════════════
#
Bots:
  Titulo: '&8Bots online ({quantidade})'
  Linhas: 6

  Slots: [ 10, 11, 12, 13, 14, 15, 16,
           19, 20, 21, 22, 23, 24, 25,
           28, 29, 30, 31, 32, 33, 34 ]

  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  # A cabeca de cada bot.
  Item:
    Nome: '&f{bot}'
    Lore:
      - '&7Perfil: &f{perfil}'
      - '&7Clan: &f{clan} &8({cargo})'
      - '&7Vip: &f{vip}'
      - '&7Discord: {discord}'
      - '&7Sequencia: &f{sequencia} dia(s)'
      - ''
      - '&aClique para abrir.'

  Botoes:
    Voltar:
      Slot: 49
      Material: 'RED_DYE'
      Nome: '&cFechar'
      Lore: []
    Anterior:
      Slot: 48
      Material: 'ARROW'
      Nome: '&aPagina anterior'
      Lore: [ '&7Pagina {pagina} de {paginas}' ]
    Proxima:
      Slot: 50
      Material: 'ARROW'
      Nome: '&aProxima pagina'
      Lore: [ '&7Pagina {pagina} de {paginas}' ]
    Instruir todos:
      Slot: 45
      Material: 'NETHER_STAR'
      Nome: '&d&lINSTRUIR TODOS'
      Lore:
        - '&7Aplica clan, sequencia, discord,'
        - '&7vip e inventario em todos os'
        - '&7bots online, de acordo com o perfil'
        - '&7de cada um.'
        - ''
        - '&aClique para aplicar.'

#
# ═════════════════════════════════  UM BOT  ═════════════════════════════════
#
Bot:
  Titulo: '&8Bot: {bot}'
  Linhas: 4

  Enfeite:
    Ativar: true
    Material: 'GRAY_STAINED_GLASS_PANE'
    Nome: ' '

  Botoes:
    Cabeca:
      Slot: 4
      Nome: '&f{bot}'
      Lore:
        - '&7Perfil: &f{perfil}'
        - '&7Visitas: &f{visitas}'
        - '&7Nivel: &f{nivel}'
    Instruir:
      Slot: 10
      Material: 'NETHER_STAR'
      Nome: '&d&lINSTRUIR'
      Lore:
        - '&7Aplica tudo de novo, conforme'
        - '&7o perfil que ele ja tem.'
        - ''
        - '&aClique para aplicar.'
    Clan:
      Slot: 11
      Material: 'WHITE_BANNER'
      Nome: '&e&lCLAN'
      Lore:
        - '&7Atual: &f{clan} &8({cargo})'
        - ''
        - '&aEsquerdo: &7entrar num clan com vaga'
        - '&cDireito: &7sair do clan'
    Discord:
      Slot: 12
      Material: 'NAME_TAG'
      Nome: '&9&lDISCORD'
      Lore:
        - '&7Atual: {discord}'
        - ''
        - '&aClique para alternar.'
    Vip:
      Slot: 13
      Material: 'DIAMOND'
      Nome: '&b&lVIP'
      Lore:
        - '&7Atual: &f{vip}'
        - ''
        - '&aClique para sortear um vip.'
    Sequencia:
      Slot: 14
      Material: 'CLOCK'
      Nome: '&6&lSEQUENCIA'
      Lore:
        - '&7Atual: &f{sequencia} dia(s)'
        - ''
        - '&aEsquerdo: &7sortear uma nova'
        - '&cDireito: &7quebrar (recomecar em 1)'
    Inventario:
      Slot: 15
      Material: 'CHEST'
      Nome: '&a&lINVENTARIO'
      Lore:
        - '&7Gera um inventario novo com o'
        - '&7perfil &f{perfil}&7 e equipa.'
        - ''
        - '&aClique para gerar.'
    Equipar:
      Slot: 16
      Material: 'IRON_CHESTPLATE'
      Nome: '&f&lEQUIPAR'
      Lore:
        - '&7Veste a melhor armadura e poe'
        - '&7as ferramentas na hotbar.'
        - ''
        - '&aClique para equipar.'
    Refazer:
      Slot: 22
      Material: 'TNT'
      Nome: '&c&lREFAZER PERFIL'
      Lore:
        - '&7Apaga o perfil e conhece o bot'
        - '&7de novo, do zero.'
        - ''
        - '&cClique para refazer.'
    Voltar:
      Slot: 27
      Material: 'RED_DYE'
      Nome: '&cVoltar'
      Lore: []
