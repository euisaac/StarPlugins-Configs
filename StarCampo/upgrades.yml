# ==========================================================================
#  StarCampo - upgrades
#
#  Os upgrades são do jogador (valem em todos os campos, com qualquer
#  ferramenta) e são comprados no /campo upgrades.
#
#  Efeito         o que o nível faz:
#    FORTUNA      % a mais de itens por planta
#    VENDA        % a mais no dinheiro da venda
#    GRAOS        % a mais de grãos (e de chance de cair grão)
#    AREA         colhe em volta: cada nível soma 'Bonus por nivel' ao raio
#                 (raio 1 = 3x3, 2 = 5x5...; teto em config.yml)
#    CRESCIMENTO  % a menos no tempo para a planta colhida crescer de novo
#                 (máximo 90%)
#    SORTE        pontos de chance (%) de uma colheita rara (config.yml)
#    VELOCIDADE   nível do efeito de velocidade dentro dos campos
#    EXPERIENCIA  % a mais de experiência
#  Bonus por nivel   quanto cada nível soma
#  Custo             Moeda ('graos' ou uma economia do economias.yml),
#                    Inicial (preço do 1º nível) e Aumento (% a cada nível)
#  Rank minimo       rank do ranks.yml para comprar (vazio = livre)
#  Slot              posição no menu (-1 = nos 'Slots' do menus.yml)
# ==========================================================================

