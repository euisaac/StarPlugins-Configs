# ==========================================================================
#  StarCampo - ranks do campo
#
#  São os níveis do próprio StarCampo, sem relação com o rank do servidor
#  (StarRankup ou outro): liberam campos ('Rank necessario' no campos.yml)
#  e upgrades ('Rank minimo') e dão bônus de venda e de grãos.
#
#  A ordem do arquivo é a ordem dos ranks; o primeiro é o de quem começa.
#  Custo            lista 'moeda:valor' (graos ou uma economia do
#                   economias.yml). Aceita 5K, 1.5M...
#  Requisitos       Colheitas (plantas colhidas no total) e Vendido (total
#                   vendido) que o jogador precisa ter
#  Bonus de venda / de graos   % a mais enquanto estiver neste rank
#  Comandos         rodam no console ao chegar no rank ({jogador})
#  Anunciar         avisa o servidor quando alguém chega (config.yml)
# ==========================================================================

