# ==========================================================================
#  StarCampo - menus
#
#  Cada tela tem:
#    Titulo, Linhas (1 a 6)
#    Enfeite      vidro de fundo (Ativar, Material, Nome)
#    Slots        onde entra o conteúdo da tela (campos, upgrades, ranks, top)
#    Itens        os botões. Cada botão aceita:
#      Slot / Slots, Material, Textura (cabeça), Dono (nick da cabeça), Nome,
#      Lore, Brilho, Quantidade, Permissao (+ 'Esconder sem permissao'),
#      Condicao     o botão só aparece quando a condição vale. '!' nega e
#                   várias vão separadas por vírgula. Dois botões no MESMO
#                   slot com condições opostas = um botão que muda de cara.
#      Acoes        o que o clique faz. Comece a linha com o clique:
#                   [esquerdo] [direito] [shift] [shift_esquerdo]
#                   [shift_direito] [meio] [q]  -- sem colchetes = qualquer.
#
#  Ações que servem em qualquer tela:
#    campos, upgrades, ranks, top [colheitas|vendido|graos], rankup, vender,
#    autovenda, sair, ir <campo>, voltar, anterior, proxima, atualizar,
#    fechar, som: NOME, mensagem: texto, comando: /cmd (como o jogador),
#    console: cmd, op: cmd, titulo: Titulo<nl>Subtitulo, actionbar: texto
#
#  Condições (tela Campos): autovenda (a venda automática está valendo
#    para o jogador), venda_automatica (ligada no servidor), pode_desligar,
#    no_campo
#
#  Variáveis do jogador (todas as telas): {jogador} {graos} {graos_numero}
#  {graos_total} {moeda} {colhidas} {vendido} {rank} {rank_tag}
#  {proximo_rank} {proximo_custo} {campo_atual} {autovenda} {bonus_venda}
#  {bonus_graos} {pagina} {paginas}
# ==========================================================================

Versao do modelo: 1

# --------------------------------------------------------------------------
#  /campo - os campos. O lugar de cada campo é o 'Slot' dele no campos.yml;
#  os que estão com Slot -1 entram nos 'Slots' daqui.
#  Variáveis do campo: {campo} {id} {rank_necessario} {jogadores} {limite}
#  {multiplicador} {multiplicador_graos} {plantas}
#  'Estado' acrescenta linhas na lore conforme a situação do campo para o
#  jogador: liberado, sem_rank, sem_permissao, cheio, em_obras, carregando.
#  'Material bloqueado' troca o ícone do campo que o jogador não pode entrar
#  (vazio = mantém o ícone do campo).
# --------------------------------------------------------------------------
Campos:
  Titulo: '&8Campos de fazenda'
  Linhas: 5
  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
  Slots: [28, 29, 30, 31, 32, 33, 34]
  Estado:
    Material bloqueado: ''
    liberado:
      - ''
      - ' &7Venda: &fx{multiplicador} &8| &7Grãos: &fx{multiplicador_graos}'
      - ' &7Jogadores: &f{jogadores}'
      - ''
      - '&aClique para ir!'
    sem_rank:
      - ''
      - ' &7Precisa do rank: &f{rank_necessario}'
      - ''
      - '&cBloqueado.'
    sem_permissao:
      - ''
      - '&cCampo exclusivo.'
    cheio:
      - ''
      - ' &7Jogadores: &f{jogadores}&7/&f{limite}'
      - ''
      - '&cO campo está cheio.'
    em_obras:
      - ''
      - '&eO campo está sendo montado...'
    carregando:
      - ''
      - '&eCarregando os seus dados...'
  Itens:
    Perfil:
      Slot: 4
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Nome: '&e{jogador}'
      Lore:
        - ''
        - ' &7Rank: &f{rank}'
        - ' &7Próximo rank: &f{proximo_rank}'
        - ''
        - ' &7Grãos: {graos}'
        - ' &7Plantas colhidas: &f{colhidas}'
        - ' &7Total vendido: &a{vendido}'
        - ''
        - ' &7Bônus de venda: &a+{bonus_venda}%'
        - ' &7Bônus de grãos: &e+{bonus_graos}%'
        - ' &7Venda automática: {autovenda}'
    Upgrades:
      Slot: 38
      Material: EXPERIENCE_BOTTLE
      Nome: '&a&lUpgrades'
      Lore:
        - '&7Melhore a sua colheita com grãos.'
        - ''
        - '&eClique para abrir.'
      Acoes:
        - 'upgrades'
    Ranks:
      Slot: 39
      Material: NAME_TAG
      Nome: '&6&lRanks'
      Lore:
        - '&7Rank atual: &f{rank}'
        - '&7Próximo: &f{proximo_rank}'
        - ''
        - '&eClique para abrir.'
      Acoes:
        - 'ranks'
    Sair:
      Slot: 40
      Material: OAK_DOOR
      Condicao: 'no_campo'
      Nome: '&c&lSair do campo'
      Lore:
        - '&7Volta para o spawn.'
      Acoes:
        - 'sair'
    Fechar:
      Slot: 40
      Material: RED_DYE
      Condicao: '!no_campo'
      Nome: '&cFechar'
      Acoes:
        - 'fechar'
    Top:
      Slot: 41
      Material: GOLD_INGOT
      Nome: '&e&lTop do campo'
      Lore:
        - '&7Os maiores fazendeiros.'
        - ''
        - '&eClique para abrir.'
      Acoes:
        - 'top'
    Vender:
      Slot: 42
      Material: CHEST
      Condicao: '!autovenda'
      Nome: '&a&lVender colheitas'
      Lore:
        - '&7Vende as plantações do inventário.'
        - ''
        - '&eClique para vender.'
      Acoes:
        - 'vender'
    Autovenda ligada:
      Slot: 43
      Material: LIME_DYE
      Condicao: 'pode_desligar,autovenda'
      Nome: '&aVenda automática: ligada'
      Lore:
        - '&7Clique para desligar.'
      Acoes:
        - 'autovenda'
    Autovenda desligada:
      Slot: 43
      Material: GRAY_DYE
      Condicao: 'pode_desligar,!autovenda'
      Nome: '&cVenda automática: desligada'
      Lore:
        - '&7Clique para ligar.'
      Acoes:
        - 'autovenda'

# --------------------------------------------------------------------------
#  Upgrades. O lugar de cada upgrade é o 'Slot' dele no upgrades.yml.
#  Esquerdo compra 1 nível; shift compra até 'Niveis no shift'.
#  Variáveis do upgrade: {upgrade} {nivel} {maximo} {bonus} {proximo_bonus}
#  {custo} {rank_minimo}
#  'Formato.Lore' vai embaixo da descrição de todos; depois entra a lista
#  da situação: ok, maximo, sem_saldo, rank, carregando.
# --------------------------------------------------------------------------
Upgrades:
  Titulo: '&8Upgrades do campo'
  Linhas: 4
  Niveis no shift: 10
  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
  Slots: [19, 20, 21, 23, 24, 25]
  Formato:
    Lore:
      - ''
      - ' &7Nível: &f{nivel}&7/&f{maximo}'
      - ' &7Atual: &a{bonus}'
      - ' &7Próximo: &a{proximo_bonus}'
      - ' &7Custo: &f{custo}'
      - ''
    ok:
      - '&aClique para melhorar!'
      - '&7Shift: compra vários níveis.'
    maximo:
      - '&6Nível máximo!'
    sem_saldo:
      - '&cVocê não tem o suficiente.'
    rank:
      - '&cPrecisa do rank &f{rank_minimo}&c.'
    carregando:
      - '&eCarregando...'
  Itens:
    Saldo:
      Slot: 4
      Material: SUNFLOWER
      Nome: '&eSeus grãos'
      Lore:
        - ' {graos}'
    Voltar:
      Slot: 31
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes:
        - 'voltar'

# --------------------------------------------------------------------------
#  Ranks do campo (ranks.yml).
#  Variáveis do rank: {rank_item} {tag_item} {posicao} {custo}
#  {colheitas_necessarias} {colheitas_tem} {vendido_necessario}
#  {bonus_venda_rank} {bonus_graos_rank}
#  'Formato' por situação: concluido, atual, proximo, bloqueado. Material
#  vazio = usa o Icone do rank; Nome só vale quando há Material.
# --------------------------------------------------------------------------
Ranks:
  Titulo: '&8Ranks do campo &7({pagina}/{paginas})'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
  Slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  Formato:
    concluido:
      Material: LIME_STAINED_GLASS_PANE
      Nome: '{rank_item} &a(concluído)'
      Lore:
        - ''
        - ' &7Bônus: &a+{bonus_venda_rank}% &7venda, &e+{bonus_graos_rank}% &7grãos'
    atual:
      Material: ''
      Brilho: true
      Lore:
        - ''
        - ' &7Bônus: &a+{bonus_venda_rank}% &7venda, &e+{bonus_graos_rank}% &7grãos'
        - ''
        - '&aSeu rank atual.'
    proximo:
      Material: ''
      Lore:
        - ''
        - ' &7Custo: &f{custo}'
        - ' &7Colheitas: &f{colheitas_tem}&7/&f{colheitas_necessarias}'
        - ' &7Bônus: &a+{bonus_venda_rank}% &7venda, &e+{bonus_graos_rank}% &7grãos'
        - ''
        - '&eClique para evoluir!'
    bloqueado:
      Material: RED_STAINED_GLASS_PANE
      Nome: '{rank_item} &c(bloqueado)'
      Lore:
        - ''
        - ' &7Custo: &f{custo}'
        - ' &7Colheitas: &f{colheitas_necessarias}'
  Itens:
    Anterior:
      Slot: 45
      Material: ARROW
      Nome: '&ePágina anterior'
      Acoes:
        - 'anterior'
    Voltar:
      Slot: 48
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes:
        - 'voltar'
    Evoluir:
      Slot: 50
      Material: EMERALD
      Nome: '&a&lEvoluir para {proximo_rank}'
      Lore:
        - ' &7Custo: &f{proximo_custo}'
        - ''
        - '&eClique para evoluir.'
      Acoes:
        - 'rankup'
    Proxima:
      Slot: 53
      Material: ARROW
      Nome: '&ePróxima página'
      Acoes:
        - 'proxima'

# --------------------------------------------------------------------------
#  Top. Ação 'categoria <colheitas|vendido|graos>' troca a lista.
#  Condição: categoria_colheitas, categoria_vendido, categoria_graos.
#  Variáveis da linha: {posicao} {nome} {valor}; da tela: {categoria}
# --------------------------------------------------------------------------
Top:
  Titulo: '&8Top: {categoria}'
  Linhas: 5
  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
  Slots: [11, 12, 13, 14, 15, 20, 21, 22, 23, 24]
  Formato:
    Material: PLAYER_HEAD
    Nome: '&e{posicao}º &f{nome}'
    Lore:
      - '&7{categoria}: &f{valor}'
  Itens:
    Voltar:
      Slot: 36
      Material: RED_DYE
      Nome: '&cVoltar'
      Acoes:
        - 'voltar'
    Colheitas:
      Slot: 39
      Material: WHEAT
      Nome: '&eMais colheitas'
      Lore:
        - '&7Clique para ver.'
      Acoes:
        - 'categoria colheitas'
    Vendido:
      Slot: 40
      Material: EMERALD
      Nome: '&aMais vendido'
      Lore:
        - '&7Clique para ver.'
      Acoes:
        - 'categoria vendido'
    Graos:
      Slot: 41
      Material: SUNFLOWER
      Nome: '&6Mais grãos ganhos'
      Lore:
        - '&7Clique para ver.'
      Acoes:
        - 'categoria graos'

Confirmar:
  Titulo: '&8Confirmar'
  Linhas: 3
  Itens:
    Confirmar:
      Slot: 11
      Material: LIME_WOOL
      Nome: '&aConfirmar'
      Lore:
        - '&7{acao}'
      Acoes:
        - 'confirmar'
    Cancelar:
      Slot: 15
      Material: RED_WOOL
      Nome: '&cCancelar'
      Acoes:
        - 'cancelar'
