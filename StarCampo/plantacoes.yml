# ==========================================================================
#  StarCampo - plantações
#
#  Cada plantação é um bloco que, dentro de um campo, o jogador colhe.
#
#  Bloco               nome moderno do bloco no mundo (WHEAT, CARROTS,
#                      POTATOES, BEETROOTS, NETHER_WART, MELON, PUMPKIN,
#                      SUGAR_CANE, CACTUS, COCOA, HAY_BLOCK...). Vale em
#                      qualquer versão: na 1.8 o plugin traduz sozinho.
#  Tipo                IDADE  - cresce por estágios no mesmo bloco
#                      BLOCO  - o bloco some e volta inteiro
#                      COLUNA - pilha que cresce para cima (colhe o que está
#                               acima da base; 'Altura' = altura madura)
#  Drop                item entregue quando a venda automática está
#                      desligada; é também o item que o /campo vender compra
#  Quantidade          itens por planta: '1' ou '1-3'
#  Preco               valor de cada item na venda (moeda da venda)
#  Graos               Chance (%) e Quantidade ('1' ou '1-2') por planta
#  Tempo para crescer  segundos até a planta colhida ficar madura de novo
#  Experiencia         experiência por planta
#  Solo                o bloco de baixo no modelo GERADO (FARMLAND, SOUL_SAND,
#                      SAND, GRASS_BLOCK...)
#  Agua ao lado        GERADO: põe água entre as fileiras (cana)
#  Espacado            GERADO: uma planta sim, outra não (cacto)
#
#  Cacau precisa de tronco ao lado: só entra por schematic ou campo MANUAL.
# ==========================================================================

