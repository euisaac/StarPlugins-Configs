# ==========================================================================
#  StarDemolidor - nomes dos comandos
#
#  Aqui voce troca o nome dos comandos e acrescenta apelidos, sem mexer no
#  jar. Separe com | -- o primeiro e o nome principal e o resto vira apelido.
#
#  Os nomes que ja vem no plugin (/demolidor e /stardemolidor, com os apelidos
#  deles) continuam funcionando de qualquer jeito. Deixe a linha vazia para
#  nao registrar nada a mais.
#
#  Exemplo: comandos.demolidor: 'demolidor|chunkbuster|limpar'
# ==========================================================================

Versao do modelo: 1

comandos:
  demolidor: ''
  stardemolidor: ''
