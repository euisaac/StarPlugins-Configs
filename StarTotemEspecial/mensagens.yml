# ==========================================================================
#  StarTotemEspecial - mensagens
#
#  Cores: & e <#RRGGBB>. Mensagem vazia ('') não é enviada: é assim que se
#  desliga um aviso. Blocos com | saem uma linha por mensagem.
# ==========================================================================

Versao do modelo: 1

Prefixo: '&6&lTOTEM &8» &7'

Geral:
  Sem permissao: '&cVocê não tem permissão para isso.'
  So jogador: '&cSó jogadores podem usar isso.'
  Carregando: '&eSeus dados ainda estão carregando, tente de novo em um instante.'
  Desligado: '&cOs totens estão desligados (veja o console).'
  Jogador nao encontrado: '&cO jogador &f{jogador}&c nunca entrou no servidor.'
  Banco demorou: '&cO banco de dados demorou para responder. Tente de novo.'
  Nenhum: '&8nenhum'
  Pronto: '&apronto'
  Sim: '&aSim'
  Nao: '&cNão'

Etiquetas:
  Dia: 'd'
  Hora: 'h'
  Minuto: 'min'
  Segundo: 's'

Contra:
  TUDO: 'qualquer morte'
  JOGADORES: 'mortes por jogador'
  MOBS: 'mortes por mob'
  AMBIENTE: 'queda, fogo e afogamento'

# --------------------------------------------------------------------------
#  O totem em ação
# --------------------------------------------------------------------------
Totem:
  Salvou: '{totem} &7te salvou da morte! &8(restam {restantes}, recarga {recarga})'
  Titulo: |-
    &6&lSALVO!
    {totem}
  Sem reviver: '{totem} &7foi usado... mas ele não salva ninguém.'
  Anuncio: '&e{jogador} &7escapou da morte com o {totem}&7!'
  Em recarga: '&cSeu {totem} &cainda está recarregando &8({tempo})&c.'
  Recarregado: '{totem} &aestá pronto de novo!'
  Recarregado actionbar: '&a✔ {totem} &apronto'
  Acabou: '&cVocê usou o seu último {totem}&c. Compre mais no &f/totens loja&c.'
  Trocou sozinho: '&7Acabaram os {anterior}&7; agora o ativo é o {totem}&7.'

# --------------------------------------------------------------------------
#  /totens
# --------------------------------------------------------------------------
Totens:
  Ativou: '{totem} &aagora é o seu totem ativo.'
  Desativou: '&7Você ficou sem totem ativo.'
  Nao existe: '&cO totem &f{totem}&c não existe.'
  Nao tem: '&cVocê não tem nenhum {totem}&c.'
  Sem permissao do totem: '&cVocê não tem permissão para usar o {totem}&c.'
  Recebeu: '&aVocê recebeu &f{quantidade}x {totem}&a!'
  Trocar ligado: '&aQuando o totem ativo acabar, o próximo é ativado sozinho.'
  Trocar desligado: '&7Quando o totem ativo acabar, você fica sem totem ativo.'
  Avisos ligados: '&aVocê vai ser avisado quando o totem recarregar.'
  Avisos desligados: '&7Você não vai mais ser avisado da recarga.'
  Info: |-
    &6&lSeus totens
    &7Ativo: {ativo} &8({ativo_quantidade})
    &7Recarga: {recarga}
    &7Totens guardados: &f{totens}
    &7Fichas: &e{fichas}
    &7Vezes que um totem te salvou: &f{usos}

Previa:
  Mostrando: '&bDemonstração do {totem}&b (sem dano).'
  Em recarga: '&cEspere &f{tempo}&c para ver outra demonstração.'
  Desligada: '&cA demonstração está desligada.'
  Comando: '&8[demonstração] &7rodaria: &f/{comando}'

# --------------------------------------------------------------------------
#  Loja
# --------------------------------------------------------------------------
Loja:
  Comprou: '&aVocê comprou &f{quantidade}x {totem} &apor &f{preco}&a!'
  Sem saldo: '&cVocê não tem &f{preco}&c para comprar o {totem}&c.'
  No maximo: '&cVocê já tem o máximo de {totem} &8({maximo})&c.'
  Sem permissao do totem: '&cVocê não pode comprar o {totem}&c.'
  Indisponivel: '&cEsse totem não está à venda.'
  Moeda invalida: '&cEsse totem cobra numa moeda que não existe (&f{moeda}&c). Avise a staff.'
  Falhou: '&cNão foi possível cobrar agora. Nada foi descontado.'
  Gratis: '&aGrátis'

# --------------------------------------------------------------------------
#  Fichas
# --------------------------------------------------------------------------
Fichas:
  Saldo: '&7Você tem &e{fichas}&7.'
  Saldo de outro: '&f{jogador} &7tem &e{fichas}&7.'
  Uso enviar: '&cUse: &f/fichas enviar <jogador> <quantidade>'
  Enviar desligado: '&cO envio de fichas está desligado.'
  Destino offline: '&cO jogador &f{jogador}&c não está online.'
  Para si mesmo: '&cVocê não pode enviar fichas para si mesmo.'
  Quantia invalida: '&cQuantidade inválida (mínimo {minimo}).'
  Sem fichas: '&cVocê só tem &e{fichas}&c.'
  Enviou: '&aVocê enviou &e{fichas} &apara &f{jogador}&a.'
  Recebeu: '&aVocê recebeu &e{fichas} &ade &f{jogador}&a.'
  Recebeu admin: '&aVocê recebeu &e{fichas}&a!'
  Resgatou: '&aVocê resgatou &e{fichas}&a. Agora tem &e{saldo}&a.'
  Totem comum: '&aO totem comum virou &e{fichas}&a!'
  Mob: '&a+{fichas} &7por matar &f{mob}&7.'
  Tempo online: '&a+{fichas} &7por jogar {minutos} minutos.'
  Pacote comprado: '&aVocê comprou &e{fichas} &apor &f{preco}&a!'
  Pacote sem saldo: '&cVocê não tem &f{preco}&c para comprar &e{fichas}&c.'

Controle:
  Convertido: '&7{quantidade} totem(ns) comum(ns) viraram &e{fichas}&7.'
  Removido: '&7Os totens comuns não valem neste servidor: {quantidade} removido(s).'

Itens:
  Guardou: '{totem} &afoi guardado no seu /totens &8({quantidade})&a.'
  Retirou: '{totem} &afoi para o seu inventário como item.'
  Retirar desligado: '&cTransformar totem em item está desligado.'
  Inventario cheio: '&cSeu inventário está cheio.'
  Totem nao existe: '&cEsse totem (&f{totem}&c) não existe mais.'

Efeitos:
  Nome do lobo: '&fLobo de {jogador}'
  Nome do golem: '&fGuardião de {jogador}'

# --------------------------------------------------------------------------
#  Staff
# --------------------------------------------------------------------------
Admin:
  Recarregado: '&aArquivos recarregados.'
  Uso: '&cUse: &f{uso}'
  Quantidade invalida: '&cQuantidade inválida.'
  Todos so dar: '&cCom * só dá para usar "dar".'
  Fichas para todos: '&a{quantos} jogador(es) receberam &e{fichas}&a.'
  Fichas: '&f{jogador} &7agora tem &e{fichas}&7.'
  Totens: '&f{jogador} &7agora tem &f{quantidade}x {totem}&7.'
  Item entregue: '&aEntregue: &f{quantidade}x {item} &apara &f{jogador}&a.'
  Testou: '&a{totem} &afoi disparado em &f{jogador}&a.'
  Recarga zerada: '&aA recarga de &f{jogador}&a foi zerada.'
  Perfil: |-
    &6&lTotens de {jogador}
    &7Fichas: &e{fichas}
    &7Ativo: {ativo}
    &7Guardados: {totens}
    &7Recarga: {recarga}
    &7Vezes salvo: &f{usos}

Editor:
  Digitar: '&eDigite no chat &f{campo}&e. &8(exemplo: {exemplo})'
  Id invalido: '&cId inválido: use letras minúsculas, números, _ ou - (sem espaço), e que ainda não exista.'
  Id existe: '&cJá existe um totem com o id &f{id}&c.'
  Criado: '&aTotem &f{id}&a criado. Ele nasce desligado: ligue quando terminar.'
  Apagado: '&cTotem &f{id}&c apagado.'
  Material invalido: '&cO material &f{material}&c não existe nesta versão.'
  Preco invalido: '&cPreço inválido: &f{preco}&c (use economia:valor).'
  Mao vazia: '&cSegure na mão o item que vai virar o ícone.'
  Efeito adicionado: '&aEfeito &f{efeito}&a adicionado.'
  Efeito removido: '&cEfeito removido.'
  Chave nao achada: '&cNão achei a chave &f{chave}&c no config.yml (ela foi apagada?).'

Entrada:
  Como cancelar: '&8Digite &fcancelar &8para desistir.'
  Cancelado: '&7Cancelado.'
  Tempo esgotado: '&7O tempo para digitar acabou.'

