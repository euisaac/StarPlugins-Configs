# ==========================================================================
#  StarTotemEspecial - totens
#
#  Tudo daqui pode ser editado no jogo: /totemadmin editor
#
#  Cada totem:
#    Ativado            false = some da loja e não age
#    Nome, Descricao    textos (aceitam & e <#RRGGBB>)
#    Icone              Material (e Textura, para cabeça: base64, URL ou hash)
#    Preco              lista 'economia:valor' (economias.yml). Ex.:
#                         - 'fichas:3'
#                         - 'dinheiro:5000'   (cobra os dois)
#    Na loja            false = só por comando, item ou caixa
#    Ordem              posição na loja e nos menus
#    Permissao          '' = todos; senão só quem tiver compra e usa
#    Reviver            false = o efeito dispara e o jogador morre (vingança)
#    Atingir jogadores  os efeitos de ataque também ferem jogadores
#                       (as proteções de PvP/região continuam valendo)
#    Ativar contra      TUDO, JOGADORES (morte por jogador), MOBS ou
#                       AMBIENTE (queda, fogo, afogamento...)
#    Recarga            segundos; -1 = a do config.yml
#    Maximo             quantos o jogador guarda; -1 = o do config.yml
#    Vida ao reviver    -1 = a do config.yml
#    Efeitos            lista; um totem pode ter VÁRIOS efeitos juntos
#
#  Tipos de efeito (e os ajustes de cada um; o que faltar fica no padrão):
#   ATAQUE
#    RAIO               Raio, Dano, Alvos
#    ONDA_VENENOSA      Raio, Disparos, Intervalo, Dano
#    EXPLOSAO           Raio, Dano, Forca           (não quebra blocos)
#    CHUVA_DE_ESTRELAS  Raio, Alvos, Intervalo, Dano
#    TRIDENTES          Quantidade, Forca, Dano     (flechas antes da 1.13)
#    PRESAS             Raio, Alvos, Intervalo, Dano
#    BOLAS_DE_FOGO      Raio, Quantidade, Intervalo, Dano
#    CHUVA_DE_METEOROS  Raio, Quantidade, Intervalo, Dano, Area
#    CORRENTE_ELETRICA  Raio, Saltos, Dano, Perda
#    ONDA_DE_CHOQUE     Raio, Dano, Forca, Velocidade
#    VAMPIRISMO         Raio, Alvos, Dano, Porcentagem
#   CONTROLE
#    LENTIDAO           Raio, Duracao, Nivel
#    FOGO               Raio, Duracao
#    TERREMOTO          Raio, Altura
#    REPULSAO           Raio, Forca
#    BURACO_NEGRO       Raio, Duracao, Forca, Dano
#    REDEMOINHO         Raio, Tamanho, Quantidade, Duracao, Intervalo, Dano
#    CONGELAMENTO       Raio, Duracao, Dano
#    FUMACA             Raio, Duracao
#    CALDEIRAO          Raio, Quantidade, Duracao, Intervalo, Dano, Area
#   SUPORTE
#    VELOCIDADE         Raio, Duracao, Nivel, Aliados
#    FORCA              Raio, Duracao, Nivel, Aliados
#    CURA               Raio, Vida, Aliados
#    ESCUDO             Duracao, Nivel, Absorcao, Raio, Aliados
#    VEU_SOMBRIO        Duracao
#    FUGA               Distancia, Duracao
#    FENIX              Raio, Dano, Duracao
#    ESPINHOS           Duracao, Porcentagem
#    POCAO              Pocao, Nivel, Duracao, Raio, Alvo (DONO, ALIADOS,
#                       DONO_E_ALIADOS, INIMIGOS, TODOS)
#   INVOCAÇÃO
#    BONECOS_DE_NEVE    Raio, Duracao, Quantidade, Dano
#    MATILHA            Quantidade, Duracao, Dano
#    GOLEM              Duracao, Dano, Raio
#   EXTRAS
#    FOGOS              Quantidade, Intervalo
#    PARTICULAS         Particula, Quantidade, Espalhar
#    SOM                Som, Volume, Tom
#    ANUNCIO            Texto, Onde (CHAT, TITULO, ACTIONBAR), Raio (0 = todos)
#    COMANDOS           Comandos (lista; {jogador} {uuid} {mundo} {x} {y} {z})
#
#  Duracao e Intervalo são em segundos. Dano 2 = um coração.
# ==========================================================================

