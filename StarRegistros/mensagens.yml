# Mensagens do StarRegistros. Mensagem vazia ('') não é enviada.
# Cores com & e &#RRGGBB (1.16+). {prefixo} põe o prefixo no meio de um texto.

Versao do modelo: 1

Prefixo: '&8[&6Registros&8] &7'

Geral:
  Sem permissao: '&cVocê não tem permissão para isso.'
  So jogador: '&cSó jogadores podem usar isso.'
  Uso: '&cUse: &f{uso}'
  Desconhecido: '&cSubcomando desconhecido. Use &f/{comando} ajuda&c.'
  Recarregado: '&aConfigurações recarregadas.'
  Cancelado: '&7Cancelado.'
  Nick invalido: '&cNick inválido.'
  Sem local: '&cEsse local não existe mais (mundo descarregado ou apagado).'
  Teleportado: '&aTeleportado para &f{local}&a.'

Ajuda:
  Cabecalho: '&6&lStarRegistros &7- comandos'
  Linha: ' &e{uso} &8- &7{descricao}'
  Dica: '&7Clique para escrever o comando.'
  Rodape: '&8Dica: &7/{comando} <nick> abre a ficha do jogador direto.'
  jogador: 'Abre a ficha do jogador (online ou offline)'
  ver: 'Registros do jogador no chat, por tipo e dias'
  buscar: 'Procura um texto em todos os registros'
  perto: 'O que aconteceu em volta de você (blocos e baús)'
  lupa: 'Liga/desliga a lupa: clique num bloco para ver a história dele'
  seguir: 'Acompanha tudo o que o jogador faz, ao vivo'
  mortes: 'Inventários das últimas mortes (ver, devolver, coletar)'
  alertas: 'Alertas de suspeita (xray, dupe, comandos...)'
  painel: 'Link do painel no site'
  limpar: 'Roda a manutenção agora (apaga/compacta meses velhos)'
  migrar: 'Traz os registros (.txt) de outro plugin de logs para cá'
  recarregar: 'Recarrega as configurações'
  ajuda: 'Mostra esta lista'

Etiquetas:
  Dia: 'd'
  Hora: 'h'
  Minuto: 'm'
  Segundo: 's'
  Bloqueada: ' (bloqueada)'
  Mao vazia: 'a mão'
  Ninguem: 'ninguém'
  Carregando: '&8carregando...'
  Online: '&a(online)'
  Offline: '&7(offline)'
  Ligada: '&aligada'
  Desligada: '&cdesligada'
  Ligado: '&aligado'
  Desligado: '&cdesligado'
  Recebendo: '&arecebendo'
  Nao recebendo: '&cNÃO recebendo'
  Ja devolvida: '&cJá devolvida.'
  Clique para devolver: '&aClique para devolver.'

Menu:
  Digite o nick: '&eDigite no chat o nick do jogador &7(ou &fcancelar&7).'

Ver:
  Procurando: '&7Procurando nos registros...'
  Titulo: 'Registros de {jogador} (últimos {dias} dia(s))'
  Titulo com tipo: '{tipo} de {jogador} (últimos {dias} dia(s))'
  Cabecalho: '&6&l» &e{titulo} &8- &7{total} registro(s)'
  Nada: '&7Nenhum registro encontrado.'
  # {prefixo} {hora} {data} {cor} {tipo} {jogador} {texto}
  Linha: '{prefixo}&8{hora} {cor}{tipo} &f{texto}'
  Dica: '&7{data} {hora}\n&7Tipo: &f{tipo}\n&7Jogador: &f{jogador}\n&7Local: &f{local}'
  Dica com local: '&7{data} {hora}\n&7Tipo: &f{tipo}\n&7Jogador: &f{jogador}\n&7Local: &f{local}\n\n&eClique para ir até lá.'
  Sem local: '-'
  Anterior: '&e&l« Anterior'
  Anterior apagado: '&8&l« Anterior'
  Proxima: '&e&lPróxima »'
  Proxima apagado: '&8&lPróxima »'
  Pagina: ' &7Página &f{pagina}&7/&f{paginas} '
  Dica anterior: '&7Página anterior'
  Dica proxima: '&7Próxima página'
  Cortado: '&8Mostrando os {mostradas} mais recentes. Use o painel do site para ver mais.'
  Sem busca: '&cFaça uma busca antes (/registros ver, buscar ou perto).'
  Tipo desconhecido: '&cTipo desconhecido: &f{tipo}&c. Use o tab para ver os tipos.'

Buscar:
  Titulo: 'Busca "{texto}" (últimos {dias} dia(s))'

Perto:
  Titulo: 'Num raio de {raio} bloco(s) nas últimas {horas}h'

Lupa:
  Ligada: '&aLupa ligada. &7Clique num bloco para ver a história dele. &8(/registros lupa desliga)'
  Desligada: '&cLupa desligada.'
  Procurando: '&7Olhando o bloco em &f{local}&7...'
  Nada: '&7Ninguém mexeu neste bloco nas últimas {horas}h.'
  Titulo: 'Bloco em {local}'

Seguir:
  Seguindo: '&aAgora você vê tudo o que &f{jogador} &afaz. &8(repita para parar)'
  Parou: '&7Você parou de seguir &f{jogador}&7.'
  Ninguem: '&7Você não está seguindo ninguém. Use &f/{comando} seguir <jogador>&7.'
  Lista: '&7Seguindo: &f{jogadores}'
  Prefixo da linha: '&d[Seguindo] '

Alertas:
  Aviso: '{prefixo}&c&l⚠ {alerta} &f{jogador}&7: {texto}'
  Botao ir: '&b[Ir]'
  Dica ir: '&7Teleportar para {local}'
  Botao ver: '&e[Registros]'
  Dica ver: '&7Ver os registros dele'
  Ligados: '&aVocê voltou a receber os alertas.'
  Desligados: '&cVocê não vai mais receber os alertas &7(até o servidor reiniciar ou /registros alertas ligar).'
  Sem permissao para receber: '&cVocê não tem a permissão &f{permissao} &cpara receber os alertas.'
  Cabecalho console: '&6Alertas recentes:'
  Nomes:
    xray: 'Possível X-ray'
    drop-em-massa: 'Drop em massa'
    clonar: 'Itens do criativo'
    muitos-baus: 'Muitos baús'
    comando-vigiado: 'Comando vigiado'
    palavra-vigiada: 'Palavra vigiada'
    devolucao: 'Devolução'
  # Texto de cada alerta (também vai para o .txt do jogador e para o painel).
  Textos:
    xray: 'minerou {quantidade} minérios raros em {minutos} min'
    drop-em-massa: 'dropou {quantidade} itens em {segundos}s'
    clonar: 'pegou {quantidade}x {item} no criativo'
    muitos-baus: 'abriu {quantidade} baús diferentes em {minutos} min'
    comando-vigiado: 'usou {comando}'
    palavra-vigiada: 'falou "{palavra}": {mensagem}'

Mortes:
  Desligado: '&cO registro de mortes está desligado no config.'
  Devolvida: '&aItens da morte de {quando} devolvidos para &f{jogador}&a.'
  Agendada: '&e{jogador} está offline: &7os itens entram no inventário dele no próximo login.'
  Ja devolvida: '&cEssa morte já foi devolvida.'
  Sem itens: '&cEssa morte não tem itens.'
  Offline: '&c{jogador} está offline e a entrega no login está desligada.'
  Recebeu: '&aVocê recebeu de volta os itens da sua morte de &f{quando}&a.'
  Itens no chao: '&eSeu inventário estava cheio: &7o resto caiu no chão aos seus pés.'
  Coletou: '&aCópia dos itens da morte de &f{jogador} &ano seu inventário.'
  Coletou no chao: '&aCópia dos itens de &f{jogador} &acoletada. &eO que não coube caiu no chão.'

Painel:
  Link: '&b&nAbrir o painel dos registros &7({url})'
  Dica: '&7Abre o painel no navegador'
  Desligado: '&cO painel está desligado no config (Painel.Ativado).'
  Erro: '&cSem contato com o site: &f{erro}'
  Conectado: '&aConectado ao site &7(última batida {quando}).'
  Conectando: '&7Conectando ao site...'

# /registros migrar: copia os registros de outro plugin de logs (lidos direto dos
# arquivos; o outro plugin não precisa estar instalado). A pasta original não é alterada.
Migrar:
  Procurando: '&7Procurando registros de outros plugins em &fplugins/&7...'
  Analisando: '&7Olhando os arquivos de &f{pasta}&7...'
  Nada: '&cNão achei registros de outro plugin em plugins/. &7Aponte a pasta: &f/{comando} migrar <pasta> &7(ex.: &fplugins/OutroPlugin/logs&7).'
  Achou: '&6&l» &eRegistros encontrados:'
  # {pasta} {arquivos} {jogadores} {mb} {periodo} {reconhecido} (% das linhas com o tipo reconhecido)
  Origem: ' &f{pasta} &8- &7{arquivos} arquivo(s), {jogadores} jogador(es), {mb} MB{periodo}'
  Periodo: ', de {de} a {ate}'
  Botao: '&a&l[Migrar]'
  Dica botao: '&7Copia os registros dessa pasta para o StarRegistros. A pasta original não é alterada.'
  Confirmar: '&7Clique em &a[Migrar] &7ou use &f/{comando} migrar {pasta} confirmar&7.'
  Pasta nao existe: '&cA pasta &f{pasta} &cnão existe. &7Use o caminho a partir da pasta do servidor (ex.: plugins/OutroPlugin/logs).'
  Pasta propria: '&cEssa é a pasta do próprio StarRegistros.'
  Sem arquivos: '&cNenhum arquivo de registro (.txt, .log, .zip ou .gz) em &f{pasta}&c.'
  Comecou: '&aMigrando &f{pasta} &a({arquivos} arquivo(s))... &7O andamento chega por aqui. A pasta original não é alterada.'
  Ja rodando: '&eJá tem uma migração rodando: &f{feitos}/{total} &earquivo(s) ({porcento}%), &f{linhas} &elinha(s). &7(/registros migrar cancelar para parar)'
  Andamento: '&7Migrando... &f{feitos}/{total} &7arquivo(s) ({porcento}%), &f{linhas} &7linha(s).'
  Nada para cancelar: '&7Nenhuma migração rodando.'
  Feita: '&a&lMigração concluída! &f{linhas} &alinha(s) de &f{arquivos} &aarquivo(s), &f{jogadores} &ajogador(es), em {segundos}s.'
  Nada novo: '&7Nada novo para migrar: os &f{pulados} &7arquivo(s) dessa pasta já tinham sido migrados &8(apague dados/migrados.txt para migrar de novo).'
  Cancelada: '&cMigração cancelada. &7Ficou o que já tinha sido copiado: &f{linhas} &7linha(s) de &f{arquivos} &7arquivo(s).'
  Erro: '&cErro na migração: &f{erro}'
  Tipos: '&7Por tipo: &f{tipos}'
  Separador: '&7, &f'
  Pulados: '&7{pulados} arquivo(s) já migrado(s) antes foram pulados &8(apague dados/migrados.txt para migrar de novo).'
  Repetidas: '&7{repetidas} linha(s) que já estavam aqui não foram repetidas.'
  Ignoradas: '&7{ignoradas} linha(s) sem data reconhecível ficaram de fora.'
  Velhas: '&e{velhas} linha(s) de meses mais velhos que {meses} mês(es) ficaram de fora &7(Guardar.Meses no config.yml: aumente e migre de novo para trazer).'
  Erros: '&c{erros} arquivo(s) não puderam ser lidos &7(veja o console).'
  # Nome das linhas que não são de nenhum tipo do StarRegistros.
  Etiquetas:
    LOJA: 'Loja'
    OUTRO: 'Outros'

Limpeza:
  Rodando: '&7Rodando a manutenção dos registros...'
  Feita: '&aManutenção feita: &f{apagados} &7mês(es) apagado(s), &f{compactados} &7compactado(s), &f{indices} &7índice(s) de locais vencido(s), &f{mb} MB &7liberados.'

