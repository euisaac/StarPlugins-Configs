      Drops: { Nivel maximo: 5, Por nivel: 1, Preco inicial: 12000, Aumento do preco: 60, Economia: dinheiro }
      Velocidade: { Nivel maximo: 6, Por nivel: 1, Preco inicial: 9000, Aumento do preco: 50, Economia: dinheiro }
      Durabilidade: { Nivel maximo: 5, Por nivel: 0.05, Preco inicial: 5000, Aumento do preco: 40, Economia: dinheiro }
      Armazem: { Nivel maximo: 0, Por nivel: 0, Preco inicial: 0, Aumento do preco: 0, Economia: dinheiro }
      Sorte: { Nivel maximo: 5, Por nivel: 4, Preco inicial: 15000, Aumento do preco: 50, Economia: dinheiro }
    Holograma:
