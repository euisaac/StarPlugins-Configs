# --------------------------------------------------------------------------
#  Loja de maquinas e de combustiveis. O preco mora no maquinas.yml /
#  combustiveis.yml (secao Loja de cada um).
#
#  No item: esquerdo compra 1, direito escolhe a quantidade no chat, Q
#  compra o limite inteiro, shift+direito mostra a previa (maquinas).
#  Linhas acrescentadas no item: {preco} {preco_sem_desconto}
#  {preco_limite} {limite} {libera_em} {falta} {litros} e as da maquina.
#  Acao: trocar_loja (vai para a outra loja)
# --------------------------------------------------------------------------
Loja de maquinas:
  Titulo: '&8Loja de maquinas'
  Linhas: 6
  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '
  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34 ]
  Linhas da oferta:
    - ''
    - ' &7Preco: &a{preco}'
    - ' &7Seu limite de compra: &f{limite} &8({preco_limite})'
    - ''
    - '&aEsquerdo &7compra 1'
    - '&aDireito &7escolhe quantas'
    - '&aQ &7compra o limite ({limite})'
    - '&aShift+Direito &7ver a previa'
  Linhas bloqueada por data:
    - ''
    - ' &cAinda nao liberada.'
    - ' &7Libera em: &f{libera_em} &8(falta {falta})'
  Linhas sem permissao:
    - ''
    - ' &cVoce nao pode comprar esta maquina.'
