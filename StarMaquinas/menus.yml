    Informacoes:
      Slot: 49
      Material: BOOK
      Nome: '&eSua conta'
      Lore:
        - ''
        - ' &7Saldo: &a{saldo_dinheiro}'
        - ' &7Desconto: &a{desconto}% &8{desconto_grupo}'
        - ' &7Limite de compra: &f{limite_compra}'
        - ' &7Maquinas: &f{colocadas}&7/&f{limite_colocadas}'
