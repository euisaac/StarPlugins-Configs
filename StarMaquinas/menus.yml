      Slot: 48
      Material: BLAZE_POWDER
      Nome: '&eIr para os combustiveis'
      Acoes: [ trocar_loja ]
    Suas maquinas:
      Slot: 50
      Material: CHEST
      Nome: '&aSuas maquinas'
      Acoes: [ minhas ]
    Anterior:
