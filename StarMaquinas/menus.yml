      Material: ARROW
      Nome: '&7Pagina anterior'
      Acoes: [ anterior ]
    Proxima:
      Slot: 51
      Material: ARROW
      Nome: '&7Proxima pagina'
      Acoes: [ proxima ]
    Voltar:
