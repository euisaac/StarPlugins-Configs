# ==========================================================================
#  StarBedWars - animacoes.yml - animacoes por quadros
#
#  Defina os quadros aqui e use {animacao:nome} em qualquer texto: tab.yml
#  (cabecalho, rodape, prefixo/sufixo), tags.yml, placar (config.yml >
#  Placar), mensagens de entrada, hologramas... O quadro troca a cada
#  "Intervalo" ticks (20 = 1 segundo). Cores, hex (&#ff8800) e placeholders
#  valem dentro dos quadros.
# ==========================================================================

Versao do modelo: 1

Animacoes:
  titulo:
    Intervalo: 5
    Quadros:
      - '&f&lBED WARS'
      - '&6&lB&f&lED WARS'
      - '&f&lB&6&lE&f&lD WARS'
      - '&f&lBE&6&lD&f&l WARS'
      - '&f&lBED &6&lW&f&lARS'
      - '&f&lBED W&6&lA&f&lRS'
      - '&f&lBED WA&6&lR&f&lS'
      - '&f&lBED WAR&6&lS'
      - '&f&lBED WARS'
      - '&6&lBED WARS'
      - '&f&lBED WARS'
  arco:
    Intervalo: 4
    Quadros:
      - '&c&l» &6&l» &e&l»'
      - '&6&l» &e&l» &c&l»'
      - '&e&l» &c&l» &6&l»'
  site:
    Intervalo: 10
    Quadros:
      - '&estarplugins.com.br'
      - '&6starplugins.com.br'
      - '&fstarplugins.com.br'
  arco_iris:
    Intervalo: 3
    Quadros:
      - '&c'
      - '&6'
      - '&e'
      - '&a'
      - '&b'
      - '&9'
      - '&d'
