# ==========================================================================
#  StarBedWars - desafios de partida
#
#  Conferidos no fim de cada partida para quem venceu: cada desafio
#  concluido rende coins e xp extras. Tipos:
#    SEM_MORRER      - venceu sem morrer nenhuma vez
#    CAMA_INTACTA    - venceu com a cama da equipe inteira
#    VITORIA_RAPIDA  - venceu em menos de "Minutos"
#    SEM_ARMADURA    - venceu sem comprar armadura
#    ABATES          - fez pelo menos "Quantidade" abates na partida
#    CAMAS           - destruiu pelo menos "Quantidade" camas na partida
# ==========================================================================

