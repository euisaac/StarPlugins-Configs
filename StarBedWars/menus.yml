            - ''
            - ' &fDesbloqueados: &a{desbloqueados}/{total}'
            - ''
            - '&eClique para ver'
        Chapeu:
          Slot: 15
          Nome: '&aChapeus'
          Material: JACK_O_LANTERN
          Lore:
            - '&7Um bloco ou cabeca na sua cabeca'
            - ''
            - ' &fDesbloqueados: &a{desbloqueados}/{total}'
            - ''
            - '&eClique para ver'
        Particula:
          Slot: 29
          Nome: '&aParticulas'
          Material: BLAZE_POWDER
          Lore:
            - '&7Auras, aneis, espirais, trilhas'
            - '&7e asas de particulas'
            - ''
            - ' &fDesbloqueados: &a{desbloqueados}/{total}'
            - ''
            - '&eClique para ver'
        Montaria:
          Slot: 33
          Nome: '&aMontarias'
          Material: SADDLE
          Lore:
            - '&7Cavalos e outros bichos'
            - '&7para andar pelo lobby'
            - ''
            - ' &fDesbloqueados: &a{desbloqueados}/{total}'
            - ''
            - '&eClique para ver'
  Itens:
    Boosters:
      Slot: 45
      Nome: '&dBoosters'
      Material: NETHER_STAR
      Lore:
        - '&7Multiplique suas coins e xp'
        - ''
        - ' &fAtivo: {booster}'
        - ''
        - '&eClique para ver'
    Caixas:
      Slot: 53
      Nome: '&bCaixas misteriosas'
      Material: CHEST
      Lore:
        - '&7Suas caixas e fragmentos'
        - ''
        - ' &fCaixas: &a{caixas} &f/ Fragmentos: &b{fragmentos}'
        - ''
        - '&eClique para ver'

# O menu do item "Meu perfil" da barra do lobby. Acoes: ESTATISTICAS,
# LOJA, KITS, HABILIDADES, MISSOES, GRUPO, CAIXAS, BOOSTERS, JOGAR, MAPAS,
# VISIBILIDADE, FECHAR.
