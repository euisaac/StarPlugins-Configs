    Lore:
      - ''
      - ' &fPreco: {cor_preco}{preco}'
      - ''
      - '&aClique para por na compra rapida'

# Editor de barra da loja: cada slot da barra recebe uma categoria (ou um item
# solto), e o que for comprado cai nele.
Editor de hotbar:
  Titulo: '&8Editando hotbar...'
  Linhas: 3
  # Onde os 9 slots da barra aparecem no menu, na ordem (slot #1 ao #9).
  Slots: [ 0, 1, 2, 3, 4, 5, 6, 7, 8 ]
  Voltar: 22
  Nada: '&7nada'
  Vazio:
    Nome: '&7Slot #{numero}'
    Material: LIGHT_GRAY_STAINED_GLASS_PANE
    Lore:
      - '&7Selecionado: {selecionado}'
      - ''
      - '&aBotao esquerdo: &fescolher'
  Definido:
    Nome: '&aSlot #{numero}'
    Lore:
      - '&7Selecionado: &f{selecionado}'
      - ''
      - '&aBotao esquerdo: &ftrocar'
      - '&cBotao direito: &fremover'

# Lista aberta pelo editor de barra (a paginacao vem da secao "Lista").
Escolher para o slot:
