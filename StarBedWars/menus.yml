      Nome: '&aCategorias'
      Material: BOOK
      Lore:
        - '&7Toda a categoria vai para o slot'
    Itens:
      Nome: '&aItens'
      Material: DIAMOND_PICKAXE
      Lore:
        - '&7Um item so vai para o slot'
  Categoria:
    Lore:
      - ''
      - '&7Inclui todos os itens desta categoria.'
      - ''
      - '&aClique para escolher'
  Item:
    Lore:
      - ''
      - ' &fPreco: {cor_preco}{preco}'
      - ''
      - '&aClique para escolher'

