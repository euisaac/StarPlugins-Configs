# ==========================================================================
#  StarBedWars - menus
#
#  Cada menu tem Titulo, Linhas e os Itens fixos (Slot -1 desliga o item).
#  Menus de lista tem "Slots" (onde a lista e desenhada) e os botoes Voltar,
#  Anterior e Proximo. Material aceita o nome moderno (RED_WOOL) ou o antigo
#  (WOOL:14); uma cabeca aceita "Textura: <hash ou base64>" ou "Dono: {jogador}".
#
#  A lore de kits, habilidades e cosmeticos e montada assim: descricao do item
#  (do arquivo dele) + o bloco de "Estados" abaixo, conforme a situacao.
# ==========================================================================

Versao do modelo: 8

Botoes:
  Voltar:
    Nome: '&cVoltar'
    Material: ARROW
  Anterior:
    Nome: '&ePagina anterior'
    Material: ARROW
  Proximo:
    Nome: '&eProxima pagina'
    Material: ARROW
  Fechar:
    Nome: '&cFechar'
    Material: BARRIER
  Vidro:
    Nome: ' '
    Material: BLACK_STAINED_GLASS_PANE

# Linhas acrescentadas na lore dos itens de kit/habilidade/cosmetico.
# {raridade}, {nivel}, {proximo_nivel}, {preco_coins}, {preco_cash}, {encontrado}.
Estados:
  Selecionado:
    - ''
    - ' &fRaridade: {raridade}'
    - ''
    - '&eSelecionado'
  Desbloqueado:
    - ''
    - ' &fRaridade: {raridade}'
    - ' &fNivel: &7{nivel}'
    - ''
    - '&aClique para selecionar'
  Evoluir:
    - ''
    - ' &fRaridade: {raridade}'
    - ' &fNivel: &7{nivel} &8-> &7{proximo_nivel}'
    - ' &fEvoluir: &6{preco_coins} coins {cash}'
    - ''
    - ' &eBotao esquerdo: &7selecionar'
    - ' &eBotao direito: &7evoluir'
  Comprar:
    - ''
    - ' &fRaridade: {raridade}'
    - ' &fPreco: &6{preco_coins} coins {cash}'
    - ''
    - '&aClique para comprar'
  Bloqueado:
    - ''
    - ' &fRaridade: {raridade}'
    - ''
    - '&cSo sai da caixa misteriosa'
  Cash: '&fe &d{preco_cash} cash'
  Nivel maximo: 'Maximo'
  Limpar:
    Nome: '&cRemover selecao'
    Material: BARRIER
    Slot: 49
    Lore:
      - '&7Volta a jogar sem esse item'

# Lista padrao de 6 linhas: os itens ficam no miolo (28 por pagina).
Lista:
  Linhas: 6
  Slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43 ]
  Voltar: 45
  Anterior: 48
  Proximo: 50

# A loja de cosmeticos, em abas. Os botoes das abas ficam embaixo (o da aba
# aberta ganha brilho e "Nome aberto"/"Lore aberto", se existirem); a ultima
# aba que o jogador abriu fica lembrada. "Itens" (fora das abas) aparecem
# nas duas. As chaves dos cosmeticos sao os tipos: Kits, Habilidades, Jaulas,
# Comemoracoes, Abate, Grito, Cama, Balao, Brinquedos, Chapeu, Particula,
# Montaria. {desbloqueados}/{total} contam os do jogador.
Loja:
  Titulo: '&8Loja - BedWars'
  Linhas: 6
  Abas:
    Partida:
      Titulo: '&8Loja - Cosmeticos de partida'
      Botao:
        Slot: 48
        Nome: '&eCosmeticos de partida'
        Material: IRON_SWORD
        Lore:
          - '&7Kits, habilidades, jaulas,'
          - '&7comemoracoes, efeitos...'
          - ''
          - '&eClique para abrir'
        Lore aberto:
          - '&7Kits, habilidades, jaulas,'
          - '&7comemoracoes, efeitos...'
          - ''
          - '&aAba aberta'
      Itens:
        Kits:
          Slot: 10
          Nome: '&aKits'
          Material: IRON_SWORD
          Lore:
            - '&7Comece a partida com itens'
            - ''
            - ' &fDesbloqueados: &a{desbloqueados}/{total}'
            - ''
            - '&eClique para ver'
        Habilidades:
          Slot: 12
          Nome: '&aHabilidades'
          Material: EXPERIENCE_BOTTLE
          Lore:
            - '&7Vantagens passivas na partida'
            - ''
            - ' &fDesbloqueados: &a{desbloqueados}/{total}'
            - ''
            - '&eClique para ver'
        Jaulas:
          Slot: 14
          Nome: '&aJaulas'
          Material: IRON_BARS
          Lore:
            - '&7A jaula onde voce espera o inicio'
            - ''
            - ' &fDesbloqueados: &a{desbloqueados}/{total}'
            - ''
            - '&eClique para ver'
        Comemoracoes:
          Slot: 16
          Nome: '&aComemoracoes de vitoria'
          Material: DRAGON_EGG
          Lore:
            - '&7O show quando voce vence'
            - ''
            - ' &fDesbloqueados: &a{desbloqueados}/{total}'
            - ''
            - '&eClique para ver'
        Abate:
          Slot: 29
          Nome: '&aEfeitos de abate'
          Material: BLAZE_POWDER
          Lore:
            - '&7O efeito quando voce mata alguem'
            - ''
            - ' &fDesbloqueados: &a{desbloqueados}/{total}'
            - ''
            - '&eClique para ver'
        Grito:
          Slot: 31
          Nome: '&aGritos de morte'
          Material: NOTE_BLOCK
          Lore:
            - '&7O som que voce faz ao morrer'
            - ''
            - ' &fDesbloqueados: &a{desbloqueados}/{total}'
            - ''
            - '&eClique para ver'
        Cama:
          Slot: 33
          Nome: '&aDestruicao de cama'
          Material: RED_BED
          Lore:
            - '&7A animacao ao destruir uma cama'
            - ''
            - ' &fDesbloqueados: &a{desbloqueados}/{total}'
            - ''
            - '&eClique para ver'
    Spawn:
      Titulo: '&8Loja - Cosmeticos do spawn'
      Botao:
        Slot: 50
        Nome: '&eCosmeticos do spawn'
        Material: SLIME_BALL
        Lore:
          - '&7Baloes, brinquedos, chapeus,'
          - '&7particulas e montarias'
          - ''
          - '&eClique para abrir'
        Lore aberto:
          - '&7Baloes, brinquedos, chapeus,'
          - '&7particulas e montarias'
          - ''
          - '&aAba aberta'
      Itens:
        Balao:
          Slot: 11
          Nome: '&aBaloes'
          Material: PLAYER_HEAD
          Textura: '5a5ab05ea254c32e3c48f3fdcf9fd9d77d3cba04e6b5ec2e68b3cbdcfac3fd'
          Lore:
            - '&7Um balao que te acompanha no lobby'
            - ''
            - ' &fDesbloqueados: &a{desbloqueados}/{total}'
            - ''
            - '&eClique para ver'
        Brinquedos:
          Slot: 13
          Nome: '&aBrinquedos'
          Material: SLIME_BALL
          Lore:
            - '&7Pula-pula, foguete, bolas de neve'
