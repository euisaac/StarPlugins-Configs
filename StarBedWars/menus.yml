  Separador: GRAY_STAINED_GLASS_PANE
  Separador selecionado: GREEN_STAINED_GLASS_PANE
  Item:
    Lore:
      - ''
      - ' &fPreco: {cor_preco}{preco}'
      - ' &fPerde ao morrer: {perde}'
      - ''
      - '{pode}'
      - '&7Shift + clique: favoritar'
    Pode: '&aClique para comprar'
