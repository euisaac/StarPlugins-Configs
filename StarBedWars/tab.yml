# ==========================================================================
#  StarBedWars - tab (lista de jogadores)
#
#  Cabecalho e rodape do tab, um jogo de linhas para quem esta FORA de
#  partida e outro para quem esta EM partida. Placeholders do perfil
#  ({nivel_formatado}, {coins}, {vitorias}...), da partida ({mapa}, {modo},
#  {jogadores}, {maximo}, {tempo}, {evento}...) e do PlaceholderAPI valem.
#
#  Animacoes: defina quadros em "Animacoes" e use {animacao:nome} em qualquer
#  linha daqui, do placar (config.yml, Placar) ou das mensagens. O quadro
#  troca a cada "Intervalo" ticks (20 = 1 segundo).
#
#  Quem aparece no tab e decidido pelo config.yml (Tab.Separar por partida):
#  em partida, so os da mesma partida; fora, so quem esta fora.
# ==========================================================================

Versao do modelo: 1

Ativar: true

# Ticks entre as atualizacoes do cabecalho/rodape.
Intervalo: 10

Animacoes:
  titulo:
    Intervalo: 5
    Quadros:
      - '&f&lBED WARS'
      - '&6&lB&f&lED WARS'
      - '&f&lB&6&lE&f&lD WARS'
      - '&f&lBE&6&lD&f&l WARS'
      - '&f&lBED &6&lW&f&lARS'
      - '&f&lBED W&6&lA&f&lRS'
      - '&f&lBED WA&6&lR&f&lS'
      - '&f&lBED WAR&6&lS'
      - '&f&lBED WARS'
      - '&6&lBED WARS'
      - '&f&lBED WARS'
  arco:
    Intervalo: 4
    Quadros:
      - '&c&l» &6&l» &e&l»'
      - '&6&l» &e&l» &c&l»'
      - '&e&l» &c&l» &6&l»'
  site:
    Intervalo: 10
    Quadros:
      - '&estarplugins.com.br'
      - '&6starplugins.com.br'
      - '&fstarplugins.com.br'

Fora:
  Cabecalho:
    - ''
    - '{animacao:titulo}'
    - '&7Bem-vindo, &f{jogador}'
    - ''
  Rodape:
    - ''
    - '&fNivel: {nivel_formatado} &7| &fCoins: &6{coins} &7| &fVitorias: &a{vitorias}'
    - '{animacao:site}'
    - ''

Partida:
  Cabecalho:
    - ''
    - '{animacao:titulo}'
    - '&7Mapa: &f{mapa} &7| &f{modo}'
    - ''
  Rodape:
    - ''
    - '&fJogadores: &a{jogadores}&7/&a{maximo} &7| &fTempo: &a{tempo}'
    - '{animacao:site}'
    - ''
