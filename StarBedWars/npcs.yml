# ==========================================================================
#  StarBedWars - NPCs
#
#  Os NPCs do lobby sao criados em jogo com /bw npc criar <tipo> [modo] e
#  ficam guardados no locais.yml; aqui fica so a aparencia deles. A skin
#  aceita um nick ou a textura em base64. Vazio = skin padrao.
#  O NPC usa o provedor do loader (Citizens, FancyNpcs ou um boneco proprio).
#
#  Holograma do NPC de jogar -- placeholders:
#    {modo}      - nome do modo
#    {jogando}   - quem esta nas salas do modo: esperando + em jogo
#    {em_jogo}   - so quem esta com a partida rolando
#    {esperando} - so quem esta na sala de espera
#  Use a que preferir, ex.: '&7{em_jogo} jogando &8| &7{esperando} esperando'
# ==========================================================================

Versao do modelo: 2

Jogar:
  Nome: ''
  Skin: 'EuIsaac'
  Altura do holograma: 2.3
  Holograma:
    - '&e&lCLIQUE PARA JOGAR'
    - '&b{modo}'
    - '&7{jogando} jogando'

Loja:
  Nome: ''
  Skin: 'EuIsaac'
  Altura do holograma: 2.3
  Holograma:
    - '&a&lLOJA'
    - '&7Kits, habilidades e cosmeticos'

Estatisticas:
  Nome: ''
  Skin: '{jogador}'
  Altura do holograma: 2.3
  Holograma:
    - '&b&lSUAS ESTATISTICAS'
    - '&eClique para ver'

# Os NPCs dentro da partida (um por equipe, nos locais definidos na arena).
Partida:
  Loja:
    Nome: '&a&lLOJA'
    Skin: 'EuIsaac'
  Melhorias:
    Nome: '&b&lMELHORIAS'
    Skin: 'Alex'
