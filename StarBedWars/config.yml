# ==========================================================================
#  StarBedWars - configuracao geral
#
#  Como funciona: cada arena e um MUNDO proprio (arenas/<nome>.yml guarda os
#  locais). Os jogadores entram pela sala de espera, sao divididos em equipes,
#  nascem dentro das jaulas e lutam ate sobrar uma equipe. Ao fim, o mundo da
#  arena volta ao estado salvo e a sala reabre sozinha.
#
#  Primeiros passos (admin):
#    1. /bw setlobby                       -> onde o jogador volta ao sair
#    2. /bw arena criar <nome> <modo>      -> no mundo da arena (modos abaixo)
#    3. /bw arena setespera / setespectador / pos1 / pos2 <nome>
#    4. /bw arena equipe <nome> <Equipe> spawn|cama|gerador|loja|melhorias
#    5. /bw arena gerador <nome> diamante|esmeralda
#    6. /bw arena salvar <nome>            -> guarda o mundo e libera a arena
#
#  Cada arquivo desta pasta tem o proprio cabecalho explicando o que faz.
# ==========================================================================

# Numero do modelo deste arquivo. Nao mexa: e por ele que uma atualizacao do
# plugin sabe que precisa trocar o arquivo e guardar o seu como copia.
Versao do modelo: 19

Geral:
  # Escreve no console cada operacao. Ligue so para achar problema.
  Debug: false

  # Milissegundos entre dois cliques no mesmo menu (evita spam).
  Intervalo entre cliques: 100

  # true = barra, placar, tags e cosmeticos so existem no mundo do lobby
  # (/bw setlobby) e nos de "Protecao do lobby > Mundos"; em mundo de outro
  # plugin (treino de ponte, survival...) tudo some e volta ao retornar.
  # false = valem em qualquer mundo que nao e arena.
  So no mundo do lobby: true

  # Quem entra no servidor e levado para o spawn (/bw setlobby).
  Teleportar ao entrar: true

  # MULTIARENA   = todas as arenas neste servidor (o padrao).
  # BUNGEE       = este servidor e UMA sala: quem entra ja cai na arena e, no
  #                fim, e mandado para o "Lobby servidor".
  # LOBBY_BUNGEE = este servidor e o lobby do BedWars: os NPCs e o menu de
  #                jogar mandam o jogador para uma sala BUNGEE livre. Exige
  #                MySQL compartilhado entre o lobby e as salas.
  Modo: MULTIARENA

  # Nome deste servidor no BungeeCord/Velocity (usado nos modos Bungee).
  Nome deste servidor: 'bw1'

  # Servidor(es) de lobby do proxy: e para onde o /lobby manda e para onde as
  # salas BUNGEE devolvem o jogador no fim. Varios = sorteia um a cada vez.
  Lobby servidor:
    - 'lobby'

  # Segundos sem atualizacao para uma sala sumir da lista do lobby.
  Sala expira em: 15

  # Comando rodado no CONSOLE quando o jogador sai da partida no modo
  # MULTIARENA (vazio = so teleporta para o lobby do /bw setlobby).
  # {jogador} e trocado.
  Comando ao sair: ''

Banco de dados:
  # SQLITE (arquivo, nao precisa de nada) ou MYSQL (obrigatorio nos modos
  # Bungee, para dividir estatisticas e salas entre servidores).
  Tipo: SQLITE
  Prefixo das tabelas: 'starbedwars_'
  MySQL:
    Host: localhost
    Porta: 3306
    Banco: minecraft
    Usuario: root
    Senha: ''

# As COINS do BedWars sao proprias do plugin (ganhas nas partidas). O CASH e
# uma moeda externa, usada nos itens que tem preco em cash.
Cash:
  # VAULT        = qualquer economia registrada no Vault.
  # STARECONOMIA = uma moeda do StarEconomia (produto da StarPlugins).
  # COMANDO      = saldo lido por placeholder e cobrado por comando de console.
  # NENHUM       = ninguem tem cash; itens com preco em cash so saem da caixa.
  Tipo: NENHUM
  # So para STARECONOMIA: o id da moeda (vazio = a moeda principal).
  Moeda do StarEconomia: ''
  Placeholder de saldo: '%vault_eco_balance%'
  Comando de retirar: 'eco take {jogador} {valor}'
  Comando de dar: 'eco give {jogador} {valor}'

Partida:
  # true  = quem JA estava com a contagem de renascer rodando volta uma
  #         ultima vez, mesmo que a cama tenha sido quebrada no meio.
  # false = a cama quebrou, a contagem para na hora e ele vira espectador.
  Renascer com a cama quebrada: true
  # Fome durante a partida (false = a barra fica sempre cheia).
  Fome: false
  # Area de espera dentro da arena. Desligada, quem entra vai direto para a
  # JAULA da ilha da equipe dele e espera ali (trocar de equipe muda a jaula
  # de lugar).
  Sala de espera: true
  # Ender chest no mapa abre um bau compartilhado da equipe (some no fim).
  Bau da equipe: true
  # Segundos na sala de espera depois de bater o minimo de jogadores.
  Tempo de espera: 60
  # Quando a sala lota, o contador cai para este valor.
  Tempo de espera lotado: 10
  # Segundos que os jogadores ficam presos na jaula antes do inicio.
  # "Altura" = quantos blocos ACIMA do spawn da equipe a jaula fica (o spawn
  # continua sendo o chao da ilha; ao abrir, cada um e posto nele, sem cair).
  # Cada arena pode ter a sua altura: no editor, clique ESQUERDO no Checklist.
  Jaulas:
    Ativar: true
    Segundos: 10
    Altura: 4
  # Segundos para renascer enquanto a cama existe.
  Segundos para renascer: 5
  # Segundos de invencibilidade ao renascer.
  Invencibilidade ao renascer: 3
  # Segundos desde o ultimo golpe (dado ou recebido) para alguem contar
  # como "em combate" no teleporte do espectador.
  Segundos de combate: 8
  # Dano ao cair no vazio (999 = morte na hora).
  Dano do vazio: 999.0
  # Ferro, ouro, diamante e esmeralda de quem morre vao direto para quem
  # matou (false = caem no chao).
  Recursos para o assassino: true
  # Permite craftar dentro da partida.
  Permitir craft: false
  # Segundos que a partida fica aberta depois do vencedor (comemoracao).
  Segundos apos o fim: 10
  # Acabou a partida: o inventario da lugar a barra do fim (Hotbar.Fim), com
  # "jogar novamente" e "sair".
  Hotbar no fim: true
  # As ilhas das equipes que ficaram SEM NINGUEM -- ninguem entrou, todos
  # desistiram ou a equipe foi ELIMINADA -- continuam funcionando: gerador
  # rodando e NPCs de loja/melhorias de pe, para os outros jogadores irem
  # usar. A ilha nao disputa a partida, so funciona.
  Ilhas sem participantes: false
  # Blocos de distancia dos geradores e dos NPCs onde nao se pode construir.
  Distancia protegida: 2
  # Primeiro sangue (recompensa extra para o primeiro abate).
  Primeiro sangue: true
  # Ao morrer, a espada/picareta/machado comprados voltam um nivel.
  Rebaixar ao morrer:
    Espada: true
    Picareta: true
    Machado: true
  # Rastreador (bussola) no inventario, tambem pelo /rastrear.
  Rastreador: true
  # O jogador pode escolher a equipe na sala de espera (permissao
  # starbedwars.selecionar).
  Selecionar equipe: true
  # Limites de mobs por equipe ao mesmo tempo.
  Limite de tracas: 3
  Limite de golens: 2
  Limite de zumbis: 2
  # Segundos que o zumbinho vive, a velocidade dele e o nome no mundo.
  # "Zumbi bebe" deixa ele em forma de filhote (menor e mais rapido).
  Zumbi bebe: true
  # Couro na cor da equipe no zumbinho: CAPACETE (so o capacete), COMPLETA
  # (conjunto inteiro -- ele aguenta bem mais pancada) ou NENHUMA.
  Armadura do zumbi: CAPACETE
  Vida do zumbi: 60
  Velocidade do zumbi: 0.35
  Nome do zumbi: '{cor}Zumbinho {equipe} &7({tempo}s)'
  # Segundos que golem e traca vivem (o nome mostra a contagem; no fim, somem).
  Vida do golem: 240
  Vida da traca: 15
  Nome do golem: '{cor}Golem {equipe} &7({tempo}s)'
  Nome da traca: '{cor}Traca {equipe} &7({tempo}s)'
  # Comandos bloqueados durante a partida (starbedwars.comandos.bypass ignora).
  Bloquear comandos:
    Ativar: true
    Permitidos:
      - '/bw'
      - '/bedwars'
      - '/lobby'
      - '/l'
      - '/grupo'
      - '/party'
      - '/rastrear'
      - '/reconectar'
      - '/tell'
      - '/msg'
      - '/r'
      - '/g'
  # Linha do tempo da partida. Formato "EVENTO: segundos" contados do inicio.
  # DIAMANTE / ESMERALDA sobem o nivel dos geradores do meio (II, III...).
  # DESTRUICAO_CAMAS destroi todas as camas. MORTE_SUBITA solta os dragoes.
  # FIM encerra em empate.
  Eventos:
    - 'DIAMANTE: 360'
    - 'ESMERALDA: 720'
    - 'DIAMANTE: 1080'
    - 'ESMERALDA: 1440'
    - 'DESTRUICAO_CAMAS: 1800'
    - 'MORTE_SUBITA: 2400'
    - 'FIM: 2700'
  # Dragoes soltos na morte subita (um por equipe viva, mais estes extras
  # para quem comprou a melhoria "Dragao extra").
  Dragoes na morte subita: 1

Geradores:
  # ------------------------------------------------------------------
  #  Como ler um gerador
  #  Segundos  = de quanto em quanto tempo ele solta. MENOR = MAIS RAPIDO
  #              (0.8 = quase um item por segundo; 3.5 = um a cada 3,5s).
  #              Quando e uma LISTA, cada valor e um nivel da melhoria
  #              "Gerador" comprada pela equipe: o primeiro e sem melhoria
  #              (nivel 0), o segundo e o nivel 1, e assim por diante --
  #              por isso a lista vai caindo (fica mais rapido a cada nivel).
  #              Ex.: [ 1.2, 1.0, 0.8, 0.6, 0.4 ] = de 1,2s (sem melhoria)
  #              ate 0,4s (melhoria no maximo).
  #  Quantidade = quantos itens saem de uma vez.
  #  Maximo     = quantos itens desse tipo podem ficar no chao ao redor; ao
  #               bater nesse numero o gerador para ate alguem recolher.
  # ------------------------------------------------------------------
  Ilha:
    Ferro:
      Segundos: [ 2.0, 1.7, 1.4, 1.1, 0.8 ]
      Quantidade: 1
      Maximo: 48
    Ouro:
      Segundos: [ 8.0, 6.5, 5.0, 4.0, 3.0 ]
      Quantidade: 1
      Maximo: 12
    # A esmeralda de ilha so liga no nivel maximo da melhoria.
    Esmeralda:
      Segundos: 60.0
      Quantidade: 1
      Maximo: 4
  # Geradores do meio: segundos por nivel (I, II, III...) subidos pelos eventos.
  Diamante:
    Segundos: [ 30, 22, 15 ]
    Maximo: 6
    Nome: '&bDiamante'
  Esmeralda:
    Segundos: [ 60, 45, 30 ]
    Maximo: 4
    Nome: '&2Esmeralda'
  # Holograma dos geradores do meio. {nivel}, {nome}, {tempo}.
  Holograma:
    Ativar: true
    Linhas:
      - '&eNivel &c{nivel}'
      - '{nome}'
      - '&eGera em &c{tempo}s'
  # Bolinhas que juntam os drops perto (evita pilhas de 64 espalhadas).
  Juntar drops: true

Itens:
  # "Botao" de cada item: com que clique ele e usado -- DIREITO, ESQUERDO ou
  # AMBOS. "Cooldown" e a espera, em segundos, para usar o mesmo item de novo
  # (0 = sem espera). A espera e por jogador e vale para o item, nao para o
  # slot. Quem tem a permissao starbedwars.cooldown.bypass nao espera nada.
  Bola de fogo:
    Dano: 3.0
    # Forca do empurrao (horizontal e vertical) em quem esta perto.
    Empurrao horizontal: 1.0
    Empurrao vertical: 0.65
    Dano de queda: 3.0
    # Velocidade da bola, em blocos por tique. Tres bases: 0.4 (lenta),
    # 0.8 (media) e 1.6 (rapida, como era antes).
    Velocidade: 0.8
    Botao: AMBOS
    Explosao: 3.0
    Cooldown: 2
  TNT:
    # Segundos ate explodir depois de colocada.
    Fusivel: 3
    Empurrao horizontal: 1.3
    Empurrao vertical: 0.9
    Explosao: 4.0
    Cooldown: 1
  Estilingue:
    Empurrao horizontal: 3.0
    Empurrao vertical: 0.85
    Dano de queda: 3.0
    Botao: AMBOS
    Cooldown: 7
  Ovo de ponte:
    # Bloco colocado a cada tique de voo e distancia maxima.
    Distancia maxima: 27
  Leite magico:
    # Segundos sem disparar nenhuma armadilha da ilha inimiga.
    Segundos: 30
    Botao: DIREITO
    Cooldown: 0
  Asas:
    # Segundos de voo e espera entre um uso e outro.
    Segundos: 3
    Botao: AMBOS
    Cooldown: 10
  Foguete:
    Empurrao horizontal: 1.4
    Empurrao vertical: 1.0
    Botao: AMBOS
    Cooldown: 5
  Torre:
    # Altura da torre instantanea (redonda, raio 2, com entrada na frente) e
    # se tem escada na parede de tras.
    Altura: 5
    Escada: true
    Cooldown: 0
  Esponja:
    Raio: 3
  # Os mobs invocados (o ovo de cada um). "Botao" aqui e o clique que os
  # coloca no chao; as outras opcoes deles estao na secao Partida.
  Golem:
    Botao: DIREITO
    Cooldown: 0
  Traca:
    Botao: DIREITO
    Cooldown: 0
  Zumbi:
    Botao: DIREITO
    Cooldown: 0

# O bau e o ender chest de cada ilha. Marque os dois no editor da equipe
# (/bw editor -> Equipes -> "Bau da ilha" e "Ender chest da ilha"); sem marcar,
# nada aqui acontece.
#
# Com eles marcados: aparece um holograma em cima, bater com um item na mao
# guarda o item na hora, e -- o principal -- o que esta guardado conta como
# pagamento nas lojas da partida (loja, melhorias, armadilhas e rastreador).
Baus:
  # Holograma em cima de cada um (vazio = sem holograma).
  Holograma bau: '&eBata para guardar!'
  Holograma ender chest: '&eBata para guardar!'
  Altura do holograma: 1.4
  # Bater no bau da propria ilha com um item na mao guarda o item.
  Guardar ao bater: true
  # Itens que o tapa NUNCA guarda (nome cheio ou um pedaco do nome, entao
  # "_SWORD" pega todas as espadas).
  Nao guardar:
    - '_SWORD'
    - '_PICKAXE'
    - '_AXE'
    - '_SHOVEL'
    - 'SHEARS'
    - 'BOW'
    - 'COMPASS'
    - '_HELMET'
    - '_CHESTPLATE'
    - '_LEGGINGS'
    - '_BOOTS'
  # O que esta guardado conta na hora de comprar.
  Contar na loja: true
  Contar o bau da equipe: true
  Contar o ender chest: true
  # Mostra na lore do item da loja quanto ja esta guardado.
  Mostrar na lore: true

Recompensas:
  Coins:
    Primeiro sangue: 15
    Abate: 10
    Eliminacao: 15
    Cama: 20
    Vitoria: 50
    Participacao: 5
  XP:
    Primeiro sangue: 15
    Abate: 10
    Eliminacao: 15
    Cama: 15
    Vitoria: 100
    Participacao: 10
  Pontos ranqueados:
    Abate: 10
    Eliminacao: 20
    Cama: 15
    Vitoria: 60
    # Perdidos na derrota (o saldo nunca fica negativo).
    Derrota: 40
  # Bonus por permissao. Formato "permissao;porcentagem;mensagem".
  Bonus por permissao:
    - 'starbedwars.bonus.vip;10;&a+10% por ser VIP'
    - 'starbedwars.bonus.mvp;25;&6+25% por ser MVP'
  # Mostra na actionbar o +coins e o +xp.
  Actionbar coins: true
  Actionbar xp: true
  # Mostra o nivel no chat ao fim da partida.
  Nivel no chat: true
  # Vitorias totais necessarias para jogar o ranqueado.
  Vitorias para o ranqueado: 0

Nivel:
  # Barra de progresso: {progresso} nas mensagens e no placar.
  Formato: '&f[{barra}&f]'
  Caractere: '■'
  Cor cheia: '&a'
  Cor vazia: '&7'
  Tamanho: 10
  # Caixa misteriosa dada a cada nivel (vazio = nenhuma).
  Caixa ao subir: 'especiais'
  # Comandos rodados no console a cada nivel ({jogador}, {nivel}).
  Comandos ao subir: []

Raridades:
  COMUM:
    Nome: 'Comum'
    Cor: '&a'
    # Chance relativa na caixa misteriosa.
    Chance: 60
    # Fragmentos ganhos quando o item ja e seu.
    Fragmentos: 5
  RARO:
    Nome: 'Raro'
    Cor: '&9'
    Chance: 25
    Fragmentos: 7
  EPICO:
    Nome: 'Epico'
    Cor: '&5'
    Chance: 12
    Fragmentos: 10
  LENDARIO:
    Nome: 'Lendario'
    Cor: '&6'
    Chance: 3
    Fragmentos: 15

# Equipes disponiveis para as arenas. Formato "Nome : COR : R,G,B" onde COR e
# a cor do Minecraft (la, vidro, argila e chat) e R,G,B a cor da armadura.
Equipes:
  - 'Vermelho : RED : 255,85,85'
  - 'Azul : BLUE : 85,85,255'
  - 'Verde : GREEN : 85,255,85'
  - 'Amarelo : YELLOW : 255,255,85'
  - 'Ciano : AQUA : 85,255,255'
  - 'Branco : WHITE : 255,255,255'
  - 'Rosa : PINK : 255,85,255'
  - 'Cinza : GRAY : 170,170,170'
  - 'Laranja : ORANGE : 255,170,0'
  - 'Roxo : PURPLE : 170,0,170'

Chat:
  # Chat proprio dentro das partidas (o do lobby fica com o seu plugin de chat).
  Ativar: true
  # O chat de quem esta FORA da partida nao aparece para quem esta jogando.
  Lobby separado: true
  # Prefixo que manda a mensagem para a partida inteira em vez da equipe.
  Prefixo global: '!'
  # {equipe} e a cor + nome, {tag} a tag da equipe, {jogador}, {mensagem}.
  Formato equipe: '&8[&aEQUIPE&8] {cor}{jogador}&7: &f{mensagem}'
  Formato global: '&8[&6GLOBAL&8] {cor}{jogador}&7: &f{mensagem}'
  Formato espectador: '&8[&7ESPECTADOR&8] &7{jogador}&7: &7{mensagem}'
  Formato espera: '&7{jogador}&7: &f{mensagem}'
  # Tag da equipe no chat e no tab ({tag} = primeira letra).
  Formato da tag: '&l{tag}'
  # Chat de quem esta FORA da partida (no mundo do lobby). Se um dos plugins
  # de "Ceder para" estiver no servidor, o formato fica com ele e o nosso se
  # cala. Cores com & e hex (&#ff8800); quem tem starbedwars.chat.cor pode usar
  # cores na propria mensagem.
  # Placeholders do Formato:
  #   {jogador}          - nick
  #   {mensagem}         - o texto enviado
  #   {prefix-tag}       - prefixo do cargo (tags.yml)
  #   {suffix-tag}       - sufixo do cargo (tags.yml)
  #   {cargo}            - nome do cargo (tags.yml)
  #   {nivel}            - numero do nivel
  #   {nivel_formatado}  - nivel com o formato do niveis.yml
  #   {liga}             - liga ranqueada
  #   {coins} {xp}       - saldo e xp (xp abreviado: 1.2K)
  #   {vitorias} {abates} {camas} {jogos} {winstreak} {maior_winstreak}
  #   {animacao:nome}    - quadro atual de uma animacao do animacoes.yml
  #   %placeholder%      - qualquer um do PlaceholderAPI
  Lobby:
    Ativar: true
    Formato: '{nivel_formatado} {prefix-tag}{jogador}{suffix-tag}&7: &f{mensagem}'
    Bloquear cores sem permissao: true
    Ceder para:
      - nChat
      - LegendChat
      - EssentialsChat
      - VentureChat
      - ChatControl
      - ChatControlRed
      - DeluxeChat
      - CMI
      - InteractiveChat
      - StarChat

# (Legado: hoje o prefixo/sufixo do tab mora no tab.yml; isto so vale se
# o tab.yml nao tiver as chaves.)
Tags:
  Esperando: '&7'
  Espectador: '&8[ESP] &7'
  Jogo: '{cor}{tag} '

Placar:
  Ativar: true
  # Mostra o placar tambem no lobby (desligue se outro plugin cuida do lobby).
  Mostrar no lobby: true
  # Esconde os numeros vermelhos da direita. So funciona em Paper 1.20.3+:
  # nas versoes antigas (1.8...) o cliente sempre desenha o numero e nao ha
  # como tirar -- nenhum plugin consegue.
  Esconder numeros: true
  # Ticks entre as atualizacoes.
  Intervalo: 20
  # Titulos alternados (animacao). Um so = sem animacao. As animacoes do
  # tab.yml tambem valem aqui e nas linhas: {animacao:nome}.
  Titulos:
    - '&f&lBED WARS'
    - '&6&lB&f&lED WARS'
    - '&f&lB&6&lE&f&lD WARS'
    - '&f&lBE&6&lD&f&l WARS'
    - '&f&lBED &6&lW&f&lARS'
    - '&f&lBED W&6&lA&f&lRS'
    - '&f&lBED WA&6&lR&f&lS'
    - '&f&lBED WAR&6&lS'
    - '&f&lBED WARS'
    - '&f&lBED WARS'
    - '&6&lBED WARS'
    - '&f&lBED WARS'
  Linhas:
    Lobby:
      - ''
      - ' &fNivel: {nivel_formatado}'
      - ' {progresso} &7({xp}/{xp_proximo})'
      - ''
      - ' &fPartidas: &a{jogos}'
      - ' &fVitorias: &a{vitorias}'
      - ' &fAbates: &a{abates}'
      - ' &fCamas: &a{camas}'
      - ' &fSequencia: &a{winstreak}'
      - ''
      - ' &fCoins: &6{coins}'
      - ' &fLiga: {liga}'
      - ''
      - '  &estarplugins.com.br'
    Esperando:
      - ''
      - ' &fMapa: &a{mapa}'
      - ' &fJogadores: &a{jogadores}/{maximo}'
      - ''
      - ' {contagem}'
      - ''
      - ' &fModo: &a{modo}'
      - ''
      - '  &estarplugins.com.br'
    Jogo:
      - ''
      - ' &fProximo evento:'
      - ' &a{evento} &7em &a{evento_tempo}'
      - ''
      - '{equipes}'
      - ''
      - ' &fAbates: &a{abates_partida}'
      - ' &fCamas: &a{camas_partida}'
      - ''
      - '  &estarplugins.com.br'
    # Placar de quem esta no modo de configuracao (/bw arena editar).
    # {arena}, {modo}, {equipes}, {por_equipe}, {minimo}, {maximo},
    # {diamantes}, {esmeraldas}, {espera}, {espectador}, {regiao},
    # {mundo_guardado} (Feito/Falta), {pendencias} (quantas), {equipe_atual};
    # {lista_equipes} vira uma linha por equipe (Editor.Equipe).
    Editor:
      - ''
      - ' &fArena: &a{arena}'
      - ' &fModo: &a{modo} &7({equipes} equipes)'
      - ''
      - ' &fEspera: {espera} &fEspec.: {espectador}'
      - ' &fRegiao: {regiao} &fMundo: {mundo_guardado}'
      - ' &fDiamante: &b{diamantes} &fEsmeralda: &2{esmeraldas}'
      - ''
      - '{lista_equipes}'
      - ''
      - ' &fPendencias: &c{pendencias}'
      - ''
      - '  &estarplugins.com.br'
  # Cada equipe vira uma linha no lugar de {equipes}.
  Formato da equipe: ' {cor}{tag} &f{nome}: {estado} {voce}'
  Estado com cama: '&a✔'
  Estado sem cama: '&a{vivos}'
  Estado eliminada: '&c✘'
  Marca da sua equipe: '&7(voce)'
  Texto da contagem: '&fComeca em &a{tempo}s'
  Texto esperando: '&fAguardando jogadores...'
  # Placar do editor: a linha de cada equipe ({spawn} {cama} {gerador}
  # {loja} {melhorias} viram Feito/Falta) e os simbolos.
  Editor:
    Equipe: ' {cor}{equipe}&7: {spawn}{cama}{gerador}{loja}{melhorias}'
    Sem equipes: ' &7Nenhuma equipe ainda'
    Feito: '&a✔'
    Falta: '&c✘'

# Itens da barra de acoes. Slot -1 desliga o item.
Hotbar:
  Lobby:
    Perfil:
      Nome: '&aMeu perfil'
      Material: PLAYER_HEAD
      Dono: '{jogador}'
      Slot: 0
      Lore:
        - '&7Estatisticas, kits, cosmeticos,'
        - '&7missoes, grupo e caixas'
    Loja:
      Nome: '&aLoja de cosmeticos'
      Material: EMERALD
      Slot: 4
      Lore:
        - '&7Kits, habilidades, jaulas e efeitos'
    Brinquedo:
      # Sem brinquedo escolhido mostra este item (abre a lista); com um
      # escolhido mostra o icone dele com "Nome selecionado".
      Nome: '&aBrinquedos'
      Material: SLIME_BALL
      Slot: 7
      Lore:
        - '&7Escolha um brinquedo do spawn'
      Nome selecionado: '&a{brinquedo}'
      Lore selecionado:
        - '&7Clique direito para usar'
        - '&7(troque em /bw loja > Brinquedos)'
    Visibilidade:
      Nome: '&aJogadores visiveis'
      Material: LIME_DYE
      Slot: 8
      Lore:
        - '&7Clique para esconder os jogadores'
      # Como o item fica quando os jogadores estao escondidos.
      Nome oculto: '&cJogadores escondidos'
      Material oculto: GRAY_DYE
      Lore oculto:
        - '&7Clique para mostrar os jogadores'
  Esperando:
    Kits:
      Nome: '&aKits'
      Material: BOW
      Slot: 0
    Habilidades:
      Nome: '&aHabilidades'
      Material: EXPERIENCE_BOTTLE
      Slot: 1
    Equipe:
      Nome: '&aSelecionar equipe'
      Material: WHITE_WOOL
      Slot: 4
    Sair:
      Nome: '&cSair &7(voltar para o lobby)'
      Material: RED_BED
      Slot: 8
  # Barra de quem esta assistindo um replay (/bw replay).
  Replay:
    Pausar:
      Nome: '&ePausar / continuar'
      Material: PAPER
      Slot: 3
    Voltar:
      Nome: '&aVoltar 10s'
      Material: ARROW
      Slot: 2
    Adiantar:
      Nome: '&aAdiantar 10s'
      Material: ARROW
      Slot: 4
    Velocidade:
      Nome: '&bVelocidade'
      Material: FEATHER
      Slot: 5
    Sair:
      Nome: '&cSair do replay'
      Material: RED_BED
      Slot: 8
  # Quem morreu de vez (sem cama) ou entrou para assistir.
  Espectador:
    Jogar novamente:
      Nome: '&bJogar novamente'
      Material: PAPER
      Slot: 2
    Jogadores:
      Nome: '&aTeleportar por equipe'
      Material: COMPASS
      Slot: 4
      Lore:
        - '&7Os jogadores vivos de cada equipe'
    Aleatorio:
      Nome: '&dTeleporte aleatorio'
      Material: ENDER_PEARL
      Slot: 3
      Lore:
        - '&7Cai perto de um jogador vivo qualquer'
    Combate:
      Nome: '&cTeleporte para o combate'
      Material: BLAZE_POWDER
      Slot: 5
      Lore:
        - '&7Vai ate quem esta lutando agora'
    Sair:
      Nome: '&cSair &7(voltar para o lobby)'
      Material: RED_BED
      Slot: 6
  # Quem morreu mas ainda vai renascer (a cama existe): so os teleportes.
  Renascendo:
    Jogadores:
      Nome: '&aTeleportar por equipe'
      Material: COMPASS
      Slot: 4
    Aleatorio:
      Nome: '&dTeleporte aleatorio'
      Material: ENDER_PEARL
      Slot: 3
    Combate:
      Nome: '&cTeleporte para o combate'
      Material: BLAZE_POWDER
      Slot: 5
  Partida:
    Rastreador:
      Nome: '&aRastreador'
      Material: COMPASS
      Slot: 8
  # Barra que aparece para todo mundo quando a partida termina
  # (Partida.Hotbar no fim).
  Fim:
    Jogar novamente:
      Nome: '&bJogar novamente'
      Material: PAPER
      Slot: 3
      Lore:
        - '&7Entra na proxima partida deste modo'
    Sair:
      Nome: '&cSair &7(voltar para o lobby)'
      Material: RED_BED
      Slot: 5

# Modos de jogo. Crie quantos quiser: a chave e o nome interno (usado em
# /bw arena criar <arena> <modo>), "Jogadores por equipe" define o tamanho do
# time e o NUMERO DE TIMES vem da arena (as equipes que voce criar no editor).
# Ex.: MEGA = 4 equipes na arena x 5 por equipe = 20 jogadores.
# "Icone" e "Slot" (opcionais) sao a aparencia do modo nos menus; sem Slot ele
# entra no proximo lugar livre, entao um modo novo aparece sozinho.
# Replay das partidas: o plugin grava onde cada jogador estava, os blocos
# colocados/quebrados, as mortes e os eventos. Para assistir (/bw replay ou
# o item do lobby) o mapa e copiado para um mundo temporario e a partida e
# remontada nele -- a arena de verdade nunca e tocada.
# Cada arquivo tem alguns MB; "Guardar dias" e "Maximo de arquivos" limpam
# os antigos sozinhos.
Replay:
  Ativar: true
  # Ticks entre um quadro e outro (2 = 10 quadros por segundo). Mais alto
  # deixa o arquivo menor e o replay mais "picotado".
  Intervalo: 2
  Gravar chat: true
  # Mortes, camas e o fim aparecem tambem em titulo na tela (nao so no chat).
  Mostrar eventos: true
  Guardar dias: 7
  Maximo de arquivos: 200

# Loja da partida.
Loja:
  # true  = itens com Grupo sobem de nivel (madeira -> pedra -> ferro...), um
  #         de cada vez, e so o proximo aparece.
  # false = todos os niveis ficam a mostra e o jogador compra direto o que
  #         quiser (a espada de diamante sem passar pelas outras).
  Progressiva: true

Modos:
  solo:
    Ativo: true
    Nome: 'Solo'
    Jogadores por equipe: 1
    Icone: WOODEN_SWORD
  dupla:
    Ativo: true
    Nome: 'Dupla'
    Jogadores por equipe: 2
  trio:
    Ativo: true
    Nome: 'Trio'
    Jogadores por equipe: 3
  quarteto:
    Ativo: true
    Nome: 'Quarteto'
    Jogadores por equipe: 4
  mega:
    Ativo: true
    Nome: 'Mega'
    Jogadores por equipe: 5
    Icone: NETHER_STAR
  ranqueado:
    Ativo: true
    Nome: 'Ranqueado'
    Jogadores por equipe: 1

Estados:
  Esperando: 'Esperando'
  Iniciando: 'Iniciando'
  Jogo: 'Em jogo'
  Fim: 'Encerrando'
  Resetando: 'Resetando'

Seletor de mapas:
  Ativar: true
  # Mapas que um jogador comum pode escolher por dia (permissoes
  # starbedwars.mapas.max.<n> e starbedwars.mapas.infinito mudam isso).
  Limite diario: 1

# Sequencia de vitorias ({winstreak} / {maior_winstreak} no placar, tab e
# PlaceholderAPI: %starbedwars_winstreak%; top: /bw top criar winstreak).
Winstreak:
  # Avisa quando a sequencia chega a este numero (0 = nunca).
  Anunciar a partir de: 3
  # Avisa tambem os outros jogadores da partida.
  Anunciar para a partida: true

Reconexao:
  Ativar: true
  # Segundos que a vaga fica guardada depois de cair (180 = 3 minutos).
  Segundos: 180
  # Volta sozinho para a partida ao entrar de novo.
  Automatica: true

Grupo:
  # Tamanho maximo padrao (starbedwars.grupo.<n> aumenta).
  Maximo: 4
  # Segundos que um convite vale.
  Convite expira em: 60

Boosters:
  # Formato "multiplicador : minutos". Sao os boosters que o /bw booster dar
  # e o comando de recompensa conhecem pelo numero (1, 2, 3...).
  Modelos:
    - '1.5 : 30'
    - '2.0 : 30'
    - '2.0 : 60'
    - '3.0 : 60'

Caixa misteriosa:
  Holograma:
    - '&b&lCaixa Misteriosa'
    - '&7Clique com o botao direito'
  # Pacotes fabricados com fragmentos.
  Pacotes:
    1:
      Fragmentos: 40
      Caixas: 1
    2:
      Fragmentos: 75
      Caixas: 2
    3:
      Fragmentos: 150
      Caixas: 3
  # Caixa de que sai cada pacote fabricado.
  Caixa dos pacotes: 'especiais'
  # Animacoes de abertura (menu ao lado do livro). A primeira sem Permissao e
  # a de todo mundo; as outras pedem a permissao indicada. Tipos: CABECA (uma
  # cabeca sai da caixa girando e sobe, e vira o premio -- acontece no mundo,
  # em cima do bloco da caixa), ROLETA (os itens giram na linha do meio),
  # PISCAR (o menu inteiro pisca), CIRCULO (um cursor roda em volta do premio)
  # e ONDA (o menu se preenche do centro para fora e revela). A particula e
  # tocada ao revelar.
  Animacoes:
    cabeca:
      Nome: '&aCabeca'
      Material: PLAYER_HEAD
      Tipo: CABECA
      Permissao: ''
      Duracao: 60
      Particula: VILLAGER_HAPPY
      # Altura que a cabeca sobe e quantos graus gira por tick.
      Altura: 1.8
      Giro: 15
      Descricao:
        - '&7Uma cabeca sai da caixa girando'
        - '&7e sobe ate virar o premio'
    roleta:
      Nome: '&aRoleta'
      Material: COMPARATOR
      Tipo: ROLETA
      Permissao: ''
      Duracao: 60
      Particula: VILLAGER_HAPPY
      Descricao:
        - '&7Os itens giram na linha do meio'
        - '&7ate parar no premio'
    piscar:
      Nome: '&ePiscar'
      Material: GLOWSTONE_DUST
      Tipo: PISCAR
      Permissao: 'starbedwars.animacao.piscar'
      Duracao: 60
      Particula: CRIT
      Descricao:
        - '&7O menu inteiro pisca de itens'
        - '&7e o premio aparece no meio'
    circulo:
      Nome: '&bCirculo'
      Material: ENDER_EYE
      Tipo: CIRCULO
      Permissao: 'starbedwars.animacao.circulo'
      Duracao: 60
      Particula: PORTAL
      Descricao:
        - '&7Um cursor roda em volta do'
        - '&7premio ate ele se revelar'
    onda:
      Nome: '&dOnda'
      Material: PRISMARINE_SHARD
      Tipo: ONDA
      Permissao: 'starbedwars.animacao.onda'
      Duracao: 50
      Particula: FIREWORKS_SPARK
      Descricao:
        - '&7O menu se preenche do centro'
        - '&7para fora e revela o premio'
  # Caixas existentes. Recompensas: KIT, HABILIDADE, JAULA, COMEMORACAO,
  # ABATE, GRITO, CAMA, BALAO.
  Caixas:
    kits:
      Nome: '&bCaixa de Kits'
      Material: CHEST
      Lore:
        - '&7Chance de ganhar kits de'
        - '&7qualquer modo'
      Recompensas: [ KIT ]
    habilidades:
      Nome: '&bCaixa de Habilidades'
      Material: ENDER_CHEST
      Lore:
        - '&7Chance de ganhar habilidades'
      Recompensas: [ HABILIDADE ]
    especiais:
      Nome: '&bCaixa Especial'
      Material: TRAPPED_CHEST
      Lore:
        - '&7Jaulas, comemoracoes, efeitos'
        - '&7de abate, gritos, animacoes'
        - '&7de cama e baloes'
      Recompensas: [ JAULA, COMEMORACAO, ABATE, GRITO, CAMA, BALAO ]

# Protecao do mundo do lobby, para nao depender de WorldGuard. Vale nos
# mundos de "Mundos" (vazio = o mundo do /bw setlobby); nunca dentro de
# arena. Cada "Permitir ..." em false BLOQUEIA aquilo. A permissao
# starbedwars.lobby.bypass ignora as regras de blocos e itens (staff).
# "Tempo fixo" em ticks (6000 = meio-dia, 18000 = meia-noite; -1 = nao mexe).
Protecao do lobby:
  Ativar: true
  Mundos: []
  Permitir quebrar: false
  Permitir colocar: false
  # Baus, fornalhas, portas, botoes, camas... (a caixa misteriosa e os NPCs nao entram)
  Permitir usar blocos: false
  Permitir dano: false
  Permitir pvp: false
  Permitir fome: false
  Permitir spawn natural: false
  Permitir dropar itens: false
  Permitir pegar itens: false
  Permitir chuva: false
  Permitir fogo e explosoes: false
  Tempo fixo: 6000
  # Quem cai abaixo de "Void abaixo de" volta para o spawn (/bw setlobby).
  Anti void: true
  Void abaixo de: 0

Jumppad:
  # Bloco de slime lanca o jogador para frente (na partida e, se quiser, no lobby).
  Ativar: true
  No lobby: true
  Empurrao horizontal: 1.6
  Empurrao vertical: 0.8
  Particula: CLOUD
  Som: 'ENTITY_FIREWORK_ROCKET_LAUNCH'

Double jump:
  # Fora da partida, quem tem starbedwars.doublejump pula duas vezes e e
  # lancado para frente (nao vale dentro dos mundos de arena).
  Ativar: true
  Empurrao horizontal: 1.2
  Empurrao vertical: 0.9
  Particula: CLOUD
  Som: 'ENTITY_BAT_TAKEOFF'

Tab:
  # Quem esta numa partida so ve (tab e mundo) quem esta na mesma partida;
  # quem esta fora so ve quem esta fora.
  Separar por partida: true

Tops:
  # Linhas dos hologramas de top. O top mostra "Total" posicoes em paginas
  # de "Quantidade": clicar na area dos NOMES passa a pagina; clicar no
  # RODAPE troca o modo (geral, solo, dupla...). Vale para todo mundo.
  # Placeholders (Cabecalho e Rodape): {tipo}, {modo}, {proximo_modo},
  # {modos} (lista com o atual em destaque), {pagina}, {paginas},
  # {proxima_pagina}, {quantidade} (por pagina), {total}.
  # Na Linha: {posicao}, {jogador}, {valor}.
  Cabecalho:
    - '&6&lTOP {quantidade} {tipo} &7({pagina}/{paginas})'
    - '&7{modo}'
  Linha: '&e{posicao}. &f{jogador} &7- &a{valor}'
  Vazio: '&7---'
  Rodape:
    - ''
    - '&7Clique nos nomes: &fpagina {proxima_pagina}/{paginas}'
    - '&7Clique aqui: &a{proximo_modo}'
  Nome do geral: 'Geral'
  Modo selecionado: '&a{modo}'
  Modo normal: '&7{modo}'
  Separador dos modos: ' &8- '
  # Posicoes por pagina (ate 15).
  Quantidade: 10
  # Posicoes no total (10 por pagina + 100 no total = 10 paginas).
  Total: 100
  # Minutos entre as atualizacoes dos tops.
  Atualizar a cada: 5

# Mensagem de entrada no servidor por permissao: vale a PRIMEIRA da lista
# cuja permissao o jogador tem (Permissao vazia = todo mundo). {jogador} e
# placeholders do PlaceholderAPI funcionam; uma lista vira varias linhas.
# Placeholders da Mensagem: {jogador}, {prefix} e {sufixo} (prefixo/sufixo
# do tab, tab.yml > Fora, ja resolvidos), {prefixo} (o do plugin),
# {animacao:nome} e os do PlaceholderAPI (%luckperms_prefix%...).
Mensagens de entrada:
  Ativar: true
  # Esconde a mensagem padrao do servidor ("X entrou no jogo").
  Esconder padrao: true
  # Vazio = manda para todos; PARTIDA/FORA limita a quem esta la.
  Para quem: FORA
  Lista:
    dono:
      Permissao: 'starbedwars.entrada.dono'
      Som: 'ENTITY_ENDER_DRAGON_GROWL'
      Mensagem:
        - ''
        - ' &4&lDONO &f{jogador} &7entrou no servidor!'
        - ''
    mvp:
      Permissao: 'starbedwars.entrada.mvp'
      Som: 'ENTITY_PLAYER_LEVELUP'
      Mensagem: ' &6&lMVP &f{jogador} &7entrou no servidor!'
    vip:
      Permissao: 'starbedwars.entrada.vip'
      Som: ''
      Mensagem: ' &a&lVIP &f{jogador} &7entrou no servidor!'
    padrao:
      Permissao: ''
      Som: ''
      Mensagem: ' &e{jogador} &7entrou.'

Sons:
  Quebrar cama: 'ENDER_DRAGON_GROWL'
  Eliminacao: 'WITHER_DEATH'
  Comprar: 'NOTE_BLOCK_PLING'
  Contagem: 'CLICK'
  Inicio: 'ENDER_DRAGON_GROWL'
  Vitoria: 'LEVEL_UP'
  Derrota: 'WITHER_SPAWN'
  Evento: 'NOTE_BLOCK_PLING'
  Armadilha: 'WITHER_HURT'
  Menu: 'CLICK'
