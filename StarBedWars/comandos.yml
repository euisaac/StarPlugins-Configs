# ==========================================================================
#  StarBedWars - nomes dos comandos
#
#  Troque o nome ou as aliases de um comando sem mexer no jar. Formato
#  "principal|alias|alias". Vazio = so os nomes padrao do plugin (os do
#  plugin.yml). Com a linha preenchida, SO os nomes dela valem: o que nao
#  estiver nela deixa de existir (ex.: "spawn|lobby" cria /spawn com /lobby
#  de alias e libera /l, /leave e /sairbw para outros plugins).
# ==========================================================================

Versao do modelo: 2

comandos:
  bw: ''
  grupo: ''
  reconectar: ''
  rastrear: ''
  missoes: ''
  lobby: 'spawn|lobby'
