# ==========================================================================
#  StarBedWars - cosmeticos/efeitos-de-abate.yml - efeitos de abate
#
#  Tocados no lugar da vitima quando voce mata alguem. Tipos: SANGUE, FOGOS,
#  NEVE, CORACOES, DIAMANTES, FUMACA, OURO, FOGO, PORTAL, RAIO, NOTAS.
#  Permissao para ter todos: starbedwars.abate.*
#
#  "Coins" e a moeda interna (ganha jogando). "Cash" e o dinheiro do
#  servidor: com "Cash.Tipo: STARECONOMIA" no config.yml, o valor sai da
#  moeda do StarEconomia -- da para vender qualquer cosmetico nela.
#  "Ativar: false" tira o cosmetico da loja sem apagar a linha dele.
#  VULCAO, GALAXIA, ALMA, CRISTAL e BOLHAS chegaram na revisao dos cosmeticos.
#  "Desde: N" marca a versao do arquivo em que o cosmetico chegou: e o que
#  faz um cosmetico novo entrar UMA vez em quem ja tinha o arquivo. Pode
#  apagar o cosmetico que quiser -- o que voce apagou nao volta.
# ==========================================================================

