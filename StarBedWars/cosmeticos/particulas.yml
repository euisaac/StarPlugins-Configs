# ==========================================================================
#  StarBedWars - cosmeticos/particulas.yml - efeitos de particula do spawn
#
#  Um efeito que acompanha o jogador no lobby. "Particula" e o nome da
#  particula (FLAME, HEART, VILLAGER_HAPPY, CLOUD, REDSTONE, ENCHANTMENT_TABLE,
#  PORTAL, NOTE, LAVA, SNOWBALL, CRIT, SPELL_WITCH, FIREWORKS_SPARK...).
#  "Forma":
#    AURA    - nuvem em volta do corpo ("Quantidade" por vez)
#    ANEL    - dois pontos girando nos pes
#    ESPIRAL - helice subindo pelo corpo
#    TRILHA  - deixa um rastro so quando anda
#    ASAS    - duas asas nas costas
#  Permissoes: starbedwars.particula.<chave> / starbedwars.particula.*
# ==========================================================================

