# ==========================================================================
#  StarBedWars - cosmeticos/comemoracoes.yml - comemoracoes de vitoria
#
#  Tocadas para a equipe vencedora no fim da partida. O campo "Tipo" define
#  o show: FOGOS, RAIOS, CHUVA_DE_LAS, EXPLOSOES, REBANHO, DRAGAO,
#  BIGORNAS, BOLOS, CHUVA_DE_DIAMANTES, TORNADO e DRAGAO_MONTADO (o vencedor
#  monta um Dragao do Fim e voa pela arena, com fogos roxos em volta).
#  "Titulo" e "Subtitulo" (opcionais) trocam o titulo de vitoria de quem
#  usa a comemoracao.
#  Nao remova "fogos": e a de quem nao escolheu nenhuma.
#  Permissao para ter todas: starbedwars.comemoracao.*
#
#  "Coins" e a moeda interna (ganha jogando). "Cash" e o dinheiro do
#  servidor: com "Cash.Tipo: STARECONOMIA" no config.yml, o valor sai da
#  moeda do StarEconomia -- da para vender qualquer cosmetico nela.
#  "Ativar: false" tira o cosmetico da loja sem apagar a linha dele.
# ==========================================================================

Versao do modelo: 1

Comemoracoes:
  fogos:
    Nome: 'Fogos'
    Tipo: FOGOS
    Material: FIREWORK_ROCKET
    Raridade: COMUM
    Coins: 0
    Cash: 0
    Descricao:
      - '&7Um show de fogos de artificio'
  raios:
    Nome: 'Thor'
    Tipo: RAIOS
    Material: BLAZE_ROD
    Raridade: RARO
    Coins: 8000
    Cash: 0
    Descricao:
      - '&7Raios caem ao seu redor'
  chuva_de_las:
    Nome: 'Chuva de las'
    Tipo: CHUVA_DE_LAS
    Material: WHITE_WOOL
    Raridade: RARO
    Coins: 8000
    Cash: 0
    Descricao:
      - '&7Blocos de la caem do ceu'
  explosoes:
    Nome: 'Explosoes'
    Tipo: EXPLOSOES
    Material: TNT
    Raridade: EPICO
    Coins: 15000
    Cash: 0
    Descricao:
      - '&7Explosoes (sem dano) por toda parte'
  rebanho:
    Nome: 'Rebanho-iris'
    Tipo: REBANHO
    Material: WHITE_WOOL
    Raridade: EPICO
    Coins: 15000
    Cash: 0
    Descricao:
      - '&7Ovelhas coloridas comemoram'
      - '&7com voce'
  bigornas:
    Nome: 'Bigornas'
    Tipo: BIGORNAS
    Material: ANVIL
    Raridade: EPICO
    Coins: 15000
    Cash: 0
    Descricao:
      - '&7Bigornas despencam do ceu'
  bolos:
    Nome: 'Bolo da vitoria'
    Tipo: BOLOS
    Material: CAKE
    Raridade: RARO
    Coins: 8000
    Cash: 0
    Descricao:
      - '&7Bolos aparecem por toda parte'
  diamantes:
    Nome: 'Chuva de diamantes'
    Tipo: CHUVA_DE_DIAMANTES
    Material: DIAMOND
    Raridade: LENDARIO
    Coins: 0
    Cash: 0
    Descricao:
      - '&7Diamantes caem do ceu'
  tornado:
    Nome: 'Tornado'
    Tipo: TORNADO
    Material: FEATHER
    Raridade: LENDARIO
    Coins: 40000
    Cash: 0
    Descricao:
      - '&7Um tornado de particulas'
      - '&7ao seu redor'
  dragao:
    Nome: 'Dragao do fim'
    Tipo: DRAGAO
    Material: DRAGON_EGG
    Raridade: LENDARIO
    Coins: 0
    Cash: 0
    Descricao:
      - '&7Um dragao sobrevoa a arena'
  dragao_montado:
    Nome: 'Montaria do Dragao'
    Tipo: DRAGAO_MONTADO
    Material: DRAGON_HEAD
    Raridade: LENDARIO
    Coins: 75000
    Cash: 0
    # Titulo proprio da vitoria (no lugar do "Vitoria" do mensagens.yml).
    Titulo: '&5&lVITORIA!'
    Subtitulo: '&dVoce domou o Dragao do Fim'
    # Para onde o jogador olha, o dragao vai. Velocidade em blocos por tique.
    Velocidade: 0.9
    # Quanto o jogador fica acima do dragao (ajuste se ele parecer flutuar
    # longe das costas ou entrar no corpo do bicho).
    Altura do jogador: 3.0
    # Ate quantos blocos acima do ponto de partida da para subir.
    Altura maxima: 40
    # Distancia em volta do jogador em que os fogos (roxos) estouram.
    Raio dos fogos: 14
    Nome do dragao: '&5&lDragao da Vitoria'
    Descricao:
      - '&7Monte no Dragao do Fim e voe'
      - '&7pela arena enquanto os fogos'
      - '&7estouram ao seu redor'
