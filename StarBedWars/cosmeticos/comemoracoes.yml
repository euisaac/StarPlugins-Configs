# ==========================================================================
#  StarBedWars - cosmeticos/comemoracoes.yml - comemoracoes de vitoria
#
#  Tocadas para a equipe vencedora no fim da partida. O campo "Tipo" define
#  o show: FOGOS, RAIOS, CHUVA_DE_LAS, EXPLOSOES, REBANHO, DRAGAO,
#  BIGORNAS, BOLOS, CHUVA_DE_DIAMANTES, TORNADO, METEOROS, ARCO_IRIS, FENIX,
#  GALINHAS e DRAGAO_MONTADO (o vencedor
#  monta um Dragao do Fim e voa pela arena, com fogos roxos em volta).
#  "Titulo" e "Subtitulo" (opcionais) trocam o titulo de vitoria de quem
#  usa a comemoracao.
#  Nao remova "fogos": e a de quem nao escolheu nenhuma.
#  Permissao para ter todas: starbedwars.comemoracao.*
#
#  "Coins" e a moeda interna (ganha jogando). "Cash" e o dinheiro do
#  servidor: com "Cash.Tipo: STARECONOMIA" no config.yml, o valor sai da
#  moeda do StarEconomia -- da para vender qualquer cosmetico nela.
#  "Ativar: false" tira o cosmetico da loja sem apagar a linha dele.
#  "Desde: N" marca a versao do arquivo em que o cosmetico chegou: e o que
#  faz um cosmetico novo entrar UMA vez em quem ja tinha o arquivo. Pode
#  apagar o cosmetico que quiser -- o que voce apagou nao volta.
# ==========================================================================

