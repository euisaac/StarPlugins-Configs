# ==========================================================================
#  StarBedWars - cosmeticos/montarias.yml - montarias do spawn
#
#  Ao escolher, o jogador ja aparece montado (e volta a montar quando entra
#  no lobby). Descer (agachar) faz a montaria sumir: escolha de novo para
#  montar. Ninguem mais sobe nela e ela nao toma dano.
#  "Entidade": HORSE, DONKEY, MULE, SKELETON_HORSE, ZOMBIE_HORSE (na 1.8 a
#  1.10 viram variantes do cavalo), PIG. So os cavalos sao dirigiveis.
#  "Cor" (cavalo): WHITE, CREAMY, CHESTNUT, BROWN, BLACK, GRAY, DARK_BROWN.
#  "Estilo": NONE, WHITE, WHITEFIELD, WHITE_DOTS, BLACK_DOTS.
#  "Armadura": IRON_HORSE_ARMOR, GOLDEN_HORSE_ARMOR, DIAMOND_HORSE_ARMOR.
#  "Velocidade" (padrao do cavalo ~0.22) e "Pulo" (0 a 2).
#  Permissoes: starbedwars.montaria.<chave> / starbedwars.montaria.*
# ==========================================================================

