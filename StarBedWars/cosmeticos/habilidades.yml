# ==========================================================================
#  StarBedWars - cosmeticos/habilidades.yml - habilidades
#
#  Vantagens passivas escolhidas antes da partida (uma por modo). O que a
#  habilidade FAZ vem do campo "Tipo"; o resto e visual e preco.
#
#  Tipos e o campo "Valor" de cada nivel:
#    HEADSHOT        - flechada na cabeca da dano extra (Valor = multiplicador)
#    ARMADURA        - comeca com a melhoria "Armadura reforcada" (Valor = nivel)
#    RESSARCIMENTO   - ao morrer, devolve parte dos recursos (Valor = % de 0 a 100)
#    VAMPIRISMO      - cura ao matar (Valor = coracoes)
#    RENASCER_RAPIDO - renasce mais rapido (Valor = segundos a menos)
#    BLOCOS          - cada vida comeca com la (Valor = quantidade)
#    PES_DE_GATO     - dano de queda reduzido (Valor = % reduzida)
#    MERCADOR        - desconto na loja da partida (Valor = % de desconto, so
#                      em itens pagos com ferro ou ouro)
#
#  Habilidades.<modo> ou Habilidades.todos, como nos kits.
#  Permissao para ter todas: starbedwars.habilidade.*
# ==========================================================================

