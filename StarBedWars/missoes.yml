# ==========================================================================
#  StarBedWars - missoes
#
#  Cada missao conta um tipo de estatistica a partir do momento em que o
#  jogador comeca a jogar (o progresso e proprio da missao, nao o total).
#  Modo: TODOS ou solo, dupla, trio, quarteto, ranqueado.
#  Tipos: VITORIAS, ABATES, ELIMINACOES, CAMAS, PARTIDAS, EQUIPES_ELIMINADAS,
#         ASSISTENCIAS, MORTES, PRIMEIRO_SANGUE.
#  Recompensas: "coins : n", "xp : n", "caixa : <caixa> : n",
#               "booster : <modelo>", "comando : <comando com {jogador}>".
#  "Recompensas texto" e o que aparece na lore.
# ==========================================================================

