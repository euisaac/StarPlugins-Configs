# ------------------------------------------------------------------
#  StarTemplos - mensagens
#
#  Deixe uma mensagem vazia ('') para ela nao ser enviada.
#  Mensagens com secao aceitam ate quatro partes: Chat, Titulo (use <nl>
#  para o subtitulo), Actionbar e Som.
#
#  Valem em quase todas as mensagens de templo: {nome} {raridade} {tipo}
#  {id} {mundo} {coordenadas} {pressagio}
# ------------------------------------------------------------------

Versao do modelo: 1

Prefixo: '&8[&6Templos&8] &7'

Sem-permissao: '&cVocê não tem permissão para isso.'
So-jogador: '&cSó jogadores podem usar este comando.'
Coordenadas-ocultas: '&8(local secreto)'
Sem-pressagio: '&8nenhum'
Sem-previsao: '&8sem previsão'

Fases:
  SURGINDO: '&eSurgindo'
  ADORMECIDO: '&bAdormecido'
  RITUAL: '&dRitual'
  HORDAS: '&cHordas'
  CHEFE: '&4&lChefe'
  CONCLUIDO: '&aVencido'
  DESMORONANDO: '&8Desmoronando'
  ENCERRADO: '&8Encerrado'

Ativacao:
