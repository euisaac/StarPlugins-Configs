    - '{nome}'
    - '{raridade} &8| &7{pressagio}'
    - '{ativacao}'
    - '&8Some em {tempo}'
  RITUAL:
    - '{nome}'
    - '&dRitual em andamento'
    - '{progresso}'
  HORDAS:
    - '{nome}'
    - '{progresso}'
  CHEFE:
    - '{nome}'
    - '{progresso}'
  CONCLUIDO:
    - '{nome}'
    - '&a&lVENCIDO'
    - '&7Abra o baú do templo para pegar o seu saque'
    - '&8Desmorona em {tempo}'
  Progresso-ritual: '&fEtapa {etapa}/{total}: {descricao} &7({progresso}) &8- {tempo}'
  Progresso-hordas: '&cOnda {onda}/{total} &8- &f{restantes} &7inimigo(s)'
  Progresso-chefe: '&4Chefe: &c{vida}%'

Templo:
  Surgiu:
    Chat:
      - ''
      - '&6&l ✦ UM TEMPLO EMERGIU! ✦'
      - '&7 {nome} &8(&r{raridade}&8)'
      - '&7 Mundo: &f{mundo} &8| &7Local: &f{coordenadas}'
      - '&7 Use &e/templos &7para rastrear.'
      - ''
    Titulo: '{nome}<nl>&7emergiu em &f{coordenadas}'
  Pressagio: '&5Presságio do templo: {pressagio}'
  Ativado:
    Chat: '&e{jogador} &7despertou o {nome}&7!'
    Titulo: '&c&lO TEMPLO DESPERTOU<nl>&7prepare-se'
  Despertando: '&bO templo desperta em &f{tempo}s&b... fiquem perto do altar!'
  Ainda-surgindo: '&eO templo ainda está surgindo...'
  Precisa-item: '&cEste altar só desperta com {itens}&c. Segure a relíquia e clique no altar.'
  Precisa-proximidade: '&7Este templo desperta sozinho com &f{jogadores} &7aventureiro(s) a até &f{raio} &7blocos do altar.'
  Modo-de-jogo: '&cSó é possível despertar o templo no modo sobrevivência ou aventura.'
  Altar-RITUAL: '&dO ritual está em andamento.'
  Altar-HORDAS: '&cAs hordas guardam o templo!'
  Altar-CHEFE: '&4O guardião do templo está desperto!'
  Altar-CONCLUIDO: '&aO templo foi vencido. O saque está no baú.'
  Quase-expirando: '&eO {nome} &evai se desfazer em &f{tempo}&e!'
  Expirou: '&7O {nome} &7voltou para debaixo da terra...'
  Fim-do-saque: '&7O {nome} &7está desmoronando.'
  Removido: '&7O {nome} &7foi desfeito pela staff.'
  Evacuado: '&eVocê foi levado para fora antes do templo desmoronar.'
  Concluido:
    Chat:
      - ''
      - '&a&l ✦ TEMPLO VENCIDO! ✦'
      - '&7 {nome} &7foi conquistado em &f{tempo}&7.'
      - '&6 1º &f{top1}  &e2º &f{top2}  &c3º &f{top3}'
      - '&7 Recompensados: &f{participantes}'
      - ''

Ritual:
  Etapa:
    Chat: '&dRitual &7- etapa &f{etapa}/{total}&7: {descricao}&7. {instrucao}'
    Titulo: '&d{descricao}<nl>&7{instrucao}'
  Etapa-concluida: '&aEtapa concluída: {descricao}&a!'
  Concluido:
    Chat: '&d&lO ritual foi completado! &7O templo reage...'
    Titulo: '&d&lRITUAL COMPLETO<nl>&7defendam o templo'
  Falhou-reiniciar: '&cO ritual falhou! Tudo precisa ser feito de novo.'
  Falhou-encerrar: '&cO ritual falhou e o templo afundou na terra!'
  Falhou-maldicao:
    Chat: '&4O ritual falhou! &cO templo está &4AMALDIÇOADO&c: inimigos mais fortes, saque maior.'
    Titulo: '&4&lAMALDIÇOADO<nl>&cinimigos mais fortes'
  Nome:
    OFERENDA: '&6Oferenda'
    PILARES: '&ePilares'
    CANALIZAR: '&bCanalização'
    SEQUENCIA: '&dSequência das runas'
    ALMAS: '&5Colheita de almas'
  Instrucao:
    OFERENDA: 'Clique no altar com os itens pedidos no inventário.'
    PILARES: 'Clique no topo dos pilares que soltam faíscas.'
    CANALIZAR: 'Fiquem no círculo em volta do altar.'
    SEQUENCIA: 'Observe as runas e repita a ordem clicando nelas.'
    ALMAS: 'Abata as almas que surgem em volta do altar.'
  Oferenda-entregue: '&aVocê ofereceu &f{itens}&a. &7({progresso})'
  Oferenda-falta: '&cO altar ainda pede: &f{itens}'
  Pilar-aceso: '&e{jogador} &7acendeu um pilar &8({progresso})'
  Pilar-errado: '&c{jogador} acendeu o pilar errado! Os pilares se apagaram.'
  Canalizando: '&bCanalizando... &f{progresso}'
  Perturbacao: '&cCriaturas vêm interromper o ritual!'
  Sequencia-sua-vez: '&dAgora vocês! Repitam a ordem das runas.'
  Sequencia-espere: '&7Observe as runas primeiro...'
  Sequencia-certo: '&a✔ &f{progresso}'
  Sequencia-errou: '&c{jogador} errou a sequência! &7Tentativas restantes: &f{restam}'
  Sequencia-falhou: '&4{jogador} errou demais. A sequência se perdeu!'

Hordas:
