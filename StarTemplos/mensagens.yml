  Barra-escudo: ' &b[ESCUDO]'
  Recuando: '&7{chefe} &7recua para o centro do templo!'
  Resetou: '&7{chefe} &7voltou ao centro e recuperou as forças.'
  Golpe-de-fora: '&cVocê precisa estar dentro da arena para ferir {chefe}&c!'
  Escudo-ativo: '&b{chefe} &bestá protegido por um escudo!'
  Escudo: '&b{chefe} &bergueu um escudo!'
  Escudo-lacaios: '&b{chefe} &bergueu um escudo! &7Derrotem os guardiões para quebrá-lo.'
  Escudo-caiu: '&e{chefe} &eperdeu o escudo!'
  Furia:
    Chat: '&4{chefe} &4entrou em FÚRIA!'
    Titulo: '&4&lFÚRIA<nl>{chefe}'
  Invocou: '&c{chefe} &cconvocou &f{quantos} &clacaio(s)!'
  Meteoros: '&6{chefe} &6faz o céu cair! Saiam das marcas de fogo!'
  Curou: '&a{chefe} &arecuperou parte da vida.'
  Atras-de-voce: '&4{chefe} &4está atrás de você!'
  Derrotado:
    Chat: '&a{chefe} &afoi derrotado! &7Golpe final: &f{jogador}'
    Titulo: '&a&lVITÓRIA<nl>&7{chefe} &7caiu'

