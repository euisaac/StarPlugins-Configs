    preview:
      Material: 'GOLD_INGOT'
      Nome: '&e1.000 Coins'
      Quantidade: 1
      Lore: [ '&aRecompensa garantida!' ]
      Encantamentos: []
    coletar:
      Material: 'GOLD_INGOT'
      Nome: '&e1.000 Coins'
      Quantidade: 1
      Lore:
        - '&aRecompensa garantida!'
        - ''
        - ' &7> &fQuantidade: &7{quantia_bruta}'
        - ' &7> &fTotal: &7{quantia} coins'
        - ''
        - '&eClique esquerdo para receber'
        - '&eClique direito para deletar'
      Encantamentos: []
    comando:
      Dar: true
      Quantia: 1000
      Multiplicar: true
      Lista:
