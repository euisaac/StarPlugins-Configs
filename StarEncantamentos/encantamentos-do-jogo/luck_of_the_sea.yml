# ---------------------------------------------------------------------------
#  Sorte do Mar - encantamento do proprio jogo
#
#  Este arquivo NAO cria nem muda o efeito do encantamento: quem cuida disso e
#  o Minecraft. Ele diz como o StarEncantamentos TRATA esse encantamento --
#  o nome que aparece, a descricao, quanto ele vale na recicladora e a chance
#  de voltar em livro numa extracao.
#
#  O nome do arquivo e a chave do encantamento no jogo. Apagar o arquivo nao
#  tira o encantamento do Minecraft: ele so volta a usar a secao "Padrao" do
#  encantamentos.yml.
# ---------------------------------------------------------------------------

Nome: '&#9CD2E3Sorte do Mar'
Descricao:
  - 'Mais sorte no que voce pesca.'

# Quanto ele vale no nivel 1; o nivel multiplica (veja o config.yml).
Xp: 80
Essencia: 2
Chance de extracao: 65.0

# 0 usa o teto do proprio jogo. Um numero aqui vira o teto daqui.
Nivel maximo: 0
# false tira o encantamento de tudo: extrair, aplicar, reciclar e fundir.
Permitido: true
