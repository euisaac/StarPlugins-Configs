  Recurso desligado: '&cEste recurso esta desligado neste servidor.'
  Carregando: '&cSeus dados ainda estao carregando. Tente de novo em instantes.'
  Inventario cheio: '&cSeu inventario esta cheio.'
  Mundo bloqueado: '&cVoce nao pode usar isso neste mundo.'
  So jogador: '&cEste comando so funciona no jogo.'
  Numero invalido: '&c{valor} nao e um numero valido.'
  Jogador offline: '&cO jogador &f{jogador} &cnao esta online.'
