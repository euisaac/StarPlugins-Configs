  Cheio: '&cEste item ja tem encantamentos demais.'
  Sucesso: '&aEncantamento aplicado: &f{encantamentos}'
  Falha: '&cO livro nao pegou e se perdeu.'
  Falha quebrou: '&cO livro nao pegou e o item se quebrou.'
  Falha limpou: '&cO livro nao pegou e levou os encantamentos do item junto.'

Reciclagem:
  Vazio: '&cPonha livros encantados na area de cima primeiro.'
  Sucesso: '&aReciclou &f{livros} &alivro(s): &f+{xp} &axp e &f+{essencia} &aessencia.'

