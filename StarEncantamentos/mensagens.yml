  Invalido: '&cPonha dois livros do mesmo encantamento e mesmo nivel.'
  Sem xp: '&cA fusao custa &f{xp} &cde xp.'
  Sem essencia: '&cA fusao custa &f{essencia} &cde essencia.'
  Sucesso: '&aOs livros se juntaram num nivel acima!'
  Falha: '&cA fusao falhou, mas os livros voltaram.'
  Falha perdeu: '&cA fusao falhou e os dois livros se perderam.'

Loja:
  Indisponivel: '&cEste item nao esta disponivel.'
  Sem xp: '&cVoce nao tem xp suficiente.'
  Sem essencia: '&cVoce nao tem essencia suficiente.'
  Sem dinheiro: '&cVoce nao tem dinheiro suficiente.'
  Comprado: '&aCompra feita!'

Essencia:
  Saldo: '&7Voce tem &d{essencia} &7de essencia.'
  Recebida: '&aVoce recebeu &d{essencia} &ade essencia.'

Admin:
  Recarregado: '&aConfiguracoes recarregadas.'
  Entregue: '&aEntregue para &f{jogador}&a: &f{item}'
  Runa desconhecida: '&cNao existe a runa &f{runa}&c.'
