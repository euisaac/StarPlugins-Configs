  Uso dar: '&cUse: &f/senc dar runa|livro|frasco|essencia <jogador> ...'
  Uso tirar: '&cUse: &f/senc tirar <jogador> <quantidade de essencia>'
  Uso ver: '&cUse: &f/senc ver <jogador>'
  Uso historico: '&cUse: &f/senc historico <jogador> [pagina]'
  Historico vazio: '&7Sem registros para &f{jogador}&7.'
  Historico cabecalho: '&8&m---&r &dHistorico de {jogador} &7(pagina {pagina}) &8&m---'
  Historico linha: '&8[&7{quando} atras&8] &f{acao} &7{detalhe}'
  Info: |
    &8&m-------------------------------------
    &d&lStarEncantamentos &7v{versao}
    &7Banco: &f{banco}
    &7Runas: &f{runas} &7| Raridades: &f{raridades}
    &7Itens na loja: &f{loja}
    &7Encantamentos no servidor: &f{encantamentos}
    &7Perfis carregados: &f{perfis}
    &8&m-------------------------------------
  Perfil: |
    &8&m-------------------------------------
    &d&lPerfil de {jogador}
    &7Essencia: &f{essencia}
    &7Xp guardado: &f{guardado}
    &7Runas usadas: &f{runas_usadas}
    &7Livros reciclados: &f{reciclados}
    &7Encantamentos extraidos: &f{extraidos}
    &8&m-------------------------------------

Ajuda:
  Jogador: |
    &8&m-------------------------------------
    &d&lStarEncantamentos
    &f/{comando} &7abre o menu
    &f/{comando} reciclar &7troca livros por xp e essencia
    &f/{comando} sacar <niveis|tudo> &7saca xp em frascos
    &f/{comando} banco &7guarda e saca xp
    &f/{comando} loja &7compra livros, runas e frascos
    &f/{comando} fusao &7junta dois livros iguais
    &f/{comando} runas &7ve o que cada runa faz
    &f/{comando} testar &7lista todos os encantamentos do servidor
    &7Dica: arraste um livro ou uma runa sobre o item.
    &8&m-------------------------------------
  Admin: |
    &8&m-------------------------------------
    &d&lStarEncantamentos &7(admin)
    &f/{comando} recarregar
    &f/{comando} dar runa <jogador> <runa> [qtd]
    &f/{comando} dar livro <jogador> <encantamento> <nivel> [raridade] [qtd]
    &f/{comando} dar frasco <jogador> <xp> [qtd]
    &f/{comando} dar essencia <jogador> <qtd>
    &f/{comando} tirar <jogador> <qtd>
    &f/{comando} ver <jogador>
    &f/{comando} historico <jogador> [pagina]
    &f/{comando} info
    &8&m-------------------------------------
