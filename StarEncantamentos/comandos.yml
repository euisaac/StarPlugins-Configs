# ---------------------------------------------------------------------------
#  StarEncantamentos - nomes de comando
#
#  Os comandos base ja vem do plugin.yml. Aqui voce cria nomes ALEM daqueles,
#  separados por | (o primeiro vira o comando, os outros viram aliases).
#  Deixe em branco para nao criar nenhum.
#
#  Nos subcomandos, cada chave a esquerda e fixa (o codigo usa ela) e a lista a
#  direita e o que o jogador digita. Apagar a linha desliga o subcomando -- e
#  assim que voce deixa um recurso so pelo menu.
# ---------------------------------------------------------------------------
Versao do modelo: 4

comandos:
  encantamentos: ''
  starencantamentos: ''

subcomandos:
  reciclar: 'reciclar|reciclagem'
  sacar: 'sacar|frascos|frasco'
  banco: 'banco|poupanca'
  loja: 'loja|comprar'
  fusao: 'fusao|fundir'
  runas: 'runas|runa'
  testar: 'testar|catalogo|lista'
  descricao: 'descricao|descricoes|desc'
  essencia: 'essencia|essencias'
  ajuda: 'ajuda|help|?'

subcomandos admin:
  recarregar: 'recarregar|reload'
  dar: 'dar|give'
  encantar: 'encantar|enc'
  tirar: 'tirar|remover'
  ver: 'ver|perfil'
  historico: 'historico|log'
  info: 'info|status'
