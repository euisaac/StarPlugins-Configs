# ---------------------------------------------------------------------------
#  StarEncantamentos - configuracao geral
#
#  Os arquivos de conteudo ficam separados:
#    runas.yml           as runas e as variacoes delas
#    encantamentos.yml   nome, valor e chance dos encantamentos do jogo
#    encantamentos/          um arquivo por encantamento PROPRIO do plugin
#    encantamentos-do-jogo/  nome e descricao dos encantamentos do Minecraft
#    livros.yml          as raridades dos livros
#    loja.yml            o que a loja do menu vende
#    menus.yml           titulos, slots e itens das telas
#    mensagens.yml       tudo que o jogador le
#    comandos.yml        os nomes dos comandos e subcomandos
# ---------------------------------------------------------------------------
Versao do modelo: 9

Geral:
  Debug: false
  Particulas: true

  # Nada do plugin funciona nestes mundos.
  Mundos bloqueados: []

  # Itens que nao podem receber runa nem livro (ex.: ELYTRA, NETHERITE_SWORD).
  Itens bloqueados: []

  # Encantamentos fora de tudo: nao sao extraidos, aplicados nem reciclados.
  Encantamentos bloqueados: []

Banco de dados:
  # SQLITE ou MYSQL. O SQLite guarda em dados/starencantamentos.db.
  Tipo: SQLITE
  Prefixo das tabelas: starencantamentos_
  # Segundos entre as gravacoes do que mudou.
  Salvar a cada: 60
  MySQL:
    Host: localhost
    Porta: 3306
    Banco: minecraft
    Usuario: root
    Senha: ''

Runas:
  # Pegar a runa no inventario e soltar em cima do item aplica ela.
  # Desligado, as runas so funcionam pelo que voce criar em cima da API.
  Aplicar arrastando: true
  # Se a runa tambem vale em livro encantado (extrair de um livro, por exemplo).
  Funcionar em livro: true

Livros:
  # Pegar o livro e soltar em cima da ferramenta aplica o encantamento,
  # sem bigorna e sem custo de niveis. Desligado, o inventario volta a se
  # comportar como no jogo normal.
  Aplicar arrastando: true

  # Se o livro do PROPRIO JOGO (drop, pescaria, mesa de encantamento) tambem
  # pode ser arrastado. Desligado, so os livros do plugin funcionam assim.
  Aplicar livros do jogo: true

  # O livro do jogo ganha raridade e castigo sorteados no momento em que o
  # jogador o pega no inventario -- e por isso o risco ja aparece escrito nele,
  # antes de alguem arriscar uma ferramenta.
  # Desligado, esse livro cai na raridade padrao do livros.yml.
  Sortear raridade dos livros do jogo: true

  # Onde a identificacao do livro do jogo acontece. Com "Sempre que o livro
  # for movido" ligado, todo livro que passa pela mao de alguem acaba com o
  # sistema do plugin -- inclusive os que ja estavam em bau.
  Identificar:
    Ao pegar no inventario: true
    Na mesa de encantamento: true
    Ao pegar do chao: true
    Sempre que o livro for movido: true
    # Livro que ja chega com NOME ou LORE proprios quase sempre e item de outro
    # plugin (ou foi renomeado na bigorna). Ligado, ele tambem seria reescrito
    # com a aparencia daqui -- o que estraga o item e pode quebrar o plugin que
    # o reconhece pelo nome. Desligado, ele fica como esta e vale a raridade
    # padrao do livros.yml.
    Livros com nome proprio: false
    # Livro cujo encantamento o plugin NAO sabe nomear -- tipicamente de outro
    # plugin de encantamentos (EcoEnchants e afins). Ligado, o nome sairia na
    # chave crua ("Lunge" no lugar de "Estocada") e ficaria duplicado com a
    # linha que o outro plugin escreve na lore.
    # Para trazer um encantamento de fora para ca, batize ele no
    # encantamentos.yml: dali em diante ele e conhecido e entra sozinho.
    Encantamentos desconhecidos: false

  # Regras conferidas na hora de aplicar. Desligue para servidores que querem
  # Fortuna em espada e Afiacao acima do teto pela via normal.
  Respeitar nivel maximo: true
  Respeitar conflitos: true
  Respeitar item compativel: true

  # Teto de encantamentos diferentes por item; 0 tira o limite.
  Maximo de encantamentos por item: 0

Display:
  # ATENCAO, leia antes de ligar.
  #
  # Ligado, o plugin assume o desenho de TODAS as linhas de encantamento do
  # item: as dele e as do proprio Minecraft. Para isso ele esconde as linhas
  # que o jogo desenha e escreve todas de novo, com a cor de cada nome e a
  # descricao embaixo. E o unico jeito de um encantamento do jogo ganhar
  # descricao -- aquelas linhas nao sao lore, sao desenhadas pelo cliente.
  #
  # Se voce ja usa outro plugin que faz isso (EcoEnchants e parecidos),
  # DESLIGUE o display dele antes: os dois brigando pela mesma lore da
  # linha repetida e nome trocado.
  Ativar: true

  # Os encantamentos proprios aparecem antes dos do jogo.
  Proprios primeiro: true

  # A linha de cada encantamento. O nome ja traz a cor dele (hex ou
  # gradiente), entao aqui so o nivel e pintado.
  Formato: '{nome} &7{nivel_romano}'

  # A descricao entra logo abaixo de cada encantamento. Vale para os proprios
  # e para os do jogo (pasta encantamentos-do-jogo/).
  # O jogador ainda pode desligar so para ele com /encantamentos descricao --
  # mas ninguem liga o que voce desligar aqui.
  Mostrar descricao: true
  # Degrade do cinza escuro para o cinza claro. Em servidor 1.8 a 1.15, onde
  # hex nao existe, ele cai sozinho nas cores classicas mais parecidas.
  Formato da descricao: '  <g:4B5563:9CA3AF>{linha}'

Bigorna:
  # Tira da bigorna o que o plugin faz: juntar dois livros e por livro em item.
  # Sem isto os dois caminhos convivem e o do jogo ganha -- ninguem arrisca um
  # livro raro quando a bigorna faz o mesmo por alguns niveis.
  # Renomear e consertar continuam funcionando: so o segundo slot com livro
  # encantado e recusado.
  Bloquear livros: true
  # Avisa o jogador (uma vez a cada 3 segundos) quando a bigorna recusa.
  Avisar: true

Fusao:
  # Dois livros iguais viram um de nivel acima.
  Ativar: true
  Chance de sucesso: 70.0
  # Na falha, a chance de os dois livros irem embora. O custo abaixo e sempre
  # cobrado, dando certo ou nao.
  Chance de perder os livros na falha: 50.0
  # Ate onde a fusao sobe. O teto de cada encantamento no encantamentos.yml
  # tambem vale -- manda o menor dos dois.
  Nivel maximo: 5
  Custo em xp: 300
  Custo em essencia: 0

Frascos:
  Ativar: true
  Material: EXPERIENCE_BOTTLE
  Nome: '&aFrasco de XP &7({xp_curto})'
  Lore:
    - '&7Guarda &f{xp} &7de experiencia.'
    - ''
    - '&eClique com a direita &7para usar.'
    - '&eShift + direita &7usa a pilha inteira.'
  # Teto de xp por frasco; 0 poe tudo num frasco so.
  Maximo por frasco: 0
  # Menos que isto nao vale um frasco.
  Minimo para sacar: 1

Banco de xp:
  Ativar: true
  # Teto de xp guardado por jogador; 0 tira o limite.
  Limite: 0

Reciclagem:
  Ativar: true

  # Alem dos livros, a recicladora aceita ferramenta, armadura e arma
  # encantadas -- ela paga pelos encantamentos que o item carrega.
  Aceitar itens encantados: true

  # O que acontece com o item (nao vale para livro):
  #   false  ele some junto, como o livro
  #   true   ele volta LIMPO para o jogador, e a recicladora vira um
  #          desencantador que paga
  Devolver o item limpo: false
  # Quanto cada nivel acima do primeiro rende a mais.
  # 1.0 deixa linear (Afiacao V vale 5 vezes a I); 1.2 faz o nivel alto valer
  # progressivamente mais, o que empurra o jogador para a fusao.
  Multiplicador por nivel: 1.0

Loja:
  Ativar: true

Essencia:
  # A moeda que sai da reciclagem e so serve na loja do menu.
  Nome: '&dEssencia'
  Simbolo: '&d✦'

Economia:
  # VAULT fala com qualquer economia registrada no Vault.
  # COMANDO serve para as economias que nao se registram: o saldo e lido pelo
  # placeholder e a cobranca sai por comando de console.
  Tipo: VAULT
  Simbolo: '$'
  Placeholder de saldo: '%vault_eco_balance%'
  Comando de retirar: 'eco take {jogador} {valor}'

Registro:
  # Guarda no banco o que cada jogador fez (runa usada, livro aplicado,
  # reciclagem, compra). Lido com /starencantamentos historico <jogador>.
  Ativar: true
  Guardar por dias: 30

Sons:
  # Formato: SOM, SOM;volume ou SOM;volume;tom. Vazio nao toca nada.
  Clique: 'UI_BUTTON_CLICK;1;1'
  Erro: 'ENTITY_VILLAGER_NO;1;1'
  Sucesso: 'ENTITY_PLAYER_LEVELUP;1;1.4'
  Falha: 'BLOCK_ANVIL_LAND;1;0.6'
  Quebra: 'ENTITY_ITEM_BREAK;1;1'
  Pagina: 'ITEM_BOOK_PAGE_TURN;1;1'
