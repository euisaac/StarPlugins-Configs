# ---------------------------------------------------------------------------
#  StarEncantamentos - livros
#
#  A raridade decide a chance de o livro pegar quando o jogador o arrasta sobre
#  um item, e o que acontece quando ele nao pega. O bloco "Falha:" e o mesmo
#  das runas.
#
#  MODOS: dentro de uma mesma raridade, cada livro sai com UM castigo sorteado.
#  E o que faz dois livros raros nao serem iguais na mao do jogador:
#    Ambos       pode quebrar o item OU limpar os encantamentos
#    So quebrar  so corre o risco de quebrar
#    So limpar   so corre o risco de limpar
#  Os numeros sao pesos, nao porcentagens. Peso 0 tira aquele castigo do
#  sorteio. Se a raridade so tem um dos dois riscos preenchido, e sempre ele
#  que sai -- ninguem recebe um livro prometendo um risco que ele nao corre.
#
#  Livro do PROPRIO JOGO (drop, pescaria, mesa de encantamento) e identificado
#  quando o jogador o pega: sorteia raridade pelos "Peso" e castigo pelos
#  "Modos", e a partir dali o risco esta escrito nele. Para desligar isso, veja
#  "Sortear raridade dos livros do jogo" no config.yml -- desligado, esse livro
#  cai na "Raridade padrao" abaixo.
#
#  Cor: alem do &a classico, os nomes aceitam hex (&#FF5555) e gradiente
#  (<g:FF5555:FFAA00>Texto). Em servidor de 1.8 a 1.15, onde hex nao existe, a
#  cor cai sozinha na classica mais parecida -- entao da para usar sem medo.
#
#  Chaves da aparencia: {encantamento} {chave} {nivel} {nivel_romano} {raridade}
#  {sucesso} {quebrar} {limpar} {xp} {essencia}
#  A linha {risco} some e da lugar as linhas do castigo daquele livro, e a
#  {descricao} da lugar ao que o encantamento proprio faz (nos do jogo ela
#  simplesmente some).
# ---------------------------------------------------------------------------
Versao do modelo: 6

Raridade padrao: comum

Livro:
  Material: ENCHANTED_BOOK
  Nome: '{raridade} {encantamento} {nivel_romano}'
  Lore:
    - '{descricao}'
    - ''
    - '&7Chance de aplicar: &a{sucesso}%'
    - '&7Se falhar:'
    - '{risco}'
    - ''
    - '&7Vale &f{xp} &7de xp na reciclagem.'
    - ''
    - '&eArraste sobre um item para aplicar.'

  # Livro com MAIS DE UM encantamento (o que sai da bigorna). O nome vira um so
  # e os encantamentos viram a lista de {encantamentos}; o xp e a soma de todos.
  Nome multiplo: '{raridade} &fLivro Encantado &7({quantidade})'
  Linha do encantamento: '&7{encantamento} {nivel_romano}'
  Lore multiplo:
    - '{encantamentos}'
    - ''
    - '&7Chance de aplicar: &a{sucesso}%'
    - '&7Se falhar:'
    - '{risco}'
    - ''
    - '&7Vale &f{xp} &7de xp na reciclagem.'
    - ''
    - '&eArraste sobre um item para aplicar.'

  # As linhas que entram no lugar de {risco}, conforme o castigo do livro.
  Risco:
    Quebrar: '  &c{quebrar}% &7de quebrar o item'
    Limpar: '  &e{limpar}% &7de limpar o item'
    Nenhum: '  &anada acontece'

Raridades:

  comum:
    Nome: '<g:9CA3AF:E5E7EB>[Comum]'
    Chance de sucesso: 100.0
    # Peso no sorteio da raridade (livro do jogo, loja, recompensa).
    Peso: 60
    Falha:
      Consumir runa: true
      Quebrar item:
        Chance: 0.0
      Limpar encantamentos:
        Chance: 0.0

  raro:
    Nome: '<g:2563EB:7DD3FC>[Raro]'
    Chance de sucesso: 80.0
    Peso: 30
    Falha:
      Consumir runa: true
      Quebrar item:
        Chance: 8.0
      Limpar encantamentos:
        Chance: 15.0
      # O raro quase nunca sai com os dois riscos juntos.
      Modos:
        Ambos: 1
        So quebrar: 2
        So limpar: 4

  epico:
    Nome: '<g:9333EA:F0ABFC>[Epico]'
    Chance de sucesso: 65.0
    Peso: 8
    Falha:
      Consumir runa: true
      Quebrar item:
        Chance: 10.0
      Limpar encantamentos:
        Chance: 25.0
      Modos:
        Ambos: 2
        So quebrar: 3
        So limpar: 3

  lendario:
    Nome: '<g:D97706:FDE047>[Lendario]'
    Chance de sucesso: 50.0
    Peso: 2
    Falha:
      Consumir runa: true
      Quebrar item:
        Chance: 25.0
      Limpar encantamentos:
        Chance: 40.0
      # No lendario o risco duplo e comum: e o preco de um livro desses.
      Modos:
        Ambos: 4
        So quebrar: 3
        So limpar: 3
