# ---------------------------------------------------------------------------
#  StarEncantamentos - telas
#
#  Slot: -1 esconde o botao. E assim que voce tira a loja ou o banco do menu
#  sem precisar de uma opcao "Ativar" para cada um.
#
#  Chaves que valem em qualquer tela: {jogador} {xp} {xp_curto} {niveis}
#  {essencia} {essencia_curto} {guardado} {limite_banco} {runas_usadas}
#  {reciclados} {extraidos} {saldo} {moeda} {simbolo_essencia}
# ---------------------------------------------------------------------------
Versao do modelo: 3

Principal:
  Titulo: '&8Encantamentos'
  Linhas: 5
  Enfeite:
    Ativar: true
    Material: GRAY_STAINED_GLASS_PANE
    Nome: ' '

  Reciclar:
    Slot: 10
    Material: HOPPER
    Nome: '&a&lReciclar encantamentos'
    Lore:
      - '&7Jogue livros encantados e receba'
      - '&7xp e essencia por eles.'
      - ''
      - '&7Ja reciclou: &f{reciclados} &7livros'
      - ''
      - '&eClique para abrir.'

  Frascos:
    Slot: 12
    Material: EXPERIENCE_BOTTLE
    Nome: '&a&lSacar xp em frascos'
    Lore:
      - '&7Guarde seu xp em frascos e leve'
      - '&7para onde quiser.'
      - ''
      - '&7Seu xp: &f{xp} &7({niveis} niveis)'
      - ''
      - '&eClique para abrir.'

  Banco:
    Slot: 14
    Material: ENDER_CHEST
    Nome: '&a&lBanco de xp'
    Lore:
      - '&7Guarde xp na conta e saque quando'
      - '&7precisar. Nao se perde na morte.'
      - ''
      - '&7Guardado: &f{guardado}'
      - '&7Limite: &f{limite_banco}'
      - ''
      - '&eClique para abrir.'

  Loja:
    Slot: 16
    Material: EMERALD
    Nome: '&a&lLoja de encantamentos'
    Lore:
      - '&7Compre livros, runas e frascos.'
      - ''
      - '&7Sua essencia: &d{essencia}'
      - ''
      - '&eClique para abrir.'

  Fusao:
    Slot: 29
    Material: ANVIL
    Nome: '&a&lFundir livros'
    Lore:
      - '&7Dois livros iguais viram um'
      - '&7de nivel acima.'
      - ''
      - '&eClique para abrir.'

  Runas:
    Slot: 31
    Material: PAPER
    Nome: '&a&lRunas'
    Lore:
      - '&7Veja o que cada runa faz antes'
      - '&7de gastar a sua.'
      - ''
      - '&7Runas usadas: &f{runas_usadas}'
      - ''
      - '&eClique para abrir.'

  Catalogo:
    Slot: 33
    Material: KNOWLEDGE_BOOK
    Nome: '&a&lTodos os encantamentos'
    Lore:
      - '&7Tudo que existe no servidor: o do jogo'
      - '&7e o proprio do plugin.'
      - ''
      - '&7Ponha um item na tela para ver'
      - '&7so o que cabe nele.'
      - ''
      - '&eClique para abrir.'

  Perfil:
