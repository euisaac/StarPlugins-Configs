# ---------------------------------------------------------------------------
#  StarEncantamentos - o catalogo
#
#  Nome em portugues, quanto o encantamento vale ao ser reciclado e com que
#  chance ele volta em livro numa extracao.
#
#  Nao precisa listar todos: o que nao estiver aqui usa a secao "Padrao". E
#  assim que encantamento de outro plugin entra sozinho, sem quebrar nada.
#
#  Xp / Essencia         valor do NIVEL 1. O nivel multiplica (veja
#                        "Multiplicador por nivel" no config.yml).
#  Chance de extracao    chance de voltar em livro nas runas que nao definem
#                        uma chance propria.
#  Nivel maximo          teto deste encantamento aqui dentro; 0 usa o do jogo.
#                        A runa suprema fura este teto de proposito.
#  Permitido             false tira o encantamento de tudo (extrair, aplicar,
#                        reciclar, fundir).
# ---------------------------------------------------------------------------
