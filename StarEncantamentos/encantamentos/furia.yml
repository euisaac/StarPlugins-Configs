# ---------------------------------------------------------------------------
#  Furia - encantamento proprio do StarEncantamentos
#
#  Copie este arquivo, troque o nome e os numeros: e um encantamento novo no
#  servidor, com livro proprio, valor de reciclagem proprio e lugar na loja.
#  Quem manda no comportamento e a chave Efeito.Tipo, nunca o nome do arquivo.
#
#  Alvos aceitos: ESPADA MACHADO PICARETA PA ENXADA FERRAMENTA ARCO BESTA
#                 TRIDENTE VARA CAPACETE PEITORAL CALCA BOTA ARMADURA ELITRO
#                 ESCUDO TODOS
#
#  Apagar este arquivo tira o encantamento do jogo, e ele nao volta sozinho.
# ---------------------------------------------------------------------------

Nome: '<g:FF3B3B:FF9B6A>Furia'
Descricao:
  - 'Cada golpe machuca mais.'
Nivel maximo: 5
# A faixa do livro que sai deste encantamento (vem do livros.yml).
Raridade: raro
Alvos: [ ESPADA, MACHADO ]
Conflitos: []
Permitido: true

# Quanto ele vale no nivel 1; o nivel multiplica (veja o config.yml).
Xp: 160
Essencia: 4
Chance de extracao: 55.0

Efeito:
  Tipo: DANO_EXTRA
  Valor: 1.5
  Valor por nivel: 1.0
  Chance: 100.0
